<style>

  @keyframes blossomPop{0%{opacity:0;transform:scale(0)}55%{transform:scale(1.32)}100%{opacity:1;transform:scale(1)}}
  @keyframes bannerSlideIn{from{opacity:0;transform:translateY(-14px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes bannerFadeOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(0.92)}}
  @keyframes shimmy{0%,100%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.07) rotate(-3deg)}75%{transform:scale(1.07) rotate(3deg)}}

  @keyframes whatsNewUp{from{opacity:0;transform:translateY(110%)}to{opacity:1;transform:translateY(0)}}
  @keyframes wsFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes cardRise{from{opacity:0;transform:translateY(18px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes tabPop{0%{transform:scale(1)}40%{transform:scale(0.82)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(0.7)}}
  @keyframes pinShake{0%,100%{transform:translateX(0)}15%,55%{transform:translateX(-9px)}35%,75%{transform:translateX(9px)}}
  html, body { margin: 0; background: #000; -webkit-text-size-adjust: 100%; }
  * { -webkit-tap-highlight-color: transparent; }
  input, textarea { font-size: 16px; }
  input, textarea, select { box-sizing: border-box; max-width: 100%; }
  input[type="time"], input[type="date"] { -webkit-appearance: none; appearance: none; }
  input[type="date"] { -webkit-appearance: none; }

  /* ── Apple Liquid Glass — enhanced ── */
  .glass {
    position: relative;
    backdrop-filter: blur(40px) saturate(2.2) brightness(1.07);
    -webkit-backdrop-filter: blur(40px) saturate(2.2) brightness(1.07);
    box-shadow:
      rgba(255,255,255,0.38) 0px 1px 0px inset,
      rgba(255,255,255,0.13) 0px -1px 0px inset,
      rgba(255,255,255,0.11) 1px 0px 0px inset,
      rgba(255,255,255,0.11) -1px 0px 0px inset,
      rgba(255,255,255,0.07) 0px 0px 0px 0.5px inset,
      rgba(0,0,0,0.74) 0px 24px 56px -20px,
      rgba(0,0,0,0.32) 0px 8px 22px -4px,
      rgba(0,0,0,0.14) 0px 2px 6px 0px;
  }
  .glass::before {
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(148deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.09) 26%, rgba(255,255,255,0.02) 56%, rgba(0,0,0,0.05) 100%);
  }
  .glass::after {
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(112deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
    background-size:300% 100%; background-position:200% 0;
  }
  .limits .glass {
    backdrop-filter: blur(48px) saturate(2.4) brightness(1.08);
    -webkit-backdrop-filter: blur(48px) saturate(2.4) brightness(1.08);
    box-shadow:
      rgba(255,255,255,0.36) 0px 1px 0px inset,
      rgba(255,255,255,0.08) 0px 0px 32px inset,
      rgba(0,0,0,0.9) 0px 24px 60px -20px;
  }
  .limits .glass::after {
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,0.28) 50%, transparent 62%);
    background-size: 280% 100%;
    background-position: 210% 0;
    animation: sheen 5.5s linear infinite;
  }

  /* ── Apple Liquid Glass SVG refraction (Chromium) ── */
  @supports (backdrop-filter: url(#lg-filter)) {
    .glass {
      backdrop-filter: blur(10px) saturate(190%) brightness(1.07) url(#lg-filter);
      -webkit-backdrop-filter: blur(10px) saturate(190%) brightness(1.07) url(#lg-filter);
    }
    .limits .glass {
      backdrop-filter: blur(18px) saturate(240%) brightness(1.10) url(#lg-filter);
      -webkit-backdrop-filter: blur(18px) saturate(240%) brightness(1.10) url(#lg-filter);
    }
  }

  /* ── iOS 18 floating pill tab bar ── */
  .tab-bar {
    position: fixed;
    left: 6px;
    right: 6px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    z-index: 60;
    display: flex;
    align-items: center;
    height: 60px;
    border-radius: 100px;
    backdrop-filter: blur(56px) saturate(2.3) brightness(1.07);
    -webkit-backdrop-filter: blur(56px) saturate(2.3) brightness(1.07);
    background: rgba(9,9,11,0.52);
    box-shadow:
      rgba(255,255,255,0.28) 0px 1px 0px inset,
      rgba(255,255,255,0.09) 0px 0px 0px 0.5px inset,
      rgba(0,0,0,0.62) 0 12px 40px -6px,
      rgba(0,0,0,0.35) 0 4px 14px -4px;
    overflow: hidden;
  }
  /* Liquid glass gradient shimmer */
  .tab-bar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.06) 30%, transparent 55%);
    z-index: 0;
  }
  /* Refraction sweep highlight */
  .tab-bar::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(108deg, transparent 36%, rgba(255,255,255,0.1) 50%, transparent 64%);
    background-size: 260% 100%;
    background-position: 200% 0;
    z-index: 0;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 6px;
    gap: 2px;
    cursor: pointer;
    border: none;
    background: transparent;
    transition: opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    height: 100%;
    position: relative;
    z-index: 1;
  }
  .tab-item:active { opacity: 0.5; }
  .tab-icon {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), color 0.18s ease;
    position: relative;
    border-radius: 8px;
  }
  .tab-item.active .tab-icon { transform: scale(1.12); }
  .tab-label {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: color 0.18s ease;
    line-height: 1;
  }
  .tab-badge {
    position: absolute;
    top: -3px; right: -6px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #FF453A;
    border: 1.5px solid rgba(14,14,16,0.9);
    animation: dotPulse 2s ease-in-out infinite;
  }

  /* ── Press feedback ── */
  .press {
    transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1), opacity 0.1s ease;
    cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .press:active { transform: scale(0.95); opacity: 0.8; }

  /* ── Card stagger rise ── */
  .card-0 { animation: cardRise 0.42s cubic-bezier(0.22,1,0.36,1) 0.06s both; }
  .card-1 { animation: cardRise 0.42s cubic-bezier(0.22,1,0.36,1) 0.12s both; }
  .card-2 { animation: cardRise 0.42s cubic-bezier(0.22,1,0.36,1) 0.18s both; }
  .card-3 { animation: cardRise 0.42s cubic-bezier(0.22,1,0.36,1) 0.24s both; }
  .card-4 { animation: cardRise 0.42s cubic-bezier(0.22,1,0.36,1) 0.30s both; }
  .card-5 { animation: cardRise 0.42s cubic-bezier(0.22,1,0.36,1) 0.36s both; }
  .card-6 { animation: cardRise 0.42s cubic-bezier(0.22,1,0.36,1) 0.42s both; }

  /* ── Auto-stagger children of .rise containers ── */
  .rise > * { animation: cardRise 0.44s cubic-bezier(0.22,1,0.36,1) both; }
  .rise > *:nth-child(1) { animation-delay: 0.05s; }
  .rise > *:nth-child(2) { animation-delay: 0.11s; }
  .rise > *:nth-child(3) { animation-delay: 0.17s; }
  .rise > *:nth-child(4) { animation-delay: 0.23s; }
  .rise > *:nth-child(5) { animation-delay: 0.29s; }
  .rise > *:nth-child(6) { animation-delay: 0.35s; }
  .rise > *:nth-child(n+7) { animation-delay: 0.40s; }

  /* ── Today space-y-4 also staggers ── */
  .space-y-4 > * { animation: cardRise 0.44s cubic-bezier(0.22,1,0.36,1) both; }
  .space-y-4 > *:nth-child(1) { animation-delay: 0.04s; }
  .space-y-4 > *:nth-child(2) { animation-delay: 0.10s; }
  .space-y-4 > *:nth-child(3) { animation-delay: 0.16s; }
  .space-y-4 > *:nth-child(4) { animation-delay: 0.22s; }
  .space-y-4 > *:nth-child(5) { animation-delay: 0.28s; }
  .space-y-4 > *:nth-child(n+6) { animation-delay: 0.33s; }

  /* ── Vivid animated ambient orbs ── */
  @keyframes blobA {
    0%,100%{transform:translate(0,0) scale(1);}
    33%{transform:translate(65px,-80px) scale(1.18);}
    66%{transform:translate(-45px,55px) scale(0.88);}
  }
  @keyframes blobB {
    0%,100%{transform:translate(0,0) scale(1);}
    25%{transform:translate(-85px,65px) scale(1.12);}
    75%{transform:translate(50px,-45px) scale(0.93);}
  }
  @keyframes blobC {
    0%,100%{transform:translate(0,0) scale(1);}
    40%{transform:translate(75px,40px) scale(1.20);}
    80%{transform:translate(-35px,-60px) scale(0.84);}
  }
  @keyframes blobD {
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-60px,-50px) scale(1.14);}
  }
  .bg-blob {
    position: fixed; border-radius: 50%;
    filter: blur(90px); opacity: 0.55;
    will-change: transform; pointer-events: none; z-index: 0;
  }

  /* ── Input/field base ── */
  .field-base {
    font-size: 15px;
    color: #fff;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 14px;
    outline: none;
    width: 100%;
    box-sizing: border-box;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .field-base:focus {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.22);
  }

  /* ── Ripple ring (existing) ── */
  .ripple-ring {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    border: 2px solid currentColor;
    animation: rippleOut 0.7s ease-out forwards;
    z-index: 54;
  }
  @keyframes rippleOut {
    0% { opacity: 0.7; transform: scale(0.2); }
    100% { opacity: 0; transform: scale(3.5); }
  }

  /* ── Page transitions (no more side-step) ── */
  @keyframes pageEnter {
    0%{opacity:0;transform:translateY(10px);}
    100%{opacity:1;transform:translateY(0);}
  }
  .page-enter       { animation: pageEnter    0.34s cubic-bezier(0.22,1,0.36,1) both; }
  .page-slide-right { animation: slideInRight 0.36s cubic-bezier(0.25,1,0.5,1) both; }
  .page-slide-left  { animation: slideInLeft  0.36s cubic-bezier(0.25,1,0.5,1) both; }
  @keyframes slideInRight { from{transform:translateX(100vw);opacity:.5} to{transform:translateX(0);opacity:1} }
  @keyframes slideInLeft  { from{transform:translateX(-100vw);opacity:.5} to{transform:translateX(0);opacity:1} }

  /* ── Standard keyframes ── */
  @keyframes bcpulse {
    0%,100%{opacity:1;} 50%{opacity:0.45;}
  }
  @keyframes bcrise {
    0%{opacity:0;transform:translateY(6px) scale(0.96);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  @keyframes sheen {
    0%{background-position:210% 0;}
    100%{background-position:-70% 0;}
  }
  @keyframes ptrspin {
    0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);}
  }
  @keyframes bcPop {
    0%{opacity:0;transform:scale(0.94);}
    100%{opacity:1;transform:scale(1);}
  }
  @keyframes bcSpin {
    0%{transform:rotateY(0);opacity:0.5;}
    100%{transform:rotateY(1080deg);opacity:1;}
  }

</style>
</head>
<body>
<!-- Apple Liquid Glass SVG displacement filter (real refraction in Chromium) -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="lg-filter" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.009" numOctaves="3" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="1.5" result="blurred"/>
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="48" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feComposite in="displaced" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

/* Luminance-based contrast: returns "#fff" or "#000" for best readability */
function contrastFor(hex) {
  const h = hex.replace("#","");
  const r = parseInt(h.slice(0,2),16)/255;
  const g = parseInt(h.slice(2,4),16)/255;
  const b = parseInt(h.slice(4,6),16)/255;
  const L = 0.2126*(r<=0.03928?r/12.92:((r+0.055)/1.055)**2.4)
           +0.7152*(g<=0.03928?g/12.92:((g+0.055)/1.055)**2.4)
           +0.0722*(b<=0.03928?b/12.92:((b+0.055)/1.055)**2.4);
  return L > 0.35 ? "rgba(0,0,0,0.88)" : "#ffffff";
}
