<title>Hotdog Flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Chivo+Mono:wght@400;700&display=swap">
<style>
/* Layout: one full-bleed canvas of a floating scene, a round action button bottom right, start card and "flip another" button as overlays. Single dark look, by choice. */
:root {
  --void: #d6c09a;
  --iron: #1d232b;
  --mustard: #f2c230;
  --ketchup: #d8342b;
  --ash: #e9e1d6;
  --display: "Rammetto One", "Arial Black", Impact, sans-serif;
  --mono: "Chivo Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--void); color: var(--ash); font-family: var(--mono); overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#stage { position: relative; height: 100%; }
canvas { display: block; width: 100%; height: 100%; }
.btn {
  font-family: var(--display); color: #fff; cursor: pointer; border: 3px solid #2a0d08;
  background: linear-gradient(180deg, #ef5a44 0%, #d8342b 55%, #b32419 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.18), 0 6px 0 #6e140c, 0 10px 18px rgba(60,20,10,.35);
  transition: transform .07s ease-out, box-shadow .07s ease-out, filter .2s;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { filter: brightness(1.06); }
.btn.down, .btn:active {
  transform: translateY(5px);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -1px 0 rgba(0,0,0,.18), 0 1px 0 #6e140c, 0 3px 6px rgba(60,20,10,.35);
}
.btn.up { animation: springUp .32s cubic-bezier(.3,1.8,.5,1); }
@keyframes springUp { 0% { transform: translateY(5px) scale(1); } 45% { transform: translateY(-3px) scale(1.04); } 100% { transform: translateY(0) scale(1); } }
.btn:focus-visible { outline: 3px solid var(--mustard); outline-offset: 4px; }
#actBtn {
  position: absolute; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  width: 128px; height: 128px; border-radius: 50%; overflow: hidden; font-size: 15px; line-height: 1.05;
  touch-action: none; display: grid; place-items: center; padding: 0 10px;
}
#actBtn .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(180deg, #ffd85a, #e9a915); transition: height .05s linear; }
#actBtn .lbl { position: relative; pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.45); }
#actBtn:disabled { filter: saturate(.35) brightness(.8); cursor: default; }
#againBtn {
  position: absolute; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font-size: 18px; padding: 13px 24px; border-radius: 14px; z-index: 1;
}
#againBtn.down, #againBtn:active { transform: translateX(-50%) translateY(5px); }
#againBtn.up { animation: none; }
@media (prefers-reduced-motion: reduce) { .btn.up { animation: none; } }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(5, 7, 10, .7); padding: 16px; z-index: 2;
}
.card {
  max-width: 400px; width: 100%; background: var(--iron); border: 3px solid #000;
  box-shadow: 6px 6px 0 #000; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px;
}
.card h1 {
  font-family: var(--display); font-size: clamp(30px, 8vw, 44px); line-height: .95; margin: 0;
  color: var(--mustard); text-shadow: 3px 3px 0 var(--ketchup);
}
.card .small { font-size: 11px; color: #b9ad9c; }
.card p { margin: 0; line-height: 1.55; font-size: 13px; }
.card .btn { font-size: 18px; padding: 13px 18px; border-radius: 14px; }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <button class="btn" id="actBtn" aria-label="Drop or flip the sausage" disabled><span class="fill"></span><span class="lbl" id="actLbl">HOLD TO<br>WIND UP</span></button>
  <button class="btn" id="againBtn" hidden>Flip another</button>
  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>Hotdog Flip</h1>
      <p>Chopsticks bring in a sausage. Tap to drop it in the pan. Hold to pull the pan back, let go to flip it onto whatever is floating nearby. Flip as many times as it takes.</p>
      <p>A solid landing wins on the spot. If it lands on an edge, it has to hang on for 5 seconds.</p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), mainCtx = cv.getContext('2d');
  let ctx = mainCtx;
  const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
  const shad = document.createElement('canvas'), sctx = shad.getContext('2d');
  const stage = document.getElementById('stage');
  const actBtn = document.getElementById('actBtn'), actLbl = document.getElementById('actLbl'), fill = actBtn.querySelector('.fill');
  const againBtn = document.getElementById('againBtn');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };

  // ---------- world ----------
  const WW = 1000, WH = 600, G = 1900;
  const PX = 270, PY = 440;               // pan cooking-surface centre
  const N = 9, SEG = 15, R = 14;          // sausage: 9 particles, 120px long, 28px thick
  const SUB = 1 / 240, REST = .02, MU = 1.1, SQUISH = .93;
  let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0, bgCache = null;

  function resize() {
    const r = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 3); W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    layer.width = cv.width; layer.height = cv.height;
    shad.width = Math.max(1, Math.round(cv.width / 5)); shad.height = Math.max(1, Math.round(cv.height / 5));
    S = Math.min(W / WW, H / WH); OX = (W - WW * S) / 2; OY = (H - WH * S) / 2;
    buildBackground();
  }
  new ResizeObserver(resize).observe(stage);
  const worldT = c => c.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  // camera: leans in during the hold test, shakes on the big win
  function camT(c) {
    worldT(c);
    if (shake > 0 && !reduce) c.translate(Math.sin(time * 61) * 9 * shake, Math.cos(time * 47) * 7 * shake);
    if (zoom > 1.001) { c.translate(zc.x, zc.y); c.scale(zoom, zoom); c.translate(-zc.x, -zc.y); }
  }
  const ext = () => ({ x0: -OX / S - 40, x1: (W - OX) / S + 40, y0: -OY / S - 40, y1: (H - OY) / S + 40 });

  // ---------- audio ----------
  let ac = null;
  function initAudio() {
    if (ac) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; return; }
    master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
    sizzleGain = ac.createGain(); sizzleGain.gain.value = 0; sizzleGain.connect(master);
    startSizzle(); loadSfx();
  }
  function blip(freq, dur, type = 'sine', vol = .08, slide = 0) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(master || ac.destination); o.start(t); o.stop(t + dur);
  }
  // ---- sound effects: recorded files shipped next to the page, with synthesized stand-ins until they load ----
  // CC0 recordings (Kenney, BenjaminNelan, artisticdude, bart, craigsmith); provenance in sfx/SOURCES.md
  const SFX_FILES = { sizzle: 'sfx/sizzle.mp3', land_soft: 'sfx/land_soft.mp3', land_hard: 'sfx/land_hard.mp3', pan_hit: 'sfx/pan_hit.mp3', whoosh: 'sfx/whoosh.mp3', click_down: 'sfx/click_down.mp3', click_up: 'sfx/click_up.mp3', chopstick: 'sfx/chopstick.mp3', heartbeat: 'sfx/heartbeat.mp3', cheer: 'sfx/cheer.mp3' };
  const sfxBuf = {}, lastPlay = {};
  let master = null, sizzleGain = null, sizzleSrc = null, cheerSrc = null;
  function noiseBuffer(sec) {
    const len = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < .002 ? 3 : .35);
    return b;
  }
  function startSizzle() {
    if (!ac) return;
    if (sizzleSrc) { try { sizzleSrc.stop(); } catch {} }
    const src = ac.createBufferSource(); src.loop = true;
    if (sfxBuf.sizzle) { src.buffer = sfxBuf.sizzle; src.connect(sizzleGain); }
    else { src.buffer = noiseBuffer(2); const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500; src.connect(f).connect(sizzleGain); }
    src.start(); sizzleSrc = src;
  }
  function setSizzle(level) { if (sizzleGain) sizzleGain.gain.setTargetAtTime(level * (sfxBuf.sizzle ? .55 : .05), ac.currentTime, .12); }
  function loadSfx() {
    for (const [name, url] of Object.entries(SFX_FILES)) {
      fetch(url).then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status))
        .then(b => new Promise((ok, no) => ac.decodeAudioData(b, ok, no)))
        .then(buf => { sfxBuf[name] = buf; if (name === 'sizzle') startSizzle(); })
        .catch(() => {});
    }
  }
  const FALLBACK = {
    whoosh: (v, r) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime; s.buffer = noiseBuffer(.35); f.type = 'bandpass'; f.frequency.setValueAtTime(400 * r, t); f.frequency.exponentialRampToValueAtTime(2400 * r, t + .3); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5 * v, t + .08); g.gain.exponentialRampToValueAtTime(.001, t + .33); s.connect(f).connect(g).connect(master); s.start(); },
    land_soft: v => blip(95, .14, 'sine', .25 * v, -45),
    land_hard: v => blip(140, .1, 'triangle', .22 * v, -70),
    pan_hit: v => { blip(620, .25, 'triangle', .06 * v, -40); blip(1240, .18, 'sine', .03 * v); },
    chopstick: v => blip(1700, .04, 'triangle', .06 * v),
    click_down: v => blip(420, .035, 'square', .05 * v, -200),
    click_up: v => blip(760, .03, 'triangle', .04 * v),
    heartbeat: (v, r) => { blip(62, .12, 'sine', .35 * v, -20); setTimeout(() => blip(55, .14, 'sine', .25 * v, -20), 150 / r); },
    cheer: () => {},
  };
  function sfx(name, vol = 1, rate = 1) {
    if (!ac) return;
    const now = performance.now();
    if (now - (lastPlay[name] || 0) < 70) return; lastPlay[name] = now;
    const b = sfxBuf[name];
    if (!b) { FALLBACK[name] && FALLBACK[name](vol, rate); return; }
    const src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = b; src.playbackRate.value = rate * (.96 + Math.random() * .08); g.gain.value = vol;
    src.connect(g).connect(master); src.start();
    if (name === 'cheer') cheerSrc = { src, g };
  }
  let beatSrc = null;
  function beatLoop(rate) {
    if (!ac || !sfxBuf.heartbeat) return;
    if (!beatSrc) { const src = ac.createBufferSource(), g = ac.createGain(); src.buffer = sfxBuf.heartbeat; src.loop = true; g.gain.value = 1; src.connect(g).connect(master); src.start(); beatSrc = { src, g }; }
    beatSrc.src.playbackRate.value = rate;
  }
  function stopBeat() { if (!beatSrc) return; const b = beatSrc; beatSrc = null; b.g.gain.setTargetAtTime(0, ac.currentTime, .05); setTimeout(() => { try { b.src.stop(); } catch {} }, 400); }
  function stopCheer() { if (cheerSrc && ac) { cheerSrc.g.gain.setTargetAtTime(0, ac.currentTime, .2); const s0 = cheerSrc.src; setTimeout(() => { try { s0.stop(); } catch {} }, 900); cheerSrc = null; } }
  function impacts() {
    if (hits.pan > 1) { const v = Math.min(1, hits.pan / 5); sfx('pan_hit', .25 + v * .75, 1.1 - v * .2); sfx('land_soft', .3 + v * .5); buzz(Math.round(6 + v * 14)); }
    if (hits.target > 1) { const v = Math.min(1, hits.target / 5); sfx(v > .45 ? 'land_hard' : 'land_soft', .35 + v * .65); buzz(Math.round(8 + v * 16)); }
  }
  // haptics where the device and browser allow it (Android Chrome); silently nothing elsewhere
  function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch {} }

  // Beethoven, Symphony No. 9, "Ode to Joy" (public domain)
  const NOTE = { G2: 98, C3: 130.81, C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392 };
  const ODE = [['E4', 1], ['E4', 1], ['F4', 1], ['G4', 1], ['G4', 1], ['F4', 1], ['E4', 1], ['D4', 1],
               ['C4', 1], ['C4', 1], ['D4', 1], ['E4', 1], ['E4', 1.5], ['D4', .5], ['D4', 2],
               ['E4', 1], ['E4', 1], ['F4', 1], ['G4', 1], ['G4', 1], ['F4', 1], ['E4', 1], ['D4', 1],
               ['C4', 1], ['C4', 1], ['D4', 1], ['E4', 1], ['D4', 1.5], ['C4', .5], ['C4', 2]];
  const BASS = [['C3', 4], ['G2', 4], ['C3', 4], ['G2', 4], ['C3', 4], ['G2', 4], ['C3', 4], ['G2', 2], ['C3', 2]];
  const BEAT = .27;
  let odeBus = null;
  function stopOde() {
    if (!odeBus || !ac) return;
    const g = odeBus; g.gain.setTargetAtTime(0, ac.currentTime, .08); setTimeout(() => g.disconnect(), 600); odeBus = null;
  }
  function tone(bus, f, t, d, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02);
    g.gain.setValueAtTime(vol * .8, t + d * .7); g.gain.exponentialRampToValueAtTime(.0001, t + d * .98);
    o.connect(g).connect(bus); o.start(t); o.stop(t + d);
  }
  function playOde() {
    if (!ac) return;
    stopOde();
    const bus = ac.createGain(); bus.gain.value = .9; bus.connect(master); odeBus = bus;
    const t0 = ac.currentTime + .05;
    let t = t0;
    for (const [n, b] of ODE) { tone(bus, NOTE[n], t, b * BEAT, 'triangle', .16); tone(bus, NOTE[n] * 2, t, b * BEAT, 'sine', .035); t += b * BEAT; }
    t = t0;
    for (const [n, b] of BASS) { tone(bus, NOTE[n], t, b * BEAT, 'sine', .12); tone(bus, NOTE[n] * 1.5, t, b * BEAT, 'sine', .04); t += b * BEAT; }
  }

  // ---------- geometry ----------
  const wpt = (T, lx, ly) => ({ x: T.x + lx * Math.cos(T.a) - ly * Math.sin(T.a), y: T.y + lx * Math.sin(T.a) + ly * Math.cos(T.a) });
  const lpt = (T, x, y) => { const dx = x - T.x, dy = y - T.y, c = Math.cos(T.a), s = Math.sin(T.a); return { x: dx * c + dy * s, y: -dx * s + dy * c }; };
  function poly(pts) {
    // convex polygon in local space, with outward edge normals
    const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length, cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    const edges = pts.map((a, i) => {
      const b = pts[(i + 1) % pts.length];
      let nx = b[1] - a[1], ny = a[0] - b[0];
      const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      if ((a[0] - cx) * nx + (a[1] - cy) * ny < 0) { nx = -nx; ny = -ny; }
      return { ax: a[0], ay: a[1], nx, ny };
    });
    return edges;
  }
  const ngon = (cx, cy, r, n = 10) => Array.from({ length: n }, (_, i) => [cx + Math.cos(i / n * Math.PI * 2) * r, cy + Math.sin(i / n * Math.PI * 2) * r]);

  // ---------- bodies ----------
  const PAN_POLYS = [
    poly([[-72, 0], [72, 0], [66, 12], [-66, 12]]),
    poly([[-98, -20], [-89, -22], [-66, 2], [-74, 7]]),
    poly([[89, -22], [98, -20], [74, 7], [66, 2]]),
  ];
  let lift = { t0: -10, p: 0, d0: 0 }, dip = 0;
  function panT(t) {
    const u = (t - lift.t0) / .38;
    // pulling back: the pan slides toward its handle, sinks and rocks its front lip down with the charge
    const back = dip + (u >= 0 && u < 1 ? lift.d0 * Math.max(0, 1 - u * 3) : 0);
    let x = PX - back * 30, y = PY + Math.sin(t * 1.1) * 3 + back * 14, a = Math.sin(t * .8) * .012 + back * .17;
    if (u >= 0 && u < 1) { const k = Math.sin(Math.PI * u) * (.6 + lift.p * .4); y -= 40 * k; a -= .38 * k; }
    return { x, y, a };
  }
  const panCollides = t => !((t - lift.t0) >= 0 && (t - lift.t0) < .24);

  const KINDS = [
    { id: 'plate', name: 'the bun', hw: 52, h: 30 },
    { id: 'toaster', name: 'the toaster', hw: 44, h: 96 },
    { id: 'books', name: 'the cookbooks', hw: 38, h: 0 },
    { id: 'mug', name: 'the coffee mug', hw: 22, h: 66 },
    { id: 'cat', name: 'the sleeping cat', hw: 32, h: 72 },
    { id: 'skate', name: 'the skateboard', hw: 44, h: 26, drift: 60 },
    { id: 'duck', name: 'the rubber duck', hw: 15, h: 60 },
    { id: 'cone', name: 'the traffic cone', hw: 11, h: 116 },
    { id: 'balloon', name: 'the balloon', hw: 20, h: 80, bob: 14, sway: .06 },
    { id: 'fork', name: 'the fork', hw: 9, h: 124 },
  ];
  function polysFor(tg) {
    const hw = tg.hw, h = tg.h;
    switch (tg.k.id) {
      case 'plate': return [poly([[-hw, 8], [-hw + 12, 0], [hw - 12, 0], [hw, 8], [hw, h - 8], [-hw, h - 8]]), poly([[-hw - 26, h - 8], [hw + 26, h - 8], [hw + 20, h], [-hw - 20, h]])];
      case 'toaster': return [poly([[-hw, 12], [-hw + 12, 0], [hw - 12, 0], [hw, 12], [hw, h - 4], [-hw, h - 4]])];
      case 'books': return tg.books.map(b => poly([[b.x0, b.y], [b.x0 + b.w, b.y], [b.x0 + b.w, b.y + b.h], [b.x0, b.y + b.h]]));
      case 'mug': return [poly([[-hw, 0], [hw, 0], [hw, h], [-hw, h]])];
      case 'cat': return [poly([[-hw - 30, h], [-hw - 26, 30], [-hw - 10, 10], [0, 0], [hw + 10, 10], [hw + 28, 32], [hw + 32, h]]), poly(ngon(-hw - 26, h - 22, 21))];
      case 'skate': return [poly([[-hw - 16, -3], [hw + 16, -3], [hw + 12, 9], [-hw - 12, 9]]), poly([[-hw - 8, 9], [hw + 8, 9], [hw + 8, h], [-hw - 8, h]])];
      case 'duck': return [poly(ngon(0, hw + 2, hw + 4)), poly([[-24, h], [-26, h - 28], [10, h - 34], [44, h - 26], [44, h - 18], [20, h]])];
      case 'cone': return [poly([[-hw, 0], [hw, 0], [34, h - 8], [-34, h - 8]]), poly([[-44, h - 8], [44, h - 8], [44, h], [-44, h]])];
      case 'balloon': return [poly([[-hw, -4], [hw, -4], [hw, 1], [-hw, 1]]), poly(ngon(0, 38, 35, 12))];
      case 'fork': return [poly([[-hw, 0], [hw, 0], [hw, 44], [-hw, 44]]), poly([[-3, 44], [3, 44], [3, h - 26], [-3, h - 26]]), poly([[-9, h - 30], [9, h - 30], [9, h], [-9, h]])];
    }
  }
  function makeTarget(prev) {
    const pool = KINDS.filter(k => k !== prev);
    const k = pool[Math.floor(Math.random() * pool.length)];
    const seed = Math.floor(Math.random() * 1000);
    const tg = { k, hw: k.hw, h: k.h, seed, phase: Math.random() * 6.28, enter: 0, drift: k.drift || 0, bob: k.bob || 7, sway: k.sway || .03 };
    if (k.id === 'books') {
      const n = 2 + Math.floor(Math.random() * 5), bh = 26;
      tg.h = n * bh;
      tg.books = Array.from({ length: n }, (_, i) => {
        const top = i === n - 1, sx = top ? 0 : Math.sin(i * 7.3 + seed) * 6, w = top ? k.hw : k.hw + Math.abs(Math.sin(i * 3.1 + seed)) * 8;
        return { x0: -w + sx, w: w * 2, y: tg.h - (i + 1) * bh, h: bh - 1, ci: (i + seed) % 6 };
      });
    }
    tg.bx = 540 + Math.random() * (300 - tg.drift * 2);
    const yMin = 200, yMax = Math.min(400, 555 - tg.h);
    tg.by = yMin + Math.random() * Math.max(0, yMax - yMin);
    tg.polys = polysFor(tg);
    return tg;
  }
  const easeOut = u => 1 - Math.pow(1 - Math.min(1, u), 3);
  function targetT(tg, t) {
    return {
      x: tg.bx + Math.sin(t * .5 + tg.phase) * tg.drift + (1 - easeOut(tg.enter)) * 700,
      y: tg.by + Math.sin(t * 1.3 + tg.phase) * tg.bob,
      a: Math.sin(t * .9 + tg.phase) * tg.sway,
    };
  }

  // ---------- sausage (soft body) ----------
  let sau = null;
  function makeSausage(cx, cy) {
    const p = [];
    for (let i = 0; i < N; i++) { const x = cx + (i - (N - 1) / 2) * SEG; p.push({ x, y: cy, px: x, py: cy, touch: null }); }
    const marks = Array.from({ length: 30 }, () => [Math.random(), Math.random() * 2 - 1, Math.random()]);
    return { p, pinned: false, marks };
  }
  const PIN = [0, 1];

  function collideBody(q, polys, T, Tp, tag) {
    for (const ed of polys) {
      let best = -1e9, bn = null;
      for (const e of ed) {

    ctx.lineWidth = 10; ctx.strokeStyle = '#000'; ctx.strokeText(String(num), 0, 0); ctx.fillStyle = '#f2c230'; ctx.fillText(String(num), 0, 0);
    ctx.restore();
    ctx.textAlign = 'center'; ctx.font = '700 14px "Chivo Mono", monospace'; ctx.fillStyle = '#fff3dc';
    ctx.fillText('HANG ON... ' + num + (num === 1 ? ' SECOND' : ' SECONDS'), c.x, c.y + 122);
  }

  function draw(t) {
    mainCtx.setTransform(1, 0, 0, 1, 0, 0);
    if (bgCache) mainCtx.drawImage(bgCache, 0, 0); else { mainCtx.fillStyle = '#d6c09a'; mainCtx.fillRect(0, 0, cv.width, cv.height); }
    // 1. everything solid goes on its own layer
    ctx = lctx;
    lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, layer.width, layer.height);
    camT(lctx);
    const P = panT(simT);
    panBack(P);
    // sausage sits inside the pan when touching it, otherwise in front of everything
    const inPan = sau && sau.p.some(q => q.touch === 'pan');
    if (inPan) drawSausage(sau);
    panFront(P);
    drawTarget(target, simT);
    let g = null;
    if (chop.mode) { g = chopGeom(); stick(...g.back, 3.4, 9, false); }
    if (!inPan) drawSausage(sau);
    if (g) stick(...g.front, 3.6, 9.5, true);
    ctx = mainCtx;
    // 2. its silhouette, shrunk (which softens it) and dropped onto the cardboard behind, light from the upper left
    sctx.globalCompositeOperation = 'source-over'; sctx.clearRect(0, 0, shad.width, shad.height);
    sctx.drawImage(layer, 0, 0, shad.width, shad.height);
    sctx.globalCompositeOperation = 'source-in'; sctx.fillStyle = 'rgba(74,46,18,.34)'; sctx.fillRect(0, 0, shad.width, shad.height);
    mainCtx.imageSmoothingEnabled = true; mainCtx.imageSmoothingQuality = 'high';
    const so = 18 * S * DPR;
    mainCtx.drawImage(shad, so * .8, so * 1.1, cv.width, cv.height);
    mainCtx.drawImage(layer, 0, 0);
    camT(mainCtx);
    drawMotes(t);
    if (spot > 0) drawSpotlight(simT);
    if (phase === 'hold') drawHold(t);
    for (const f of confetti) {
      mainCtx.save(); mainCtx.translate(f.x, f.y); mainCtx.rotate(f.r); mainCtx.scale(1, Math.cos(f.r * 1.7));
      mainCtx.globalAlpha = Math.min(1, f.life); mainCtx.fillStyle = f.c; mainCtx.fillRect(-f.w / 2, -f.h / 2, f.w, f.h); mainCtx.restore();
    }
    mainCtx.globalAlpha = 1;
    worldT(mainCtx);
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.font = '24px serif';
    for (const n of notes) { ctx.globalAlpha = Math.min(1, n.life) * spot; ctx.fillStyle = '#f2c230'; ctx.fillText(n.g, n.x, n.y); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.font = '24px "Rammetto One", "Arial Black", sans-serif';
      ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = '#ff7a5c'; ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
    if (spot > 0) {
      ctx.globalAlpha = spot;
      const head = big ? 'IT HELD!' : 'IT LANDED', pop = big ? 1 + Math.max(0, .35 - phaseT) * 1.4 : 1;
      ctx.save(); ctx.translate(500, 84); ctx.scale(pop, pop);
      ctx.font = (big ? '58px' : '42px') + ' "Rammetto One", "Arial Black", sans-serif'; ctx.lineWidth = 9; ctx.strokeStyle = '#000';
      ctx.strokeText(head, 0, 0); ctx.fillStyle = '#f2c230'; ctx.fillText(head, 0, 0); ctx.restore();
      ctx.font = '700 13px "Chivo Mono", monospace'; ctx.fillStyle = '#f3ead9';
      ctx.fillText((big ? '5 seconds on ' + target.k.name + '. Unreal.  \u00B7  Beethoven, Ode to Joy' : 'On ' + target.k.name + '  \u00B7  Beethoven, Ode to Joy').toUpperCase(), 500, big ? 124 : 112);
      ctx.globalAlpha = 1;
    }
    if (state === 'play') {
      const hint = phase === 'hang' ? 'Tap anywhere to drop it in the pan' : phase === 'ready' ? 'Hold to pull back. Further back = bigger flip' : phase === 'charge' ? 'Let go to flip' : '';
      if (hint) {
        ctx.fillStyle = 'rgba(74,48,22,' + (.6 + .3 * Math.sin(t * 5)) + ')';
        ctx.font = '700 13px "Chivo Mono", monospace';
        if (phase === 'hang') ctx.fillText(hint, PX, HANG.y - 62);
        else ctx.fillText(hint, PX, PY + 70);
      }
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); draw(now / 1000);
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.overlay') || e.target === againBtn) return;
    e.preventDefault(); press();
  });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.code !== 'ArrowUp' && e.code !== 'Enter') return;
    e.preventDefault();
    if (e.repeat) return;
    if (!againBtn.hidden) { newRound(); return; }
    press();
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') release(); });
  againBtn.onclick = () => newRound();
  // tactile buttons: they sink on press with a click, spring back with a softer click and a tiny buzz
  function btnDown(b) { if (b.disabled || b.classList.contains('down')) return; initAudio(); b.classList.remove('up'); b.classList.add('down'); sfx('click_down', .8); buzz(8); }
  function btnUp() {
    document.querySelectorAll('.btn.down').forEach(b => { b.classList.remove('down'); b.classList.add('up'); sfx('click_up', .6); buzz(4); });
  }
  document.querySelectorAll('.btn').forEach(b => {
    b.addEventListener('pointerdown', () => btnDown(b));
    b.addEventListener('animationend', () => b.classList.remove('up'));
  });
  window.addEventListener('pointerup', btnUp);
  window.addEventListener('pointercancel', btnUp);
  window.addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') && !e.repeat) btnDown(againBtn.hidden ? actBtn : againBtn); });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') btnUp(); });
  document.getElementById('startBtn').onclick = () => {
    initAudio(); if (ac && ac.state === 'suspended') ac.resume();
    state = 'play'; document.getElementById('startScreen').hidden = true; newRound();
  };

  // backdrop behind the start card: a sausage dangling from chopsticks over the pan
  resize();
  target = makeTarget(null); target.k = KINDS[1]; target.hw = 44; target.h = 96; target.bx = 700; target.by = 300; target.enter = 1; target.polys = polysFor(target);
  newSausage(); chop.mode = 'hold';
  requestAnimationFrame(frame);
})();
</script>
