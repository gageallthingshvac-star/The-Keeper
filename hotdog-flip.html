<title>Hotdog Flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Chivo+Mono:wght@400;700&display=swap">
<style>
/* Layout: one full-bleed side-view kitchen canvas, hold-to-flip button bottom right, start card and "flip another" button as overlays. Single dark look, by choice. */
:root {
  --coal: #121a1b;
  --iron: #1f2a2b;
  --mustard: #f2c230;
  --ketchup: #d8342b;
  --ash: #e9e1d6;
  --display: "Rammetto One", "Arial Black", Impact, sans-serif;
  --mono: "Chivo Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--coal); color: var(--ash); font-family: var(--mono); overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#stage { position: relative; height: 100%; }
canvas { display: block; width: 100%; height: 100%; }
.btn {
  font-family: var(--display); color: #fff; background: var(--ketchup);
  border: 4px solid #000; box-shadow: 5px 5px 0 #000; cursor: pointer;
}
.btn:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }
#flipBtn {
  position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 112px; height: 112px; border-radius: 50%; overflow: hidden; font-size: 14px; line-height: 1.1;
  touch-action: none;
}
#flipBtn .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: var(--mustard); }
#flipBtn .lbl { position: relative; pointer-events: none; text-shadow: 2px 2px 0 #000; }
#flipBtn.held { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #000; }
#flipBtn:disabled { filter: grayscale(.7) brightness(.6); cursor: default; }
#againBtn {
  position: absolute; left: 50%; top: 30%; transform: translateX(-50%);
  font-size: 18px; padding: 12px 22px; z-index: 1;
}
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(6, 10, 10, .7); padding: 16px; z-index: 2;
}
.card {
  max-width: 400px; width: 100%; background: var(--iron); border: 3px solid #000;
  box-shadow: 6px 6px 0 #000; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px;
}
.card h1 {
  font-family: var(--display); font-size: clamp(30px, 8vw, 44px); line-height: .95; margin: 0;
  color: var(--mustard); text-shadow: 3px 3px 0 var(--ketchup);
}
.card p { margin: 0; line-height: 1.55; font-size: 13px; }
.card .btn { font-size: 18px; padding: 12px 18px; box-shadow: 4px 4px 0 #000; border-width: 3px; }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <button class="btn" id="flipBtn" aria-label="Hold to charge the pan, release to flip"><span class="fill"></span><span class="lbl">HOLD<br>TO FLIP</span></button>
  <button class="btn" id="againBtn" hidden>Flip another</button>
  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>Hotdog Flip</h1>
      <p>Hold the button (or Space) to charge the pan, release to flip. Land the sausage flat on top of whatever is on the counter. Flip as many times as it takes.</p>
      <button class="btn" id="startBtn">Fire up the pan</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const stage = document.getElementById('stage'), btn = document.getElementById('flipBtn'), fill = btn.querySelector('.fill');
  const againBtn = document.getElementById('againBtn');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };

  // ---------- world ----------
  const WW = 1000, WH = 600, COUNTER = 520, G = 1400, TOL = .5;
  const PAN_X = 200, PAN_Y = 452, DOG_L = 96, DOG_T = 24;
  let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0, bgCache = null;

  function resize() {
    const r = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 3); W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    S = Math.min(W / WW, H / WH); OX = (W - WW * S) / 2; OY = (H - WH * S) / 2;
    buildBackground();
  }
  new ResizeObserver(resize).observe(stage);
  const worldT = c => c.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  const ext = () => ({ x0: -OX / S - 40, x1: (W - OX) / S + 40, y0: -OY / S - 40, y1: (H - OY) / S + 40 });

  // ---------- audio ----------
  let ac = null;
  function initAudio() { if (ac) return; try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
  function blip(freq, dur, type = 'square', vol = .08, slide = 0) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  }
  // Beethoven, Symphony No. 9, "Ode to Joy" (public domain)
  const NOTE = { G2: 98, C3: 130.81, C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392 };
  const ODE = [['E4', 1], ['E4', 1], ['F4', 1], ['G4', 1], ['G4', 1], ['F4', 1], ['E4', 1], ['D4', 1],
               ['C4', 1], ['C4', 1], ['D4', 1], ['E4', 1], ['E4', 1.5], ['D4', .5], ['D4', 2],
               ['E4', 1], ['E4', 1], ['F4', 1], ['G4', 1], ['G4', 1], ['F4', 1], ['E4', 1], ['D4', 1],
               ['C4', 1], ['C4', 1], ['D4', 1], ['E4', 1], ['D4', 1.5], ['C4', .5], ['C4', 2]];
  const BASS = [['C3', 4], ['G2', 4], ['C3', 4], ['G2', 4], ['C3', 4], ['G2', 4], ['C3', 4], ['G2', 2], ['C3', 2]];
  const BEAT = .27;
  let odeBus = null;
  function stopOde() {
    if (!odeBus || !ac) return;
    const g = odeBus; g.gain.setTargetAtTime(0, ac.currentTime, .08); setTimeout(() => g.disconnect(), 600); odeBus = null;
  }
  function tone(bus, f, t, d, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02);
    g.gain.setValueAtTime(vol * .8, t + d * .7); g.gain.exponentialRampToValueAtTime(.0001, t + d * .98);
    o.connect(g).connect(bus); o.start(t); o.stop(t + d);
  }
  function playOde() {
    if (!ac) return;
    stopOde();
    const bus = ac.createGain(); bus.gain.value = .9; bus.connect(ac.destination); odeBus = bus;
    const t0 = ac.currentTime + .05;
    let t = t0;
    for (const [n, b] of ODE) { tone(bus, NOTE[n], t, b * BEAT, 'triangle', .16); tone(bus, NOTE[n] * 2, t, b * BEAT, 'sine', .035); t += b * BEAT; }
    t = t0;
    for (const [n, b] of BASS) { tone(bus, NOTE[n], t, b * BEAT, 'sine', .12); tone(bus, NOTE[n] * 1.5, t, b * BEAT, 'sine', .04); t += b * BEAT; }
  }

  // ---------- targets ----------
  const KINDS = [
    { id: 'plate', name: 'the bun', hw: 52, h: 30 },
    { id: 'toaster', name: 'the toaster', hw: 44, h: 96 },
    { id: 'books', name: 'the cookbooks', hw: 38, h: 0 },
    { id: 'mug', name: 'the coffee mug', hw: 22, h: 66 },
    { id: 'cat', name: 'the sleeping cat', hw: 32, h: 72, bob: 6 },
    { id: 'skate', name: 'the skateboard', hw: 44, h: 26, slide: 110 },
    { id: 'duck', name: 'the rubber duck', hw: 15, h: 60 },
    { id: 'cone', name: 'the traffic cone', hw: 11, h: 116 },
    { id: 'balloon', name: 'the balloon', hw: 20, h: 210, bob: 22, sway: 36 },
    { id: 'fork', name: 'the fork', hw: 9, h: 124 },
  ];
  function makeTarget(prev) {
    const pool = KINDS.filter(k => k !== prev);
    const k = pool[Math.floor(Math.random() * pool.length)];
    const t = { k, hw: k.hw, h: k.id === 'books' ? 70 + Math.random() * 130 : k.h,
      bx: 460 + Math.random() * 360, phase: Math.random() * 6.28, speed: .8 + Math.random() * .5,
      slide: k.slide || 0, bob: k.bob || 0, sway: k.sway || 0, enter: 0, seed: Math.floor(Math.random() * 1000) };
    if (t.slide) t.bx = Math.min(t.bx, 840 - t.slide);
    // a balloon close to the pan can only be reached on the way up, so keep it far
    if (k.id === 'balloon') t.bx = Math.max(t.bx, 680);
    return t;
  }
  const easeOut = u => 1 - Math.pow(1 - Math.min(1, u), 3);
  const enterOff = t => (1 - easeOut(t.enter)) * 650;
  function tpos(t, time) {
    const x = t.bx + Math.sin(time * t.speed + t.phase) * t.slide + Math.sin(time * .9 + t.phase) * t.sway;
    const top = COUNTER - t.h + Math.sin(time * 1.8 + t.phase) * t.bob;
    return { x: x + enterOff(t), top };
  }

  // ---------- state ----------
  let state = 'menu', phase = 'enter', phaseT = 0, time = 0;
  let charge = 0, power = 0, panLift = 0, panRot = 0, lastArc = [], arc = [];
  let dog = null, target = null, spot = 0, spotOn = false;
  const popups = [], crumbs = [], notes = [];
  const makePores = () => Array.from({ length: 40 }, () => [(Math.random() - .5) * DOG_L * .85, (Math.random() - .5) * DOG_T * .7, Math.random()]);

  function newDog() {
    dog = { x: -80, y: 260, vx: 0, vy: 0, a: -0.4, w: 0, mode: 'enter', t: 0, att: null, pores: makePores() };
    phase = 'enter'; phaseT = 0;
    blip(300, .15, 'triangle', .05, 200);
  }
  function newRound() {
    target = makeTarget(target && target.k);
    spotOn = false; stopOde(); notes.length = 0; popups.length = 0; lastArc = []; arc = [];
    againBtn.hidden = true; newDog();
  }

  const tri = u => { u %= 2; return u < 1 ? u : 2 - u; };
  function startCharge() {
    if (state !== 'play' || phase !== 'ready') return;
    initAudio(); phase = 'charge'; charge = 0; btn.classList.add('held');
  }
  function release() {
    btn.classList.remove('held');
    if (state === 'play' && phase === 'charge') launch(power);
  }
  function launch(p) {
    const vx = 180 + p * 380, vy = 480 + p * 620;
    dog.vx = vx; dog.vy = -vy; dog.w = Math.PI * G / (2 * vy);
    dog.mode = 'fly'; dog.a = 0; phase = 'flight'; phaseT = 0; panLift = 1; arc = [];
    blip(180, .12, 'square', .07, 500);
  }
  function popup(text, color) {
    const p = tpos(target, time);
    popups.push({ x: dog.x, y: Math.min(dog.y, p.top) - 40, text, color, life: 1.3 });
  }
  function miss(msg) { phase = 'miss'; phaseT = 0; lastArc = arc; popup(msg, '#ff7a5c'); }
  function celebrate() {
    dog.won = true; phase = 'won'; phaseT = 0; spotOn = true; playOde();
  }

  function update(dt) {
    time += dt; phaseT += dt;
    panLift = Math.max(0, panLift - dt * 4);
    for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.life -= dt; p.y -= 35 * dt; if (p.life <= 0) popups.splice(i, 1); }
    for (let i = crumbs.length - 1; i >= 0; i--) { const c = crumbs[i]; c.life -= dt; c.vy += G * .6 * dt; c.x += c.vx * dt; c.y += c.vy * dt; if (c.y > COUNTER) { c.y = COUNTER; c.vy *= -.3; c.vx *= .6; } if (c.life <= 0) crumbs.splice(i, 1); }
    for (let i = notes.length - 1; i >= 0; i--) { const n = notes[i]; n.life -= dt; n.y -= 50 * dt; n.x += n.vx * dt; if (n.life <= 0) notes.splice(i, 1); }
    if (target && target.enter < 1) target.enter += dt * 2;
    spot = spotOn ? Math.min(1, spot + dt * 3) : Math.max(0, spot - dt * 2.5);
    if (state !== 'play' || !dog) return;

    if (phase === 'charge') { charge += dt; power = tri(charge / .75); panRot = power * .22; }
    else panRot += (-panLift * .5 - panRot) * Math.min(1, dt * 18);
    fill.style.height = (phase === 'charge' ? power * 100 : 0) + '%';
    btn.disabled = !(phase === 'ready' || phase === 'charge');
    const panY = PAN_Y + (phase === 'charge' ? power * 10 : 0) - easeOut(panLift) * 26;
    const restY = panY - DOG_T / 2 - 4;

    if (dog.mode === 'enter') {
      dog.t += dt / .85;
      const u = Math.min(1, dog.t);
      dog.x = -80 + (PAN_X + 80) * u;
      dog.y = 230 + (restY - 230) * u - Math.sin(Math.PI * u) * 120;
      dog.a = (1 - u) * -2.6;
      if (u >= 1) { dog.mode = 'pan'; phase = 'ready'; blip(120, .08, 'sine', .12); }
    } else if (dog.mode === 'pan') {
      dog.x = PAN_X; dog.y = restY; dog.a = 0;
    } else if (dog.mode === 'fly' || dog.mode === 'tumble') {
      const py = dog.y;
      dog.vy += G * dt; dog.x += dog.vx * dt; dog.y += dog.vy * dt; dog.a += dog.w * dt;
      if (!arc.length || Math.hypot(dog.x - arc[arc.length - 1][0], dog.y - arc[arc.length - 1][1]) > 14) arc.push([dog.x, dog.y]);
      const tp = tpos(target, time), bottom = dog.y + DOG_T / 2, pBottom = py + DOG_T / 2;
      if (dog.mode === 'fly' && dog.vy > 0 && pBottom <= tp.top + 4 && bottom >= tp.top) {
        const off = dog.x - tp.x;
        if (Math.abs(off) <= target.hw + 10) {
          const a = ((dog.a % Math.PI) + Math.PI) % Math.PI, dev = Math.min(a, Math.PI - a);
          if (dev <= TOL) {
            dog.mode = 'stuck'; dog.settle = 0; dog.att = { off, a: dog.a - (a > Math.PI / 2 ? a - Math.PI : a) };
            phase = 'settle'; lastArc = arc; blip(240, .1, 'sine', .12);
          } else {
            dog.mode = 'tumble'; dog.vy = -Math.abs(dog.vy) * .35; dog.vx = (off >= 0 ? 1 : -1) * 120 + dog.vx * .3; dog.w = (Math.random() < .5 ? -1 : 1) * 9;
            popup('TOO TILTED', '#ff7a5c'); blip(220, .1, 'square', .07, -80);
          }
        }
      }
      if (bottom >= COUNTER && dog.vy > 0) {
        dog.mode = 'splat'; dog.y = COUNTER - DOG_T / 2; dog.a = Math.round(dog.a / Math.PI) * Math.PI;
        for (let i = 0; i < 16; i++) crumbs.push({ x: dog.x, y: COUNTER - 4, vx: (Math.random() - .5) * 300, vy: -Math.random() * 300, life: 1, c: Math.random() < .5 ? '#f2c230' : '#b8542b' });
        miss('SPLAT'); blip(110, .4, 'sawtooth', .1, -60);
      } else if (dog.x > WW + 120 || dog.x < -150) {
        dog.mode = 'gone'; miss('MISSED'); blip(140, .3, 'sawtooth', .08, -60);
      }
    } else if (dog.mode === 'stuck') {
      const tp = tpos(target, time);
      dog.x = tp.x + dog.att.off; dog.y = tp.top - DOG_T / 2;
      dog.a += (dog.att.a - dog.a) * Math.min(1, dt * 12);
      if (!dog.won) { dog.settle += dt; if (dog.settle > .45) celebrate(); }
    }

    if (phase === 'miss' && phaseT > 1.3) newDog();
    if (phase === 'won') {
      if (spot > .5 && Math.random() < dt * 6) {
        const tp = tpos(target, time);
        notes.push({ x: tp.x + (Math.random() - .5) * 90, y: tp.top - 14, vx: (Math.random() - .5) * 30, life: 1.8, g: Math.random() < .5 ? '♪' : '♫' });
      }
      if (phaseT > 2 && againBtn.hidden) againBtn.hidden = false;
    }
  }

  // ---------- drawing helpers ----------
  function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
  function lin(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
  function rad(c, x, y, r0, r1, stops) { const g = c.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
  function softShadow(x, y, rx, ry, a) {
    ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
    ctx.fillStyle = rad(ctx, 0, 0, 0, rx, [[0, `rgba(0,0,0,${a})`], [1, 'rgba(0,0,0,0)']]);
    ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }

  // static wall, counter and stove, cached at device resolution
  function buildBackground() {
    if (!W) return;
    bgCache = document.createElement('canvas'); bgCache.width = cv.width; bgCache.height = cv.height;
    const c = bgCache.getContext('2d');
    c.fillStyle = '#132726'; c.fillRect(0, 0, cv.width, cv.height);
    worldT(c);
    const { x0, x1, y0, y1 } = ext(), ts = 50;
    for (let y = Math.floor(y0 / ts) * ts; y < COUNTER; y += ts) for (let x = Math.floor(x0 / ts) * ts; x < x1; x += ts) {
      const n = Math.sin(x * 12.9 + y * 78.2) * .5 + .5;
      c.fillStyle = '#0d1b1b'; c.fillRect(x, y, ts, ts);
      c.fillStyle = lin(c, x, y, x + ts, y + ts, [[0, `rgb(${40 + n * 8},${76 + n * 8},${80 + n * 8})`], [1, `rgb(${24 + n * 6},${50 + n * 6},${54 + n * 6})`]]);
      rr(c, x + 2, y + 2, ts - 4, ts - 4, 3); c.fill();
      c.fillStyle = 'rgba(255,255,255,.10)'; c.fillRect(x + 4, y + 3, ts - 10, 1.5);
      c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x + 4, y + ts - 4, ts - 8, 1.5);
      c.fillStyle = lin(c, x, y, x + ts, y, [[0, 'rgba(255,255,255,0)'], [.3 + n * .3, 'rgba(255,255,255,.06)'], [1, 'rgba(255,255,255,0)']]);
      c.fillRect(x + 2, y + 2, ts - 4, ts - 4);
    }
    c.fillStyle = rad(c, 620, 140, 20, 560, [[0, 'rgba(255,218,160,.18)'], [1, 'rgba(255,218,160,0)']]);
    c.fillRect(x0, y0, x1 - x0, COUNTER - y0);
    c.fillStyle = lin(c, 0, COUNTER - 40, 0, COUNTER, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.35)']]);
    c.fillRect(x0, COUNTER - 40, x1 - x0, 40);
    // butcher-block counter
    c.fillStyle = lin(c, 0, COUNTER, 0, COUNTER + 16, [[0, '#a8794a'], [1, '#6e4a2a']]); c.fillRect(x0, COUNTER, x1 - x0, 16);
    c.fillStyle = lin(c, 0, COUNTER + 16, 0, y1, [[0, '#4a3220'], [1, '#2a1c12']]); c.fillRect(x0, COUNTER + 16, x1 - x0, y1 - COUNTER - 16);
    c.strokeStyle = 'rgba(40,24,12,.35)'; c.lineWidth = 1;
    for (let i = 0; i < 6; i++) { c.beginPath(); for (let x = x0; x < x1; x += 20) c.lineTo(x, COUNTER + 3 + i * 2.2 + Math.sin(x * .02 + i) * 1.2); c.stroke(); }
    for (let x = Math.floor(x0 / 70) * 70; x < x1; x += 70) { c.fillStyle = 'rgba(20,10,4,.35)'; c.fillRect(x, COUNTER + 16, 1.5, y1 - COUNTER); }
    c.fillStyle = 'rgba(255,240,220,.28)'; c.fillRect(x0, COUNTER, x1 - x0, 1.5);
    // stove
    c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(108, COUNTER - 2, 186, 4);
    c.fillStyle = lin(c, 0, 476, 0, 520, [[0, '#3a3a3c'], [.15, '#1c1c1e'], [1, '#0e0e0f']]); rr(c, 110, 476, 180, 44, 5); c.fill();
    c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(114, 477, 172, 1.5);
    for (const kx of [128, 272]) { c.fillStyle = rad(c, kx, 500, 1, 8, [[0, '#9a9a9e'], [1, '#2a2a2c']]); c.beginPath(); c.arc(kx, 500, 7, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = '#0a0a0a'; rr(c, 146, 472, 108, 6, 3); c.fill();
  }

  function drawFlames(t) {
    for (let i = 0; i < 12; i++) {
      const fx = 152 + i * 8.6, fh = 9 + Math.sin(t * 14 + i * 1.7) * 3.5;
      ctx.fillStyle = lin(ctx, 0, 472, 0, 472 - fh * 1.6, [[0, 'rgba(70,130,255,.95)'], [.6, 'rgba(120,180,255,.7)'], [1, 'rgba(255,170,90,.2)']]);
      ctx.beginPath(); ctx.moveTo(fx - 3.5, 472); ctx.quadraticCurveTo(fx, 472 - fh * 1.6, fx + 3.5, 472); ctx.fill();
    }
    ctx.fillStyle = rad(ctx, 200, 468, 4, 70, [[0, 'rgba(110,150,255,.22)'], [1, 'rgba(110,150,255,0)']]);
    ctx.fillRect(120, 400, 160, 80);
  }

  function drawPan() {
    const charging = phase === 'charge';
    const py = PAN_Y + (charging ? power * 10 : 0) - easeOut(panLift) * 26;
    ctx.save(); ctx.translate(PAN_X, py); ctx.rotate(-panRot * (charging ? -1 : 1));
    // handle: iron stem + walnut grip
    ctx.fillStyle = lin(ctx, 0, 2, 0, 14, [[0, '#5a5a5c'], [1, '#141415']]); rr(ctx, -168, 3, 96, 10, 5); ctx.fill();
    ctx.fillStyle = lin(ctx, 0, -1, 0, 17, [[0, '#8a5a34'], [.5, '#5e3a1e'], [1, '#3a2210']]); rr(ctx, -182, -1, 66, 18, 9); ctx.fill();
    ctx.strokeStyle = 'rgba(30,14,4,.4)'; ctx.lineWidth = .8;

  function drawArc(pts) {
    ctx.fillStyle = 'rgba(233,225,214,.22)';
    for (const [x, y] of pts) { ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI * 2); ctx.fill(); }
  }

  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (bgCache) ctx.drawImage(bgCache, 0, 0); else { ctx.fillStyle = '#132726'; ctx.fillRect(0, 0, cv.width, cv.height); }
    worldT(ctx);
    drawFlames(t);
    if (phase !== 'flight') drawArc(lastArc);
    drawPan();
    if (spot > 0) drawSpotlight();
    drawTarget(target);
    drawDog(dog);
    for (const c of crumbs) { ctx.fillStyle = c.c; ctx.beginPath(); ctx.arc(c.x, c.y, 2, 0, 7); ctx.fill(); }
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.font = '24px serif';
    for (const n of notes) { ctx.globalAlpha = Math.min(1, n.life) * spot; ctx.fillStyle = '#f2c230'; ctx.fillText(n.g, n.x, n.y); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.font = '26px "Rammetto One", "Arial Black", sans-serif';
      ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
    if (spot > 0) {
      ctx.globalAlpha = spot;
      ctx.font = '42px "Rammetto One", "Arial Black", sans-serif'; ctx.lineWidth = 8; ctx.strokeStyle = '#000';
      ctx.strokeText('IT LANDED', 500, 84); ctx.fillStyle = '#f2c230'; ctx.fillText('IT LANDED', 500, 84);
      ctx.font = '700 13px "Chivo Mono", monospace'; ctx.fillStyle = '#e9e1d6';
      ctx.fillText(('On ' + target.k.name + '  ·  Beethoven, Ode to Joy').toUpperCase(), 500, 112);
      ctx.globalAlpha = 1;
    }
    if (state === 'play' && phase === 'ready') {
      ctx.fillStyle = 'rgba(242,194,48,' + (.55 + .35 * Math.sin(t * 5)) + ')';
      ctx.font = '700 13px "Chivo Mono", monospace'; ctx.fillText('HOLD TO CHARGE', PAN_X, PAN_Y - 56);
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    update(dt); draw(now / 1000);
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.overlay') || e.target === againBtn) return;
    e.preventDefault(); startCharge();
  });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (e.repeat) return;
      if (!againBtn.hidden) { newRound(); return; }
      startCharge();
    }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') release(); });
  againBtn.onclick = () => newRound();
  document.getElementById('startBtn').onclick = () => {
    initAudio(); if (ac && ac.state === 'suspended') ac.resume();
    state = 'play'; document.getElementById('startScreen').hidden = true; newRound();
  };

  // menu backdrop: a sausage mid-flip over a toaster
  resize();
  target = makeTarget(null); target.k = KINDS[1]; target.h = 96; target.hw = 44; target.bx = 640; target.slide = 0; target.enter = 1;
  dog = { x: 470, y: 250, a: 2.2, mode: 'menu', pores: makePores() };
  lastArc = Array.from({ length: 20 }, (_, i) => { const u = i / 19; return [PAN_X + (640 - PAN_X) * u, 440 - Math.sin(Math.PI * u) * 260]; });
  btn.disabled = true;
  requestAnimationFrame(frame);
})();
</script>
