<title>Hotdog Flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Chivo+Mono:wght@400;700&display=swap">
<style>
/* Layout: one full-bleed canvas of a floating scene, a round action button bottom right, start card and "flip another" button as overlays. Single dark look, by choice. */
:root {
  --void: #d6c09a;
  --iron: #1d232b;
  --mustard: #f2c230;
  --ketchup: #d8342b;
  --ash: #e9e1d6;
  --display: "Rammetto One", "Arial Black", Impact, sans-serif;
  --mono: "Chivo Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--void); color: var(--ash); font-family: var(--mono); overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#stage { position: relative; height: 100%; }
canvas { display: block; width: 100%; height: 100%; }
/* old-time controls: the same sepia leader card as the countdown, ink rules, serif */
.leader {
  background: #d9cbb0; color: #1e1409; border: 3px solid #2a1d10; font-family: Georgia, "Times New Roman", serif;
  box-shadow: inset 0 0 0 5px #d9cbb0, inset 0 0 0 7px #2a1d10, 0 8px 18px rgba(40,25,10,.35);
}
.ring {
  width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; position: relative; cursor: pointer;
  background: #d9cbb0; border: 3px solid #2a1d10; box-shadow: inset 0 0 0 5px #d9cbb0, inset 0 0 0 7px #2a1d10;
  -webkit-tap-highlight-color: transparent; transition: transform .08s ease-out; padding: 0; overflow: hidden;
}
.ring::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #2a1d10; opacity: .5; }
.ring::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #2a1d10; opacity: .5; }
.ring:active, .ring.down { transform: scale(.93); }
.ring svg { width: 54px; height: 54px; position: relative; z-index: 1; display: block; }
.ring:focus-visible { outline: 3px solid #2a1d10; outline-offset: 4px; }
#corner { position: absolute; top: 0; right: 0; width: 76px; height: 76px; z-index: 3; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#corner::after { content: ""; position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; width: 12px; height: 12px; border-top: 2px solid rgba(74,48,22,.35); border-right: 2px solid rgba(74,48,22,.35); }
#settings {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; z-index: 2; padding: 16px 18px; border-radius: 6px;
  transform: translateX(150%) rotate(8deg); transform-origin: right top; transition: transform .38s cubic-bezier(.2, 1.25, .4, 1);
}
#settings.open { transform: none; }
@media (prefers-reduced-motion: reduce) { #settings { transition: none; } .ring { transition: none; } }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(30, 20, 10, .5); z-index: 2; cursor: pointer; }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="corner" role="button" aria-label="Settings" tabindex="0"></div>
  <div id="settings" class="leader" aria-hidden="true">
    <button class="ring" id="unstuckBtn" aria-label="Reset this round"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M50 26A20 20 0 1 0 54 38" fill="none" stroke="#1e1409" stroke-width="6" stroke-linecap="round"/><path d="M50 12v14H36" fill="none" stroke="#1e1409" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="overlay" id="startScreen">
    <div class="ring" style="width:150px;height:150px" aria-label="Start"><svg viewBox="0 0 64 64" aria-hidden="true" style="width:64px;height:64px"><path d="M22 14v36l30-18z" fill="#1e1409"/></svg></div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), mainCtx = cv.getContext('2d');
  let ctx = mainCtx;
  const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
  const shad = document.createElement('canvas'), sctx = shad.getContext('2d');
  const stage = document.getElementById('stage');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };

  // ---------- world ----------
  const WW = 1000, WH = 600, G = 2400;
  const PX = 270, PY = 440;               // pan cooking-surface centre
  const N = 9, SEG = 17, R = 19;          // sausage: 9 particles, 136px long, 38px thick
  const SUB = 1 / 240, REST = .01, MU = .8, MU_PAN = .02, PAN_TILT = .11;
  let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0, bgCache = null;

  function resize() {
    const r = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 3); W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    layer.width = cv.width; layer.height = cv.height;
    shad.width = Math.max(1, Math.round(cv.width / 5)); shad.height = Math.max(1, Math.round(cv.height / 5));
    S = Math.min(W / WW, H / WH); OX = (W - WW * S) / 2; OY = (H - WH * S) / 2;
    buildBackground();
  }
  new ResizeObserver(resize).observe(stage);
  const worldT = c => c.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  // camera: leans in during the hold test, shakes on the big win
  function camT(c) {
    worldT(c);
    if (shake > 0 && !reduce) c.translate(Math.sin(time * 61) * 9 * shake, Math.cos(time * 47) * 7 * shake);
    if (zoom > 1.001) { c.translate(zc.x, zc.y); c.scale(zoom, zoom); c.translate(-zc.x, -zc.y); }
  }
  const ext = () => ({ x0: -OX / S - 40, x1: (W - OX) / S + 40, y0: -OY / S - 40, y1: (H - OY) / S + 40 });

  // ---------- audio ----------
  let ac = null;
  function initAudio() {
    if (ac) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; return; }
    master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
    sizzleGain = ac.createGain(); sizzleGain.gain.value = 0; sizzleGain.connect(master);
    startSizzle(); loadSfx();
  }
  function blip(freq, dur, type = 'sine', vol = .08, slide = 0) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(master || ac.destination); o.start(t); o.stop(t + dur);
  }
  // ---- sound effects: recorded files shipped next to the page, with synthesized stand-ins until they load ----
  // CC0 recordings (Kenney, BenjaminNelan, artisticdude, bart, craigsmith); provenance in sfx/SOURCES.md
  const SFX_FILES = { sizzle: 'sfx/sizzle.mp3', land_soft: 'sfx/land_soft.mp3', land_hard: 'sfx/land_hard.mp3', pan_hit: 'sfx/pan_hit.mp3', whoosh: 'sfx/whoosh.mp3', click_down: 'sfx/click_down.mp3', click_up: 'sfx/click_up.mp3', chopstick: 'sfx/chopstick.mp3', heartbeat: 'sfx/heartbeat.mp3', cheer: 'sfx/cheer.mp3', meat: 'sfx/meat.mp3' };
  const sfxBuf = {}, lastPlay = {};
  let master = null, sizzleGain = null, sizzleSrc = null, cheerSrc = null;
  function noiseBuffer(sec) {
    const len = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < .002 ? 3 : .35);
    return b;
  }
  function startSizzle() {
    if (!ac) return;
    if (sizzleSrc) { try { sizzleSrc.stop(); } catch {} }
    const src = ac.createBufferSource(); src.loop = true;
    if (sfxBuf.sizzle) { src.buffer = sfxBuf.sizzle; src.connect(sizzleGain); }
    else { src.buffer = noiseBuffer(2); const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500; src.connect(f).connect(sizzleGain); }
    src.start(); sizzleSrc = src;
  }
  function setSizzle(level) { if (sizzleGain) sizzleGain.gain.setTargetAtTime(level * (sfxBuf.sizzle ? .55 : .05), ac.currentTime, .12); }
  function loadSfx() {
    for (const [name, url] of Object.entries(SFX_FILES)) {
      fetch(url).then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status))
        .then(b => new Promise((ok, no) => ac.decodeAudioData(b, ok, no)))
        .then(buf => { sfxBuf[name] = buf; if (name === 'sizzle') startSizzle(); })
        .catch(() => {});
    }
  }
  const FALLBACK = {
    whoosh: (v, r) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime; s.buffer = noiseBuffer(.35); f.type = 'bandpass'; f.frequency.setValueAtTime(400 * r, t); f.frequency.exponentialRampToValueAtTime(2400 * r, t + .3); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5 * v, t + .08); g.gain.exponentialRampToValueAtTime(.001, t + .33); s.connect(f).connect(g).connect(master); s.start(); },
    land_soft: v => blip(95, .14, 'sine', .25 * v, -45),
    meat: v => blip(80, .16, 'sine', .3 * v, -40),
    land_hard: v => blip(140, .1, 'triangle', .22 * v, -70),
    pan_hit: v => { blip(620, .25, 'triangle', .06 * v, -40); blip(1240, .18, 'sine', .03 * v); },
    chopstick: v => blip(1700, .04, 'triangle', .06 * v),
    click_down: v => blip(420, .035, 'square', .05 * v, -200),
    click_up: v => blip(760, .03, 'triangle', .04 * v),
    heartbeat: (v, r) => { blip(62, .12, 'sine', .35 * v, -20); setTimeout(() => blip(55, .14, 'sine', .25 * v, -20), 150 / r); },
    cheer: () => {},
  };
  function sfx(name, vol = 1, rate = 1) {
    if (!ac) return;
    const now = performance.now();
    if (now - (lastPlay[name] || 0) < 70) return; lastPlay[name] = now;
    const b = sfxBuf[name];
    if (!b) { FALLBACK[name] && FALLBACK[name](vol, rate); return; }
    const src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = b; src.playbackRate.value = rate * (.96 + Math.random() * .08); g.gain.value = vol;
    src.connect(g).connect(master); src.start();
    if (name === 'cheer') cheerSrc = { src, g };
  }
  let beatSrc = null;
  function beatLoop(rate) {
    if (!ac || !sfxBuf.heartbeat) return;
    if (!beatSrc) { const src = ac.createBufferSource(), g = ac.createGain(); src.buffer = sfxBuf.heartbeat; src.loop = true; g.gain.value = 1; src.connect(g).connect(master); src.start(); beatSrc = { src, g }; }
    beatSrc.src.playbackRate.value = rate;
  }
  function stopBeat() { if (!beatSrc) return; const b = beatSrc; beatSrc = null; b.g.gain.setTargetAtTime(0, ac.currentTime, .05); setTimeout(() => { try { b.src.stop(); } catch {} }, 400); }
  function stopCheer() { if (cheerSrc && ac) { cheerSrc.g.gain.setTargetAtTime(0, ac.currentTime, .2); const s0 = cheerSrc.src; setTimeout(() => { try { s0.stop(); } catch {} }, 900); cheerSrc = null; } }
  function impacts() {
    // meat slapping onto iron: the wet slap carries it, with a touch of pan ring underneath
    if (hits.pan > 1) { const v = Math.min(1, hits.pan / 5); sfx('meat', .5 + v * .5, .95 + (1 - v) * .15); sfx('pan_hit', .12 + v * .3, 1.1 - v * .2); buzz(Math.round(6 + v * 14)); }
    if (hits.target > 1) { const v = Math.min(1, hits.target / 5); sfx(v > .45 ? 'land_hard' : 'land_soft', .35 + v * .65); buzz(Math.round(8 + v * 16)); }
  }
  // haptics where the device and browser allow it (Android Chrome); silently nothing elsewhere
  function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch {} }

  // Beethoven, Symphony No. 9, "Ode to Joy" (public domain)
  const NOTE = { G2: 98, C3: 130.81, C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392 };
  const ODE = [['E4', 1], ['E4', 1], ['F4', 1], ['G4', 1], ['G4', 1], ['F4', 1], ['E4', 1], ['D4', 1],
               ['C4', 1], ['C4', 1], ['D4', 1], ['E4', 1], ['E4', 1.5], ['D4', .5], ['D4', 2],
               ['E4', 1], ['E4', 1], ['F4', 1], ['G4', 1], ['G4', 1], ['F4', 1], ['E4', 1], ['D4', 1],
               ['C4', 1], ['C4', 1], ['D4', 1], ['E4', 1], ['D4', 1.5], ['C4', .5], ['C4', 2]];
  const BASS = [['C3', 4], ['G2', 4], ['C3', 4], ['G2', 4], ['C3', 4], ['G2', 4], ['C3', 4], ['G2', 2], ['C3', 2]];
  const BEAT = .27;
  let odeBus = null;
  function stopOde() {
    if (!odeBus || !ac) return;
    const g = odeBus; g.gain.setTargetAtTime(0, ac.currentTime, .08); setTimeout(() => g.disconnect(), 600); odeBus = null;
  }
  function tone(bus, f, t, d, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02);
    g.gain.setValueAtTime(vol * .8, t + d * .7); g.gain.exponentialRampToValueAtTime(.0001, t + d * .98);
    o.connect(g).connect(bus); o.start(t); o.stop(t + d);
  }
  function playOde() {
    if (!ac) return;
    stopOde();
    const bus = ac.createGain(); bus.gain.value = .9; bus.connect(master); odeBus = bus;
    const t0 = ac.currentTime + .05;
    let t = t0;
    for (const [n, b] of ODE) { tone(bus, NOTE[n], t, b * BEAT, 'triangle', .16); tone(bus, NOTE[n] * 2, t, b * BEAT, 'sine', .035); t += b * BEAT; }
    t = t0;
    for (const [n, b] of BASS) { tone(bus, NOTE[n], t, b * BEAT, 'sine', .12); tone(bus, NOTE[n] * 1.5, t, b * BEAT, 'sine', .04); t += b * BEAT; }
  }

  // ---------- geometry ----------
  const wpt = (T, lx, ly) => ({ x: T.x + lx * Math.cos(T.a) - ly * Math.sin(T.a), y: T.y + lx * Math.sin(T.a) + ly * Math.cos(T.a) });
  const lpt = (T, x, y) => { const dx = x - T.x, dy = y - T.y, c = Math.cos(T.a), s = Math.sin(T.a); return { x: dx * c + dy * s, y: -dx * s + dy * c }; };
  function poly(pts) {
    // convex polygon in local space, with outward edge normals
    const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length, cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    const edges = pts.map((a, i) => {
      const b = pts[(i + 1) % pts.length];
      let nx = b[1] - a[1], ny = a[0] - b[0];
      const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      if ((a[0] - cx) * nx + (a[1] - cy) * ny < 0) { nx = -nx; ny = -ny; }
      return { ax: a[0], ay: a[1], nx, ny };
    });
    return edges;
  }
  const ngon = (cx, cy, r, n = 10) => Array.from({ length: n }, (_, i) => [cx + Math.cos(i / n * Math.PI * 2) * r, cy + Math.sin(i / n * Math.PI * 2) * r]);

  // ---------- bodies ----------
  // wide enough that the sausage (148 px with its rounded ends) has room to slide to the front lip
  const PAN_POLYS = [
    poly([[-100, 0], [100, 0], [94, 12], [-94, 12]]),
    poly([[-128, -20], [-118, -22], [-94, 2], [-102, 7]]),
    poly([[118, -22], [128, -20], [102, 7], [94, 2]]),
  ];
  let lift = { t0: -10, p: 0, d0: 0 }, dip = 0;
  function panT(t) {
    const u = (t - lift.t0) / .38;
    // pulling back: the pan slides toward its handle, sinks and rocks its front lip down with the charge
    const back = dip + (u >= 0 && u < 1 ? lift.d0 * Math.max(0, 1 - u * 3) : 0);
    // the pan sits nose-down a little, so a greasy sausage slides to the front lip and waits there
    let x = PX - back * 30, y = PY + Math.sin(t * 1.1) * 3 + back * 14, a = PAN_TILT + Math.sin(t * .8) * .012 + back * .17;
    if (u >= 0 && u < 1) { const k = Math.sin(Math.PI * u) * (.6 + lift.p * .4); y -= 40 * k; a -= .38 * k; }
    return { x, y, a };
  }
  const panCollides = t => !((t - lift.t0) >= 0 && (t - lift.t0) < .24);

  // sc scales the whole object; tops lists its landable surfaces in local units (default: the top edge, y = 0)
  const KINDS = [
    { id: 'deer', name: 'the deer', hw: 70, h: 178, sc: 1.25, tops: [{ x0: -78, x1: 56, y: 0 }] },
    { id: 'chair', name: 'the chair', hw: 60, h: 170, sc: 1.6, tops: [{ x0: -72, x1: 34, y: 72 }] },
    { id: 'hand', name: 'the hand', hw: 72, h: 140, sc: 1.3, tops: [{ x0: -96, x1: 44, y: 0 }] },
    { id: 'toaster', name: 'the toaster', hw: 44, h: 96, sc: 2 },
    { id: 'mug', name: 'the coffee mug', hw: 22, h: 66, sc: 2.1 },
    { id: 'cat', name: 'the sleeping cat', hw: 32, h: 72, sc: 2.1 },
    { id: 'skate', name: 'the skateboard', hw: 44, h: 26, drift: 60, sc: 2 },
    { id: 'duck', name: 'the rubber duck', hw: 15, h: 60, sc: 2.3 },
    { id: 'balloon', name: 'the balloon', hw: 20, h: 80, bob: 14, sway: .06, sc: 2.1 },
  ];
  // ---------- photo objects: real cutouts, hit boxes read off their alpha channel ----------
  // w is the width on screen; everything else (height, landing surfaces, collision columns) comes from the image
  const PHOTOS = [
    { id: 'dog', name: 'the dog', src: 'img/dog.png', w: 330 },
    { id: 'puppet', name: 'the puppet', src: 'img/puppet.png', w: 200 },
    { id: 'head', name: 'the head', src: 'img/head.png', w: 260 },
    { id: 'deer', name: 'the deer', src: 'img/deer.png', w: 320 },
    { id: 'stag', name: 'the stag', src: 'img/stag.png', w: 300 },
    { id: 'shepherd', name: 'the shepherd', src: 'img/shepherd.png', w: 330 },
    { id: 'cat', name: 'the cat', src: 'img/cat.png', w: 290 },
    { id: 'tiger', name: 'the tiger', src: 'img/tiger.png', w: 340 },
    { id: 'giraffe', name: 'the giraffe', src: 'img/giraffe.png', w: 320 },
    { id: 'flamingo', name: 'the flamingo', src: 'img/flamingo.png', w: 310 },
    { id: 'hedgehog', name: 'the hedgehog', src: 'img/hedgehog.png', w: 240 },
    { id: 'chair', name: 'the chair', src: 'img/chair.png', w: 250 },
    { id: 'myhand', name: 'the hand', src: 'img/myhand.png', w: 340 },
    { id: 'kid', name: 'the kid', src: 'img/kid.png', w: 290 },
    { id: 'toaster', name: 'the toaster', src: 'img/toaster.png', w: 280, cav: [[.365, .145, .095, .02], [.64, .145, .09, .02]] },
    { id: 'mug', name: 'the mug', src: 'img/mug.png', w: 340, cav: [[.355, .07, .325, .05]] },
    { id: 'duck', name: 'the duck', src: 'img/duck.png', w: 200 },
    { id: 'balloon', name: 'the balloon', src: 'img/balloon.png', w: 300 },
    { id: 'bicycle', name: 'the bicycle', src: 'img/bicycle.png', w: 320 },
    { id: 'skateboard', name: 'the skateboard', src: 'img/skateboard.png', w: 110 },
    { id: 'pineapple', name: 'the pineapple', src: 'img/pineapple.png', w: 125 },
    { id: 'trophy', name: 'the trophy', src: 'img/trophy.png', w: 150 },
    // things to fall into (openings as fractions of the image: x from, x to, y from the top, y to)
    { id: 'basket', name: 'the basket', src: 'img/basket.png', w: 300, cav: [[.5, .375, .46, .065]] },
    { id: 'basket2', name: 'the basket', src: 'img/basket2.png', w: 300, cav: [[.5, .405, .45, .055]] },
    { id: 'boot', name: 'the boot', src: 'img/boot.png', w: 250, cav: [[.66, .1, .14, .06]] },
    { id: 'boots2', name: 'the cowboy boots', src: 'img/boots2.png', w: 300, cav: [[.36, .065, .14, .035], [.64, .04, .14, .035]] },
    { id: 'glass', name: 'the glass', src: 'img/glass.png', w: 190, cav: [[.49, .29, .29, .04]] },
    { id: 'teacup', name: 'the teacup', src: 'img/teacup.png', w: 280, cav: [[.48, .28, .3, .16]] },
    { id: 'tophat', name: 'the top hat', src: 'img/tophat.png', w: 230, cav: [[.5, .22, .4, .08]] },
    // awkward perches
    { id: 'pot', name: 'the pot', src: 'img/pot.png', w: 260 },
    { id: 'vase', name: 'the vase', src: 'img/vase.png', w: 100 },
    { id: 'umbrella', name: 'the umbrella', src: 'img/umbrella.png', w: 340 },
    { id: 'books', name: 'the books', src: 'img/books.png', w: 260 },
    { id: 'books2', name: 'the textbooks', src: 'img/books2.png', w: 260 },
    // { id: 'ladder', name: 'the ladder', src: 'img/ladder.png', w: 150 },   // dropped: its top is too thin to ever land on (simulated clearance ~1%)
    { id: 'lamp', name: 'the lamp', src: 'img/lamp.png', w: 170 },
    // { id: 'lamp2', name: 'the desk lamp', src: 'img/lamp2.png', w: 90 },   // dropped: its top is too thin to ever land on (simulated clearance ~1%)
    { id: 'lantern', name: 'the lantern', src: 'img/lantern.png', w: 110 },
  ];
  function analyzePhoto(k, img) {
    const c = document.createElement('canvas'), iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;

      ctx.fillStyle = '#1c3f92'; ctx.beginPath(); ctx.moveTo(x - 4, top + 81); ctx.lineTo(x + 4, top + 81); ctx.lineTo(x, top + 75); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x - 14, top + 20, 5, 11, -.45, 0, 7); ctx.fill();
      ctx.fillStyle = lin(ctx, 0, top - 4, 0, top + 2, [[0, '#ffffff'], [1, '#b8b2a8']]); rr(ctx, x - hw, top - 4, hw * 2, 5, 2); ctx.fill();
    } else if (k === 'fork') {
      ctx.fillStyle = lin(ctx, 0, base - 30, 0, base, [[0, '#7a5232'], [1, '#3e2814']]); rr(ctx, x - 9, base - 30, 18, 30, 4); ctx.fill();
      ctx.fillStyle = lin(ctx, x - 6, 0, x + 6, 0, [[0, '#7c868a'], [.4, '#f2f6f7'], [1, '#8a9498']]);
      rr(ctx, x - 3, top + 34, 6, base - top - 60, 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - hw, top + 26); ctx.lineTo(x + hw, top + 26); ctx.quadraticCurveTo(x + hw, top + 40, x + 3, top + 44); ctx.lineTo(x - 3, top + 44); ctx.quadraticCurveTo(x - hw, top + 40, x - hw, top + 26); ctx.fill();
      for (let i = -1.5; i <= 1.5; i++) { rr(ctx, x + i * 5 - 1.3, top, 2.6, 30, 1.3); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(x - 1, top + 40, 1, base - top - 70);
    }
  }

  function drawSpotlight(t) {
    const T = targetT(target, t), { x0, x1, y0, y1 } = ext(), wide = target.hw * target.sc + 90, bottom = T.y + target.h * target.sc + 30;
    const sx = T.x - 70;
    const far = Math.max(bottom + 160, y1 + 60), wf = wide * (far - y0) / (bottom - y0);
    const bx = sx + (T.x - sx) * (far - y0) / (bottom - y0);
    ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0);
    ctx.moveTo(sx - 20, y0); ctx.lineTo(bx - wf, far); ctx.lineTo(bx + wf, far); ctx.lineTo(sx + 20, y0); ctx.closePath();
    ctx.fillStyle = `rgba(20,12,4,${.62 * spot})`; ctx.fill('evenodd');
    ctx.save();
    ctx.fillStyle = lin(ctx, 0, y0, 0, far, [[0, `rgba(255,250,235,${.02 * spot})`], [(bottom - y0) / (far - y0), `rgba(255,244,220,${.12 * spot})`], [1, 'rgba(255,244,220,0)']]);
    ctx.beginPath(); ctx.moveTo(sx - 20, y0); ctx.lineTo(sx + 20, y0); ctx.lineTo(sx + (T.x - sx) * (far - y0) / (bottom - y0) + wf, far); ctx.lineTo(sx + (T.x - sx) * (far - y0) / (bottom - y0) - wf, far); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 26; i++) {
      const u = (i * .618 + t * .03) % 1, v = Math.sin(i * 91.3) * .5 + .5;
      const yy = y0 + (bottom - y0) * u, half = 20 + (wide - 20) * u, xx = sx + (T.x - sx) * u + (v - .5) * 2 * half * .8;
      ctx.fillStyle = `rgba(255,250,230,${.25 * spot * (1 - Math.abs(v - .5))})`; ctx.beginPath(); ctx.arc(xx, yy, .9 + (i % 3) * .4, 0, 7); ctx.fill();
    }
    ctx.fillStyle = rad(ctx, T.x, T.y + target.h * target.sc / 2, 10, wide * 1.4, [[0, `rgba(255,236,200,${.08 * spot})`], [1, 'rgba(255,236,200,0)']]);
    ctx.fillRect(T.x - wide * 1.5, T.y - wide * 1.4, wide * 3, wide * 3);
    ctx.restore();
  }

  // the hold test: a vintage film-leader countdown, big numeral in a crosshair circle with a sweeping wipe
  function drawHold(t) {
    const { x0, x1, y0, y1 } = ext(), k = Math.min(1, phaseT * 2), c = centroid();
    ctx.fillStyle = rad(ctx, c.x, c.y, 90, 620, [[0, 'rgba(20,10,4,0)'], [1, `rgba(20,10,4,${.6 * k})`]]);
    ctx.fillRect(x0 - 200, y0 - 200, x1 - x0 + 400, y1 - y0 + 400);
    const left = Math.max(0, 5 - hold.t), num = Math.ceil(left), sub = 1 - (left - Math.floor(left));
    const cx = c.x > 500 ? 250 : 750, cy = 235, Rr = 115;
    const jit = reduce ? 0 : 1.2;
    ctx.save(); ctx.translate(cx + Math.sin(t * 97) * jit, cy + Math.cos(t * 83) * jit); ctx.globalAlpha = k;
    // leader card
    ctx.fillStyle = '#d9cbb0'; ctx.beginPath(); ctx.arc(0, 0, Rr + 26, 0, 7); ctx.fill();
    ctx.strokeStyle = '#2a1d10'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, Rr + 26, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, Rr + 6, 0, 7); ctx.stroke();
    // sweeping wipe
    ctx.fillStyle = 'rgba(70,50,30,.55)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, Rr + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * sub); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2a1d10'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(-Math.PI / 2 + Math.PI * 2 * sub) * (Rr + 26), Math.sin(-Math.PI / 2 + Math.PI * 2 * sub) * (Rr + 26)); ctx.stroke();
    // crosshair
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-Rr - 26, 0); ctx.lineTo(Rr + 26, 0); ctx.moveTo(0, -Rr - 26); ctx.lineTo(0, Rr + 26); ctx.stroke();
    // numeral
    ctx.fillStyle = '#1e1409'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 150px Georgia, "Times New Roman", serif'; ctx.fillText(String(num), 0, 8);
    ctx.textBaseline = 'alphabetic';
    // grain, scratches and flicker
    ctx.globalAlpha = k * (.06 + .04 * Math.sin(t * 50));
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, Rr + 26, 0, 7); ctx.fill();
    ctx.globalAlpha = k * .5; ctx.strokeStyle = 'rgba(40,25,10,.5)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) { const sx = ((t * 400 * (i + 1)) % (Rr * 2 + 52)) - Rr - 26; ctx.beginPath(); ctx.moveTo(sx, -Rr - 26); ctx.lineTo(sx + 2, Rr + 26); ctx.stroke(); }
    ctx.restore();
  }

  function draw(t) {
    mainCtx.setTransform(1, 0, 0, 1, 0, 0);
    if (bgCache) mainCtx.drawImage(bgCache, 0, 0); else { mainCtx.fillStyle = '#d6c09a'; mainCtx.fillRect(0, 0, cv.width, cv.height); }
    // 1. everything solid goes on its own layer
    ctx = lctx;
    lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, layer.width, layer.height);
    camT(lctx);
    const P = panT(simT);
    if (panPhoto) panImage(P, false); else panBack(P);
    // sausage sits inside the pan when touching it, otherwise in front of everything
    const inPan = sau && sau.p.some(q => q.touch === 'pan');
    if (inPan) drawSausage(sau);
    if (panPhoto) panImage(P, true); else panFront(P);
    const inside = !inPan && sau && inCavity();
    drawTarget(target, simT);
    if (inside) {
      // in an opening: the sausage goes behind the object's front wall (its image below the rim line) but in front of the rest
      drawSausage(sau);
      targetFront(target, simT);
    }
    let g = null;
    if (chop.mode) { g = chopGeom(); stick(...g.back, 3.4, 9, false); }
    if (!inPan && !inside) drawSausage(sau);
    if (g) stick(...g.front, 3.6, 9.5, true);
    ctx = mainCtx;
    // 2. its silhouette, shrunk (which softens it) and dropped onto the cardboard behind, light from the upper left
    sctx.globalCompositeOperation = 'source-over'; sctx.clearRect(0, 0, shad.width, shad.height);
    sctx.drawImage(layer, 0, 0, shad.width, shad.height);
    sctx.globalCompositeOperation = 'source-in'; sctx.fillStyle = 'rgba(74,46,18,.34)'; sctx.fillRect(0, 0, shad.width, shad.height);
    mainCtx.imageSmoothingEnabled = true; mainCtx.imageSmoothingQuality = 'high';
    const so = 18 * S * DPR;
    mainCtx.drawImage(shad, so * .8, so * 1.1, cv.width, cv.height);
    mainCtx.drawImage(layer, 0, 0);
    camT(mainCtx);
    drawMotes(t);
    if (spot > 0) drawSpotlight(simT);
    if (phase === 'hold') drawHold(t);
    for (const f of confetti) {
      mainCtx.save(); mainCtx.translate(f.x, f.y); mainCtx.rotate(f.r); mainCtx.scale(1, Math.cos(f.r * 1.7));
      mainCtx.globalAlpha = Math.min(1, f.life); mainCtx.fillStyle = f.c; mainCtx.fillRect(-f.w / 2, -f.h / 2, f.w, f.h); mainCtx.restore();
    }
    mainCtx.globalAlpha = 1;
    worldT(mainCtx);
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.font = '24px serif';
    for (const n of notes) { ctx.globalAlpha = Math.min(1, n.life) * spot; ctx.fillStyle = '#f2c230'; ctx.fillText(n.g, n.x, n.y); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.font = '24px "Rammetto One", "Arial Black", sans-serif';
      ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = '#ff7a5c'; ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); draw(now / 1000);
    requestAnimationFrame(frame);
  }

  // ---------- input: tap or hold anywhere ----------
  const settings = document.getElementById('settings'), corner = document.getElementById('corner');
  function start() {
    initAudio(); if (ac && ac.state === 'suspended') ac.resume();
    state = 'play'; document.getElementById('startScreen').hidden = true; newRound();
  }
  function act() {
    if (settings.classList.contains('open')) { toggleSettings(false); return; }
    if (state === 'menu') { start(); return; }
    if (phase === 'won') { if (phaseT > 1) newRound(); return; }
    press();
  }
  function toggleSettings(open) {
    const o = open == null ? !settings.classList.contains('open') : open;
    settings.classList.toggle('open', o); settings.setAttribute('aria-hidden', String(!o));
    initAudio(); sfx(o ? 'click_down' : 'click_up', .6); buzz(6);
  }
  // unstuck: same object, fresh sausage
  function resetRound() {
    stopOde(); stopCheer(); stopBeat(); spotOn = false; big = false; notes.length = 0; confetti.length = 0;
    if (state === 'play') newSausage();
    toggleSettings(false);
  }
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('#settings') || e.target.closest('#corner')) return;
    e.preventDefault(); act();
  });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('keydown', e => {
    if (e.code === 'Escape') { toggleSettings(false); return; }
    if (e.code !== 'Space' && e.code !== 'ArrowUp' && e.code !== 'Enter') return;
    e.preventDefault();
    if (e.repeat) return;
    act();
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') release(); });
  corner.addEventListener('pointerdown', e => { e.preventDefault(); toggleSettings(); });
  corner.addEventListener('keydown', e => { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); toggleSettings(); } });
  document.getElementById('unstuckBtn').addEventListener('click', resetRound);
  // the ring buttons click like old switches
  document.querySelectorAll('.ring').forEach(b => {
    b.addEventListener('pointerdown', () => { initAudio(); b.classList.add('down'); sfx('click_down', .8); buzz(8); });
  });
  window.addEventListener('pointerup', () => document.querySelectorAll('.ring.down').forEach(b => { b.classList.remove('down'); sfx('click_up', .6); }));

  loadPhotos(); rasterKinds();
  // backdrop behind the start card: a sausage dangling from chopsticks over the pan
  resize();
  target = makeTarget(null); target.bx = 700; target.by = Math.min(240, 560 - target.h * target.sc); target.enter = 1;
  queue = [];   // the start-screen object is just scenery; the first round starts a full cycle
  newSausage(); chop.mode = 'hold';
  requestAnimationFrame(frame);
})();
</script>
