<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Blast Scale</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b0d10" />
<style>
  :root{
    --bg:#0b0d10;
    --panel:rgba(14,16,20,.82);
    --line:rgba(255,255,255,.1);
    --text:#e9e6e1;
    --dim:#9a958d;
    --hot:#ff5a1f;
    --warm:#ffb347;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
    user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block}
  button{font:inherit;color:inherit;background:rgba(255,255,255,.07);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;cursor:pointer}
  button.on{background:rgba(255,179,71,.2);border-color:rgba(255,179,71,.6);color:#ffd9a3}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
  #hud{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top));pointer-events:none}
  .brand{font-weight:800;letter-spacing:.14em;font-size:13px}
  .brand span{color:var(--hot)}
  #time{margin-top:4px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--warm);min-height:1.3em;
    text-shadow:0 1px 3px #000}
  #scaleLbl2{font-size:12px;color:#fff;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
  #top{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:6px}
  #top button{padding:6px 9px;font-size:12px;background:var(--panel)}
  #cross{position:fixed;left:50%;top:42%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;opacity:.85}
  #cross:before,#cross:after{content:"";position:absolute;background:#ff3b30;box-shadow:0 0 2px #000}
  #cross:before{left:12px;top:0;width:2px;height:26px}
  #cross:after{top:12px;left:0;height:2px;width:26px}
  #panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));
    width:min(760px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:10px 10px 10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #info{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  #bname{font-weight:700;font-size:15px}
  #byield{color:var(--warm);font-weight:700;font-variant-numeric:tabular-nums}
  #bdesc{color:var(--dim);font-size:12px;margin-top:2px}
  #beff{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;font-variant-numeric:tabular-nums}
  #beff i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  #chips,.chips2{display:flex;gap:6px;overflow-x:auto;margin:9px -2px 0;padding:2px 2px 4px;scrollbar-width:none;touch-action:pan-x}
  #chips::-webkit-scrollbar,.chips2::-webkit-scrollbar{display:none}
  .chips2{margin-top:4px}
  .chip{flex:0 0 auto;padding:6px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
  .chip small{color:var(--dim);margin-left:5px}
  .chip.nuc small{color:#f7a07a}
  .chip.nat small{color:#9fd3a0}
  .chip.end{border-color:rgba(255,80,60,.45)}
  .chip.end small{color:#ff8a70}
  #targets .chip{background:rgba(120,170,255,.08)}
  #targets .chip.on{background:rgba(120,170,255,.22);border-color:rgba(140,185,255,.7);color:#dbe8ff}
  .row{display:flex;align-items:center;gap:8px;margin-top:8px}
  .row label{font-size:12px;color:var(--dim);min-width:40px}
  input[type=range]{flex:1;accent-color:var(--hot);touch-action:pan-x;min-width:60px}
  .seg{display:flex}
  .seg button{border-radius:0;padding:7px 9px;font-size:12px}
  .seg button:first-child{border-radius:8px 0 0 8px}
  .seg button:last-child{border-radius:0 8px 8px 0}
  .seg button+button{border-left:none}
  #go{margin-left:auto;background:linear-gradient(#e0421a,#a8260b);border-color:#ff7a4d;font-weight:800;
    letter-spacing:.08em;padding:9px 16px;color:#fff}
  #go:active{transform:translateY(1px)}
  #customRow{display:none}
  #scaleVal{font-size:12px;min-width:118px;text-align:right;font-variant-numeric:tabular-nums}
  #hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(40px + env(safe-area-inset-top));font-size:12px;
    color:#fff;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:999px;pointer-events:none;transition:opacity 1s;
    white-space:nowrap}
  #stats{position:fixed;left:12px;top:calc(60px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:3px;pointer-events:none;
    font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
  .stat{display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--dim)}
  .stat b{font-size:17px;font-weight:800;min-width:72px;display:inline-block;letter-spacing:.3px}
  .stat.dead b{color:#ff5a4d}.stat.inj b{color:#ffb347}.stat.bld b{color:#9fd3ff}.stat.cost b{color:#8fe08f}
  #mission{position:fixed;right:10px;top:calc(46px + env(safe-area-inset-top));width:min(260px,52vw);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #mission.done{border-color:rgba(143,224,143,.6)}
  #mTitle{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--warm)}
  #mName{font-weight:700;font-size:14px;margin-top:1px}
  #mDesc{font-size:12px;color:var(--dim);margin-top:2px}
  #mRow{display:flex;gap:6px;margin-top:7px}
  #mRow button{flex:1;padding:5px 8px;font-size:11px;background:rgba(255,255,255,.06)}
  #mStatus{font-size:11px;margin-top:5px;color:#8fe08f;min-height:1.2em}
  #toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(120px + env(safe-area-inset-top));display:flex;flex-direction:column;
    gap:6px;align-items:center;pointer-events:none}
  .toast{background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;
    color:#fff;animation:tin .3s ease, tout .5s ease 1.9s forwards}
  .toast.hot{border-color:rgba(255,90,60,.7);color:#ffb6a3}
  .toast.win{border-color:rgba(143,224,143,.7);color:#bdf0bd}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
  @keyframes tout{to{opacity:0}}
  @media (max-width:560px){
    #stats{top:calc(78px + env(safe-area-inset-top))}
    #mission{top:calc(78px + env(safe-area-inset-top));width:44vw;padding:7px 8px}
    #mName{font-size:12px}.stat b{font-size:15px}
  }
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--dim)}
  @media (max-width:560px){
    #hud{top:calc(46px + env(safe-area-inset-top))}
    .brand{display:none}
    #panel{padding:8px}
    .row{flex-wrap:wrap}
    #go{flex:1 0 100%;margin-left:0}
    #scaleVal{min-width:0}
    #hint{top:calc(92px + env(safe-area-inset-top));white-space:normal;text-align:center;width:calc(100% - 32px)}
  }
</style>
</head>
<body>
<div id="flash"></div>
<div id="hud">
  <div class="brand">BLAST<span>SCALE</span></div>
  <div id="time"></div>
  <div id="scaleLbl2"></div>
</div>
<div id="top">
  <button id="bSound" class="on" title="Sound">Sound</button>
  <button id="bRings" class="on" title="Effect radii">Radii</button>
  <button id="bGame" class="on" title="Missions and counts">Game</button>
  <button id="bDetail" title="Block resolution">Detail</button>
  <button id="bReset" title="Rebuild the world">Rebuild</button>
</div>
<div id="cross"></div>
<div id="stats">
  <div class="stat dead"><b id="sDead">0</b><span>casualties</span></div>
  <div class="stat inj"><b id="sInj">0</b><span>injured</span></div>
  <div class="stat bld"><b id="sBld">0</b><span>buildings down</span></div>
  <div class="stat cost"><b id="sCost">$0</b><span>damage</span></div>
</div>
<div id="mission">
  <div id="mTitle">Mission <span id="mNo"></span></div>
  <div id="mName"></div>
  <div id="mDesc"></div>
  <div id="mStatus"></div>
  <div id="mRow"><button id="mGo">Take me there</button><button id="mSkip">Skip</button></div>
</div>
<div id="toasts"></div>
<div id="hint">Pick a bomb · tap anywhere to fire it there · drag to orbit · pinch or scroll to zoom</div>
<div id="panel">
  <div id="info"><span id="bname"></span><span id="byield"></span></div>
  <div id="bdesc"></div>
  <div id="beff"></div>
  <div class="row" id="customRow"><label>Yield</label><input type="range" id="cy" min="0" max="1000" value="500" /></div>
  <div id="chips"></div>
  <div id="targets" class="chips2"></div>
  <div class="row"><label>Scale</label><input type="range" id="scale" min="0" max="1000" value="200" /><span id="scaleVal"></span></div>
  <div class="row">
    <div class="seg" id="burst"><button data-v="surface" class="on">Surface</button><button data-v="air">Airburst</button></div>
    <div class="seg" id="speed"><button data-v="0.1">0.1×</button><button data-v="1" class="on">1×</button><button data-v="5">5×</button></div>
    <button id="fit">Fit</button>
    <button id="go">FIRE</button>
  </div>
</div>
<div id="err">Couldn't load the 3D engine. This page needs an internet connection the first time it opens.</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}}
</script>
<script>
  window.__bootTimer = setTimeout(function(){ if(!window.__booted) document.getElementById('err').style.display='flex'; }, 12000);

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   Numbers
   ===================================================================== */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const mod=(a,b)=>((a%b)+b)%b;
function hash2(x,z){let h=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function hash3(x,z,s){return hash2(((x|0)+Math.imul(s,1013904223))|0,((z|0)^Math.imul(s,1664525))|0);}
function vnoise(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),fx=x-xi,fz=z-zi;
  const u=fx*fx*(3-2*fx),w=fz*fz*(3-2*fz);
  const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);
  return (a+(b-a)*u+(c-a)*w+(a-b-c+d)*u*w)*2-1;
}
const LIN=h=>{const c=new THREE.Color(h);return [c.r,c.g,c.b];};

/* =====================================================================
   Weapons — yields in kilotons of TNT
   ===================================================================== */
const BOMBS=[

  {n:'Beirut port explosion',kt:0.5,nuc:0,y:2020,d:'~2,750 t of ammonium nitrate; estimated ~0.5 kt TNT equivalent.'},

  {n:'Meteor Crater impact',kt:10000,nuc:1,kind:'impact',d:'The ~50 m iron asteroid that dug Arizona\'s Barringer Crater 50,000 years ago.'},

  {n:'Tunguska event',kt:12000,nuc:1,kind:'impact',y:1908,air:8000,d:'Asteroid airburst over Siberia. Flattened 80 million trees across 2,150 km².'},
  {n:'Castle Bravo',kt:15000,nuc:1,y:1954,d:'Largest US test — 2.5× its predicted yield.'},
  {n:'B41',kt:25000,nuc:1,d:'Highest-yield weapon the US ever deployed.'},
  {n:'Tsar Bomba',kt:50000,nuc:1,y:1961,air:4000,d:'AN602. The largest explosion humans have ever made. Airburst at ~4 km.'},

  {n:'Moon shatterer',kt:2.96e16,nuc:1,kind:'planet',d:'1.2×10²⁹ J, the Moon\'s binding energy. Shoot it at the Moon to blow it apart; on Earth it melts the crust.'},
  {n:'Mars shatterer',kt:1.16e18,nuc:1,kind:'planet',d:'4.9×10³⁰ J, Mars\'s binding energy. Shoot it at Mars to blow it apart.'},
  {n:'Theia impact',kt:2.4e18,nuc:1,kind:'impact',d:'The Mars-sized collision 4.5 billion years ago that melted Earth and threw off the debris that became the Moon.'},
  {n:'Venus shatterer',kt:3.75e19,nuc:1,kind:'planet',d:'1.6×10³² J, Venus\'s binding energy.'},
  {n:'Earth shatterer',kt:5.4e19,nuc:1,kind:'planet',d:'2.2×10³² J, Earth\'s gravitational binding energy: the minimum it takes to blow the planet apart for good.'},
  {n:'10× overkill',kt:5.4e20,nuc:1,kind:'planet',d:'Ten times the binding energy. The pieces leave fast.'},
  {n:'Saturn shatterer',kt:5.3e22,nuc:1,kind:'planet',d:'2.2×10³⁵ J, Saturn\'s binding energy.'},
  {n:'Jupiter shatterer',kt:4.8e23,nuc:1,kind:'planet',d:'2×10³⁶ J, Jupiter\'s binding energy. The biggest thing here to break.'},

/* Peak overpressure vs scaled distance (km per kt^1/3), log-log interpolated */
const PSI_T=[[0.02,3000],[0.06,200],[0.1,60],[0.18,20],[0.28,10],[0.38,5],[0.5,3],[0.7,2],[1.0,1],[1.6,0.5],[3.0,0.2],[6,0.08],[12,0.03]];
function psiScaled(Z){
  const T=PSI_T;
  if(Z<=T[0][0]) return Math.min(1e5,T[0][1]*Math.pow(T[0][0]/Math.max(Z,1e-9),2));
  for(let i=0;i<T.length-1;i++){
    if(Z<=T[i+1][0]){const a=T[i],b=T[i+1];const t=Math.log(Z/a[0])/Math.log(b[0]/a[0]);return Math.exp(Math.log(a[1])+t*Math.log(b[1]/a[1]));}
  }
  const l=T[T.length-1];return l[1]*Math.pow(l[0]/Z,1.3);
}
function makeFx(kt,nuc,burst,hob){
  const f={kt,nuc};
  f.cr=Math.cbrt(kt);
  f.crb=Math.cbrt(nuc?kt:kt*2);          // chemical: ~all energy goes to blast; nuclear: ~half
  f.Rfb=Math.min(nuc?55*Math.pow(kt,0.4):150*f.cr,2e7); // max fireball radius (m); past planet size it stops meaning anything
  f.hb=burst==='air'?(hob||Math.max(240*f.crb,f.Rfb*1.15)):0;
  f.Rfg=f.hb===0?f.Rfb*0.85:(f.Rfb>f.hb?Math.sqrt(f.Rfb*f.Rfb-f.hb*f.hb):0);
  f.Rc=f.hb===0&&kt<1e14?(nuc?30:45)*f.cr:0;       // crater radius (beyond this the crust just melts)
  f.Dc=f.Rc*0.32;
  f.Rth=nuc?Math.min(700*Math.pow(kt,0.41),3e6):0;      // 3rd-degree burns / ignition
  f.H=Math.min(nuc?Math.min(5380*Math.pow(kt,0.229),80*f.Rfb):7*f.Rfb,5e5); // cloud top
  f.Rcap=f.H*(nuc?0.42:0.3);
  f.psiAt=d=>{let p=psiScaled(Math.hypot(d,f.hb)/1000/f.crb);if(f.hb>0)p*=1+0.6*smooth(0.4*f.hb,1.4*f.hb,d);return p;};
  f.rAt=p=>{if(f.psiAt(0)<p)return 0;let a=0,b=2e7;for(let i=0;i<64;i++){const m=(a+b)/2;if(f.psiAt(m)>p)a=m;else b=m;}return a;};
  f.r20=f.rAt(20);f.r5=f.rAt(5);f.r1=f.rAt(1);
  return f;
}

/* =====================================================================
   The world — one procedural function, sampled at whatever block size
   the current view needs. Nothing is stored except the damage.
   ===================================================================== */
const K=5; // segments per column at the finest ring: ground + up to 4 stacked objects
const C_GROUND=0,C_TOWER=1,C_MID=2,C_HOUSE=3,C_ROOF=4,C_TRUNK=5,C_CANOPY=6,C_CAR=7,C_SMALL=8,C_STONE=9,C_WATER=10,C_CROP=11,C_RUBBLE=12;
const STR=[99,1.4,0.9,0.45,0.3,0.6,0.35,0.6,0.3,2.5,99,0.08,99];
const FLAM=[0,0,0,1,1,1,1,0,1,0,0,1,1];
const M_NAT=0,M_BLD=1,M_FIRE=2,M_GROUND=3,M_WATER=4,M_CLOUD=5,M_CITY=6;

const VOLC={x:-45000,z:60000,r:24000,h:3700};

function terrainRaw(x,z){
  let h=25+55*vnoise(x/14000+11.3,z/14000-7.1)+22*vnoise(x/3100+3.7,z/3100+9.2)+6*vnoise(x/700+1.1,z/700-4.4)+1.2*vnoise(x/90,z/90);
  const coast=42000+9000*vnoise(z/26000,5.3);
  h-=smooth(coast-6000,coast+5000,x)*150;
  // continents and ocean basins
  const dO=Math.hypot(x,z);
  const cont=0.65*vnoise(x/1.2e6+3.3,z/1.2e6-1.7)+0.35*vnoise(x/3.5e5+7.1,z/3.5e5+2.2)+1.2*(1-smooth(3e5,2e6,dO));
  h+=cont<0?cont*9000:Math.min(cont,0.3)*150;
  // a stratovolcano with a summit crater
  const vd=Math.hypot(x-VOLC.x,z-VOLC.z);
  if(vd<VOLC.r){h+=VOLC.h*Math.pow(1-vd/VOLC.r,1.7);if(vd<900)h-=420*(1-vd/900);}
  // a Himalaya-sized range
  const rd=Math.hypot(x-RANGE.x,z-RANGE.z);
  if(rd<RANGE.r){const ridge=1-Math.abs(vnoise(x/38000+4.4,z/38000-8.1));h+=RANGE.h*Math.pow(1-rd/RANGE.r,1.1)*(0.3+0.7*ridge*ridge);}
  return h;
}
function terrainBase(x,z){
  let h=terrainRaw(x,z);
  h=lerp(h,6,1-smooth(3500,9000,Math.hypot(x,z)));
  const dm=Math.hypot(x-MEGA.x,z-MEGA.z);
  if(dm<90000)h=lerp(h,20,1-smooth(MEGA.r*0.8,90000,dm));
  return h;
}

const TOWN=26000,townCache=new Map();
function town(a,b){
  const key=a*100003+b;let t=townCache.get(key);if(t!==undefined)return t;
  t=null;
  if(hash3(a,b,7)<0.55){
    const tx=(a+0.2+0.6*hash3(a,b,8))*TOWN,tz=(b+0.2+0.6*hash3(a,b,9))*TOWN;
    if(Math.hypot(tx,tz)>15000&&terrainBase(tx,tz)>4)t={x:tx,z:tz,r:700+1500*hash3(a,b,10)};
  }
  townCache.set(key,t);return t;
}
const fall=(d,r)=>d>=r?0:Math.pow(1-d/r,0.7);
function urban(x,z){
  let I=fall(Math.hypot(x,z),5200);
  const dm=Math.hypot(x-MEGA.x,z-MEGA.z);if(dm<MEGA.r)I=Math.max(I,fall(dm,MEGA.r));
  const cx=Math.floor(x/TOWN),cz=Math.floor(z/TOWN);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const t=town(cx+i,cz+j);if(t)I=Math.max(I,0.72*fall(Math.hypot(x-t.x,z-t.z),t.r));
  }
  return I;
}

function treeSegs(d,h,H,rc,trunkR,v,leaf,conifer){
  const trunkHit=d<Math.max(trunkR,v*0.5);
  const q=d/rc;
  let cb,ct;
  if(conifer){cb=h+H*0.15;ct=h+H*(1-q*0.85);}
  else{cb=h+H*(0.35+0.15*q*q);ct=h+H*(1-0.22*q*q);}
  if(q<1&&ct>cb){if(trunkHit)push(h,cb,P.trunk,M_NAT,C_TRUNK);push(cb,ct,leaf,M_NAT,C_CANOPY);return true;}
  if(trunkHit){push(h,h+H*0.6,P.trunk,M_NAT,C_TRUNK);return true;}
  return false;
}

const CARI={tire:LIN(0x1b1b1d),hub:LIN(0x9a9ea3),carpet:LIN(0x2a2a2c),leather:LIN(0x8a6446),cloth:LIN(0x3a3b40),console:LIN(0x45474d),

function detailedCar(la,lo,h,c,v,conv){

  for(const ca of [1.4,-1.38]){

      if(Math.abs(dl)<0.33){const dy=Math.sqrt(0.33*0.33-dl*dl);Y(0.33-dy,0.33+dy,al>0.86&&Math.abs(dl)<0.13?CARI.hub:CARI.tire);}
      if(al>0.78)Y(0.72,0.95,c);

  }
  // front and back faces: lamps in the bodywork
  if(la>2.1){Y(0.28,0.6,c);if(al>0.5&&al<0.78)Y(0.6,0.74,CARI.light);else Y(0.6,0.74,c);Y(0.74,0.86,c);return true;}
  if(la<-2.1){Y(0.28,0.62,c);if(al>0.55&&al<0.8)Y(0.62,0.76,CARI.tail);else Y(0.62,0.76,c);Y(0.76,0.95,c);return true;}

  if(la>1.28){Y(0.28,0.9,c);
    if(la<1.36){if(al>0.72||conv)Y(0.92,al>0.72?1.3:0.98,al>0.72?CARI.chrome:c);if(!conv)Y(1.0,1.36,CARI.glass);else if(al<=0.72)Y(1.26,1.3,CARI.chrome);}
    return true;}
  if(la<-1.55){Y(0.28,0.95,c);return true;}
  // doors
  if(al>0.78){Y(0.28,0.95,c);if(!conv){Y(0.97,1.33,CARI.glass);Y(1.34,1.42,c);}return true;}
  // the cabin floor, then whatever sits on it
  Y(0.28,0.36,CARI.carpet);

  if(!conv&&la>-1.3&&la<0.95&&v>0.02)Y(1.35,1.42,c);   // a hardtop's roof, until you zoom right in
  // dashboard and steering wheel
  if(la>0.95){Y(0.56,0.92,CARI.dash);if(conv&&la>1.2)Y(1.26,1.3,CARI.chrome);return true;}
  const dlo=lo-0.4;
  if(la>0.8&&la<0.86&&Math.abs(dlo)<0.2){
    const R=0.17,t=0.022,yc=0.82,ao=Math.abs(dlo);
    if(ao<0.05){Y(yc-0.05,yc+0.05,CARI.wheel);}
    else if(ao<R+t){const outer=Math.sqrt((R+t)**2-dlo*dlo);
      if(ao<R-t){const inner=Math.sqrt((R-t)**2-dlo*dlo);Y(yc-outer,yc-inner,CARI.wheel);Y(yc+inner,yc+outer,CARI.wheel);}
      else Y(yc-outer,yc+outer,CARI.wheel);}
    return true;
  }
  if(la>=0.86&&Math.abs(dlo)<0.025){Y(0.8,0.84,CARI.wheel);return true;}
  // centre console with two cupholders
  if(al<0.14&&la>-0.1&&la<0.95){
    const dA=Math.hypot(la-0.55,lo),dB=Math.hypot(la-0.36,lo);
    if(dA<0.042){Y(0.36,0.52,dA<0.036?CARI.liner:CARI.console);
      if(dA<0.036){Y(0.52,0.66,dA>0.03?CARI.sleeve:CARI.cup);Y(0.66,0.69,CARI.lid);}
      return true;}
    if(dB<0.042){Y(0.36,0.52,CARI.liner);
      // crumbs at the bottom of the empty cupholder, and a coin
      const cs=0.004,ix=Math.floor(la/cs),iz=Math.floor(lo/cs),r=hash3(ix,iz,411);
      if(Math.hypot(la-0.36+0.012,lo-0.01)<0.0095)Y(0.52,0.5218,CARI.coin,C_SMALL);
      else if(r<0.32){const cx=(ix+0.5)*cs,cz=(iz+0.5)*cs,sz=cs*(0.18+0.25*hash3(ix,iz,412));

      return true;}

function features(x,z,v){
  SC.n=0;
  for(let i=0;i<LANDMARKS.length;i++){
    const L=LANDMARKS[i];
    if(Math.abs(x-L.x)<L.r&&Math.abs(z-L.z)<L.r&&L.f(x-L.x,z-L.z,v))return;
  }
  const hb=terrainBase(x,z);
  if(hb<0.5){
    const fl=Math.min(hb,-0.3);
    if(-fl<v*0.6){pushG(0,hb<-400?P.deepSea:P.water,0);SC.mat[0]=M_WATER;return;}
    pushG(fl,hb<-3?P.seabed:P.sand,1);
    push(fl,0,P.water,M_WATER,C_WATER);
    return;
  }
  const I=urban(x,z);
  if(I>0.06)urbanF(x,z,v,I,hb);else ruralF(x,z,v,hb);
}

function ruralF(x,z,v,hb){
  const h=hb+0.3*vnoise(x/12,z/12)+0.05*vnoise(x/1.7,z/1.7);
  if(hb>2600){pushG(h,P.snow,1);return;}
  if(hb>1100){pushG(h,hb>2000&&vnoise(x/900,z/900)>0.2?P.snow:P.rock,1);return;}
  if(hb>600){pushG(h,vnoise(x/600,z/600)>0?P.rock:P.forest,1);return;}
  if(hb<1.6){pushG(h,P.sand,1);return;}
  if(v<40&&(mod(x+1200,2400)<7||mod(z+1200,2400)<7)){pushG(hb,P.gravel,0);return;}
  const fm=vnoise(x/1800+50,z/1800-20)*0.7+vnoise(x/420+9,z/420+3)*0.3;
  if(fm>0.22){

function isGasBlock(bx,bz,I){if(bx===0&&bz===0||hash3(bx,bz,501)>=0.06)return false;if(I===undefined)I=urban(bx*B,bz*B);return I>0.12&&I<0.78;}

function park(x,z,h,v){

      if(Math.max(Math.abs(x-bx),Math.abs(z-bz))<Math.max(0.0012,v*0.5)){
        const k=hash3(a,b,313);push(h,h+0.03+0.045*k,mul(LEAF[3],0.7+0.6*hash3(a,b,314)),M_NAT,C_CROP);i=j=9;

/* =====================================================================
   Damage — evaluated from the list of detonations, at any block size
   ===================================================================== */
const blasts=[];
const DM={psi:0,therm:0,fb:false,crater:0,any:false};
function computeDmg(x,z){
  DM.psi=0;DM.therm=0;DM.fb=false;DM.crater=0;DM.any=false;
  for(let i=0;i<blasts.length;i++){
    const b=blasts[i];if(b.t<=0)continue;
    const dx=x-b.x,dz=z-b.z;
    if(Math.abs(dx)>b.rMax||Math.abs(dz)>b.rMax)continue;
    const d=Math.hypot(dx,dz);
    if(b.Rth>0&&b.thermalOn&&d<b.Rth*1.6){const t=(b.Rth*b.Rth)/Math.max(d*d,1e-6);if(t>DM.therm)DM.therm=t;DM.any=true;}
    if(d<=b.rShock){
      const p=b.psiAt(d);if(p>DM.psi)DM.psi=p;if(p>0.8)DM.any=true;
      if(d<b.Rfg){DM.fb=true;DM.any=true;}
      if(b.Rc>0&&d<b.Rc*1.5){DM.any=true;if(d<b.Rc)DM.crater+=b.Dc*(1-(d/b.Rc)**2);else DM.crater-=b.Dc*0.2*(1-(d-b.Rc)/(0.5*b.Rc));}
    }
  }
}
function mixInto(k,c,t){SC.r[k]+=(c[0]-SC.r[k])*t;SC.g[k]+=(c[1]-SC.g[k])*t;SC.b[k]+=(c[2]-SC.b[k])*t;}
function darken(k,f){SC.r[k]*=f;SC.g[k]*=f;SC.b[k]*=f;}
function moveSeg(a,b){if(a===b)return;SC.y0[b]=SC.y0[a];SC.y1[b]=SC.y1[a];SC.r[b]=SC.r[a];SC.g[b]=SC.g[a];SC.b[b]=SC.b[a];SC.mat[b]=SC.mat[a];SC.m2[b]=SC.m2[a];SC.cls[b]=SC.cls[a];}
function applyDmg(x,z,v){
  if(!DM.any)return;
  const ci=Math.floor(x/v),cj=Math.floor(z/v);
  const q1=hash3(ci,cj,91),q2=hash3(ci,cj,92),q3=hash3(ci,cj,93);
  let h=SC.y1[0];
  if(DM.crater!==0){h-=DM.crater;SC.y1[0]=h;}
  if(DM.fb){
    SC.n=1;if(SC.mat[0]===M_CITY)SC.mat[0]=M_GROUND;SC.r[0]=P.glass[0];SC.g[0]=P.glass[1];SC.b[0]=P.glass[2];mixInto(0,P.scorch,q1*0.5);
    return;
  }
  const psi=DM.psi,th=DM.therm;
  if(psi>25)mixInto(0,P.dirt,0.55);
  else if(!SC.nat&&psi>3)mixInto(0,P.rubble,clamp((psi-3)/15,0,0.6));
  if(!SC.nat&&th>=1)mixInto(0,P.char,clamp(0.2+0.1*(th-1),0,0.45));

const ANT_N=coarse?40:90,ANT_P=9;
const antGeo=new THREE.BoxGeometry(1,1,1);

// part: [forward offset, side offset, height, length, width, height] in metres
const ANT_PARTS=[[0.0019,0,0.0011,0.0011,0.001,0.0009],[0.0004,0,0.0011,0.0016,0.0008,0.0008],[-0.0018,0,0.0013,0.0023,0.0016,0.0014]];
for(const f of [0.0009,0.0002,-0.0005])for(const sd of [-1,1])ANT_PARTS.push([f,sd*0.0012,0.0006,0.00028,0.0024,0.00028]);
const ants=[];
function resetAnts(){
  ants.length=0;
  for(let i=0;i<ANT_N;i++)ants.push({u:Math.random(),sp:0.9+0.3*Math.random(),off:Math.random()*2-1,st:1,x:0,z:0,hd:0,flip:0,char:0});
  for(let i=0;i<ANT_N*ANT_P;i++){const c=i%ANT_P===2?LIN(0x1e0c07):LIN(0x3a1a10);antMesh.instanceColor.array.set(c,i*3);}

resetAnts();
const _ae=new THREE.Euler(),_aq=new THREE.Quaternion(),_am=new THREE.Matrix4(),_ap=new THREE.Vector3(),_as=new THREE.Vector3();
function antPos(a,u,out){
  const s=u<0.5?u*2:(1-u)*2,dx=COOKIE.x-ANTHILL.x,dz=COOKIE.y-ANTHILL.y,len=Math.hypot(dx,dz);
  const w=Math.sin(s*Math.PI*3+a.off*4)*0.01+(u<0.5?1:-1)*(0.012+a.off*0.012)*Math.sin(s*Math.PI);

const _a1={x:0,z:0},_a2={x:0,z:0};
function updateAnts(dt,now,show){
  antMesh.visible=show;

  const M=antMesh.instanceMatrix.array,len=Math.hypot(COOKIE.x-ANTHILL.x,COOKIE.y-ANTHILL.y)*2.2;
  for(let i=0;i<ANT_N;i++){

      for(const b of blasts){
        if(b.t<=0)continue;const d=Math.hypot(a.x-b.x,a.z-b.z);
        if(d>b.rShock)continue;

        if(b.psiAt(d)>1.5||(b.Rth>0&&d<b.Rth)){a.st=2;a.flip=Math.PI;stats.ants++;a.x+=(a.x-b.x)/Math.max(d,1e-4)*0.01;a.z+=(a.z-b.z)/Math.max(d,1e-4)*0.01;
          for(let p=0;p<ANT_P;p++)antMesh.instanceColor.array.set(P.char,(i*ANT_P+p)*3);antMesh.instanceColor.needsUpdate=true;break;}
      }

    const y=groundAt(a.x,a.z),walk=a.st===1?now*0.025*a.sp:0;
    for(let p=0;p<ANT_P;p++){

      const pt=ANT_PARTS[p];let f=pt[0];

   A detonation
   ===================================================================== */
const shellGeo=new THREE.SphereGeometry(1,48,24);
function shellMaterial(){
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    uniforms:{uA:{value:0}},
    vertexShader:`varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform float uA;varying vec3 vN;varying vec3 vV;void main(){float f=1.0-abs(dot(normalize(vN),normalize(vV)));gl_FragColor=vec4(vec3(1.0,0.96,0.9)*pow(f,5.0)*uA,1.0);}`});
}
const NCAP=coarse?1500:2600,NSTEM=coarse?420:700,NSKIRT=coarse?260:420,NCLOUD=NCAP+NSTEM+NSKIRT;
const cloudGeo=()=>{const g=new THREE.BoxGeometry(1,1,1);g.setAttribute('aMat',new THREE.InstancedBufferAttribute(new Float32Array(NCLOUD*2),2));return g;};
const HOT=LIN(0xfff4dd), DIRTY=LIN(0x6e5646), PALE=LIN(0xe6e0d8), SMOKE=LIN(0x2b2826), SMOKE2=LIN(0x6c655e), DUSTC=LIN(0x8f7c68);

class Blast{
  constructor(kt,nuc,x,z,burst,hob,name){
    Object.assign(this,makeFx(kt,nuc,burst,hob));
    this.name=name;this.x=x;this.z=z;this.t=0;this.rShock=0;this.prevR=0;this.done=false;
    this.thermalOn=false;this.thermalDone=false;this.heard=false;
    this.gH=groundAt(x,z);
    // real-time table for the shock front: dr/dt from Rankine–Hugoniot
    const n=320;
    this.rEnd=this.rAt(0.3)*1.05;const r0=Math.min(Math.max(this.Rfb*0.01,0.004),this.rEnd*1e-3);this.rMax=Math.max(this.rEnd,this.Rth*1.7,this.Rc*1.6)+1;

    let t=0,prev=r0;
    for(let i=0;i<n;i++){
      const r=r0*Math.pow(this.rEnd/r0,i/(n-1));
      const p=this.psiAt((r+prev)/2),U=343*Math.sqrt(1+6*p/(7*14.7));
      t+=(r-prev)/U;this.tr[i]=r;this.tt[i]=t;prev=r;
    }
    this.tEnd=t;
    const vis=Math.min(this.rEnd,Math.max(0.55*view.S,this.Rfb*1.5));
    this.k=Math.max(1e-7,this.tAtR(vis)/3.2);  // real seconds per animation second
    // visuals
    const cg=cloudGeo();
    this.cloud=new THREE.InstancedMesh(cg,boxMat,NCLOUD);
    this.cloud.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NCLOUD*3),3);
    this.cloud.frustumCulled=false;this.cloud.castShadow=true;
    this.cloud.position.set(x,this.gH,z);scene.add(this.cloud);
    const pr=new Float32Array(NCLOUD*6);
    for(let i=0;i<NCLOUD;i++){
      let a=Math.random(),b=Math.random(),c=Math.random();
      pr[i*6]=a*Math.PI*2;pr[i*6+1]=b*Math.PI*2;pr[i*6+2]=Math.sqrt(c);
      pr[i*6+3]=0.55+0.9*Math.random();pr[i*6+4]=Math.random();pr[i*6+5]=Math.random();
    }

    this.shell=new THREE.Mesh(shellGeo,shellMaterial());this.shell.position.set(x,this.gH+this.hb,z);this.shell.visible=false;scene.add(this.shell);

  }
  tAtR(r){
    const tr=this.tr;if(r<=tr[0])return 0;if(r>=tr[tr.length-1])return this.tEnd;
    let a=0,b=tr.length-1;while(b-a>1){const m=(a+b)>>1;if(tr[m]<r)a=m;else b=m;}

  }
  updateCloud(){
    if(!this.cloud)return;
    const t=this.t,nuc=this.nuc,pr=this.pr;
    const M=this.cloud.instanceMatrix.array,Cc=this.cloud.instanceColor.array,A=this.cloud.geometry.attributes.aMat.array;
    const fb=this.Rfb*(1-Math.exp(-t/0.14));

    const cp=camera.position,ccx=cp.x-this.x,ccy=cp.y-this.gH,ccz=cp.z-this.z;

      else{for(let c=0;c<3;c++)col[c]=lerp(SMOKE[c],SMOKE2[c],rho*0.7);}

    for(let j=0;j<NSTEM;j++){
      const i=NCAP+j,a=pr[i*6]+t*0.25,uu=pr[i*6+4],rj=pr[i*6+2],sf=pr[i*6+3];
      const y=uu*stemTop;
      const rad=Rcap*0.1*(1+1.3*Math.pow(1-uu,4))*rj;
      const s=Rcap*0.075*sf*smooth(0.2,0.9,t)*age*(stemTop>0?1:0);
      const heat=nuc?clamp(heat0*0.6*uu,0,1):0;
      const k=uu*0.6+white*0.3;

}

/* =====================================================================
   Space — a block-built Earth and Moon. The flat world hands over to the
   globe once the view is wider than ~13,000 km. Ground zero sits on top,
   and the flat world maps onto it by distance and bearing from there.

const RE=6.371e6,RM=1.7374e6;

/* A world made of blocks: a fine surface shell over a coarse core.
   Blocks can be blasted out of craters or the whole body blown apart. */
class Body{
  constructor(o){
    this.R=o.R;this.center=o.center;this.bindKt=o.bindKt;
    const R=o.R,nF=o.nFine,bs=2*R/nF,pts=[];
    this.bs=bs;
    const cell=(k)=>(k+0.5-nF/2)*bs;
    for(let i=0;i<nF;i++){const x=cell(i);for(let j=0;j<nF;j++){
      const y=cell(j),rho2=x*x+y*y;if(rho2>R*R)continue;
      const zmax=Math.sqrt(R*R-rho2),rin=R-bs*0.9,zin=rho2<rin*rin?Math.sqrt(rin*rin-rho2):0;
      const kk=z=>clamp(Math.floor(z/bs+nF/2),0,nF-1);
      const a0=kk(-zmax)-1,a1=kk(-zin+bs)+1,b0=kk(zin-bs)-1,b1=kk(zmax)+1;
      const test=k=>{if(k<0||k>=nF)return;const z=cell(k),r=Math.sqrt(rho2+z*z);if(r<=R&&r+bs*0.9>R)pts.push(x,y,z,bs,r);};
      for(let k=a0;k<=a1;k++)test(k);
      for(let k=Math.max(b0,a1+1);k<=b1;k++)test(k);
    }}
    this.nSurf=pts.length/5;
    const nC=o.nCore,bc=2*R/nC,lim=R-bs*0.9;
    for(let i=0;i<nC;i++)for(let j=0;j<nC;j++)for(let k=0;k<nC;k++){
      const x=(i+0.5-nC/2)*bc,y=(j+0.5-nC/2)*bc,z=(k+0.5-nC/2)*bc,r=Math.hypot(x,y,z);
      if(r+bc*0.5<lim)pts.push(x,y,z,bc*1.001,r);
    }
    const n=this.n=pts.length/5;
    const geo=new THREE.BoxGeometry(1,1,1);
    geo.setAttribute('aMat',new THREE.InstancedBufferAttribute(new Float32Array(n*2),2));
    const m=new THREE.InstancedMesh(geo,boxMat,n);
    m.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(n*3),3);
    m.frustumCulled=false;m.visible=false;m.position.copy(o.center);
    m.count=o.showCore?n:this.nSurf;this.showCoreAlways=!!o.showCore;
    scene.add(m);this.mesh=m;
    this.M=m.instanceMatrix.array;this.C=m.instanceColor.array;this.A=geo.attributes.aMat.array;
    this.p0=new Float32Array(n*3);this.sz=new Float32Array(n);this.rf=new Float32Array(n);
    this.vel=new Float32Array(n*3);this.state=new Uint8Array(n);this.life=new Float32Array(n);
    this.flying=[];this.hot=new Set();this.brk=null;
    for(let i=0;i<n;i++){
      this.p0[i*3]=pts[i*5];this.p0[i*3+1]=pts[i*5+1];this.p0[i*3+2]=pts[i*5+2];this.sz[i]=pts[i*5+3];this.rf[i]=pts[i*5+4]/R;
      const sp=(0.35+0.5*Math.random())*(1.2-0.5*this.rf[i]),inv=1/Math.max(pts[i*5+4],1);
      this.vel[i*3]=pts[i*5]*inv*sp+(Math.random()-0.5)*0.15;this.vel[i*3+1]=pts[i*5+1]*inv*sp+(Math.random()-0.5)*0.15;this.vel[i*3+2]=pts[i*5+2]*inv*sp+(Math.random()-0.5)*0.15;
    }
    this.layers=o.layers;
    this.reset();
  }
  place(i,x,y,z,s,spin){
    const M=this.M,o=i*16;
    if(!spin){M[o]=M[o+5]=M[o+10]=s;M[o+1]=M[o+2]=M[o+3]=M[o+4]=M[o+6]=M[o+7]=M[o+8]=M[o+9]=M[o+11]=0;}
    else{
      _ba.set(hash2(i,1)-0.5,hash2(i,2)-0.5,hash2(i,3)-0.5).normalize();_bq.setFromAxisAngle(_ba,spin);
      const x2=_bq.x,y2=_bq.y,z2=_bq.z,w=_bq.w;
      M[o]=(1-2*(y2*y2+z2*z2))*s;M[o+1]=2*(x2*y2+z2*w)*s;M[o+2]=2*(x2*z2-y2*w)*s;M[o+3]=0;
      M[o+4]=2*(x2*y2-z2*w)*s;M[o+5]=(1-2*(x2*x2+z2*z2))*s;M[o+6]=2*(y2*z2+x2*w)*s;M[o+7]=0;
      M[o+8]=2*(x2*z2+y2*w)*s;M[o+9]=2*(y2*z2-x2*w)*s;M[o+10]=(1-2*(x2*x2+y2*y2))*s;M[o+11]=0;
    }

  }
  reset(){
    const A=this.A,C=this.C;
    for(let i=0;i<this.n;i++){
      this.place(i,this.p0[i*3],this.p0[i*3+1],this.p0[i*3+2],this.sz[i]*0.999,0);
      this.state[i]=0;this.life[i]=0;
      if(i>=this.nSurf){const L=this.layers.find(l=>this.rf[i]<l[0]);C.set(L[1],i*3);A[i*2]=M_CLOUD;A[i*2+1]=L[2];}
    }
    this.flying.length=0;this.hot.clear();this.brk=null;
    this.mesh.count=this.showCoreAlways?this.n:this.nSurf;
    this.mesh.instanceMatrix.needsUpdate=true;this.mesh.instanceColor.needsUpdate=true;this.mesh.geometry.attributes.aMat.needsUpdate=true;
  }
  /* blast a crater: blocks inside fly off glowing, blocks around it are scorched */
  impact(lx,ly,lz,kt,allowBreak){
    const Rc=30*Math.cbrt(kt)*(this.R<3e6?1.8:1),Rg=Math.max(Rc*1.9,Math.min(55*Math.pow(kt,0.4),this.R*2));
    if(allowBreak&&(kt>=this.bindKt||Rc>this.R*1.05)){this.breakup(kt);return;}
    const P=this.p0,C=this.C,A=this.A,sp=Math.max(Rc,this.bs)*1.2;
    let carved=0;
    for(let i=0;i<this.n;i++){
      if(this.state[i])continue;
      const dx=P[i*3]-lx,dy=P[i*3+1]-ly,dz=P[i*3+2]-lz;
      if(Math.abs(dx)>Rg||Math.abs(dy)>Rg||Math.abs(dz)>Rg)continue;
      const d=Math.hypot(dx,dy,dz);
      if(d<Rc){
        const inv=1/Math.max(d,1),nr=1/Math.hypot(lx,ly,lz),r=0.6+0.8*Math.random();
        this.vel[i*3]=(dx*inv+lx*nr*1.2)*sp*r;this.vel[i*3+1]=(dy*inv+ly*nr*1.2)*sp*r;this.vel[i*3+2]=(dz*inv+lz*nr*1.2)*sp*r;
        this.state[i]=1;this.life[i]=0;this.flying.push(i);
        C.set(PC.lava,i*3);A[i*2]=M_FIRE;A[i*2+1]=1;carved++;

        const k=1-(d-Rc)/(Rg-Rc);
        for(let c=0;c<3;c++)C[i*3+c]=lerp(C[i*3+c],PC.glass[c],0.4+0.5*k);
        A[i*2]=M_FIRE;A[i*2+1]=Math.max(A[i*2+1],0.7*k);this.hot.add(i);
      }
    }
    if(carved)this.mesh.count=this.n; // the crater can open onto the core
    this.mesh.instanceColor.needsUpdate=true;this.mesh.geometry.attributes.aMat.needsUpdate=true;
    return carved;
  }
  breakup(kt){
    if(this.brk)return;
    this.brk={t:0,sp:this.R*0.32*Math.cbrt(Math.max(1,kt/this.bindKt))};
    this.mesh.count=this.n;
    for(let i=0;i<this.nSurf;i++){this.C.set(PC.lava,i*3);this.A[i*2]=M_FIRE;this.A[i*2+1]=0.6;}
    this.mesh.instanceColor.needsUpdate=true;this.mesh.geometry.attributes.aMat.needsUpdate=true;
  }
  update(dt,tick){
    let moved=false;
    const P=this.p0,V=this.vel,A=this.A;
    if(this.brk){
      const B=this.brk;B.t+=dt;
      const d=B.sp*B.t*(1-0.35*Math.exp(-B.t*0.5));
      for(let i=0;i<this.n;i++){
        if(this.state[i]===2)continue;
        this.place(i,P[i*3]+V[i*3]*d,P[i*3+1]+V[i*3+1]*d,P[i*3+2]+V[i*3+2]*d,this.sz[i]*0.999,B.t*(0.3+hash2(i,4)*0.8));
        if(tick)A[i*2+1]=Math.max(i>=this.nSurf?0.1:0.05,A[i*2+1]*0.985);
      }
      moved=true;
    }else if(this.flying.length){
      const keep=[];
      for(const i of this.flying){
        const L=(this.life[i]+=dt);
        if(L>9){this.state[i]=2;this.place(i,0,0,0,0,0);continue;}
        const s=this.sz[i]*0.999*(L>7?(9-L)/2:1);
        this.place(i,P[i*3]+V[i*3]*L,P[i*3+1]+V[i*3+1]*L,P[i*3+2]+V[i*3+2]*L,s,L*(1+hash2(i,5)*2));
        if(tick)A[i*2+1]=Math.max(0.1,A[i*2+1]*0.97);
        keep.push(i);
      }
      this.flying=keep;moved=true;
    }
    if(tick&&this.hot.size){
      for(const i of this.hot){A[i*2+1]*=0.96;if(A[i*2+1]<0.03){A[i*2]=M_NAT;A[i*2+1]=0;this.hot.delete(i);}}
      moved=true;
    }
    if(moved){this.mesh.instanceMatrix.needsUpdate=true;if(tick)this.mesh.geometry.attributes.aMat.needsUpdate=true;}
  }
  /* nearest hit of a world-space ray on this body's sphere */
  hit(r){
    const h=new THREE.Vector3();
    if(this.brk)return null;
    return r.intersectSphere(new THREE.Sphere(this.center,this.R),h)?h:null;
  }
}

function flatToLocal(x,z){ // flat-world point to a point on Earth's surface, relative to Earth's centre
  const th=Math.hypot(x,z)/RE,ph=Math.atan2(z,x);
  return new THREE.Vector3(Math.sin(th)*Math.cos(ph)*RE,Math.cos(th)*RE,Math.sin(th)*Math.sin(ph)*RE);

function localToFlat(p){
  const r=p.length(),th=Math.acos(clamp(p.y/r,-1,1)),ph=Math.atan2(p.z,p.x);
  return {x:th*RE*Math.cos(ph),z:th*RE*Math.sin(ph)};

function mkBody(o){
  const b=new Body({R:o.R,center:o.center,nFine:o.nFine||(coarse?48:72),nCore:o.nCore||16,bindKt:o.bindKt,showCore:true,layers:o.layers});
  b.name=o.name;b.pretty=o.pretty;

  for(let i=0;i<b.nSurf;i++){
    const x=b.p0[i*3]/o.R,y=b.p0[i*3+1]/o.R,z=b.p0[i*3+2]/o.R;
    const lat=Math.abs(y);let c;

    if(o.bands){const band=o.bands;c=band[clamp(Math.floor((y*0.5+0.5+0.12*n)*band.length),0,band.length-1)];}
    else c=n<-0.15?o.c2:n>0.4?o.c3:o.c1;

    const k=0.88+0.24*hash2(i,o.seed||5);b.C[i*3]=c[0]*k;b.C[i*3+1]=c[1]*k;b.C[i*3+2]=c[2]*k;b.A[i*2]=M_NAT;
  }
  b.mesh.instanceColor.needsUpdate=true;b.base=b.C.slice(0,b.nSurf*3);
  return b;
}

  const pos=new THREE.Vector3(c.x+Math.cos(a)*r,c.y+Math.sin(el)*r*0.5,c.z+Math.sin(a)*r);
  const grp=new THREE.Group();grp.position.copy(pos);
  const bk=(sx,sy,sz,x,y,z,col)=>{const mm=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshLambertMaterial({color:col}));mm.position.set(x,y,z);grp.add(mm);};
  const u=Math.max(body.R*0.03,body.bs*0.8);
  bk(u*3,u,u,0,0,0,0xc3c7cc);                 // core
  bk(u*0.5,u*0.5,u*5,0,0,0,0xaab0b6);         // truss
  bk(u*6,u*0.1,u*2.4,0,0,u*3.2,0x2a3f6a);     // solar array
  bk(u*6,u*0.1,u*2.4,0,0,-u*3.2,0x2a3f6a);
  bk(u*1.4,u*1.4,u*1.4,u*2.4,0,0,0xe2e2e2);   // module
  scene.add(grp);
  STATIONS.push({grp,pos,R:u*6,body,name,alive:true,pop:Math.round(3+hash2(name.length,7)*9)});
}

const ALL_BODIES=[earth,moon,bodies.mercury,bodies.venus,bodies.mars,bodies.jupiter,bodies.saturn];
function nearestBodyHit(rayR){
  let best=null,bd=Infinity;
  for(const b of ALL_BODIES){const h=b.hit(rayR);if(h){const d=rayR.origin.distanceTo(h);if(d<bd){bd=d;best={body:b,p:h};}}}
  // a station is a small target; check those too
  for(const st of STATIONS){if(!st.alive)continue;const h=new THREE.Vector3();
    if(rayR.intersectSphere(new THREE.Sphere(st.pos,st.R*1.5),h)){const d=rayR.origin.distanceTo(h);if(d<bd){bd=d;best={station:st,p:h};}}}
  return best;
}
function stationHit(st,b){
  st.alive=false;st.grp.visible=false;
  stats.space+=st.pop;spaceGlow(st.pos,st.R*4);extraFlash=Math.max(extraFlash,0.5);boom(0.6,0.4);
  toast(st.name+' destroyed','hot');missionCheck();
}
function updateStations(show){
  for(const st of STATIONS)st.grp.visible=show&&st.alive;
  if(bodies.saturn.rings)bodies.saturn.rings.visible=show;
}


function colorEarth(){
  const C=earth.C,A=earth.A;
  const molten=blasts.some(b=>b.molten&&b.t>0.3);
  for(let i=0;i<earth.nSurf;i++){
    if(earth.state[i])continue;
    if(i>=earth.baseDone&&!blasts.length)continue;
    const pb=earth.base,x=earth.fx[i],z=earth.fz[i];
    let c=[pb[i*3],pb[i*3+1],pb[i*3+2]],mat=M_NAT,m2=0;
    if(blasts.length){
      computeDmg(x,z);
      if(DM.fb||molten){c=molten?PC.lava:PC.glass;if(molten){mat=M_FIRE;m2=0.12+0.22*hash2(i,7);}}
      else if(DM.therm>=1)for(let k=0;k<3;k++)c[k]=lerp(c[k],P.char[k],0.6);
      else if(DM.psi>5)for(let k=0;k<3;k++)c[k]=lerp(c[k],P.dirt[k],0.4);
    }
    if(earth.hot.has(i))continue;
    C[i*3]=c[0];C[i*3+1]=c[1];C[i*3+2]=c[2];A[i*2]=mat;A[i*2+1]=m2;
  }
  earth.mesh.instanceColor.needsUpdate=true;earth.mesh.geometry.attributes.aMat.needsUpdate=true;
}
/* terrain colours for the globe, worked out a slice at a time so loading never stalls */
function earthBaseSlice(n){
  const end=Math.min(earth.nSurf,earth.baseDone+n);
  for(let i=earth.baseDone;i<end;i++){
    const x=earth.fx[i],z=earth.fz[i],px=earth.p0[i*3]/RE,hb=terrainBase(x,z);
    let c;
    if(Math.abs(px)>0.88)c=PC.ice;
    else if(hb<0)c=hb<-1500?PC.deep:PC.sea;
    else if(urban(x,z)>0.1)c=PC.city;
    else if(hb>2600)c=PC.snow;else if(hb>1100)c=PC.rock;
    else{const b=vnoise(x/5e5+3,z/5e5-2);c=b>0.3?PC.desert:b>-0.15?PC.green:PC.forest;}
    earth.base.set(c,i*3);earth.C.set(c,i*3);
  }
  earth.baseDone=end;earth.mesh.instanceColor.needsUpdate=true;
  if(end>=earth.nSurf)planet.dirty=true;
}
function resetPlanet(){
  for(const b of ALL_BODIES){b.reset();if(b.base){b.C.set(b.base,0);for(let i=0;i<b.nSurf;i++){b.A[i*2]=M_NAT;b.A[i*2+1]=0;}b.mesh.instanceColor.needsUpdate=true;}}
  for(const st of STATIONS){st.alive=true;st.grp.visible=false;}
  if(typeof clearGame==='function')clearGame();

}

function updatePlanet(dt,show,tick){
  if(earth.baseDone<earth.nSurf)earthBaseSlice(coarse?6000:12000);
  earth.mesh.visible=show;moon.mesh.visible=show;atm.visible=show&&!earth.brk&&focus==='ground';
  for(const b of ALL_BODIES)b.mesh.visible=show;
  updateStations(show);
  for(const L of levels)L.mesh.visible=!show;
  for(const f of frameM)f.visible=!show;
  debMesh.visible=!show;
  const space=focus!=='ground'?1:smooth(3e6,1.6e7,view.S);
  stars.material.opacity=space;stars.visible=space>0.01;
  stars.position.copy(camera.position);stars.scale.setScalar(camera.far*0.7);
  // a planet-killer at the Earth: the pieces leave once its shock has wrapped the globe
  const pk=blasts.find(b=>b.planetKill&&b.t>1.6);
  if(pk&&!earth.brk&&focus==='ground'){earth.breakup(pk.kt);coreGlowAt(EARTHC,RE);boom(1,1);shake=1;}
  for(const b of ALL_BODIES)b.update(dt,tick);
  if(coreGlow.visible){const g=coreGlow.userData;g.t+=dt;const cg=1-Math.exp(-g.t*0.8);coreGlow.scale.setScalar(g.R*(0.3+1.4*cg));coreGlow.material.opacity=0.45*Math.exp(-g.t*0.7);if(g.t>12)coreGlow.visible=false;}
  for(let i=impactGlows.length-1;i>=0;i--){const m=impactGlows[i],u=m.userData;u.t+=dt;m.scale.setScalar(u.r*(0.3+0.7*(1-Math.exp(-u.t*3))));m.material.opacity=0.9*Math.exp(-u.t*2.5);
    if(u.t>4){scene.remove(m);m.geometry.dispose();m.material.dispose();impactGlows.splice(i,1);}}
  if(show&&(planet.dirty||(tick&&frameNo%8===0&&blasts.some(b=>!b.done||b.t<3)))){colorEarth();planet.dirty=false;}
}

function coreGlowAt(p,R){coreGlow.visible=true;coreGlow.position.copy(p);coreGlow.userData={t:0,R};}

/* shots that land in space: craters on the Moon or on the globe */
function spaceImpact(body,worldP,b){
  const l=worldP.clone().sub(body.center);
  const wasBroken=!!body.brk;
  body.impact(l.x,l.y,l.z,b.kt,true);
  if(body.brk&&!wasBroken){coreGlowAt(body.center,body.R);boom(1,1);shake=1;toast((body.pretty||'Body')+' shattered','hot');missionCheck();}
  else missionCheck();
  const Rfb=Math.min(b.nuc?55*Math.pow(b.kt,0.4):150*Math.cbrt(b.kt),body.R*2);
  spaceGlow(worldP,Math.max(Rfb,body.bs*0.8));
  extraFlash=Math.max(extraFlash,b.nuc?0.6:0.3);
  boom(clamp(Math.log10(b.kt*1e6+1)/22,0.2,1),clamp(Math.log10(b.kt*1e6)/11,0,1));
}
let extraFlash=0;

/* sweep the shock front through the block grid, rebuilding columns it crosses.
   What a column loses is handed to the debris system to fall the way that
   thing would: towers pancake floor onto floor or topple about a failing
   storey, houses fold in, trees go over downwind, cars and loose things are
   thrown, glass blows out ahead of the wall. */
let spawnBudget=0,sweepStamp=0;
const oldSegs=[];for(let k=0;k<K;k++)oldSegs.push({y0:0,y1:0,c:[0,0,0],cls:0});
function sweep(){
  const act=[];
  for(const b of blasts){
    const lo=b.prevR,hi=Math.min(b.rShock,b.rEnd);
    const th=b.thermalOn&&!b.thermalDone&&b.Rth>0;
    if(hi>lo||th)act.push({b,lo,hi,th,thR:b.Rth*1.6});
  }
  if(!act.length)return;
  spawnBudget=coarse?500:1600;
  const tx=controls.target.x,tz=controls.target.z,near=view.S*0.9;
  for(const Lv of levels){
    const v=Lv.v,K=Lv.K,NN=Lv.N;let changed=false,lo=1e9,hi=-1;
    const debris=Lv.li<=1;
    if(!Lv.stamp||Lv.stamp.length!==NN*NN)Lv.stamp=new Int32Array(NN*NN);
    const stampId=++sweepStamp;
    const todo=[];
    for(const a of act){
      const R=Math.max(a.hi,a.th?a.thR:0);
      const i0=clamp(Math.floor((a.b.x-R-Lv.cx)/v+NN/2),0,NN-1),i1=clamp(Math.floor((a.b.x+R-Lv.cx)/v+NN/2),0,NN-1);
      const j0=clamp(Math.floor((a.b.z-R-Lv.cz)/v+NN/2),0,NN-1),j1=clamp(Math.floor((a.b.z+R-Lv.cz)/v+NN/2),0,NN-1);
      if(a.b.x+R<Lv.cx-NN*v/2||a.b.x-R>Lv.cx+NN*v/2||a.b.z+R<Lv.cz-NN*v/2||a.b.z-R>Lv.cz+NN*v/2)continue;
      const lo2=a.th?0:a.lo;
      for(let j=j0;j<=j1;j++){
        const dz=Lv.cz+(j-NN/2+0.5)*v-a.b.z;
        for(let i=i0;i<=i1;i++){
          const ci=j*NN+i;if(Lv.stamp[ci]===stampId)continue;
          const dx=Lv.cx+(i-NN/2+0.5)*v-a.b.x,d2=dx*dx+dz*dz;
          if(d2>R*R||d2<=lo2*lo2)continue;
          Lv.stamp[ci]=stampId;todo.push(ci);
        }
      }
    }
    for(const ci of todo){
      if(Lv.skip[ci])continue;
      const wx=Lv.cx+Lv.colX[ci],wz=Lv.cz+Lv.colZ[ci];
      let hitB=null,shock=false;
      for(const a of act){
        const d=Math.hypot(wx-a.b.x,wz-a.b.z);
        if(d>a.lo&&d<=a.hi){hitB=a.b;shock=true;break;}
        if(a.th&&d<a.thR)hitB=a.b;
      }
      if(!hitB)continue;
      // remember what stood here
      const oldN=Lv.colN[ci],oldTop=Lv.oTop[ci];
      let nOld=0;
      for(let k=1;k<oldN;k++){const s=ci*K+k,o=oldSegs[nOld++];o.y0=Lv.cy0[s];o.y1=Lv.cy1[s];o.c[0]=Lv.ccol[s*3];o.c[1]=Lv.ccol[s*3+1];o.c[2]=Lv.ccol[s*3+2];o.cls=Lv.ccls[s];}
      Lv.sampleInto(ci);Lv.writeCol(ci);changed=true;if(ci<lo)lo=ci;if(ci>hi)hi=ci;
      if(!(shock&&debris&&spawnBudget>0&&nOld))continue;
      if(Math.abs(wx-tx)>near||Math.abs(wz-tz)>near)continue;   // only spend pieces where you can see them
      const newTop=Lv.oTop[ci],psi=DM.psi;
      if(oldTop-newTop<v*0.6&&!(psi>0.8&&psi<6))continue;
      const dx=wx-hitB.x,dz=wz-hitB.z,dd=Math.hypot(dx,dz)||1,ux=dx/dd,uz=dz/dd,pk=Math.min(1,psi/25);
      const main=oldSegs[0].cls,e=psi/STR[main],hot=DM.therm>1?0.5:0;
      const reg=hash2(Math.floor(wx/38),Math.floor(wz/38));   // roughly one building
      const isTree=main===C_TRUNK||main===C_CANOPY,light=main===C_CAR||main===C_SMALL||main===C_CROP;
      const heavy=main===C_TOWER||main===C_MID||main===C_HOUSE||main===C_STONE;
      if(DM.fb){ // vaporised: a few glowing scraps at most
        if(Math.random()<0.15){spawnBudget--;const o=oldSegs[nOld-1];spawn(wx,newTop+v,wz,ux*v*30,v*12,uz*v*30,v*0.4,v*0.4,o.c[0],o.c[1],o.c[2],0,v*45,1,0,4);}
        continue;
      }
      // windows blow out first, well before the structure gives
      if(heavy&&(main===C_TOWER||main===C_MID)&&psi>0.8&&v<3&&Math.random()<0.5){
        const n=Math.min(3,spawnBudget);
        for(let c=0;c<n;c++){spawnBudget--;const y=newTop>Lv.gTop[ci]+v?Lv.gTop[ci]+Math.random()*(Math.max(oldTop,newTop)-Lv.gTop[ci]):newTop;
          spawn(wx-ux*v*0.5,y,wz-uz*v*0.5,ux*v*(12+20*pk)*(0.6+Math.random()),v*(1+3*Math.random()),uz*v*(12+20*pk)*(0.6+Math.random()),v*0.14,v*0.05,0.55,0.68,0.78,0,v*45,0,0,8);}
      }
      if(oldTop-newTop<v*0.6)continue;
      // decide how this column comes down
      let mode;
      if(e>=12)mode=light?'throw':'blast';
      else if(isTree)mode='fell';
      else if(light)mode='throw';
      else if(heavy&&oldTop-newTop>v*5&&oldTop-newTop>12&&reg<0.4&&e<9)mode='topple';
      else mode='pancake';
      const H=oldTop-newTop,delay=mode==='blast'||mode==='throw'?0:0.12+0.6*reg+Math.random()*0.08;
      let gi=-1;
      if(mode==='topple'||mode==='fell'){
        const jitter=(reg-0.5)*0.6,ax=ux*Math.cos(jitter)-uz*Math.sin(jitter),az=uz*Math.cos(jitter)+ux*Math.sin(jitter);
        gi=newGroup(wx,newTop,wz,ax,az,H,mode==='fell'?0.05:delay,mode==='fell',v*45);
        if(gi<0)mode='pancake';
      }
      const maxPer=mode==='blast'?3:mode==='throw'?2:10;
      for(let k=0;k<nOld&&spawnBudget>0;k++){
        const o=oldSegs[k],from=Math.max(o.y0,newTop),L=o.y1-from;
        if(L<v*0.5)continue;
        const n=Math.max(1,Math.min(maxPer,Math.round(L/v))),ph=L/n;
        for(let c=0;c<n&&spawnBudget>0;c++){
          spawnBudget--;
          const yc=from+(c+0.5)*ph,col=o.c,w=v*0.97,hgt=Math.min(ph*0.97,v*6);
          if(mode==='topple'||mode==='fell'){
            const i=spawn(wx,yc,wz,0,0,0,w,ph*0.98,col[0],col[1],col[2],2,v*45,hot,0,mode==='fell'?60:45);
            if(i>=0){D.grp[i]=gi;D.oy[i]=yc-newTop;G.cnt[gi]++;}
          }else if(mode==='pancake'){
            // the floors above the failure drop together and spill downwind
            const sp=v*(1.5+5*pk)*(0.4+Math.random()),a=Math.random()*6.283,sd=v*(0.5+1.5*Math.random());
            spawn(wx+(Math.random()-0.5)*v*0.2,yc,wz+(Math.random()-0.5)*v*0.2,ux*sp+Math.cos(a)*sd,0,uz*sp+Math.sin(a)*sd,w*(0.6+0.5*Math.random()),Math.min(hgt*0.45,v*1.5),col[0],col[1],col[2],0,v*45,hot,delay+c*0.015,45);
          }else{
            const sp=v*(light?10+28*pk:8+34*pk)*(0.5+Math.random());
            spawn(wx+(Math.random()-0.5)*v,yc,wz+(Math.random()-0.5)*v,ux*sp+(Math.random()-0.5)*v*6,v*(4+16*Math.random())*(0.4+pk),uz*sp+(Math.random()-0.5)*v*6,
              v*(0.35+0.5*Math.random()),Math.min(hgt,v*(0.35+0.5*Math.random())),col[0],col[1],col[2],0,v*45,hot,0,light?40:20);
          }
        }
      }
      // collapse dust rolling out from the base of falling buildings
      if(heavy&&mode!=='blast'&&spawnBudget>0&&Math.random()<0.3){
        spawnBudget--;const dc=P.dust,sz=Math.min(H*0.25,v*1.2)*(0.6+0.5*Math.random());
        spawn(wx,newTop+sz*0.4,wz,ux*v*(1.5+3*pk)+(Math.random()-0.5)*v*2,v*0.3,uz*v*(1.5+3*pk)+(Math.random()-0.5)*v*2,sz,sz*0.7,dc[0]*0.95,dc[1]*0.93,dc[2]*0.9,3,0,0,delay+0.3,delay+6);
      }
      if(psi>2.5&&Math.random()<(Lv.li?0.02:0.05)&&spawnBudget>0){
        spawnBudget--;const c=P.dust;
        spawn(wx,Lv.gTop[ci]+v*0.5,wz,ux*v*(6+10*pk),v*(1+3*Math.random()),uz*v*(6+10*pk),v*0.35,v*0.35,c[0],c[1],c[2],1,0,0,0,3);
      }
    }
    if(changed)Lv.dirty(lo,hi);
  }
  for(const a of act){a.b.prevR=Math.max(a.b.prevR,a.hi);if(a.th)a.b.thermalDone=true;}
}

   Sound
   ===================================================================== */
let actx=null,soundOn=true;
function ensureAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function boom(str,big){
  if(!soundOn||!actx||str<=0.01)return;
  const t=actx.currentTime,dur=0.8+4*big,len=Math.floor(actx.sampleRate*dur);
  const buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
  let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.05*w)/1.05;d[i]=last*3.2;}
  const src=actx.createBufferSource();src.buffer=buf;
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=160+900*(1-big);
  const g=actx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.001,str),t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(lp).connect(g).connect(actx.destination);src.start(t);
  const o=actx.createOscillator(),og=actx.createGain();o.frequency.setValueAtTime(55,t);o.frequency.exponentialRampToValueAtTime(28,t+dur*0.6);
  og.gain.setValueAtTime(str*0.7,t);og.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.7);o.connect(og).connect(actx.destination);o.start(t);o.stop(t+dur);
  if(str>0.35){
    const cl=Math.floor(actx.sampleRate*0.18),cb=actx.createBuffer(1,cl,actx.sampleRate),cd=cb.getChannelData(0);
    for(let i=0;i<cl;i++)cd[i]=(Math.random()*2-1)*Math.pow(1-i/cl,3);
    const cs=actx.createBufferSource();cs.buffer=cb;const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;
    const cg=actx.createGain();cg.gain.value=str*0.5;cs.connect(hp).connect(cg).connect(actx.destination);cs.start(t);
  }
}

function fmtDist(m){
  if(m<=0)return '—';
  if(m<0.001)return (m*1e6).toFixed(m<1e-5?1:0)+' µm';
  if(m<0.01)return (m*1000).toFixed(1)+' mm';
  if(m<1)return (m*100).toFixed(m<0.1?1:0)+' cm';
  if(m<10)return m.toFixed(1)+' m';
  if(m<1000)return m.toFixed(0)+' m';
  if(m<10000)return (m/1000).toFixed(2)+' km';
  if(m<100000)return (m/1000).toFixed(1)+' km';
  return (m/1000).toFixed(0)+' km';
}
function fmtYield(kt){
  if(kt<1e-9)return +(kt*1e12).toPrecision(3)+' mg';
  if(kt<1e-6)return +(kt*1e9).toPrecision(3)+' g';
  if(kt<1e-3)return +(kt*1e6).toPrecision(3)+' kg';
  if(kt<1)return +(kt*1e3).toPrecision(3)+' t';
  if(kt<1000)return +kt.toPrecision(3)+' kt';
  if(kt<1e6)return +(kt/1000).toPrecision(3)+' Mt';
  if(kt<1e9)return +(kt/1e6).toPrecision(3)+' Gt';
  if(kt<1e12)return +(kt/1e9).toPrecision(3)+' Tt';
  const e=Math.floor(Math.log10(kt*1e3)),m=kt*1e3/Math.pow(10,e);
  const sup=String(e).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('');

    heat=(lastBlast.nuc?1:0.5)*Math.exp(-t/(lastBlast.nuc?2:0.5));
    flashLight.position.set(lastBlast.x,lastBlast.gH+Math.max(lastBlast.hb,lastBlast.Rfb*0.5),lastBlast.z);
    flashLight.distance=Math.max(lastBlast.Rth,lastBlast.Rfb*25)*2;
    flashLight.intensity=heat*14+fl*40;
    // hearing and feeling the shock at the crosshair
    const dT=Math.hypot(controls.target.x-lastBlast.x,controls.target.z-lastBlast.z);
    if(!lastBlast.heard&&(lastBlast.rShock>=dT||lastBlast.done)){
      lastBlast.heard=true;
      const p=lastBlast.done&&lastBlast.rShock<dT?0.2:lastBlast.psiAt(dT);
      const s=clamp(Math.log10(1+p)/1.6,0.08,1);
      boom(s*0.9,clamp(Math.log10(lastBlast.kt*1e6)/11,0,1));
      shake=Math.max(shake,s);
    }
  }else flashLight.intensity=0;
  extraFlash*=Math.exp(-dt*6);
  flashEl.style.opacity=clamp(Math.max(fl,extraFlash),0,1);
  skyNow.copy(SKY).lerp(new THREE.Color(0xffc38a),clamp(heat*0.35,0,0.5)).lerp(SPACE,focus!=='ground'?1:smooth(3e6,1.6e7,view.S));
  scene.fog.color.copy(skyNow);
  hemi.intensity=1.1+fl*3;

  for(const L of levels)L.mat.userData.u.uTime.value=now/1000;
  boxMat.userData.u.uTime.value=now/1000;

  ringGroup.position.set(controls.target.x,controls.target.y+grid.v*0.6,controls.target.z);

  if(now-hudT>100){
    hudT=now;
    const v=grid.v;
    $('scaleVal').textContent='View '+fmtDist(view.S);
    $('scaleLbl2').textContent='1 block = '+fmtDist(v)+'  ·  view '+fmtDist(view.S);
    if(document.activeElement!==$('scale'))$('scale').value=sToSlider(view.S);
    if(lastBlast&&lastBlast.cloud){
      const rt=lastBlast.done?lastBlast.tEnd:lastBlast.realTime();
      const k=lastBlast.k*speed;
      const ks=k>=1?`×${k>=100?k.toFixed(0):k.toFixed(1)} speed`:`${(1/k).toFixed(k>0.01?1:0)}× slow-motion`;
      $('time').textContent=lastBlast.done?`${lastBlast.name}: shock front ${fmtDist(lastBlast.rEnd)} out at T+${fmtTime(rt)}`:
        `${lastBlast.name}: T+${fmtTime(rt)} · front ${fmtDist(lastBlast.rShock)} · ${ks}`;
    }else $('time').textContent='';
  }

}

/* the panel covers the bottom of the screen: shift the picture up so ground zero sits under the crosshair */
function fitCamera(){
  camera.aspect=innerWidth/innerHeight;
  const ph=$('panel').offsetHeight+10,top=parseFloat(getComputedStyle($('top')).top)||10;
  const cy=Math.max(innerHeight*0.25,(innerHeight-ph+top+40)/2);
  $('cross').style.top=cy+'px';
  camera.setViewOffset(innerWidth,innerHeight,0,innerHeight/2-cy,innerWidth,innerHeight);
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',fitCamera);fitCamera();
if(window.ResizeObserver)new ResizeObserver(fitCamera).observe($('panel'));

buildChips();buildTargets();
select(BOMBS.findIndex(b=>b.n==='TNT block'),false);
fitView();view.S=view.targetS;setDist(view.S*DIST);view.targetS=null;
maybeRegen(performance.now(),true);
requestAnimationFrame(frame);
/* =====================================================================
   HUD: live counts, toasts, missions
   ===================================================================== */
let gameOn=true;
function toast(msg,cls){
  const box=$('toasts');if(!box)return;
  const el=document.createElement('div');el.className='toast'+(cls?' '+cls:'');el.textContent=msg;
  box.appendChild(el);setTimeout(()=>el.remove(),2500);
}
let shownC=0,shownI=0,shownB=0,shownV=0;
function updateHUD(){
  $('stats').style.display=gameOn?'flex':'none';
  $('mission').style.display=gameOn?'block':'none';
  if(!gameOn)return;
  const t=tally();
  // ease displayed numbers toward the real total so they tick up
  shownC+=(t.c-shownC)*0.3;shownI+=(t.i-shownI)*0.3;shownB+=(t.b-shownB)*0.3;shownV+=(t.v-shownV)*0.3;
  if(t.c-shownC<1)shownC=t.c;if(t.i-shownI<1)shownI=t.i;if(t.b-shownB<1)shownB=t.b;
  const est=estimateHere();
  $('sDead').textContent=fmtCount(shownC)+(est&&est.c>1?' +'+fmtCount(est.c):'');
  $('sInj').textContent=fmtCount(shownI);
  $('sBld').textContent=fmtCount(shownB);
  $('sCost').textContent=fmtMoney(shownV);
}

const MISSIONS=[
  {n:'Anthill',d:'Kill 20 ants with a bang snap.',bomb:'Bang snap',go:'Ants',ok:()=>stats.ants>=20},
  {n:'Clean the cupholder',d:'Blow the crumbs out of the cupholder.',bomb:'Toy gun cap',go:'Cupholder crumbs',ok:()=>psiAtPoint(-8.64,-6)>=5},
  {n:'Flip the convertible',d:'Hit the park convertible with 5 psi.',bomb:'M-80',go:'Convertible',ok:()=>psiAtPoint(-9,-6)>=5},
  {n:'Chain reaction',d:'Set off 3 gas stations or tanks from one shot.',bomb:'Hand grenade',go:'City',ok:()=>stats.chainBest>=3},
  {n:'Fuel depot',d:'Cook off all nine fuel tanks.',bomb:'Mk 84 bomb',go:'Fuel depot',ok:()=>stats.tanks.size>=9},
  {n:'Topple the tower',d:'Bring down the 828 m supertall.',bomb:'Mk 84 bomb',go:'828 m supertall',ok:()=>psiAtPoint(300,200)>=5},
  {n:'Flatten downtown',d:'250,000 casualties in one go.',bomb:'W76-1',go:'City',ok:()=>tally().c>=250000},
  {n:'City killer',d:'One million casualties.',bomb:'B83',go:'City',ok:()=>tally().c>=1e6},
  {n:'Moon shot',d:'Crater the Moon.',bomb:'Cherry bomb',go:'Moon',ok:()=>moon.flying.length>0||!!moon.brk},
  {n:'Break the Moon',d:'Shatter the Moon.',bomb:'Moon shatterer',go:'Moon',ok:()=>!!moon.brk},
  {n:'Red planet',d:'Shatter Mars.',bomb:'Mars shatterer',go:'Mars',ok:()=>!!(bodies.mars&&bodies.mars.brk)},
  {n:'The end',d:'Destroy the Earth.',bomb:'Earth shatterer',go:'Whole Earth',ok:()=>!!earth.brk},
];
let mIndex=0,mDone=false;
function showMission(){
  const m=MISSIONS[mIndex];
  $('mNo').textContent=(mIndex+1)+'/'+MISSIONS.length;
  $('mName').textContent=m.n;$('mDesc').textContent=m.d;
  $('mStatus').textContent='';$('mission').classList.remove('done');
  mDone=false;
}
function missionCheck(){
  if(mDone||!gameOn)return;
  const m=MISSIONS[mIndex];
  if(m.ok()){
    mDone=true;$('mission').classList.add('done');$('mStatus').textContent='Complete! Tap Next.';
    $('mSkip').textContent='Next ▶';toast('Mission complete: '+m.n,'win');
  }
}
function gotoTarget(name){const el=[...$('targets').children].find(c=>c.textContent.includes(name));if(el)el.click();}
function nextMission(){mIndex=(mIndex+1)%MISSIONS.length;$('mSkip').textContent='Skip';showMission();}
$('mGo').onclick=()=>{const m=MISSIONS[mIndex];const bi=BOMBS.findIndex(b=>b.n.includes(m.bomb));if(bi>=0)select(bi,false);gotoTarget(m.go);};
$('mSkip').onclick=()=>{nextMission();};
$('bGame').onclick=e=>{gameOn=!gameOn;e.target.classList.toggle('on',gameOn);updateHUD();};
showMission();

window.__sim={D,blasts,view,levels,select,detonate,controls,camera,setSpeed:s=>speed=s,fit:fitView,
  advance:(sec)=>{let n=Math.ceil(sec*30),t=performance.now();while(n--){t+=1000/30;step(1/30,t);}},
  regenMs:()=>{const t=performance.now();regen();return performance.now()-t;}};
</script>
