const AWARDS = [
  { id:'first',   n:'First Blood',   d:'Paint your first mark',
    ok:s => s.cleared >= 1 },
  { id:'crack',   n:'Crack Shot',    d:'Complete 10 rooms using only one doll',
    ok:s => s.oneShot >= 10 },
  { id:'marks',   n:'Marksman',      d:'Complete 25 rooms',
    ok:s => s.cleared >= 25 },
  { id:'deadeye', n:'Dead Eye',      d:'Complete 60 rooms',
    ok:s => s.cleared >= 60 },
  { id:'cups25',  n:'Cabinet Maker', d:'Win 25 cups',
    ok:s => s.cups >= 25 },
  { id:'cups100', n:'Collector',     d:'Win 100 cups',
    ok:s => s.cups >= 100 },
  { id:'wing',    n:'Clean Sweep',   d:'Take every cup in one wing',
    ok:s => s.perfectWing >= 1 },
  { id:'powder',  n:'Powder Monkey', d:'Set off 15 kegs',
    ok:s => s.kegs >= 15 },

// "achievements are gained each time an entire room is completed"
for(let w=0; w<WORLDS.length; w++){
  const nm = WORLDS[w].name;
  AWARDS.push({ id:'room'+w, n:nm + ' Cleared', d:'Complete every room in ' + nm,
                ok:(s,i=w)=>s.rooms[i] });
}

const Awards = {
  pending: [],
  stats(){
    const d = Save.data;
    d.stats = d.stats || {};
    const st = d.stats;
    let cleared = 0, cups = 0, oneShot = 0;
    for(const k in d.best){ cleared++; cups += d.best[k].c; if(d.best[k].u <= 1) oneShot++; }
    let perfectWing = 0;
    for(let w=0; w<WORLDS.length; w++){
      const W = WORLDS[w];
      let all = true;
      for(let i=W.from;i<W.to;i++) if(Save.cups(i) < 3){ all = false; break; }
      if(all) perfectWing++;
    }
    const rooms = WORLDS.map(W=>{
      for(let i=W.from;i<W.to;i++) if(!Save.cleared(i)) return false;
      return true;
    });
    return { cleared, cups, oneShot, perfectWing, rooms,
             kegs:st.kegs|0, panes:st.panes|0, longest:st.longest|0, fired:st.fired|0 };
  },
  bump(key, by){
    const d = Save.data;
    d.stats = d.stats || {};
    d.stats[key] = (d.stats[key]|0) + (by === undefined ? 1 : by);
    Save.write();
  },
  best(key, val){
    const d = Save.data;
    d.stats = d.stats || {};
    if(val > (d.stats[key]|0)){ d.stats[key] = Math.round(val); Save.write(); }
  },
  earned(id){ return !!(Save.data.awards && Save.data.awards[id]); },
  count(){ let n=0; for(const a of AWARDS) if(this.earned(a.id)) n++; return n; },
  check(){
    const s = this.stats();
    Save.data.awards = Save.data.awards || {};
    for(const a of AWARDS){
      if(!Save.data.awards[a.id] && a.ok(s)){
        Save.data.awards[a.id] = true;
        this.pending.push(a);
      }
    }
    if(this.pending.length) Save.write();
    return this.pending.length;
  }
};

  g.fillStyle=gr; rr(g,x,y+(on?2:0),w,h,9); g.fill();
  g.strokeStyle = opt.plate  ? 'rgba(238,238,236,0.92)'
                : opt.accent ? 'rgba(255,236,190,0.8)' : 'rgba(226,190,126,0.5)';
  g.lineWidth = opt.plate ? 2.4 : 1.8;
  rr(g,x+1.4,y+1.4+(on?2:0),w-2.8,h-2.8,8); g.stroke();
  label(g, text, x+w/2, y+h/2+(on?2:0)+1, opt.size||21,
        opt.plate ? '#ffffff' : opt.accent ? '#2a1a08' : '#f0dcb4', 'center', 'bold', !opt.accent);
  g.restore();
  if(st.clicked && !dis) Audio.click();
  return st.clicked && !dis;
}
function drawCup(g,x,y,s,filled){
  // a goblet, as the original had it: wide bowl, slim stem, round foot
  g.save(); g.translate(x,y); g.scale(s,s);
  g.globalAlpha = filled ? 1 : 0.22;
  const gold = g.createLinearGradient(-8,-10,8,10);
  if(filled){
    gold.addColorStop(0,'#fff2c4'); gold.addColorStop(0.32,'#f0cd76');
    gold.addColorStop(0.62,'#c99a35'); gold.addColorStop(1,'#8a641a');
  } else {
    gold.addColorStop(0,'#8d8168'); gold.addColorStop(1,'#4a4232');
  }
  g.strokeStyle = filled ? 'rgba(74,48,10,0.75)' : 'rgba(30,26,18,0.7)';
  g.lineWidth = 1.1;
  // bowl
  g.fillStyle = gold;
  g.beginPath();
  g.moveTo(-7.6,-8.4);
  g.lineTo(7.6,-8.4);
  g.bezierCurveTo(7.2,1.2, 4.4,5.6, 0,5.9);
  g.bezierCurveTo(-4.4,5.6, -7.2,1.2, -7.6,-8.4);
  g.closePath(); g.fill(); g.stroke();
  // the wine line across the top
  g.fillStyle = filled ? 'rgba(255,248,214,0.55)' : 'rgba(255,255,255,0.12)';
  g.beginPath(); g.ellipse(0,-8.2,7.5,1.9,0,0,TAU); g.fill();
  g.strokeStyle = filled ? 'rgba(74,48,10,0.5)' : 'rgba(30,26,18,0.4)';
  g.beginPath(); g.ellipse(0,-8.2,7.5,1.9,0,0,TAU); g.stroke();
  // stem
  g.fillStyle = gold;
  g.beginPath();
  g.moveTo(-1.5,5.7); g.lineTo(1.5,5.7); g.lineTo(1.9,8.6); g.lineTo(-1.9,8.6);
  g.closePath(); g.fill();
  // knop
  g.beginPath(); g.ellipse(0,6.8,2.5,1.5,0,0,TAU); g.fill();
  // foot
  g.beginPath();
  g.moveTo(-5.6,10.4); g.lineTo(5.6,10.4);
  g.bezierCurveTo(4.2,8.4, 2.4,8.6, 0,8.6);
  g.bezierCurveTo(-2.4,8.6, -4.2,8.4, -5.6,10.4);
  g.closePath(); g.fill();
  g.strokeStyle = filled ? 'rgba(74,48,10,0.75)' : 'rgba(30,26,18,0.7)';
  g.beginPath(); g.ellipse(0,10.3,5.6,1.5,0,0,TAU); g.fill(); g.stroke();
  // a highlight down the bowl
  if(filled){
    g.fillStyle='rgba(255,255,255,0.42)';
    g.beginPath(); g.ellipse(-3.4,-3.4,1.5,3.6,0.16,0,TAU); g.fill();
  }
  g.globalAlpha = 1; g.restore();
}
function drawDollIcon(g,x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  const skin='#f0e6cf', shade2='#c4b593', ink='rgba(58,46,30,0.55)';

    g.fillStyle=skin; rr(g,lx,ly,lw,lh,r); g.fill(); g.stroke();

  limb( 0.3, 5.6,2.6,7.4,1.2);
  limb(-3.1,-3.4,6.2,9.4,2.0);
  g.fillStyle=skin; g.beginPath(); g.arc(0,-7.4,4.0,0,TAU); g.fill(); g.stroke();
  g.fillStyle=shade2; g.beginPath(); g.arc(0,-6.4,3.2,0.2,PI-0.2); g.fill();
  g.fillStyle='rgba(255,255,255,0.6)'; g.beginPath(); g.arc(-1.3,-8.6,1.3,0,TAU); g.fill();
  g.fillStyle='#3d3225';
  g.beginPath(); g.arc(-1.4,-7.6,0.62,0,TAU); g.fill();

}

/* =====================================================================
   12. GAME
   ===================================================================== */
const Game = {
  state:'boot', prev:null, t:0, fade:1, fadeDir:-1, next:null,
  level:null, levelIdx:0, world:0,
  aiming:false, aimA:0, aimP:0, arc:[], arcT:0,
  result:null, resultT:0, hint:0, slow:1, msg:'', msgT:0,

  go(state){ this.state = state; this.t = 0; },
  transition(fn){ this.fadeDir = 1; this.next = fn; },

  startLevel(i){
    this.levelIdx = clamp(i, 0, LEVELS.length-1);
    this.world = WORLDS.findIndex(w => this.levelIdx >= w.from && this.levelIdx < w.to);
    if(this.world < 0) this.world = 0;
    FX.reset();
    this.level = new Level(LEVELS[this.levelIdx], this.levelIdx);
    this.aimA = this.level.cannon.a;
    this.aimP = 0.75;
    this.arc = [];
    this.result = null; this.resultT = 0; this.slow = 1;
    this.hint = Save.data.seen ? 0 : 4.5;
    // The counters can fade when a mark sits under them, but the buttons
    // cannot, so the whole row moves to the other edge when a mark would
    // land beneath MENU and restart. This is what the original does.
    const over = (t,x1,y1,x2,y2) =>
      t.x + t.r > x1 && t.x - t.r < x2 && t.y + t.r > y1 && t.y - t.r < y2;
    // The buttons and the counters move independently. Relocating a control
    // the player is reaching for is worse than leaving it be, so the button
    // row only ever moves for a mark sitting under the buttons themselves;
    // the read-only counters move freely, because the par has to stay legible.
    // The two always end up on opposite corners, so they cannot collide.
    let bBot = false, bTop = false, cBot = false, cTop = false;
    for(const t of this.level.targets){
      if(over(t, 8, 570, 196, 634))    bBot = true;  // buttons, bottom left
      if(over(t, DW-190, 4, DW-8, 62)) bTop = true;  // buttons, top right
      if(over(t, 700, 558, 952, 636))  cBot = true;  // counters, bottom right
      if(over(t, 8, 2, 296, 76))       cTop = true;  // counters, top left
    }
    this.btnTop = bBot && !bTop;
    this.cntTop = cBot && !cTop;
    Audio.setTune(this.world);
    Audio.setTheme(this.level.theme);
    this.go('play');
  },
  retry(){ this.startLevel(this.levelIdx); },
  nextLevel(){
    if(this.levelIdx+1 < LEVELS.length) this.startLevel(this.levelIdx+1);
    else { this.go('finale'); }
  },

  /* ------------------------------------------------- play */
  updatePlay(dt){
    const L = this.level, C = L.cannon;
    C.recoil = Math.max(0, C.recoil - dt*4.5);

    const hudZone = this.btnTop ? (IN.y < 70 && IN.x > DW-200) : (IN.y > DH-70 && IN.x < 200);
    if(!this.result){
      if(IN.down && !hudZone){
        const dx = IN.x - C.x, dy = IN.y - C.y;
        const d = Math.hypot(dx,dy);
        if(d > 26){
          let a = Math.atan2(dy,dx);
          this.aimA = a;
          this.aimP = Save.data.classic ? 1 : clamp((d - 30)/230, 0.25, 1);
          this.aiming = true;
        }
      } else if(this.aiming){
        this.aiming = false;
        if(L.canFire()){
          L.fire(this.aimA, this.aimP);
          Save.data.seen = true; Save.write();
          this.hint = 0;
        }
      }
      if(KEY['ArrowUp'])   this.aimA -= dt*1.1;
      if(KEY['ArrowDown']) this.aimA += dt*1.1;
      if(KEY['ArrowLeft']) this.aimP = clamp(this.aimP - dt*0.6, 0.12, 1);
      if(KEY['ArrowRight'])this.aimP = clamp(this.aimP + dt*0.6, 0.12, 1);
      if(KEY[' '] && !this._sp){ this._sp = true; if(L.canFire()) L.fire(this.aimA,this.aimP); }
      if(!KEY[' ']) this._sp = false;
    }
    this.aimA = clamp(this.aimA, C.lo, C.hi);
    C.a = lerp(C.a, this.aimA, Math.min(1, dt*16));
    C.charge = this.aiming ? this.aimP : lerp(C.charge, 0, Math.min(1,dt*8));

    const won = L.update(dt * this.slow);

    if(!this.result){
      if(won){
        this.result = 'win';
        this.resultT = 0;
        this.slow = 0.35;
        const cups = L.cups(L.used);
        Save.record(this.levelIdx, L.used, cups);
        const tg0 = L.targets.find(q=>q.hit) || L.targets[0];
        if(tg0) Awards.best('longest', dist(L.cannon.x, L.cannon.y, tg0.x, tg0.y));
        Awards.check();
        Audio.win();
        FX.flash = 0.7; FX.flashCol = '255,240,190';
        for(let i=0;i<44;i++){
          FX.add({ x:rnd(0,DW), y:rnd(-60,120), vx:rnd(-90,90), vy:rnd(60,220),
                   life:0, max:rnd(1.6,3.0), size:rnd(2.5,5.5),
                   col:pick(['#ffd97a','#ff8f6a','#8fd9ff','#c8ff9a','#f2e6cd']),
                   type:'chip', rot:rnd(0,TAU), rv:rnd(-8,8), g:0.22, drag:0.6 });
        }
      }
    } else {
      this.resultT += dt;
      if(this.result === 'win'){
        this.slow = lerp(this.slow, 1, dt*1.2);
        if(this.resultT > 0.42) L.collapse();
      }
    }

    if(this.hint > 0) this.hint -= dt;
    if(this.msgT > 0) this.msgT -= dt;
  },

  flash(m){ this.msg = m; this.msgT = 1.6; },

  drawPlay(g){
    const L = this.level;
    L.draw(g);

    /* aiming furniture */
    if(!this.result && L.canFire()){
      const C = L.cannon;
      if(this.aiming || this.hint > 0){
        const showA = this.aiming ? this.aimA : C.a;
        const showP = this.aiming ? this.aimP : 0.75;
        if(Save.data.guide !== false){
          const pts = L.previewArc(showA, showP, 100);
          g.save();
          for(let i=4;i<pts.length;i+=4){
            const f = 1 - i/pts.length;
            const r = 3.4*(0.45+f*0.75);
            g.globalAlpha = (0.30 + f*0.55) * 0.55;
            g.fillStyle = '#1a1004';
            g.beginPath(); g.arc(pts[i].x, pts[i].y+1, r+1.2, 0, TAU); g.fill();
            g.globalAlpha = 0.30 + f*0.60;
            g.fillStyle = '#ffe6b0';
            g.beginPath(); g.arc(pts[i].x, pts[i].y, r, 0, TAU); g.fill();
          }
          g.restore();
        }
        // laser sight: a straight beam from the muzzle to the first thing it meets
        if(Save.data.laser){
          const mx2 = C.x + Math.cos(showA)*46, my2 = C.y + Math.sin(showA)*46;
          const fx = mx2 + Math.cos(showA)*2400, fy = my2 + Math.sin(showA)*2400;
          const hit = L.world.raycastAny(mx2,my2,fx,fy, b=>b.fixed && !b.sensor);
          const ex = hit ? hit.x : fx, ey = hit ? hit.y : fy;
          g.save();
          g.globalCompositeOperation='lighter';
          g.strokeStyle='rgba(255,40,40,0.22)'; g.lineWidth=5;
          g.beginPath(); g.moveTo(mx2,my2); g.lineTo(ex,ey); g.stroke();
          g.strokeStyle='rgba(255,120,110,0.9)'; g.lineWidth=1.5;
          g.beginPath(); g.moveTo(mx2,my2); g.lineTo(ex,ey); g.stroke();
          if(hit){
            g.fillStyle='rgba(255,70,60,0.85)';
            g.beginPath(); g.arc(ex,ey,4.5,0,TAU); g.fill();
            g.fillStyle='rgba(255,190,180,0.9)';
            g.beginPath(); g.arc(ex,ey,1.8,0,TAU); g.fill();
          }
          g.restore();
        }
        // power arc on the muzzle
        g.save(); g.translate(C.x, C.y);
        g.strokeStyle='rgba(255,220,150,0.22)'; g.lineWidth=7;
        g.beginPath(); g.arc(0,0,58,showA-0.9,showA+0.9); g.stroke();
        g.strokeStyle='rgba(255,196,90,0.85)'; g.lineWidth=7;
        g.beginPath(); g.arc(0,0,58,showA-0.9, showA-0.9 + 1.8*showP); g.stroke();
        g.restore();
      }
      if(this.aiming){
        const x = IN.x, y = IN.y;
        g.save(); g.lineCap='butt';
        const cross = ()=>{
          g.beginPath(); g.arc(x,y,21,0,TAU); g.stroke();
          g.beginPath();
          g.moveTo(x-58,y); g.lineTo(x-27,y); g.moveTo(x+27,y); g.lineTo(x+58,y);
          g.moveTo(x,y-58); g.lineTo(x,y-27); g.moveTo(x,y+27); g.lineTo(x,y+58);
          g.stroke();
        };
        g.strokeStyle='rgba(20,14,6,0.45)'; g.lineWidth=4.5; cross();
        g.strokeStyle='rgba(240,238,230,0.92)'; g.lineWidth=2.2; cross();
        g.restore();
      }
    }

    if(this.hint > 0 && !this.aiming){
      const a = clamp(this.hint/1.4, 0, 1);
      g.save(); g.globalAlpha = a;
      label(g, 'Drag to aim  ·  further out for more powder', DW/2, 112, 23, '#ffe9be');
      label(g, 'Release to fire', DW/2, 144, 19, 'rgba(255,233,190,0.7)');
      // the counter is easy to misread as a ration, so say it once, up front
      if(this.levelIdx === 0)
        label(g, 'Dolls never run out · the counter is the par for three cups',
              DW/2, 174, 17, 'rgba(255,233,190,0.55)');
      g.restore();
    }

    this.drawHUD(g);
  },

  drawHUD(g){
    const L = this.level;
    const top = this.btnTop;      // button row and the name banner
    const cTop = this.cntTop;     // counters
    // the room announces itself, then leaves the screen alone
    const nameA = clamp(3.0 - L.time, 0, 1) * (this.result ? 0 : 1);
    if(nameA > 0.01){
      g.save(); g.globalAlpha = nameA;
      g.fillStyle='rgba(12,8,4,0.5)';
      const nby = top ? DH-54 : 12;
      rr(g, DW/2-176, nby, 352, 40, 10); g.fill();
      g.strokeStyle='rgba(226,190,126,0.26)'; g.lineWidth=1.4;
      rr(g, DW/2-176, nby, 352, 40, 10); g.stroke();
      label(g, `${this.levelIdx+1}.  ${L.name}`, DW/2, nby+21, 20, '#f0dcb4');
      g.restore();
    }

    // menu + restart, on whichever edge the room leaves clear
    const by = top ? 12 : DH-58;                       // button row
    const mx = top ? DW-122 : 14;                      // MENU x
    const rx = top ? DW-182 : 134;                     // restart x
    if(button(g, mx, by, 108, 44, 'MENU', {plate:true})) this.transition(()=>this.go('levels'));
    const rs = uiHit(rx, by, 52, 44);
    g.save();
    g.fillStyle='rgba(0,0,0,0.45)'; rr(g,rx+2,by+4,52,44,9); g.fill();
    const gr=g.createLinearGradient(0,by,0,by+44);
    gr.addColorStop(0, rs.over?'#3a352f':'#1e1b17'); gr.addColorStop(1, rs.over?'#211e1a':'#0d0b09');
    g.fillStyle=gr; rr(g,rx,by+(rs.over?2:0),52,44,9); g.fill();
    g.strokeStyle='rgba(238,238,236,0.92)'; g.lineWidth=2.4;
    rr(g,rx+1.4,by+1.4+(rs.over?2:0),49.2,41.2,8); g.stroke();
    g.translate(rx+26, by+22+(rs.over?2:0));
    g.strokeStyle='#ffffff'; g.lineWidth=3; g.lineCap='round';
    g.beginPath(); g.arc(0,0,11,0.7,TAU-0.5); g.stroke();
    g.fillStyle='#ffffff';
    g.beginPath(); g.moveTo(9,-10); g.lineTo(14,1); g.lineTo(3,0.5); g.closePath(); g.fill();
    g.restore();
    if(rs.clicked){ Audio.click(); this.retry(); }

    // the counters take the opposite corner to the buttons, as the original does
    const cy = cTop ? 34 : DH-36;
    const cxR = cTop ? 250 : DW - 20;
    // a safety net for a room that leaves neither corner clear
    let hudA = 1;
    const zx1 = cTop ? 6 : 712, zx2 = cTop ? 296 : 954;
    const zy1 = cTop ? 0 : 556, zy2 = cTop ? 78 : 640;
    for(const tg of L.targets){
      if(tg.x + tg.r > zx1 && tg.x - tg.r < zx2 && tg.y + tg.r > zy1 && tg.y - tg.r < zy2){
        hudA = tg.hit ? 0.74 : 0.56; break;
      }
    }
    this.hudA = lerp(this.hudA === undefined ? 1 : this.hudA, hudA, 0.12);
    g.save();
    g.globalAlpha = this.hudA;
    const num = (txt,cx2,col)=>{
      g.font = "bold 31px Georgia, 'Times New Roman', serif";
      g.textAlign='right'; g.textBaseline='middle';
      g.lineWidth=3.4; g.lineJoin='round';
      g.strokeStyle='rgba(18,11,5,0.85)'; g.strokeText(txt, cx2, cy);
      g.fillStyle=col; g.fillText(txt, cx2, cy);
    };
    let x = cxR;
    const tot = Save.totalCups();
    num('x ' + (tot > 0 ? tot : '-'), x, '#fdf6e6');
    drawCup(g, x - 62, cy-1, 1.75, true);
    // dolls used against par. Going over is allowed -- it only costs cups --
    // so the number warms rather than turning red. The count grows without
    // bound, so the icon is placed off the measured text, not a fixed offset.
    x -= 96;
    const left = Math.max(0, L.par - L.used);
    const dtxt = 'x ' + left;
    num(dtxt, x, left > 0 ? '#fdf6e6' : '#ffcf9a');
    g.font = "bold 31px Georgia, 'Times New Roman', serif";
    drawDollIcon(g, x - g.measureText(dtxt).width - 24, cy-1, 1.7);
    g.restore();

    if(this.msgT > 0){
      g.save(); g.globalAlpha = clamp(this.msgT,0,1);
      label(g, this.msg, DW/2, DH-96, 22, '#ffcf9a');
      g.restore();
    }

    // result cards. A new award takes the screen first.
    if(this.result === 'win' && this.resultT > 2.35){
      if(Awards.pending.length) this.drawAward(g, Awards.pending[0]);
      else this.drawWin(g);
    }
  },

  /* the New Award plate: riveted iron, chains, and the doll on his podium */
  drawAward(g, a){
    const t = clamp((this.resultT-2.35)/0.3, 0, 1), e = easeOut(t);
    const w = 520, h = 300, x = DW/2-w/2, y = DH/2-h/2-10;
    g.save();
    g.globalAlpha = e*0.62; g.fillStyle='#000'; g.fillRect(0,0,DW,DH);
    g.globalAlpha = e;
    // iron plate
    g.fillStyle='rgba(0,0,0,0.5)'; rr(g,x+4,y+6,w,h,10); g.fill();
    const pg=g.createLinearGradient(0,y,0,y+h);
    pg.addColorStop(0,'#6a5540'); pg.addColorStop(0.5,'#4a3a2a'); pg.addColorStop(1,'#2e241a');
    g.fillStyle=pg; rr(g,x,y,w,h,10); g.fill();
    g.strokeStyle='#1a120a'; g.lineWidth=2.4; rr(g,x,y,w,h,10); g.stroke();
    for(let i=0;i<7;i++){
      rivet(g, x+16, y+22+i*((h-44)/6), 3.4, '#e8d4a8','#241a10');
      rivet(g, x+w-16, y+22+i*((h-44)/6), 3.4, '#e8d4a8','#241a10');
    }
    label(g,'NEW AWARD', DW/2, y+40, 30, '#f6ead0');
    // chains either side of the frame
    const fy = y+118, fs = 74;
    for(const dir of [-1,1]){
      for(let i=0;i<5;i++){
        const cx2 = DW/2 + dir*(fs*0.72 + 24 + i*26);
        const flat = i % 2 === 1;
        g.save(); g.translate(cx2, fy);
        const rx = flat ? 9 : 15, ry = flat ? 15 : 9;
        // shadow, body, then a highlight along the top of the link
        g.strokeStyle='rgba(0,0,0,0.45)'; g.lineWidth=9;
        g.beginPath(); g.ellipse(1.5,2, rx, ry, 0,0,TAU); g.stroke();
        const lg2 = g.createLinearGradient(0,-ry,0,ry);
        lg2.addColorStop(0,'#cdbb9a'); lg2.addColorStop(0.45,'#8e7d63');
        lg2.addColorStop(1,'#4c4032');
        g.strokeStyle=lg2; g.lineWidth=8;
        g.beginPath(); g.ellipse(0,0, rx, ry, 0,0,TAU); g.stroke();
        g.strokeStyle='rgba(255,240,210,0.45)'; g.lineWidth=2;
        g.beginPath(); g.ellipse(-0.8,-1.2, rx, ry, 0,-0.2,PI*0.9); g.stroke();
        g.strokeStyle='#2e2519'; g.lineWidth=1.2;
        g.beginPath(); g.ellipse(0,0, rx+3.6, ry+3.6, 0,0,TAU); g.stroke();
        g.beginPath(); g.ellipse(0,0, Math.max(1,rx-3.6), Math.max(1,ry-3.6), 0,0,TAU); g.stroke();
        g.restore();
      }
    }
    // the framed icon
    g.fillStyle='#c8a86a'; rr(g, DW/2-fs/2-7, fy-fs/2-7, fs+14, fs+14, 9); g.fill();
    g.strokeStyle='#6a4f24'; g.lineWidth=2; rr(g, DW/2-fs/2-7, fy-fs/2-7, fs+14, fs+14, 9); g.stroke();
    g.fillStyle='#f6f0e2'; rr(g, DW/2-fs/2, fy-fs/2, fs, fs, 5); g.fill();
    g.save();
    g.translate(DW/2, fy+10);
    drawDollIcon(g, 0, -8, 1.5);
    // podium
    g.fillStyle='#b98a3e'; rr(g,-22,8,44,9,2); g.fill();
    g.fillStyle='#8a6428'; rr(g,-16,17,32,7,2); g.fill();
    g.strokeStyle='#5c4118'; g.lineWidth=1.2; rr(g,-22,8,44,9,2); g.stroke();
    g.restore();
    label(g, a.n, DW/2, y+192, 27, '#ffe9b8');
    label(g, a.d, DW/2, y+224, 17, 'rgba(240,224,190,0.82)');
    if(t > 0.85){
      if(button(g, DW/2-176, y+h-58, 168, 46, 'ALL AWARDS'))
        this.transition(()=>{ this._awardsFrom='play'; this.go('awards'); });
      if(button(g, DW/2+8, y+h-58, 168, 46, 'CONTINUE', {accent:true}))
        Awards.pending.shift();
    }
    g.restore();
  },

  drawWin(g){
    const L = this.level;
    const t = clamp((this.resultT-2.35)/0.32, 0, 1);
    const e = easeOut(t);
    const w = 420, h = 268, x = DW/2-w/2, y = DH/2-h/2 - 16;
    g.save();
    g.globalAlpha = e*0.55; g.fillStyle='#000'; g.fillRect(0,0,DW,DH); g.globalAlpha=1;
    g.translate(DW/2, DH/2-16); g.scale(0.86+0.14*e, 0.86+0.14*e); g.translate(-DW/2, -(DH/2-16));
    g.globalAlpha = e;
    panel(g,x,y,w,h,16);
    label(g,'MARK PAINTED', DW/2, y+44, 30, '#ffe9be');
    const cups = L.cups(L.used);
    for(let i=0;i<3;i++){
      const cx = DW/2 - 66 + i*66;
      const pop = clamp((this.resultT - 2.55 - i*0.16)/0.22, 0, 1);
      g.save(); g.translate(cx, y+112);
      const s = i < cups ? 2.4*(0.6+0.4*easeOut(pop)) : 2.4;
      g.scale(1,1);
      drawCup(g, 0, 0, s, i < cups && pop > 0);
      g.restore();
    }
    label(g, `Dolls used: ${L.used}   \u00b7   par ${L.par}`, DW/2, y+164, 20,
          L.used <= L.par ? 'rgba(240,220,180,0.85)' : 'rgba(255,207,154,0.9)');
    const best = Save.best(this.levelIdx);
    if(best) label(g, `Best: ${best.u}`, DW/2, y+190, 17, 'rgba(240,220,180,0.55)');
    if(t > 0.85){
      if(button(g, x+24, y+h-62, 130, 46, 'LEVELS')) this.transition(()=>this.go('levels'));
      if(button(g, x+166, y+h-62, 96, 46, 'RETRY')) this.retry();
      if(button(g, x+274, y+h-62, 122, 46, 'NEXT', {accent:true})) this.transition(()=>this.nextLevel());
    }
    g.restore();
  }
};

/* ------------------------------------------------ 12b. menu screens */
Game.menuBG = function(g){
  g.drawImage(background(0), 0, 0);
  g.save();
  g.globalAlpha = 0.55;
  g.drawImage(background(2), 0, 0);
  g.restore();
  // a lazy doll drifting across the title screen
  const t = this.t;
  g.save(); g.globalAlpha=0.14;
  for(let i=0;i<7;i++){
    const p = ((t*0.045 + i/7) % 1);
    const x = p*DW*1.2 - 100, y = 120 + Math.sin(p*7+i)*90 + i*44;
    g.save(); g.translate(x,y); g.rotate(p*7+i); g.scale(2.2,2.2);
    drawDollIcon(g,0,0,1);
    g.restore();
  }
  g.restore();
};

Game.drawTitle = function(g){
  this.menuBG(g);
  const t = this.t;
  g.save();
  g.translate(DW/2, 176 + Math.sin(t*1.3)*5);
  label(g,'FLOPSHOT', 0, 0, 88, '#f5dfa8');
  g.save();
  g.font = 'bold 88px Georgia, serif'; g.textAlign='center'; g.textBaseline='middle';
  g.strokeStyle='rgba(60,34,10,0.85)'; g.lineWidth=2.6; g.strokeText('FLOPSHOT',0,0);
  g.restore();
  g.restore();
  label(g,'load the cannon  ·  paint the mark', DW/2, 236, 22, 'rgba(240,220,180,0.72)');

  const cx = DW/2;
  if(button(g, cx-140, 300, 280, 58, 'PLAY', {accent:true, size:26})){
    const first = LEVELS.findIndex((_,i)=>!Save.cleared(i));
    this.transition(()=>{ this.world = first<0?0:WORLDS.findIndex(w=>first>=w.from&&first<w.to); this.go('levels'); });
  }
  if(button(g, cx-140, 372, 280, 52, 'LEVELS')) this.transition(()=>this.go('worlds'));
  if(button(g, cx-260, 436, 250, 52, 'AWARDS')) this.transition(()=>this.go('awards'));
  if(button(g, cx+10, 436, 250, 52, 'SETTINGS')) this.transition(()=>this.go('settings'));

  const tc = Save.totalCups();
  g.save();
  drawCup(g, cx-52, 528, 1.8, true);
  label(g, `${tc} / ${LEVELS.length*3}`, cx-24, 528, 24, '#f0dcb4', 'left');
  g.restore();
  label(g, `${Awards.count()} / ${AWARDS.length} awards`, cx+150, 528, 17, 'rgba(240,220,180,0.55)', 'left');
  label(g,'a physics puzzle in one hundred and sixty-five rooms', DW/2, 596, 15, 'rgba(240,220,180,0.4)');
};

Game.drawWorlds = function(g){
  this.menuBG(g);
  label(g,'CHOOSE A ROOM', DW/2, 54, 34, '#f5dfa8');
  const COLS = 6;
  for(let i=0;i<WORLDS.length;i++){
    const W = WORLDS[i];
    const w = 140, h = 200, gap = 12;
    const row = Math.floor(i/COLS), col = i % COLS;
    const nThis = Math.min(COLS, WORLDS.length - row*COLS);
    const x = DW/2 - (nThis*(w+gap)-gap)/2 + col*(w+gap);
    const y = 104 + row*(h+22);
    const open = i===0 || Save.cleared(WORLDS[i-1].to-1) || Save.cleared(W.from);
    const st = uiHit(x,y,w,h);
    g.save();
    g.globalAlpha = open ? 1 : 0.4;
    panel(g,x,y,w,h,14, st.over?1:0.9);
    g.save();
    g.beginPath(); rr(g,x+9,y+9,w-18,88,8); g.clip();
    g.drawImage(background(W.th), x+9-190, y+9-206, DW*0.78, DH*0.78);
    g.restore();
    g.strokeStyle='rgba(0,0,0,0.6)'; g.lineWidth=2; rr(g,x+9,y+9,w-18,88,8); g.stroke();
    label(g, W.name, x+w/2, y+118, 18, '#f5dfa8');
    label(g, `${W.from+1}–${W.to}`, x+w/2, y+140, 13, 'rgba(240,220,180,0.55)');
    const cups = Save.worldCups(i), max = (W.to-W.from)*3;
    drawCup(g, x+w/2-33, y+168, 1.2, cups>0);
    label(g, `${cups}/${max}`, x+w/2-16, y+168, 15, '#f0dcb4', 'left');
    if(!open){
      g.fillStyle='rgba(255,180,150,0.8)';
      g.save(); g.translate(x+w-22, y+22);
      rr(g,-9,-1,18,15,3); g.fill();
      g.strokeStyle='rgba(255,180,150,0.8)'; g.lineWidth=3;
      g.beginPath(); g.arc(0,-1,6,PI,TAU); g.stroke();
      g.restore();
    }
    g.restore();
    if(st.clicked && open){ Audio.click(); this.world = i; this.transition(()=>this.go('levels')); }
  }
  if(button(g, 20, DH-62, 130, 46, 'BACK')) this.transition(()=>this.go('title'));
};

Game.drawLevels = function(g){
  const W = WORLDS[this.world];
  g.drawImage(background(W.th), 0, 0);
  g.fillStyle='rgba(8,5,3,0.62)'; g.fillRect(0,0,DW,DH);
  label(g, W.name.toUpperCase(), DW/2, 54, 34, '#f5dfa8');
  const cups = Save.worldCups(this.world);
  g.save(); drawCup(g, DW/2-30, 88, 1.4, cups>0);
  label(g, `${cups} / ${(W.to-W.from)*3}`, DW/2+4, 88, 19, 'rgba(240,220,180,0.8)', 'left');
  g.restore();

  const cols = 6, rows = 2, cw = 124, ch = 118, gx = 14, gy = 16;
  const ox = DW/2 - (cols*cw + (cols-1)*gx)/2;
  const oy = 172;
  for(let i=W.from;i<W.to;i++){
    const k = i - W.from;
    const x = ox + (k%cols)*(cw+gx), y = oy + Math.floor(k/cols)*(ch+gy);
    const open = Save.unlocked(i);
    const st = uiHit(x,y,cw,ch);
    g.save();
    g.globalAlpha = open ? 1 : 0.42;
    g.fillStyle='rgba(0,0,0,0.5)'; rr(g,x+2,y+4,cw,ch,12); g.fill();
    const gr=g.createLinearGradient(0,y,0,y+ch);
    if(Save.cleared(i)){ gr.addColorStop(0, st.over?'#6e5a2e':'#4e3f1e'); gr.addColorStop(1,'#2c2410'); }
    else { gr.addColorStop(0, st.over?'#6a4f31':'#503a23'); gr.addColorStop(1,'#2e2113'); }
    g.fillStyle=gr; rr(g,x,y+(st.over&&open?2:0),cw,ch,12); g.fill();
    g.strokeStyle= Save.cleared(i) ? 'rgba(255,220,140,0.6)' : 'rgba(226,190,126,0.35)';
    g.lineWidth=2; rr(g,x+1,y+1+(st.over&&open?2:0),cw-2,ch-2,11); g.stroke();
    const yy = y + (st.over&&open?2:0);
    if(open){
      label(g, String(i+1), x+cw/2, yy+34, 32, '#f5dfa8');
      label(g, LEVELS[i].n, x+cw/2, yy+62, 12, 'rgba(240,220,180,0.62)');
      const c = Save.cups(i);
      for(let q=0;q<3;q++) drawCup(g, x+cw/2-29+q*29, yy+92, 1.12, q<c);
    } else {
      g.save(); g.translate(x+cw/2, yy+ch/2-6);
      g.fillStyle='rgba(240,220,180,0.55)';
      rr(g,-15,-2,30,24,4); g.fill();
      g.strokeStyle='rgba(240,220,180,0.55)'; g.lineWidth=4;
      g.beginPath(); g.arc(0,-2,10,PI,TAU); g.stroke();
      g.restore();
    }
    g.restore();
    if(st.clicked && open){ Audio.click(); this.transition(()=>this.startLevel(i)); }
  }
  if(button(g, 20, DH-62, 130, 46, 'BACK')) this.transition(()=>this.go('worlds'));
  if(this.world > 0 && button(g, DW/2-150, DH-62, 46, 46, '<')) { this.world--; }
  if(this.world < WORLDS.length-1 && button(g, DW/2+104, DH-62, 46, 46, '>')) { this.world++; }
  if(button(g, DW-150, DH-62, 130, 46, 'SETTINGS')) this.transition(()=>this.go('settings'));
};

Game.drawSettings = function(g){
  this.menuBG(g);
  const w=430,h=486,x=DW/2-w/2,y=DH/2-h/2;
  panel(g,x,y,w,h,16);
  label(g,'SETTINGS', DW/2, y+44, 32, '#f5dfa8');
  const row = (i,txt,val,fn)=>{
    const ry = y+92+i*62;
    label(g, txt, x+30, ry+22, 21, '#f0dcb4', 'left');
    if(button(g, x+w-142, ry, 112, 44, val ? 'ON' : 'OFF', {accent:val})) fn();
  };
  row(0,'Sound', Save.data.sound!==false, ()=>{
    Save.data.sound = !(Save.data.sound!==false); Audio.on = Save.data.sound; Save.write(); });
  row(1,'Music', Save.data.music!==false, ()=>{
    Save.data.music = !(Save.data.music!==false); Audio.musicOn = Save.data.music; Save.write(); });
  row(2,'Aim guide', Save.data.guide!==false, ()=>{
    Save.data.guide = !(Save.data.guide!==false); Save.write(); });
  row(3,'Full charge aim', !!Save.data.classic, ()=>{
    Save.data.classic = !Save.data.classic; Save.write(); });
  row(4,'Laser sights', !!Save.data.laser, ()=>{
    Save.data.laser = !Save.data.laser; Save.write(); });
  if(this._wipe){
    label(g,'Erase every cup and clear all rooms?', DW/2, y+394, 16, '#ffb59a');
    if(button(g, x+40, y+414, 150, 44, 'CANCEL')) this._wipe = false;
    if(button(g, x+w-190, y+414, 150, 44, 'ERASE', {accent:true})){
      Save.data.best = {}; Save.write(); this._wipe = false;
    }
  } else {
    if(button(g, x+30, y+406, w-60, 44, 'RESET PROGRESS')) this._wipe = true;
  }
  if(button(g, 20, DH-62, 130, 46, 'BACK')){ this._wipe=false; this.transition(()=>this.go(this.level?'levels':'title')); }
};

Game.drawAwards = function(g){
  this.menuBG(g);
  label(g,'AWARDS', DW/2, 52, 36, '#f5dfa8');
  label(g, `${Awards.count()} of ${AWARDS.length} won`, DW/2, 84, 17, 'rgba(240,220,180,0.6)');
  const cols = 3, cw = 288, ch = 84, gx = 14, gy = 12;
  const ox = DW/2 - (cols*cw + (cols-1)*gx)/2;
  const oy = 110;
  const page = this._awPage || 0;
  const per = cols*5;
  const from = page*per, to = Math.min(AWARDS.length, from+per);
  for(let i=from;i<to;i++){
    const a = AWARDS[i], k = i - from;
    const x = ox + (k%cols)*(cw+gx), y = oy + Math.floor(k/cols)*(ch+gy);
    const got = Awards.earned(a.id);
    g.save();
    g.globalAlpha = got ? 1 : 0.42;
    g.fillStyle='rgba(0,0,0,0.45)'; rr(g,x+2,y+3,cw,ch,9); g.fill();
    const gr=g.createLinearGradient(0,y,0,y+ch);
    if(got){ gr.addColorStop(0,'#6a5430'); gr.addColorStop(1,'#3a2c18'); }
    else    { gr.addColorStop(0,'#3e352a'); gr.addColorStop(1,'#241e17'); }
    g.fillStyle=gr; rr(g,x,y,cw,ch,9); g.fill();
    g.strokeStyle= got ? 'rgba(255,220,140,0.55)' : 'rgba(200,180,140,0.2)';
    g.lineWidth=1.8; rr(g,x,y,cw,ch,9); g.stroke();
    // framed icon
    g.fillStyle= got ? '#c8a86a' : '#5a5044';
    rr(g,x+10,y+12,60,60,6); g.fill();
    g.fillStyle= got ? '#f6f0e2' : '#3a342c';
    rr(g,x+15,y+17,50,50,4); g.fill();
    g.save(); g.translate(x+40,y+46);
    if(got) drawDollIcon(g,0,-4,1.1);
    else {
      g.strokeStyle='rgba(230,215,180,0.55)'; g.lineWidth=3.4;
      g.beginPath(); g.arc(0,-2,8,PI,TAU); g.stroke();
      g.fillStyle='rgba(230,215,180,0.55)'; rr(g,-11,-2,22,17,3); g.fill();
    }
    g.restore();
    label(g, a.n, x+84, y+30, 19, got?'#ffe9b8':'#b8ab92', 'left');
    label(g, a.d, x+84, y+54, 13, got?'rgba(240,224,190,0.75)':'rgba(200,186,158,0.5)', 'left', 'normal');
    g.restore();
  }
  const pages = Math.ceil(AWARDS.length/per);
  if(pages > 1){
    if(page > 0 && button(g, DW/2-120, DH-62, 46, 46, '<')) this._awPage = page-1;
    if(page < pages-1 && button(g, DW/2+74, DH-62, 46, 46, '>')) this._awPage = page+1;
    label(g, `${page+1} / ${pages}`, DW/2, DH-39, 17, 'rgba(240,220,180,0.6)');
  }
  if(button(g, 20, DH-62, 130, 46, 'BACK')){
    const from2 = this._awardsFrom;
    this._awardsFrom = null;
    this.transition(()=> from2==='play' ? this.go('play') : this.go('title'));
  }
};

Game.drawFinale = function(g){
  this.menuBG(g);
  label(g,'THE WORKS ARE QUIET', DW/2, 150, 44, '#f5dfa8');
  label(g,'Every mark painted. One hundred and sixty-five rooms behind you.', DW/2, 208, 21, 'rgba(240,220,180,0.75)');
  const tc = Save.totalCups();
  g.save(); drawCup(g, DW/2-60, 290, 3.0, true);
  label(g, `${tc} / ${LEVELS.length*3}`, DW/2+4, 290, 34, '#f0dcb4', 'left');
  g.restore();
  label(g, tc >= LEVELS.length*3 ? 'A perfect cabinet. Nothing left to prove.'
                                 : 'Some rooms still owe you a cup.',
        DW/2, 366, 18, 'rgba(240,220,180,0.6)');
  if(button(g, DW/2-150, 430, 300, 54, 'BACK TO THE ROOMS', {accent:true}))
    this.transition(()=>this.go('worlds'));
};

/* =====================================================================
   13. MAIN LOOP
   ===================================================================== */
FX.init();
Save.load();
resize();
Game.go('title');

let lastT = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - lastT)/1000;
  PERF.sample((now - lastT));
  lastT = now;
  if(dt > 0.06) dt = 0.06;          // a slow frame must not blow up the solver
  if(dt <= 0) dt = 1/60;

  Game.t += dt;
  Audio.music(dt);

  // screen transition
  if(Game.fadeDir > 0){
    Game.fade += dt*4.2;
    if(Game.fade >= 1){ Game.fade = 1; Game.fadeDir = -1; if(Game.next){ Game.next(); Game.next = null; } }
  } else if(Game.fade > 0){
    Game.fade -= dt*3.4;
    if(Game.fade < 0) Game.fade = 0;
  }

  if(Game.state === 'play' && Game.level) Game.updatePlay(dt);
  FX.update(dt);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#070503';
  ctx.fillRect(0,0,CW,CH);

  const sh = FX.shake;
  const sx = sh ? rnd(-sh,sh) : 0, sy = sh ? rnd(-sh,sh) : 0;
  ctx.save();
  ctx.setTransform(SC,0,0,SC,OX + sx*SC, OY + sy*SC);
  ctx.beginPath(); ctx.rect(0,0,DW,DH); ctx.clip();

  switch(Game.state){
    case 'title':    Game.drawTitle(ctx); break;
    case 'worlds':   Game.drawWorlds(ctx); break;
    case 'levels':   Game.drawLevels(ctx); break;
    case 'settings': Game.drawSettings(ctx); break;
    case 'awards':   Game.drawAwards(ctx); break;
    case 'finale':   Game.drawFinale(ctx); break;
    case 'play':     Game.drawPlay(ctx); break;
  }

  if(FX.flash > 0){
    ctx.fillStyle = `rgba(${FX.flashCol},${clamp(FX.flash,0,1)*0.55})`;
    ctx.fillRect(0,0,DW,DH);
  }
  if(Game.fade > 0){
    ctx.fillStyle = `rgba(6,4,2,${clamp(Game.fade,0,1)})`;
    ctx.fillRect(0,0,DW,DH);
  }
  ctx.restore();

  // letterbox trim
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#070503';
  if(OY > 0){ ctx.fillRect(0,0,CW,OY+1); ctx.fillRect(0,CH-OY-1,CW,OY+1); }
  if(OX > 0){ ctx.fillRect(0,0,OX+1,CH); ctx.fillRect(CW-OX-1,0,OX+1,CH); }

  endFrameInput();
}
requestAnimationFrame(frame);

/* a small hook so the level set can be checked from outside the game */
window.__flop = { Game, LEVELS, Level, Doll, World, Save, FX, THEMES, PERF };
</script>
