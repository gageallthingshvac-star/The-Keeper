<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>FLOPSHOT</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a120c" />
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;background:#0b0806;overflow:hidden;overscroll-behavior:none;}
  canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;}
  *{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   FLOPSHOT  —  a steam-works cannon puzzler
   Fire cloth dolls out of a brass cannon. Paint the bullseye. Dolls are
   never rationed -- the counter shows the par, and coming in at or under
   it is what the vault pays its cups for.
   Single file. No libraries. Everything below is hand rolled: the rigid
   body solver, the joints, the textures, the audio.
   ===================================================================== */

/* ---------------------------------------------------------------- 0. boot */
const DW = 960, DH = 640;                 // world is exactly one screen
const DOLL_CAP = 12;                      // how deep the pile may get
const JOINT_SLOP = 0.4;                   // joint error left uncorrected, px
const JOINT_MAXBIAS = 1200;               // fastest a joint may heal, px/s
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha:false });
let SC = 1, OX = 0, OY = 0, CW = DW, CH = DH;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  cvs.width  = Math.max(1, Math.floor(w * dpr));
  cvs.height = Math.max(1, Math.floor(h * dpr));
  cvs.style.width = w + 'px';
  cvs.style.height = h + 'px';
  CW = cvs.width; CH = cvs.height;
  SC = Math.min(CW / DW, CH / DH);
  OX = (CW - DW * SC) * 0.5;
  OY = (CH - DH * SC) * 0.5;
}
window.addEventListener('resize', resize, {passive:true});
window.addEventListener('orientationchange', ()=>setTimeout(resize,120), {passive:true});

/* ------------------------------------------------------------- 1. numbers */
const PI = Math.PI, TAU = PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const sign  = v => v < 0 ? -1 : 1;
const dist2 = (ax,ay,bx,by) => { const dx=bx-ax, dy=by-ay; return dx*dx+dy*dy; };
const dist  = (ax,ay,bx,by) => Math.sqrt(dist2(ax,ay,bx,by));
function angDiff(a,b){ let d=(a-b)%TAU; if(d>PI)d-=TAU; if(d<-PI)d+=TAU; return d; }
function smooth(t){ return t*t*(3-2*t); }
function easeOut(t){ return 1-(1-t)*(1-t); }
function easeIn(t){ return t*t; }

/* deterministic little noise generator so textures are stable per run */
let _seed = 1337;
function srnd(){ _seed = (_seed * 1664525 + 1013904223) & 0x7fffffff; return _seed / 0x7fffffff; }
function seed(s){ _seed = s|0 || 1; }
function rnd(a=1,b){ return b===undefined ? Math.random()*a : a + Math.random()*(b-a); }
function rint(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* rounded rect path */
function rr(g,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)*0.5, Math.abs(h)*0.5);
  g.beginPath();
  g.moveTo(x+r,y);
  g.lineTo(x+w-r,y); g.arcTo(x+w,y,x+w,y+r,r);
  g.lineTo(x+w,y+h-r); g.arcTo(x+w,y+h,x+w-r,y+h,r);
  g.lineTo(x+r,y+h);   g.arcTo(x,y+h,x,y+h-r,r);
  g.lineTo(x,y+r);     g.arcTo(x,y,x+r,y,r);
  g.closePath();
}
function mkcv(w,h){
  const c = document.createElement('canvas');
  c.width = Math.max(1,Math.ceil(w)); c.height = Math.max(1,Math.ceil(h));
  return c;
}

/* ---------------------------------------------------------------- 2. input */
const IN = {
  down:false, x:0, y:0, sx:0, sy:0,
  pressed:false, released:false, rx:0, ry:0, moved:0, id:null
};
function ptWorld(clientX, clientY){
  const r = cvs.getBoundingClientRect();
  const px = (clientX - r.left) * (CW / r.width);
  const py = (clientY - r.top)  * (CH / r.height);
  return { x:(px - OX)/SC, y:(py - OY)/SC };
}
function onDown(x,y){
  const p = ptWorld(x,y);
  IN.down = true; IN.pressed = true; IN.moved = 0;
  IN.x = IN.sx = p.x; IN.y = IN.sy = p.y;
  Audio.unlock();
}
function onMove(x,y){
  const p = ptWorld(x,y);
  IN.moved += dist(IN.x, IN.y, p.x, p.y);
  IN.x = p.x; IN.y = p.y;
}
function onUp(){
  if(!IN.down) return;
  IN.down = false; IN.released = true; IN.rx = IN.x; IN.ry = IN.y;
}
cvs.addEventListener('pointerdown', e=>{ if(IN.id!==null) return; IN.id=e.pointerId; cvs.setPointerCapture&&cvs.setPointerCapture(e.pointerId); onDown(e.clientX,e.clientY); e.preventDefault(); });
cvs.addEventListener('pointermove', e=>{ if(e.pointerId!==IN.id) return; onMove(e.clientX,e.clientY); e.preventDefault(); });
const endPtr = e=>{ if(e.pointerId!==IN.id) return; IN.id=null; onUp(); e.preventDefault(); };
cvs.addEventListener('pointerup', endPtr);
cvs.addEventListener('pointercancel', endPtr);
window.addEventListener('contextmenu', e=>e.preventDefault());
const KEY = {};
window.addEventListener('keydown', e=>{ KEY[e.key]=true; if(e.key===' '||e.key==='ArrowUp'||e.key==='ArrowDown') e.preventDefault(); Audio.unlock(); });
window.addEventListener('keyup',   e=>{ KEY[e.key]=false; });
function endFrameInput(){ IN.pressed=false; IN.released=false; }

/* =====================================================================
   3. PHYSICS
   Impulse based rigid bodies. Convex polygons and circles, SAT with face
   clipping for manifolds, sequential impulses with warm starting, revolute
   joints with angle limits, and per body sleeping so stacks actually rest.
   ===================================================================== */

const SLOP      = 0.35;   // allowed overlap, px
const BAUMGARTE = 0.18;   // position correction rate
const MAX_CORR  = 320;    // px/s cap on correction velocity
const REST_VEL  = 90;     // below this approach speed, no bounce
const SLEEP_LIN = 6.0, SLEEP_ANG = 0.14, SLEEP_TIME = 0.55;

let BID = 1;

class Body {
  constructor(o){
    this.id      = BID++;
    this.shape   = o.shape || 'box';           // 'box' | 'poly' | 'circle'
    this.x = o.x||0; this.y = o.y||0; this.a = o.a||0;
    this.vx = o.vx||0; this.vy = o.vy||0; this.av = o.av||0;
    this.fixed   = !!o.fixed;
    this.sensor  = !!o.sensor;
    this.friction= o.friction !== undefined ? o.friction : 0.5;
    this.rest    = o.rest     !== undefined ? o.rest     : 0.04;
    this.linDamp = o.linDamp  !== undefined ? o.linDamp  : 0.10;
    this.angDamp = o.angDamp  !== undefined ? o.angDamp  : 0.20;
    this.gscale  = o.gscale   !== undefined ? o.gscale   : 1;
    this.group   = o.group || 0;               // matching non-zero groups never collide
    this.nocol   = null;                       // ids this body is jointed to
    this.mat     = o.mat || 'wood';
    this.tag     = o.tag || null;
    this.ent     = null;                        // owning game entity
    this.dead    = false;
    this.bullet  = !!o.bullet;
    this.r = 0; this.hw = 0; this.hh = 0;

    if(this.shape === 'circle'){
      this.r = o.r || 10;
    } else if(this.shape === 'poly'){
      this.lv = o.verts.map(v=>({x:v.x, y:v.y}));
    } else {
      this.shape = 'poly';
      this.hw = (o.w||10)*0.5; this.hh = (o.h||10)*0.5;
      this.box = true;
      this.lv = [ {x:-this.hw,y:-this.hh},{x:this.hw,y:-this.hh},
                  {x: this.hw,y: this.hh},{x:-this.hw,y:this.hh} ];
    }
    this.density = o.density !== undefined ? o.density : MAT_DENSITY[this.mat] || 0.0010;
    this.computeMass();
    if(this.fixed){ this.m=0; this.im=0; this.I=0; this.iI=0; }

    // world space caches
    this.wv = this.lv ? this.lv.map(()=>({x:0,y:0})) : null;
    this.wn = this.lv ? this.lv.map(()=>({x:0,y:0})) : null;
    this.cos = 1; this.sin = 0;
    this.minx=this.miny=this.maxx=this.maxy=0;
    this.awake = true; this.sleepT = 0; this.canSleep = o.canSleep !== false;
    this.sync();
  }

  computeMass(){
    if(this.shape === 'circle'){
      const A = PI * this.r * this.r;
      this.m = A * this.density;
      this.I = this.m * this.r * this.r * 0.5;
    } else {
      // polygon area + second moment about centroid (verts assumed centered)
      let A = 0, I = 0;
      const v = this.lv, n = v.length;
      for(let i=0;i<n;i++){
        const p = v[i], q = v[(i+1)%n];
        const cr = p.x*q.y - q.x*p.y;
        A += cr;
        I += cr * (p.x*p.x + p.x*q.x + q.x*q.x + p.y*p.y + p.y*q.y + q.y*q.y);
      }
      A = Math.abs(A) * 0.5;
      this.m = A * this.density;
      this.I = Math.abs(I) / 12 * this.density;
    }
    this.im = this.m > 0 ? 1/this.m : 0;
    this.iI = this.I > 0 ? 1/this.I : 0;
  }

  sync(){
    this.cos = Math.cos(this.a); this.sin = Math.sin(this.a);
    if(this.shape === 'circle'){
      this.minx = this.x - this.r; this.maxx = this.x + this.r;
      this.miny = this.y - this.r; this.maxy = this.y + this.r;
      return;
    }
    const c=this.cos, s=this.sin, v=this.lv, w=this.wv, n=v.length;
    let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
    for(let i=0;i<n;i++){
      const px = v[i].x*c - v[i].y*s + this.x;
      const py = v[i].x*s + v[i].y*c + this.y;
      w[i].x = px; w[i].y = py;
      if(px<mnx)mnx=px; if(px>mxx)mxx=px;
      if(py<mny)mny=py; if(py>mxy)mxy=py;
    }
    for(let i=0;i<n;i++){
      const p=w[i], q=w[(i+1)%n];
      const ex=q.x-p.x, ey=q.y-p.y, L=Math.hypot(ex,ey)||1;
      this.wn[i].x =  ey/L; this.wn[i].y = -ex/L;   // outward for CW-in-screen-space winding
    }
    this.minx=mnx; this.miny=mny; this.maxx=mxx; this.maxy=mxy;
  }

  wake(){ this.awake = true; this.sleepT = 0; }
  sleep(){ this.awake = false; this.vx=this.vy=this.av=0; }

  applyImpulse(px,py,cx,cy){
    if(this.fixed) return;
    this.wake();
    this.vx += px*this.im; this.vy += py*this.im;
    this.av += ((cx-this.x)*py - (cy-this.y)*px) * this.iI;
  }
  velAt(cx,cy,out){
    out.x = this.vx - this.av*(cy-this.y);
    out.y = this.vy + this.av*(cx-this.x);
  }
  contains(px,py){
    if(this.shape==='circle') return dist2(px,py,this.x,this.y) <= this.r*this.r;
    const w=this.wv,n=w.length;
    for(let i=0;i<n;i++){
      const nx=this.wn[i].x, ny=this.wn[i].y;
      if((px-w[i].x)*nx + (py-w[i].y)*ny > 0) return false;
    }
    return true;
  }
}

const MAT_DENSITY = {
  wood:0.00095, stone:0.0026, metal:0.0042, glass:0.0011,
  cloth:0.00108, ice:0.0009, tnt:0.0013, rubber:0.0011, balloon:0.00030
};
const MAT_FRICTION = {
  wood:0.55, stone:0.62, metal:0.35, glass:0.22, cloth:0.5,
  ice:0.03, tnt:0.5, rubber:0.9, balloon:0.4
};
const MAT_REST = {
  wood:0.06, stone:0.05, metal:0.12, glass:0.04, cloth:0.02,
  ice:0.05, tnt:0.05, rubber:0.72, balloon:0.4
};

/* ------------------------------------------------- 3a. narrow phase */
const _tmpA = {x:0,y:0}, _tmpB = {x:0,y:0};

function maxSeparation(A,B){
  // deepest penetration of B's verts along each of A's face normals
  let best = -1e9, bi = 0;
  const n = A.wv.length;
  for(let i=0;i<n;i++){
    const nx = A.wn[i].x, ny = A.wn[i].y;
    const vx = A.wv[i].x, vy = A.wv[i].y;
    // support point of B in direction -n
    let minD = 1e9;
    for(let j=0;j<B.wv.length;j++){
      const d = (B.wv[j].x-vx)*nx + (B.wv[j].y-vy)*ny;
      if(d < minD) minD = d;
    }
    if(minD > best){ best = minD; bi = i; }
  }
  return { sep:best, i:bi };
}

function clipSeg(p1,p2,nx,ny,off){
  // keep the part of segment with dot(n,p) <= off
  const d1 = nx*p1.x + ny*p1.y - off;
  const d2 = nx*p2.x + ny*p2.y - off;
  const out = [];
  if(d1 <= 0) out.push({x:p1.x,y:p1.y});
  if(d2 <= 0) out.push({x:p2.x,y:p2.y});
  if(d1*d2 < 0){
    const t = d1/(d1-d2);
    out.push({ x:p1.x+t*(p2.x-p1.x), y:p1.y+t*(p2.y-p1.y) });
  }
  return out.slice(0,2);
}

function polyPoly(A,B){
  const eA = maxSeparation(A,B); if(eA.sep > 0) return null;
  const eB = maxSeparation(B,A); if(eB.sep > 0) return null;
  let ref, inc, idx, flip;
  if(eB.sep > eA.sep + 0.2){ ref=B; inc=A; idx=eB.i; flip=true; }
  else                     { ref=A; inc=B; idx=eA.i; flip=false; }

  const rn = ref.wn[idx];
  const nx = rn.x, ny = rn.y;
  const v1 = ref.wv[idx], v2 = ref.wv[(idx+1)%ref.wv.length];

  // incident face = face of inc most anti parallel to n
  let ii = 0, minDot = 1e9;
  for(let i=0;i<inc.wn.length;i++){
    const d = inc.wn[i].x*nx + inc.wn[i].y*ny;
    if(d < minDot){ minDot = d; ii = i; }
  }
  const i1 = inc.wv[ii], i2 = inc.wv[(ii+1)%inc.wv.length];

  // side planes
  const tx = v2.x-v1.x, ty = v2.y-v1.y, L = Math.hypot(tx,ty)||1;
  const sx = tx/L, sy = ty/L;
  let pts = clipSeg(i1,i2, -sx,-sy, -(sx*v1.x + sy*v1.y));
  if(pts.length < 2) return null;
  pts = clipSeg(pts[0],pts[1], sx,sy, sx*v2.x + sy*v2.y);
  if(pts.length < 2) return null;

  const front = nx*v1.x + ny*v1.y;
  const contacts = [];
  for(const p of pts){
    const sep = nx*p.x + ny*p.y - front;
    if(sep <= 0.5) contacts.push({ x:p.x, y:p.y, sep:sep, pn:0, pt:0 });
  }
  if(!contacts.length) return null;
  return { nx: flip ? -nx : nx, ny: flip ? -ny : ny, contacts };
}

function circleCircle(A,B){
  const dx=B.x-A.x, dy=B.y-A.y;
  const rr2=(A.r+B.r), d=Math.hypot(dx,dy);
  if(d > rr2) return null;
  let nx,ny;
  if(d < 1e-6){ nx=0; ny=-1; } else { nx=dx/d; ny=dy/d; }
  return { nx, ny, contacts:[{ x:A.x+nx*A.r, y:A.y+ny*A.r, sep:d-rr2, pn:0, pt:0 }] };
}

function polyCircle(P,C){
  // normal points from P toward C
  const n = P.wv.length;
  let best = -1e9, bi = 0;
  for(let i=0;i<n;i++){
    const d = (C.x-P.wv[i].x)*P.wn[i].x + (C.y-P.wv[i].y)*P.wn[i].y;
    if(d > C.r) return null;
    if(d > best){ best = d; bi = i; }
  }
  const v1 = P.wv[bi], v2 = P.wv[(bi+1)%n];
  if(best < 1e-4){
    // center inside the polygon
    const nx=P.wn[bi].x, ny=P.wn[bi].y;
    return { nx, ny, contacts:[{ x:C.x-nx*C.r, y:C.y-ny*C.r, sep:best-C.r, pn:0, pt:0 }] };
  }
  // voronoi region test
  const e1 = (C.x-v1.x)*(v2.x-v1.x) + (C.y-v1.y)*(v2.y-v1.y);
  const e2 = (C.x-v2.x)*(v1.x-v2.x) + (C.y-v2.y)*(v1.y-v2.y);
  let px,py;
  if(e1 <= 0)      { px=v1.x; py=v1.y; }
  else if(e2 <= 0) { px=v2.x; py=v2.y; }
  else {
    const nx=P.wn[bi].x, ny=P.wn[bi].y;
    return { nx, ny, contacts:[{ x:C.x-nx*C.r, y:C.y-ny*C.r, sep:best-C.r, pn:0, pt:0 }] };
  }
  const dx=C.x-px, dy=C.y-py, d=Math.hypot(dx,dy);
  if(d > C.r || d < 1e-9) return null;
  const nx=dx/d, ny=dy/d;
  return { nx, ny, contacts:[{ x:px, y:py, sep:d-C.r, pn:0, pt:0 }] };
}

function collide(A,B){
  if(A.shape==='circle'){
    if(B.shape==='circle') return circleCircle(A,B);
    const m = polyCircle(B,A);
    if(m){ m.nx=-m.nx; m.ny=-m.ny; }
    return m;
  }
  if(B.shape==='circle') return polyCircle(A,B);
  return polyPoly(A,B);
}

/* ------------------------------------------------- 3b. arbiters */
class Arbiter {
  constructor(A,B,m){
    this.A=A; this.B=B;
    this.nx=m.nx; this.ny=m.ny;
    this.contacts=m.contacts;
    this.friction = Math.sqrt((MAT_FRICTION[A.mat]??A.friction) * (MAT_FRICTION[B.mat]??B.friction));
    this.rest = Math.max(A.rest, B.rest);
    this.touch = true;
    this.stamp = 0;
    this.impulse = 0;   // total normal impulse this step
    this.vn0 = 0;       // closing speed before the solve, the honest impact measure
    this.rm  = 0;       // reduced mass of the pair
  }
  update(m){
    const old = this.contacts;
    const nu = m.contacts;
    for(const c of nu){
      let bestD = 25, best = null;
      for(const o of old){
        const d = dist2(c.x,c.y,o.x,o.y);
        if(d < bestD){ bestD = d; best = o; }
      }
      if(best){ c.pn = best.pn; c.pt = best.pt; }
    }
    this.contacts = nu;
    this.nx = m.nx; this.ny = m.ny;
    this.touch = true;
  }
  prestep(dt){
    const A=this.A, B=this.B, nx=this.nx, ny=this.ny;
    const tx = -ny, ty = nx;
    const inv = 1/dt;
    const km = A.im + B.im;
    this.rm = km > 0 ? 1/km : 0;
    this.vn0 = 0;
    for(const c of this.contacts){
      const r1x = c.x - A.x, r1y = c.y - A.y;
      const r2x = c.x - B.x, r2y = c.y - B.y;
      c.r1x=r1x; c.r1y=r1y; c.r2x=r2x; c.r2y=r2y;

      const rn1 = r1x*nx + r1y*ny, rn2 = r2x*nx + r2y*ny;
      let kN = A.im + B.im
             + A.iI * (r1x*r1x + r1y*r1y - rn1*rn1)
             + B.iI * (r2x*r2x + r2y*r2y - rn2*rn2);
      c.mn = kN > 0 ? 1/kN : 0;

      const rt1 = r1x*tx + r1y*ty, rt2 = r2x*tx + r2y*ty;
      let kT = A.im + B.im
             + A.iI * (r1x*r1x + r1y*r1y - rt1*rt1)
             + B.iI * (r2x*r2x + r2y*r2y - rt2*rt2);
      c.mt = kT > 0 ? 1/kT : 0;

      const pen = -c.sep;
      c.bias = Math.min(MAX_CORR, BAUMGARTE * inv * Math.max(0, pen - SLOP));

      // restitution from the approach speed sampled before the solve
      const dvx = (B.vx - B.av*r2y) - (A.vx - A.av*r1y);
      const dvy = (B.vy + B.av*r2x) - (A.vy + A.av*r1x);
      const vn = dvx*nx + dvy*ny;
      if(vn < this.vn0) this.vn0 = vn;
      c.target = vn < -REST_VEL ? -this.rest * vn : 0;

      // warm start
      const px = c.pn*nx + c.pt*tx, py = c.pn*ny + c.pt*ty;
      if(!A.fixed){ A.vx -= px*A.im; A.vy -= py*A.im; A.av -= (r1x*py - r1y*px)*A.iI; }
      if(!B.fixed){ B.vx += px*B.im; B.vy += py*B.im; B.av += (r2x*py - r2y*px)*B.iI; }
    }
  }
  solve(){
    const A=this.A, B=this.B, nx=this.nx, ny=this.ny;
    const tx = -ny, ty = nx;
    for(const c of this.contacts){
      // normal
      let dvx = (B.vx - B.av*c.r2y) - (A.vx - A.av*c.r1y);
      let dvy = (B.vy + B.av*c.r2x) - (A.vy + A.av*c.r1x);
      let vn = dvx*nx + dvy*ny;
      let dPn = c.mn * (c.bias + c.target - vn);
      const pn0 = c.pn;
      c.pn = Math.max(0, pn0 + dPn);
      dPn = c.pn - pn0;
      let px = dPn*nx, py = dPn*ny;
      if(!A.fixed){ A.vx -= px*A.im; A.vy -= py*A.im; A.av -= (c.r1x*py - c.r1y*px)*A.iI; }
      if(!B.fixed){ B.vx += px*B.im; B.vy += py*B.im; B.av += (c.r2x*py - c.r2y*px)*B.iI; }
      this.impulse += Math.abs(dPn);

      // friction
      dvx = (B.vx - B.av*c.r2y) - (A.vx - A.av*c.r1y);
      dvy = (B.vy + B.av*c.r2x) - (A.vy + A.av*c.r1x);
      const vt = dvx*tx + dvy*ty;
      let dPt = c.mt * (-vt);
      const maxPt = this.friction * c.pn;
      const pt0 = c.pt;
      c.pt = clamp(pt0 + dPt, -maxPt, maxPt);
      dPt = c.pt - pt0;
      px = dPt*tx; py = dPt*ty;
      if(!A.fixed){ A.vx -= px*A.im; A.vy -= py*A.im; A.av -= (c.r1x*py - c.r1y*px)*A.iI; }
      if(!B.fixed){ B.vx += px*B.im; B.vy += py*B.im; B.av += (c.r2x*py - c.r2y*px)*B.iI; }
    }
  }
}

/* ------------------------------------------------- 3c. joints */
class Joint {
  // point to point, optionally with a relative angle limit
  constructor(A,B,wx,wy,opt={}){
    this.A=A; this.B=B;
    const ca=Math.cos(-A.a), sa=Math.sin(-A.a);
    const cb=Math.cos(-B.a), sb=Math.sin(-B.a);
    let dx=wx-A.x, dy=wy-A.y;
    this.ax = dx*ca - dy*sa; this.ay = dx*sa + dy*ca;
    dx=wx-B.x; dy=wy-B.y;
    this.bx = dx*cb - dy*sb; this.by = dx*sb + dy*cb;
    this.px=0; this.py=0;
    this.soft = opt.soft || 0;
    this.lo = opt.lo; this.hi = opt.hi;
    this.refA = opt.ref !== undefined ? opt.ref : (B.a - A.a);
    this.limImp = 0;
    this.motor = opt.motor || 0;      // target relative angular velocity
    this.maxMotor = opt.maxMotor || 0;
    this.motorImp = 0;
    this.broken = false;
    this.breakForce = opt.breakForce || 0;
    this.stiff = opt.stiff || 0;      // soft restoring torque toward ref angle
  }
  worldA(){ const c=this.A.cos,s=this.A.sin; return { x:this.A.x + this.ax*c - this.ay*s, y:this.A.y + this.ax*s + this.ay*c }; }
  worldB(){ const c=this.B.cos,s=this.B.sin; return { x:this.B.x + this.bx*c - this.by*s, y:this.B.y + this.bx*s + this.by*c }; }
  prestep(dt){
    const A=this.A,B=this.B;
    const pa=this.worldA(), pb=this.worldB();
    this.r1x = pa.x-A.x; this.r1y = pa.y-A.y;
    this.r2x = pb.x-B.x; this.r2y = pb.y-B.y;
    const r1x=this.r1x,r1y=this.r1y,r2x=this.r2x,r2y=this.r2y;

    // K = (im1+im2)*Identity + skew terms
    const k11 = A.im + B.im + A.iI*r1y*r1y + B.iI*r2y*r2y;
    const k12 = -A.iI*r1x*r1y - B.iI*r2x*r2y;
    const k22 = A.im + B.im + A.iI*r1x*r1x + B.iI*r2x*r2x;
    let det = k11*k22 - k12*k12;
    if(Math.abs(det) < 1e-12) det = 1e-12;
    this.m11 =  k22/det; this.m12 = -k12/det; this.m22 = k11/det;

    // Baumgarte, bounded -- as the angle limit below and DistJoint both are.
    // Unbounded it is a runaway: a joint pulled apart asks for a correction
    // speed proportional to the error, overshoots, and asks for more next
    // step. On a long heavy pendulum that oscillation reaches the velocity
    // clamp within a frame. The slop lets a settled joint stop fidgeting.
    const cx = pb.x-pa.x, cy = pb.y-pa.y;
    const cl = Math.hypot(cx,cy);
    this.cerr = cl;
    if(cl > JOINT_SLOP){
      const f = Math.min((0.2/dt) * (cl - JOINT_SLOP), JOINT_MAXBIAS) / cl;
      this.bx2 = -f*cx; this.by2 = -f*cy;
    } else { this.bx2 = 0; this.by2 = 0; }

    // warm start
    if(!A.fixed){ A.vx -= this.px*A.im; A.vy -= this.py*A.im; A.av -= (r1x*this.py - r1y*this.px)*A.iI; }
    if(!B.fixed){ B.vx += this.px*B.im; B.vy += this.py*B.im; B.av += (r2x*this.py - r2y*this.px)*B.iI; }

    // angle limit
    this.kAng = (A.iI + B.iI) > 0 ? 1/(A.iI + B.iI) : 0;
    this.limState = 0;
    if(this.lo !== undefined){
      const ang = (B.a - A.a) - this.refA;
      this.angErr = 0;
      if(ang < this.lo){ this.limState = 1; this.angErr = ang - this.lo; }
      else if(ang > this.hi){ this.limState = -1; this.angErr = ang - this.hi; }
      if(this.limState){
        this.angBias = clamp(-0.25/dt * this.angErr, -14, 14);
        const imp = this.limImp;
        if(!A.fixed) A.av -= imp*A.iI;
        if(!B.fixed) B.av += imp*B.iI;
      } else this.limImp = 0;
    }
  }
  solve(dt){
    const A=this.A,B=this.B;
    const r1x=this.r1x,r1y=this.r1y,r2x=this.r2x,r2y=this.r2y;
    const dvx = (B.vx - B.av*r2y) - (A.vx - A.av*r1y);
    const dvy = (B.vy + B.av*r2x) - (A.vy + A.av*r1x);
    const ex = this.bx2 - dvx, ey = this.by2 - dvy;
    const ix = this.m11*ex + this.m12*ey;
    const iy = this.m12*ex + this.m22*ey;
    this.px += ix; this.py += iy;
    if(!A.fixed){ A.vx -= ix*A.im; A.vy -= iy*A.im; A.av -= (r1x*iy - r1y*ix)*A.iI; }
    if(!B.fixed){ B.vx += ix*B.im; B.vy += iy*B.im; B.av += (r2x*iy - r2y*ix)*B.iI; }

    if(this.limState && this.kAng){
      const dw = B.av - A.av;
      let imp = this.kAng * (this.angBias - dw);
      const old = this.limImp;
      if(this.limState > 0) this.limImp = Math.max(0, old + imp);
      else                  this.limImp = Math.min(0, old + imp);
      imp = this.limImp - old;
      if(!A.fixed) A.av -= imp*A.iI;
      if(!B.fixed) B.av += imp*B.iI;
    }
    if(this.stiff && this.kAng){
      const ang = (B.a - A.a) - this.refA;
      const dw = B.av - A.av;
      const imp = this.kAng * (-ang*this.stiff*dt*60 - dw*0.06) * 0.5;
      if(!A.fixed) A.av -= imp*A.iI;
      if(!B.fixed) B.av += imp*B.iI;
    }
  }
}

class DistJoint {
  constructor(A,B,wax,way,wbx,wby,opt={}){
    this.A=A; this.B=B;
    const ca=Math.cos(-A.a), sa=Math.sin(-A.a);
    const cb=Math.cos(-B.a), sb=Math.sin(-B.a);
    let dx=wax-A.x, dy=way-A.y;
    this.ax = dx*ca - dy*sa; this.ay = dx*sa + dy*ca;
    dx=wbx-B.x; dy=wby-B.y;
    this.bx = dx*cb - dy*sb; this.by = dx*sb + dy*cb;
    this.len = opt.len !== undefined ? opt.len : dist(wax,way,wbx,wby);
    this.rope = !!opt.rope;   // only resists stretching
    this.imp = 0;
    this.broken = false;
  }
  worldA(){ const c=this.A.cos,s=this.A.sin; return { x:this.A.x + this.ax*c - this.ay*s, y:this.A.y + this.ax*s + this.ay*c }; }
  worldB(){ const c=this.B.cos,s=this.B.sin; return { x:this.B.x + this.bx*c - this.by*s, y:this.B.y + this.bx*s + this.by*c }; }
  prestep(dt){
    const A=this.A,B=this.B;
    const pa=this.worldA(), pb=this.worldB();
    this.r1x=pa.x-A.x; this.r1y=pa.y-A.y;
    this.r2x=pb.x-B.x; this.r2y=pb.y-B.y;
    let dx=pb.x-pa.x, dy=pb.y-pa.y;
    const d = Math.hypot(dx,dy) || 1e-6;
    this.nx = dx/d; this.ny = dy/d;
    this.slack = this.rope && d < this.len;
    const C = d - this.len;
    const rn1 = this.r1x*this.nx + this.r1y*this.ny;
    const rn2 = this.r2x*this.nx + this.r2y*this.ny;
    let k = A.im + B.im
          + A.iI*(this.r1x*this.r1x + this.r1y*this.r1y - rn1*rn1)
          + B.iI*(this.r2x*this.r2x + this.r2y*this.r2y - rn2*rn2);
    this.mass = k > 0 ? 1/k : 0;
    this.bias = clamp(-0.25/dt * C, -260, 260);
    const px=this.imp*this.nx, py=this.imp*this.ny;
    if(!A.fixed){ A.vx -= px*A.im; A.vy -= py*A.im; A.av -= (this.r1x*py - this.r1y*px)*A.iI; }
    if(!B.fixed){ B.vx += px*B.im; B.vy += py*B.im; B.av += (this.r2x*py - this.r2y*px)*B.iI; }
  }
  solve(){
    if(this.slack) return;
    const A=this.A,B=this.B;
    const dvx = (B.vx - B.av*this.r2y) - (A.vx - A.av*this.r1y);
    const dvy = (B.vy + B.av*this.r2x) - (A.vy + A.av*this.r1x);
    const vn = dvx*this.nx + dvy*this.ny;
    let imp = this.mass * (this.bias - vn);
    if(this.rope){
      const old=this.imp; this.imp = Math.min(0, old+imp); imp = this.imp-old;
    } else this.imp += imp;
    const px=imp*this.nx, py=imp*this.ny;
    if(!A.fixed){ A.vx -= px*A.im; A.vy -= py*A.im; A.av -= (this.r1x*py - this.r1y*px)*A.iI; }
    if(!B.fixed){ B.vx += px*B.im; B.vy += py*B.im; B.av += (this.r2x*py - this.r2y*px)*B.iI; }
  }
}

/* ------------------------------------------------- 3d. world */
class World {
  constructor(){
    this.bodies = [];
    this.joints = [];
    this.arbs = new Map();
    this.gx = 0; this.gy = 1580;
    this.stamp = 0;
    this.iter = 9;
    this.onContact = null;    // (A,B,impulse,x,y,nx,ny)
    this.fields = [];         // water / fans / wind, applied as forces
  }
  add(b){ this.bodies.push(b); return b; }
  remove(b){
    b.dead = true;
    const i = this.bodies.indexOf(b); if(i>=0) this.bodies.splice(i,1);
    for(let k=this.joints.length-1;k>=0;k--)
      if(this.joints[k].A===b || this.joints[k].B===b) this.joints.splice(k,1);
    for(const [key,a] of this.arbs) if(a.A===b || a.B===b) this.arbs.delete(key);
  }
  addJoint(j){
    this.joints.push(j);
    // A joint holds two bodies together AT a point, so they overlap there by
    // design. Letting the contact solver also shove them apart sets the two
    // against each other, and the loser is whichever converges slower -- this
    // is what detonated pendulums (plank overlapping its own pivot) and ropes
    // (every link overlapping its neighbour).
    if(j.A && j.B){
      (j.A.nocol || (j.A.nocol = new Set())).add(j.B.id);
      (j.B.nocol || (j.B.nocol = new Set())).add(j.A.id);
    }
    return j;
  }
  clear(){ this.bodies.length=0; this.joints.length=0; this.arbs.clear(); this.fields.length=0; }

  canCollide(A,B){
    if(A.fixed && B.fixed) return false;
    if(!A.awake && !B.awake) return false;
    if(A.group && A.group === B.group) return false;
    if(A.nocol && A.nocol.has(B.id)) return false;
    if(A.maxx < B.minx || B.maxx < A.minx || A.maxy < B.miny || B.maxy < A.miny) return false;
    return true;
  }

  step(dt){
    this.stamp++;
    const bodies = this.bodies;
    const n = bodies.length;

    for(let i=0;i<n;i++){ const b=bodies[i]; if(b.awake || b.fixed) b.sync(); }

    /* ---- broad + narrow phase */
    for(let i=0;i<n;i++){
      const A = bodies[i];
      for(let j=i+1;j<n;j++){
        const B = bodies[j];
        if(!this.canCollide(A,B)) continue;
        const m = collide(A,B);
        const key = A.id * 100000 + B.id;
        if(!m){ this.arbs.delete(key); continue; }
        // waking: a moving body wakes what it lands on
        if(A.awake && !B.awake && !B.fixed) B.wake();
        if(B.awake && !A.awake && !A.fixed) A.wake();
        if(A.sensor || B.sensor){
          if(this.onSensor) this.onSensor(A,B);
          this.arbs.delete(key);
          continue;
        }
        let arb = this.arbs.get(key);
        if(arb) arb.update(m);
        else { arb = new Arbiter(A,B,m); this.arbs.set(key,arb); }
        arb.stamp = this.stamp;
        arb.impulse = 0;
      }
    }
    for(const [key,a] of this.arbs) if(a.stamp !== this.stamp) this.arbs.delete(key);

    /* ---- integrate velocity */
    for(let i=0;i<n;i++){
      const b = bodies[i];
      if(b.fixed || !b.awake) continue;
      b.vx += this.gx * b.gscale * dt;
      b.vy += this.gy * b.gscale * dt;
      const ld = 1 / (1 + dt * b.linDamp);
      const ad = 1 / (1 + dt * b.angDamp);
      b.vx *= ld; b.vy *= ld; b.av *= ad;
    }
    for(const f of this.fields) f(dt, bodies);

    /* ---- solve */
    for(const [,a] of this.arbs) a.prestep(dt);
    for(const j of this.joints) j.prestep(dt);
    // Joints are swept in alternating directions. A chain solved end-to-end
    // the same way every iteration propagates correction from one end only,
    // so a heavy weight on a light rope never converges and the links thrash;
    // reversing every other pass carries it both ways for the same cost.
    const J = this.joints, nj = J.length;
    for(let it=0; it<this.iter; it++){
      for(const [,a] of this.arbs) a.solve();
      if(it & 1){ for(let k=nj-1;k>=0;k--) J[k].solve(dt); }
      else      { for(let k=0;k<nj;k++)    J[k].solve(dt); }
    }

    /* ---- integrate position */
    const maxV = 3600;
    for(let i=0;i<n;i++){
      const b = bodies[i];
      if(b.fixed || !b.awake) continue;
      const sp = Math.hypot(b.vx,b.vy);
      if(sp > maxV){ b.vx *= maxV/sp; b.vy *= maxV/sp; }
      if(b.av >  40) b.av =  40;
      if(b.av < -40) b.av = -40;
      b.x += b.vx*dt; b.y += b.vy*dt; b.a += b.av*dt;
    }

    /* ---- sleeping */
    for(let i=0;i<n;i++){
      const b = bodies[i];
      if(b.fixed || !b.awake) continue;
      if(!b.canSleep){ b.sleepT = 0; continue; }
      if(Math.hypot(b.vx,b.vy) < SLEEP_LIN && Math.abs(b.av) < SLEEP_ANG){
        b.sleepT += dt;
        if(b.sleepT > SLEEP_TIME) b.sleep();
      } else b.sleepT = 0;
    }

    /* ---- report meaningful impacts */
    if(this.onContact){
      for(const [,a] of this.arbs){
        const sp = -a.vn0;
        if(sp > 70 && a.contacts.length){
          const c = a.contacts[0];
          this.onContact(a.A, a.B, sp * a.rm, c.x, c.y, a.nx, a.ny, sp);
        }
      }
    }
  }

  queryPoint(px,py,filter){
    for(let i=this.bodies.length-1;i>=0;i--){
      const b=this.bodies[i];
      if(filter && !filter(b)) continue;
      if(px<b.minx||px>b.maxx||py<b.miny||py>b.maxy) continue;
      if(b.contains(px,py)) return b;
    }
    return null;
  }
  /* cheap segment cast against body AABBs then exact for the shapes we care about */
  raycastAny(x1,y1,x2,y2,filter){
    let bestT = 1, hit = null;
    for(const b of this.bodies){
      if(filter && !filter(b)) continue;
      const t = segBody(x1,y1,x2,y2,b);
      if(t !== null && t < bestT){ bestT = t; hit = b; }
    }
    return hit ? { body:hit, t:bestT, x:x1+(x2-x1)*bestT, y:y1+(y2-y1)*bestT } : null;
  }
  wakeAll(){ for(const b of this.bodies) if(!b.fixed) b.wake(); }
}

function segBody(x1,y1,x2,y2,b){
  if(b.shape==='circle'){
    const dx=x2-x1, dy=y2-y1;
    const fx=x1-b.x, fy=y1-b.y;
    const A=dx*dx+dy*dy, B=2*(fx*dx+fy*dy), C=fx*fx+fy*fy-b.r*b.r;
    let disc=B*B-4*A*C; if(disc<0||A===0) return null;
    disc=Math.sqrt(disc);
    const t1=(-B-disc)/(2*A);
    if(t1>=0&&t1<=1) return t1;
    const t2=(-B+disc)/(2*A);
    if(t2>=0&&t2<=1) return t2;
    return null;
  }
  // slab clip against the convex polygon's half planes
  let lo=0, hi=1;
  const dx=x2-x1, dy=y2-y1;
  for(let i=0;i<b.wv.length;i++){
    const nx=b.wn[i].x, ny=b.wn[i].y;
    const num = (b.wv[i].x-x1)*nx + (b.wv[i].y-y1)*ny;
    const den = dx*nx + dy*ny;
    if(Math.abs(den)<1e-9){ if(num<0) return null; continue; }
    const t = num/den;
    if(den < 0){ if(t > lo) lo = t; }
    else       { if(t < hi) hi = t; }
    if(lo > hi) return null;
  }
  return lo <= hi && lo >= 0 && lo <= 1 ? lo : null;
}

/* =====================================================================
   4. TEXTURES
   Everything is drawn once into an offscreen canvas and cached by size,
   then blitted with a rotation. Keeps the per frame cost to drawImage.
   ===================================================================== */
const TEXC = new Map();
function tex(key, w, h, draw){
  const k = key + '|' + Math.round(w) + '|' + Math.round(h);
  let c = TEXC.get(k);
  if(c) return c;
  const pad = 6;
  c = mkcv(w + pad*2, h + pad*2);
  const g = c.getContext('2d');
  g.translate(pad, pad);
  seed((Math.round(w)*73856093) ^ (Math.round(h)*19349663) ^ hashStr(key));
  draw(g, w, h);
  c.padx = pad; c.pady = pad;
  TEXC.set(k, c);
  return c;
}
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

function shade(g,x,y,w,h,c1,c2){
  const gr = g.createLinearGradient(x,y,x,y+h);
  gr.addColorStop(0,c1); gr.addColorStop(1,c2);
  g.fillStyle = gr; g.fillRect(x,y,w,h);
}
function rivet(g,x,y,r,light='#e8d9b8',dark='#4a3316'){
  g.fillStyle = dark; g.beginPath(); g.arc(x,y+0.6,r,0,TAU); g.fill();
  const gr = g.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r);
  gr.addColorStop(0,light); gr.addColorStop(1,dark);
  g.fillStyle = gr; g.beginPath(); g.arc(x,y,r*0.86,0,TAU); g.fill();
}
function grain(g,w,h,n,col,alpha){
  g.strokeStyle = col; g.globalAlpha = alpha; g.lineWidth = 1;
  for(let i=0;i<n;i++){
    const y = srnd()*h;
    g.beginPath();
    g.moveTo(0,y);
    let cy = y;
    for(let x=0;x<w;x+=14){ cy += (srnd()-0.5)*2.2; g.lineTo(x,cy); }
    g.lineTo(w,cy);
    g.stroke();
  }
  g.globalAlpha = 1;
}

/* -- a riveted plank, the backbone of every level -- */
function texPlank(w,h,mat){
  return tex('pl_'+mat, w, h, (g,w,h)=>{
    const horiz = w >= h;
    const P = PLANK_PAL[mat] || PLANK_PAL.wood;
    // drop shadow
    g.fillStyle = 'rgba(0,0,0,0.34)';
    rr(g, 1.5, 3.5, w, h, Math.min(4,h*0.3)); g.fill();
    // body
    rr(g, 0, 0, w, h, Math.min(3.5,h*0.28)); g.save(); g.clip();
    shade(g,0,0,w,h,P.top,P.bot);
    if(horiz) grain(g,w,h, Math.max(3,Math.round(h/3.2)), P.grain, 0.30);
    else {
      g.save(); g.translate(w,0); g.rotate(PI/2);
      grain(g,h,w, Math.max(3,Math.round(w/3.2)), P.grain, 0.30);
      g.restore();
    }
    // bevel
    g.fillStyle='rgba(255,255,255,0.17)'; g.fillRect(0,0,w,Math.max(1.5,h*0.10));
    g.fillStyle='rgba(0,0,0,0.30)';       g.fillRect(0,h-Math.max(1.5,h*0.13),w,Math.max(1.5,h*0.13));
    // metal end caps
    const cap = clamp(Math.min(w,h)*0.55, 5, 13);
    if(horiz && w > cap*3){
      for(const cx of [0, w-cap]){
        shade(g,cx,0,cap,h,P.cap1,P.cap2);
        g.fillStyle='rgba(0,0,0,0.30)'; g.fillRect(cx + (cx===0?cap-1.2:0),0,1.2,h);
      }
    } else if(!horiz && h > cap*3){
      for(const cy of [0, h-cap]){
        shade(g,0,cy,w,cap,P.cap1,P.cap2);
        g.fillStyle='rgba(0,0,0,0.30)'; g.fillRect(0,cy + (cy===0?cap-1.2:0),w,1.2);
      }
    }
    g.restore();
    // outline
    g.strokeStyle = P.line; g.lineWidth = 1.4;
    rr(g,0.7,0.7,w-1.4,h-1.4,Math.min(3.5,h*0.28)); g.stroke();
    // rivets
    const rr_ = clamp(Math.min(w,h)*0.19, 1.8, 4.3);
    const inset = Math.max(3.5, rr_*2.0);
    if(horiz){
      const span = w - inset*2;
      const cnt = clamp(Math.round(span/52)+2, 2, 14);
      for(let i=0;i<cnt;i++){
        const x = inset + span*(cnt===1?0.5:i/(cnt-1));
        if(h > 15){ rivet(g,x,inset,rr_,P.riv1,P.riv2); rivet(g,x,h-inset,rr_,P.riv1,P.riv2); }
        else rivet(g,x,h*0.5,rr_,P.riv1,P.riv2);
      }
    } else {
      const span = h - inset*2;
      const cnt = clamp(Math.round(span/52)+2, 2, 14);
      for(let i=0;i<cnt;i++){
        const y = inset + span*(cnt===1?0.5:i/(cnt-1));
        if(w > 15){ rivet(g,inset,y,rr_,P.riv1,P.riv2); rivet(g,w-inset,y,rr_,P.riv1,P.riv2); }
        else rivet(g,w*0.5,y,rr_,P.riv1,P.riv2);
      }
    }
  });
}
const PLANK_PAL = {
  wood:  { top:'#c39a5e', bot:'#8a5f2c', grain:'#5c3a17', line:'#432a10', cap1:'#a8814a', cap2:'#6d4720', riv1:'#f0e0bd', riv2:'#4a3316' },
  stone: { top:'#8d94a0', bot:'#4f5560', grain:'#3a3f48', line:'#272b32', cap1:'#7b828d', cap2:'#464b55', riv1:'#d8dde5', riv2:'#33373e' },
  metal: { top:'#b9c2cc', bot:'#5c6672', grain:'#48515c', line:'#242a31', cap1:'#8e98a4', cap2:'#3f4750', riv1:'#f2f6fb', riv2:'#2c323a' },
  ice:   { top:'#d6f2fb', bot:'#8fc9e6', grain:'#bfe6f6', line:'#5f9dbd', cap1:'#c3e7f7', cap2:'#87c0dd', riv1:'#ffffff', riv2:'#6aa6c4' },
  rubber:{ top:'#5a4a52', bot:'#2e2429', grain:'#211a1e', line:'#171114', cap1:'#4a3c43', cap2:'#241c20', riv1:'#c9b6bf', riv2:'#181215' },
  moss:  { top:'#a8b06a', bot:'#5b6634', grain:'#33401c', line:'#1c2410', cap1:'#8d9550', cap2:'#47522a', riv1:'#eef3c8', riv2:'#232b14' },
  brass: { top:'#e6bd5e', bot:'#8a6420', grain:'#654716', line:'#3e2b0d', cap1:'#c49a3f', cap2:'#7a561c', riv1:'#ffeec0', riv2:'#4a350f' }
};

/* -- crates and blocks that move: four facets meeting at the middle,
      a metal frame, and a fat bolt proud of every corner -- */
// `v` is a variant index. Boxes of one size used to share a single cached
// texture, so a stack of five crates was the same crate drawn five times and
// read as wallpaper. A handful of variants, chosen per body and stable for
// its lifetime, breaks that up for the cost of a few more cached canvases.
function texCrate(w,h,mat,v){
  return tex('cr2_'+mat+'_'+(v||0), w, h, (g,w,h)=>{
    const P = CRATE_PAL[mat] || CRATE_PAL.wood;
    g.fillStyle='rgba(0,0,0,0.38)'; rr(g,2.5,4,w,h,3); g.fill();
    const fr = clamp(Math.min(w,h)*0.13, 3, 8);      // frame thickness
    // the four facets
    const cx = w/2, cy = h/2;
    const facets = [
      [[0,0],[w,0],[cx,cy], P.up],
      [[w,0],[w,h],[cx,cy], P.rt],
      [[w,h],[0,h],[cx,cy], P.dn],
      [[0,h],[0,0],[cx,cy], P.lf]
    ];
    g.save();
    rr(g,0,0,w,h,3); g.clip();
    for(const [a,b2,c,col] of facets){
      g.fillStyle = col;
      g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b2[0],b2[1]); g.lineTo(c[0],c[1]); g.closePath(); g.fill();
    }
    // grain across the face
    g.globalAlpha = 0.16; g.strokeStyle = P.line; g.lineWidth = 1;
    for(let i=0;i<7;i++){
      const t2 = (i+1)/8;
      g.beginPath(); g.moveTo(0,h*t2); g.lineTo(w,h*t2); g.stroke();
    }
    g.globalAlpha = 1;
    // metal frame
    const fg = g.createLinearGradient(0,0,0,h);
    fg.addColorStop(0,P.f1); fg.addColorStop(0.5,P.f2); fg.addColorStop(1,P.f3);
    g.fillStyle = fg;
    g.fillRect(0,0,w,fr); g.fillRect(0,h-fr,w,fr);
    g.fillRect(0,0,fr,h); g.fillRect(w-fr,0,fr,h);
    g.strokeStyle='rgba(0,0,0,0.45)'; g.lineWidth=1;
    g.strokeRect(fr-0.5,fr-0.5,w-fr*2+1,h-fr*2+1);
    g.fillStyle='rgba(255,255,255,0.22)'; g.fillRect(0,0,w,1.6);
    g.restore();
    g.strokeStyle=P.line; g.lineWidth=1.5; rr(g,0.8,0.8,w-1.6,h-1.6,3); g.stroke();
    // bolts stand proud of the corners
    const bR = clamp(Math.min(w,h)*0.11, 2.4, 6);
    for(const [bx,by,sa] of [[fr*0.55,fr*0.55,0.5],[w-fr*0.55,fr*0.55,-0.7],
                             [fr*0.55,h-fr*0.55,1.2],[w-fr*0.55,h-fr*0.55,0.2]]){
      rivet(g,bx,by,bR,P.riv1,P.riv2);
      g.save(); g.translate(bx,by); g.rotate(sa);
      g.strokeStyle='rgba(40,28,12,0.75)'; g.lineWidth=Math.max(0.9,bR*0.28);
      g.beginPath(); g.moveTo(-bR*0.62,0); g.lineTo(bR*0.62,0); g.stroke();
      g.restore();
    }
  });
}
const CRATE_PAL = {

           line:'#4a3517', f1:'#c9b083', f2:'#a08256', f3:'#6f5731', riv1:'#f6ecd0', riv2:'#4a3517' },
  stone: { up:'#9aa2ad', rt:'#7a828d', dn:'#5d646e', lf:'#89919c',
           line:'#2b3038', f1:'#a3abb6', f2:'#79818c', f3:'#4e555e', riv1:'#e6ecf4', riv2:'#2b3038' },

/* -- a big framed box: riveted border, panelled face -- */
function texPanel(w,h,mat){
  return tex('pan_'+mat, w, h, (g,w,h)=>{
    const P = PLANK_PAL[mat] || PLANK_PAL.wood;
    g.fillStyle='rgba(0,0,0,0.36)'; rr(g,2,4,w,h,4); g.fill();
    rr(g,0,0,w,h,4); g.save(); g.clip();
    shade(g,0,0,w,h,P.top,P.bot);
    grain(g,w,h, Math.max(5,Math.round(h/9)), P.grain, 0.22);
    // panels inside the frame
    const fr = clamp(Math.min(w,h)*0.11, 7, 15);
    const cells = Math.max(2, Math.round(w / 132));
    const cw = (w - fr*2) / cells;
    g.strokeStyle = P.line; g.globalAlpha = 0.55; g.lineWidth = 2;
    for(let i=1;i<cells;i++){
      const cx = fr + cw*i;
      g.beginPath(); g.moveTo(cx, fr); g.lineTo(cx, h-fr); g.stroke();
    }
    g.globalAlpha = 0.30; g.strokeStyle='#fff'; g.lineWidth=1;
    for(let i=1;i<cells;i++){
      const cx = fr + cw*i + 1.6;
      g.beginPath(); g.moveTo(cx, fr); g.lineTo(cx, h-fr); g.stroke();
    }
    g.globalAlpha = 1;
    // recessed inner shadow
    g.strokeStyle='rgba(0,0,0,0.32)'; g.lineWidth=2.4;
    g.strokeRect(fr, fr, w-fr*2, h-fr*2);
    g.strokeStyle='rgba(255,240,205,0.20)'; g.lineWidth=1.2;
    g.strokeRect(fr+2, fr+2, w-fr*2-4, h-fr*2-4);
    // the metal frame
    const fg = g.createLinearGradient(0,0,0,h);
    fg.addColorStop(0,P.cap1); fg.addColorStop(1,P.cap2);
    g.fillStyle=fg; g.globalAlpha=0.92;
    g.fillRect(0,0,w,fr*0.75); g.fillRect(0,h-fr*0.75,w,fr*0.75);
    g.fillRect(0,0,fr*0.75,h); g.fillRect(w-fr*0.75,0,fr*0.75,h);
    g.globalAlpha=1;
    g.fillStyle='rgba(255,248,225,0.20)'; g.fillRect(0,0,w,2.2);
    g.fillStyle='rgba(0,0,0,0.28)'; g.fillRect(0,h-3,w,3);
    g.restore();
    g.strokeStyle=P.line; g.lineWidth=1.6; rr(g,0.8,0.8,w-1.6,h-1.6,4); g.stroke();
    // rivets round the frame
    const rv = clamp(Math.min(w,h)*0.055, 2, 3.4);
    const ins = clamp(Math.min(w,h)*0.055, 5, 9);
    const nx2 = clamp(Math.round(w/56)+1, 3, 20);
    for(let i=0;i<nx2;i++){
      const x = ins + (w-ins*2)*(i/(nx2-1));
      rivet(g,x,ins,rv,P.riv1,P.riv2); rivet(g,x,h-ins,rv,P.riv1,P.riv2);
    }
    const ny2 = clamp(Math.round(h/56)+1, 2, 10);
    for(let i=1;i<ny2-1;i++){
      const y = ins + (h-ins*2)*(i/(ny2-1));
      rivet(g,ins,y,rv,P.riv1,P.riv2); rivet(g,w-ins,y,rv,P.riv1,P.riv2);
    }
  });
}

/* -- the pale pine box of the almanac rooms -- */
function texPine(w,h){
  return tex('pine', w, h, (g,w,h)=>{
    g.fillStyle='rgba(0,0,0,0.34)'; rr(g,2,4,w,h,5); g.fill();
    // outer frame
    const fg = g.createLinearGradient(0,0,0,h);
    fg.addColorStop(0,'#e8c98a'); fg.addColorStop(0.5,'#d9b673'); fg.addColorStop(1,'#b8944f');
    g.fillStyle=fg; rr(g,0,0,w,h,5); g.fill();
    const fr = clamp(Math.min(w,h)*0.13, 4, 11);
    // grooves down the frame sides
    g.strokeStyle='rgba(120,88,40,0.42)'; g.lineWidth=1;
    for(let y=3;y<h-3;y+=4){
      g.beginPath(); g.moveTo(1.4,y); g.lineTo(fr-1.4,y);
      g.moveTo(w-fr+1.4,y); g.lineTo(w-1.4,y); g.stroke();
    }
    // recessed inner panel
    g.save();
    rr(g,fr,fr,w-fr*2,h-fr*2,3); g.clip();
    const pg = g.createLinearGradient(0,fr,0,h-fr);
    pg.addColorStop(0,'#f6e2b0'); pg.addColorStop(0.45,'#f0d69a'); pg.addColorStop(1,'#e0bf7c');
    g.fillStyle=pg; g.fillRect(fr,fr,w-fr*2,h-fr*2);
    g.strokeStyle='rgba(176,132,66,0.30)'; g.lineWidth=1.1;
    for(let i=0;i<6;i++){
      const y = fr + (h-fr*2)*(i+0.6)/6.4;
      g.beginPath(); g.moveTo(fr, y);
      let cy=y; for(let x=fr;x<w-fr;x+=12){ cy += (Math.sin(x*0.3+i)*0.9); g.lineTo(x, cy); }
      g.stroke();
    }
    g.restore();
    g.strokeStyle='rgba(140,102,48,0.75)'; g.lineWidth=1.4;
    rr(g,fr,fr,w-fr*2,h-fr*2,3); g.stroke();
    g.strokeStyle='rgba(255,246,214,0.55)'; g.lineWidth=1;
    rr(g,fr+1.4,fr+1.4,w-fr*2-2.8,h-fr*2-2.8,2.4); g.stroke();
    g.strokeStyle='#8a6428'; g.lineWidth=1.5; rr(g,0.8,0.8,w-1.6,h-1.6,5); g.stroke();
    // two little screws, opposite corners
    const s = clamp(Math.min(w,h)*0.045, 1.4, 2.6);
    g.fillStyle='#7a5a26';
    g.beginPath(); g.arc(fr+s*2.4, fr+s*2.4, s, 0, TAU); g.fill();
    g.beginPath(); g.arc(w-fr-s*2.4, h-fr-s*2.4, s, 0, TAU); g.fill();
  });
}

/* -- a plain sawn board, no ironwork -- */
function texBoard(w,h){
  return tex('board', w, h, (g,w,h)=>{
    g.fillStyle='rgba(0,0,0,0.34)'; rr(g,2,3.5,w,h,3); g.fill();
    const gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'#f0d59a'); gr.addColorStop(0.42,'#dcbb78');
    gr.addColorStop(1,'#b2894a');
    g.fillStyle=gr; rr(g,0,0,w,h,3); g.fill();
    g.save(); rr(g,0,0,w,h,3); g.clip();
    grain(g,w,h, Math.max(3,Math.round(h/3.4)), '#9a733c', 0.26);
    g.fillStyle='rgba(255,248,222,0.34)'; g.fillRect(0,0,w,Math.max(1.4,h*0.14));
    g.fillStyle='rgba(0,0,0,0.22)'; g.fillRect(0,h-Math.max(1.4,h*0.16),w,Math.max(1.4,h*0.16));
    g.restore();
    g.strokeStyle='#8a6229'; g.lineWidth=1.3; rr(g,0.7,0.7,w-1.4,h-1.4,3); g.stroke();
  });
}

function texGlass(w,h){
  return tex('glass', w, h, (g,w,h)=>{
    rr(g,0,0,w,h,3); g.save(); g.clip();
    const gr=g.createLinearGradient(0,0,w,h);
    gr.addColorStop(0,'rgba(190,235,250,0.55)');
    gr.addColorStop(0.45,'rgba(140,200,225,0.34)');
    gr.addColorStop(1,'rgba(200,240,255,0.5)');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
    g.strokeStyle='rgba(255,255,255,0.6)'; g.lineWidth=Math.max(2,w*0.05);
    g.beginPath(); g.moveTo(w*0.16,h); g.lineTo(w*0.5,0); g.stroke();
    g.globalAlpha=0.4;
    g.beginPath(); g.moveTo(w*0.55,h); g.lineTo(w*0.86,0); g.stroke();
    g.globalAlpha=1;
    g.restore();
    g.strokeStyle='rgba(225,248,255,0.85)'; g.lineWidth=1.6; rr(g,0.9,0.9,w-1.8,h-1.8,3); g.stroke();
  });
}

function texTNT(w,h){
  return tex('tnt', w, h, (g,w,h)=>{
    g.fillStyle='rgba(0,0,0,0.34)'; rr(g,2,3.5,w,h,3); g.fill();
    rr(g,0,0,w,h,3); g.save(); g.clip();
    shade(g,0,0,w,h,'#b8442c','#6d2214');
    grain(g,w,h,4,'#4a1409',0.3);
    g.fillStyle='#e8d9b0'; g.fillRect(0,h*0.34,w,h*0.30);
    g.fillStyle='#8f2d18';
    g.font = 'bold ' + Math.round(h*0.24) + 'px Georgia,serif';
    g.textAlign='center'; g.textBaseline='middle';
    if(w>26) g.fillText('TNT', w/2, h*0.50);
    g.fillStyle='rgba(255,255,255,0.14)'; g.fillRect(0,0,w,2);
    g.fillStyle='rgba(0,0,0,0.28)'; g.fillRect(0,h-3,w,3);
    g.restore();
    g.strokeStyle='#3d1108'; g.lineWidth=1.5; rr(g,0.8,0.8,w-1.6,h-1.6,3); g.stroke();
    // fuse
    g.strokeStyle='#5a4326'; g.lineWidth=2;
    g.beginPath(); g.moveTo(w*0.5,0); g.quadraticCurveTo(w*0.68,-5,w*0.58,-9); g.stroke();
  });
}

function texMetalBall(r,mat){
  return tex('ball_'+mat, r*2, r*2, (g,w)=>{
    const R=w/2;
    g.fillStyle='rgba(0,0,0,0.34)'; g.beginPath(); g.arc(R+1.5,R+3,R,0,TAU); g.fill();
    const P = PLANK_PAL[mat] || PLANK_PAL.stone;
    const gr=g.createRadialGradient(R-R*0.4,R-R*0.45,R*0.1,R,R,R);
    gr.addColorStop(0,P.top); gr.addColorStop(0.65,P.bot); gr.addColorStop(1,P.line);
    g.fillStyle=gr; g.beginPath(); g.arc(R,R,R,0,TAU); g.fill();
    g.strokeStyle=P.line; g.lineWidth=1.4; g.beginPath(); g.arc(R,R,R-0.7,0,TAU); g.stroke();
    g.fillStyle='rgba(255,255,255,0.5)';
    g.beginPath(); g.ellipse(R-R*0.35,R-R*0.42,R*0.24,R*0.16,-0.6,0,TAU); g.fill();
    if(r>9){ g.strokeStyle='rgba(0,0,0,0.25)'; g.lineWidth=1;
      g.beginPath(); g.arc(R,R,R*0.62,0.3,2.3); g.stroke(); }
  });
}

/* The wall the original builds nearly every interior room on: big padded
   panels, dark and low in contrast so the woodwork in front of them reads.
   Roughly six across the screen -- much larger, and much quieter, than a
   brick course. Each theme supplies its own palette. */
const PANEL_PAL = {
  0: { gap:'#150c05', hi:'#3f2715', mid:'#2b1a0d', lo:'#190e06',
       edge:'rgba(126,84,44,0.26)', shade:'rgba(0,0,0,0.34)' },
  1: { gap:'#0a0e13', hi:'#2c343f', mid:'#1f252d', lo:'#141920',
       edge:'rgba(104,124,148,0.22)', shade:'rgba(0,0,0,0.36)' },
  2: { gap:'#0d0912', hi:'#332443', mid:'#241931', lo:'#160f1f',
       edge:'rgba(128,98,164,0.20)', shade:'rgba(0,0,0,0.36)' },
  3: { gap:'#090a04', hi:'#272814', mid:'#1a1b0e', lo:'#101106',
       edge:'rgba(104,116,58,0.18)', shade:'rgba(0,0,0,0.38)' },
  4: { gap:'#150603', hi:'#42190e', mid:'#2e110a', lo:'#1c0905',
       edge:'rgba(154,68,36,0.24)', shade:'rgba(0,0,0,0.36)' },
  6: { gap:'#160d05', hi:'#402d16', mid:'#2d200f', lo:'#1b1308',
       edge:'rgba(144,104,52,0.22)', shade:'rgba(0,0,0,0.34)' }
};
function panelWall(g, th){
  const P = PANEL_PAL[th] || PANEL_PAL[0];
  g.fillStyle = P.gap; g.fillRect(0,0,DW,DH);
  const s = 152, gap = 13, r = 15, w = s-gap;
  for(let y=-26; y<DH+s; y+=s) for(let x=-34; x<DW+s; x+=s){
    const gr = g.createLinearGradient(x,y,x,y+w);
    gr.addColorStop(0,P.hi); gr.addColorStop(0.52,P.mid); gr.addColorStop(1,P.lo);
    g.fillStyle = gr; rr(g,x,y,w,w,r); g.fill();
    g.strokeStyle = P.edge; g.lineWidth = 2;
    rr(g,x+1.2,y+1.2,w-2.4,w-2.4,r-1); g.stroke();
    const sg = g.createLinearGradient(0,y+w*0.44,0,y+w);
    sg.addColorStop(0,'rgba(0,0,0,0)'); sg.addColorStop(1,P.shade);
    g.fillStyle = sg; rr(g,x,y,w,w,r); g.fill();
  }
}

const BGC = new Map();
function background(th){
  if(BGC.has(th)) return BGC.get(th);
  const c = mkcv(DW,DH), g = c.getContext('2d');
  seed(4001 + th*977);
  if(th===0){        // padded leather blocks, warm workshop dark
    panelWall(g,0);
  } else if(th===1){ // cellars: the same panels, cold and slate grey
    panelWall(g,1);
  } else if(th===2){ // clockworks, panels with brass gears turning behind
    panelWall(g,2);
    for(let i=0;i<16;i++){
      const x=srnd()*DW, y=srnd()*DH, R=26+srnd()*74, teeth=Math.round(R/6)+6;
      g.save(); g.translate(x,y); g.rotate(srnd()*TAU);
      g.fillStyle=`rgba(${140+srnd()*40|0},${105+srnd()*30|0},${52},0.13)`;
      g.beginPath();
      for(let t=0;t<teeth;t++){
        const a1=t/teeth*TAU, a2=(t+0.5)/teeth*TAU, a3=(t+1)/teeth*TAU;
        g.lineTo(Math.cos(a1)*R,Math.sin(a1)*R);
        g.lineTo(Math.cos(a2)*R*1.16,Math.sin(a2)*R*1.16);
        g.lineTo(Math.cos(a3)*R,Math.sin(a3)*R);
      }
      g.closePath(); g.fill();
      g.globalCompositeOperation='destination-out';
      g.beginPath(); g.arc(0,0,R*0.34,0,TAU); g.fill();
      g.globalCompositeOperation='source-over';
      g.restore();
    }
    const vg=g.createRadialGradient(DW/2,DH/2,80,DW/2,DH/2,DW*0.7);
    vg.addColorStop(0,'rgba(80,50,110,0.18)'); vg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=vg; g.fillRect(0,0,DW,DH);
  } else if(th===3){ // hothouse: panels gone green, and the vines over them
    panelWall(g,3);
    // vines down the walls
    for(let i=0;i<14;i++){
      let x=srnd()*DW, y=-20;
      const len=160+srnd()*380;
      g.strokeStyle=`rgba(${52+srnd()*30|0},${96+srnd()*40|0},${38+srnd()*24|0},0.65)`;
      g.lineWidth=2.4+srnd()*2;
      g.beginPath(); g.moveTo(x,y);
      const pts=[];
      for(let k=0;k<10 && y<len;k++){ x+=(srnd()-0.5)*46; y+=len/10; g.lineTo(x,y); pts.push([x,y]); }
      g.stroke();
      for(const [lx,ly] of pts){
        for(let s=0;s<2;s++){
          g.save(); g.translate(lx+(srnd()-0.5)*16, ly+(srnd()-0.5)*10); g.rotate(srnd()*TAU);
          g.fillStyle=`rgba(${60+srnd()*46|0},${112+srnd()*54|0},${44+srnd()*26|0},0.72)`;
          g.beginPath(); g.ellipse(0,0,5+srnd()*5,10+srnd()*9,0,0,TAU); g.fill();
          g.restore();
        }
      }
    }
  } else if(th===7){ // chalk sketches on a black board
    g.fillStyle='#050608'; g.fillRect(0,0,DW,DH);
    const sketch = (cx,cy,s,rot)=>{
      g.save(); g.translate(cx,cy); g.rotate(rot); g.scale(s,s);
      g.strokeStyle='rgba(96,178,232,0.55)'; g.lineWidth=1.6; g.lineJoin='round';
      // a carapace of panels, drawn like a field note
      const segs = 4 + Math.floor(srnd()*3);
      let px=0, py=0;
      for(let i=0;i<segs;i++){
        const w2 = 26+srnd()*30, h2 = 16+srnd()*22;
        g.beginPath();
        g.moveTo(px, py);
        g.lineTo(px+w2, py-4-srnd()*8);
        g.lineTo(px+w2+6, py+h2*0.6);
        g.lineTo(px+4, py+h2);
        g.closePath(); g.stroke();
        px += w2*0.72; py += 5 - srnd()*10;
      }
      // ribs
      g.strokeStyle='rgba(76,150,210,0.4)'; g.lineWidth=1.1;
      for(let i=0;i<7;i++){
        const t2=i/6;
        g.beginPath();
        g.moveTo(px*t2*0.9, -10 - srnd()*8);
        g.quadraticCurveTo(px*t2, 12, px*t2*1.05, 30+srnd()*16);
        g.stroke();
      }
      // legs
      g.strokeStyle='rgba(110,190,240,0.45)'; g.lineWidth=1.4;
      for(let i=0;i<4;i++){
        const bx=px*(0.2+i*0.22);
        g.beginPath(); g.moveTo(bx, 26);
        g.lineTo(bx-8-srnd()*12, 46+srnd()*16);
        g.lineTo(bx-2-srnd()*18, 66+srnd()*18);
        g.stroke();
      }
      g.restore();
    };
    for(let i=0;i<16;i++)
      sketch(srnd()*DW, srnd()*DH, 0.55+srnd()*0.95, (srnd()-0.5)*1.5);
    g.strokeStyle='rgba(70,140,200,0.22)'; g.lineWidth=1;
    for(let i=0;i<26;i++){
      g.beginPath();
      let x=srnd()*DW, y=srnd()*DH;
      g.moveTo(x,y);
      for(let k=0;k<3;k++){ x+=(srnd()-0.5)*130; y+=(srnd()-0.5)*90; g.lineTo(x,y); }
      g.stroke();
    }
  } else if(th===6){ // torn almanac pages, scorched at the edges
    g.fillStyle='#1a1209'; g.fillRect(0,0,DW,DH);
    const words = ['SEALS','ORGAN','St.Jacobs','ALMANAC','CURE','OIL','No.7','TONIC','REMEDY'];
    for(let n=0;n<26;n++){
      const pw = 190 + srnd()*230, ph = 200 + srnd()*250;
      const px = -70 + srnd()*(DW+80), py = -70 + srnd()*(DH+80);
      g.save();
      g.translate(px+pw/2, py+ph/2); g.rotate((srnd()-0.5)*0.5);
      // scorched edge
      g.fillStyle='rgba(28,14,5,0.9)';
      rr(g,-pw/2-5,-ph/2-5,pw+10,ph+10,4); g.fill();
      const paper = 108 + srnd()*44;
      g.fillStyle=`rgb(${Math.round(paper)},${Math.round(paper*0.84)},${Math.round(paper*0.60)})`;
      rr(g,-pw/2,-ph/2,pw,ph,2); g.fill();
      g.save(); rr(g,-pw/2,-ph/2,pw,ph,2); g.clip();
      // burn creeping in from the edges
      const bg2=g.createRadialGradient(0,0,pw*0.22,0,0,pw*0.78);
      bg2.addColorStop(0,'rgba(0,0,0,0)'); bg2.addColorStop(1,'rgba(30,14,4,0.85)');
      g.fillStyle=bg2; g.fillRect(-pw/2,-ph/2,pw,ph);
      // columns of type
      const cols = 2 + Math.floor(srnd()*2);
      const cw2 = (pw-22)/cols;
      g.fillStyle='rgba(38,24,10,0.62)';
      for(let c=0;c<cols;c++){
        const cx2 = -pw/2 + 11 + c*cw2;
        let yy = -ph/2 + 14;
        if(srnd()<0.5){
          g.save();
          g.font = `bold ${13+srnd()*13|0}px Georgia, serif`;
          g.textAlign='left'; g.textBaseline='top';
          g.fillStyle='rgba(30,18,6,0.72)';
          g.fillText(words[(n*3+c)%words.length], cx2, yy);
          g.restore();
          yy += 26;
        }
        while(yy < ph/2 - 12){
          const lw = cw2 - 8 - srnd()*10;
          g.fillRect(cx2, yy, lw, 1.5);
          yy += 4.6;
        }
      }
      g.restore();
      g.restore();
    }
    const vg2=g.createRadialGradient(DW/2,DH*0.45,DH*0.26,DW/2,DH/2,DW*0.72);
    vg2.addColorStop(0,'rgba(0,0,0,0)'); vg2.addColorStop(1,'rgba(10,5,2,0.6)');
    g.fillStyle=vg2; g.fillRect(0,0,DW,DH);
  } else if(th===5){ // open sky over old brickwork
    const sg=g.createLinearGradient(0,0,0,DH);
    sg.addColorStop(0,'#5aa9dd'); sg.addColorStop(0.55,'#9fd0ea'); sg.addColorStop(1,'#d8ecf5');
    g.fillStyle=sg; g.fillRect(0,0,DW,DH);
    for(let i=0;i<11;i++){
      const cx=srnd()*DW, cy=40+srnd()*300, s=0.5+srnd()*1.1;
      g.save(); g.translate(cx,cy); g.scale(s,s);
      g.fillStyle='rgba(255,255,255,0.86)';
      for(const [ox,oy,r] of [[-42,6,26],[-12,-8,34],[22,2,28],[52,10,20]]){
        g.beginPath(); g.arc(ox,oy,r,0,TAU); g.fill();
      }
      g.fillStyle='rgba(206,228,242,0.75)';
      g.beginPath(); g.ellipse(0,16,66,13,0,0,TAU); g.fill();
      g.restore();
    }
    // distant brick towers along the floor
    g.fillStyle='rgba(120,140,155,0.30)';
    for(let x=-30;x<DW+60;x+=110){
      const h2=90+srnd()*140;
      g.fillRect(x,DH-h2,86,h2);
      g.fillStyle='rgba(100,120,136,0.18)';
      for(let y=DH-h2;y<DH;y+=14) g.fillRect(x,y,86,1.4);
      g.fillStyle='rgba(120,140,155,0.30)';
    }
  } else {           // furnace: panels scorched red, embers at the floor
    panelWall(g,4);
    const gg=g.createLinearGradient(0,DH*0.55,0,DH);
    gg.addColorStop(0,'rgba(255,90,20,0)'); gg.addColorStop(1,'rgba(255,110,30,0.30)');
    g.fillStyle=gg; g.fillRect(0,DH*0.55,DW,DH*0.45);
  }
  // shared vignette
  const vg=g.createRadialGradient(DW/2,DH*0.45,DH*0.30,DW/2,DH*0.5,DW*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.62)');
  g.fillStyle=vg; g.fillRect(0,0,DW,DH);
  BGC.set(th,c);
  return c;
}

/* ---------------------------------------------------- 4c. set pieces */
function drawTarget(g,x,y,r,t,hit,ang){
  g.save(); g.translate(x,y); if(ang) g.rotate(ang);
  const pulse = hit ? 1 : 1 + Math.sin(t*3.4)*0.028;
  g.scale(pulse,pulse);
  g.fillStyle='rgba(0,0,0,0.42)'; g.beginPath(); g.arc(2,4,r,0,TAU); g.fill();
  const rings = [ [1.00,'#efe3ca'], [0.86,'#c33a2c'], [0.64,'#f0e6d0'], [0.42,'#c33a2c'], [0.21,'#f2ead6'] ];
  for(const [f,col] of rings){
    g.fillStyle = col; g.beginPath(); g.arc(0,0,r*f,0,TAU); g.fill();
  }
  // weathering
  g.globalAlpha=0.16; g.fillStyle='#4a2a10';
  for(let i=0;i<9;i++){ const a=i*2.1, d=r*(0.2+((i*37)%50)/100);
    g.beginPath(); g.arc(Math.cos(a)*d,Math.sin(a)*d,r*0.07,0,TAU); g.fill(); }
  g.globalAlpha=1;
  const gl=g.createRadialGradient(-r*0.35,-r*0.4,r*0.05,0,0,r);
  gl.addColorStop(0,'rgba(255,255,255,0.34)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(0,0,r,0,TAU); g.fill();
  g.strokeStyle='rgba(60,26,10,0.85)'; g.lineWidth=2.2; g.beginPath(); g.arc(0,0,r-1,0,TAU); g.stroke();
  if(!hit){
    g.strokeStyle=`rgba(255,235,180,${0.30+0.22*Math.sin(t*3.4)})`;
    g.lineWidth=2; g.beginPath(); g.arc(0,0,r+5+Math.sin(t*3.4)*2.5,0,TAU); g.stroke();
  }
  g.restore();
}

function drawCannon(g,x,y,ang,recoil,charge,t){
  g.save(); g.translate(x,y);
  // The carriage. Kept low and wide: a tall mount disappeared behind the
  // button row, which left the barrel looking as though it floated.
  g.fillStyle='rgba(0,0,0,0.45)'; rr(g,-27,5,54,26,5); g.fill();
  const mg = g.createLinearGradient(-24,0,24,0);
  mg.addColorStop(0,'#33261a'); mg.addColorStop(0.45,'#584428'); mg.addColorStop(1,'#241a10');
  g.fillStyle=mg; rr(g,-23,2,46,24,4); g.fill();
  g.strokeStyle='#160f07'; g.lineWidth=1.6; rr(g,-23,2,46,24,4); g.stroke();
  // the pale cradle the trunnion rests in
  const cg = g.createLinearGradient(0,-6,0,10);
  cg.addColorStop(0,'#efe3c8'); cg.addColorStop(0.55,'#c3b191'); cg.addColorStop(1,'#7d6c4e');
  g.fillStyle=cg;
  g.beginPath();
  g.moveTo(-19,6); g.quadraticCurveTo(-15,-8,0,-8);
  g.quadraticCurveTo(15,-8,19,6); g.closePath(); g.fill();
  g.strokeStyle='#4a3f2b'; g.lineWidth=1.5; g.stroke();
  for(const [bx,by] of [[-16,17],[16,17],[0,20]]) rivet(g,bx,by,2.5,'#e8d4a8','#241a10');

  g.save(); g.rotate(ang);
  if(Math.cos(ang) < 0) g.scale(1,-1);          // aiming left, still right way up
  const rb = recoil*11;
  g.translate(-rb,0);
  g.scale(1.55, 1.55);

  // The breech, and the copper hood curving back over it. The hood used to
  // be a full disc centred on the breech, which the barrel then covered
  // almost entirely; drawn as an arc standing proud of the block it reads
  // at any angle, the way the original's does.
  g.save(); g.translate(-15,0);
  const fg = g.createRadialGradient(-4,-4,2,0,0,15);
  fg.addColorStop(0,'#6b5334'); fg.addColorStop(0.6,'#43331f'); fg.addColorStop(1,'#241a0f');
  g.fillStyle=fg; g.beginPath(); g.arc(0,0,14,0,TAU); g.fill();
  g.strokeStyle='#150e06'; g.lineWidth=1.6; g.beginPath(); g.arc(0,0,14,0,TAU); g.stroke();
  const hg = g.createLinearGradient(-18,-14,4,6);
  hg.addColorStop(0,'#e9a866'); hg.addColorStop(0.45,'#b06f31'); hg.addColorStop(1,'#5f3512');
  g.strokeStyle=hg; g.lineWidth=7; g.lineCap='round';
  g.beginPath(); g.arc(0,0,17.5,PI*0.62, PI*1.62); g.stroke();
  g.strokeStyle='rgba(255,214,158,0.5)'; g.lineWidth=1.8;
  g.beginPath(); g.arc(0,0,20,PI*0.66, PI*1.58); g.stroke();
  g.fillStyle='#c8b28a'; g.beginPath(); g.arc(0,0,4.2,0,TAU); g.fill();
  g.fillStyle='#5c4a2c'; g.beginPath(); g.arc(0,0,2,0,TAU); g.fill();
  g.restore();

  // the pale boiler barrel
  const L=46, R0=15.5, R1=13;
  const bg = g.createLinearGradient(0,-R0,0,R0);
  bg.addColorStop(0,'#f2e6cd'); bg.addColorStop(0.28,'#d9c8a8');
  bg.addColorStop(0.62,'#a08a68'); bg.addColorStop(1,'#584a32');
  g.fillStyle=bg;
  g.beginPath();
  g.moveTo(-12,-R0); g.lineTo(L-7,-R1); g.quadraticCurveTo(L,-R1,L,0);
  g.quadraticCurveTo(L,R1,L-7,R1); g.lineTo(-12,R0);
  g.quadraticCurveTo(-17,0,-12,-R0); g.closePath(); g.fill();
  g.strokeStyle='#3a3125'; g.lineWidth=1.7; g.stroke();
  // dark bands
  for(const bx of [0, 17, 33]){
    g.fillStyle='#4a3d29'; rr(g,bx,-R0-1,5.5,(R0+1)*2,2); g.fill();
    g.fillStyle='rgba(255,248,225,0.30)'; g.fillRect(bx,-R0-1,5.5,2);
  }
  g.fillStyle='#3a3125'; rr(g,L-5,-R1-2.6,7,(R1+2.6)*2,3); g.fill();
  g.fillStyle='#16120b'; g.beginPath(); g.ellipse(L-1,0,3.4,R1-1.4,0,0,TAU); g.fill();
  if(charge>0){
    g.fillStyle=`rgba(255,${170+60*charge|0},90,${0.35+0.5*charge})`;
    g.beginPath(); g.ellipse(L-2,0,3.6+charge*2.4,(R1-1.4)*(0.35+0.65*charge),0,0,TAU); g.fill();
  }
  for(const [rx,ry] of [[9,-11],[9,11],[26,-10],[26,10]]) rivet(g,rx,ry,2,'#fff4dc','#3a3125');
  g.restore();

  // the stack, which never stops smoking
  g.save(); g.rotate(ang);
  if(Math.cos(ang) < 0) g.scale(1,-1);
  g.scale(1.55,1.55); g.translate(-9,-17);
  const sg2 = g.createLinearGradient(-7,0,7,0);
  sg2.addColorStop(0,'#1d150c'); sg2.addColorStop(0.4,'#4a3722'); sg2.addColorStop(1,'#181109');
  g.fillStyle=sg2; rr(g,-7,-17,14,22,2); g.fill();
  g.fillStyle='#54402a'; rr(g,-9.5,-21,19,7,2.5); g.fill();
  g.strokeStyle='#120c05'; g.lineWidth=1.4; rr(g,-9.5,-21,19,7,2.5); g.stroke();
  rr(g,-7,-17,14,22,2); g.stroke();
  g.restore();
  g.restore();
}

/* =====================================================================
   5. THE DOLL
   Nine bodies, eight joints. Parts never collide with each other, which
   keeps it cheap and stops the shoulders from buzzing.
   ===================================================================== */
const DS = 1.14;                              // doll scale
const TSCALE = 1.58;                          // marks are painted big
let GROUP = 100;

const DOLL_PLAN = [
  { k:'torso', shape:'box',    w:13, h:26,  x:0,     y:0    },
  { k:'head',  shape:'circle', r:8.4,       x:0,     y:-21  },
  { k:'armUL', shape:'box',    w:5.5,h:13,  x:-9.5,  y:-5   },
  { k:'armLL', shape:'box',    w:5,  h:12.5,x:-11,   y:7    },
  { k:'armUR', shape:'box',    w:5.5,h:13,  x:9.5,   y:-5   },
  { k:'armLR', shape:'box',    w:5,  h:12.5,x:11,    y:7    },
  { k:'legUL', shape:'box',    w:6,  h:14,  x:-3.6,  y:20   },
  { k:'legLL', shape:'box',    w:5.5,h:14,  x:-3.6,  y:34   },
  { k:'legUR', shape:'box',    w:6,  h:14,  x:3.6,   y:20   },
  { k:'legLR', shape:'box',    w:5.5,h:14,  x:3.6,   y:34   }
];
const DOLL_JOINTS = [
  ['torso','head',  0,   -12,  -0.75, 0.75, 0.55],
  ['torso','armUL', -7.4,-10.5,-2.30, 1.05, 0.16],
  ['armUL','armLL', -10.4,1.2, -0.10, 2.55, 0.20],
  ['torso','armUR', 7.4, -10.5,-1.05, 2.30, 0.16],
  ['armUR','armLR', 10.4, 1.2, -2.55, 0.10, 0.20],
  ['torso','legUL', -3.6, 13,  -1.45, 1.15, 0.24],
  ['legUL','legLL', -3.6, 27,  -2.30, 0.06, 0.26],
  ['torso','legUR',  3.6, 13,  -1.15, 1.45, 0.24],
  ['legUR','legLR',  3.6, 27,  -2.30, 0.06, 0.26]
];

class Doll {
  constructor(world, x, y, ang, vx, vy){
    this.world = world;
    this.group = ++GROUP;
    this.parts = {};
    this.list = [];
    this.joints = [];
    this.alive = true;
    this.age = 0;
    this.settled = 0;
    this.hitTarget = false;
    this.gone = false;
    this.paint = 0;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    for(const p of DOLL_PLAN){
      const lx = p.x*DS, ly = p.y*DS;
      const wx = x + lx*ca - ly*sa, wy = y + lx*sa + ly*ca;
      const b = new Body({
        shape: p.shape==='circle' ? 'circle' : 'box',
        x:wx, y:wy, a:ang,
        r: p.r ? p.r*DS : 0, w: p.w?p.w*DS:0, h: p.h?p.h*DS:0,
        mat:'cloth', group:this.group, linDamp:0.16, angDamp:0.9,
        friction:0.62, rest:0.03, bullet:true
      });
      b.vx = vx; b.vy = vy;
      b.part = p.k;
      b.ent = this;
      b.doll = this;
      world.add(b);
      this.parts[p.k] = b;
      this.list.push(b);
    }
    for(const [a,bk,jx,jy,lo,hi,st] of DOLL_JOINTS){
      const A=this.parts[a], B=this.parts[bk];
      const wx = x + (jx*DS)*ca - (jy*DS)*sa;
      const wy = y + (jx*DS)*sa + (jy*DS)*ca;
      const j = new Joint(A,B,wx,wy,{ lo, hi, stiff:st, ref:0 });
      world.addJoint(j);
      this.joints.push(j);
    }
  }
  get x(){ return this.parts.torso.x; }
  get y(){ return this.parts.torso.y; }
  speed(){
    let s=0; for(const b of this.list) s = Math.max(s, Math.hypot(b.vx,b.vy));
    return s;
  }
  asleep(){ return this.list.every(b=>!b.awake); }
  destroy(){
    for(const b of this.list) this.world.remove(b);
    this.gone = true;
  }
  each(fn){ for(const b of this.list) fn(b); }
}

function drawDoll(g, d, alpha){
  g.globalAlpha = alpha === undefined ? 1 : alpha;
  const skin = '#f2ead6', shad = '#c9bda1', line = '#3a3226';
  const limbs = ['legUL','legUR','legLL','legLR','armUL','armUR','armLL','armLR'];
  // shadowed pass then flat pass keeps the silhouette readable on busy walls
  for(const k of limbs){
    const b = d.parts[k];
    g.save(); g.translate(b.x,b.y); g.rotate(b.a);
    const w=b.hw*2, h=b.hh*2, r=Math.min(w,h)*0.45;
    g.fillStyle = line;   rr(g,-b.hw-1.1,-b.hh-1.1,w+2.2,h+2.2,r+1); g.fill();
    g.fillStyle = skin;   rr(g,-b.hw,-b.hh,w,h,r); g.fill();
    g.fillStyle = shad;   rr(g,-b.hw,b.hh-h*0.30,w,h*0.30,r*0.7); g.fill();
    g.fillStyle='rgba(255,255,255,0.55)'; rr(g,-b.hw+0.8,-b.hh+0.8,w*0.34,h*0.5,r*0.6); g.fill();
    g.restore();
  }
  const t = d.parts.torso;
  g.save(); g.translate(t.x,t.y); g.rotate(t.a);
  g.fillStyle=line; rr(g,-t.hw-1.2,-t.hh-1.2,t.hw*2+2.4,t.hh*2+2.4,4.6); g.fill();
  g.fillStyle=skin; rr(g,-t.hw,-t.hh,t.hw*2,t.hh*2,3.6); g.fill();
  g.fillStyle=shad; rr(g,-t.hw,t.hh*0.30,t.hw*2,t.hh*0.70,3); g.fill();
  g.strokeStyle='rgba(58,50,38,0.5)'; g.lineWidth=1; g.setLineDash([2,2.4]);
  g.beginPath(); g.moveTo(0,-t.hh+2.5); g.lineTo(0,t.hh-2.5); g.stroke(); g.setLineDash([]);
  g.restore();
  const hd = d.parts.head;
  g.save(); g.translate(hd.x,hd.y); g.rotate(hd.a);
  g.fillStyle=line; g.beginPath(); g.arc(0,0,hd.r+1.2,0,TAU); g.fill();
  g.fillStyle=skin; g.beginPath(); g.arc(0,0,hd.r,0,TAU); g.fill();
  g.fillStyle=shad; g.beginPath(); g.arc(0,hd.r*0.28,hd.r*0.82,0.15,PI-0.15); g.fill();
  g.fillStyle='rgba(255,255,255,0.6)'; g.beginPath(); g.arc(-hd.r*0.33,-hd.r*0.36,hd.r*0.30,0,TAU); g.fill();
  g.fillStyle='#33291c';
  const er = Math.max(1, hd.r*0.15);
  g.beginPath(); g.arc(-hd.r*0.34, -hd.r*0.10, er, 0, TAU); g.fill();
  g.beginPath(); g.arc( hd.r*0.34, -hd.r*0.10, er, 0, TAU); g.fill();
  g.strokeStyle='#33291c'; g.lineWidth=1.1;
  g.beginPath(); g.arc(0, hd.r*0.10, hd.r*0.42, 0.42, PI-0.42); g.stroke();
  g.restore();
  g.globalAlpha = 1;
}

/* how much solver we can afford: measured, not guessed */
const PERF = {
  sub:4, iter:9, avg:16.7,
  sample(ms){
    // A stall is not sustained load. Coming back to a backgrounded tab, a
    // collection pause, the first frame after a level builds -- each hands
    // this a frame time of hundreds of milliseconds. Folding those in used
    // to drop the solver to its coarsest tier and leave it there, quietly
    // making every room harder to beat than it was designed to be, with no
    // sign to the player that anything had changed. Sustained load still
    // steps the quality down; a hiccup no longer counts as evidence.
    if(ms > 100 || ms <= 0) return;
    this.avg += (ms - this.avg) * 0.05;
    if(this.avg > 30)      { this.sub = 2; this.iter = 7; }
    else if(this.avg > 22) { this.sub = 3; this.iter = 8; }
    else if(this.avg < 18) { this.sub = 4; this.iter = 9; }
    // between 18 and 22 the current tier stands, so it cannot oscillate
  }
};

/* =====================================================================
   6. EFFECTS  —  particles, paint decals, shake
   ===================================================================== */
const FX = {
  parts: [],
  decal: null, dctx: null,
  shake: 0, shakeD: 0, flash: 0, flashCol: '255,220,150',
  init(){
    this.decal = mkcv(DW,DH); this.dctx = this.decal.getContext('2d');
    this.clearDecals();
  },
  clearDecals(){ this.dctx.clearRect(0,0,DW,DH); },
  reset(){ this.parts.length=0; this.shake=0; this.flash=0; this.clearDecals(); },
  add(p){ if(this.parts.length < 560) this.parts.push(p); },
  kick(amount){ this.shake = Math.min(26, this.shake + amount); this.shakeD = 1; },
  burst(x,y,n,opt={}){
    for(let i=0;i<n;i++){
      const a = opt.dir !== undefined ? opt.dir + rnd(-1,1)*(opt.spread||PI) : rnd(0,TAU);
      const sp = rnd(opt.spMin||40, opt.spMax||220);
      this.add({
        x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:0, max:rnd(opt.lifeMin||0.3, opt.lifeMax||0.9),
        size:rnd(opt.sizeMin||1.5, opt.sizeMax||4),
        col:opt.col || '#d8c49a', type:opt.type||'spark',
        rot:rnd(0,TAU), rv:rnd(-9,9), g:opt.g===undefined?1:opt.g, drag:opt.drag||0.5
      });
    }
  },
  smoke(x,y,n,dir,scale=1){
    for(let i=0;i<n;i++){
      const a = dir + rnd(-0.55,0.55);
      const sp = rnd(30,150)*scale;
      this.add({
        x:x+rnd(-4,4), y:y+rnd(-4,4), vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - rnd(10,40),
        life:0, max:rnd(0.6,1.5), size:rnd(4,10)*scale, col:'#cbbda6', type:'smoke',
        rot:rnd(0,TAU), rv:rnd(-2,2), g:-0.10, drag:1.6
      });
    }
  },
  splat(x,y,r,col){
    const g = this.dctx;
    g.save(); g.translate(x,y); g.rotate(rnd(0,TAU));
    g.fillStyle = col;
    g.globalAlpha = 0.9;
    g.beginPath();
    const n = 9;
    for(let i=0;i<=n;i++){
      const a = i/n*TAU;
      const rad = r*(0.62 + Math.random()*0.62);
      const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.closePath(); g.fill();
    for(let i=0;i<5;i++){
      const a=rnd(0,TAU), d=r*rnd(1.0,2.1);
      g.globalAlpha = 0.75;
      g.beginPath(); g.arc(Math.cos(a)*d, Math.sin(a)*d, r*rnd(0.10,0.30), 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
    g.restore();
  },
  update(dt){
    const P = this.parts;
    for(let i=P.length-1;i>=0;i--){
      const p = P[i];
      p.life += dt;
      if(p.life >= p.max){ P.splice(i,1); continue; }
      p.vy += 1400*p.g*dt;
      const d = 1/(1+dt*p.drag);
      p.vx*=d; p.vy*=d;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.rot += p.rv*dt;
      if(p.type==='smoke') p.size += dt*14;
    }
    if(this.shake > 0){ this.shake -= dt*this.shake*7 + dt*7; if(this.shake<0) this.shake=0; }
    if(this.flash > 0){ this.flash -= dt*3.4; if(this.flash<0) this.flash=0; }
  },
  draw(g){
    for(const p of this.parts){
      const t = p.life/p.max;
      g.save();
      if(p.type==='smoke'){
        g.globalAlpha = (1-t)*0.20;
        g.fillStyle = p.col;
        g.beginPath(); g.arc(p.x,p.y,p.size*(0.5+t*0.9),0,TAU); g.fill();
      } else if(p.type==='chip'){
        g.globalAlpha = 1-t*t;
        g.translate(p.x,p.y); g.rotate(p.rot);
        g.fillStyle=p.col; g.fillRect(-p.size,-p.size*0.5,p.size*2,p.size);
      } else if(p.type==='shard'){
        g.globalAlpha = (1-t)*0.9;
        g.translate(p.x,p.y); g.rotate(p.rot);
        g.fillStyle=p.col;
        g.beginPath(); g.moveTo(-p.size,p.size*0.6); g.lineTo(0,-p.size); g.lineTo(p.size,p.size*0.5); g.closePath(); g.fill();
      } else if(p.type==='drop'){
        g.globalAlpha = 1-t*0.6;
        g.fillStyle=p.col;
        g.beginPath(); g.ellipse(p.x,p.y,p.size*0.62,p.size,Math.atan2(p.vy,p.vx)-PI/2,0,TAU); g.fill();
      } else if(p.type==='ring'){
        g.globalAlpha=(1-t)*0.7; g.strokeStyle=p.col; g.lineWidth=2.5*(1-t)+0.6;
        g.beginPath(); g.arc(p.x,p.y,p.size*(1+t*5),0,TAU); g.stroke();
      } else {
        g.globalAlpha = 1-t;
        g.fillStyle=p.col;
        g.beginPath(); g.arc(p.x,p.y,p.size*(1-t*0.55),0,TAU); g.fill();
      }
      g.restore();
    }
    g.globalAlpha = 1;
  }
};

/* =====================================================================
   7. AUDIO
   A small synth: a scheduled three voice music bed with percussion, a
   per room ambience wash, and impact sounds built from noise and
   oscillators. No samples anywhere.
   ===================================================================== */
const Audio_ = {
  ac:null, master:null, comp:null, musicG:null, sfxG:null, ambG:null,
  on:true, musicOn:true, ready:false,
  tune:0, theme:0, nextNote:0, stepN:0, ambNodes:[], ambTimer:0,

  unlock(){
    if(this.ready){ if(this.ac && this.ac.state==='suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      const ac = this.ac = new AC();
      this.comp = ac.createDynamicsCompressor();
      this.comp.threshold.value = -14; this.comp.knee.value = 22;
      this.comp.ratio.value = 5; this.comp.attack.value = 0.004; this.comp.release.value = 0.19;
      this.master = ac.createGain(); this.master.gain.value = 0.92;
      this.comp.connect(this.master); this.master.connect(ac.destination);
      this.sfxG  = ac.createGain(); this.sfxG.gain.value  = 0.95; this.sfxG.connect(this.comp);
      this.musicG= ac.createGain(); this.musicG.gain.value= 0.0;  this.musicG.connect(this.comp);
      this.ambG  = ac.createGain(); this.ambG.gain.value  = 0.0;  this.ambG.connect(this.comp);
      this.ready = true;
      this.nextNote = ac.currentTime + 0.1;
      this.buildAmbience();
    }catch(err){ this.ready = false; }
    if(this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  now(){ return this.ac ? this.ac.currentTime : 0; },

  /* ---- building blocks ---- */
  noiseBuf(){
    if(this._nb) return this._nb;
    const len = Math.floor(this.ac.sampleRate * 2);
    const b = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this._nb = b; return b;
  },
  /* a burst of filtered noise */
  hit(t, dur, freq, q, vol, type, dest, sweepTo){
    if(!this.ready || !this.on) return;
    const ac = this.ac;
    const s = ac.createBufferSource(); s.buffer = this.noiseBuf(); s.loop = true;
    s.playbackRate.value = 0.8 + Math.random()*0.5;
    const f = ac.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    if(sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(40,sweepTo), t+dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol), t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxG);
    s.start(t); s.stop(t+dur+0.05);
  },
  /* one oscillator with an envelope */
  osc(t, f0, f1, dur, vol, type, dest, atk){
    if(!this.ready || !this.on) return;
    const ac = this.ac;
    const o = ac.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    if(f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(18,f1), t+dur);
    const g = ac.createGain();
    const a = atk === undefined ? 0.006 : atk;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol), t+a);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest || this.sfxG);
    o.start(t); o.stop(t+dur+0.05);
  },
  /* a struck metal partial stack */
  clang(t, base, vol, dur){
    const parts = [1, 2.76, 5.40, 8.93];
    parts.forEach((m,i)=>{
      this.osc(t, base*m, base*m*0.985, dur*(1-i*0.16), vol*(0.62/(i+1)), 'sine');
    });
  },

  /* ---- the things the game asks for ---- */
  fire(power){
    if(!this.ready||!this.on) return;
    const t = this.now();
    // steam release, then the shot, then the breech
    this.hit(t, 0.34, 2600, 0.7, 0.16, 'highpass');
    this.hit(t+0.01, 0.42, 420 + power*160, 0.6, 0.85, 'lowpass', null, 90);
    this.osc(t+0.01, 190 + power*70, 38, 0.40, 0.55, 'triangle');
    this.osc(t+0.01, 92, 30, 0.52, 0.42, 'sine');
    this.clang(t+0.05, 240, 0.10, 0.30);
    this.hit(t+0.16, 0.55, 1500, 0.5, 0.10, 'bandpass', null, 500);
  },
  squeak(v){
    if(!this.ready||!this.on) return;
    const t = this.now(), vol = clamp(v, 0.04, 0.30);
    const f0 = 900 + Math.random()*900;
    this.osc(t, f0, f0*(0.45+Math.random()*0.5), 0.13+Math.random()*0.1, vol*0.5, 'sawtooth');
    this.osc(t+0.02, f0*1.6, f0*0.9, 0.10, vol*0.22, 'square');
    this.hit(t, 0.07, f0*1.4, 6, vol*0.30, 'bandpass');
  },
  splat(v){
    if(!this.ready||!this.on) return;
    const t = this.now(), vol = clamp(v, 0.05, 0.85);
    this.hit(t, 0.11, 900, 1.1, vol*0.55, 'lowpass', null, 180);
    this.hit(t+0.01, 0.16, 2400, 0.8, vol*0.20, 'highpass', null, 900);
    this.osc(t, 160, 60, 0.12, vol*0.28, 'triangle');
  },
  thud(v, mat){
    if(!this.ready||!this.on) return;
    const t = this.now(), vol = clamp(v, 0.03, 0.8);
    if(mat==='stone'){
      this.hit(t,0.10,520+Math.random()*260,2.4,vol*0.55,'bandpass');
      this.osc(t,150,80,0.10,vol*0.32,'triangle');
    } else if(mat==='metal' || mat==='brass'){
      this.clang(t, 340+Math.random()*180, vol*0.5, 0.42);
      this.hit(t,0.07,3200,1.6,vol*0.22,'highpass');
    } else if(mat==='glass'){
      this.shatter(vol);
    } else if(mat==='cloth'){
      this.splat(vol*0.9);
    } else if(mat==='ice'){
      this.hit(t,0.09,2600,2.0,vol*0.35,'bandpass');
      this.osc(t,900,560,0.10,vol*0.18,'sine');
    } else {                       // wood, the sound of this whole game
      const f = 180 + Math.random()*120;
      this.osc(t, f, f*0.55, 0.13, vol*0.42, 'triangle');
      this.osc(t, f*2.4, f*1.5, 0.08, vol*0.18, 'sine');
      this.hit(t, 0.08, 1400+Math.random()*700, 1.8, vol*0.30, 'bandpass');
    }
  },
  shatter(v){
    if(!this.ready||!this.on) return;
    const t = this.now(), vol = clamp(v||0.5,0.1,0.8);
    this.hit(t, 0.30, 5200, 0.8, vol*0.45, 'highpass');
    for(let i=0;i<7;i++){
      const f = 1600 + Math.random()*4200;
      this.osc(t + Math.random()*0.12, f, f*0.75, 0.10+Math.random()*0.14, vol*0.10, 'sine');
    }
  },
  boom(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    this.hit(t,0.70,300,0.5,0.9,'lowpass',null,55);
    this.hit(t,0.36,1800,0.7,0.34,'bandpass',null,400);
    this.osc(t,110,24,0.72,0.62,'sawtooth');
    this.osc(t,62,20,0.9,0.5,'sine');
    for(let i=0;i<5;i++) this.hit(t+0.1+Math.random()*0.4, 0.09, 900+Math.random()*2200, 2, 0.09, 'bandpass');
  },
  splash(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    this.hit(t,0.26,1100,0.9,0.42,'bandpass',null,2600);
    this.hit(t+0.02,0.40,3400,0.6,0.20,'highpass');
    this.osc(t,520,900,0.16,0.10,'sine');
  },
  ding(i=0){
    if(!this.ready||!this.on) return;
    const t=this.now();
    const f=[1046.5,1318.5,1568,2093][i%4];
    this.clang(t, f, 0.34, 1.1);
    this.osc(t, f*2, f*2, 0.5, 0.07, 'sine');
  },
  portal(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    this.osc(t, 300, 1500, 0.30, 0.16, 'sine');
    this.osc(t+0.03, 450, 2200, 0.26, 0.10, 'triangle');
    this.hit(t, 0.30, 2200, 1.2, 0.12, 'bandpass', null, 5000);
  },
  win(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    const notes=[0,4,7,12,16,19];
    notes.forEach((s,i)=>{
      const f=523.25*Math.pow(2,s/12);
      this.osc(t+i*0.078, f, f, 0.62, 0.20, 'triangle');
      this.osc(t+i*0.078, f*1.5, f*1.5, 0.34, 0.07, 'sine');
      this.osc(t+i*0.078, f*0.5, f*0.5, 0.5, 0.10, 'sine');
    });
