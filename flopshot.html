  ['legUR','legLR',  3.6, 27,  -2.30, 0.06, 0.26]
];

class Doll {
  constructor(world, x, y, ang, vx, vy){
    this.world = world;
    this.group = ++GROUP;
    this.parts = {};
    this.list = [];
    this.joints = [];
    this.alive = true;
    this.age = 0;
    this.settled = 0;
    this.hitTarget = false;
    this.gone = false;
    this.paint = 0;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    for(const p of DOLL_PLAN){
      const lx = p.x*DS, ly = p.y*DS;
      const wx = x + lx*ca - ly*sa, wy = y + lx*sa + ly*ca;
      const b = new Body({
        shape: p.shape==='circle' ? 'circle' : 'box',
        x:wx, y:wy, a:ang,
        r: p.r ? p.r*DS : 0, w: p.w?p.w*DS:0, h: p.h?p.h*DS:0,
        mat:'cloth', group:this.group, linDamp:0.16, angDamp:0.9,
        friction:0.62, rest:0.03, bullet:true
      });
      b.vx = vx; b.vy = vy;
      b.part = p.k;
      b.ent = this;
      b.doll = this;
      world.add(b);
      this.parts[p.k] = b;
      this.list.push(b);
    }
    for(const [a,bk,jx,jy,lo,hi,st] of DOLL_JOINTS){
      const A=this.parts[a], B=this.parts[bk];
      const wx = x + (jx*DS)*ca - (jy*DS)*sa;
      const wy = y + (jx*DS)*sa + (jy*DS)*ca;
      const j = new Joint(A,B,wx,wy,{ lo, hi, stiff:st, ref:0 });
      world.addJoint(j);
      this.joints.push(j);
    }
  }
  get x(){ return this.parts.torso.x; }
  get y(){ return this.parts.torso.y; }
  speed(){
    let s=0; for(const b of this.list) s = Math.max(s, Math.hypot(b.vx,b.vy));
    return s;
  }
  asleep(){ return this.list.every(b=>!b.awake); }
  destroy(){
    for(const b of this.list) this.world.remove(b);
    this.gone = true;
  }
  each(fn){ for(const b of this.list) fn(b); }
}

function drawDoll(g, d, alpha){
  g.globalAlpha = alpha === undefined ? 1 : alpha;
  const skin = '#f2ead6', shad = '#c9bda1', line = '#3a3226';
  const limbs = ['legUL','legUR','legLL','legLR','armUL','armUR','armLL','armLR'];
  // shadowed pass then flat pass keeps the silhouette readable on busy walls
  for(const k of limbs){
    const b = d.parts[k];
    g.save(); g.translate(b.x,b.y); g.rotate(b.a);
    const w=b.hw*2, h=b.hh*2, r=Math.min(w,h)*0.45;
    g.fillStyle = line;   rr(g,-b.hw-1.1,-b.hh-1.1,w+2.2,h+2.2,r+1); g.fill();
    g.fillStyle = skin;   rr(g,-b.hw,-b.hh,w,h,r); g.fill();
    g.fillStyle = shad;   rr(g,-b.hw,b.hh-h*0.30,w,h*0.30,r*0.7); g.fill();
    g.fillStyle='rgba(255,255,255,0.55)'; rr(g,-b.hw+0.8,-b.hh+0.8,w*0.34,h*0.5,r*0.6); g.fill();
    g.restore();
  }
  const t = d.parts.torso;
  g.save(); g.translate(t.x,t.y); g.rotate(t.a);
  g.fillStyle=line; rr(g,-t.hw-1.2,-t.hh-1.2,t.hw*2+2.4,t.hh*2+2.4,4.6); g.fill();
  g.fillStyle=skin; rr(g,-t.hw,-t.hh,t.hw*2,t.hh*2,3.6); g.fill();
  g.fillStyle=shad; rr(g,-t.hw,t.hh*0.30,t.hw*2,t.hh*0.70,3); g.fill();
  g.strokeStyle='rgba(58,50,38,0.5)'; g.lineWidth=1; g.setLineDash([2,2.4]);
  g.beginPath(); g.moveTo(0,-t.hh+2.5); g.lineTo(0,t.hh-2.5); g.stroke(); g.setLineDash([]);
  g.restore();
  const hd = d.parts.head;
  g.save(); g.translate(hd.x,hd.y); g.rotate(hd.a);
  g.fillStyle=line; g.beginPath(); g.arc(0,0,hd.r+1.2,0,TAU); g.fill();
  g.fillStyle=skin; g.beginPath(); g.arc(0,0,hd.r,0,TAU); g.fill();
  g.fillStyle=shad; g.beginPath(); g.arc(0,hd.r*0.28,hd.r*0.82,0.15,PI-0.15); g.fill();
  g.fillStyle='rgba(255,255,255,0.6)'; g.beginPath(); g.arc(-hd.r*0.33,-hd.r*0.36,hd.r*0.30,0,TAU); g.fill();
  g.fillStyle='#33291c';
  const er = Math.max(1, hd.r*0.15);
  g.beginPath(); g.arc(-hd.r*0.34, -hd.r*0.10, er, 0, TAU); g.fill();
  g.beginPath(); g.arc( hd.r*0.34, -hd.r*0.10, er, 0, TAU); g.fill();
  g.strokeStyle='#33291c'; g.lineWidth=1.1;
  g.beginPath(); g.arc(0, hd.r*0.10, hd.r*0.42, 0.42, PI-0.42); g.stroke();
  g.restore();
  g.globalAlpha = 1;
}

/* how much solver we can afford: measured, not guessed */
const PERF = {
  sub:4, iter:9, avg:16.7,
  sample(ms){
    this.avg += (Math.min(ms,120) - this.avg) * 0.05;
    if(this.avg > 30)      { this.sub = 2; this.iter = 7; }
    else if(this.avg > 21) { this.sub = 3; this.iter = 8; }
    else if(this.avg < 17) { this.sub = 4; this.iter = 9; }
  }
};

/* =====================================================================
   6. EFFECTS  —  particles, paint decals, shake
   ===================================================================== */
const FX = {
  parts: [],
  decal: null, dctx: null,
  shake: 0, shakeD: 0, flash: 0, flashCol: '255,220,150',
  init(){
    this.decal = mkcv(DW,DH); this.dctx = this.decal.getContext('2d');
    this.clearDecals();
  },
  clearDecals(){ this.dctx.clearRect(0,0,DW,DH); },
  reset(){ this.parts.length=0; this.shake=0; this.flash=0; this.clearDecals(); },
  add(p){ if(this.parts.length < 560) this.parts.push(p); },
  kick(amount){ this.shake = Math.min(26, this.shake + amount); this.shakeD = 1; },
  burst(x,y,n,opt={}){
    for(let i=0;i<n;i++){
      const a = opt.dir !== undefined ? opt.dir + rnd(-1,1)*(opt.spread||PI) : rnd(0,TAU);
      const sp = rnd(opt.spMin||40, opt.spMax||220);
      this.add({
        x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:0, max:rnd(opt.lifeMin||0.3, opt.lifeMax||0.9),
        size:rnd(opt.sizeMin||1.5, opt.sizeMax||4),
        col:opt.col || '#d8c49a', type:opt.type||'spark',
        rot:rnd(0,TAU), rv:rnd(-9,9), g:opt.g===undefined?1:opt.g, drag:opt.drag||0.5
      });
    }
  },
  smoke(x,y,n,dir,scale=1){
    for(let i=0;i<n;i++){
      const a = dir + rnd(-0.55,0.55);
      const sp = rnd(30,150)*scale;
      this.add({
        x:x+rnd(-4,4), y:y+rnd(-4,4), vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - rnd(10,40),
        life:0, max:rnd(0.6,1.5), size:rnd(4,10)*scale, col:'#cbbda6', type:'smoke',
        rot:rnd(0,TAU), rv:rnd(-2,2), g:-0.10, drag:1.6
      });
    }
  },
  splat(x,y,r,col){
    const g = this.dctx;
    g.save(); g.translate(x,y); g.rotate(rnd(0,TAU));
    g.fillStyle = col;
    g.globalAlpha = 0.9;
    g.beginPath();
    const n = 9;
    for(let i=0;i<=n;i++){
      const a = i/n*TAU;
      const rad = r*(0.62 + Math.random()*0.62);
      const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.closePath(); g.fill();
    for(let i=0;i<5;i++){
      const a=rnd(0,TAU), d=r*rnd(1.0,2.1);
      g.globalAlpha = 0.75;
      g.beginPath(); g.arc(Math.cos(a)*d, Math.sin(a)*d, r*rnd(0.10,0.30), 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
    g.restore();
  },
  update(dt){
    const P = this.parts;
    for(let i=P.length-1;i>=0;i--){
      const p = P[i];
      p.life += dt;
      if(p.life >= p.max){ P.splice(i,1); continue; }
      p.vy += 1400*p.g*dt;
      const d = 1/(1+dt*p.drag);
      p.vx*=d; p.vy*=d;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.rot += p.rv*dt;
      if(p.type==='smoke') p.size += dt*14;
    }
    if(this.shake > 0){ this.shake -= dt*this.shake*7 + dt*7; if(this.shake<0) this.shake=0; }
    if(this.flash > 0){ this.flash -= dt*3.4; if(this.flash<0) this.flash=0; }
  },
  draw(g){
    for(const p of this.parts){
      const t = p.life/p.max;
      g.save();
      if(p.type==='smoke'){
        g.globalAlpha = (1-t)*0.20;
        g.fillStyle = p.col;
        g.beginPath(); g.arc(p.x,p.y,p.size*(0.5+t*0.9),0,TAU); g.fill();
      } else if(p.type==='chip'){
        g.globalAlpha = 1-t*t;
        g.translate(p.x,p.y); g.rotate(p.rot);
        g.fillStyle=p.col; g.fillRect(-p.size,-p.size*0.5,p.size*2,p.size);
      } else if(p.type==='shard'){
        g.globalAlpha = (1-t)*0.9;
        g.translate(p.x,p.y); g.rotate(p.rot);
        g.fillStyle=p.col;
        g.beginPath(); g.moveTo(-p.size,p.size*0.6); g.lineTo(0,-p.size); g.lineTo(p.size,p.size*0.5); g.closePath(); g.fill();
      } else if(p.type==='drop'){
        g.globalAlpha = 1-t*0.6;
        g.fillStyle=p.col;
        g.beginPath(); g.ellipse(p.x,p.y,p.size*0.62,p.size,Math.atan2(p.vy,p.vx)-PI/2,0,TAU); g.fill();
      } else if(p.type==='ring'){
        g.globalAlpha=(1-t)*0.7; g.strokeStyle=p.col; g.lineWidth=2.5*(1-t)+0.6;
        g.beginPath(); g.arc(p.x,p.y,p.size*(1+t*5),0,TAU); g.stroke();
      } else {
        g.globalAlpha = 1-t;
        g.fillStyle=p.col;
        g.beginPath(); g.arc(p.x,p.y,p.size*(1-t*0.55),0,TAU); g.fill();
      }
      g.restore();
    }
    g.globalAlpha = 1;
  }
};

/* =====================================================================
   7. AUDIO  —  small synth, no files
   ===================================================================== */
const Audio_ = {
  ac:null, master:null, musicGain:null, sfxGain:null,
  on:true, musicOn:true, ready:false, seqTimer:0, step:0, key:0,
  unlock(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = 0.85;
      this.master.connect(this.ac.destination);
      this.sfxGain = this.ac.createGain(); this.sfxGain.gain.value = 0.9; this.sfxGain.connect(this.master);
      this.musicGain = this.ac.createGain(); this.musicGain.gain.value = 0.0; this.musicGain.connect(this.master);
      this.ready = true;
    }catch(e){ this.ready = false; }
    if(this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  now(){ return this.ac ? this.ac.currentTime : 0; },
  env(node, t, a, d, peak){
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001,peak), t+a);
    g.gain.exponentialRampToValueAtTime(0.0001, t+a+d);
    node.connect(g);
    return g;
  },
  noiseBuf(){
    if(this._nb) return this._nb;
    const len = this.ac.sampleRate * 1.2;
    const b = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this._nb = b; return b;
  },
  noise(t, dur, freq, q, vol, type='bandpass'){
    if(!this.ready || !this.on) return;
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf(); s.loop = true;
    const f = this.ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    s.connect(f);
    const g = this.env(f, t, 0.006, dur, vol);
    g.connect(this.sfxGain);
    s.start(t); s.stop(t+dur+0.06);
  },
  tone(t, f0, f1, dur, vol, type='sine'){
    if(!this.ready || !this.on) return;
    const o = this.ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
    const g = this.env(o, t, 0.008, dur, vol);
    g.connect(this.sfxGain);
    o.start(t); o.stop(t+dur+0.06);
  },
  fire(power){
    if(!this.ready||!this.on) return;
    const t = this.now();
    this.noise(t, 0.30, 240+power*120, 0.7, 0.55, 'lowpass');
    this.tone(t, 150+power*60, 42, 0.34, 0.4, 'triangle');
    this.noise(t+0.01, 0.16, 1900, 1.2, 0.12, 'highpass');
  },
  thud(v, mat){
    if(!this.ready||!this.on) return;
    const t = this.now();
    const vol = clamp(v,0.03,0.7);
    if(mat==='stone'||mat==='metal'){
      this.noise(t,0.10,700+Math.random()*400,3.5,vol*0.5,'bandpass');
      this.tone(t,180,90,0.09,vol*0.25,'square');
    } else if(mat==='glass'){
      this.noise(t,0.22,3600,2.2,vol*0.5,'highpass');
      this.tone(t,2400,1300,0.14,vol*0.2,'triangle');
    } else if(mat==='cloth'){
      this.noise(t,0.09,300,1.4,vol*0.35,'lowpass');
    } else {
      this.noise(t,0.10,320+Math.random()*200,2.0,vol*0.45,'bandpass');
      this.tone(t,120,70,0.10,vol*0.2,'triangle');
    }
  },
  boom(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    this.noise(t,0.55,180,0.6,0.8,'lowpass');
    this.noise(t,0.30,1400,0.8,0.30,'bandpass');
    this.tone(t,90,28,0.55,0.5,'sawtooth');
  },
  splash(){ if(!this.ready||!this.on) return; const t=this.now();
    this.noise(t,0.28,900,0.9,0.35,'bandpass'); this.noise(t+0.03,0.35,2600,0.6,0.18,'highpass'); },
  ding(i=0){
    if(!this.ready||!this.on) return;
    const t=this.now();
    const f=[880,1108,1318,1760][i%4];
    this.tone(t,f,f,0.5,0.28,'sine');
    this.tone(t+0.005,f*2,f*2,0.32,0.10,'sine');
  },
  win(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    [0,4,7,12,16].forEach((s,i)=>{
      const f=440*Math.pow(2,s/12);
      this.tone(t+i*0.085, f, f, 0.55, 0.24, 'triangle');
      this.tone(t+i*0.085, f*2, f*2, 0.30, 0.08, 'sine');
    });
  },
  fail(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    this.tone(t,320,150,0.35,0.22,'sawtooth');
    this.tone(t+0.14,240,110,0.4,0.18,'sawtooth');
  },
  click(){ if(!this.ready||!this.on) return; const t=this.now();
    this.noise(t,0.045,2200,3,0.20,'bandpass'); this.tone(t,760,520,0.06,0.10,'square'); },
  tick(){ if(!this.ready||!this.on) return; this.noise(this.now(),0.03,1500,4,0.08,'bandpass'); },
  /* a slow four bar loop that stays out of the way */
  MUS: [0,3,5,7,10,7,5,3],
  music(dt){
    if(!this.ready) return;
    const target = (this.on && this.musicOn) ? 0.16 : 0.0;
    this.musicGain.gain.value += (target - this.musicGain.gain.value) * Math.min(1, dt*2);
    if(target <= 0.001) return;
    this.seqTimer -= dt;
    if(this.seqTimer > 0) return;
    this.seqTimer = 0.5;
    const t = this.now() + 0.02;
    const root = 110 * Math.pow(2, this.key/12);
    const s = this.step++;
    const note = root * Math.pow(2, this.MUS[s % this.MUS.length]/12);
    const o = this.ac.createOscillator(); o.type='triangle';
    o.frequency.value = note;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.20,t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.48);
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t+0.55);
    if(s % 4 === 0){
      const b = this.ac.createOscillator(); b.type='sine'; b.frequency.value = root*0.5;
      const bg = this.ac.createGain();
      bg.gain.setValueAtTime(0.0001,t);
      bg.gain.exponentialRampToValueAtTime(0.30,t+0.05);
      bg.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
      b.connect(bg); bg.connect(this.musicGain); b.start(t); b.stop(t+1.0);
    }
  }
};
const Audio = Audio_;

/* =====================================================================
   8. LEVEL  —  builds bodies from the compact op list and owns every
   moving part that is not plain rigid body physics.
   ===================================================================== */
const D2R = PI/180;

class Level {
  constructor(def, index){
    this.def = def;
    this.index = index;
    this.theme = def.th || 0;
    this.name = def.n;
    this.world = new World();
    this.ents = [];
    this.targets = (def.tg||[]).map(t=>({ x:t[0], y:t[1], r:t[2]||26, hit:false, glow:0 }));
    this.shots = def.sh || 3;
    this.used = 0;
    this.dolls = [];
    this.buttons = {};
    this.time = 0;
    this.done = false;
    this.build();
  }

  add(o){ const b = new Body(o); this.world.add(b); return b; }

  build(){
    const L = this, W = this.world, T = THEMES[this.theme];
    const wallMat = T.plank;
    const walls = this.def.walls === undefined ? 'lrtb' : this.def.walls;
    const th = 22;
    if(walls.includes('b')) this.add({x:DW/2, y:DH-th/2, w:DW, h:th, fixed:true, mat:wallMat, tag:'wall'});
    if(walls.includes('t')) this.add({x:DW/2, y:th/2,     w:DW, h:th, fixed:true, mat:wallMat, tag:'wall'});
    if(walls.includes('l')) this.add({x:th/2, y:DH/2,     w:th, h:DH, fixed:true, mat:wallMat, tag:'wall'});
    if(walls.includes('r')) this.add({x:DW-th/2, y:DH/2,  w:th, h:DH, fixed:true, mat:wallMat, tag:'wall'});

    for(const op of (this.def.o||[])){
      const k = op[0];
      const A = (i)=> op[i]===undefined ? 0 : op[i];
      switch(k){
        /* --- static structure --- */
        case 'w': case 's': case 'm': case 'i': case 'rub': case 'mo': {
          const mat = k==='w' ? T.plank : k==='s' ? 'stone' : k==='m' ? 'metal'
                    : k==='i' ? 'ice' : k==='mo' ? 'moss' : 'rubber';
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,fixed:true,mat});
          b.render = k==='rub' ? 'rubber' : 'plank';
          break;
        }
        /* --- loose blocks --- */
        case 'b': case 'B': case 'M': {
          const mat = k==='b' ? 'wood' : k==='B' ? 'stone' : 'metal';
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,mat});
          b.render='crate';
          break;
        }
        case 'g': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,mat:'glass',fixed:true});
          b.render='glass'; b.breakable = op[6]||110;
          break;
        }
        case 'ball': {
          const b = this.add({shape:'circle',x:op[1],y:op[2],r:op[3],mat:op[4]||'stone'});
          b.render='ball';
          break;
        }
        case 'bump': {
          const b = this.add({shape:'circle',x:op[1],y:op[2],r:op[3],mat:'rubber',fixed:true});
          b.render='bumper';
          break;
        }
        /* --- hazards and reactive things --- */
        case 'tnt': {
          const b = this.add({x:op[1],y:op[2],w:op[3]||30,h:op[4]||30,mat:'tnt'});
          b.render='tnt'; b.tnt = { power: op[5]||210, fuse:-1 };
          this.ents.push({ type:'tnt', b });
          break;
        }
        case 'spike': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,fixed:true,mat:'metal'});
          b.render='spike'; b.deadly = true;
          break;
        }
        case 'saw': {
          const b = this.add({shape:'circle',x:op[1],y:op[2],r:op[3]||22,fixed:true,mat:'metal'});
          b.render='saw'; b.deadly = true; b.spin = op[4]||6;
          const e = { type:'saw', b, t:0, path:op[5]||null, cx:op[1], cy:op[2] };
          this.ents.push(e);
          break;
        }
        case 'water': {
          const e = { type:'water', x:op[1], y:op[2], w:op[3], h:op[4], t:0 };
          this.ents.push(e);
          W.fields.push((dt,bodies)=>{
            const top = e.y - e.h/2, bot = e.y + e.h/2, l = e.x-e.w/2, r = e.x+e.w/2;
            for(const b of bodies){
              if(b.fixed) continue;
              if(b.x < l-30 || b.x > r+30 || b.maxy < top || b.miny > bot) continue;
              const sz = b.shape==='circle' ? b.r*2 : Math.max(b.hw,b.hh)*2;
              const sub = clamp((Math.min(b.maxy,bot) - Math.max(b.miny,top)) / Math.max(1,(b.maxy-b.miny)), 0, 1);
              if(sub <= 0) continue;
              b.wake();
              const ratio = 0.0018 / Math.max(0.00002, b.density);
              b.vy -= ratio * sub * 1580 * dt;
              const dmp = 1/(1+dt*(2.4*sub));
              b.vx *= dmp; b.vy *= dmp; b.av *= 1/(1+dt*4*sub);
              if(!b.wet && sub>0.15 && Math.hypot(b.vx,b.vy)>210){
                b.wet = true;
                FX.burst(b.x, top, 9, {col:'#9fd8f0',type:'drop',dir:-PI/2,spread:0.85,spMin:80,spMax:280,sizeMin:1.5,sizeMax:3.4,lifeMax:0.7});
                Audio.splash();
              }
              if(sub < 0.05) b.wet = false;
            }
          });
          break;
        }
        case 'fan': {
          const dir = A(5)*D2R, str = op[6]||1500;
          const e = { type:'fan', x:op[1], y:op[2], w:op[3], h:op[4], dir, str, t:0 };
          this.ents.push(e);
          W.fields.push((dt,bodies)=>{
            const l=e.x-e.w/2, r=e.x+e.w/2, tp=e.y-e.h/2, bt=e.y+e.h/2;
            const fx=Math.cos(e.dir)*e.str, fy=Math.sin(e.dir)*e.str;
            for(const b of bodies){
              if(b.fixed) continue;
              if(b.maxx<l||b.minx>r||b.maxy<tp||b.miny>bt) continue;
              b.wake();
              const scale = clamp(0.9/Math.max(0.2,b.m), 0.15, 3.4);
              b.vx += fx*scale*dt; b.vy += fy*scale*dt;
            }
          });
          break;
        }
        case 'portal': {
          const e = { type:'portal', ax:op[1], ay:op[2], bx:op[3], by:op[4],
                      aa:A(5)*D2R, ba:A(6)*D2R, r:op[7]||26, t:0, cool:new Map() };
          this.ents.push(e);
          break;
        }
        case 'btn': {
          const id = op[3]||1, bw = op[4]||46;
          const base = this.add({x:op[1],y:op[2]+6,w:bw,h:10,fixed:true,mat:'metal',a:A(5)*D2R});
          base.render='btnbase';
          this.ents.push({ type:'btn', id, base, x:op[1], y:op[2], w:bw, on:false, press:0 });
          this.buttons[id] = false;
          break;
        }
        case 'door': {
          const id = op[5]||1;
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(6)*D2R,fixed:true,mat:'metal'});
          b.render='door';
          this.ents.push({ type:'door', id, b, x0:op[1], y0:op[2],
                           dx:op[7]!==undefined?op[7]:0, dy:op[8]!==undefined?op[8]:-(op[4]+4), p:0 });
          break;
        }
        /* --- jointed contraptions --- */
        case 'see': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4]||14,a:A(5)*D2R,mat:'wood'});
          b.render='plank'; b.angDamp = 0.5;
          const anchor = this.add({x:op[1],y:op[2],w:6,h:6,fixed:true,mat:'metal'});
          anchor.render='pivot';
          W.addJoint(new Joint(anchor,b,op[1],op[2],{}));
          break;
        }
        case 'pend': {
          const b = this.add({x:op[1],y:op[2]+ (op[4]||70)/2, w:op[3]||14, h:op[4]||70, mat:'wood'});
          b.render='plank'; b.angDamp = 0.25;
          const anchor = this.add({x:op[1],y:op[2],w:6,h:6,fixed:true,mat:'metal'});
          anchor.render='pivot';
          W.addJoint(new Joint(anchor,b,op[1],op[2],{}));
          break;
        }
        case 'rope': {
          const n = op[3]||6, seg = op[4]||16, wdt = 5;
          let prev = this.add({x:op[1],y:op[2],w:8,h:8,fixed:true,mat:'metal'});
          prev.render='pivot';
          let py = op[2];
          const links = [];
          for(let i=0;i<n;i++){
            const b = this.add({x:op[1], y:py+seg/2, w:wdt, h:seg, mat:'wood',
                                density:0.0008, group:0, angDamp:0.5, linDamp:0.25});
            b.render='link';
            W.addJoint(new Joint(prev,b,op[1],py,{}));
            links.push(b);
            prev = b; py += seg;
          }
          if(op[5]){  // a weight on the end
            const wb = this.add({shape:'circle',x:op[1],y:py+op[5],r:op[5],mat:op[6]||'stone'});
            wb.render='ball';
            W.addJoint(new Joint(prev,wb,op[1],py,{}));
          }
          this.ents.push({ type:'rope', links });
          break;
        }
        case 'mov': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],fixed:true,mat:'metal'});
          b.render='mover'; b.kinematic = true;
          this.ents.push({ type:'mov', b, x0:op[1], y0:op[2],
                           dx:op[5]||0, dy:op[6]||0, per:op[7]||3, ph:op[8]||0, t:0 });
          break;
        }
        case 'balloon': {
          const b = this.add({shape:'circle',x:op[1],y:op[2],r:op[3]||18,mat:'balloon',
                              gscale:-0.42, linDamp:1.5, rest:0.3});
          b.render='balloon'; b.pop = true;
          const bent = { type:'balloon', b, t:0, tether: op[4], ax0:op[1], ay0:op[2]+(op[4]||0) };
          this.ents.push(bent);
          if(op[4]){ // tethered to a point below
            const anchor = this.add({x:op[1],y:op[2]+op[4],w:8,h:8,fixed:true,mat:'metal'});
            anchor.render='pivot';
            W.addJoint(new DistJoint(anchor,b,anchor.x,anchor.y,b.x,b.y,{len:op[4],rope:true}));
          }
          break;
        }
        case 'goo': {   // sticky pad, kills all bounce and most speed
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,fixed:true,mat:'rubber',
                              friction:2.2, rest:0});
          b.render='goo'; b.sticky = true;
          break;
        }
      }
    }
    /* the cannon */
    this.cannon = {
      x: this.def.c[0], y: this.def.c[1],
      a: (this.def.c[2]||0)*D2R,
      lo: (this.def.c[3]!==undefined?this.def.c[3]:-178)*D2R,
      hi: (this.def.c[4]!==undefined?this.def.c[4]: 178)*D2R,
      recoil:0, charge:0
    };
    // the bracket the cannon is bolted to is solid, so shots cannot pass behind it
    const mount = this.add({x:this.cannon.x, y:this.cannon.y+30, w:46, h:58, fixed:true, mat:'metal'});
    mount.render='plank';
    // settle the furniture with impacts muted, so nothing detonates or
    // shatters just from being placed a few pixels above its shelf
    for(let i=0;i<50;i++) this.world.step(1/120);
    for(const b of this.world.bodies){ if(!b.fixed){ b.vx=b.vy=b.av=0; } }
    this.world.onContact = (A,B,sev,x,y,nx,ny,speed)=>this.onImpact(A,B,sev,x,y,nx,ny,speed);
  }

  onImpact(A,B,sev,x,y,nx,ny,speed){
    // sev is an impulse estimate (closing speed x reduced mass); speed is px/s.
    const dollPart = A.doll ? A : (B.doll ? B : null);
    const other    = A.doll ? B : (B.doll ? A : null);
    if(dollPart){
      const d = dollPart.doll;
      if(speed > 300 && d.paint < 20){
        d.paint++;
        FX.splat(x, y, clamp(speed/95, 4, 13), 'rgba(176,44,36,0.80)');
        FX.burst(x,y,3,{col:'#b02c24',type:'drop',spMin:20,spMax:110,sizeMin:1,sizeMax:2.4,lifeMax:0.5});
      }
      if(speed > 130)
        Audio.thud(clamp(speed/1100, 0.05, 0.55), other && other.mat ? other.mat : 'cloth');
    } else if(speed > 210){
      Audio.thud(clamp(speed/1600, 0.04, 0.5), A.fixed ? B.mat : A.mat);
      if(sev > 120)
        FX.burst(x,y,3,{col:'#c9b48c',type:'chip',sizeMin:1,sizeMax:2.4,spMax:120,lifeMax:0.5});
    }
    for(const b of [A,B]){
      if(b.breakable && speed > 190 && sev > b.breakable && !b.dead){
        const hitter = b === A ? B : A;
        const dir = b === A ? -1 : 1;     // normal runs A to B
        this.shatter(b, hitter, nx*dir, ny*dir, speed);
      }
      if(b.tnt && speed > 280 && sev > 45 && b.tnt.fuse < 0) b.tnt.fuse = 0.28;
      if(b.pop && speed > 150 && !b.dead) this.popBalloon(b);
    }
    if(dollPart && other && other.deadly) this.killDoll(dollPart.doll, x, y);
  }

  shatter(b, hitter, nx, ny, speed){
    FX.burst(b.x,b.y,16,{col:'#cfeeff',type:'shard',sizeMin:2,sizeMax:5,spMax:280,lifeMax:0.9});
    Audio.thud(0.55,'glass');
    this.world.remove(b);
    // the pane took the blow, so hand most of that momentum back and let
    // whatever broke it carry on through the hole
    if(hitter && speed){
      const keep = 0.62 * speed;
      const group = hitter.doll ? hitter.doll.list : [hitter];
      for(const p of group){
        if(p.fixed) continue;
        p.vx += nx * keep; p.vy += ny * keep;
        p.wake();
      }
    }
  }
  popBalloon(b){
    FX.burst(b.x,b.y,12,{col:'#ff8fb0',type:'chip',sizeMin:1.6,sizeMax:3.4,spMax:220,lifeMax:0.6});
    Audio.thud(0.3,'glass');
    this.world.remove(b);
  }
  killDoll(d, x, y){
    if(!d || d.gone) return;
    FX.splat(x||d.x, y||d.y, 13, 'rgba(176,44,36,0.85)');
    FX.burst(x||d.x, y||d.y, 16, {col:'#b02c24',type:'drop',spMax:300,sizeMin:1.5,sizeMax:3.6,lifeMax:0.8});
    Audio.thud(0.6,'cloth');
    d.destroy();
    const i = this.dolls.indexOf(d); if(i>=0) this.dolls.splice(i,1);
  }
  explode(b){
    const px = b.x, py = b.y, power = b.tnt.power;
    this.world.remove(b);
    FX.kick(15);
    FX.flash = 0.9; FX.flashCol = '255,190,90';
    FX.burst(px,py,34,{col:'#ffb347',spMax:520,sizeMin:2,sizeMax:6,lifeMax:0.7,g:0.5});
    FX.burst(px,py,18,{col:'#ff6a2a',spMax:300,sizeMin:3,sizeMax:9,lifeMax:0.5,g:0.2});
    FX.smoke(px,py,16,-PI/2,1.8);
    FX.add({x:px,y:py,vx:0,vy:0,life:0,max:0.5,size:26,col:'#ffd08a',type:'ring',rot:0,rv:0,g:0,drag:0});
    Audio.boom();
    const R = 175;
    for(const o of this.world.bodies.slice()){
      if(o.fixed) continue;
      const dx=o.x-px, dy=o.y-py;
      const d=Math.hypot(dx,dy);
      if(d > R) continue;
      const f = (1 - d/R);
      const n = d>1 ? 1/d : 0;
      o.wake();
      o.vx += dx*n*power*f*3.2;
      o.vy += dy*n*power*f*3.2 - power*f*0.5;
      o.av += (Math.random()-0.5)*f*16;
      if(o.breakable && f > 0.25) this.shatter(o, null, 0, 0, 0);
      if(o.pop) this.popBalloon(o);
      if(o.tnt && o.tnt.fuse < 0 && f > 0.2) o.tnt.fuse = 0.12 + Math.random()*0.12;
    }
  }
}

/* ------------------------------------------------ 8b. level runtime */
Level.prototype.update = function(dt){
  this.time += dt;
  const W = this.world;

  /* --- kinematic and scripted parts move before the solve --- */
  for(const e of this.ents){
    switch(e.type){
      case 'mov': {
        e.t += dt;
        const ph = (e.t/e.per + e.ph) * TAU;
        const s = (1 - Math.cos(ph))*0.5;
        const nx = e.x0 + e.dx*s, ny = e.y0 + e.dy*s;
        e.b.vx = (nx - e.b.x)/dt; e.b.vy = (ny - e.b.y)/dt;
        e.b.x = nx; e.b.y = ny; e.b.sync();
        this.wakeNear(e.b, 14);
        break;
      }
      case 'saw': {
        e.t += dt;
        e.b.av = e.b.spin;
        e.b.a += e.b.spin*dt;
        if(e.path){
          const s = (1-Math.cos((e.t/e.path[2])*TAU))*0.5;
          const nx = e.cx + e.path[0]*s, ny = e.cy + e.path[1]*s;
          e.b.vx = (nx-e.b.x)/dt; e.b.vy = (ny-e.b.y)/dt;
          e.b.x = nx; e.b.y = ny;
        }
        e.b.sync();
        this.wakeNear(e.b, 12);
        break;
      }
      case 'door': {
        const want = this.buttons[e.id] ? 1 : 0;
        const sp = dt*2.2;
        e.p += clamp(want - e.p, -sp, sp);
        const nx = e.x0 + e.dx*e.p, ny = e.y0 + e.dy*e.p;
        e.b.vx = (nx-e.b.x)/dt; e.b.vy = (ny-e.b.y)/dt;
        e.b.x = nx; e.b.y = ny; e.b.sync();
        if(Math.abs(e.b.vx)+Math.abs(e.b.vy) > 1) this.wakeNear(e.b, 14);
        break;
      }
      case 'btn': {
        let on = false;
        const l = e.x - e.w/2, r = e.x + e.w/2, top = e.y - 16, bot = e.y + 8;
        for(const b of W.bodies){
          if(b.fixed || b.dead) continue;
          if(b.maxx < l || b.minx > r || b.maxy < top || b.miny > bot) continue;
          if(b.m > 0.22 || b.doll){ on = true; break; }
        }
        if(on !== e.on){
          e.on = on;
          Audio.click();
          FX.burst(e.x, e.y-4, 6, {col:'#ffd98a',spMax:90,sizeMax:2.2,lifeMax:0.4});
        }
        e.press += clamp((on?1:0) - e.press, -dt*9, dt*9);
        this.buttons[e.id] = on;
        break;
      }
      case 'tnt': {
        if(e.b.dead) break;
        if(e.b.tnt.fuse >= 0){
          e.b.tnt.fuse -= dt;
          if(Math.random() < dt*40) FX.burst(e.b.x, e.b.y - e.b.hh, 1,
            {col:'#ffd070',spMax:70,sizeMax:2.4,lifeMax:0.35,g:-0.4});
          if(e.b.tnt.fuse <= 0) this.explode(e.b);
        }
        break;
      }
      case 'portal': {
        e.t += dt;
        for(const [k,v] of e.cool){ if(this.time - v > 0.45) e.cool.delete(k); }
        for(const b of W.bodies){
          if(b.fixed || b.dead) continue;
          if(e.cool.has(b.id)) continue;
          let from = null, to = null, toa = 0;
          if(dist2(b.x,b.y,e.ax,e.ay) < e.r*e.r*0.55){ from='a'; to={x:e.bx,y:e.by}; toa = e.ba - e.aa; }
          else if(dist2(b.x,b.y,e.bx,e.by) < e.r*e.r*0.55){ from='b'; to={x:e.ax,y:e.ay}; toa = e.aa - e.ba; }
          if(!from) continue;
          const grp = b.doll ? b.doll.list : [b];
          const ox = to.x - b.x, oy = to.y - b.y;
          const cs = Math.cos(toa), sn = Math.sin(toa);
          for(const p of grp){
            if(e.cool.has(p.id) && p !== b) continue;
            const rx = p.x - b.x, ry = p.y - b.y;
            p.x = to.x + rx*cs - ry*sn;
            p.y = to.y + rx*sn + ry*cs;
            p.a += toa;
            const vx = p.vx, vy = p.vy;
            p.vx = vx*cs - vy*sn; p.vy = vx*sn + vy*cs;
            p.sync(); p.wake();
            e.cool.set(p.id, this.time);
          }
          FX.burst(to.x,to.y,14,{col:'#a48cff',spMax:200,sizeMax:3.4,lifeMax:0.55,g:0});
          FX.burst(from==='a'?e.ax:e.bx, from==='a'?e.ay:e.by, 10,
                   {col:'#7de0ff',spMax:170,sizeMax:3,lifeMax:0.5,g:0});
          Audio.ding(2);
          break;
        }
        break;
      }
    }
  }

  /* --- physics, sub stepped so fast dolls cannot tunnel through planks --- */
  const SUB = PERF.sub, sdt = dt/SUB;
  W.iter = PERF.iter;
  for(let i=0;i<SUB;i++) W.step(sdt);

  /* --- post step bookkeeping --- */
  for(let i=this.dolls.length-1;i>=0;i--){
    const d = this.dolls[i];
    if(d.gone){ this.dolls.splice(i,1); continue; }
    d.age += dt;
    let out = true;
    for(const b of d.list){
      if(b.x > -260 && b.x < DW+260 && b.y < DH+320 && b.y > -700){ out = false; break; }
    }
    if(out){ d.destroy(); this.dolls.splice(i,1); continue; }
    // a doll that comes to rest stops mattering
    if(d.asleep()) d.settled += dt; else d.settled = 0;
  }

  /* --- target checks --- */
  for(const t of this.targets){
    if(t.hit){ t.glow = Math.min(1, t.glow + dt*3); continue; }
    for(const d of this.dolls){
      let hit = false;
      for(const b of d.list){
        const rad = b.shape==='circle' ? b.r : Math.min(b.hw,b.hh);
        if(dist2(b.x,b.y,t.x,t.y) < (t.r*0.92 + rad)*(t.r*0.92 + rad)){ hit = true; break; }
      }
      if(hit){
        t.hit = true;
        FX.splat(t.x + rnd(-6,6), t.y + rnd(-6,6), t.r*0.42, 'rgba(176,44,36,0.75)');
        FX.burst(t.x,t.y,26,{col:'#ffe9a8',spMax:340,sizeMin:2,sizeMax:5,lifeMax:0.9});
        FX.add({x:t.x,y:t.y,vx:0,vy:0,life:0,max:0.6,size:t.r,col:'#fff0c0',type:'ring',rot:0,rv:0,g:0,drag:0});
        FX.kick(7);
        Audio.ding(this.targets.filter(q=>q.hit).length-1);
        break;
      }
    }
  }
  /* dolls destroyed by hazards handled in onImpact; deadly overlap for sleeping parts */
  for(const d of this.dolls.slice()){
    for(const b of d.list){
      if(b.y > DH + 200){ this.killDoll(d, b.x, DH); break; }
    }
  }
  this.done = this.targets.length > 0 && this.targets.every(t=>t.hit);
  return this.done;
};

Level.prototype.wakeNear = function(b, pad){
  for(const o of this.world.bodies){
    if(o.fixed || o.awake) continue;
    if(o.maxx < b.minx-pad || o.minx > b.maxx+pad || o.maxy < b.miny-pad || o.miny > b.maxy+pad) continue;
    o.wake();
  }
};

Level.prototype.fire = function(ang, power){
  const c = this.cannon;
  const speed = 620 + power * 900;
  const mx = c.x + Math.cos(ang)*46, my = c.y + Math.sin(ang)*46;
  const d = new Doll(this.world, mx, my, ang, Math.cos(ang)*speed, Math.sin(ang)*speed);
  this.dolls.push(d);
  this.used++;
  c.recoil = 1;
  FX.smoke(mx, my, 12, ang, 1.1);
  FX.burst(mx,my,14,{col:'#ffd08a',dir:ang,spread:0.5,spMin:120,spMax:420,sizeMax:4,lifeMax:0.45});
  FX.add({x:mx,y:my,vx:0,vy:0,life:0,max:0.34,size:9,col:'#ffe0a0',type:'ring',rot:0,rv:0,g:0,drag:0});
  FX.kick(4.5 + power*3);
  Audio.fire(power);
  return d;
};

Level.prototype.canFire = function(){ return this.used < this.shots && !this.done; };
Level.prototype.busy = function(){
  for(const d of this.dolls) if(!d.asleep() && d.age < 6) return true;
  return false;
};
Level.prototype.cups = function(used){
  const tr = this.def.tr || [1, Math.max(1,this.shots-1)];
  if(used <= tr[0]) return 3;
  if(used <= tr[1]) return 2;
  return 1;
};

/* ------------------------------------------------ 8c. level drawing */
function blit(g, c, x, y, a, w, h){
  g.save(); g.translate(x,y); if(a) g.rotate(a);
  g.drawImage(c, -w/2 - c.padx, -h/2 - c.pady);
  g.restore();
}

function drawBody(g, b, t){
  const kind = b.render || (b.shape==='circle' ? 'ball' : (b.fixed ? 'plank' : 'crate'));
  const w = b.hw*2, h = b.hh*2;
  switch(kind){
    case 'plank': case 'door': case 'mover': {
      const mat = kind==='door' || kind==='mover' ? 'metal' : b.mat;
      blit(g, texPlank(w,h,mat), b.x, b.y, b.a, w, h);
      if(kind==='mover'){
        g.save(); g.translate(b.x,b.y); g.rotate(b.a);
        g.fillStyle='rgba(255,220,140,0.45)';
        for(let i=-1;i<=1;i++){
          const ax = i*Math.min(20,w*0.28);
          g.beginPath(); g.moveTo(ax-4,-h*0.14); g.lineTo(ax+4,0); g.lineTo(ax-4,h*0.14); g.closePath(); g.fill();
        }
        g.restore();
      }
      break;
    }
    case 'crate': blit(g, texCrate(w,h,b.mat), b.x, b.y, b.a, w, h); break;
    case 'glass': blit(g, texGlass(w,h), b.x, b.y, b.a, w, h); break;
    case 'tnt':   blit(g, texTNT(w,h),   b.x, b.y, b.a, w, h); break;
    case 'ball':  blit(g, texMetalBall(b.r,b.mat), b.x, b.y, b.a, b.r*2, b.r*2); break;
    case 'rubber': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.35)'; rr(g,-b.hw+2,-b.hh+3,w,h,5); g.fill();
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#6f5b64'); gr.addColorStop(1,'#2b2126');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,5); g.fill();
      g.strokeStyle='#171114'; g.lineWidth=1.6; rr(g,-b.hw,-b.hh,w,h,5); g.stroke();
      g.strokeStyle='rgba(255,190,210,0.30)'; g.lineWidth=2;
      for(let x=-b.hw+7;x<b.hw-3;x+=11){ g.beginPath(); g.moveTo(x,-b.hh+3); g.lineTo(x,b.hh-3); g.stroke(); }
      g.restore();
      break;
    }
    case 'bumper': {
      g.save(); g.translate(b.x,b.y);
      g.fillStyle='rgba(0,0,0,0.35)'; g.beginPath(); g.arc(2,3,b.r,0,TAU); g.fill();
      const gr=g.createRadialGradient(-b.r*0.3,-b.r*0.35,b.r*0.1,0,0,b.r);
      gr.addColorStop(0,'#8a6f79'); gr.addColorStop(0.7,'#42333a'); gr.addColorStop(1,'#221a1e');
      g.fillStyle=gr; g.beginPath(); g.arc(0,0,b.r,0,TAU); g.fill();
      g.strokeStyle='rgba(255,180,200,0.4)'; g.lineWidth=2.4;
      g.beginPath(); g.arc(0,0,b.r*0.62,0,TAU); g.stroke();
      g.strokeStyle='#171114'; g.lineWidth=1.6; g.beginPath(); g.arc(0,0,b.r-0.8,0,TAU); g.stroke();
      g.restore();
      break;
    }
    case 'spike': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.35)'; rr(g,-b.hw+2,-b.hh+3,w,h,2); g.fill();
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#5c646f'); gr.addColorStop(1,'#2b3037');
      g.fillStyle=gr; rr(g,-b.hw,0,w,b.hh,2); g.fill();
      const n = Math.max(2, Math.round(w/13));
      const sw = w/n;
      for(let i=0;i<n;i++){
        const x = -b.hw + i*sw;
        const sg = g.createLinearGradient(x,0,x+sw,0);
        sg.addColorStop(0,'#98a3b0'); sg.addColorStop(0.45,'#e2eaf2'); sg.addColorStop(1,'#5b636e');
        g.fillStyle = sg;
        g.beginPath(); g.moveTo(x+0.6, 1); g.lineTo(x+sw*0.5, -b.hh); g.lineTo(x+sw-0.6, 1); g.closePath(); g.fill();
        g.strokeStyle='rgba(20,24,30,0.7)'; g.lineWidth=0.9; g.stroke();
      }
      g.strokeStyle='#1b1f25'; g.lineWidth=1.4; g.strokeRect(-b.hw,0,w,b.hh);
      g.restore();
      break;
    }
    case 'saw': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.38)'; g.beginPath(); g.arc(2,3,b.r,0,TAU); g.fill();
      const teeth = Math.max(8, Math.round(b.r/3.1));
      g.fillStyle='#cbd5e0';
      g.beginPath();
      for(let i=0;i<teeth;i++){
        const a1=i/teeth*TAU, a2=(i+0.42)/teeth*TAU, a3=(i+1)/teeth*TAU;
        g.lineTo(Math.cos(a1)*b.r*0.86, Math.sin(a1)*b.r*0.86);
        g.lineTo(Math.cos(a2)*b.r, Math.sin(a2)*b.r);
        g.lineTo(Math.cos(a3)*b.r*0.86, Math.sin(a3)*b.r*0.86);
      }
      g.closePath(); g.fill();
      g.strokeStyle='#5c646f'; g.lineWidth=1.2; g.stroke();
      const gr=g.createRadialGradient(-b.r*0.3,-b.r*0.3,b.r*0.05,0,0,b.r*0.86);
      gr.addColorStop(0,'#f2f6fb'); gr.addColorStop(0.7,'#9aa5b2'); gr.addColorStop(1,'#5c646f');
      g.fillStyle=gr; g.beginPath(); g.arc(0,0,b.r*0.86,0,TAU); g.fill();
      g.fillStyle='#3d434b';
      for(let i=0;i<4;i++){ const a=i*PI/2;
        g.beginPath(); g.ellipse(Math.cos(a)*b.r*0.45, Math.sin(a)*b.r*0.45, b.r*0.16, b.r*0.10, a, 0, TAU); g.fill(); }
      rivet(g,0,0,b.r*0.22,'#f8fbff','#333940');
      g.restore();
      break;
    }
    case 'goo': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#5f7a2e'); gr.addColorStop(1,'#28380f');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,4); g.fill();
      g.fillStyle='rgba(160,220,90,0.35)';
      for(let x=-b.hw+5;x<b.hw-2;x+=13){
        const d = 3 + ((x*7)%5);
        g.beginPath(); g.arc(x, b.hh, d, 0, PI); g.fill();
      }
      g.fillStyle='rgba(200,255,140,0.22)'; rr(g,-b.hw+2,-b.hh+1.5,w-4,3.5,2); g.fill();
      g.strokeStyle='#1a2609'; g.lineWidth=1.4; rr(g,-b.hw,-b.hh,w,h,4); g.stroke();
      g.restore();
      break;
    }
    case 'link': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='#6a5533'; rr(g,-b.hw,-b.hh,w,h,2.4); g.fill();
      g.strokeStyle='#33280f'; g.lineWidth=1.1; rr(g,-b.hw,-b.hh,w,h,2.4); g.stroke();
      g.fillStyle='rgba(255,235,190,0.28)'; g.fillRect(-b.hw+0.8,-b.hh+1,1.6,h-2);
      g.restore();
      break;
    }
    case 'pivot': {
      g.save(); g.translate(b.x,b.y);
      g.fillStyle='#2c3138'; g.beginPath(); g.arc(0,0,6.5,0,TAU); g.fill();
      rivet(g,0,0,4.6,'#e8eef6','#2c3138');
      g.restore();
      break;
    }
    case 'balloon': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a*0.4);
      g.fillStyle='rgba(0,0,0,0.22)'; g.beginPath(); g.ellipse(2,4,b.r*0.94,b.r*1.1,0,0,TAU); g.fill();
      const gr=g.createRadialGradient(-b.r*0.35,-b.r*0.45,b.r*0.1,0,0,b.r*1.1);
      gr.addColorStop(0,'#ffc4d6'); gr.addColorStop(0.6,'#e4587f'); gr.addColorStop(1,'#9c2b4c');
      g.fillStyle=gr;
      g.beginPath(); g.ellipse(0,0,b.r*0.94,b.r*1.1,0,0,TAU); g.fill();
      g.fillStyle='rgba(255,255,255,0.55)';
      g.beginPath(); g.ellipse(-b.r*0.33,-b.r*0.42,b.r*0.20,b.r*0.30,-0.5,0,TAU); g.fill();
      g.fillStyle='#9c2b4c';
      g.beginPath(); g.moveTo(-3,b.r*1.05); g.lineTo(3,b.r*1.05); g.lineTo(0,b.r*1.32); g.closePath(); g.fill();
      g.restore();
      break;
    }
    case 'btnbase': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#7a838f'); gr.addColorStop(1,'#333a43');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,3); g.fill();
      g.strokeStyle='#20252b'; g.lineWidth=1.4; rr(g,-b.hw,-b.hh,w,h,3); g.stroke();
      g.restore();
      break;
    }
    default: {
      if(b.shape==='circle') blit(g, texMetalBall(b.r,b.mat), b.x, b.y, b.a, b.r*2, b.r*2);
      else blit(g, texPlank(w,h,b.mat), b.x, b.y, b.a, w, h);
    }
  }
}

function drawWater(g,e,t,front){
  const l=e.x-e.w/2, top=e.y-e.h/2;
  g.save();
  g.beginPath(); g.rect(l, top, e.w, e.h); g.clip();
  if(!front){
    const gr=g.createLinearGradient(0,top,0,top+e.h);
    gr.addColorStop(0,'rgba(70,150,200,0.44)');
    gr.addColorStop(1,'rgba(20,70,120,0.66)');
    g.fillStyle=gr; g.fillRect(l,top,e.w,e.h);
  } else {
    g.fillStyle='rgba(140,220,255,0.10)'; g.fillRect(l,top,e.w,e.h);
    g.strokeStyle='rgba(190,240,255,0.30)'; g.lineWidth=1;
    for(let i=0;i<4;i++){
      const y = top + 14 + i*Math.max(12,e.h/5);
      if(y > top+e.h) break;
      g.beginPath();
      for(let x=l;x<l+e.w;x+=8) g.lineTo(x, y + Math.sin(x*0.05 + t*1.6 + i)*2.2);
      g.stroke();
    }
  }
  g.restore();
  if(!front){
    g.strokeStyle='rgba(200,245,255,0.62)'; g.lineWidth=2;
    g.beginPath();
    for(let x=l;x<=l+e.w;x+=6) g.lineTo(x, top + Math.sin(x*0.045 + t*2.2)*2.4 + Math.sin(x*0.11 - t*1.3)*1.1);
    g.stroke();
  }
}

function drawFan(g,e,t){
  g.save();
  g.beginPath(); g.rect(e.x-e.w/2, e.y-e.h/2, e.w, e.h); g.clip();
  const n = 7;
  for(let i=0;i<n;i++){
    const p = ((t*0.55 + i/n) % 1);
    const px = e.x - e.w/2 + (Math.cos(e.dir)*p + 0.5)*e.w;
    const py = e.y - e.h/2 + (Math.sin(e.dir)*p + 0.5)*e.h;
    const al = Math.sin(p*PI)*0.30;
    g.strokeStyle = `rgba(220,240,255,${al})`;
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(px,py);
    g.lineTo(px + Math.cos(e.dir)*16, py + Math.sin(e.dir)*16);
    g.stroke();
  }
  g.restore();
  g.strokeStyle='rgba(190,225,255,0.16)'; g.lineWidth=1.4;
  g.setLineDash([6,6]); g.strokeRect(e.x-e.w/2, e.y-e.h/2, e.w, e.h); g.setLineDash([]);
  // the blower housing at the back of the region
  const hx = e.x - Math.cos(e.dir)*e.w/2, hy = e.y - Math.sin(e.dir)*e.h/2;
  g.save(); g.translate(hx,hy); g.rotate(e.dir);
  g.fillStyle='#3b4149'; rr(g,-9,-20,18,40,4); g.fill();
  g.strokeStyle='#1c2026'; g.lineWidth=1.5; rr(g,-9,-20,18,40,4); g.stroke();
  g.save(); g.translate(0,0); g.rotate(t*9);
  g.fillStyle='#9aa6b3';
  for(let i=0;i<3;i++){ g.rotate(TAU/3);
    g.beginPath(); g.ellipse(0,-9,3.4,9,0,0,TAU); g.fill(); }
  g.restore();
  rivet(g,0,0,3,'#e8eef6','#2c3138');
  g.restore();
}

function drawPortal(g,e,t){
  for(const [x,y,a,c1,c2] of [[e.ax,e.ay,e.aa,'#7de0ff','#2a6fb0'],[e.bx,e.by,e.ba,'#c39bff','#5a2ea8']]){
    g.save(); g.translate(x,y); g.rotate(a);
    for(let i=0;i<3;i++){
      const p = ((t*0.7 + i/3) % 1);
      g.globalAlpha = (1-p)*0.55;
      g.strokeStyle = c1; g.lineWidth = 3*(1-p)+1;
      g.beginPath(); g.ellipse(0,0,e.r*(0.35+p*0.75), e.r*(0.35+p*0.75)*0.55, 0, 0, TAU); g.stroke();
    }
    g.globalAlpha=1;
    const gr=g.createRadialGradient(0,0,2,0,0,e.r);
    gr.addColorStop(0,'rgba(255,255,255,0.55)');
    gr.addColorStop(0.5, c2 + 'aa');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;
    g.beginPath(); g.ellipse(0,0,e.r,e.r*0.6,0,0,TAU); g.fill();
    g.strokeStyle=c1; g.lineWidth=2.6;
    g.beginPath(); g.ellipse(0,0,e.r,e.r*0.6,0,0,TAU); g.stroke();
    g.restore();
  }
}

function drawButton(g,e){
  const off = e.press*5;
  g.save(); g.translate(e.x, e.y + off); g.rotate(e.base.a);
  const gr=g.createLinearGradient(0,-6,0,6);
  if(e.on){ gr.addColorStop(0,'#ffd97a'); gr.addColorStop(1,'#c07d1c'); }
  else    { gr.addColorStop(0,'#d05c4a'); gr.addColorStop(1,'#7d2418'); }
  g.fillStyle=gr; rr(g,-(e.w-10)/2,-6,e.w-10,11,3); g.fill();
  g.strokeStyle='#1e1410'; g.lineWidth=1.5; rr(g,-(e.w-10)/2,-6,e.w-10,11,3); g.stroke();
  g.fillStyle='rgba(255,255,255,0.30)'; g.fillRect(-(e.w-10)/2+2,-5,e.w-14,2.4);
  g.restore();
  if(e.on){
    g.save(); g.globalAlpha=0.5; g.fillStyle='#ffd97a';
    g.beginPath(); g.arc(e.x, e.y-2, 13, 0, TAU); g.fill(); g.restore();
  }
}

Level.prototype.draw = function(g, aim){
  const t = this.time;
  g.drawImage(background(this.theme), 0, 0);

  // water sits behind everything it holds
  for(const e of this.ents) if(e.type==='water') drawWater(g,e,t,false);
  for(const e of this.ents) if(e.type==='portal') drawPortal(g,e,t);

  // painted marks live on the world, under the objects
  g.drawImage(FX.decal, 0, 0);

  for(const tg of this.targets) drawTarget(g, tg.x, tg.y, tg.r, t, tg.hit);

  for(const b of this.world.bodies){
    if(b.render==='btnbase' || b.dead) continue;
    drawBody(g, b, t);
  }
  for(const e of this.ents){
    if(e.type==='btn'){ drawBody(g, e.base, t); drawButton(g, e); }
  }

  for(const d of this.dolls) drawDoll(g, d);

  for(const e of this.ents){
    if(e.type==='balloon' && e.tether && !e.b.dead){
      g.save();
      g.strokeStyle='rgba(230,210,180,0.5)'; g.lineWidth=1.4;
      g.beginPath();
      const ax = e.b.x, ay = e.b.y + e.b.r*1.3;
      const bx = e.ax0, by = e.ay0;
      g.moveTo(ax,ay);
      g.quadraticCurveTo((ax+bx)/2 + Math.sin(t*1.6)*5, (ay+by)/2, bx, by);
      g.stroke();
      g.restore();
    }
  }
  for(const e of this.ents) if(e.type==='fan') drawFan(g,e,t);
  for(const e of this.ents) if(e.type==='water') drawWater(g,e,t,true);

  drawCannon(g, this.cannon.x, this.cannon.y, this.cannon.a, this.cannon.recoil, this.cannon.charge);

  FX.draw(g);

  const tint = THEMES[this.theme].tint;
  if(tint){ g.fillStyle = tint; g.fillRect(0,0,DW,DH); }
};

/* trajectory preview: run a lone point mass forward, stop at the first wall */
Level.prototype.previewArc = function(ang, power, steps){
  const pts = [];
  const speed = 620 + power*900;
  let x = this.cannon.x + Math.cos(ang)*46, y = this.cannon.y + Math.sin(ang)*46;
  let vx = Math.cos(ang)*speed, vy = Math.sin(ang)*speed;
  const dt = 1/60;
  for(let i=0;i<steps;i++){
    const nx = x + vx*dt, ny = y + vy*dt;
    const hit = this.world.raycastAny(x,y,nx,ny, b=>b.fixed && !b.sensor);
    pts.push({x:nx,y:ny});
    if(hit) break;
    x = nx; y = ny;
    vy += 1580*dt;
    const d = 1/(1+dt*0.16); vx*=d; vy*=d;
  }
  return pts;
};

/* =====================================================================
   10. SAVE
   ===================================================================== */
const SAVE_KEY = 'flopshot.save.v1';
const Save = {
  data: { best:{}, sound:true, music:true, guide:true, seen:false },
  load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(d && typeof d === 'object') this.data = Object.assign(this.data, d);
      }
    }catch(e){}
    Audio.on = this.data.sound !== false;
    Audio.musicOn = this.data.music !== false;
  },
  write(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); }catch(e){} },
  best(i){ return this.data.best[i]; },
  cleared(i){ return this.data.best[i] !== undefined; },
  unlocked(i){
    if(i === 0 || this.cleared(i) || this.cleared(i-1)) return true;
    // being stuck on one room must not end the game: two may be stepped over
    let done = 0;
    for(let k=0;k<i;k++) if(this.cleared(k)) done++;
    return done >= i - 2;
  },
  record(i, used, cups){
    const b = this.data.best[i];
    if(b === undefined || used < b.u){ this.data.best[i] = { u:used, c:cups }; }
    this.write();
  },
  cups(i){ const b = this.data.best[i]; return b ? b.c : 0; },
  totalCups(){ let n=0; for(const k in this.data.best) n += this.data.best[k].c; return n; },
  worldCups(w){ let n=0; for(let i=WORLDS[w].from;i<WORLDS[w].to;i++) n += this.cups(i); return n; },
  worldCleared(w){ for(let i=WORLDS[w].from;i<WORLDS[w].to;i++) if(!this.cleared(i)) return false; return true; }
};

  g.beginPath(); g.moveTo(7,-7.4); g.quadraticCurveTo(11.4,-6,9.6,-1.6); g.quadraticCurveTo(8.6,0.6,6.4,0.4); g.stroke();
  g.globalAlpha=1; g.restore();
}
function drawDollIcon(g,x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='#3a3226';
  g.beginPath(); g.arc(0,-8,4.6,0,TAU); g.fill();

  rr(g,-6.6,-3.2,3,8,1.5); g.fill();
  rr(g,3.6,-3.2,3,8,1.5); g.fill();
  rr(g,-3.2,6,2.8,8,1.4); g.fill();
  rr(g,0.4,6,2.8,8,1.4); g.fill();
  g.fillStyle='#f2ead6';
  g.beginPath(); g.arc(0,-8,3.6,0,TAU); g.fill();
  rr(g,-2.6,-3,5.2,9,2); g.fill();
  rr(g,-5.8,-2.6,2.2,7,1.1); g.fill();
  rr(g,3.6,-2.6,2.2,7,1.1); g.fill();

/* =====================================================================
   12. GAME
   ===================================================================== */
const Game = {
  state:'boot', prev:null, t:0, fade:1, fadeDir:-1, next:null,
  level:null, levelIdx:0, world:0,
  aiming:false, aimA:0, aimP:0, arc:[], arcT:0,
  result:null, resultT:0, hint:0, slow:1, msg:'', msgT:0,

  go(state){ this.state = state; this.t = 0; },
  transition(fn){ this.fadeDir = 1; this.next = fn; },

  startLevel(i){
    this.levelIdx = clamp(i, 0, LEVELS.length-1);
    this.world = WORLDS.findIndex(w => this.levelIdx >= w.from && this.levelIdx < w.to);
    if(this.world < 0) this.world = 0;
    FX.reset();
    this.level = new Level(LEVELS[this.levelIdx], this.levelIdx);
    this.aimA = this.level.cannon.a;
    this.aimP = 0.75;
    this.arc = [];
    this.result = null; this.resultT = 0; this.slow = 1;
    this.hint = Save.data.seen ? 0 : 4.5;
    Audio.key = (this.world*2) % 12;
    this.go('play');
  },
  retry(){ this.startLevel(this.levelIdx); },
  nextLevel(){
    if(this.levelIdx+1 < LEVELS.length) this.startLevel(this.levelIdx+1);
    else { this.go('finale'); }
  },

  /* ------------------------------------------------- play */
  updatePlay(dt){
    const L = this.level, C = L.cannon;
    C.recoil = Math.max(0, C.recoil - dt*4.5);

    const hudZone = IN.y > DH-70 && IN.x < 200;
    if(!this.result){
      if(IN.down && !hudZone){
        const dx = IN.x - C.x, dy = IN.y - C.y;
        const d = Math.hypot(dx,dy);
        if(d > 26){
          let a = Math.atan2(dy,dx);
          this.aimA = a;
          this.aimP = clamp((d - 40)/260, 0.12, 1);
          this.aiming = true;
        }
      } else if(this.aiming){
        this.aiming = false;
        if(L.canFire()){
          L.fire(this.aimA, this.aimP);
          Save.data.seen = true; Save.write();
          this.hint = 0;
        } else if(L.used >= L.shots){
          this.flash('Out of dolls');
        }
      }
      if(KEY['ArrowUp'])   this.aimA -= dt*1.1;
      if(KEY['ArrowDown']) this.aimA += dt*1.1;
      if(KEY['ArrowLeft']) this.aimP = clamp(this.aimP - dt*0.6, 0.12, 1);
      if(KEY['ArrowRight'])this.aimP = clamp(this.aimP + dt*0.6, 0.12, 1);
      if(KEY[' '] && !this._sp){ this._sp = true; if(L.canFire()) L.fire(this.aimA,this.aimP); }
      if(!KEY[' ']) this._sp = false;
    }
    this.aimA = clamp(this.aimA, C.lo, C.hi);
    C.a = lerp(C.a, this.aimA, Math.min(1, dt*16));
    C.charge = this.aiming ? this.aimP : lerp(C.charge, 0, Math.min(1,dt*8));

    const won = L.update(dt * this.slow);

    if(!this.result){
      if(won){
        this.result = 'win';
        this.resultT = 0;
        this.slow = 0.35;
        const cups = L.cups(L.used);
        Save.record(this.levelIdx, L.used, cups);
        Audio.win();
        FX.flash = 0.7; FX.flashCol = '255,240,190';
        for(let i=0;i<44;i++){
          FX.add({ x:rnd(0,DW), y:rnd(-60,120), vx:rnd(-90,90), vy:rnd(60,220),
                   life:0, max:rnd(1.6,3.0), size:rnd(2.5,5.5),
                   col:pick(['#ffd97a','#ff8f6a','#8fd9ff','#c8ff9a','#f2e6cd']),
                   type:'chip', rot:rnd(0,TAU), rv:rnd(-8,8), g:0.22, drag:0.6 });
        }
      } else if(L.used >= L.shots && !L.busy() && L.dolls.every(d=>d.settled > 0.7 || d.gone)){
        this.result = 'lose'; this.resultT = 0; Audio.fail();
      }
    } else {
      this.resultT += dt;
      if(this.result === 'win') this.slow = lerp(this.slow, 1, dt*1.2);
    }

    if(this.hint > 0) this.hint -= dt;
    if(this.msgT > 0) this.msgT -= dt;
  },

  flash(m){ this.msg = m; this.msgT = 1.6; },

  drawPlay(g){
    const L = this.level;
    L.draw(g);

    /* aiming furniture */
    if(!this.result && L.canFire()){
      const C = L.cannon;
      if(this.aiming || this.hint > 0){
        const showA = this.aiming ? this.aimA : C.a;
        const showP = this.aiming ? this.aimP : 0.75;
        if(Save.data.guide !== false){
          const pts = L.previewArc(showA, showP, 100);
          g.save();
          for(let i=4;i<pts.length;i+=4){
            const f = 1 - i/pts.length;
            const r = 3.4*(0.45+f*0.75);
            g.globalAlpha = (0.30 + f*0.55) * 0.55;
            g.fillStyle = '#1a1004';
            g.beginPath(); g.arc(pts[i].x, pts[i].y+1, r+1.2, 0, TAU); g.fill();
            g.globalAlpha = 0.30 + f*0.60;
            g.fillStyle = '#ffe6b0';
            g.beginPath(); g.arc(pts[i].x, pts[i].y, r, 0, TAU); g.fill();
          }
          g.restore();
        }
        // power arc on the muzzle
        g.save(); g.translate(C.x, C.y);
        g.strokeStyle='rgba(255,220,150,0.22)'; g.lineWidth=7;
        g.beginPath(); g.arc(0,0,58,showA-0.9,showA+0.9); g.stroke();
        g.strokeStyle='rgba(255,196,90,0.85)'; g.lineWidth=7;
        g.beginPath(); g.arc(0,0,58,showA-0.9, showA-0.9 + 1.8*showP); g.stroke();
        g.restore();
      }
      if(this.aiming){
        const x = IN.x, y = IN.y;
        g.save();
        g.strokeStyle='rgba(255,240,200,0.85)'; g.lineWidth=2;
        g.beginPath(); g.arc(x,y,17,0,TAU); g.stroke();
        g.globalAlpha=0.55;
        g.beginPath();
        g.moveTo(x-27,y); g.lineTo(x-8,y); g.moveTo(x+8,y); g.lineTo(x+27,y);
        g.moveTo(x,y-27); g.lineTo(x,y-8); g.moveTo(x,y+8); g.lineTo(x,y+27);
        g.stroke();
        g.globalAlpha=1;
        g.fillStyle='rgba(255,240,200,0.9)'; g.beginPath(); g.arc(x,y,2.2,0,TAU); g.fill();
        g.restore();
      }
    }

    if(this.hint > 0 && !this.aiming){
      const a = clamp(this.hint/1.4, 0, 1);
      g.save(); g.globalAlpha = a;
      label(g, 'Drag to aim  ·  further out for more powder', DW/2, 112, 23, '#ffe9be');
      label(g, 'Release to fire', DW/2, 144, 19, 'rgba(255,233,190,0.7)');
      g.restore();
    }

    this.drawHUD(g);
  },

  drawHUD(g){
    const L = this.level;
    // title strip
    g.save();
    const tw = 300, tx = 14;
    g.fillStyle='rgba(12,8,4,0.55)';
    rr(g, tx, 8, tw, 40, 10); g.fill();
    g.strokeStyle='rgba(226,190,126,0.30)'; g.lineWidth=1.4;
    rr(g, tx, 8, tw, 40, 10); g.stroke();
    label(g, `${this.levelIdx+1}.  ${L.name}`, tx+18, 29, 19, '#f0dcb4', 'left');
    g.restore();

    // bottom left: menu + restart
    if(button(g, 14, DH-58, 108, 44, 'MENU')) this.transition(()=>this.go('levels'));
    const rs = uiHit(134, DH-58, 52, 44);
    g.save();
    g.fillStyle='rgba(0,0,0,0.45)'; rr(g,136,DH-54,52,44,9); g.fill();
    const gr=g.createLinearGradient(0,DH-58,0,DH-14);
    gr.addColorStop(0, rs.over?'#7a5c37':'#5e452a'); gr.addColorStop(1, rs.over?'#4a3520':'#372615');
    g.fillStyle=gr; rr(g,134,DH-58+(rs.over?2:0),52,44,9); g.fill();
    g.strokeStyle='rgba(226,190,126,0.5)'; g.lineWidth=1.8; rr(g,135,DH-57+(rs.over?2:0),50,42,8); g.stroke();
    g.translate(160, DH-36+(rs.over?2:0));
    g.strokeStyle='#f0dcb4'; g.lineWidth=3; g.lineCap='round';
    g.beginPath(); g.arc(0,0,11,0.7,TAU-0.5); g.stroke();
    g.fillStyle='#f0dcb4';
    g.beginPath(); g.moveTo(9,-10); g.lineTo(14,1); g.lineTo(3,0.5); g.closePath(); g.fill();
    g.restore();
    if(rs.clicked){ Audio.click(); this.retry(); }

    // top right: dolls left and the cups still on offer
    const left = L.shots - L.used;
    g.save();
    g.fillStyle='rgba(12,8,4,0.55)';
    rr(g, DW-236, 8, 222, 40, 10); g.fill();
    g.strokeStyle='rgba(226,190,126,0.30)'; g.lineWidth=1.4;
    rr(g, DW-236, 8, 222, 40, 10); g.stroke();
    let x = DW - 26;
    label(g, 'x ' + L.cups(L.done ? L.used : Math.min(L.shots, L.used + 1)), x, 29, 22, '#f0dcb4', 'right');
    drawCup(g, x - 46, 28, 1.35, true);
    x -= 92;
    label(g, 'x ' + left, x, 29, 22, left>0?'#f0dcb4':'#e07a5a', 'right');
    drawDollIcon(g, x - 38, 28, 1.35);
    g.restore();

    if(this.msgT > 0){
      g.save(); g.globalAlpha = clamp(this.msgT,0,1);
      label(g, this.msg, DW/2, DH-96, 22, '#ffcf9a');
      g.restore();
    }

    // result cards
    if(this.result === 'win' && this.resultT > 0.55) this.drawWin(g);
    if(this.result === 'lose' && this.resultT > 0.5) this.drawLose(g);
  },

  drawWin(g){
    const L = this.level;
    const t = clamp((this.resultT-0.55)/0.32, 0, 1);
    const e = easeOut(t);
    const w = 420, h = 268, x = DW/2-w/2, y = DH/2-h/2 - 16;
    g.save();
    g.globalAlpha = e*0.55; g.fillStyle='#000'; g.fillRect(0,0,DW,DH); g.globalAlpha=1;
    g.translate(DW/2, DH/2-16); g.scale(0.86+0.14*e, 0.86+0.14*e); g.translate(-DW/2, -(DH/2-16));
    g.globalAlpha = e;
    panel(g,x,y,w,h,16);
    label(g,'MARK PAINTED', DW/2, y+44, 30, '#ffe9be');
    const cups = L.cups(L.used);
    for(let i=0;i<3;i++){
      const cx = DW/2 - 66 + i*66;
      const pop = clamp((this.resultT - 0.75 - i*0.16)/0.22, 0, 1);
      g.save(); g.translate(cx, y+112);
      const s = i < cups ? 2.4*(0.6+0.4*easeOut(pop)) : 2.4;
      g.scale(1,1);
      drawCup(g, 0, 0, s, i < cups && pop > 0);
      g.restore();
    }
    label(g, `Dolls used: ${L.used}`, DW/2, y+164, 20, 'rgba(240,220,180,0.85)');
    const best = Save.best(this.levelIdx);
    if(best) label(g, `Best: ${best.u}`, DW/2, y+190, 17, 'rgba(240,220,180,0.55)');
    if(t > 0.85){
      if(button(g, x+24, y+h-62, 130, 46, 'LEVELS')) this.transition(()=>this.go('levels'));
      if(button(g, x+166, y+h-62, 96, 46, 'RETRY')) this.retry();
      if(button(g, x+274, y+h-62, 122, 46, 'NEXT', {accent:true})) this.transition(()=>this.nextLevel());
    }
    g.restore();
  },

  drawLose(g){
    const t = clamp((this.resultT-0.5)/0.3, 0, 1);
    const e = easeOut(t);
    const w = 380, h = 190, x = DW/2-w/2, y = DH/2-h/2 - 10;
    g.save();
    g.globalAlpha = e*0.5; g.fillStyle='#000'; g.fillRect(0,0,DW,DH); g.globalAlpha=e;
    panel(g,x,y,w,h,16);
    label(g,'OUT OF DOLLS', DW/2, y+50, 28, '#ffc9a8');
    label(g,'The mark is still clean.', DW/2, y+88, 18, 'rgba(240,220,180,0.7)');
    if(t > 0.8){
      if(button(g, x+26, y+h-62, 150, 46, 'LEVELS')) this.transition(()=>this.go('levels'));
      if(button(g, x+196, y+h-62, 158, 46, 'TRY AGAIN', {accent:true})) this.retry();
    }
    g.restore();
  }
};

Game.menuBG = function(g){
  g.drawImage(background(0), 0, 0);
  g.save();
  g.globalAlpha = 0.55;
  g.drawImage(background(2), 0, 0);
  g.restore();
  // a lazy doll drifting across the title screen
  const t = this.t;
  g.save(); g.globalAlpha=0.14;
  for(let i=0;i<7;i++){
    const p = ((t*0.045 + i/7) % 1);
    const x = p*DW*1.2 - 100, y = 120 + Math.sin(p*7+i)*90 + i*44;
    g.save(); g.translate(x,y); g.rotate(p*7+i); g.scale(2.2,2.2);
    drawDollIcon(g,0,0,1);
    g.restore();

  g.restore();
};

Game.drawLevels = function(g){
  const W = WORLDS[this.world];
  g.drawImage(background(W.th), 0, 0);
  g.fillStyle='rgba(8,5,3,0.62)'; g.fillRect(0,0,DW,DH);
  label(g, W.name.toUpperCase(), DW/2, 54, 34, '#f5dfa8');
  const cups = Save.worldCups(this.world);
  g.save(); drawCup(g, DW/2-30, 88, 1.4, cups>0);
  label(g, `${cups} / ${(W.to-W.from)*3}`, DW/2+4, 88, 19, 'rgba(240,220,180,0.8)', 'left');
  g.restore();

  const cols = 6, rows = 2, cw = 124, ch = 118, gx = 14, gy = 16;
  const ox = DW/2 - (cols*cw + (cols-1)*gx)/2;
  const oy = 172;
  for(let i=W.from;i<W.to;i++){
    const k = i - W.from;
    const x = ox + (k%cols)*(cw+gx), y = oy + Math.floor(k/cols)*(ch+gy);
    const open = Save.unlocked(i);
    const st = uiHit(x,y,cw,ch);
    g.save();
    g.globalAlpha = open ? 1 : 0.42;
    g.fillStyle='rgba(0,0,0,0.5)'; rr(g,x+2,y+4,cw,ch,12); g.fill();
    const gr=g.createLinearGradient(0,y,0,y+ch);
    if(Save.cleared(i)){ gr.addColorStop(0, st.over?'#6e5a2e':'#4e3f1e'); gr.addColorStop(1,'#2c2410'); }
    else { gr.addColorStop(0, st.over?'#6a4f31':'#503a23'); gr.addColorStop(1,'#2e2113'); }
    g.fillStyle=gr; rr(g,x,y+(st.over&&open?2:0),cw,ch,12); g.fill();
    g.strokeStyle= Save.cleared(i) ? 'rgba(255,220,140,0.6)' : 'rgba(226,190,126,0.35)';
    g.lineWidth=2; rr(g,x+1,y+1+(st.over&&open?2:0),cw-2,ch-2,11); g.stroke();
    const yy = y + (st.over&&open?2:0);
    if(open){
      label(g, String(i+1), x+cw/2, yy+34, 32, '#f5dfa8');
      label(g, LEVELS[i].n, x+cw/2, yy+62, 12, 'rgba(240,220,180,0.62)');
      const c = Save.cups(i);
      for(let q=0;q<3;q++) drawCup(g, x+cw/2-29+q*29, yy+92, 1.12, q<c);
    } else {
      g.save(); g.translate(x+cw/2, yy+ch/2-6);
      g.fillStyle='rgba(240,220,180,0.55)';
      rr(g,-15,-2,30,24,4); g.fill();
      g.strokeStyle='rgba(240,220,180,0.55)'; g.lineWidth=4;
      g.beginPath(); g.arc(0,-2,10,PI,TAU); g.stroke();
      g.restore();
    }
    g.restore();
    if(st.clicked && open){ Audio.click(); this.transition(()=>this.startLevel(i)); }
  }
  if(button(g, 20, DH-62, 130, 46, 'BACK')) this.transition(()=>this.go('worlds'));
  if(this.world > 0 && button(g, DW/2-150, DH-62, 46, 46, '<')) { this.world--; }
  if(this.world < WORLDS.length-1 && button(g, DW/2+104, DH-62, 46, 46, '>')) { this.world++; }
  if(button(g, DW-150, DH-62, 130, 46, 'SETTINGS')) this.transition(()=>this.go('settings'));
};

Game.drawSettings = function(g){

  row(0,'Sound', Save.data.sound!==false, ()=>{
    Save.data.sound = !(Save.data.sound!==false); Audio.on = Save.data.sound; Save.write(); });
  row(1,'Music', Save.data.music!==false, ()=>{
    Save.data.music = !(Save.data.music!==false); Audio.musicOn = Save.data.music; Save.write(); });
  row(2,'Aim guide', Save.data.guide!==false, ()=>{
    Save.data.guide = !(Save.data.guide!==false); Save.write(); });
  if(this._wipe){
    label(g,'Erase every cup and clear all rooms?', DW/2, y+284, 16, '#ffb59a');
    if(button(g, x+40, y+306, 150, 44, 'CANCEL')) this._wipe = false;
    if(button(g, x+w-190, y+306, 150, 44, 'ERASE', {accent:true})){
      Save.data.best = {}; Save.write(); this._wipe = false;
    }
  } else {
    if(button(g, x+30, y+282, w-60, 44, 'RESET PROGRESS')) this._wipe = true;
  }
  if(button(g, 20, DH-62, 130, 46, 'BACK')){ this._wipe=false; this.transition(()=>this.go(this.level?'levels':'title')); }
};

Game.drawFinale = function(g){
  this.menuBG(g);
  label(g,'THE WORKS ARE QUIET', DW/2, 150, 44, '#f5dfa8');
  label(g,'Every mark painted. Seventy-two rooms behind you.', DW/2, 208, 21, 'rgba(240,220,180,0.75)');
  const tc = Save.totalCups();
  g.save(); drawCup(g, DW/2-60, 290, 3.0, true);
  label(g, `${tc} / ${LEVELS.length*3}`, DW/2+4, 290, 34, '#f0dcb4', 'left');
  g.restore();
  label(g, tc >= LEVELS.length*3 ? 'A perfect cabinet. Nothing left to prove.'
                                 : 'Some rooms still owe you a cup.',
        DW/2, 366, 18, 'rgba(240,220,180,0.6)');
  if(button(g, DW/2-150, 430, 300, 54, 'BACK TO THE ROOMS', {accent:true}))
    this.transition(()=>this.go('worlds'));
};

/* =====================================================================
   13. MAIN LOOP
   ===================================================================== */
FX.init();
Save.load();
resize();
Game.go('title');

let lastT = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - lastT)/1000;
  PERF.sample((now - lastT));
  lastT = now;
  if(dt > 0.06) dt = 0.06;          // a slow frame must not blow up the solver
  if(dt <= 0) dt = 1/60;

  Game.t += dt;
  Audio.music(dt);

  // screen transition
  if(Game.fadeDir > 0){
    Game.fade += dt*4.2;
    if(Game.fade >= 1){ Game.fade = 1; Game.fadeDir = -1; if(Game.next){ Game.next(); Game.next = null; } }
  } else if(Game.fade > 0){
    Game.fade -= dt*3.4;
    if(Game.fade < 0) Game.fade = 0;
  }

  if(Game.state === 'play' && Game.level) Game.updatePlay(dt);
  FX.update(dt);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#070503';
  ctx.fillRect(0,0,CW,CH);

  const sh = FX.shake;
  const sx = sh ? rnd(-sh,sh) : 0, sy = sh ? rnd(-sh,sh) : 0;
  ctx.save();
  ctx.setTransform(SC,0,0,SC,OX + sx*SC, OY + sy*SC);
  ctx.beginPath(); ctx.rect(0,0,DW,DH); ctx.clip();

  switch(Game.state){
    case 'title':    Game.drawTitle(ctx); break;
    case 'worlds':   Game.drawWorlds(ctx); break;
    case 'levels':   Game.drawLevels(ctx); break;
    case 'settings': Game.drawSettings(ctx); break;
    case 'finale':   Game.drawFinale(ctx); break;
    case 'play':     Game.drawPlay(ctx); break;
  }

  if(FX.flash > 0){
    ctx.fillStyle = `rgba(${FX.flashCol},${clamp(FX.flash,0,1)*0.55})`;
    ctx.fillRect(0,0,DW,DH);
  }
  if(Game.fade > 0){
    ctx.fillStyle = `rgba(6,4,2,${clamp(Game.fade,0,1)})`;
    ctx.fillRect(0,0,DW,DH);
  }
  ctx.restore();

  // letterbox trim
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#070503';
  if(OY > 0){ ctx.fillRect(0,0,CW,OY+1); ctx.fillRect(0,CH-OY-1,CW,OY+1); }
  if(OX > 0){ ctx.fillRect(0,0,OX+1,CH); ctx.fillRect(CW-OX-1,0,OX+1,CH); }

  endFrameInput();
}
requestAnimationFrame(frame);

/* a small hook so the level set can be checked from outside the game */
window.__flop = { Game, LEVELS, Level, Doll, World, Save, FX, THEMES };
</script>
