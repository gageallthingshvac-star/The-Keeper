    this.hit(t+0.46, 0.6, 6000, 0.6, 0.10, 'highpass');
    this.clang(t+0.47, 1046.5, 0.22, 1.4);
  },
  // a cup has just slipped out of reach. Two notes down, soft enough to
  // inform without scolding -- nothing has been lost that a retry cannot fix.
  cupLost(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    [0,-4].forEach((s,i)=>{
      const f=330*Math.pow(2,s/12);
      this.osc(t+i*0.13, f, f*0.96, 0.30, 0.075, 'triangle');
    });
  },
  click(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    this.hit(t,0.04,2600,3,0.20,'bandpass');
    this.clang(t, 620, 0.10, 0.14);
  },
  tick(){ if(!this.ready||!this.on) return; this.hit(this.now(),0.028,1700,4,0.07,'bandpass'); },
  gear(sp){
    if(!this.ready||!this.on) return;
    const t=this.now(), v=clamp(sp*0.028, 0.02, 0.10);
    this.clang(t, 120 + Math.random()*70, v, 0.34);
    this.hit(t, 0.06, 700, 2.2, v*0.7, 'bandpass');
  },
  hum(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    this.osc(t, 780+Math.random()*260, 520, 0.13, 0.030, 'sawtooth');
    this.hit(t, 0.10, 4200, 1.4, 0.022, 'highpass');
  },
  collapse(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    this.hit(t, 1.5, 420, 0.5, 0.55, 'lowpass', null, 110);
    this.osc(t, 130, 34, 1.3, 0.32, 'triangle');
    for(let i=0;i<16;i++){
      const d = 0.05 + Math.random()*1.15;
      this.hit(t+d, 0.10, 260+Math.random()*500, 2.0, 0.16, 'bandpass');
      if(Math.random()<0.5) this.clang(t+d, 150+Math.random()*260, 0.09, 0.34);
    }
  },
  lastDoll(){
    if(!this.ready||!this.on) return;
    const t=this.now();
    this.osc(t, 440, 330, 0.30, 0.13, 'triangle');
    this.osc(t+0.14, 330, 262, 0.34, 0.11, 'triangle');
  },
  duck(amount, secs){
    if(!this.ready) return;
    const g=this.musicG.gain, t=this.now();
    try{
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(g.value*(1-amount), t+0.04);
      g.linearRampToValueAtTime(g.value, t+0.04+secs);
    }catch(e){}
  },

  /* ---- ambience: a slow wash plus the odd noise from the room ---- */
  buildAmbience(){
    const ac=this.ac;
    const s=ac.createBufferSource(); s.buffer=this.noiseBuf(); s.loop=true;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=340; f.Q.value=0.7;
    const g=ac.createGain(); g.gain.value=0.10;
    const lfo=ac.createOscillator(); lfo.frequency.value=0.07;
    const lg=ac.createGain(); lg.gain.value=150;
    lfo.connect(lg); lg.connect(f.frequency);
    s.connect(f); f.connect(g); g.connect(this.ambG);
    s.start(); lfo.start();
    this.ambFilter=f;
  },
  setTheme(th){
    this.theme = th|0;
    if(!this.ready) return;
    const base = [300, 210, 420, 520, 260, 700][this.theme] || 320;
    try{ this.ambFilter.frequency.setTargetAtTime(base, this.now(), 0.6); }catch(e){}
  },
  ambientOneShot(){
    if(!this.ready || !this.on) return;
    const t=this.now();
    switch(this.theme){
      case 0: this.clang(t, 180+Math.random()*140, 0.045, 0.5); break;          // workshop knock
      case 1: this.osc(t, 1400+Math.random()*700, 500, 0.12, 0.05, 'sine'); break; // a drip
      case 2: this.hit(t,0.03,3000,5,0.04,'bandpass');                          // a tick
              this.hit(t+0.26,0.03,2400,5,0.03,'bandpass'); break;
      case 3: {                                                                  // a bird
        const f=1600+Math.random()*900;
        this.osc(t, f, f*1.5, 0.09, 0.045, 'sine');
        this.osc(t+0.11, f*1.3, f*0.9, 0.08, 0.035, 'sine'); break;
      }
      case 4: this.hit(t, 0.5+Math.random()*0.5, 260, 0.5, 0.05, 'lowpass', null, 120); break; // furnace
      default: this.hit(t, 1.2, 900, 0.4, 0.035, 'bandpass', null, 400); break;  // wind
    }
  },

  /* ---- music: six short loops, one per wing ---- */
  TUNES: [
    // root, scale, bass line per bar, melody as [beat, degree, len]
    { root:110, sc:[0,2,3,5,7,8,10], bass:[0,0,5,3], bpm:112,
      mel:[[0,7,0.5],[0.5,5,0.5],[1,3,1],[2,5,0.5],[2.5,7,0.5],
           [3,10,1],[4,7,0.5],[4.5,5,0.5],[5,3,1],[6,2,1],[7,0,1]] },
    { root:98,  sc:[0,2,3,5,7,8,10], bass:[0,3,5,4], bpm:96,
      mel:[[0,0,1],[1,3,0.5],[1.5,2,0.5],[2,3,1],[3,5,1],
           [4,3,0.5],[4.5,2,0.5],[5,0,1.5],[6.5,-2,0.5],[7,0,1]] },
    { root:123, sc:[0,2,3,5,7,8,10], bass:[0,0,3,5], bpm:132,
      mel:[[0,7,0.25],[0.25,7,0.25],[0.5,10,0.5],[1,7,0.5],[1.5,5,0.5],
           [2,3,0.25],[2.25,5,0.25],[2.5,7,1],[4,10,0.5],[4.5,12,0.5],
           [5,10,0.5],[5.5,7,0.5],[6,5,1],[7,3,1]] },
    { root:146, sc:[0,2,4,5,7,9,11], bass:[0,4,5,4], bpm:104,
      mel:[[0,4,0.75],[0.75,2,0.25],[1,0,1],[2,4,0.5],[2.5,7,0.5],
           [3,9,1],[4,7,0.5],[4.5,4,0.5],[5,2,1],[6,4,2]] },
    { root:87,  sc:[0,1,3,5,7,8,10], bass:[0,0,1,5], bpm:120,
      mel:[[0,0,0.5],[0.5,1,0.5],[1,3,0.5],[1.5,5,0.5],[2,7,1],
           [3,5,0.5],[3.5,3,0.5],[4,1,1],[5,0,1],[6,7,1],[7,5,1]] },
    { root:131, sc:[0,2,4,7,9], bass:[0,3,4,3], bpm:100,
      mel:[[0,0,1],[1,2,0.5],[1.5,4,0.5],[2,7,1.5],[3.5,4,0.5],
           [4,2,1],[5,0,1],[6,4,1],[7,2,1]] }
  ],
  setTune(i){
    const n = i % this.TUNES.length;
    if(n === this.tune) return;
    this.tune = n; this.stepN = 0;
    if(this.ready) this.nextNote = this.now() + 0.05;
  },
  degree(sc, d){
    const oct = Math.floor(d / sc.length);
    let k = d % sc.length; if(k < 0){ k += sc.length; }
    return sc[k] + oct*12;
  },
  music(dt){
    if(!this.ready) return;
    const wantM = (this.on && this.musicOn) ? 0.20 : 0.0;
    const wantA = this.on ? 0.34 : 0.0;
    const k = Math.min(1, dt*2.2);
    this.musicG.gain.value += (wantM - this.musicG.gain.value) * k;
    this.ambG.gain.value   += (wantA - this.ambG.gain.value) * k;

    this.ambTimer -= dt;
    if(this.ambTimer <= 0){
      this.ambTimer = 2.4 + Math.random()*5.5;
      if(this.on && this.ambG.gain.value > 0.05) this.ambientOneShot();
    }
    if(wantM <= 0.001) return;

    const T = this.TUNES[this.tune];
    const beat = 60 / T.bpm;
    const now = this.now();
    // schedule ahead so the loop never drifts. One step is a sixteenth,
    // sixty four of them make four bars of four four.
    while(this.nextNote < now + 0.24){
      const t = Math.max(this.nextNote, now + 0.01);
      const s = this.stepN;
      const bar = (s >> 4) & 3;
      const bd = T.bass[bar];

      // bass on one and three, chord on two and four
      if(s % 16 === 0 || s % 16 === 8){
        const f = T.root * Math.pow(2, this.degree(T.sc, bd)/12);
        this.mnote(t, f*0.5, beat*0.85, 0.36, 'triangle', 240);
      }
      if(s % 16 === 4 || s % 16 === 12){
        for(const iv of [0,2,4]){
          const f = T.root * Math.pow(2, this.degree(T.sc, bd+iv)/12);
          this.mnote(t, f, beat*0.34, 0.085, 'square', 1000);
        }
      }
      // melody, a two bar phrase played twice across the loop
      const pos = (s % 32) / 4;
      for(const m of T.mel){
        if(Math.abs(m[0] - pos) < 0.001){
          const f = T.root * 2 * Math.pow(2, this.degree(T.sc, m[1])/12);
          this.mnote(t, f, beat*m[2]*0.9, 0.165, 'triangle', 2400);
          this.mnote(t, f*2, beat*m[2]*0.45, 0.04, 'sine', 4500);
        }
      }
      // a workshop rhythm section
      if(s % 16 === 0 || s % 16 === 10) this.mhit(t, 0.11, 190, 1.3, 0.17, 'lowpass');
      if(s % 16 === 8) this.mhit(t, 0.06, 3200, 1.8, 0.075, 'highpass');
      if(s % 4 === 2) this.mhit(t, 0.03, 5200, 2.4, 0.028, 'highpass');
      if(s === 60) this.mhit(t, 0.05, 1800, 3.0, 0.06, 'bandpass');

      this.nextNote += beat * 0.25;
      this.stepN = (this.stepN + 1) % 64;
    }
  },
  mnote(t, f, dur, vol, type, cut){
    const ac=this.ac;
    const o=ac.createOscillator(); o.type=type; o.frequency.value=f;
    const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=cut||1200; fl.Q.value=0.6;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(fl); fl.connect(g); g.connect(this.musicG);
    o.start(t); o.stop(t+dur+0.04);
  },
  mhit(t, dur, freq, q, vol, type){
    const ac=this.ac;
    const s=ac.createBufferSource(); s.buffer=this.noiseBuf(); s.loop=true;
    const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.musicG);
    s.start(t); s.stop(t+dur+0.03);
  }
};
const Audio = Audio_;

/* =====================================================================
   8. LEVEL  —  builds bodies from the compact op list and owns every
   moving part that is not plain rigid body physics.
   ===================================================================== */
const D2R = PI/180;

class Level {
  constructor(def, index){
    this.def = def;
    this.index = index;
    this.theme = def.th || 0;
    this.name = def.n;
    this.world = new World();
    this.ents = [];
    this.targets = (def.tg||[]).map(t=>({ x:t[0], y:t[1], r:Math.round((t[2]||26)*TSCALE),
                                        a:(t[3]||0)*PI/180, hit:false, glow:0 }));
    // Dolls are unlimited. `tr` is the cup ladder: at or under tr[0] pays
    // three cups, at or under tr[1] pays two, over that pays one. The
    // counter shows tr[0], because that is the number worth aiming at.
    this.tr = def.tr || [1, Math.max(1, (def.sh || 3) - 1)];
    this.par = this.tr[0];
    this.used = 0;
    this.dolls = [];
    this.buttons = {};
    this.time = 0;
    this.done = false;
    this.build();
  }

  add(o){ const b = new Body(o); this.world.add(b); return b; }

  build(){
    const L = this, W = this.world, T = THEMES[this.theme];
    const wallMat = T.plank;
    const walls = this.def.walls === undefined ? 'lrtb' : this.def.walls;
    const th = 22;
    if(walls.includes('b')) this.add({x:DW/2, y:DH-th/2, w:DW, h:th, fixed:true, mat:wallMat, tag:'wall'});
    if(walls.includes('t')) this.add({x:DW/2, y:th/2,     w:DW, h:th, fixed:true, mat:wallMat, tag:'wall'});
    if(walls.includes('l')) this.add({x:th/2, y:DH/2,     w:th, h:DH, fixed:true, mat:wallMat, tag:'wall'});
    if(walls.includes('r')) this.add({x:DW-th/2, y:DH/2,  w:th, h:DH, fixed:true, mat:wallMat, tag:'wall'});

    for(const op of (this.def.o||[])){
      const k = op[0];
      const A = (i)=> op[i]===undefined ? 0 : op[i];
      switch(k){
        /* --- static structure --- */
        case 'w': case 's': case 'm': case 'i': case 'rub': case 'mo': {
          const mat = k==='w' ? T.plank : k==='s' ? 'stone' : k==='m' ? 'metal'
                    : k==='i' ? 'ice' : k==='mo' ? 'moss' : 'rubber';
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,fixed:true,mat});
          b.render = k==='rub' ? 'rubber' : 'plank';
          break;
        }
        /* --- loose blocks --- */
        case 'b': case 'B': case 'M': {
          const mat = k==='b' ? 'wood' : k==='B' ? 'stone' : 'metal';
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,mat});
          b.render='crate';
          break;
        }
        case 'g': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,mat:'glass',fixed:true});
          b.render='glass'; b.breakable = op[6]||110;
          break;
        }
        case 'spring': {
          const px = op[1], py = op[2], pw = op[3]||96, travel = op[4]||70;
          const k = op[5] || 150;
          const base = this.add({x:px, y:py+travel+18, w:pw*0.78, h:30, fixed:true, mat:'metal'});
          base.render='crate'; base.mat='wood';
          const plate = this.add({x:px, y:py, w:pw, h:22, mat:'wood', density:0.0016,
                                  friction:0.7, rest:0.05});
          plate.render='pine';
          this.ents.push({ type:'spring', base, plate, x0:px, y0:py, travel, k });
          break;
        }
        case 'C': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,
                              mat:op[6]||'wood',fixed:true});
          b.render='crate';
          break;
        }
        case 'bd': case 'BD': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4]||16,a:A(5)*D2R,
                              mat:'wood', fixed:k==='bd'});
          b.render='board';
          break;
        }
        case 'ib': {
          const b = this.add({x:op[1],y:op[2],w:op[3]||54,h:op[4]||54,a:A(5)*D2R,mat:'ice',
                              friction:0.06, rest:0.10});
          b.render='iceblock'; b.breakable = op[6]||150;
          break;
        }
        case 'p': {                       // a pine box, the almanac rooms use these
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,mat:'wood'});
          b.render='pine';
          break;
        }
        case 'P': {                       // and a fixed one
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,mat:'wood',fixed:true});
          b.render='pine';
          break;
        }
        case 'ball': {
          const b = this.add({shape:'circle',x:op[1],y:op[2],r:op[3],mat:op[4]||'stone'});
          b.render='ball';
          break;
        }
        case 'ms': case 'MS': {
          const b = this.add({x:op[1],y:op[2],w:op[3]||64,h:op[4]||64,a:A(5)*D2R,
                              mat:'stone', fixed:k==='MS'});
          b.render='mossrock';
          break;
        }
        case 'lava': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,fixed:true,mat:'stone'});
          b.render='magma';
          break;
        }
        case 'bump': {
          const b = this.add({shape:'circle',x:op[1],y:op[2],r:op[3],mat:'rubber',fixed:true});
          b.render='bumper';
          break;
        }
        /* --- hazards and reactive things --- */
        case 'tnt': {
          const b = this.add({x:op[1],y:op[2],w:op[3]||30,h:op[4]||30,mat:'tnt'});
          b.render='tnt'; b.tnt = { power: op[5]||210, fuse:-1 };
          this.ents.push({ type:'tnt', b });
          break;
        }
        case 'spike': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,fixed:true,mat:'metal'});
          b.render='spike'; b.deadly = true;
          break;
        }
        /* a brass wheel with riveted arms, the thing that flings you */
        case 'rotor': case 'blade': {
          const hubR = op[3] || 26, armL = op[4] || 120;
          const n = k==='blade' ? 1 : (op[5] || 2);
          const spd = op[6] !== undefined ? op[6] : (k==='blade' ? 3.4 : 2.2);
          const hub = this.add({shape:'circle', x:op[1], y:op[2], r:hubR, fixed:true, mat:'brass'});
          hub.render = 'rotorhub'; hub.spin = spd;
          const arms = [];
          for(let i=0;i<n;i++){
            const a0 = i * TAU / n;
            const th = k==='blade' ? 16 : 12;
            const b = this.add({x:op[1], y:op[2], w:armL, h:th, fixed:true, mat:'brass'});
            b.render = k==='blade' ? 'blade' : 'arm';
            b.kinematic = true;
            b.armPhase = a0; b.armLen = armL; b.hubR = hubR;
            if(k==='blade') b.deadly = true;
            arms.push(b);
          }
          this.ents.push({ type:'rotor', hub, arms, cx:op[1], cy:op[2], spd, a:0 });
          break;
        }
        /* a ship's wheel: brass ring, spokes, and ball tipped handles.
           If the last argument is set, a mark rides one of the handles. */
        case 'wheel': {
          const R = op[3] || 88, hl = op[4] || 34, nH = op[5] || 12;
          const spd = op[6] !== undefined ? op[6] : 1.1;
          const segs = [], handles = [];
          const NS = 10, segLen = 2 * R * Math.sin(PI/NS) + 4;
          for(let i=0;i<NS;i++){
            const b = this.add({x:op[1], y:op[2], w:segLen, h:11, fixed:true, mat:'brass'});
            b.render='wheelseg'; b.kinematic=true; b.phase = i*TAU/NS; b.orbitR = R;
            segs.push(b);
          }
          for(let i=0;i<nH;i++){
            const b = this.add({x:op[1], y:op[2], w:hl+16, h:9, fixed:true, mat:'brass'});
            b.render='handle'; b.kinematic=true; b.phase = i*TAU/nH; b.orbitR = R + (hl+16)*0.5 - 4;
            handles.push(b);
          }
          const e = { type:'wheel', cx:op[1], cy:op[2], R, hl, segs, handles, spd, a:0 };
          this.ents.push(e);
          if(op[7]){
            this.targets.push({ x:op[1], y:op[2]+R+hl*0.5, r:Math.round((op[7]===true?22:op[7])*TSCALE),
                                hit:false, glow:0, oe:e, orad:R + hl*0.55, ophase:PI/2 });
          }
          break;
        }
        /* a standing column of the same blue fire */
        case 'beam': {
          const b = this.add({x:op[1],y:op[2],w:op[3]||26,h:op[4]||160,a:A(5)*D2R,fixed:true,mat:'metal'});
          b.render='beam'; b.deadly = true;
          this.ents.push({ type:'beam', b, t:0 });
          break;
        }
        case 'saw': {
          const b = this.add({shape:'circle',x:op[1],y:op[2],r:op[3]||22,fixed:true,mat:'metal'});
          b.render='saw'; b.deadly = true; b.spin = op[4]||6;
          const e = { type:'saw', b, t:0, path:op[5]||null, cx:op[1], cy:op[2] };
          this.ents.push(e);
          break;
        }
        case 'water': {
          const e = { type:'water', x:op[1], y:op[2], w:op[3], h:op[4], t:0 };
          this.ents.push(e);
          W.fields.push((dt,bodies)=>{
            const top = e.y - e.h/2, bot = e.y + e.h/2, l = e.x-e.w/2, r = e.x+e.w/2;
            for(const b of bodies){
              if(b.fixed) continue;
              if(b.x < l-30 || b.x > r+30 || b.maxy < top || b.miny > bot) continue;
              const sz = b.shape==='circle' ? b.r*2 : Math.max(b.hw,b.hh)*2;
              const sub = clamp((Math.min(b.maxy,bot) - Math.max(b.miny,top)) / Math.max(1,(b.maxy-b.miny)), 0, 1);
              if(sub <= 0) continue;
              b.wake();
              const ratio = 0.0018 / Math.max(0.00002, b.density);
              b.vy -= ratio * sub * 1580 * dt;
              const dmp = 1/(1+dt*(2.4*sub));
              b.vx *= dmp; b.vy *= dmp; b.av *= 1/(1+dt*4*sub);
              if(!b.wet && sub>0.15 && Math.hypot(b.vx,b.vy)>210){
                b.wet = true;
                FX.burst(b.x, top, 9, {col:'#9fd8f0',type:'drop',dir:-PI/2,spread:0.85,spMin:80,spMax:280,sizeMin:1.5,sizeMax:3.4,lifeMax:0.7});
                Audio.splash();
              }
              if(sub < 0.05) b.wet = false;
            }
          });
          break;
        }
        case 'grav': {
          const dir = A(5)*D2R, str = op[6]!==undefined ? op[6] : 1580;
          const e = { type:'grav', x:op[1], y:op[2], w:op[3], h:op[4], dir, str, t:0 };
          this.ents.push(e);
          W.fields.push((dt,bodies)=>{
            const l=e.x-e.w/2, r=e.x+e.w/2, tp=e.y-e.h/2, bt=e.y+e.h/2;
            // replace the world's pull with this one while inside
            const gx2 = Math.cos(e.dir)*e.str, gy2 = Math.sin(e.dir)*e.str;
            for(const b of bodies){
              if(b.fixed) continue;
              if(b.maxx<l||b.minx>r||b.maxy<tp||b.miny>bt) continue;
              b.wake();
              b.vx += (gx2 - W.gx*b.gscale) * dt;
              b.vy += (gy2 - W.gy*b.gscale) * dt;
            }
          });
          break;
        }
        case 'fan': {
          const dir = A(5)*D2R, str = op[6]||1500;
          const e = { type:'fan', x:op[1], y:op[2], w:op[3], h:op[4], dir, str, t:0 };
          this.ents.push(e);
          W.fields.push((dt,bodies)=>{
            const l=e.x-e.w/2, r=e.x+e.w/2, tp=e.y-e.h/2, bt=e.y+e.h/2;
            const fx=Math.cos(e.dir)*e.str, fy=Math.sin(e.dir)*e.str;
            for(const b of bodies){
              if(b.fixed) continue;
              if(b.maxx<l||b.minx>r||b.maxy<tp||b.miny>bt) continue;
              b.wake();
              const scale = clamp(0.9/Math.max(0.2,b.m), 0.15, 3.4);
              b.vx += fx*scale*dt; b.vy += fy*scale*dt;
            }
          });
          break;
        }
        case 'portal': {
          const e = { type:'portal', ax:op[1], ay:op[2], bx:op[3], by:op[4],
                      aa:A(5)*D2R, ba:A(6)*D2R, r:op[7]||26, t:0, cool:new Map() };
          this.ents.push(e);
          break;
        }
        case 'btn': {
          const id = op[3]||1, bw = op[4]||46;
          const base = this.add({x:op[1],y:op[2]+6,w:bw,h:10,fixed:true,mat:'metal',a:A(5)*D2R});
          base.render='btnbase';
          this.ents.push({ type:'btn', id, base, x:op[1], y:op[2], w:bw, on:false, press:0 });
          this.buttons[id] = false;
          break;
        }
        case 'door': {
          const id = op[5]||1;
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(6)*D2R,fixed:true,mat:'metal'});
          b.render='door';
          this.ents.push({ type:'door', id, b, x0:op[1], y0:op[2],
                           dx:op[7]!==undefined?op[7]:0, dy:op[8]!==undefined?op[8]:-(op[4]+4), p:0 });
          break;
        }
        /* --- jointed contraptions --- */
        case 'see': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4]||14,a:A(5)*D2R,mat:'wood'});
          b.render='plank'; b.angDamp = 0.5;
          const anchor = this.add({x:op[1],y:op[2],w:6,h:6,fixed:true,mat:'metal'});
          anchor.render='pivot';
          W.addJoint(new Joint(anchor,b,op[1],op[2],{}));
          break;
        }
        case 'pend': {
          const b = this.add({x:op[1],y:op[2]+ (op[4]||70)/2, w:op[3]||14, h:op[4]||70, mat:'wood'});
          b.render='plank'; b.angDamp = 0.25;
          const anchor = this.add({x:op[1],y:op[2],w:6,h:6,fixed:true,mat:'metal'});
          anchor.render='pivot';
          W.addJoint(new Joint(anchor,b,op[1],op[2],{}));
          break;
        }
        case 'rope': {
          const n = op[3]||6, seg = op[4]||16, wdt = 5;
          const grp = ++GROUP;              // one group per rope, so it cannot
          let prev = this.add({x:op[1],y:op[2],w:8,h:8,fixed:true,mat:'metal'});
          prev.render='pivot';
          let py = op[2];
          const links = [];
          for(let i=0;i<n;i++){
            const b = this.add({x:op[1], y:py+seg/2, w:wdt, h:seg, mat:'wood',
                                density:0.0035, group:grp, angDamp:0.5, linDamp:0.25});
            b.render='link';
            W.addJoint(new Joint(prev,b,op[1],py,{}));
            links.push(b);
            prev = b; py += seg;
          }
          if(op[5]){  // a weight on the end
            const wb = this.add({shape:'circle',x:op[1],y:py+op[5],r:op[5],mat:op[6]||'stone',
                                 group:grp});
            wb.render='ball';
            W.addJoint(new Joint(prev,wb,op[1],py,{}));
          }
          this.ents.push({ type:'rope', links });
          break;
        }
        case 'mov': {
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],fixed:true,mat:'metal'});
          b.render='mover'; b.kinematic = true;
          this.ents.push({ type:'mov', b, x0:op[1], y0:op[2],
                           dx:op[5]||0, dy:op[6]||0, per:op[7]||3, ph:op[8]||0, t:0 });
          break;
        }
        case 'balloon': {
          const b = this.add({shape:'circle',x:op[1],y:op[2],r:op[3]||18,mat:'balloon',
                              gscale:-0.42, linDamp:1.5, rest:0.3});
          b.render='balloon'; b.pop = true;
          const bent = { type:'balloon', b, t:0, tether: op[4], ax0:op[1], ay0:op[2]+(op[4]||0) };
          this.ents.push(bent);
          if(op[4]){ // tethered to a point below
            const anchor = this.add({x:op[1],y:op[2]+op[4],w:8,h:8,fixed:true,mat:'metal'});
            anchor.render='pivot';
            W.addJoint(new DistJoint(anchor,b,anchor.x,anchor.y,b.x,b.y,{len:op[4],rope:true}));
          }
          break;
        }
        case 'goo': {   // sticky pad, kills all bounce and most speed
          const b = this.add({x:op[1],y:op[2],w:op[3],h:op[4],a:A(5)*D2R,fixed:true,mat:'rubber',
                              friction:2.2, rest:0});
          b.render='goo'; b.sticky = true;
          break;
        }
      }
    }
    /* the cannon */
    this.cannon = {
      x: this.def.c[0], y: this.def.c[1],
      a: (this.def.c[2]||0)*D2R,
      lo: (this.def.c[3]!==undefined?this.def.c[3]:-178)*D2R,
      hi: (this.def.c[4]!==undefined?this.def.c[4]: 178)*D2R,
      recoil:0, charge:0
    };
    // the bracket the cannon is bolted to is solid, so shots cannot pass behind it
    // the bracket sits behind the barrel, so a cannon hung from the ceiling
    // does not fire straight into its own mounting
    const ca0 = this.cannon.a;
    const mountY = Math.sin(ca0) > 0.45 ? this.cannon.y - 30 : this.cannon.y + 30;
    const rolling = !!this.def.cm;                 // 'w' wheels, 'i' ice
    const mount = this.add({
      x:this.cannon.x, y:mountY, w:46, h:58,
      fixed: !rolling, mat:'metal',
      density: rolling ? 0.0026 : undefined,
      friction: rolling ? (this.def.cm === 'i' ? 0.02 : 0.16) : undefined,
      rest: rolling ? 0.02 : undefined,
      angDamp: rolling ? 6 : undefined,
      linDamp: rolling ? 0.5 : undefined
    });
    mount.render = rolling ? 'carriage' : 'plank';
    this.cannon.mount = mount;
    this.cannon.rolls = rolling;
    this.cannon.dy = this.cannon.y - mountY;
    // settle the furniture with impacts muted, so nothing detonates or
    // shatters just from being placed a few pixels above its shelf
    for(let i=0;i<50;i++) this.world.step(1/120);
    for(const b of this.world.bodies){ if(!b.fixed){ b.vx=b.vy=b.av=0; } }
    this.world.onContact = (A,B,sev,x,y,nx,ny,speed)=>this.onImpact(A,B,sev,x,y,nx,ny,speed);
  }

  onImpact(A,B,sev,x,y,nx,ny,speed){
    // sev is an impulse estimate (closing speed x reduced mass); speed is px/s.
    const dollPart = A.doll ? A : (B.doll ? B : null);
    const other    = A.doll ? B : (B.doll ? A : null);
    if(dollPart){
      const d = dollPart.doll;
      if(speed > 300 && d.paint < 20){
        d.paint++;
        FX.splat(x, y, clamp(speed/95, 4, 13), 'rgba(176,44,36,0.80)');
        FX.burst(x,y,3,{col:'#b02c24',type:'drop',spMin:20,spMax:110,sizeMin:1,sizeMax:2.4,lifeMax:0.5});
      }
      if(speed > 130)
        Audio.thud(clamp(speed/1100, 0.05, 0.55), other && other.mat ? other.mat : 'cloth');
      // the dolls squeak, which the reviews found creepy and so should you
      if(speed > 210 && Math.random() < 0.5) Audio.squeak(speed/2600);
    } else if(speed > 210){
      Audio.thud(clamp(speed/1600, 0.04, 0.5), A.fixed ? B.mat : A.mat);
      if(sev > 120)
        FX.burst(x,y,3,{col:'#c9b48c',type:'chip',sizeMin:1,sizeMax:2.4,spMax:120,lifeMax:0.5});
    }
    for(const b of [A,B]){
      if(b.breakable && speed > 190 && sev > b.breakable && !b.dead){
        const hitter = b === A ? B : A;
        const dir = b === A ? -1 : 1;     // normal runs A to B
        this.shatter(b, hitter, nx*dir, ny*dir, speed);
      }
      if(b.tnt && speed > 280 && sev > 45 && b.tnt.fuse < 0) b.tnt.fuse = 0.28;
      if(b.pop && speed > 150 && !b.dead) this.popBalloon(b);
    }
    if(dollPart && other && other.deadly) this.killDoll(dollPart.doll, x, y);
  }

  shatter(b, hitter, nx, ny, speed){
    if(b.mat === 'glass') Awards.bump('panes');
    FX.burst(b.x,b.y,16,{col:'#cfeeff',type:'shard',sizeMin:2,sizeMax:5,spMax:280,lifeMax:0.9});
    Audio.shatter(0.6);
    this.world.remove(b);
    // the pane took the blow, so hand most of that momentum back and let
    // whatever broke it carry on through the hole
    if(hitter && speed){
      const keep = 0.62 * speed;
      const group = hitter.doll ? hitter.doll.list : [hitter];
      for(const p of group){
        if(p.fixed) continue;
        p.vx += nx * keep; p.vy += ny * keep;
        p.wake();
      }
    }
  }
  popBalloon(b){
    FX.burst(b.x,b.y,12,{col:'#ff8fb0',type:'chip',sizeMin:1.6,sizeMax:3.4,spMax:220,lifeMax:0.6});
    Audio.thud(0.3,'glass');
    this.world.remove(b);
  }
  killDoll(d, x, y){
    if(!d || d.gone) return;
    FX.splat(x||d.x, y||d.y, 13, 'rgba(176,44,36,0.85)');
    FX.burst(x||d.x, y||d.y, 16, {col:'#b02c24',type:'drop',spMax:300,sizeMin:1.5,sizeMax:3.6,lifeMax:0.8});
    Audio.thud(0.6,'cloth');
    d.destroy();
    const i = this.dolls.indexOf(d); if(i>=0) this.dolls.splice(i,1);
  }
  explode(b){
    const px = b.x, py = b.y, power = b.tnt.power;
    this.world.remove(b);
    FX.kick(15);
    FX.flash = 0.9; FX.flashCol = '255,190,90';
    FX.burst(px,py,34,{col:'#ffb347',spMax:520,sizeMin:2,sizeMax:6,lifeMax:0.7,g:0.5});
    FX.burst(px,py,18,{col:'#ff6a2a',spMax:300,sizeMin:3,sizeMax:9,lifeMax:0.5,g:0.2});
    FX.smoke(px,py,16,-PI/2,1.8);
    FX.add({x:px,y:py,vx:0,vy:0,life:0,max:0.5,size:26,col:'#ffd08a',type:'ring',rot:0,rv:0,g:0,drag:0});
    Audio.boom();
    Audio.duck(0.75, 0.9);
    Awards.bump('kegs');
    const R = 175;
    for(const o of this.world.bodies.slice()){
      if(o.fixed) continue;
      const dx=o.x-px, dy=o.y-py;
      const d=Math.hypot(dx,dy);
      if(d > R) continue;
      const f = (1 - d/R);
      const n = d>1 ? 1/d : 0;
      o.wake();
      o.vx += dx*n*power*f*3.2;
      o.vy += dy*n*power*f*3.2 - power*f*0.5;
      o.av += (Math.random()-0.5)*f*16;
      if(o.breakable && f > 0.25) this.shatter(o, null, 0, 0, 0);
      if(o.pop) this.popBalloon(o);
      if(o.tnt && o.tnt.fuse < 0 && f > 0.2) o.tnt.fuse = 0.12 + Math.random()*0.12;
    }
  }
}

/* ------------------------------------------------ 8b. level runtime */
/* Driven parts move here, and this runs once per physics SUBSTEP.

   Doing it once per frame instead was the cause of the moving-object
   glitching: the part was teleported its whole frame's travel in a single
   jump before the first substep, so anything resting on it went from
   touching to deeply overlapped with no step in between and got flung clear
   -- while the velocity handed to the solver described a full frame of
   travel that the following substeps never actually performed, pumping
   energy into every contact the part held. Moving in step with the solver
   costs a few more assignments a frame and makes both problems go away. */
Level.prototype.stepDrive = function(dt){
  for(const e of this.ents){
    if(e.frozen) continue;
    switch(e.type){
      case 'mov': {
        e.t += dt;
        const ph = (e.t/e.per + e.ph) * TAU;
        const s = (1 - Math.cos(ph))*0.5;
        const nx = e.x0 + e.dx*s, ny = e.y0 + e.dy*s;
        e.b.vx = (nx - e.b.x)/dt; e.b.vy = (ny - e.b.y)/dt;
        e.b.x = nx; e.b.y = ny; e.b.sync();
        this.wakeNear(e.b, 14);
        break;
      }
      case 'rotor': {
        e.a += e.spd * dt;
        e.hub.a = e.a; e.hub.av = e.spd; e.hub.sync();
        for(const b of e.arms){
          const ang = e.a + b.armPhase;
          const rad = b.hubR * 0.55 + b.armLen * 0.5;
          const nx = e.cx + Math.cos(ang)*rad, ny = e.cy + Math.sin(ang)*rad;
          b.vx = -e.spd * (ny - e.cy);
          b.vy =  e.spd * (nx - e.cx);
          b.av =  e.spd;
          b.x = nx; b.y = ny; b.a = ang;
          b.sync();
          this.wakeNear(b, 14);
        }
        break;
      }
      case 'wheel': {
        e.a += e.spd * dt;
        const place = (b, tangent)=>{
          const ang = e.a + b.phase;
          const nx = e.cx + Math.cos(ang)*b.orbitR, ny = e.cy + Math.sin(ang)*b.orbitR;
          b.vx = -e.spd*(ny - e.cy); b.vy = e.spd*(nx - e.cx); b.av = e.spd;
          b.x = nx; b.y = ny; b.a = ang + (tangent ? PI/2 : 0);
          b.sync();
          this.wakeNear(b, 12);
        };
        for(const b of e.segs) place(b, true);
        for(const b of e.handles) place(b, false);
        break;
      }
      case 'spring': {
        const p = e.plate;
        p.wake();
        const comp = p.y - e.y0;                 // positive when pushed down
        p.vy -= (e.k * comp + 5.0 * p.vy) * dt;  // stiff, lightly damped
        // a piston: it travels on one axis, never tips, and stops at its ends
        p.x = e.x0; p.vx = 0; p.a = 0; p.av = 0;
        if(p.y > e.y0 + e.travel){ p.y = e.y0 + e.travel; if(p.vy > 0) p.vy = 0; }
        if(p.y < e.y0 - e.travel*1.6){ p.y = e.y0 - e.travel*1.6; if(p.vy < 0) p.vy = 0; }
        p.sync();
        this.wakeNear(p, 10);
        break;
      }
      case 'saw': {
        e.t += dt;
        e.b.av = e.b.spin;
        e.b.a += e.b.spin*dt;
        if(e.path){
          const s = (1-Math.cos((e.t/e.path[2])*TAU))*0.5;
          const nx = e.cx + e.path[0]*s, ny = e.cy + e.path[1]*s;
          e.b.vx = (nx-e.b.x)/dt; e.b.vy = (ny-e.b.y)/dt;
          e.b.x = nx; e.b.y = ny;
        }
        e.b.sync();
        this.wakeNear(e.b, 12);
        break;
      }
      case 'door': {
        const want = this.buttons[e.id] ? 1 : 0;
        const sp = dt*2.2;
        e.p += clamp(want - e.p, -sp, sp);
        const nx = e.x0 + e.dx*e.p, ny = e.y0 + e.dy*e.p;
        e.b.vx = (nx-e.b.x)/dt; e.b.vy = (ny-e.b.y)/dt;
        e.b.x = nx; e.b.y = ny; e.b.sync();
        if(Math.abs(e.b.vx)+Math.abs(e.b.vy) > 1) this.wakeNear(e.b, 14);
        break;
      }
    }
  }
};

Level.prototype.update = function(dt){
  this.time += dt;
  const W = this.world;

  /* --- scripted logic, sound and effects, once per frame --- */
  for(const e of this.ents){
    if(e.frozen) continue;
    switch(e.type){
      case 'rotor': {
        // the angle advanced across the substeps; clank once each half turn
        if(e.aPrev === undefined) e.aPrev = e.a;
        if(Math.floor(e.aPrev/PI) !== Math.floor(e.a/PI)) Audio.gear(Math.abs(e.spd));
        e.aPrev = e.a;
        if(e.arms.length && e.arms[0].deadly && Math.random() < dt*3.5) Audio.hum();
        break;
      }
      case 'wheel': {
        if(e.aPrev === undefined) e.aPrev = e.a;
        if(Math.floor(e.aPrev/(PI/3)) !== Math.floor(e.a/(PI/3))) Audio.gear(Math.abs(e.spd)*2.2);
        e.aPrev = e.a;
        break;
      }
      case 'beam': { e.t += dt; break; }
      case 'btn': {
        let on = false;
        const l = e.x - e.w/2, r = e.x + e.w/2, top = e.y - 16, bot = e.y + 8;
        for(const b of W.bodies){
          if(b.fixed || b.dead) continue;
          if(b.maxx < l || b.minx > r || b.maxy < top || b.miny > bot) continue;
          if(b.m > 0.22 || b.doll){ on = true; break; }
        }
        if(on !== e.on){
          e.on = on;
          Audio.click();
          FX.burst(e.x, e.y-4, 6, {col:'#ffd98a',spMax:90,sizeMax:2.2,lifeMax:0.4});
        }
        e.press += clamp((on?1:0) - e.press, -dt*9, dt*9);
        this.buttons[e.id] = on;
        break;
      }
      case 'tnt': {
        if(e.b.dead) break;
        if(e.b.tnt.fuse >= 0){
          e.b.tnt.fuse -= dt;
          if(Math.random() < dt*40) FX.burst(e.b.x, e.b.y - e.b.hh, 1,
            {col:'#ffd070',spMax:70,sizeMax:2.4,lifeMax:0.35,g:-0.4});
          if(e.b.tnt.fuse <= 0) this.explode(e.b);
        }
        break;
      }
      case 'portal': {
        e.t += dt;
        for(const [k,v] of e.cool){ if(this.time - v > 0.45) e.cool.delete(k); }
        for(const b of W.bodies){
          if(b.fixed || b.dead) continue;
          if(e.cool.has(b.id)) continue;
          let from = null, to = null, toa = 0;
          if(dist2(b.x,b.y,e.ax,e.ay) < e.r*e.r*0.55){ from='a'; to={x:e.bx,y:e.by}; toa = e.ba - e.aa; }
          else if(dist2(b.x,b.y,e.bx,e.by) < e.r*e.r*0.55){ from='b'; to={x:e.ax,y:e.ay}; toa = e.aa - e.ba; }
          if(!from) continue;
          const grp = b.doll ? b.doll.list : [b];
          const ox = to.x - b.x, oy = to.y - b.y;
          const cs = Math.cos(toa), sn = Math.sin(toa);
          for(const p of grp){
            if(e.cool.has(p.id) && p !== b) continue;
            const rx = p.x - b.x, ry = p.y - b.y;
            p.x = to.x + rx*cs - ry*sn;
            p.y = to.y + rx*sn + ry*cs;
            p.a += toa;
            const vx = p.vx, vy = p.vy;
            p.vx = vx*cs - vy*sn; p.vy = vx*sn + vy*cs;
            p.sync(); p.wake();
            e.cool.set(p.id, this.time);
          }
          FX.burst(to.x,to.y,14,{col:'#a48cff',spMax:200,sizeMax:3.4,lifeMax:0.55,g:0});
          FX.burst(from==='a'?e.ax:e.bx, from==='a'?e.ay:e.by, 10,
                   {col:'#7de0ff',spMax:170,sizeMax:3,lifeMax:0.5,g:0});
          Audio.portal();
          break;
        }
        break;
      }
    }
  }

  /* --- physics, sub stepped so fast dolls cannot tunnel through planks --- */
  const SUB = PERF.sub, sdt = dt/SUB;
  W.iter = PERF.iter;
  for(let i=0;i<SUB;i++){ this.stepDrive(sdt); W.step(sdt); }

  /* the boiler is always working */
  this.stackT = (this.stackT || 0) + dt;
  if(this.stackT > 0.13){
    this.stackT = 0;
    const c = this.cannon;
    const fl = Math.cos(c.a) < 0 ? -1 : 1;
    const sx = c.x - 6*Math.cos(c.a) + fl*16*Math.sin(c.a);
    const sy = c.y - 6*Math.sin(c.a) - fl*16*Math.cos(c.a);
    FX.add({ x:sx+rnd(-1.5,1.5), y:sy-14, vx:rnd(-6,6), vy:-rnd(22,42),
             life:0, max:rnd(0.9,1.6), size:rnd(2,3.6), col:'#f6f2e8',
             type:'smoke', rot:0, rv:0, g:-0.06, drag:1.0 });
  }

  /* a rolling carriage carries the barrel with it, and stays upright */
  const cn = this.cannon;
  if(cn.rolls && cn.mount && !this.collapsed){
    const m = cn.mount;
    m.a = 0; m.av = 0; m.sync();
    cn.x = m.x; cn.y = m.y + cn.dy;
  }

  this.collapseStep(dt);

  /* --- post step bookkeeping --- */
  for(let i=this.dolls.length-1;i>=0;i--){
    const d = this.dolls[i];
    if(d.gone){ this.dolls.splice(i,1); continue; }
    d.age += dt;
    let out = true;
    for(const b of d.list){
      if(b.x > -260 && b.x < DW+260 && b.y < DH+320 && b.y > -700){ out = false; break; }
    }
    if(out && !this.collapsed){ d.destroy(); this.dolls.splice(i,1); continue; }
    if(out) continue;
    const tp = d.parts.torso;
    const spd2 = Math.hypot(tp.vx, tp.vy);
    if(spd2 > 620 && Math.random() < dt*34){
      FX.add({ x:tp.x + rnd(-5,5), y:tp.y + rnd(-5,5), vx:tp.vx*0.05, vy:tp.vy*0.05,
               life:0, max:0.26, size:rnd(2.4,4.6), col:'#efe6d2', type:'smoke',
               rot:0, rv:0, g:0, drag:3.2 });
    }
    // a doll that comes to rest stops mattering
    if(d.asleep()) d.settled += dt; else d.settled = 0;
  }

  /* Dolls are unlimited, so the pile is not. Once it gets deep, the oldest
     one that has been asleep a while is swept away in a puff, which keeps
     the solver honest without ever refusing the player another shot. */
  while(this.dolls.length > DOLL_CAP && !this.collapsed){
    // Dolls are stored in the order they were fired, so the first that
    // qualifies is the oldest. One at rest goes first; if the pile is deep
    // enough that nothing ever settles, age alone is reason enough. The two
    // most recent are always spared so a shot never vanishes under the player.
    const hard = this.dolls.length > DOLL_CAP + 3;
    let old = -1;
    for(let i=0;i<this.dolls.length-2;i++){
      const d = this.dolls[i];
      if(d.settled > 1.4 || (hard && d.age > 2.5)){ old = i; break; }
    }
    if(old < 0) break;
    const d = this.dolls[old], tp = d.parts.torso;
    FX.burst(tp.x, tp.y, 12, {col:'#e8dcc2', spread:PI, spMin:20, spMax:110,
                              sizeMax:5, lifeMax:0.7});
    d.destroy(); this.dolls.splice(old,1);
  }

  /* --- marks that ride a wheel move with it --- */
  for(const t of this.targets){
    if(t.oe){
      t.x = t.oe.cx + Math.cos(t.oe.a + t.ophase) * t.orad;
      t.y = t.oe.cy + Math.sin(t.oe.a + t.ophase) * t.orad;
    }
  }

  /* --- target checks --- */
  for(const t of this.targets){
    if(t.hit){ t.glow = Math.min(1, t.glow + dt*3); continue; }
    for(const d of this.dolls){
      let hit = false;
      for(const b of d.list){
        const rad = b.shape==='circle' ? b.r : Math.min(b.hw,b.hh);
        if(dist2(b.x,b.y,t.x,t.y) < (t.r*0.92 + rad)*(t.r*0.92 + rad)){ hit = true; break; }
      }
      if(hit){
        t.hit = true;
        FX.splat(t.x + rnd(-6,6), t.y + rnd(-6,6), t.r*0.42, 'rgba(176,44,36,0.75)');
        FX.burst(t.x,t.y,26,{col:'#ffe9a8',spMax:340,sizeMin:2,sizeMax:5,lifeMax:0.9});
        FX.add({x:t.x,y:t.y,vx:0,vy:0,life:0,max:0.6,size:t.r,col:'#fff0c0',type:'ring',rot:0,rv:0,g:0,drag:0});
        FX.kick(7);
        Audio.ding(this.targets.filter(q=>q.hit).length-1);
        break;
      }
    }
  }
  /* dolls destroyed by hazards handled in onImpact; deadly overlap for sleeping parts */
  for(const d of this.dolls.slice()){
    for(const b of d.list){
      if(b.y > DH + 200){ this.killDoll(d, b.x, DH); break; }
    }
  }
  this.done = this.targets.length > 0 && this.targets.every(t=>t.hit);
  return this.done;
};

Level.prototype.wakeNear = function(b, pad){
  for(const o of this.world.bodies){
    if(o.fixed || o.awake) continue;
    if(o.maxx < b.minx-pad || o.minx > b.maxx+pad || o.maxy < b.miny-pad || o.miny > b.maxy+pad) continue;
    o.wake();
  }
};

Level.prototype.fire = function(ang, power){
  const c = this.cannon;
  const speed = 620 + power * 900;
  const mx = c.x + Math.cos(ang)*46, my = c.y + Math.sin(ang)*46;
  const d = new Doll(this.world, mx, my, ang, Math.cos(ang)*speed, Math.sin(ang)*speed);
  this.dolls.push(d);
  this.used++;
  Awards.bump('fired');
  c.recoil = 1;
  if(c.rolls && c.mount){
    const kick = (140 + power*220) * c.mount.m;
    c.mount.applyImpulse(-Math.cos(ang)*kick, -Math.sin(ang)*kick*0.25, c.mount.x, c.mount.y);
  }
  if(this.used === this.par) Audio.lastDoll();   // last one that still pays gold
  else if(this.used === this.par + 1 || this.used === this.tr[1] + 1) Audio.cupLost();
  FX.smoke(mx, my, 16, ang, 1.25);
  FX.burst(mx,my,14,{col:'#ffd08a',dir:ang,spread:0.5,spMin:120,spMax:420,sizeMax:4,lifeMax:0.45});
  FX.add({x:mx,y:my,vx:0,vy:0,life:0,max:0.34,size:9,col:'#ffe0a0',type:'ring',rot:0,rv:0,g:0,drag:0});
  FX.kick(4.5 + power*3);
  Audio.fire(power);
  return d;
};

/* "When a doll touches that target, the level will collapse signifying
   completion." Everything bolted down comes loose and goes over. */
Level.prototype.collapse = function(){
  if(this.collapsed) return;
  this.collapsed = true;
  this.collapseT = 0;
  for(const e of this.ents) e.frozen = true;
  // every joint lets go, so contraptions come apart rather than swinging
  this.world.joints.length = 0;
  this.floorBody = null;
  for(const b of this.world.bodies){
    if(b.tag === 'wall' && b.y > DH - 40){ this.floorBody = b; continue; }
    if(!b.fixed){ b.gscale = 0.6; b.canSleep = false; b.wake(); continue; }
    b.fixed = false;
    b.kinematic = false;
    b.density = MAT_DENSITY[b.mat] || 0.0012;
    b.computeMass();
    b.linDamp = 0.08; b.angDamp = 0.12;
    b.gscale = 0.6;
    b.canSleep = false;
    // a shove and a twist: everything loses its footing at once
    b.vx = rnd(-46,46);
    b.vy = rnd(-40,26);
    b.av = rnd(-2.2,2.2);
    b.wake();
  }
  for(const d of this.dolls) d.each(p=>{ p.gscale = 0.6; p.canSleep = false; });
  this.world.wakeAll();
  FX.kick(15);
  Audio.collapse();
};

/* a beat later the floor goes too and the whole room falls away */
Level.prototype.collapseStep = function(dt){
  if(!this.collapsed) return;
  this.collapseT += dt;
  if(this.floorBody && this.collapseT > 0.95){
    const f = this.floorBody;
    this.floorBody = null;
    f.fixed = false; f.canSleep = false;
    f.density = MAT_DENSITY[f.mat] || 0.0012;
    f.computeMass();
    f.gscale = 0.75; f.linDamp = 0.05; f.angDamp = 0.08;
    f.av = rnd(-0.5,0.5);
    f.wake();
    for(const b of this.world.bodies){ b.gscale = 0.85; b.wake(); }
    FX.kick(9);
    Audio.thud(0.5,'wood');
  }
  // dust rising off the wreck while it goes
  if(this.collapseT < 2.2 && Math.random() < dt*26){
    FX.add({ x:rnd(0,DW), y:rnd(DH*0.55,DH), vx:rnd(-30,30), vy:-rnd(10,60),
             life:0, max:rnd(0.8,1.8), size:rnd(6,16), col:'#a8977c',
             type:'smoke', rot:0, rv:0, g:-0.04, drag:1.4 });
  }
};

Level.prototype.canFire = function(){ return !this.done; };
Level.prototype.busy = function(){
  for(const d of this.dolls) if(!d.asleep() && d.age < 6) return true;
  return false;
};
Level.prototype.cups = function(used){
  const tr = this.tr;
  if(used <= tr[0]) return 3;   // par or better
  if(used <= tr[1]) return 2;
  return 1;                     // over par still clears the room
};

/* ------------------------------------------------ 8c. level drawing */
function blit(g, c, x, y, a, w, h){
  g.save(); g.translate(x,y); if(a) g.rotate(a);
  g.drawImage(c, -w/2 - c.padx, -h/2 - c.pady);
  g.restore();
}

function drawBody(g, b, t){
  const kind = b.render || (b.shape==='circle' ? 'ball' : (b.fixed ? 'plank' : 'crate'));
  const w = b.hw*2, h = b.hh*2;
  switch(kind){
    case 'plank': case 'door': case 'mover': {
      const mat = kind==='door' || kind==='mover' ? 'metal' : b.mat;
      if(kind==='plank' && w > 130 && h > 56) blit(g, texPanel(w,h,mat), b.x, b.y, b.a, w, h);
      else blit(g, texPlank(w,h,mat), b.x, b.y, b.a, w, h);
      if(kind==='mover'){
        g.save(); g.translate(b.x,b.y); g.rotate(b.a);
        g.fillStyle='rgba(255,220,140,0.45)';
        for(let i=-1;i<=1;i++){
          const ax = i*Math.min(20,w*0.28);
          g.beginPath(); g.moveTo(ax-4,-h*0.14); g.lineTo(ax+4,0); g.lineTo(ax-4,h*0.14); g.closePath(); g.fill();
        }
        g.restore();
      }
      break;
    }
    case 'crate': blit(g, texCrate(w,h,b.mat,b.id&3), b.x, b.y, b.a, w, h); break;
    case 'glass': blit(g, texGlass(w,h), b.x, b.y, b.a, w, h); break;
    case 'tnt':   blit(g, texTNT(w,h),   b.x, b.y, b.a, w, h); break;
    case 'ball':  blit(g, texMetalBall(b.r,b.mat), b.x, b.y, b.a, b.r*2, b.r*2); break;
    case 'rubber': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.35)'; rr(g,-b.hw+2,-b.hh+3,w,h,5); g.fill();
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#6f5b64'); gr.addColorStop(1,'#2b2126');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,5); g.fill();
      g.strokeStyle='#171114'; g.lineWidth=1.6; rr(g,-b.hw,-b.hh,w,h,5); g.stroke();
      g.strokeStyle='rgba(255,190,210,0.30)'; g.lineWidth=2;
      for(let x=-b.hw+7;x<b.hw-3;x+=11){ g.beginPath(); g.moveTo(x,-b.hh+3); g.lineTo(x,b.hh-3); g.stroke(); }
      g.restore();
      break;
    }
    case 'bumper': {
      // A bumper kicks back whatever touches it, so it should not read as a
      // stone set into the wall. Brass collar, rubber cap, and a slow breath
      // so the eye files it with the things that do something.
      const pl = 1 + 0.045*Math.sin(t*3.1 + b.x*0.02);
      g.save(); g.translate(b.x,b.y); g.scale(pl,pl);
      g.fillStyle='rgba(0,0,0,0.38)'; g.beginPath(); g.arc(2,3.5,b.r,0,TAU); g.fill();
      const col=g.createLinearGradient(0,-b.r,0,b.r);
      col.addColorStop(0,'#e2c078'); col.addColorStop(0.5,'#9c7736'); col.addColorStop(1,'#5c441c');
      g.fillStyle=col; g.beginPath(); g.arc(0,0,b.r,0,TAU); g.fill();
      g.strokeStyle='#382810'; g.lineWidth=1.6; g.beginPath(); g.arc(0,0,b.r-0.8,0,TAU); g.stroke();
      const cap=g.createRadialGradient(-b.r*0.30,-b.r*0.36,b.r*0.08,0,0,b.r*0.78);
      cap.addColorStop(0,'#ff9d84'); cap.addColorStop(0.45,'#dd4a33'); cap.addColorStop(1,'#8c1e15');
      g.fillStyle=cap; g.beginPath(); g.arc(0,0,b.r*0.78,0,TAU); g.fill();
      g.strokeStyle='rgba(58,10,6,0.75)'; g.lineWidth=1.5;
      g.beginPath(); g.arc(0,0,b.r*0.78,0,TAU); g.stroke();
      g.fillStyle='rgba(255,234,222,0.48)';
      g.beginPath(); g.ellipse(-b.r*0.26,-b.r*0.32,b.r*0.26,b.r*0.17,-0.6,0,TAU); g.fill();
      for(let i=0;i<6;i++){
        const a2 = i*TAU/6 + 0.4;
        rivet(g, Math.cos(a2)*b.r*0.89, Math.sin(a2)*b.r*0.89, 1.9, '#f2e0bc', '#382810');
      }
      g.restore();
      break;
    }
    case 'spike': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.35)'; rr(g,-b.hw+2,-b.hh+3,w,h,2); g.fill();
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#5c646f'); gr.addColorStop(1,'#2b3037');
      g.fillStyle=gr; rr(g,-b.hw,0,w,b.hh,2); g.fill();
      const n = Math.max(2, Math.round(w/13));
      const sw = w/n;
      for(let i=0;i<n;i++){
        const x = -b.hw + i*sw;
        const sg = g.createLinearGradient(x,0,x+sw,0);
        sg.addColorStop(0,'#98a3b0'); sg.addColorStop(0.45,'#e2eaf2'); sg.addColorStop(1,'#5b636e');
        g.fillStyle = sg;
        g.beginPath(); g.moveTo(x+0.6, 1); g.lineTo(x+sw*0.5, -b.hh); g.lineTo(x+sw-0.6, 1); g.closePath(); g.fill();
        g.strokeStyle='rgba(20,24,30,0.7)'; g.lineWidth=0.9; g.stroke();
      }
      g.strokeStyle='#1b1f25'; g.lineWidth=1.4; g.strokeRect(-b.hw,0,w,b.hh);
      g.restore();
      break;
    }
    case 'rotorhub': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      const R=b.r;
      g.fillStyle='rgba(0,0,0,0.40)'; g.beginPath(); g.arc(2,3.5,R,0,TAU); g.fill();
      const teeth = Math.max(9, Math.round(R/2.6));
      const gr=g.createRadialGradient(-R*0.3,-R*0.35,R*0.1,0,0,R*1.16);
      gr.addColorStop(0,'#e0a068'); gr.addColorStop(0.55,'#b0713a'); gr.addColorStop(1,'#6b3d16');
      g.fillStyle=gr;
      g.beginPath();
      for(let i=0;i<teeth;i++){
        const a1=i/teeth*TAU, a2=(i+0.45)/teeth*TAU, a3=(i+1)/teeth*TAU;
        g.lineTo(Math.cos(a1)*R,Math.sin(a1)*R);
        g.lineTo(Math.cos(a2)*R*1.16,Math.sin(a2)*R*1.16);
        g.lineTo(Math.cos(a3)*R,Math.sin(a3)*R);
      }
      g.closePath(); g.fill();
      g.strokeStyle='#4a2a0d'; g.lineWidth=1.4; g.stroke();
      // spokes cut out of the rim
      g.fillStyle='rgba(30,16,6,0.62)';
      const sp = Math.max(5, Math.round(R/5));
      for(let i=0;i<sp;i++){
        const a2=i/sp*TAU;
        g.save(); g.rotate(a2);
        g.beginPath(); g.moveTo(R*0.34,-R*0.16); g.lineTo(R*0.80,-R*0.24);
        g.lineTo(R*0.80,R*0.24); g.lineTo(R*0.34,R*0.16); g.closePath(); g.fill();
        g.restore();
      }
      g.strokeStyle='#8a5220'; g.lineWidth=2;
      g.beginPath(); g.arc(0,0,R*0.86,0,TAU); g.stroke();
      g.beginPath(); g.arc(0,0,R*0.30,0,TAU); g.stroke();
      const hg=g.createRadialGradient(-R*0.1,-R*0.12,1,0,0,R*0.28);
      hg.addColorStop(0,'#f4e6cc'); hg.addColorStop(1,'#8a6a3a');
      g.fillStyle=hg; g.beginPath(); g.arc(0,0,R*0.26,0,TAU); g.fill();
      g.strokeStyle='#4a2a0d'; g.lineWidth=1.2; g.stroke();
      g.restore();
      break;
    }
    case 'arm': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.36)'; rr(g,-b.hw+2,-b.hh+3,w,h,h*0.5); g.fill();
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#d59a5e'); gr.addColorStop(0.5,'#a86f34'); gr.addColorStop(1,'#63390f');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,h*0.5); g.fill();
      g.strokeStyle='#40230a'; g.lineWidth=1.4; rr(g,-b.hw,-b.hh,w,h,h*0.5); g.stroke();
      g.fillStyle='rgba(255,232,196,0.30)'; rr(g,-b.hw+2,-b.hh+1.2,w-4,1.8,1); g.fill();
      const n = clamp(Math.round(w/34)+1, 2, 6);
      for(let i=0;i<n;i++) rivet(g, -b.hw + 5 + (w-10)*(i/(n-1)), 0, Math.min(2.6,h*0.24), '#ffeec8','#40230a');
      g.restore();
      break;
    }
    case 'blade': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.globalCompositeOperation='lighter';
      for(let i=3;i>=1;i--){
        g.fillStyle = `rgba(70,${150+i*22},255,${0.10*i})`;
        rr(g,-b.hw-i*3,-b.hh-i*3,w+i*6,h+i*6,(h+i*6)*0.5); g.fill();
      }
      g.globalCompositeOperation='source-over';
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#dff4ff'); gr.addColorStop(0.35,'#5cc4ff');
      gr.addColorStop(0.7,'#1a7fd8'); gr.addColorStop(1,'#0d4a94');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,h*0.5); g.fill();
      g.strokeStyle='rgba(220,245,255,0.85)'; g.lineWidth=1.4; rr(g,-b.hw,-b.hh,w,h,h*0.5); g.stroke();
      g.fillStyle='rgba(255,255,255,0.72)'; rr(g,-b.hw+3,-b.hh+2,w-6,h*0.22,2); g.fill();
      g.restore();
      // mist falling off the underside
      if(Math.random() < 0.5){
        const f = rnd(-b.hw, b.hw);
        FX.add({ x:b.x + Math.cos(b.a)*f, y:b.y + Math.sin(b.a)*f,
                 vx:rnd(-25,25), vy:rnd(20,90), life:0, max:rnd(0.3,0.7),
                 size:rnd(1.4,3.2), col:'#7fd4ff', type:'spark', rot:0, rv:0, g:0.35, drag:1.2 });
      }
      break;
    }
    case 'beam': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.globalCompositeOperation='lighter';
      for(let i=3;i>=1;i--){
        g.fillStyle = `rgba(60,${140+i*24},255,${0.09*i})`;
        rr(g,-b.hw-i*4,-b.hh-i*2,w+i*8,h+i*4,6); g.fill();
      }
      g.globalCompositeOperation='source-over';
      const gr=g.createLinearGradient(-b.hw,0,b.hw,0);
      gr.addColorStop(0,'#0d4a94'); gr.addColorStop(0.3,'#3aa9f0');
      gr.addColorStop(0.5,'#e4f6ff'); gr.addColorStop(0.7,'#3aa9f0'); gr.addColorStop(1,'#0d4a94');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,5); g.fill();
      g.strokeStyle='rgba(210,242,255,0.8)'; g.lineWidth=1.4; rr(g,-b.hw,-b.hh,w,h,5); g.stroke();
      const t2 = t*2.4;
      g.globalAlpha=0.55; g.strokeStyle='#eaf9ff'; g.lineWidth=1.6;
      for(let i=0;i<3;i++){
        const yy = -b.hh + ((t2*70 + i*h/3) % h);
        g.beginPath(); g.moveTo(-b.hw+2, yy); g.lineTo(b.hw-2, yy+3); g.stroke();
      }
      g.globalAlpha=1;
      g.restore();
      if(Math.random() < 0.35)
        FX.add({ x:b.x+rnd(-b.hw,b.hw), y:b.y+b.hh, vx:rnd(-20,20), vy:rnd(10,60),
                 life:0, max:rnd(0.3,0.6), size:rnd(1.2,2.8), col:'#8fdcff',
                 type:'spark', rot:0, rv:0, g:0.3, drag:1.2 });
      break;
    }
    case 'saw': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.38)'; g.beginPath(); g.arc(2,3,b.r,0,TAU); g.fill();
      const teeth = Math.max(8, Math.round(b.r/3.1));
      g.fillStyle='#cbd5e0';
      g.beginPath();
      for(let i=0;i<teeth;i++){
        const a1=i/teeth*TAU, a2=(i+0.42)/teeth*TAU, a3=(i+1)/teeth*TAU;
        g.lineTo(Math.cos(a1)*b.r*0.86, Math.sin(a1)*b.r*0.86);
        g.lineTo(Math.cos(a2)*b.r, Math.sin(a2)*b.r);
        g.lineTo(Math.cos(a3)*b.r*0.86, Math.sin(a3)*b.r*0.86);
      }
      g.closePath(); g.fill();
      g.strokeStyle='#5c646f'; g.lineWidth=1.2; g.stroke();
      const gr=g.createRadialGradient(-b.r*0.3,-b.r*0.3,b.r*0.05,0,0,b.r*0.86);
      gr.addColorStop(0,'#f2f6fb'); gr.addColorStop(0.7,'#9aa5b2'); gr.addColorStop(1,'#5c646f');
      g.fillStyle=gr; g.beginPath(); g.arc(0,0,b.r*0.86,0,TAU); g.fill();
      g.fillStyle='#3d434b';
      for(let i=0;i<4;i++){ const a=i*PI/2;
        g.beginPath(); g.ellipse(Math.cos(a)*b.r*0.45, Math.sin(a)*b.r*0.45, b.r*0.16, b.r*0.10, a, 0, TAU); g.fill(); }
      rivet(g,0,0,b.r*0.22,'#f8fbff','#333940');
      g.restore();
      break;
    }
    case 'mossrock': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.40)'; rr(g,-b.hw+2,-b.hh+4,w,h,7); g.fill();
      rr(g,-b.hw,-b.hh,w,h,7); g.save(); g.clip();
      const bg2=g.createLinearGradient(0,-b.hh,0,b.hh);
      bg2.addColorStop(0,'#8c9a58'); bg2.addColorStop(0.5,'#67743a'); bg2.addColorStop(1,'#3f4a22');
      g.fillStyle=bg2; g.fillRect(-b.hw,-b.hh,w,h);
      seed(Math.round(b.x*13 + b.y*29 + w*7));
      // knobbly lichen growth
      const step=clamp(Math.min(w,h)*0.30,10,22);
      for(let yy=-b.hh; yy<b.hh+step; yy+=step*0.78)
        for(let xx=-b.hw; xx<b.hw+step; xx+=step*0.78){
          const r2=step*(0.34+srnd()*0.26);
          const px=xx+srnd()*6, py=yy+srnd()*6;
          const lg=g.createRadialGradient(px-r2*0.3,py-r2*0.36,r2*0.1,px,py,r2);
          const v=0.78+srnd()*0.5;
          lg.addColorStop(0,`rgb(${Math.round(158*v)},${Math.round(176*v)},${Math.round(96*v)})`);
          lg.addColorStop(0.7,`rgb(${Math.round(96*v)},${Math.round(112*v)},${Math.round(54*v)})`);
          lg.addColorStop(1,'rgba(28,36,14,0.9)');
          g.fillStyle=lg;
          g.beginPath(); g.arc(px,py,r2,0,TAU); g.fill();
        }
      g.fillStyle='rgba(212,232,150,0.16)'; g.fillRect(-b.hw,-b.hh,w,3);
      g.restore();
      g.strokeStyle='#232c11'; g.lineWidth=1.8; rr(g,-b.hw,-b.hh,w,h,7); g.stroke();
      g.restore();
      break;
    }
    case 'magma': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.4)'; rr(g,-b.hw+2,-b.hh+3,w,h,5); g.fill();
      rr(g,-b.hw,-b.hh,w,h,5); g.save(); g.clip();
      g.fillStyle='#3a0f06'; g.fillRect(-b.hw,-b.hh,w,h);
      const pulse = 0.55 + 0.28*Math.sin(t*1.6 + b.x*0.01);
      const gl=g.createLinearGradient(0,-b.hh,0,b.hh);
      gl.addColorStop(0,`rgba(255,132,36,${0.62*pulse})`);
      gl.addColorStop(1,`rgba(214,52,12,${0.46*pulse})`);
      g.fillStyle=gl; g.fillRect(-b.hw,-b.hh,w,h);
      seed(Math.round(b.x*7 + b.y*13));
      const step = clamp(Math.min(w,h)*0.34, 9, 20);
      for(let yy=-b.hh+step*0.4; yy<b.hh; yy+=step*0.82)
        for(let xx=-b.hw+step*0.4; xx<b.hw; xx+=step*0.82){
          const r2 = step*(0.36+srnd()*0.24);
          const dg=g.createRadialGradient(xx-r2*0.3,yy-r2*0.35,r2*0.1,xx,yy,r2);
          dg.addColorStop(0,'#5c2c18'); dg.addColorStop(0.55,'#2c110a'); dg.addColorStop(1,'#120504');
          g.fillStyle=dg;
          g.beginPath(); g.arc(xx+srnd()*3, yy+srnd()*3, r2, 0, TAU); g.fill();
        }
      g.restore();
      g.strokeStyle='#1d0803'; g.lineWidth=1.6; rr(g,-b.hw,-b.hh,w,h,5); g.stroke();
      g.restore();
      break;
    }
    case 'pine': blit(g, texPine(w,h), b.x, b.y, b.a, w, h); break;
    case 'carriage': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.42)'; rr(g,-b.hw+2,-b.hh+4,w,h*0.72,5); g.fill();
      const cg=g.createLinearGradient(0,-b.hh,0,b.hh);
      cg.addColorStop(0,'#6a5232'); cg.addColorStop(0.5,'#4a3820'); cg.addColorStop(1,'#2a1e10');
      g.fillStyle=cg; rr(g,-b.hw,-b.hh,w,h*0.70,4); g.fill();
      g.strokeStyle='#18110a'; g.lineWidth=1.6; rr(g,-b.hw,-b.hh,w,h*0.70,4); g.stroke();
      for(const [bx,by] of [[-b.hw+8,-b.hh+8],[b.hw-8,-b.hh+8]]) rivet(g,bx,by,2.6,'#e8d4a8','#2a1f13');
      // two iron wheels
      const wr = h*0.26;
      for(const wx of [-b.hw+wr*0.9, b.hw-wr*0.9]){
        const wy = b.hh - wr;
        const wg=g.createRadialGradient(wx-wr*0.3,wy-wr*0.3,wr*0.1,wx,wy,wr);
        wg.addColorStop(0,'#8d949c'); wg.addColorStop(0.7,'#4e555d'); wg.addColorStop(1,'#2a2f35');
        g.fillStyle=wg; g.beginPath(); g.arc(wx,wy,wr,0,TAU); g.fill();
        g.strokeStyle='#191d22'; g.lineWidth=1.8; g.beginPath(); g.arc(wx,wy,wr,0,TAU); g.stroke();
        g.strokeStyle='#7d858e'; g.lineWidth=1.6;
        for(let i=0;i<4;i++){ const a2=i*PI/4 + b.x*0.035;
          g.beginPath(); g.moveTo(wx-Math.cos(a2)*wr*0.8, wy-Math.sin(a2)*wr*0.8);
          g.lineTo(wx+Math.cos(a2)*wr*0.8, wy+Math.sin(a2)*wr*0.8); g.stroke(); }
        rivet(g,wx,wy,wr*0.28,'#dfe6ee','#23282e');
      }
      g.restore();
      break;
    }
    case 'board': blit(g, texBoard(w,h), b.x, b.y, b.a, w, h); break;
    case 'iceblock': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='rgba(0,0,0,0.22)'; rr(g,-b.hw+2,-b.hh+4,w,h,5); g.fill();
      const gr=g.createLinearGradient(-b.hw,-b.hh,b.hw,b.hh);
      gr.addColorStop(0,'rgba(224,246,255,0.94)');
      gr.addColorStop(0.42,'rgba(150,214,244,0.90)');
      gr.addColorStop(1,'rgba(196,236,252,0.94)');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,5); g.fill();
      // frozen wisps
      g.strokeStyle='rgba(255,255,255,0.62)'; g.lineWidth=1.4;
      seed(Math.round(b.hw*31 + b.hh*17));
      for(let i=0;i<4;i++){
        let px=-b.hw+srnd()*w, py=-b.hh+srnd()*h*0.7;
        g.beginPath(); g.moveTo(px,py);
        for(let k=0;k<3;k++){ px+=(srnd()-0.5)*w*0.30; py+=srnd()*h*0.18; g.lineTo(px,py); }
        g.stroke();
      }
      g.strokeStyle='rgba(255,255,255,0.88)'; g.lineWidth=2.4;
      rr(g,-b.hw+1.2,-b.hh+1.2,w-2.4,h-2.4,4); g.stroke();
      g.strokeStyle='rgba(120,180,210,0.65)'; g.lineWidth=1.2;
      rr(g,-b.hw,-b.hh,w,h,5); g.stroke();
      g.restore();
      break;
    }
    case 'wheelseg': break;
    case 'wheelseg_unused': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#f0c886'); gr.addColorStop(0.42,'#c99a52'); gr.addColorStop(1,'#7d5320');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,3); g.fill();
      g.strokeStyle='#4d2f0d'; g.lineWidth=1.2; rr(g,-b.hw,-b.hh,w,h,3); g.stroke();
      g.strokeStyle='rgba(90,58,20,0.55)'; g.lineWidth=0.9;
      for(let x=-b.hw+3;x<b.hw-1;x+=4){ g.beginPath(); g.moveTo(x,-b.hh+1); g.lineTo(x,-b.hh+3); g.stroke(); }
      g.restore();
      break;
    }
    case 'handle': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      const g2=g.createLinearGradient(0,-b.hh,0,b.hh);
      g2.addColorStop(0,'#eec688'); g2.addColorStop(0.45,'#c1913f'); g2.addColorStop(1,'#6f4718');
      g.fillStyle=g2; rr(g,-b.hw,-b.hh*1.15,w-9,h*2.3*0.5*1.0,h*0.4); g.fill();
      g.strokeStyle='#432807'; g.lineWidth=1.1; rr(g,-b.hw,-b.hh*1.15,w-9,h*1.15,h*0.4); g.stroke();
      // pewter knob on the end
      const kx = b.hw - 8, kr = 10;
      const kg=g.createRadialGradient(kx-kr*0.34,-kr*0.36,kr*0.12,kx,0,kr);
      kg.addColorStop(0,'#fbfdff'); kg.addColorStop(0.45,'#cdd6dd');
      kg.addColorStop(0.8,'#8e9aa4'); kg.addColorStop(1,'#5c666f');
      g.fillStyle=kg; g.beginPath(); g.arc(kx,0,kr,0,TAU); g.fill();
      g.strokeStyle='#3f474e'; g.lineWidth=1.1; g.beginPath(); g.arc(kx,0,kr,0,TAU); g.stroke();
      g.fillStyle='rgba(255,255,255,0.7)';
      g.beginPath(); g.ellipse(kx-kr*0.3,-kr*0.34,kr*0.26,kr*0.18,-0.5,0,TAU); g.fill();
      g.restore();
      break;
    }
    case 'goo': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#5f7a2e'); gr.addColorStop(1,'#28380f');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,4); g.fill();
      g.fillStyle='rgba(160,220,90,0.35)';
      for(let x=-b.hw+5;x<b.hw-2;x+=13){
        const d = 3 + Math.abs((x*7) % 5);   // x is negative on the left half
        g.beginPath(); g.arc(x, b.hh, d, 0, PI); g.fill();
      }
      g.fillStyle='rgba(200,255,140,0.22)'; rr(g,-b.hw+2,-b.hh+1.5,w-4,3.5,2); g.fill();
      g.strokeStyle='#1a2609'; g.lineWidth=1.4; rr(g,-b.hw,-b.hh,w,h,4); g.stroke();
      g.restore();
      break;
    }
    case 'link': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      g.fillStyle='#6a5533'; rr(g,-b.hw,-b.hh,w,h,2.4); g.fill();
      g.strokeStyle='#33280f'; g.lineWidth=1.1; rr(g,-b.hw,-b.hh,w,h,2.4); g.stroke();
      g.fillStyle='rgba(255,235,190,0.28)'; g.fillRect(-b.hw+0.8,-b.hh+1,1.6,h-2);
      g.restore();
      break;
    }
    case 'pivot': {
      g.save(); g.translate(b.x,b.y);
      g.fillStyle='#2c3138'; g.beginPath(); g.arc(0,0,6.5,0,TAU); g.fill();
      rivet(g,0,0,4.6,'#e8eef6','#2c3138');
      g.restore();
      break;
    }
    case 'balloon': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a*0.4);
      g.fillStyle='rgba(0,0,0,0.22)'; g.beginPath(); g.ellipse(2,4,b.r*0.94,b.r*1.1,0,0,TAU); g.fill();
      const gr=g.createRadialGradient(-b.r*0.35,-b.r*0.45,b.r*0.1,0,0,b.r*1.1);
      gr.addColorStop(0,'#ffc4d6'); gr.addColorStop(0.6,'#e4587f'); gr.addColorStop(1,'#9c2b4c');
      g.fillStyle=gr;
      g.beginPath(); g.ellipse(0,0,b.r*0.94,b.r*1.1,0,0,TAU); g.fill();
      g.fillStyle='rgba(255,255,255,0.55)';
      g.beginPath(); g.ellipse(-b.r*0.33,-b.r*0.42,b.r*0.20,b.r*0.30,-0.5,0,TAU); g.fill();
      g.fillStyle='#9c2b4c';
      g.beginPath(); g.moveTo(-3,b.r*1.05); g.lineTo(3,b.r*1.05); g.lineTo(0,b.r*1.32); g.closePath(); g.fill();
      g.restore();
      break;
    }
    case 'btnbase': {
      g.save(); g.translate(b.x,b.y); g.rotate(b.a);
      const gr=g.createLinearGradient(0,-b.hh,0,b.hh);
      gr.addColorStop(0,'#7a838f'); gr.addColorStop(1,'#333a43');
      g.fillStyle=gr; rr(g,-b.hw,-b.hh,w,h,3); g.fill();
      g.strokeStyle='#20252b'; g.lineWidth=1.4; rr(g,-b.hw,-b.hh,w,h,3); g.stroke();
      g.restore();
      break;
    }
    default: {
      if(b.shape==='circle') blit(g, texMetalBall(b.r,b.mat), b.x, b.y, b.a, b.r*2, b.r*2);
      else blit(g, texPlank(w,h,b.mat), b.x, b.y, b.a, w, h);
    }
  }
}

function drawWater(g,e,t,front){
  // Water is a region, not a tank: nothing stops a doll entering from the
  // side. Drawn as a flat rectangle it read as a blue box pasted on the
  // wall, so the vertical edges fade out instead of ending on a hard line,
  // and the body carries depth rather than four straight stripes.
  const l=e.x-e.w/2, top=e.y-e.h/2, r=l+e.w, bot=top+e.h;
  const fade = Math.min(26, e.w*0.22), STR = 7;
  g.save();
  g.beginPath(); g.rect(l, top, e.w, e.h); g.clip();
  if(!front){
    const gr=g.createLinearGradient(0,top,0,bot);
    gr.addColorStop(0,   'rgba(84,164,212,0.40)');
    gr.addColorStop(0.45,'rgba(44,112,170,0.56)');
    gr.addColorStop(1,   'rgba(14,56,104,0.70)');
    g.fillStyle=gr;
    g.fillRect(l+fade, top, Math.max(0, e.w-fade*2), e.h);
    for(let i=0;i<STR;i++){                       // soften both open edges
      const a = (i+0.5)/STR, sw = fade/STR;
      g.globalAlpha = a;
      g.fillRect(l + fade - (i+1)*sw, top, sw, e.h);
      g.fillRect(r - fade + i*sw,     top, sw, e.h);
    }
    g.globalAlpha = 1;
  } else {
    g.fillStyle='rgba(150,224,255,0.09)'; g.fillRect(l,top,e.w,e.h);
    // caustics: bands that drift and fade with depth, not fixed stripes
    for(let i=0;i<4;i++){
      const dpt = (i+1)/5;
      const y = top + 12 + dpt*e.h*0.82 + Math.sin(t*0.5 + i*1.7)*4;
      if(y > bot) break;
      g.strokeStyle = 'rgba(198,242,255,' + (0.26*(1-dpt*0.7)).toFixed(3) + ')';
      g.lineWidth = 1 + (1-dpt)*1.2;
      g.beginPath();
      for(let x=l;x<=r;x+=8) g.lineTo(x, y + Math.sin(x*0.05 + t*1.6 + i)*2.4);
      g.stroke();
    }
    for(let i=0;i<6;i++){                          // a slow string of bubbles
      const sd = ((i*83)%17)/17;
      const bx = l + (0.12 + sd*0.76)*e.w;
      const by = bot - ((t*(16+sd*20) + sd*e.h) % e.h);
      const rr2 = 1.4 + sd*2.2;
      g.fillStyle = 'rgba(224,248,255,' + (0.30*(0.4+0.6*(by-top)/e.h)).toFixed(3) + ')';
      g.beginPath(); g.arc(bx, by, rr2, 0, TAU); g.fill();
    }
  }
  g.restore();
  if(!front){
    // the meniscus, brightest where the water is thickest
    g.save();
    g.strokeStyle='rgba(206,247,255,0.66)'; g.lineWidth=2; g.lineCap='round';
    g.beginPath();
    for(let x=l;x<=r;x+=6) g.lineTo(x, top + Math.sin(x*0.045 + t*2.2)*2.4 + Math.sin(x*0.11 - t*1.3)*1.1);
    g.stroke();
    g.strokeStyle='rgba(255,255,255,0.22)'; g.lineWidth=1;
    g.beginPath();
    for(let x=l;x<=r;x+=6) g.lineTo(x, top - 1.4 + Math.sin(x*0.045 + t*2.2)*2.4 + Math.sin(x*0.11 - t*1.3)*1.1);
    g.stroke();
    g.restore();
  }
}

function drawGrav(g,e,t){
  g.save();
  const l=e.x-e.w/2, tp=e.y-e.h/2;
  g.beginPath(); rr(g,l,tp,e.w,e.h,10); g.clip();
  const gr=g.createLinearGradient(l,tp,l,tp+e.h);
  gr.addColorStop(0,'rgba(150,110,255,0.10)');
  gr.addColorStop(0.5,'rgba(110,80,220,0.16)');
  gr.addColorStop(1,'rgba(150,110,255,0.10)');
  g.fillStyle=gr; g.fillRect(l,tp,e.w,e.h);
  // arrows drifting the way the pull goes
  const cs=Math.cos(e.dir), sn=Math.sin(e.dir);
  for(let i=0;i<9;i++){
    const p=((t*0.42 + i/9) % 1);
    const ax = l + e.w*((i*0.37)%1);
    const ay = tp + e.h*((i*0.61)%1);
    const px = ax + cs*(p-0.5)*e.w*0.5, py = ay + sn*(p-0.5)*e.h*0.9;
    g.save(); g.translate(px,py); g.rotate(e.dir);
    g.globalAlpha = Math.sin(p*PI)*0.55;
    g.strokeStyle='#d9c8ff'; g.lineWidth=2; g.lineCap='round';
    g.beginPath(); g.moveTo(-9,0); g.lineTo(7,0); g.stroke();
    g.beginPath(); g.moveTo(1,-5); g.lineTo(8,0); g.lineTo(1,5); g.stroke();
    g.restore();
  }
  g.restore();
  g.strokeStyle='rgba(186,158,255,0.35)'; g.lineWidth=1.6;
  g.setLineDash([9,7]); rr(g,l,tp,e.w,e.h,10); g.stroke(); g.setLineDash([]);
}

function drawFan(g,e,t){
  // Seven hairlines and a dotted outline read as almost nothing, and a
  // draught strong enough to hold a doll up should be plain to see. The
  // region now carries a gradient the air arrives through, streaks spread
  // across the width rather than filed along one line, and chevrons that
  // say which way it blows.
  const cs = Math.cos(e.dir), sn = Math.sin(e.dir);
  const along  = Math.abs(cs)*e.w + Math.abs(sn)*e.h;   // depth of the throw
  const across = Math.abs(sn)*e.w + Math.abs(cs)*e.h;   // width of the mouth
  const ox = -sn, oy = cs;
  g.save();
  g.beginPath(); g.rect(e.x-e.w/2, e.y-e.h/2, e.w, e.h); g.clip();

  const grd = g.createLinearGradient(e.x - cs*along/2, e.y - sn*along/2,
                                     e.x + cs*along/2, e.y + sn*along/2);
  grd.addColorStop(0,    'rgba(200,231,255,0.17)');
  grd.addColorStop(0.55, 'rgba(200,231,255,0.075)');
  grd.addColorStop(1,    'rgba(200,231,255,0)');
  g.fillStyle = grd; g.fillRect(e.x-e.w/2, e.y-e.h/2, e.w, e.h);

  g.lineCap = 'round';
  for(let i=0;i<22;i++){
    const sd = ((i*97) % 31) / 31;
    const p  = ((t*(0.40 + sd*0.55) + i/22) % 1);
    const off = (sd - 0.5) * across * 0.92;
    const px = e.x + cs*(p-0.5)*along + ox*off;
    const py = e.y + sn*(p-0.5)*along + oy*off;
    const len = 12 + sd*26;
    const al = Math.sin(p*PI) * (0.18 + sd*0.28);
    g.strokeStyle = 'rgba(228,245,255,' + al.toFixed(3) + ')';
    g.lineWidth = 1 + sd*1.5;
    g.beginPath(); g.moveTo(px,py); g.lineTo(px+cs*len, py+sn*len); g.stroke();
  }
  // direction chevrons, drifting with the flow
  for(let i=0;i<3;i++){
    const p = ((t*0.30 + i/3) % 1);
    const px = e.x + cs*(p-0.5)*along, py = e.y + sn*(p-0.5)*along;
    const al = Math.sin(p*PI)*0.22;
    g.strokeStyle = 'rgba(232,247,255,' + al.toFixed(3) + ')';
    g.lineWidth = 2.2;
    const wg = Math.min(16, across*0.22), dp = 9;
    g.beginPath();
    g.moveTo(px + ox*wg - cs*dp, py + oy*wg - sn*dp);
    g.lineTo(px, py);
    g.lineTo(px - ox*wg - cs*dp, py - oy*wg - sn*dp);
    g.stroke();
  }
  g.restore();
  g.strokeStyle='rgba(190,225,255,0.20)'; g.lineWidth=1.4;
  g.setLineDash([6,6]); g.strokeRect(e.x-e.w/2, e.y-e.h/2, e.w, e.h); g.setLineDash([]);
  // the blower housing at the back of the region
  const hx = e.x - Math.cos(e.dir)*e.w/2, hy = e.y - Math.sin(e.dir)*e.h/2;
  g.save(); g.translate(hx,hy); g.rotate(e.dir);
  g.fillStyle='#3b4149'; rr(g,-9,-20,18,40,4); g.fill();
  g.strokeStyle='#1c2026'; g.lineWidth=1.5; rr(g,-9,-20,18,40,4); g.stroke();
  g.save(); g.translate(0,0); g.rotate(t*9);
  g.fillStyle='#9aa6b3';
  for(let i=0;i<3;i++){ g.rotate(TAU/3);
    g.beginPath(); g.ellipse(0,-9,3.4,9,0,0,TAU); g.fill(); }
  g.restore();
  rivet(g,0,0,3,'#e8eef6','#2c3138');
  g.restore();
}

function drawWheelHub(g,e){
  g.save(); g.translate(e.cx, e.cy); g.rotate(e.a);
  // the ring itself
  g.strokeStyle='rgba(0,0,0,0.34)'; g.lineWidth=13;
  g.beginPath(); g.arc(2,3.5,e.R,0,TAU); g.stroke();
  const rg = g.createLinearGradient(0,-e.R,0,e.R);
  rg.addColorStop(0,'#f2cd8c'); rg.addColorStop(0.35,'#cfa059');
  rg.addColorStop(0.7,'#9a6d28'); rg.addColorStop(1,'#6a4514');
  g.strokeStyle=rg; g.lineWidth=12;
  g.beginPath(); g.arc(0,0,e.R,0,TAU); g.stroke();
  g.strokeStyle='rgba(60,36,10,0.85)'; g.lineWidth=1.4;
  g.beginPath(); g.arc(0,0,e.R+6,0,TAU); g.stroke();
  g.beginPath(); g.arc(0,0,e.R-6,0,TAU); g.stroke();
  g.strokeStyle='rgba(255,238,200,0.45)'; g.lineWidth=1.6;
  g.beginPath(); g.arc(0,0,e.R-3.4,0,TAU); g.stroke();
  // knurling round the outer edge
  g.strokeStyle='rgba(70,42,12,0.55)'; g.lineWidth=1;
  for(let i=0;i<64;i++){
    const a=i/64*TAU;
    g.beginPath();
    g.moveTo(Math.cos(a)*(e.R+2.4), Math.sin(a)*(e.R+2.4));
    g.lineTo(Math.cos(a)*(e.R+5.6), Math.sin(a)*(e.R+5.6));
    g.stroke();
  }
  // spokes
  g.strokeStyle='#8a5b23'; g.lineWidth=5; g.lineCap='round';
  for(let i=0;i<6;i++){
    const a=i*PI/3;
    g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(a)*e.R*0.97, Math.sin(a)*e.R*0.97); g.stroke();
  }
  g.strokeStyle='#c79a54'; g.lineWidth=2.4;
  for(let i=0;i<6;i++){
    const a=i*PI/3;
    g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(a)*e.R*0.95, Math.sin(a)*e.R*0.95); g.stroke();
  }
  // hub
  const hg=g.createRadialGradient(-4,-4,2,0,0,17);
  hg.addColorStop(0,'#f2dcae'); hg.addColorStop(0.6,'#b98a44'); hg.addColorStop(1,'#5e3b12');
  g.fillStyle=hg; g.beginPath(); g.arc(0,0,17,0,TAU); g.fill();
  g.strokeStyle='#4a2c0b'; g.lineWidth=1.8; g.beginPath(); g.arc(0,0,17,0,TAU); g.stroke();
  g.strokeStyle='#d8ab60'; g.lineWidth=2.2; g.beginPath(); g.arc(0,0,10,0,TAU); g.stroke();
  g.fillStyle='#3a2409'; g.beginPath(); g.arc(0,0,4.4,0,TAU); g.fill();
  g.restore();
}

function drawPortal(g,e,t){
  for(const [x,y,a,c1,c2] of [[e.ax,e.ay,e.aa,'#7de0ff','#2a6fb0'],[e.bx,e.by,e.ba,'#c39bff','#5a2ea8']]){
    g.save(); g.translate(x,y); g.rotate(a);
    for(let i=0;i<3;i++){
      const p = ((t*0.7 + i/3) % 1);
      g.globalAlpha = (1-p)*0.55;
      g.strokeStyle = c1; g.lineWidth = 3*(1-p)+1;
      g.beginPath(); g.ellipse(0,0,e.r*(0.35+p*0.75), e.r*(0.35+p*0.75)*0.55, 0, 0, TAU); g.stroke();
    }
    g.globalAlpha=1;
    const gr=g.createRadialGradient(0,0,2,0,0,e.r);
    gr.addColorStop(0,'rgba(255,255,255,0.55)');
    gr.addColorStop(0.5, c2 + 'aa');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;
    g.beginPath(); g.ellipse(0,0,e.r,e.r*0.6,0,0,TAU); g.fill();
    g.strokeStyle=c1; g.lineWidth=2.6;
    g.beginPath(); g.ellipse(0,0,e.r,e.r*0.6,0,0,TAU); g.stroke();
    g.restore();
  }
}

function drawButton(g,e){
  const off = e.press*5;
  g.save(); g.translate(e.x, e.y + off); g.rotate(e.base.a);
  const gr=g.createLinearGradient(0,-6,0,6);
  if(e.on){ gr.addColorStop(0,'#ffd97a'); gr.addColorStop(1,'#c07d1c'); }
  else    { gr.addColorStop(0,'#d05c4a'); gr.addColorStop(1,'#7d2418'); }
  g.fillStyle=gr; rr(g,-(e.w-10)/2,-6,e.w-10,11,3); g.fill();
  g.strokeStyle='#1e1410'; g.lineWidth=1.5; rr(g,-(e.w-10)/2,-6,e.w-10,11,3); g.stroke();
  g.fillStyle='rgba(255,255,255,0.30)'; g.fillRect(-(e.w-10)/2+2,-5,e.w-14,2.4);
  g.restore();
  if(e.on){
    g.save(); g.globalAlpha=0.5; g.fillStyle='#ffd97a';
    g.beginPath(); g.arc(e.x, e.y-2, 13, 0, TAU); g.fill(); g.restore();
  }
}

Level.prototype.draw = function(g, aim){
  const t = this.time;
  g.drawImage(background(this.theme), 0, 0);

  // water sits behind everything it holds
  for(const e of this.ents) if(e.type==='water') drawWater(g,e,t,false);
  for(const e of this.ents) if(e.type==='portal') drawPortal(g,e,t);
  for(const e of this.ents) if(e.type==='wheel') drawWheelHub(g,e);
  for(const e of this.ents){
    if(e.type !== 'spring') continue;
    const top = e.plate.y + 11, bot = e.base.y - 15;
    const h2 = Math.max(6, bot - top), turns = 6, w2 = e.plate.hw * 0.62;
    g.save();
    g.lineCap='round'; g.lineJoin='round';
    for(const [col,lw,off] of [['rgba(0,0,0,0.34)',7,2],['#8f9aa6',6,0],['#e8eef6',2.4,-1.4]]){
      g.strokeStyle=col; g.lineWidth=lw;
      g.beginPath();
      for(let i=0;i<=turns*12;i++){
        const t2 = i/(turns*12);
        const yy = top + h2*t2 + off*0.3;
        const xx = e.x0 + Math.sin(t2*turns*TAU)*w2 + off*0.4;
        if(i===0) g.moveTo(xx,yy); else g.lineTo(xx,yy);
      }
      g.stroke();
    }
    g.restore();
  }

  // A mover slides between two points; without the track the player can only
  // learn where it goes by watching it get there. The rail sits under
  // everything, so the plank reads as running in it rather than over it.
  for(const e of this.ents){
    if(e.type !== 'mov' || (!e.dx && !e.dy)) continue;
    const ax = e.x0, ay = e.y0, bx = e.x0 + e.dx, by = e.y0 + e.dy;
    const wid = Math.min(e.b.hw, e.b.hh) * 0.8 + 2;
    g.save();
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = wid*2;
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
    g.strokeStyle = 'rgba(146,160,176,0.26)'; g.lineWidth = Math.max(1.2, wid*0.5);
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
    for(const [sx,sy] of [[ax,ay],[bx,by]]){          // end stops
      g.fillStyle = 'rgba(120,133,148,0.55)';
      g.beginPath(); g.arc(sx, sy, wid*0.75, 0, TAU); g.fill();
      rivet(g, sx, sy, 2.2, '#cfd8e2', '#2c3138');
    }
    g.restore();
  }

  // painted marks live on the world, under the objects
  g.drawImage(FX.decal, 0, 0);

  for(const tg of this.targets) drawTarget(g, tg.x, tg.y, tg.r, t, tg.hit, tg.a);

  for(const b of this.world.bodies){
    if(b.render==='btnbase' || b.dead) continue;
    drawBody(g, b, t);
  }
  for(const e of this.ents){
    if(e.type==='btn'){ drawBody(g, e.base, t); drawButton(g, e); }
  }

  for(const d of this.dolls) drawDoll(g, d);

  for(const e of this.ents){
    if(e.type==='balloon' && e.tether && !e.b.dead){
      g.save();
      g.strokeStyle='rgba(230,210,180,0.5)'; g.lineWidth=1.4;
      g.beginPath();
      const ax = e.b.x, ay = e.b.y + e.b.r*1.3;
      const bx = e.ax0, by = e.ay0;
      g.moveTo(ax,ay);
      g.quadraticCurveTo((ax+bx)/2 + Math.sin(t*1.6)*5, (ay+by)/2, bx, by);
      g.stroke();
      g.restore();
    }
  }
  for(const e of this.ents) if(e.type==='grav') drawGrav(g,e,t);
  for(const e of this.ents) if(e.type==='fan') drawFan(g,e,t);
  for(const e of this.ents) if(e.type==='water') drawWater(g,e,t,true);

  drawCannon(g, this.cannon.x, this.cannon.y, this.cannon.a, this.cannon.recoil, this.cannon.charge, t);

  FX.draw(g);

  const tint = THEMES[this.theme].tint;
  if(tint){ g.fillStyle = tint; g.fillRect(0,0,DW,DH); }
};

/* trajectory preview: run a lone point mass forward, stop at the first wall */
Level.prototype.previewArc = function(ang, power, steps){
  const pts = [];
  const speed = 620 + power*900;
  let x = this.cannon.x + Math.cos(ang)*46, y = this.cannon.y + Math.sin(ang)*46;
  let vx = Math.cos(ang)*speed, vy = Math.sin(ang)*speed;
  const dt = 1/60;
  for(let i=0;i<steps;i++){
    const nx = x + vx*dt, ny = y + vy*dt;
    const hit = this.world.raycastAny(x,y,nx,ny, b=>b.fixed && !b.sensor);
    pts.push({x:nx,y:ny});
    if(hit) break;
    x = nx; y = ny;
    vy += 1580*dt;
    const d = 1/(1+dt*0.16); vx*=d; vy*=d;
  }
  return pts;
};

/* =====================================================================
   10. SAVE
   ===================================================================== */
const SAVE_KEY = 'flopshot.save.v1';
const Save = {
  data: { best:{}, sound:true, music:true, guide:true, seen:false },
  load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(d && typeof d === 'object') this.data = Object.assign(this.data, d);
      }
    }catch(e){}
    Audio.on = this.data.sound !== false;
    Audio.musicOn = this.data.music !== false;
  },
  write(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); }catch(e){} },
  best(i){ return this.data.best[i]; },
  cleared(i){ return this.data.best[i] !== undefined; },
  unlocked(i){
    if(i === 0 || this.cleared(i) || this.cleared(i-1)) return true;
    // being stuck on one room must not end the game: two may be stepped over
    let done = 0;
    for(let k=0;k<i;k++) if(this.cleared(k)) done++;
    return done >= i - 2;
  },
  record(i, used, cups){
    const b = this.data.best[i];
    if(b === undefined || used < b.u){ this.data.best[i] = { u:used, c:cups }; }
    this.write();
  },
  cups(i){ const b = this.data.best[i]; return b ? b.c : 0; },
  totalCups(){ let n=0; for(const k in this.data.best) n += this.data.best[k].c; return n; },
  worldCups(w){ let n=0; for(let i=WORLDS[w].from;i<WORLDS[w].to;i++) n += this.cups(i); return n; },
  worldCleared(w){ for(let i=WORLDS[w].from;i<WORLDS[w].to;i++) if(!this.cleared(i)) return false; return true; }
};
