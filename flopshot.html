<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>FLOPSHOT</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a120c" />
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;background:#0b0806;overflow:hidden;overscroll-behavior:none;}
  canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;}
  *{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   FLOPSHOT  —  a steam-works cannon puzzler
   Fire cloth dolls out of a brass cannon. Paint the bullseye. Use fewer
   dolls than the level allows and the vault gives up its cups.
   Single file. No libraries. Everything below is hand rolled: the rigid
   body solver, the joints, the textures, the audio.
   ===================================================================== */

/* ---------------------------------------------------------------- 0. boot */
const DW = 960, DH = 640;                 // world is exactly one screen
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha:false });
let SC = 1, OX = 0, OY = 0, CW = DW, CH = DH;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  cvs.width  = Math.max(1, Math.floor(w * dpr));
  cvs.height = Math.max(1, Math.floor(h * dpr));
  cvs.style.width = w + 'px';
  cvs.style.height = h + 'px';
  CW = cvs.width; CH = cvs.height;
  SC = Math.min(CW / DW, CH / DH);
  OX = (CW - DW * SC) * 0.5;
  OY = (CH - DH * SC) * 0.5;
}
window.addEventListener('resize', resize, {passive:true});
window.addEventListener('orientationchange', ()=>setTimeout(resize,120), {passive:true});

/* ------------------------------------------------------------- 1. numbers */
const PI = Math.PI, TAU = PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const sign  = v => v < 0 ? -1 : 1;
const dist2 = (ax,ay,bx,by) => { const dx=bx-ax, dy=by-ay; return dx*dx+dy*dy; };
const dist  = (ax,ay,bx,by) => Math.sqrt(dist2(ax,ay,bx,by));
function angDiff(a,b){ let d=(a-b)%TAU; if(d>PI)d-=TAU; if(d<-PI)d+=TAU; return d; }
function smooth(t){ return t*t*(3-2*t); }
function easeOut(t){ return 1-(1-t)*(1-t); }
function easeIn(t){ return t*t; }

/* deterministic little noise generator so textures are stable per run */
let _seed = 1337;
function srnd(){ _seed = (_seed * 1664525 + 1013904223) & 0x7fffffff; return _seed / 0x7fffffff; }
function seed(s){ _seed = s|0 || 1; }
function rnd(a=1,b){ return b===undefined ? Math.random()*a : a + Math.random()*(b-a); }
function rint(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* rounded rect path */
function rr(g,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)*0.5, Math.abs(h)*0.5);
  g.beginPath();
  g.moveTo(x+r,y);
  g.lineTo(x+w-r,y); g.arcTo(x+w,y,x+w,y+r,r);
  g.lineTo(x+w,y+h-r); g.arcTo(x+w,y+h,x+w-r,y+h,r);
  g.lineTo(x+r,y+h);   g.arcTo(x,y+h,x,y+h-r,r);
  g.lineTo(x,y+r);     g.arcTo(x,y,x+r,y,r);
  g.closePath();
}
function mkcv(w,h){
  const c = document.createElement('canvas');
  c.width = Math.max(1,Math.ceil(w)); c.height = Math.max(1,Math.ceil(h));
  return c;
}

/* ---------------------------------------------------------------- 2. input */
const IN = {
  down:false, x:0, y:0, sx:0, sy:0,
  pressed:false, released:false, rx:0, ry:0, moved:0, id:null
};
function ptWorld(clientX, clientY){
  const r = cvs.getBoundingClientRect();
  const px = (clientX - r.left) * (CW / r.width);
  const py = (clientY - r.top)  * (CH / r.height);
  return { x:(px - OX)/SC, y:(py - OY)/SC };
}
function onDown(x,y){
  const p = ptWorld(x,y);
  IN.down = true; IN.pressed = true; IN.moved = 0;
  IN.x = IN.sx = p.x; IN.y = IN.sy = p.y;
  Audio.unlock();
}
function onMove(x,y){
  const p = ptWorld(x,y);
  IN.moved += dist(IN.x, IN.y, p.x, p.y);
  IN.x = p.x; IN.y = p.y;
}
function onUp(){
  if(!IN.down) return;
  IN.down = false; IN.released = true; IN.rx = IN.x; IN.ry = IN.y;
}
cvs.addEventListener('pointerdown', e=>{ if(IN.id!==null) return; IN.id=e.pointerId; cvs.setPointerCapture&&cvs.setPointerCapture(e.pointerId); onDown(e.clientX,e.clientY); e.preventDefault(); });
cvs.addEventListener('pointermove', e=>{ if(e.pointerId!==IN.id) return; onMove(e.clientX,e.clientY); e.preventDefault(); });
const endPtr = e=>{ if(e.pointerId!==IN.id) return; IN.id=null; onUp(); e.preventDefault(); };
cvs.addEventListener('pointerup', endPtr);
cvs.addEventListener('pointercancel', endPtr);
window.addEventListener('contextmenu', e=>e.preventDefault());
const KEY = {};
window.addEventListener('keydown', e=>{ KEY[e.key]=true; if(e.key===' '||e.key==='ArrowUp'||e.key==='ArrowDown') e.preventDefault(); Audio.unlock(); });
window.addEventListener('keyup',   e=>{ KEY[e.key]=false; });
function endFrameInput(){ IN.pressed=false; IN.released=false; }

/* =====================================================================
   3. PHYSICS
   Impulse based rigid bodies. Convex polygons and circles, SAT with face
   clipping for manifolds, sequential impulses with warm starting, revolute
   joints with angle limits, and per body sleeping so stacks actually rest.
   ===================================================================== */

const SLOP      = 0.35;   // allowed overlap, px
const BAUMGARTE = 0.18;   // position correction rate
const MAX_CORR  = 320;    // px/s cap on correction velocity
const REST_VEL  = 90;     // below this approach speed, no bounce
const SLEEP_LIN = 6.0, SLEEP_ANG = 0.14, SLEEP_TIME = 0.55;

let BID = 1;

class Body {
  constructor(o){
    this.id      = BID++;
    this.shape   = o.shape || 'box';           // 'box' | 'poly' | 'circle'
    this.x = o.x||0; this.y = o.y||0; this.a = o.a||0;
    this.vx = o.vx||0; this.vy = o.vy||0; this.av = o.av||0;
    this.fixed   = !!o.fixed;
    this.sensor  = !!o.sensor;
    this.friction= o.friction !== undefined ? o.friction : 0.5;
    this.rest    = o.rest     !== undefined ? o.rest     : 0.04;
    this.linDamp = o.linDamp  !== undefined ? o.linDamp  : 0.10;
    this.angDamp = o.angDamp  !== undefined ? o.angDamp  : 0.20;
    this.gscale  = o.gscale   !== undefined ? o.gscale   : 1;
    this.group   = o.group || 0;               // matching non-zero groups never collide
    this.mat     = o.mat || 'wood';
    this.tag     = o.tag || null;
    this.ent     = null;                        // owning game entity
    this.dead    = false;
    this.bullet  = !!o.bullet;
    this.r = 0; this.hw = 0; this.hh = 0;

    if(this.shape === 'circle'){
      this.r = o.r || 10;
    } else if(this.shape === 'poly'){
      this.lv = o.verts.map(v=>({x:v.x, y:v.y}));
    } else {
      this.shape = 'poly';
      this.hw = (o.w||10)*0.5; this.hh = (o.h||10)*0.5;
      this.box = true;
      this.lv = [ {x:-this.hw,y:-this.hh},{x:this.hw,y:-this.hh},
                  {x: this.hw,y: this.hh},{x:-this.hw,y:this.hh} ];
    }
    this.density = o.density !== undefined ? o.density : MAT_DENSITY[this.mat] || 0.0010;
    this.computeMass();
    if(this.fixed){ this.m=0; this.im=0; this.I=0; this.iI=0; }

    // world space caches
    this.wv = this.lv ? this.lv.map(()=>({x:0,y:0})) : null;
    this.wn = this.lv ? this.lv.map(()=>({x:0,y:0})) : null;
    this.cos = 1; this.sin = 0;
    this.minx=this.miny=this.maxx=this.maxy=0;
    this.awake = true; this.sleepT = 0; this.canSleep = o.canSleep !== false;
    this.sync();
  }

  computeMass(){
    if(this.shape === 'circle'){
      const A = PI * this.r * this.r;
      this.m = A * this.density;
      this.I = this.m * this.r * this.r * 0.5;
    } else {
      // polygon area + second moment about centroid (verts assumed centered)
      let A = 0, I = 0;
      const v = this.lv, n = v.length;
      for(let i=0;i<n;i++){
        const p = v[i], q = v[(i+1)%n];
        const cr = p.x*q.y - q.x*p.y;
        A += cr;
        I += cr * (p.x*p.x + p.x*q.x + q.x*q.x + p.y*p.y + p.y*q.y + q.y*q.y);
      }
      A = Math.abs(A) * 0.5;
      this.m = A * this.density;
      this.I = Math.abs(I) / 12 * this.density;
    }
    this.im = this.m > 0 ? 1/this.m : 0;
    this.iI = this.I > 0 ? 1/this.I : 0;
  }

  sync(){
    this.cos = Math.cos(this.a); this.sin = Math.sin(this.a);
    if(this.shape === 'circle'){
      this.minx = this.x - this.r; this.maxx = this.x + this.r;
      this.miny = this.y - this.r; this.maxy = this.y + this.r;
      return;
    }
    const c=this.cos, s=this.sin, v=this.lv, w=this.wv, n=v.length;
    let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
    for(let i=0;i<n;i++){
      const px = v[i].x*c - v[i].y*s + this.x;
      const py = v[i].x*s + v[i].y*c + this.y;
      w[i].x = px; w[i].y = py;
      if(px<mnx)mnx=px; if(px>mxx)mxx=px;
      if(py<mny)mny=py; if(py>mxy)mxy=py;
    }
    for(let i=0;i<n;i++){
      const p=w[i], q=w[(i+1)%n];
      const ex=q.x-p.x, ey=q.y-p.y, L=Math.hypot(ex,ey)||1;
      this.wn[i].x =  ey/L; this.wn[i].y = -ex/L;   // outward for CW-in-screen-space winding
    }
    this.minx=mnx; this.miny=mny; this.maxx=mxx; this.maxy=mxy;
  }

  wake(){ this.awake = true; this.sleepT = 0; }
  sleep(){ this.awake = false; this.vx=this.vy=this.av=0; }

  applyImpulse(px,py,cx,cy){
    if(this.fixed) return;
    this.wake();
    this.vx += px*this.im; this.vy += py*this.im;
    this.av += ((cx-this.x)*py - (cy-this.y)*px) * this.iI;
  }
  velAt(cx,cy,out){
    out.x = this.vx - this.av*(cy-this.y);
    out.y = this.vy + this.av*(cx-this.x);
  }
  contains(px,py){
    if(this.shape==='circle') return dist2(px,py,this.x,this.y) <= this.r*this.r;
    const w=this.wv,n=w.length;
    for(let i=0;i<n;i++){
      const nx=this.wn[i].x, ny=this.wn[i].y;
      if((px-w[i].x)*nx + (py-w[i].y)*ny > 0) return false;
    }
    return true;
  }
}

const MAT_DENSITY = {
  wood:0.00095, stone:0.0026, metal:0.0042, glass:0.0011,
  cloth:0.0016, ice:0.0009, tnt:0.0013, rubber:0.0011, balloon:0.00030
};
const MAT_FRICTION = {
  wood:0.55, stone:0.62, metal:0.35, glass:0.22, cloth:0.5,
  ice:0.03, tnt:0.5, rubber:0.9, balloon:0.4
};
const MAT_REST = {
  wood:0.06, stone:0.05, metal:0.12, glass:0.04, cloth:0.02,
  ice:0.05, tnt:0.05, rubber:0.72, balloon:0.4
};

/* ------------------------------------------------- 3a. narrow phase */
const _tmpA = {x:0,y:0}, _tmpB = {x:0,y:0};

function maxSeparation(A,B){
  // deepest penetration of B's verts along each of A's face normals
  let best = -1e9, bi = 0;
  const n = A.wv.length;
  for(let i=0;i<n;i++){
    const nx = A.wn[i].x, ny = A.wn[i].y;
    const vx = A.wv[i].x, vy = A.wv[i].y;
    // support point of B in direction -n
    let minD = 1e9;
    for(let j=0;j<B.wv.length;j++){
      const d = (B.wv[j].x-vx)*nx + (B.wv[j].y-vy)*ny;
      if(d < minD) minD = d;
    }
    if(minD > best){ best = minD; bi = i; }
  }
  return { sep:best, i:bi };
}

function clipSeg(p1,p2,nx,ny,off){
  // keep the part of segment with dot(n,p) <= off
  const d1 = nx*p1.x + ny*p1.y - off;
  const d2 = nx*p2.x + ny*p2.y - off;
  const out = [];
  if(d1 <= 0) out.push({x:p1.x,y:p1.y});
  if(d2 <= 0) out.push({x:p2.x,y:p2.y});
  if(d1*d2 < 0){
    const t = d1/(d1-d2);
    out.push({ x:p1.x+t*(p2.x-p1.x), y:p1.y+t*(p2.y-p1.y) });
  }
  return out.slice(0,2);
}

function polyPoly(A,B){
  const eA = maxSeparation(A,B); if(eA.sep > 0) return null;
  const eB = maxSeparation(B,A); if(eB.sep > 0) return null;
  let ref, inc, idx, flip;
  if(eB.sep > eA.sep + 0.2){ ref=B; inc=A; idx=eB.i; flip=true; }
  else                     { ref=A; inc=B; idx=eA.i; flip=false; }

  const rn = ref.wn[idx];
  const nx = rn.x, ny = rn.y;
  const v1 = ref.wv[idx], v2 = ref.wv[(idx+1)%ref.wv.length];

  // incident face = face of inc most anti parallel to n
  let ii = 0, minDot = 1e9;
  for(let i=0;i<inc.wn.length;i++){
    const d = inc.wn[i].x*nx + inc.wn[i].y*ny;
    if(d < minDot){ minDot = d; ii = i; }
  }
  const i1 = inc.wv[ii], i2 = inc.wv[(ii+1)%inc.wv.length];

  // side planes
  const tx = v2.x-v1.x, ty = v2.y-v1.y, L = Math.hypot(tx,ty)||1;
  const sx = tx/L, sy = ty/L;
  let pts = clipSeg(i1,i2, -sx,-sy, -(sx*v1.x + sy*v1.y));
  if(pts.length < 2) return null;
  pts = clipSeg(pts[0],pts[1], sx,sy, sx*v2.x + sy*v2.y);
  if(pts.length < 2) return null;

  const front = nx*v1.x + ny*v1.y;
  const contacts = [];
  for(const p of pts){
    const sep = nx*p.x + ny*p.y - front;
    if(sep <= 0.5) contacts.push({ x:p.x, y:p.y, sep:sep, pn:0, pt:0 });
  }
  if(!contacts.length) return null;
  return { nx: flip ? -nx : nx, ny: flip ? -ny : ny, contacts };
}

function circleCircle(A,B){
  const dx=B.x-A.x, dy=B.y-A.y;
  const rr2=(A.r+B.r), d=Math.hypot(dx,dy);
  if(d > rr2) return null;
  let nx,ny;
  if(d < 1e-6){ nx=0; ny=-1; } else { nx=dx/d; ny=dy/d; }
  return { nx, ny, contacts:[{ x:A.x+nx*A.r, y:A.y+ny*A.r, sep:d-rr2, pn:0, pt:0 }] };
}

function polyCircle(P,C){
  // normal points from P toward C
  const n = P.wv.length;
  let best = -1e9, bi = 0;
  for(let i=0;i<n;i++){
    const d = (C.x-P.wv[i].x)*P.wn[i].x + (C.y-P.wv[i].y)*P.wn[i].y;
    if(d > C.r) return null;
    if(d > best){ best = d; bi = i; }
  }
  const v1 = P.wv[bi], v2 = P.wv[(bi+1)%n];
  if(best < 1e-4){
    // center inside the polygon
    const nx=P.wn[bi].x, ny=P.wn[bi].y;
    return { nx, ny, contacts:[{ x:C.x-nx*C.r, y:C.y-ny*C.r, sep:best-C.r, pn:0, pt:0 }] };
  }
  // voronoi region test
  const e1 = (C.x-v1.x)*(v2.x-v1.x) + (C.y-v1.y)*(v2.y-v1.y);
  const e2 = (C.x-v2.x)*(v1.x-v2.x) + (C.y-v2.y)*(v1.y-v2.y);
  let px,py;
  if(e1 <= 0)      { px=v1.x; py=v1.y; }
  else if(e2 <= 0) { px=v2.x; py=v2.y; }
  else {
    const nx=P.wn[bi].x, ny=P.wn[bi].y;
    return { nx, ny, contacts:[{ x:C.x-nx*C.r, y:C.y-ny*C.r, sep:best-C.r, pn:0, pt:0 }] };
  }
  const dx=C.x-px, dy=C.y-py, d=Math.hypot(dx,dy);
  if(d > C.r || d < 1e-9) return null;
  const nx=dx/d, ny=dy/d;
  return { nx, ny, contacts:[{ x:px, y:py, sep:d-C.r, pn:0, pt:0 }] };
}

function collide(A,B){
  if(A.shape==='circle'){
    if(B.shape==='circle') return circleCircle(A,B);
    const m = polyCircle(B,A);
    if(m){ m.nx=-m.nx; m.ny=-m.ny; }
    return m;
  }
  if(B.shape==='circle') return polyCircle(A,B);
  return polyPoly(A,B);
}

/* ------------------------------------------------- 3b. arbiters */
class Arbiter {
  constructor(A,B,m){
    this.A=A; this.B=B;
    this.nx=m.nx; this.ny=m.ny;
    this.contacts=m.contacts;
    this.friction = Math.sqrt((MAT_FRICTION[A.mat]??A.friction) * (MAT_FRICTION[B.mat]??B.friction));
    this.rest = Math.max(A.rest, B.rest);
    this.touch = true;
    this.stamp = 0;
    this.impulse = 0;   // total normal impulse this step
    this.vn0 = 0;       // closing speed before the solve, the honest impact measure
    this.rm  = 0;       // reduced mass of the pair
  }
  update(m){
    const old = this.contacts;
    const nu = m.contacts;
    for(const c of nu){
      let bestD = 25, best = null;
      for(const o of old){
        const d = dist2(c.x,c.y,o.x,o.y);
        if(d < bestD){ bestD = d; best = o; }
      }
      if(best){ c.pn = best.pn; c.pt = best.pt; }
    }
    this.contacts = nu;
    this.nx = m.nx; this.ny = m.ny;
    this.touch = true;
  }
  prestep(dt){
    const A=this.A, B=this.B, nx=this.nx, ny=this.ny;
    const tx = -ny, ty = nx;
    const inv = 1/dt;
    const km = A.im + B.im;
    this.rm = km > 0 ? 1/km : 0;
    this.vn0 = 0;
    for(const c of this.contacts){
      const r1x = c.x - A.x, r1y = c.y - A.y;
      const r2x = c.x - B.x, r2y = c.y - B.y;
      c.r1x=r1x; c.r1y=r1y; c.r2x=r2x; c.r2y=r2y;

      const rn1 = r1x*nx + r1y*ny, rn2 = r2x*nx + r2y*ny;
      let kN = A.im + B.im
             + A.iI * (r1x*r1x + r1y*r1y - rn1*rn1)
             + B.iI * (r2x*r2x + r2y*r2y - rn2*rn2);
      c.mn = kN > 0 ? 1/kN : 0;

      const rt1 = r1x*tx + r1y*ty, rt2 = r2x*tx + r2y*ty;
      let kT = A.im + B.im
             + A.iI * (r1x*r1x + r1y*r1y - rt1*rt1)
             + B.iI * (r2x*r2x + r2y*r2y - rt2*rt2);
      c.mt = kT > 0 ? 1/kT : 0;

      const pen = -c.sep;
      c.bias = Math.min(MAX_CORR, BAUMGARTE * inv * Math.max(0, pen - SLOP));

      // restitution from the approach speed sampled before the solve
      const dvx = (B.vx - B.av*r2y) - (A.vx - A.av*r1y);
      const dvy = (B.vy + B.av*r2x) - (A.vy + A.av*r1x);
      const vn = dvx*nx + dvy*ny;
      if(vn < this.vn0) this.vn0 = vn;
      c.target = vn < -REST_VEL ? -this.rest * vn : 0;

      // warm start
      const px = c.pn*nx + c.pt*tx, py = c.pn*ny + c.pt*ty;
      if(!A.fixed){ A.vx -= px*A.im; A.vy -= py*A.im; A.av -= (r1x*py - r1y*px)*A.iI; }
      if(!B.fixed){ B.vx += px*B.im; B.vy += py*B.im; B.av += (r2x*py - r2y*px)*B.iI; }
    }
  }
  solve(){
    const A=this.A, B=this.B, nx=this.nx, ny=this.ny;
    const tx = -ny, ty = nx;
    for(const c of this.contacts){
      // normal
      let dvx = (B.vx - B.av*c.r2y) - (A.vx - A.av*c.r1y);
      let dvy = (B.vy + B.av*c.r2x) - (A.vy + A.av*c.r1x);
      let vn = dvx*nx + dvy*ny;
      let dPn = c.mn * (c.bias + c.target - vn);
      const pn0 = c.pn;
      c.pn = Math.max(0, pn0 + dPn);
      dPn = c.pn - pn0;
      let px = dPn*nx, py = dPn*ny;
      if(!A.fixed){ A.vx -= px*A.im; A.vy -= py*A.im; A.av -= (c.r1x*py - c.r1y*px)*A.iI; }
      if(!B.fixed){ B.vx += px*B.im; B.vy += py*B.im; B.av += (c.r2x*py - c.r2y*px)*B.iI; }
      this.impulse += Math.abs(dPn);

      // friction
      dvx = (B.vx - B.av*c.r2y) - (A.vx - A.av*c.r1y);
      dvy = (B.vy + B.av*c.r2x) - (A.vy + A.av*c.r1x);
      const vt = dvx*tx + dvy*ty;
      let dPt = c.mt * (-vt);
      const maxPt = this.friction * c.pn;
      const pt0 = c.pt;
      c.pt = clamp(pt0 + dPt, -maxPt, maxPt);
      dPt = c.pt - pt0;
      px = dPt*tx; py = dPt*ty;
      if(!A.fixed){ A.vx -= px*A.im; A.vy -= py*A.im; A.av -= (c.r1x*py - c.r1y*px)*A.iI; }
      if(!B.fixed){ B.vx += px*B.im; B.vy += py*B.im; B.av += (c.r2x*py - c.r2y*px)*B.iI; }
    }
  }
}

/* ------------------------------------------------- 3c. joints */
class Joint {
  // point to point, optionally with a relative angle limit
  constructor(A,B,wx,wy,opt={}){
    this.A=A; this.B=B;
    const ca=Math.cos(-A.a), sa=Math.sin(-A.a);
    const cb=Math.cos(-B.a), sb=Math.sin(-B.a);
    let dx=wx-A.x, dy=wy-A.y;
    this.ax = dx*ca - dy*sa; this.ay = dx*sa + dy*ca;
    dx=wx-B.x; dy=wy-B.y;
    this.bx = dx*cb - dy*sb; this.by = dx*sb + dy*cb;
    this.px=0; this.py=0;
    this.soft = opt.soft || 0;
    this.lo = opt.lo; this.hi = opt.hi;
    this.refA = opt.ref !== undefined ? opt.ref : (B.a - A.a);
    this.limImp = 0;
    this.motor = opt.motor || 0;      // target relative angular velocity
    this.maxMotor = opt.maxMotor || 0;
    this.motorImp = 0;
    this.broken = false;
    this.breakForce = opt.breakForce || 0;
    this.stiff = opt.stiff || 0;      // soft restoring torque toward ref angle
  }
  worldA(){ const c=this.A.cos,s=this.A.sin; return { x:this.A.x + this.ax*c - this.ay*s, y:this.A.y + this.ax*s + this.ay*c }; }
  worldB(){ const c=this.B.cos,s=this.B.sin; return { x:this.B.x + this.bx*c - this.by*s, y:this.B.y + this.bx*s + this.by*c }; }
  prestep(dt){
    const A=this.A,B=this.B;
    const pa=this.worldA(), pb=this.worldB();
    this.r1x = pa.x-A.x; this.r1y = pa.y-A.y;
    this.r2x = pb.x-B.x; this.r2y = pb.y-B.y;
    const r1x=this.r1x,r1y=this.r1y,r2x=this.r2x,r2y=this.r2y;

    // K = (im1+im2)*Identity + skew terms
    const k11 = A.im + B.im + A.iI*r1y*r1y + B.iI*r2y*r2y;
    const k12 = -A.iI*r1x*r1y - B.iI*r2x*r2y;
    const k22 = A.im + B.im + A.iI*r1x*r1x + B.iI*r2x*r2x;
    let det = k11*k22 - k12*k12;
    if(Math.abs(det) < 1e-12) det = 1e-12;
    this.m11 =  k22/det; this.m12 = -k12/det; this.m22 = k11/det;

    const cx = pb.x-pa.x, cy = pb.y-pa.y;
    const bf = 0.2/dt;
    this.bx2 = -bf*cx; this.by2 = -bf*cy;
    this.cerr = Math.hypot(cx,cy);

    // warm start
    if(!A.fixed){ A.vx -= this.px*A.im; A.vy -= this.py*A.im; A.av -= (r1x*this.py - r1y*this.px)*A.iI; }
    if(!B.fixed){ B.vx += this.px*B.im; B.vy += this.py*B.im; B.av += (r2x*this.py - r2y*this.px)*B.iI; }

    // angle limit
    this.kAng = (A.iI + B.iI) > 0 ? 1/(A.iI + B.iI) : 0;
    this.limState = 0;
    if(this.lo !== undefined){
      const ang = (B.a - A.a) - this.refA;
      this.angErr = 0;
      if(ang < this.lo){ this.limState = 1; this.angErr = ang - this.lo; }
      else if(ang > this.hi){ this.limState = -1; this.angErr = ang - this.hi; }
      if(this.limState){
        this.angBias = clamp(-0.25/dt * this.angErr, -14, 14);
        const imp = this.limImp;
        if(!A.fixed) A.av -= imp*A.iI;
        if(!B.fixed) B.av += imp*B.iI;
      } else this.limImp = 0;
    }
  }
  solve(dt){
    const A=this.A,B=this.B;
    const r1x=this.r1x,r1y=this.r1y,r2x=this.r2x,r2y=this.r2y;
    const dvx = (B.vx - B.av*r2y) - (A.vx - A.av*r1y);
    const dvy = (B.vy + B.av*r2x) - (A.vy + A.av*r1x);
    const ex = this.bx2 - dvx, ey = this.by2 - dvy;
    const ix = this.m11*ex + this.m12*ey;
    const iy = this.m12*ex + this.m22*ey;
    this.px += ix; this.py += iy;
    if(!A.fixed){ A.vx -= ix*A.im; A.vy -= iy*A.im; A.av -= (r1x*iy - r1y*ix)*A.iI; }
    if(!B.fixed){ B.vx += ix*B.im; B.vy += iy*B.im; B.av += (r2x*iy - r2y*ix)*B.iI; }

    if(this.limState && this.kAng){
      const dw = B.av - A.av;
      let imp = this.kAng * (this.angBias - dw);
      const old = this.limImp;
      if(this.limState > 0) this.limImp = Math.max(0, old + imp);
      else                  this.limImp = Math.min(0, old + imp);
      imp = this.limImp - old;
      if(!A.fixed) A.av -= imp*A.iI;
      if(!B.fixed) B.av += imp*B.iI;
    }
    if(this.stiff && this.kAng){
      const ang = (B.a - A.a) - this.refA;
      const dw = B.av - A.av;
      const imp = this.kAng * (-ang*this.stiff*dt*60 - dw*0.06) * 0.5;
      if(!A.fixed) A.av -= imp*A.iI;
      if(!B.fixed) B.av += imp*B.iI;
    }
  }
}

class DistJoint {
  constructor(A,B,wax,way,wbx,wby,opt={}){
    this.A=A; this.B=B;
    const ca=Math.cos(-A.a), sa=Math.sin(-A.a);
    const cb=Math.cos(-B.a), sb=Math.sin(-B.a);
    let dx=wax-A.x, dy=way-A.y;
    this.ax = dx*ca - dy*sa; this.ay = dx*sa + dy*ca;
    dx=wbx-B.x; dy=wby-B.y;
    this.bx = dx*cb - dy*sb; this.by = dx*sb + dy*cb;
    this.len = opt.len !== undefined ? opt.len : dist(wax,way,wbx,wby);
    this.rope = !!opt.rope;   // only resists stretching
    this.imp = 0;
    this.broken = false;
  }
  worldA(){ const c=this.A.cos,s=this.A.sin; return { x:this.A.x + this.ax*c - this.ay*s, y:this.A.y + this.ax*s + this.ay*c }; }
  worldB(){ const c=this.B.cos,s=this.B.sin; return { x:this.B.x + this.bx*c - this.by*s, y:this.B.y + this.bx*s + this.by*c }; }
  prestep(dt){
    const A=this.A,B=this.B;
    const pa=this.worldA(), pb=this.worldB();
    this.r1x=pa.x-A.x; this.r1y=pa.y-A.y;
    this.r2x=pb.x-B.x; this.r2y=pb.y-B.y;
    let dx=pb.x-pa.x, dy=pb.y-pa.y;
    const d = Math.hypot(dx,dy) || 1e-6;
    this.nx = dx/d; this.ny = dy/d;
    this.slack = this.rope && d < this.len;
    const C = d - this.len;
    const rn1 = this.r1x*this.nx + this.r1y*this.ny;
    const rn2 = this.r2x*this.nx + this.r2y*this.ny;
    let k = A.im + B.im
          + A.iI*(this.r1x*this.r1x + this.r1y*this.r1y - rn1*rn1)
          + B.iI*(this.r2x*this.r2x + this.r2y*this.r2y - rn2*rn2);
    this.mass = k > 0 ? 1/k : 0;
    this.bias = clamp(-0.25/dt * C, -260, 260);
    const px=this.imp*this.nx, py=this.imp*this.ny;
    if(!A.fixed){ A.vx -= px*A.im; A.vy -= py*A.im; A.av -= (this.r1x*py - this.r1y*px)*A.iI; }
    if(!B.fixed){ B.vx += px*B.im; B.vy += py*B.im; B.av += (this.r2x*py - this.r2y*px)*B.iI; }
  }
  solve(){
    if(this.slack) return;
    const A=this.A,B=this.B;
    const dvx = (B.vx - B.av*this.r2y) - (A.vx - A.av*this.r1y);
    const dvy = (B.vy + B.av*this.r2x) - (A.vy + A.av*this.r1x);
    const vn = dvx*this.nx + dvy*this.ny;
    let imp = this.mass * (this.bias - vn);
    if(this.rope){
      const old=this.imp; this.imp = Math.min(0, old+imp); imp = this.imp-old;
    } else this.imp += imp;
    const px=imp*this.nx, py=imp*this.ny;
    if(!A.fixed){ A.vx -= px*A.im; A.vy -= py*A.im; A.av -= (this.r1x*py - this.r1y*px)*A.iI; }
    if(!B.fixed){ B.vx += px*B.im; B.vy += py*B.im; B.av += (this.r2x*py - this.r2y*px)*B.iI; }
  }
}

/* ------------------------------------------------- 3d. world */
class World {
  constructor(){
    this.bodies = [];
    this.joints = [];
    this.arbs = new Map();
    this.gx = 0; this.gy = 1580;
    this.stamp = 0;
    this.iter = 9;
    this.onContact = null;    // (A,B,impulse,x,y,nx,ny)
    this.fields = [];         // water / fans / wind, applied as forces
  }
  add(b){ this.bodies.push(b); return b; }
  remove(b){
    b.dead = true;
    const i = this.bodies.indexOf(b); if(i>=0) this.bodies.splice(i,1);
    for(let k=this.joints.length-1;k>=0;k--)
      if(this.joints[k].A===b || this.joints[k].B===b) this.joints.splice(k,1);
    for(const [key,a] of this.arbs) if(a.A===b || a.B===b) this.arbs.delete(key);
  }
  addJoint(j){ this.joints.push(j); return j; }
  clear(){ this.bodies.length=0; this.joints.length=0; this.arbs.clear(); this.fields.length=0; }

  canCollide(A,B){
    if(A.fixed && B.fixed) return false;
    if(!A.awake && !B.awake) return false;
    if(A.group && A.group === B.group) return false;
    if(A.maxx < B.minx || B.maxx < A.minx || A.maxy < B.miny || B.maxy < A.miny) return false;
    return true;
  }

  step(dt){
    this.stamp++;
    const bodies = this.bodies;
    const n = bodies.length;

    for(let i=0;i<n;i++){ const b=bodies[i]; if(b.awake || b.fixed) b.sync(); }

    /* ---- broad + narrow phase */
    for(let i=0;i<n;i++){
      const A = bodies[i];
      for(let j=i+1;j<n;j++){
        const B = bodies[j];
        if(!this.canCollide(A,B)) continue;
        const m = collide(A,B);
        const key = A.id * 100000 + B.id;
        if(!m){ this.arbs.delete(key); continue; }
        // waking: a moving body wakes what it lands on
        if(A.awake && !B.awake && !B.fixed) B.wake();
        if(B.awake && !A.awake && !A.fixed) A.wake();
        if(A.sensor || B.sensor){
          if(this.onSensor) this.onSensor(A,B);
          this.arbs.delete(key);
          continue;
        }
        let arb = this.arbs.get(key);
        if(arb) arb.update(m);
        else { arb = new Arbiter(A,B,m); this.arbs.set(key,arb); }
        arb.stamp = this.stamp;
        arb.impulse = 0;
      }
    }
    for(const [key,a] of this.arbs) if(a.stamp !== this.stamp) this.arbs.delete(key);

    /* ---- integrate velocity */
    for(let i=0;i<n;i++){
      const b = bodies[i];
      if(b.fixed || !b.awake) continue;
      b.vx += this.gx * b.gscale * dt;
      b.vy += this.gy * b.gscale * dt;
      const ld = 1 / (1 + dt * b.linDamp);
      const ad = 1 / (1 + dt * b.angDamp);
      b.vx *= ld; b.vy *= ld; b.av *= ad;
    }
    for(const f of this.fields) f(dt, bodies);

    /* ---- solve */
    for(const [,a] of this.arbs) a.prestep(dt);
    for(const j of this.joints) j.prestep(dt);
    for(let it=0; it<this.iter; it++){
      for(const [,a] of this.arbs) a.solve();
      for(const j of this.joints) j.solve(dt);
    }

    /* ---- integrate position */
    const maxV = 3600;
    for(let i=0;i<n;i++){
      const b = bodies[i];
      if(b.fixed || !b.awake) continue;
      const sp = Math.hypot(b.vx,b.vy);
      if(sp > maxV){ b.vx *= maxV/sp; b.vy *= maxV/sp; }
      if(b.av >  40) b.av =  40;
      if(b.av < -40) b.av = -40;
      b.x += b.vx*dt; b.y += b.vy*dt; b.a += b.av*dt;
    }

    /* ---- sleeping */
    for(let i=0;i<n;i++){
      const b = bodies[i];
      if(b.fixed || !b.awake) continue;
      if(!b.canSleep){ b.sleepT = 0; continue; }
      if(Math.hypot(b.vx,b.vy) < SLEEP_LIN && Math.abs(b.av) < SLEEP_ANG){
        b.sleepT += dt;
        if(b.sleepT > SLEEP_TIME) b.sleep();
      } else b.sleepT = 0;
    }

    /* ---- report meaningful impacts */
    if(this.onContact){
      for(const [,a] of this.arbs){
        const sp = -a.vn0;
        if(sp > 70 && a.contacts.length){
          const c = a.contacts[0];
          this.onContact(a.A, a.B, sp * a.rm, c.x, c.y, a.nx, a.ny, sp);
        }
      }
    }
  }

  queryPoint(px,py,filter){
    for(let i=this.bodies.length-1;i>=0;i--){
      const b=this.bodies[i];
      if(filter && !filter(b)) continue;
      if(px<b.minx||px>b.maxx||py<b.miny||py>b.maxy) continue;
      if(b.contains(px,py)) return b;
    }
    return null;
  }
  /* cheap segment cast against body AABBs then exact for the shapes we care about */
  raycastAny(x1,y1,x2,y2,filter){
    let bestT = 1, hit = null;
    for(const b of this.bodies){
      if(filter && !filter(b)) continue;
      const t = segBody(x1,y1,x2,y2,b);
      if(t !== null && t < bestT){ bestT = t; hit = b; }
    }
    return hit ? { body:hit, t:bestT, x:x1+(x2-x1)*bestT, y:y1+(y2-y1)*bestT } : null;
  }
  wakeAll(){ for(const b of this.bodies) if(!b.fixed) b.wake(); }
}

function segBody(x1,y1,x2,y2,b){
  if(b.shape==='circle'){
    const dx=x2-x1, dy=y2-y1;
    const fx=x1-b.x, fy=y1-b.y;
    const A=dx*dx+dy*dy, B=2*(fx*dx+fy*dy), C=fx*fx+fy*fy-b.r*b.r;
    let disc=B*B-4*A*C; if(disc<0||A===0) return null;
    disc=Math.sqrt(disc);
    const t1=(-B-disc)/(2*A);
    if(t1>=0&&t1<=1) return t1;
    const t2=(-B+disc)/(2*A);
    if(t2>=0&&t2<=1) return t2;
    return null;
  }
  // slab clip against the convex polygon's half planes
  let lo=0, hi=1;
  const dx=x2-x1, dy=y2-y1;
  for(let i=0;i<b.wv.length;i++){
    const nx=b.wn[i].x, ny=b.wn[i].y;
    const num = (b.wv[i].x-x1)*nx + (b.wv[i].y-y1)*ny;
    const den = dx*nx + dy*ny;
    if(Math.abs(den)<1e-9){ if(num<0) return null; continue; }
    const t = num/den;
    if(den < 0){ if(t > lo) lo = t; }
    else       { if(t < hi) hi = t; }
    if(lo > hi) return null;
  }
  return lo <= hi && lo >= 0 && lo <= 1 ? lo : null;
}

/* =====================================================================
   4. TEXTURES
   Everything is drawn once into an offscreen canvas and cached by size,
   then blitted with a rotation. Keeps the per frame cost to drawImage.
   ===================================================================== */
const TEXC = new Map();
function tex(key, w, h, draw){
  const k = key + '|' + Math.round(w) + '|' + Math.round(h);
  let c = TEXC.get(k);
  if(c) return c;
  const pad = 6;
  c = mkcv(w + pad*2, h + pad*2);
  const g = c.getContext('2d');
  g.translate(pad, pad);
  seed((Math.round(w)*73856093) ^ (Math.round(h)*19349663) ^ hashStr(key));
  draw(g, w, h);
  c.padx = pad; c.pady = pad;
  TEXC.set(k, c);
  return c;
}
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

function shade(g,x,y,w,h,c1,c2){
  const gr = g.createLinearGradient(x,y,x,y+h);
  gr.addColorStop(0,c1); gr.addColorStop(1,c2);
  g.fillStyle = gr; g.fillRect(x,y,w,h);
}
function rivet(g,x,y,r,light='#e8d9b8',dark='#4a3316'){
  g.fillStyle = dark; g.beginPath(); g.arc(x,y+0.6,r,0,TAU); g.fill();
  const gr = g.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r);
  gr.addColorStop(0,light); gr.addColorStop(1,dark);
  g.fillStyle = gr; g.beginPath(); g.arc(x,y,r*0.86,0,TAU); g.fill();
}
function grain(g,w,h,n,col,alpha){
  g.strokeStyle = col; g.globalAlpha = alpha; g.lineWidth = 1;
  for(let i=0;i<n;i++){
    const y = srnd()*h;
    g.beginPath();
    g.moveTo(0,y);
    let cy = y;
    for(let x=0;x<w;x+=14){ cy += (srnd()-0.5)*2.2; g.lineTo(x,cy); }
    g.lineTo(w,cy);
    g.stroke();
  }
  g.globalAlpha = 1;
}

/* -- a riveted plank, the backbone of every level -- */
function texPlank(w,h,mat){
  return tex('pl_'+mat, w, h, (g,w,h)=>{
    const horiz = w >= h;
    const P = PLANK_PAL[mat] || PLANK_PAL.wood;
    // drop shadow
    g.fillStyle = 'rgba(0,0,0,0.34)';
    rr(g, 1.5, 3.5, w, h, Math.min(4,h*0.3)); g.fill();
    // body
    rr(g, 0, 0, w, h, Math.min(3.5,h*0.28)); g.save(); g.clip();
    shade(g,0,0,w,h,P.top,P.bot);
    if(horiz) grain(g,w,h, Math.max(3,Math.round(h/3.2)), P.grain, 0.30);
    else {
      g.save(); g.translate(w,0); g.rotate(PI/2);
      grain(g,h,w, Math.max(3,Math.round(w/3.2)), P.grain, 0.30);
      g.restore();
    }
    // bevel
    g.fillStyle='rgba(255,255,255,0.17)'; g.fillRect(0,0,w,Math.max(1.5,h*0.10));
    g.fillStyle='rgba(0,0,0,0.30)';       g.fillRect(0,h-Math.max(1.5,h*0.13),w,Math.max(1.5,h*0.13));
    // metal end caps
    const cap = clamp(Math.min(w,h)*0.55, 5, 13);
    if(horiz && w > cap*3){
      for(const cx of [0, w-cap]){
        shade(g,cx,0,cap,h,P.cap1,P.cap2);
        g.fillStyle='rgba(0,0,0,0.30)'; g.fillRect(cx + (cx===0?cap-1.2:0),0,1.2,h);
      }
    } else if(!horiz && h > cap*3){
      for(const cy of [0, h-cap]){
        shade(g,0,cy,w,cap,P.cap1,P.cap2);
        g.fillStyle='rgba(0,0,0,0.30)'; g.fillRect(0,cy + (cy===0?cap-1.2:0),w,1.2);
      }
    }
    g.restore();
    // outline
    g.strokeStyle = P.line; g.lineWidth = 1.4;
    rr(g,0.7,0.7,w-1.4,h-1.4,Math.min(3.5,h*0.28)); g.stroke();
    // rivets
    const rr_ = clamp(Math.min(w,h)*0.14, 1.5, 3.1);
    const inset = Math.max(3.5, rr_*2.0);
    if(horiz){
      const span = w - inset*2;
      const cnt = clamp(Math.round(span/46)+2, 2, 14);
      for(let i=0;i<cnt;i++){
        const x = inset + span*(cnt===1?0.5:i/(cnt-1));
        if(h > 15){ rivet(g,x,inset,rr_,P.riv1,P.riv2); rivet(g,x,h-inset,rr_,P.riv1,P.riv2); }
        else rivet(g,x,h*0.5,rr_,P.riv1,P.riv2);
      }
    } else {
      const span = h - inset*2;
      const cnt = clamp(Math.round(span/46)+2, 2, 14);
      for(let i=0;i<cnt;i++){
        const y = inset + span*(cnt===1?0.5:i/(cnt-1));
        if(w > 15){ rivet(g,inset,y,rr_,P.riv1,P.riv2); rivet(g,w-inset,y,rr_,P.riv1,P.riv2); }
        else rivet(g,w*0.5,y,rr_,P.riv1,P.riv2);
      }
    }
  });
}

/* -- crates and blocks that move -- */
function texCrate(w,h,mat){
  return tex('cr_'+mat, w, h, (g,w,h)=>{
    const P = PLANK_PAL[mat] || PLANK_PAL.wood;
    g.fillStyle='rgba(0,0,0,0.34)'; rr(g,2,3.5,w,h,4); g.fill();
    rr(g,0,0,w,h,4); g.save(); g.clip();
    shade(g,0,0,w,h,P.top,P.bot);
    grain(g,w,h,Math.max(4,Math.round(h/5)),P.grain,0.26);
    // diagonal bracing
    g.strokeStyle = P.grain; g.globalAlpha=0.55;
    g.lineWidth = Math.max(2.5, Math.min(w,h)*0.10);
    g.beginPath(); g.moveTo(2,2); g.lineTo(w-2,h-2); g.moveTo(w-2,2); g.lineTo(2,h-2); g.stroke();
    g.globalAlpha=0.25; g.strokeStyle='#fff'; g.lineWidth=1.2;
    g.beginPath(); g.moveTo(3,1); g.lineTo(w-1,h-3); g.moveTo(w-3,1); g.lineTo(1,h-3); g.stroke();
    g.globalAlpha=1;
    // frame
    const fr = Math.max(3.5, Math.min(w,h)*0.13);
    g.fillStyle = P.cap2; g.globalAlpha=0.9;
    g.fillRect(0,0,w,fr); g.fillRect(0,h-fr,w,fr);
    g.fillRect(0,0,fr,h); g.fillRect(w-fr,0,fr,h);
    g.globalAlpha=1;
    g.fillStyle='rgba(255,255,255,0.16)'; g.fillRect(0,0,w,2);
    g.restore();
    g.strokeStyle=P.line; g.lineWidth=1.5; rr(g,0.8,0.8,w-1.6,h-1.6,4); g.stroke();
    const rv = clamp(Math.min(w,h)*0.075,1.6,3);
    const i2 = Math.max(4.5, rv*2.2);
    for(const [x,y] of [[i2,i2],[w-i2,i2],[i2,h-i2],[w-i2,h-i2]]) rivet(g,x,y,rv,P.riv1,P.riv2);
  });
}

function texGlass(w,h){
  return tex('glass', w, h, (g,w,h)=>{
    rr(g,0,0,w,h,3); g.save(); g.clip();
    const gr=g.createLinearGradient(0,0,w,h);
    gr.addColorStop(0,'rgba(190,235,250,0.55)');
    gr.addColorStop(0.45,'rgba(140,200,225,0.34)');
    gr.addColorStop(1,'rgba(200,240,255,0.5)');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
    g.strokeStyle='rgba(255,255,255,0.6)'; g.lineWidth=Math.max(2,w*0.05);
    g.beginPath(); g.moveTo(w*0.16,h); g.lineTo(w*0.5,0); g.stroke();
    g.globalAlpha=0.4;
    g.beginPath(); g.moveTo(w*0.55,h); g.lineTo(w*0.86,0); g.stroke();
    g.globalAlpha=1;
    g.restore();
    g.strokeStyle='rgba(225,248,255,0.85)'; g.lineWidth=1.6; rr(g,0.9,0.9,w-1.8,h-1.8,3); g.stroke();

}

function texTNT(w,h){
  return tex('tnt', w, h, (g,w,h)=>{
    g.fillStyle='rgba(0,0,0,0.34)'; rr(g,2,3.5,w,h,3); g.fill();
    rr(g,0,0,w,h,3); g.save(); g.clip();
    shade(g,0,0,w,h,'#b8442c','#6d2214');
    grain(g,w,h,4,'#4a1409',0.3);
    g.fillStyle='#e8d9b0'; g.fillRect(0,h*0.34,w,h*0.30);
    g.fillStyle='#8f2d18';

    if(w>26) g.fillText('TNT', w/2, h*0.50);

function texMetalBall(r,mat){
  return tex('ball_'+mat, r*2, r*2, (g,w)=>{
    const R=w/2;
    g.fillStyle='rgba(0,0,0,0.34)'; g.beginPath(); g.arc(R+1.5,R+3,R,0,TAU); g.fill();
    const P = PLANK_PAL[mat] || PLANK_PAL.stone;
    const gr=g.createRadialGradient(R-R*0.4,R-R*0.45,R*0.1,R,R,R);
    gr.addColorStop(0,P.top); gr.addColorStop(0.65,P.bot); gr.addColorStop(1,P.line);
    g.fillStyle=gr; g.beginPath(); g.arc(R,R,R,0,TAU); g.fill();
    g.strokeStyle=P.line; g.lineWidth=1.4; g.beginPath(); g.arc(R,R,R-0.7,0,TAU); g.stroke();
    g.fillStyle='rgba(255,255,255,0.5)';
    g.beginPath(); g.ellipse(R-R*0.35,R-R*0.42,R*0.24,R*0.16,-0.6,0,TAU); g.fill();
    if(r>9){ g.strokeStyle='rgba(0,0,0,0.25)'; g.lineWidth=1;
      g.beginPath(); g.arc(R,R,R*0.62,0.3,2.3); g.stroke(); }
  });
}

    }
  } else if(th===1){ // cut stone cellar
    g.fillStyle='#161c24'; g.fillRect(0,0,DW,DH);

    for(let r=0,y=-8;y<DH+bh;y+=bh,r++){
      const off = (r%2)*bw*0.5;
      for(let x=-bw+off;x<DW+bw;x+=bw){

        gr.addColorStop(0,`rgb(${Math.round(58*v)},${Math.round(66*v)},${Math.round(78*v)})`);
        gr.addColorStop(1,`rgb(${Math.round(34*v)},${Math.round(40*v)},${Math.round(49*v)})`);

          g.fillRect(x+srnd()*(bw-12), y+srnd()*(bh-10), 2+srnd()*4, 1.5+srnd()*2); }

  } else if(th===2){ // clockworks, dark plum with brass gears turning behind
    g.fillStyle='#171021'; g.fillRect(0,0,DW,DH);
    for(let i=0;i<16;i++){
      const x=srnd()*DW, y=srnd()*DH, R=26+srnd()*74, teeth=Math.round(R/6)+6;
      g.save(); g.translate(x,y); g.rotate(srnd()*TAU);
      g.fillStyle=`rgba(${140+srnd()*40|0},${105+srnd()*30|0},${52},0.13)`;
      g.beginPath();
      for(let t=0;t<teeth;t++){
        const a1=t/teeth*TAU, a2=(t+0.5)/teeth*TAU, a3=(t+1)/teeth*TAU;
        g.lineTo(Math.cos(a1)*R,Math.sin(a1)*R);
        g.lineTo(Math.cos(a2)*R*1.16,Math.sin(a2)*R*1.16);
        g.lineTo(Math.cos(a3)*R,Math.sin(a3)*R);
      }
      g.closePath(); g.fill();
      g.globalCompositeOperation='destination-out';
      g.beginPath(); g.arc(0,0,R*0.34,0,TAU); g.fill();
      g.globalCompositeOperation='source-over';
      g.restore();
    }
    const vg=g.createRadialGradient(DW/2,DH/2,80,DW/2,DH/2,DW*0.7);
    vg.addColorStop(0,'rgba(80,50,110,0.18)'); vg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=vg; g.fillRect(0,0,DW,DH);
  } else if(th===3){ // hothouse, mossy stone and hanging leaves
    g.fillStyle='#0c150a'; g.fillRect(0,0,DW,DH);
    for(let y=-8;y<DH+60;y+=56) for(let x=-8;x<DW+60;x+=76){
      const v=0.62+srnd()*0.30;
      g.fillStyle=`rgb(${Math.round(30*v)},${Math.round(44*v)},${Math.round(24*v)})`;
      rr(g,x+srnd()*3,y+srnd()*3,70,50,10); g.fill();

      g.strokeStyle='rgba(0,0,0,0.35)'; g.lineWidth=1.2; rr(g,x,y,70,50,10); g.stroke();

      g.beginPath(); g.ellipse(0,0,L*0.3,L,0,0,TAU); g.fill();
      g.restore();
    }
  } else {           // furnace, basalt with an ember glow at the floor
    g.fillStyle='#140803'; g.fillRect(0,0,DW,DH);
    const bh2=64;
    for(let r=0,y=-10;y<DH+bh2;y+=bh2,r++){
      const off=(r%2)*58;
      for(let x=-120+off;x<DW+120;x+=116){
        const v=0.7+srnd()*0.5;
        const w=110+srnd()*8, h=bh2-8;
        const gr=g.createLinearGradient(x,y,x,y+h);
        gr.addColorStop(0,`rgb(${Math.round(52*v)},${Math.round(30*v)},${Math.round(22*v)})`);
        gr.addColorStop(1,`rgb(${Math.round(26*v)},${Math.round(14*v)},${Math.round(10*v)})`);
        g.fillStyle=gr; rr(g,x,y,w,h,7); g.fill();
        g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=1.6; rr(g,x,y,w,h,7); g.stroke();
        g.fillStyle='rgba(255,140,60,0.05)'; g.fillRect(x+3,y+2,w-6,2.4);
        if(srnd()<0.30){
          g.strokeStyle=`rgba(255,${90+srnd()*70|0},30,${0.10+srnd()*0.16})`;
          g.lineWidth=1.4+srnd()*1.6;
          g.beginPath();
          let cx=x+8+srnd()*(w-20), cy=y+4;
          g.moveTo(cx,cy);
          for(let s=0;s<4;s++){ cx+=(srnd()-0.5)*22; cy+=h/4; g.lineTo(cx,cy); }

    const gg=g.createLinearGradient(0,DH*0.55,0,DH);
    gg.addColorStop(0,'rgba(255,90,20,0)'); gg.addColorStop(1,'rgba(255,110,30,0.30)');

  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.62)');
  g.fillStyle=vg; g.fillRect(0,0,DW,DH);
  BGC.set(th,c);
  return c;
}

function drawTarget(g,x,y,r,t,hit){
  g.save(); g.translate(x,y);
  const pulse = hit ? 1 : 1 + Math.sin(t*3.4)*0.028;
  g.scale(pulse,pulse);
  g.fillStyle='rgba(0,0,0,0.42)'; g.beginPath(); g.arc(2,4,r,0,TAU); g.fill();
  const rings = [ [1.00,'#f2e6cd'], [0.82,'#c0322a'], [0.64,'#f2e6cd'], [0.46,'#c0322a'], [0.26,'#f2e6cd'], [0.13,'#c0322a'] ];
  for(const [f,col] of rings){
    g.fillStyle = col; g.beginPath(); g.arc(0,0,r*f,0,TAU); g.fill();
  }
  // weathering
  g.globalAlpha=0.16; g.fillStyle='#4a2a10';
  for(let i=0;i<9;i++){ const a=i*2.1, d=r*(0.2+((i*37)%50)/100);
    g.beginPath(); g.arc(Math.cos(a)*d,Math.sin(a)*d,r*0.07,0,TAU); g.fill(); }
  g.globalAlpha=1;
  const gl=g.createRadialGradient(-r*0.35,-r*0.4,r*0.05,0,0,r);
  gl.addColorStop(0,'rgba(255,255,255,0.34)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(0,0,r,0,TAU); g.fill();
  g.strokeStyle='rgba(60,26,10,0.85)'; g.lineWidth=2.2; g.beginPath(); g.arc(0,0,r-1,0,TAU); g.stroke();
  if(!hit){
    g.strokeStyle=`rgba(255,235,180,${0.30+0.22*Math.sin(t*3.4)})`;
    g.lineWidth=2; g.beginPath(); g.arc(0,0,r+5+Math.sin(t*3.4)*2.5,0,TAU); g.stroke();
  }
  g.restore();
}

function drawCannon(g,x,y,ang,recoil,charge){
  g.save(); g.translate(x,y);
  // base plate
  g.fillStyle='rgba(0,0,0,0.40)'; rr(g,-25,10,52,17,5); g.fill();
  g.save(); g.rotate(ang);
  const rb = recoil*13;
  // barrel
  g.translate(-rb,0);
  const L=52, R0=15, R1=12.5;
  const gr=g.createLinearGradient(0,-R0,0,R0);
  gr.addColorStop(0,'#f0cf84'); gr.addColorStop(0.35,'#c99a3c');
  gr.addColorStop(0.72,'#8a6420'); gr.addColorStop(1,'#4e3810');
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(-14,-R0-2); g.lineTo(L-6,-R1); g.quadraticCurveTo(L,-R1,L,0);
  g.quadraticCurveTo(L,R1,L-6,R1); g.lineTo(-14,R0+2);
  g.quadraticCurveTo(-20,0,-14,-R0-2); g.closePath(); g.fill();
  g.strokeStyle='#3a280c'; g.lineWidth=1.6; g.stroke();
  // bands
  for(const bx of [2, 20, 38]){
    g.fillStyle='#7d5a1c'; rr(g,bx,-R0-1.6,6,(R0+1.6)*2,2); g.fill();
    g.fillStyle='rgba(255,235,170,0.35)'; g.fillRect(bx,-R0-1.6,6,2.2);
  }
  // muzzle ring
  g.fillStyle='#5e4413'; rr(g,L-5,-R1-2.4,7,(R1+2.4)*2,3); g.fill();
  g.fillStyle='#201606'; g.beginPath(); g.ellipse(L-1,0,3.2,R1-1,0,0,TAU); g.fill();
  // charge glow inside the muzzle
  if(charge>0){
    g.fillStyle=`rgba(255,${160+70*charge|0},80,${0.35+0.5*charge})`;
    g.beginPath(); g.ellipse(L-2,0,3.4+charge*2,(R1-1)*(0.4+0.6*charge),0,0,TAU); g.fill();
  }
  for(const [rx,ry] of [[-6,-9],[-6,9],[14,-11],[14,11],[32,-10],[32,10]]) rivet(g,rx,ry,2,'#ffeec0','#4a350f');
  g.restore();
  // yoke and wheel
  g.fillStyle='#4a3a24'; rr(g,-16,-4,32,26,6); g.fill();
  g.strokeStyle='#241a0e'; g.lineWidth=2; rr(g,-16,-4,32,26,6); g.stroke();
  const wg=g.createRadialGradient(-3,10,2,0,12,17);
  wg.addColorStop(0,'#8a6a3a'); wg.addColorStop(1,'#3a2a14');
  g.fillStyle=wg; g.beginPath(); g.arc(0,12,15,0,TAU); g.fill();
  g.strokeStyle='#1e150a'; g.lineWidth=2.4; g.beginPath(); g.arc(0,12,15,0,TAU); g.stroke();
  g.strokeStyle='#6b5128'; g.lineWidth=2.6;
  for(let i=0;i<6;i++){ const a=i*PI/3 + ang*0.5;
    g.beginPath(); g.moveTo(0,12); g.lineTo(Math.cos(a)*12.5, 12+Math.sin(a)*12.5); g.stroke(); }
  rivet(g,0,12,3.6,'#ffeec0','#3a2a10');
  g.restore();
}
