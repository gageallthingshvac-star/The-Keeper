<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Night Watch</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f0a12" />
<style>
  :root{
    --bg:#0f0a12; --bone:#f2e4cc; --mute:#9a8676; --ember:#ffb547; --core:#ffeeb8;
    --danger:#e0561c; --line:rgba(242,228,204,0.16); --panel:rgba(24,16,20,0.9);
    --body:-apple-system,"SF Pro Text",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--bone);
    font-family:var(--body);overscroll-behavior:none;touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(var(--safeT) + 8px) 0 calc(var(--safeB) + 8px)}

  /* ── the readout ─────────────────────────────────────────────── */
  #hud{flex:none;padding:0 14px 8px;display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:10px}
  .lbl{font:700 9px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .num{margin-left:auto;font:700 15px/1 var(--mono);color:var(--bone)}
  .mini{width:30px;height:30px;margin-left:auto;border-radius:9px;flex:none;
    border:1px solid var(--line);background:var(--panel);color:var(--bone);
    font:700 12px/1 var(--body);cursor:pointer;display:grid;place-items:center}
  .mini + .mini{margin-left:6px}
  .mini + .num{margin-left:10px}
  .mini.off{color:#6b5c4e}
  .mini:active{background:rgba(255,181,71,0.2)}
  .bar{height:12px;border-radius:2px;background:rgba(242,228,204,0.1);
    border:1px solid rgba(242,228,204,0.14);overflow:hidden}
  .bar i{display:block;height:100%;width:60%;transition:width .12s linear;
    background:linear-gradient(90deg,#c94513,#ef7a22 55%,#ffb547)}
  .bar.low i{background:linear-gradient(90deg,#8f2b08,#e0561c);animation:pulse .55s infinite alternate}
  @keyframes pulse{to{opacity:.55}}
  #dawnbar{height:5px;border-radius:2px;background:rgba(242,228,204,0.08);overflow:hidden}
  #dawnbar i{display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#3a2230,#b4646e 58%,#ffd6a0)}

  /* ── the world ───────────────────────────────────────────────── */
  #stage{flex:1;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;min-height:0;
    background:radial-gradient(120% 60% at 50% 22%,rgba(70,38,26,0.5),rgba(15,10,18,0) 70%)}
  #view{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    width:100%;height:auto;max-height:calc(100% - 34px);object-fit:contain;background:#0c0810}

  #banner{position:absolute;left:0;right:0;top:14%;text-align:center;padding:0 22px;
    pointer-events:none;opacity:0;transition:opacity .5s}
  #banner.on{opacity:1}
  #banner b{display:block;font:800 19px/1.2 var(--body);color:#fff6e6;
    text-shadow:0 2px 3px #000,0 3px 14px rgba(0,0,0,0.9)}
  #banner span{display:block;margin:5px auto 0;max-width:20em;
    font:600 11.5px/1.45 var(--body);color:var(--core);
    text-shadow:0 2px 3px #000,0 3px 12px rgba(0,0,0,0.9)}

  /* ── the road, twenty nights of it ───────────────────────────── */
  #road{flex:none;display:flex;gap:5px;justify-content:center;align-items:center;
    padding:13px 16px 0;width:100%}
  #road i{width:9px;height:9px;border-radius:2px;display:block;
    background:rgba(242,228,204,0.12);transition:background .3s}
  #road i.done{background:rgba(255,181,71,0.72)}
  #road i.now{background:var(--core);box-shadow:0 0 9px rgba(255,181,71,0.9)}

  /* ── controls ────────────────────────────────────────────────── */
  #pad{flex:none;display:flex;align-items:flex-end;justify-content:space-between;
    padding:10px 16px 0;gap:12px}
  .keys{display:flex;gap:12px;align-items:flex-end}
  .key{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--panel);color:var(--bone);
    font:700 26px/1 var(--body);cursor:pointer;transition:transform .06s,background .1s}
  .key:active,.key.on{transform:scale(.94);background:rgba(255,181,71,0.2);border-color:var(--ember)}
  .key.act{width:88px;height:88px;border-radius:25px;color:var(--ember);
    font:700 11px/1.35 var(--body);letter-spacing:.13em;white-space:pre-line;
    background:radial-gradient(120% 120% at 50% 20%,rgba(120,50,10,0.9),rgba(24,16,20,0.9));
    border-color:rgba(255,181,71,0.5)}
  .key.act.cool{color:#7d6a56;border-color:var(--line);background:var(--panel)}
  .key.hop{width:68px;height:68px;border-radius:19px;color:#cbbba4;
    font:700 10px/1 var(--body);letter-spacing:.12em}
  .key.act.go{color:#2a1a08;border-color:#ffc86b;
    background:linear-gradient(180deg,#ffc86b,#ef9a22);
    box-shadow:0 0 22px rgba(255,160,50,0.45)}
  .key.act.go.spent{color:#7d6a56;border-color:var(--line);
    background:var(--panel);box-shadow:none}
  .key.act.go.chore{color:#0f2417;border-color:#8fd28a;
    background:linear-gradient(180deg,#a9dfa2,#5aa860);
    box-shadow:0 0 22px rgba(110,200,110,0.4)}

  /* ── cards ───────────────────────────────────────────────────── */
  #veil{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:22px;
    background:radial-gradient(120% 90% at 50% 45%,rgba(34,19,11,0.8),rgba(9,5,4,0.96) 70%);
    overflow-y:auto;transition:opacity .3s}
  #veil.hide{opacity:0;pointer-events:none}
  #veil.lit{background:linear-gradient(180deg,rgba(12,7,10,0.55) 0 44%,rgba(12,7,10,0.9) 78%)}
  .card{width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:14px}
  .eyebrow{font:700 10px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--ember)}
  h1{font:800 40px/1.04 var(--body);letter-spacing:-.02em}
  h1 em{font-style:normal;color:var(--ember);display:block}
  .lede{font:400 15px/1.5 var(--body);color:var(--mute)}
  .tally{display:flex;gap:8px}
  .tally div{flex:1;padding:11px 6px;border:1px solid var(--line);border-radius:12px}
  .tally span{display:block;font:700 8px/1 var(--body);letter-spacing:.14em;
    text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .tally b{font:700 19px/1 var(--mono)}
  button.go{padding:17px;border-radius:15px;border:none;cursor:pointer;
    font:800 17px/1 var(--body);color:#2a1a08;
    background:linear-gradient(180deg,#ffc86b,#ef9a22);box-shadow:0 0 26px rgba(255,160,50,0.4)}
  button.ghost{padding:13px;border-radius:13px;cursor:pointer;
    font:600 14px/1 var(--body);color:var(--bone);
    border:1px solid var(--line);background:transparent}
  .rules{text-align:left;display:flex;flex-direction:column;gap:9px;
    padding:14px;border:1px solid var(--line);border-radius:14px}
  .rules p{font:400 13.5px/1.45 var(--body);color:var(--mute)}
  .rules b{color:var(--bone);font-weight:700}
  .nights{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
  .nights i{width:13px;height:13px;border-radius:3px;background:rgba(242,228,204,0.11);
    display:block;font-style:normal}
  .nights i.done{background:var(--ember)}
  .nights i.now{background:var(--bone);box-shadow:0 0 8px rgba(255,181,71,0.8)}
  .foot{font:500 10px/1.5 var(--mono);color:#6b5c4e;letter-spacing:.05em}
  .opts{display:flex;flex-direction:column;gap:9px;text-align:left}
  .opt{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left;
    border:1px solid var(--line);border-radius:14px;cursor:pointer;background:transparent}
  .opt b{font:700 14px/1.2 var(--body);color:var(--bone);display:block}
  .opt i{font-style:normal;font:400 11.5px/1.35 var(--body);color:var(--mute);display:block;margin-top:3px}
  .opt .txt{flex:1}
  .sw{width:44px;height:26px;border-radius:13px;flex:none;position:relative;
    background:rgba(242,228,204,0.13);transition:background .18s}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
    border-radius:50%;background:#9a8676;transition:transform .18s,background .18s}
  .opt.on .sw{background:rgba(255,181,71,0.42)}
  .opt.on .sw::after{transform:translateX(18px);background:var(--ember)}
  #peekWrap{display:grid;place-items:center;padding:10px 0 2px}
  #peek{image-rendering:pixelated;width:132px;height:auto;
    border:1px solid var(--line);border-radius:14px;background:#1b1522}
  .pickRow{text-align:left}
  .pickRow > span{display:block;font:700 9px/1 var(--body);letter-spacing:.16em;
    text-transform:uppercase;color:var(--mute);margin:0 0 7px 2px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{width:34px;height:34px;border-radius:11px;cursor:pointer;flex:none;
    border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.45)}
  .chip.on{border-color:var(--bone);box-shadow:0 0 12px rgba(255,181,71,0.55)}
  .chip.none{background:repeating-linear-gradient(45deg,#2a222c,#2a222c 4px,#1a151c 4px,#1a151c 8px)}
  .word{padding:9px 13px;border-radius:11px;cursor:pointer;font:700 12px/1 var(--body);
    border:1px solid var(--line);background:transparent;color:var(--mute)}
  .word.on{border-color:var(--ember);color:var(--bone);background:rgba(255,181,71,0.14)}
  /* The conversation fills the screen: what he has said scrolls inside its
     own box, and the button sits in one place at the bottom and stays there.
     Before this the button walked down the page as lines were added, so your
     second tap landed on nothing. */
  #veil.chat{padding:0;overflow:hidden;
    background:linear-gradient(180deg,rgba(9,5,7,0.94),rgba(9,5,7,0.97) 55%)}
  /* pinned to the viewport rather than sized by the grid: a grid row is
     auto-height, so a long transcript grew the card and pushed the buttons
     off the bottom of the screen again */
  /* the meeting keeps its dusk: light at the top so you can see him sat
     there, dark enough underneath to read him by */
  #veil.chat.lit{background:linear-gradient(180deg,rgba(12,7,10,0.42) 0 38%,
    rgba(10,6,8,0.9) 70%,rgba(9,5,7,0.96))}
  #veil.chat .card{position:fixed;top:0;bottom:0;left:0;right:0;
    max-width:440px;margin:0 auto;gap:9px;
    padding:calc(var(--safeT) + 14px) 16px calc(var(--safeB) + 12px)}
  .log{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:2px 1px 4px;
    mask-image:linear-gradient(180deg,transparent,#000 20px);
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 20px)}
  /* the lines sit down by the controls and grow upwards, the way a
     conversation does, instead of stranding him at the top of the screen */
  .logIn{display:flex;flex-direction:column;justify-content:flex-end;
    gap:11px;text-align:left;min-height:100%}
  .act{flex:none;display:flex;flex-direction:column;gap:8px}
  .talk{display:flex;flex-direction:column;gap:11px;text-align:left}
  .said{font:400 16px/1.5 var(--body);color:var(--bone)}
  .said.fresh{opacity:0;transform:translateY(6px);animation:rise .32s forwards}
  .said.me{color:var(--ember);text-align:right;font-style:italic}
  .tip{font:600 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
    color:#6b5c4e;text-align:center}
  @keyframes rise{to{opacity:1;transform:none}}
  .who{font:700 9px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;
    color:var(--mute);margin-bottom:-4px}
  .picks{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .pick{padding:14px;border-radius:13px;cursor:pointer;text-align:left;
    font:500 14.5px/1.4 var(--body);color:var(--bone);
    border:1px solid var(--line);background:rgba(255,181,71,0.05)}
  .pick:active{background:rgba(255,181,71,0.18);border-color:var(--ember)}
  .nameIn{padding:14px;border-radius:13px;border:1px solid var(--line);
    background:rgba(242,228,204,0.06);color:var(--bone);font:600 16px/1 var(--body);
    width:100%;text-align:center}
  .arm{border:1px solid var(--line);border-radius:14px;padding:12px 13px;text-align:left;
    display:flex;flex-direction:column;gap:7px;background:rgba(255,181,71,0.03)}
  .arm.has{background:rgba(255,181,71,0.08)}
  .arm.on{border-color:var(--ember);box-shadow:0 0 14px rgba(255,181,71,0.22)}
  .armTop{display:flex;align-items:center;gap:9px}
  .armTop b{font:700 15px/1.2 var(--body);color:var(--bone)}
  .pips{margin-left:auto;font-style:normal;color:var(--ember);letter-spacing:.16em;font-size:11px}
  .arm p{font:400 13px/1.45 var(--body);color:var(--mute);margin:0}
  .armBuy{padding:10px 12px;border-radius:11px;cursor:pointer;font:700 13px/1 var(--body);
    border:1px solid var(--line);background:rgba(255,181,71,0.10);color:var(--bone)}
  .armBuy:disabled{opacity:.4;color:var(--mute);background:transparent}
  .armBuy.pick{background:transparent;color:var(--mute)}
  .armWhen{font:600 11px/1.3 var(--body);color:#6b5c4e;letter-spacing:.04em}
  .armWhen.on{color:var(--ember)}
  .joinRow{display:flex;gap:11px;align-items:center;text-align:left;
    border:1px solid var(--line);border-radius:14px;padding:12px}
  .joinRow b{font:700 14px/1.2 var(--body);color:var(--bone);display:block}
  .joinRow i{font:400 12.5px/1.4 var(--body);color:var(--mute);font-style:normal;display:block;margin-top:3px}
  .joinRow em{font:600 12px/1.3 var(--body);color:var(--ember);font-style:normal;display:block;margin-top:5px}
  .lamps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .lamps i{width:9px;height:16px;border-radius:2px;background:rgba(242,228,204,0.13);display:block}
  .lamps i.lit{background:linear-gradient(180deg,#ffe6a8,#ff9a2e);box-shadow:0 0 9px rgba(255,154,46,0.9)}
  .codeBox{font:600 11px/1.55 var(--mono);color:var(--ember);text-align:left;
    background:rgba(0,0,0,0.32);border:1px solid var(--line);border-radius:12px;
    padding:12px;word-break:break-all;max-height:104px;overflow:auto;-webkit-user-select:all;
    user-select:all}
  .codeRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .note{font:600 12.5px/1.45 var(--body);color:var(--mute);min-height:17px}
  .note.ok{color:var(--ember)}
  .note.bad{color:#e0866a}
  .lede.small{font-size:12.5px}
  .bond{display:flex;gap:5px;justify-content:center;align-items:center}
  .bond i{width:8px;height:8px;border-radius:2px;background:rgba(242,228,204,0.14);display:block}
  .bond i.on{background:var(--ember);box-shadow:0 0 7px rgba(255,181,71,0.8)}

  /* ── the player ────────────────────────────────────────────────── */
  .deck{border:1px solid var(--line);border-radius:16px;padding:14px;
    background:linear-gradient(180deg,rgba(255,181,71,0.07),rgba(24,16,20,0.5))}
  .nowLbl{font:700 9px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;
    color:var(--mute);margin-bottom:7px}
  .nowTitle{font:700 18px/1.2 var(--body);color:var(--bone)}
  .nowGenre{font:500 12px/1.3 var(--body);color:var(--ember);margin-top:3px}
  .bars{display:flex;gap:3px;align-items:flex-end;height:16px;margin:11px 0 4px;
    justify-content:center}
  .bars i{width:3px;background:var(--ember);border-radius:1px;display:block;
    animation:bob .9s ease-in-out infinite}
  .bars.off i{animation:none;height:3px!important;background:#5b4c40}
  @keyframes bob{0%,100%{height:4px}50%{height:16px}}
  .tr{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:8px}
  .tb{width:46px;height:46px;border-radius:50%;cursor:pointer;flex:none;
    border:1px solid var(--line);background:var(--panel);color:var(--bone);
    font:700 15px/1 var(--body);display:grid;place-items:center}
  .tb.big{width:60px;height:60px;font-size:19px;color:#2a1a08;border:none;
    background:linear-gradient(180deg,#ffc86b,#ef9a22);box-shadow:0 0 18px rgba(255,160,50,0.4)}
  .tb:active{background:rgba(255,181,71,0.24)}
  .tb.on{border-color:var(--ember);color:var(--ember)}
  .shelf{display:flex;flex-direction:column;gap:16px;text-align:left}
  .gset > span{display:block;font:700 9px/1 var(--body);letter-spacing:.2em;
    text-transform:uppercase;color:var(--ember);margin:0 0 8px 2px}
  .trk{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;
    border:1px solid var(--line);border-radius:12px;background:transparent;
    cursor:pointer;text-align:left;color:var(--bone);font:600 14px/1.2 var(--body)}
  .trk small{margin-left:auto;font:500 11px/1 var(--mono);color:var(--mute)}
  .trk .vx{font-style:normal;font:700 8px/1 var(--body);letter-spacing:.14em;
    text-transform:uppercase;color:#0f2417;background:#a9dfa2;
    padding:3px 5px;border-radius:4px;margin-left:8px}
  .trk.on{border-color:var(--ember);background:rgba(255,181,71,0.13)}
  .trk.on small{color:var(--ember)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="row"><span class="lbl" id="fireLbl">Fire</span>
      <button class="mini" id="kSnd" aria-label="Sound">♪</button>
      <button class="mini" id="kPause" aria-label="Pause">❙❙</button>
      <span class="num" id="fireNum">60</span></div>
    <div class="bar" id="fireBar"><i></i></div>
    <div id="dawnbar"><i></i></div>
    <div class="row">
      <span class="lbl">Night <b id="nightNum" style="color:var(--bone)">1</b></span>
      <span class="lbl" id="carryLbl">Carrying 0</span>
      <span class="num" id="tillDawn">40s</span>
    </div>
  </div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="banner"></div>
    <div id="road"></div>
  </div>
  <div id="pad">
    <div class="keys">
      <button class="key" id="kL" aria-label="Left">◀</button>
      <button class="key" id="kR" aria-label="Right">▶</button>
    </div>
    <div class="keys">
      <button class="key hop" id="kJ" aria-label="Jump">JUMP</button>
      <button class="key act" id="kA" aria-label="Swing">SWING</button>
    </div>
  </div>
</div>
<div id="veil"><div class="card" id="card"></div></div>
<script>
(function () {
  'use strict';
  var BUILD = 'v2.0.0';

  // ── measurements ──────────────────────────────────────────────────────────
  var TILE = 16;
  var W = TILE * 25;                         // 25 tiles across, always
  var WORLD = TILE * 75;                     // 1200 — three windows of road
  // how tall the window is depends on the phone: a tall screen gets more sky
  var H, GY;
  (function fit() {
    var st = document.getElementById('stage').getBoundingClientRect();
    var wpx = st.width || window.innerWidth || 390;
    var hpx = st.height || (window.innerHeight || 844) * 0.62;
    var tall = Math.round(hpx / (wpx / W) / TILE) * TILE;
    H = Math.max(TILE * 14, Math.min(TILE * 28, tall));
    GY = Math.round(H * 0.75 / TILE) * TILE;   // the grass line
  })();
  var GUY_H = 40, GUY_W = 18;                // 2.5 tiles tall, just over one wide
  var FIREX = Math.round(WORLD * 0.5);       // camp sits at the middle of the world

  var RAMPS = {
    sky:    ['#120c1c', '#1d1430', '#2b1d40', '#3d2a4c', '#553a54'],
    far:    ['#2a2038', '#372a45', '#463456'],
    tree:   ['#1d2a24', '#26382c', '#314736'],
    grass:  ['#243a22', '#31502c', '#3f6635', '#4f7d40'],
    dirt:   ['#2b1d12', '#3a2718', '#4a3220', '#5c4029', '#6e4e33'],
    stone:  ['#38352f', '#4c4841', '#635e55', '#7b7568'],
    tent:   ['#2c4a33', '#3f6b45', '#568c56', '#6fa869'],
    wood:   ['#33210f', '#4a3018', '#654222', '#83572d', '#a06f3d'],
    fire:   ['#8f2b08', '#c94513', '#ef7a22', '#ffb547', '#ffeeb8'],
    skin:   ['#8a5f42', '#b8865a', '#dbab7c', '#f2cfa4'],
    cloth:  ['#5e2018', '#8a3324', '#b84a33', '#d96b4a'],
    hair:   ['#2b1b10', '#43291a', '#5e3a24'],
    dog:    ['#4a2f18', '#6b4423', '#8a5a30', '#a9743f'],
    metal:  ['#2e2b28', '#484440', '#6b665f', '#918b82'],

  // ── him ───────────────────────────────────────────────────────────────────

  var SKINS = [
    { n: 'Fair',  r: ['#a06a4e', '#c98f66', '#e8b98d', '#f7dcb8'] },
    { n: 'Warm',  r: ['#8a5f42', '#b8865a', '#dbab7c', '#f2cfa4'] },
    { n: 'Brown', r: ['#5c3a26', '#7d5333', '#a06d46', '#c08d61'] },
    { n: 'Deep',  r: ['#33200f', '#4d3120', '#68432c', '#875b40'] }
  ];
  var HAIRS = [
    { n: 'Brown',  r: ['#2b1b10', '#43291a', '#5e3a24'] },
    { n: 'Black',  r: ['#14121a', '#221f2c', '#34313f'] },
    { n: 'Ginger', r: ['#5a2408', '#8a3a10', '#bd571d'] },
    { n: 'Fair',   r: ['#6b4a1e', '#9a7431', '#c9a052'] },
    { n: 'Grey',   r: ['#3a3a40', '#5f5f68', '#8e8e97'] }

    { n: 'Rust',    r: ['#5e2018', '#8a3324', '#b84a33', '#d96b4a'] },
    { n: 'Pine',    r: ['#16321f', '#265130', '#387444', '#4f965c'] },
    { n: 'Slate',   r: ['#152a44', '#22436b', '#325f93', '#4a80bb'] },
    { n: 'Mustard', r: ['#4a3208', '#77520f', '#a5761c', '#cf9c33'] },
    { n: 'Plum',    r: ['#331830', '#532d51', '#784773', '#9d6899'] },

    { n: 'None',   r: null },

    { n: 'Red',    r: ['#5e2018', '#a83a26', '#d4694c'] },
    { n: 'Teal',   r: ['#11383a', '#1f6266', '#348c92'] }

  function SK() { return SKINS[LOOK.skin % SKINS.length].r; }
  function HR() { return HAIRS[LOOK.hair % HAIRS.length].r; }

  // arms is 0 (down), or an angle in radians for both arms together
  function guy(px, x, feetY, t, face, mode, step, arms) {

            : (mode === 'jump' || mode === 'kneel' || mode === 'work') ? 0

    // ── legs ────────────────────────────────────────────────────────────────
    function boot(bx, by, h2) {

    if (mode === 'jump') {

    } else if (mode === 'kneel') {
      px(O[0], x - 8, y + 21, 7, 9); px(O[1], x - 7, y + 22, 5, 8);     // back thigh
      px(O[0], x - 13, y + 28, 12, 6); px(O[1], x - 12, y + 29, 10, 4); // shin flat down
      px(H[0], x - 15, y + 30, 6, 4); px(H[1], x - 14, y + 30, 4, 1);
      px(O[0], x, y + 20, 9, 7); px(O[1], x + 1, y + 21, 7, 5);         // front thigh
      px(O[0], x + 5, y + 25, 7, 9); px(O[1], x + 6, y + 26, 5, 8);     // shin down
      px(H[0], x + 3, y + 31, 9, 3); px(H[1], x + 4, y + 31, 6, 1);
    } else if (mode === 'sit') {
      var kx = x + (f > 0 ? 2 : -14);
      px(O[0], kx, y + 27, 14, 8); px(O[1], kx + 1, y + 28, 12, 6);
      var sx = x + (f > 0 ? 12 : -14);

      px(H[0], sx - (f > 0 ? 0 : 2), y + 40, 8, 3);

    box(px, O[1], O[0], x - 9, y + 15, 18, 15);
    px(O[2], x - 8 + (f > 0 ? 9 : 0), y + 16, 8, 13);              // lit down one side
    px(O[3], x - 8 + (f > 0 ? 14 : 0), y + 16, 2, 13);
    px(O[0], x - 1, y + 16, 2, 13);                                // the front seam
    px(O[3], x - 3, y + 19, 2, 2); px(O[3], x - 3, y + 24, 2, 2);  // two buttons
    px(O[0], x - 8, y + 27, 16, 2);                                // belt
    px(C.metal2, x - 3, y + 27, 6, 2); px(C.metal0, x - 2, y + 28, 4, 1);

    // ── arms ────────────────────────────────────────────────────────────────

    if (arms) {                                     // both arms lifted together
      var ax = Math.round(Math.cos(arms) * 9), ay = Math.round(Math.sin(arms) * 9);
      px(O[0], x - 12, y + 16, 4, 4); px(O[0], x + 8, y + 16, 4, 4);
      for (var q2 = 0; q2 < 9; q2++) {

        px(O[0], x - 12 + qx, y + 17 + qy, 4, 4);
        px(O[1], x - 11 + qx, y + 18 + qy, 2, 3);
      }
      px(K[2], x - 12 + ax, y + 17 + ay, 4, 4);
      px(K[3], x - 11 + ax, y + 18 + ay, 2, 2);
    } else {
      px(O[0], x - 12, y + 16 + swing, 4, 11); px(O[1], x - 11, y + 17 + swing, 2, 10);
      px(O[0], x + 8, y + 16 - swing, 4, 11);  px(O[2], x + 9, y + 17 - swing, 2, 10);
      px(O[3], x - 12, y + 24 + swing, 4, 2);  px(O[3], x + 8, y + 24 - swing, 4, 2);  // cuffs
      px(K[1], x - 12, y + 26 + swing, 4, 4);  px(K[2], x + 8, y + 26 - swing, 4, 4);
    }

    // ── head ────────────────────────────────────────────────────────────────
    px(K[1], x - 3, y + 13, 6, 3);                                 // neck
    box(px, K[2], K[0], x - 8, y + 2, 17, 14);
    px(K[3], x - 7 + (f > 0 ? 8 : 0), y + 3, 8, 12);               // lit cheek
    px(K[1], x - 7, y + 14, 15, 1);                                // under the jaw
    px(K[1], x + (f > 0 ? -10 : 8), y + 8, 2, 4);                  // the far ear
    px(K[0], x + (f > 0 ? -10 : 8), y + 11, 2, 1);

    var blink = (t % 4.1) < 0.14 || (t % 4.1) > 4.02;
    var ex = x - 5 + (f > 0 ? 3 : 0), ey0 = y + 8;

    if (blink) {

    } else {
      px('#f4f2ff', ex, ey0, 3, 3); px('#f4f2ff', ex + 6, ey0, 3, 3);
      var pd = f > 0 ? 1 : 0;

      px('#ffffff', ex + pd, ey0, 1, 1); px('#ffffff', ex + 6 + pd, ey0, 1, 1);

      px(H[1], x - 8 - (f > 0 ? 0 : 1), y + 3, 1, sideH - 2);

  }

  function armful(px, x, feetY, n, face) {
    var f = face < 0 ? -1 : 1, K = SK(), O = CO();
    var cx = x + f * 4;

  // ── the fire ──────────────────────────────────────────────────────────────
  // A proper flame: a bed of coals, three logs leaning in, then a body of fire
  // drawn column by column — tall in the middle, ragged at the edges, white at
  // the heart and red where it thins out. Licks break off the top and die.
  function flameCol(u, t2, lvl, seed) {
    // u is -1..1 across the fire. A bell, roughened, breathing.
    var bell = Math.pow(Math.max(0, 1 - u * u), 0.62);
    var wob = Math.sin(t2 * 6.1 + u * 5.2 + seed) * 0.10

  function campfire(px, fx, t, lvl, baseY, day, lean) {

      var sy2 = baseY - 3 + Math.round(Math.sin(sa) * 3);

        px(C.wood0, lx, ly, 2, 5);
        px(k2 > 13 ? C.fire1 : C.wood2, lx, ly + 1, 2, 3);

    px(C.wood2, fx - 15, baseY - 5, 30, 4);
    px(C.wood3, fx - 14, baseY - 5, 28, 1);

        fx + Math.round(Math.sin(ep * 0.4 + e * 2) * 7) + Math.round(lean * ep * 0.2), ey | 0, 1, 1);

  // one warm light at the fire, a smaller one on his lamp
  function lightPass(ctx, fx, fy, reach, lx, ly, lamp, dawn) {
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    var lm = ctx.createRadialGradient(fx, fy, 8, fx, fy, reach);
    lm.addColorStop(0, '#ffffff'); lm.addColorStop(0.30, '#f0d5b8');
    lm.addColorStop(0.62, '#a68a7c'); lm.addColorStop(1, dawn);
    ctx.fillStyle = lm; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

      pm.addColorStop(0.5, 'rgba(255,150,60,' + (0.11 * lamp).toFixed(3) + ')');

    bl.addColorStop(1, 'rgba(255,90,30,0)');

  // ── the shape of the road ─────────────────────────────────────────────────
  // Terraced, the way that game does it: a step of one tile he walks up on his
  // own, a step of two he has to jump. The camp itself stays flat.
  var RISE = [
    { x0:   30, x1:  330, up: 1 },
    { x0:   64, x1:  286, up: 2 },
    { x0:  108, x1:  212, up: 3 },
    { x0:  300, x1:  356, up: 2 },      // a ledge on its own, two tiles up
    { x0:  848, x1: 1010, up: 1 },
    { x0:  880, x1:  964, up: 2 },
    { x0: 1024, x1: 1104, up: 2 },      // another, out east
    { x0: 1044, x1: 1084, up: 3 },
    { x0: 1140, x1: 1200, up: 1 }
  ];
  var DIP = [{ x0: 1108, x1: 1140, down: 1 }];   // a dry creek
  var FLAT0 = FIREX - 258, FLAT1 = FIREX + 258;  // the camp, level from end to end
  var GROUND;
  function buildGround() {
    GROUND = new Int16Array(WORLD);
    for (var x = 0; x < WORLD; x++) {
      var lvl = 0, i;
      if (x < FLAT0 || x > FLAT1) {
        for (i = 0; i < RISE.length; i++)
          if (x >= RISE[i].x0 && x < RISE[i].x1) lvl = Math.max(lvl, RISE[i].up);
        for (i = 0; i < DIP.length; i++)
          if (x >= DIP[i].x0 && x < DIP[i].x1) lvl = Math.min(lvl, -DIP[i].down);
      }
      GROUND[x] = GY - lvl * TILE;
    }
  }
  buildGround();
  function groundY(x) {
    var i = x | 0;
    return GROUND[i < 0 ? 0 : i >= WORLD ? WORLD - 1 : i];
  }

  // ── the ground, baked once across the whole world ─────────────────────────
  var terrain = document.createElement('canvas');
  terrain.width = WORLD; terrain.height = H;
  var tctx = terrain.getContext('2d');
  var tpx = mkPx(tctx);

  function rgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function bakeTerrain() {
    tctx.clearRect(0, 0, WORLD, H);
    var soil = [C.grass3, C.grass2, C.grass1, C.grass0, C.dirt0, C.dirt1, C.dirt2, C.dirt3, C.dirt4].map(rgb);
    var wall = [[52, 36, 22], [60, 42, 27], [69, 49, 31]];
    var TOP = GY - TILE * 3;

  var PINE = ['#1a2820', '#233729', '#2e4835', '#3c5c42'];

  // ── the bestiary, drawn ───────────────────────────────────────────────────
  function shadeSprite(px, sh, t, k, lit) {
    var B = sh.b || BEASTS[0], ex = sh.x | 0, ey = sh.y | 0;
    var hurtNow = sh.flash > 0 && Math.sin(t * 60) > 0;
    var A = hurtNow ? ['#ffd8d8', '#ffb0b0', '#ff8c8c', '#fff'] :
            sh.burn > 0 ? [C.fire1, C.fire2, C.fire3, '#fff3c8'] :
            [C.shade0, C.shade1, C.shade2, '#e8e0ff'];
    var bl = (t * 1.3 + k) % 5 < 0.18;

    if (B.id === 'crawler') {                        // low, wide, many legs
      var sc = Math.sin(t * 14 + sh.ph);
      disc(px, A[0], ex, ey, 11, 6);
      disc(px, A[1], ex, ey - 1, 9, 5);
      px(A[2], ex - 6, ey - 3, 12, 2);
      for (var lg = 0; lg < 6; lg++) {
        var lx = ex - 9 + lg * 4, dn = (lg % 2 ? sc : -sc) > 0 ? 3 : 1;
        px(A[0], lx, ey + 3, 2, dn + 2);
      }
      if (!bl) { px(A[3], ex - 4, ey - 3, 2, 2); px(A[3], ex + 2, ey - 3, 2, 2); }
      return;
    }
    if (B.id === 'moth') {                           // two beating wings
      var flap = Math.abs(Math.sin(t * 9 + sh.ph));
      var wh = 4 + Math.round(flap * 8), ww = 13 - Math.round(flap * 4);
      for (var wr = -wh; wr <= wh; wr++) {          // a wing, not a plank
        var wu = Math.abs(wr) / wh;
        var span = Math.round(ww * (1 - wu * wu * 0.72)) - (wr > wh * 0.4 ? 3 : 0);
        if (span < 1) continue;
        px(A[0], ex - 2 - span, ey + wr, span, 1);
        px(wr < 0 ? A[1] : A[0], ex - 1 - span, ey + wr, span - 1, 1);
        px(A[0], ex + 3, ey + wr, span, 1);
        px(wr < 0 ? A[1] : A[0], ex + 3, ey + wr, span - 1, 1);
        if (Math.abs(wr) < 2) { px(A[2], ex - 2 - span, ey + wr, span, 1); px(A[2], ex + 3, ey + wr, span, 1); }
      }
      disc(px, A[0], ex, ey, 3, 6); disc(px, A[1], ex, ey - 1, 2, 4);
      if (!bl) { px(A[3], ex - 2, ey - 4, 2, 2); px(A[3], ex + 1, ey - 4, 2, 2); }
      px(A[2], ex - 3, ey - 8, 2, 4); px(A[2], ex + 2, ey - 8, 2, 4);   // antennae
      return;
    }
    if (B.id === 'hollow') {                         // tall, thin, hooded
      px(A[0], ex - 5, ey - 12, 11, 30);
      px(A[1], ex - 4, ey - 11, 9, 28);
      px(A[2], ex - 4, ey - 11, 3, 26);
      disc(px, A[0], ex, ey - 14, 7, 7); disc(px, A[1], ex, ey - 15, 6, 6);
      px(A[0], ex - 7, ey - 16, 15, 5);              // the hood
      px(A[1], ex - 6, ey - 15, 13, 3);
      if (!bl) { px(A[3], ex - 4, ey - 13, 3, 2); px(A[3], ex + 2, ey - 13, 3, 2); }
      var sway = Math.round(Math.sin(t * 2 + sh.ph) * 3);
      px(A[0], ex - 8 + sway, ey - 6, 4, 13); px(A[0], ex + 5 + sway, ey - 6, 4, 13);
      return;
    }
    if (B.id === 'frost') {                          // spiked, and it fumes cold
      var F = hurtNow ? A : ['#2a4a5e', '#3f6c86', '#69a3c0', '#d6f0ff'];
      disc(px, F[0], ex, ey, 11, 11); disc(px, F[1], ex, ey - 1, 9, 9);
      for (var sp2 = 0; sp2 < 7; sp2++) {
        var a2 = sp2 * 0.9 + t * 0.4;
        px(F[2], ex + Math.round(Math.cos(a2) * 11), ey + Math.round(Math.sin(a2) * 11), 3, 3);
      }
      if (!bl) { px(F[3], ex - 4, ey - 3, 3, 3); px(F[3], ex + 2, ey - 3, 3, 3); }
      for (var fz = 0; fz < 3; fz++) {
        var fy = ((t * 22 + fz * 9) % 26);
        px('#a8d4e6', ex - 6 + fz * 6, ey + 8 + fy, 1, 2);
      }
      return;
    }
    if (B.id === 'gnasher') {                        // jaws, and plenty of them
      var chomp = Math.abs(Math.sin(t * 11 + sh.ph)) * 5;
      disc(px, A[0], ex, ey, 13, 9); disc(px, A[1], ex, ey - 1, 11, 8);
      px(A[0], ex - 12, ey - 2 - Math.round(chomp), 24, 5);     // upper jaw
      px(A[0], ex - 12, ey + 2 + Math.round(chomp), 24, 5);     // lower
      for (var tk = 0; tk < 6; tk++) {
        px('#f2ecff', ex - 10 + tk * 4, ey + 1 - Math.round(chomp), 2, 3);
        px('#f2ecff', ex - 8 + tk * 4, ey + 1 + Math.round(chomp), 2, 3);
      }
      if (!bl) { px(A[3], ex - 7, ey - 7, 3, 3); px(A[3], ex + 4, ey - 7, 3, 3); }
      return;
    }
    if (B.id === 'quiet') {                          // only its eyes, until the light finds it
      if (lit) {
        disc(px, A[0], ex, ey, 10, 13); disc(px, A[1], ex, ey - 2, 8, 10);
        px(A[0], ex - 9, ey + 6, 18, 8);
      }
      if (!bl) {
        px('#fff', ex - 5, ey - 4, 3, 2); px('#fff', ex + 2, ey - 4, 3, 2);
        px('#b9a6ff', ex - 5, ey - 5, 3, 1); px('#b9a6ff', ex + 2, ey - 5, 3, 1);
      }
      return;
    }
    if (B.id === 'thief') {                          // small, quick, carrying nothing yet
      disc(px, A[0], ex, ey, 8, 6); disc(px, A[1], ex, ey - 1, 6, 5);
      px(A[0], ex + 5, ey - 4, 6, 5); px(A[1], ex + 6, ey - 4, 4, 3);
      px(A[2], ex - 9, ey - 2, 5, 2);
      var run = Math.sin(t * 18 + sh.ph) > 0 ? 2 : 0;
      px(A[0], ex - 4, ey + 4, 2, 3 + run); px(A[0], ex + 2, ey + 4, 2, 5 - run);
      if (!bl) { px('#ffd86a', ex + 7, ey - 3, 2, 2); }
      return;
    }
    // the plain shade, as it always was
    var tail = Math.round(Math.sin(t * 4 + sh.ph) * 3);
    disc(px, A[0], ex, ey + 6 + tail, 7, 8);
    disc(px, A[0], ex, ey, 11, 10);
    disc(px, A[1], ex, ey - 1, 10, 8);
    disc(px, A[2], ex, ey - 4, 7, 4);
    if (!bl) {
      px(A[2], ex - 5, ey - 3, 4, 4); px(A[2], ex + 2, ey - 3, 4, 4);
      px(A[3], ex - 5, ey - 3, 2, 2); px(A[3], ex + 2, ey - 3, 2, 2);
    }
  }

  // ── what is in his hand, mid-swing ────────────────────────────────────────
  function weapon(px, hx, hy, f, W, sw) {
    var u = sw > 0 ? 1 - sw / W.dur : -1;
    var ang;                                          // resting, then over and down
    if (u < 0) ang = f > 0 ? -0.35 : Math.PI + 0.35;
    else {
      var a = u < 0.42 ? lerp(-0.6, -2.45, u / 0.42)  // up and back over the shoulder
                       : lerp(-2.45, 0.30, (u - 0.42) / 0.58);
      ang = f > 0 ? a : Math.PI - a;
    }
    var sx = hx, sy = hy - GUY_H + 19;
    var gx = sx + Math.cos(ang) * 9, gy = sy + Math.sin(ang) * 9;
    var len = W.reach - 14;
    var tipx = gx + Math.cos(ang) * len, tipy = gy + Math.sin(ang) * len;
    var cx2 = Math.cos(ang), cy2 = Math.sin(ang);

    // The sweep: a thick burning crescent, not a scratch. How wide it is is
    // how hard the thing hits, so a torch leaves half a wheel of fire behind.
    var arcW = W.arc || 1;
    if (u >= 0 && u > 0.30 && u < 0.86) {
      for (var q = 1; q <= 9; q++) {
        var back = u - q * 0.038;
        if (back < 0.42) continue;
        var ab = lerp(-2.45, 0.30, (back - 0.42) / 0.58);
        var an = f > 0 ? ab : Math.PI - ab;
        var fade = 1 - q / 9;
        var band = Math.max(1, Math.round(arcW * (1 + fade * 3.4)));
        for (var rr = 0; rr < band; rr++) {
          var rad = len + 9 - rr * 3;
          px(fade > 0.62 ? '#fffbe6' : fade > 0.4 ? C.fire4 : fade > 0.2 ? C.fire3 : C.fire1,
             Math.round(sx + Math.cos(an) * rad) - 1, Math.round(sy + Math.sin(an) * rad) - 1,
             fade > 0.35 ? 3 : 2, fade > 0.35 ? 3 : 2);
        }
      }
    }
    for (var i = -5; i < len; i++)                    // the shaft
      px(i > len - 6 ? C.wood1 : C.wood0, Math.round(gx + cx2 * i), Math.round(gy + cy2 * i), 2, 2);

    if (W.kind === 'axe') {
      px(C.metal0, tipx - 4, tipy - 5, 9, 10);
      px(C.metal2, tipx - 3, tipy - 4, 7, 5);
      px(C.metal3, tipx + 2, tipy - 5, 3, 10);
    } else if (W.kind === 'poker') {
      px(C.metal0, tipx - 2, tipy - 2, 5, 5);
      px(C.fire2, tipx - 1, tipy - 1, 3, 3);
      px(C.fire4, tipx, tipy, 2, 2);
    } else if (W.kind === 'light') {
      px(C.metal0, tipx - 5, tipy - 6, 11, 13);
      px(C.fire3, tipx - 3, tipy - 4, 7, 9);
      px(C.fire4, tipx - 2, tipy - 3, 5, 7);
      px('#fffbe6', tipx - 1, tipy - 2, 3, 4);
      px(C.metal2, tipx - 5, tipy - 7, 11, 2);
    } else if (W.kind === 'bow') {
      px(C.wood1, tipx - 1, tipy - 7, 2, 15);
      px(C.wood0, tipx - 3, tipy - 6, 2, 3);
      px(C.wood0, tipx - 3, tipy + 4, 2, 3);
      px(C.fire3, tipx + 1, tipy - 1, 3, 3);
    } else if (W.kind === 'lock') {
      px(C.wood0, tipx - 8, tipy - 2, 12, 5);
      px(C.metal0, tipx + 2, tipy - 1, 8, 3);
      px(C.metal2, tipx + 3, tipy - 1, 6, 1);
      px(C.fire2, tipx - 3, tipy - 4, 3, 3);
    } else {
      // the torch: a proper head of pitch, wide and bright
      disc(px, C.fire1, tipx - 5, tipy - 5, 11, 11);
      disc(px, C.fire2, tipx - 4, tipy - 4, 9, 9);
      disc(px, C.fire3, tipx - 3, tipy - 3, 7, 7);
      disc(px, C.fire4, tipx - 2, tipy - 2, 5, 5);
      px('#fffbe6', tipx - 1, tipy - 1, 3, 3);
    }
    return { x: tipx, y: tipy };
  }

  // One of the five great lamps: a stone leg, a cage, and either four years
  // of nothing in it or the reason you walked here.
  function lampPost(px, x, lit, glow) {
    if (x < -34 || x > W + 34) return;
    var base = GY, top = GY - LAMP_H;
    for (var i = 0; i < LAMP_H - 16; i++) {           // the leg, tapering
      var wdt = 11 - Math.round(i / 12);
      px(i % 9 < 4 ? '#4b4352' : '#3d3644', x - (wdt >> 1), base - 4 - i, wdt, 1);
    }
    px('#2f2a36', x - 9, base - 5, 18, 5);            // the footing
    px('#5a5162', x - 8, base - 6, 16, 2);
    px('#4b4352', x - 8, top + 4, 16, 3);             // the cage
    px('#4b4352', x - 8, top - 10, 16, 3);
    for (var b2 = -7; b2 <= 7; b2 += 3) px('#413a4c', x + b2, top - 8, 1, 12);
    px('#2f2a36', x - 6, top - 15, 12, 5);            // the hood
    px('#5a5162', x - 5, top - 14, 10, 2);
    if (lit) {
      var f = 0.7 + 0.3 * Math.sin(t * 7.3 + x);
      disc(px, C.fire1, x - 6, top - 6, 12, 12);
      disc(px, C.fire3, x - 4, top - 5, 8, 9);
      disc(px, C.fire4, x - 3, top - 4, 6, 7);
      disc(px, '#fffbe6', x - 1 - (f > 0.85 ? 1 : 0), top - 2, 3, 4);
      for (var q = 0; q < 3; q++) {
        var sy2 = top - 16 - ((t * 26 + q * 13 + x) % 22);
        px(C.fire2, x - 2 + ((q * 7 + Math.round(t * 3)) % 5), Math.round(sy2), 1, 1);
      }
    } else {
      px('#241f2b', x - 4, top - 5, 8, 9);            // cold, and it shows
      if (glow) { disc(px, C.fire1, x - 3, top - 3, 6, 5); }
    }
  }

  // left standing in the block between jobs
  function axeInBlock(px, x) {
    if (x < -14 || x > W + 14) return;
    px(C.wood0, x + 3, GY - 34, 3, 19);
    px(C.wood2, x + 4, GY - 33, 1, 18);
    px(C.metal0, x + 1, GY - 39, 9, 7);
    px(C.metal2, x + 2, GY - 38, 7, 3);
    px(C.metal3, x + 8, GY - 38, 2, 5);
  }

  // a stack of split logs by the fire, however many he got through
  function woodpile(px, x, n) {
    if (n <= 0) return;
    var rows = [3, 2, 1], laid = 0;
    for (var r = 0; r < rows.length && laid < n; r++) {
      var wide = Math.min(rows[r], n - laid);
      var y2 = GY - 6 - r * 9;
      for (var i = 0; i < wide; i++) {
        var lx = Math.round(x - (wide - 1) * 5 + i * 10);
        disc(px, C.wood0, lx, y2, 5, 5);                        // the log, end on
        disc(px, C.wood2, lx, y2, 4, 4);
        disc(px, C.wood3, lx, y2, 2, 2);
        px(C.wood1, lx - 3, y2 - 1, 2, 1); px(C.wood1, lx + 2, y2 + 1, 2, 1);
      }
      laid += wide;
    }
  }

  function cfgFor(n) {
    if (n <= NIGHTS.length) return NIGHTS[n - 1];
    var k = n - NIGHTS.length, b = NIGHTS[NIGHTS.length - 1];
    return {
      // Past the Point you are strong and you are going back for people, so
      // the road has to keep up with the help you keep gaining.
      len: Math.min(90, b.len + k * 1.5), drain: Math.min(7.0, b.drain + k * 0.13),
      gap: Math.max(1.1, b.gap - k * 0.055), spd: Math.min(40, b.spd + k * 0.5),
      wood: Math.max(1.3, b.wood - k * 0.035), lying: 7,
      wx: ['clear', 'snow', 'wind', 'fog', 'clear', 'sleet'][k % 6],
      name: 'Rings past the Point', note: 'Past the twenty now. Somebody has to keep them dry.'
    };
  }

  function musing() {
    var pool = [];
    for (var i = 0; i < MUSINGS.length; i++) {
      var M = MUSINGS[i];
      if (S.n < M.at) continue;
      if (M.need && !tag(M.need)) continue;
      if (MEM && MEM.tags['said' + i] && Math.random() < 0.8) continue;   // prefer new ones
      pool.push({ i: i, s: M.s });
    }
    if (!pool.length) return null;
    var got = pool[Math.floor(Math.random() * pool.length)];
    if (MEM) { MEM.tags['said' + got.i] = 1; }
    return got.s;
  }

  // ── him, and you ──────────────────────────────────────────────────────────

  // road has somewhere it is going and he tells you where in his own time.

  function newMem() {

  }

  function fill(str) {
    return str.replace(/\{you\}/g, MEM && MEM.you ? MEM.you : 'friend')
              .replace(/\{him\}/g, HIM.name);
  }

  function wepById(id) {
    for (var i = 0; i < WEAPONS.length; i++) if (WEAPONS[i].id === id) return WEAPONS[i];
    return WEAPONS[0];
  }
  function owned(id) { return id === 'torch' || (save.arms && save.arms[id] != null); }
  function armLvl(id) { return (save.arms && save.arms[id]) || 0; }
  // what a weapon actually does once he has worked on it
  function wepStats(id) {
    var B = wepById(id), L = armLvl(id), o = {};
    for (var k in B) o[k] = B[k];
    o.lvl = L;
    o.reach = B.reach + L * 5;
    o.cd = B.cd * (1 - L * 0.09);
    o.dmg = B.dmg + (L >= 2 ? 1 : 0);
    o.sdmg = (B.sdmg || 0) + (L >= 2 ? 1 : 0);
    o.hits = B.hits + (L >= 3 ? 2 : L >= 1 ? 1 : 0);
    o.kb = B.kb + L * 7;
    if (B.pellets) o.pellets = B.pellets + L;
    if (B.auto) o.auto = B.auto * (1 - L * 0.12);
    if (B.range) o.range = B.range + L * 24;
    return o;
  }
  function wepFor(n) {                                // what he is carrying tonight
    var id = save.wep && owned(save.wep) ? save.wep : 'torch';
    return wepStats(id);
  }
  function wepTier(n) {
    var k = 0;
    for (var i = 0; i < WEAPONS.length; i++) if (owned(WEAPONS[i].id)) k = i;
    return k;
  }
  // anything he could buy tonight but has not
  function offered(n) {
    var out = [];
    for (var i = 0; i < WEAPONS.length; i++) {
      var Wp = WEAPONS[i];
      if (n >= Wp.at && !owned(Wp.id)) out.push(Wp);
    }
    return out;
  }

  // ── the parts ──────────────────────────────────────────────────────────
  function bassNote(ch, beat, next) {
    var base = 28 + ch.root, t = ch.d.tones, n;
    if (beat === 0) n = base;
    else if (beat === 1) n = base + anyOf([t[2], t[1], t[3]]);
    else if (beat === 2) n = base + anyOf([t[2], t[3], t[1], 5]);
    else {
      var target = 28 + next.root;                 // chromatic approach into the next bar
      while (target < base - 6) target += 12;
      while (target > base + 8) target -= 12;
      n = target + anyOf([-1, 1, -2, 2]);
    }
    while (n < 28) n += 12;
    while (n > 50) n -= 12;
    return n;
  }
  function voicing(ch) {
    var d = ch.d, base = 48 + ch.root;             // rootless, left-hand register
    var v = [base + d.tones[1], base + d.tones[3], base + d.tones[2] + 12];
    if (d.ext.length && Math.random() < 0.65) v.push(base + d.ext[0]);
    return v.map(function (m) { while (m < 52) m += 12; while (m > 80) m -= 12; return m; });
  }

    var sc = ch.d.scale, cands = [];
    for (var oct = 4; oct <= 6; oct++) {
      for (var i = 0; i < sc.length; i++) {
        var m = 12 * oct + ch.root + sc[i];
        if (m >= 68 && m <= 88) cands.push(m);
      }
    }
    if (!cands.length) return MUS.lead;
    cands.sort(function (x, y) { return Math.abs(x - MUS.lead) - Math.abs(y - MUS.lead); });
    var n = cands[Math.floor(Math.random() * Math.min(4, cands.length))];   // mostly stepwise
    MUS.lead = n;
    return n;
  }

  function playBeat(t, spb) {
    var T = TUNES[MUS.tune];
    // leave a breadcrumb so anything watching can find the pulse later
    MUS.sched.push({ t: t, beat: MUS.beat, bar: MUS.bar, spb: spb });
    if (MUS.sched.length > 24) MUS.sched.shift();

    var G = genreOf(T);
    var beat = MUS.beat, bar = MUS.bar, meter = T.meter || 4;
    var last = meter - 1;
    var ch = chordAt(bar);
    var next = chordAt(bar + (beat === last ? 1 : 0));
    var swung = spb * (T.feel === 'swing' ? 0.64 : 0.5);
    var backbeat = meter === 4 ? (beat === 1 || beat === 3) : (beat === 1);
    var vg = T.gain || 1;
    // lo-fi and trip-hop drag behind the beat like tape
    var lag = (T.genre === 'Lo-fi' || T.genre === 'Trip-hop') ? 0.022 : 0;

    // ── the pad breathes once a bar, under everything
    if (T.pad && beat === 0) {
      var pv = voicing(ch).slice(0, 3).map(function (m) { return m - 12; });
      pad(t, pv, spb * meter * 0.98, (0.028 * T.pad) * vg);
    }

    // ── bass, in this genre's voice
    var bn = bassNote(ch, beat, next);
    var root = 28 + ch.root;
    if (G.bass !== 'none') {
      if (T.kit === 'bossa' || T.kit === 'latin') {
        if (beat === 0) play(G.bass, t, mtof(root), spb * 1.4, 0.24 * vg);
        else if (beat === 2) play(G.bass, t, mtof(bn), spb * 1.2, 0.2 * vg);
        else if (beat === last) play(G.bass, t + swung, mtof(bn), spb * 0.6, 0.16 * vg);
      } else if (T.kit === 'soft' || T.kit === 'none') {
        if (beat === 0 || beat === Math.floor(meter / 2)) play(G.bass, t, mtof(bn), spb * 1.5, 0.2 * vg);
      } else if (T.kit === 'lofi') {
        if (beat === 0) play(G.bass, t + lag, mtof(root), spb * 1.8, 0.3 * vg);
        else if (beat === 2) play(G.bass, t + swung * 0.5 + lag, mtof(bn), spb * 1.1, 0.22 * vg);
      } else if (T.kit === 'dub') {
        if (beat === 0) play(G.bass, t, mtof(root), spb * 2.2, 0.36 * vg);
        else if (beat === 2) play(G.bass, t + swung, mtof(bn), spb * 0.9, 0.26 * vg);
      } else if (T.kit === 'funk') {
        if (beat === 0) { play(G.bass, t, mtof(root), spb * 0.5, 0.3 * vg);

        else if (beat === 1) play(G.bass, t + swung, mtof(bn), spb * 0.42, 0.22 * vg);
        else if (beat === last) play(G.bass, t, mtof(bn), spb * 0.6, 0.24 * vg);
      } else if (T.kit === 'rock') {
        play(G.bass, t, mtof(root - 12), spb * 0.62, 0.30 * vg);
        if (beat === last || Math.random() < 0.3)

      } else if (T.kit === 'slow') {
        if (beat === 0) play(G.bass, t, mtof(root - 12), spb * 2.2, 0.26 * vg);
        else if (beat === 2) play(G.bass, t, mtof(bn - 12), spb * 1.6, 0.2 * vg);
      } else {
        play(G.bass, t, mtof(bn), spb * 0.9, 0.24 * vg);          // walking
      }
    }

    // ── drums
    if (T.kit === 'brushes') {
      ride(t, 0.075 * vg);
      if (backbeat) { ride(t + swung, 0.05 * vg); hat(t, 0.035 * vg); brush(t, spb * 0.7, 0.028 * vg); }
    } else if (T.kit === 'bossa') {
      shaker(t, 0.03 * vg); shaker(t + swung, 0.022 * vg);
      if (beat === 0) kick(t, 0.06 * vg);
      if (beat === 2) kick(t + swung, 0.045 * vg);
      if (backbeat) rim(t, 0.035 * vg);
    } else if (T.kit === 'latin') {
      shaker(t, 0.028 * vg); shaker(t + swung, 0.024 * vg);
      if (beat === 0 || beat === 2) kick(t, 0.05 * vg);
      conga(t + swung, beat % 2 ? 210 : 160, 0.05 * vg);
      if (backbeat) conga(t, 300, 0.035 * vg);
      if (beat === 0 || beat === 3) clave(t + (beat === 3 ? swung : 0), 0.026 * vg);
    } else if (T.kit === 'lofi') {
      if (beat === 0) kick(t + lag, 0.062 * vg);
      if (beat === 2) kick(t + swung * 0.5 + lag, 0.042 * vg);
      if (backbeat) { brush(t + lag, spb * 0.5, 0.034 * vg); rim(t + lag, 0.03 * vg); }
      shaker(t, 0.014 * vg);
    } else if (T.kit === 'dub') {
      if (beat === 0) kick(t, 0.062 * vg);
      if (beat === last) kick(t + swung, 0.04 * vg);
      if (backbeat) rim(t, 0.045 * vg);
      shaker(t + swung, 0.012 * vg);
    } else if (T.kit === 'funk') {
      if (beat === 0) kick(t, 0.062 * vg);
      if (beat === 1) kick(t + swung, 0.05 * vg);
      if (beat === 2 && Math.random() < 0.5) kick(t + swung, 0.036 * vg);
      if (backbeat) { rim(t, 0.045 * vg); tamb(t, 0.02 * vg); }

    } else if (T.kit === 'rock') {
      if (beat === 0) { kick(t, 0.075 * vg); if (bar % 4 === 0) crash(t, 0.05 * vg); }
      if (beat === 2) kick(t, 0.062 * vg);
      if (beat === 2 && Math.random() < 0.35) kick(t + swung, 0.04 * vg);
      if (backbeat) snare(t, 0.06 * vg);
      hat(t, 0.03 * vg); hat(t + swung, 0.024 * vg);
      if (beat === last && Math.random() < 0.18) { tom(t + swung, 180, 0.05 * vg); tom(t + swung * 1.4, 140, 0.05 * vg); }
    } else if (T.kit === 'slow') {
      if (beat === 0) kick(t, 0.062 * vg);
      if (backbeat) snare(t, 0.045 * vg);
      if (beat === 2) kick(t + swung, 0.034 * vg);
      hat(t + swung, 0.017 * vg);
    } else if (T.kit === 'none') {

    } else {

      if (backbeat) brush(t, spb * 0.9, 0.022 * vg);
      shaker(t, 0.014 * vg);

    // ── comping, again in this genre's voice
    var v = voicing(ch), i, q;
    if (T.comp === 'arp') {

  function musicTick() {

    if (MUS.worst == null || MUS.head < MUS.worst) MUS.worst = MUS.head;

    // If beats have already come due, the thread was held up. Never post them
    // late \u2014 walk the count on in silence and come back in on the next beat
    // that is still ahead, so the bar and the chord stay where they should be.
    if (MUS.next < now) {

      var skipped = 0;

    var guard = 0;
