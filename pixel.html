<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Night Watch</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f0a12" />
<style>
  :root{
    --bg:#0f0a12; --bone:#f2e4cc; --mute:#9a8676; --ember:#ffb547; --core:#ffeeb8;
    --danger:#e0561c; --line:rgba(242,228,204,0.16); --panel:rgba(24,16,20,0.9);
    --body:-apple-system,"SF Pro Text",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--bone);
    font-family:var(--body);overscroll-behavior:none;touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(var(--safeT) + 8px) 0 calc(var(--safeB) + 8px)}

  /* ── the readout ─────────────────────────────────────────────── */
  #hud{flex:none;padding:0 14px 8px;display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:10px}
  .lbl{font:700 9px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .num{margin-left:auto;font:700 15px/1 var(--mono);color:var(--bone)}
  .bar{height:12px;border-radius:2px;background:rgba(242,228,204,0.1);
    border:1px solid rgba(242,228,204,0.14);overflow:hidden}
  .bar i{display:block;height:100%;width:60%;transition:width .12s linear;
    background:linear-gradient(90deg,#c94513,#ef7a22 55%,#ffb547)}
  .bar.low i{background:linear-gradient(90deg,#8f2b08,#e0561c);animation:pulse .55s infinite alternate}
  @keyframes pulse{to{opacity:.55}}
  #dawnbar{height:5px;border-radius:2px;background:rgba(242,228,204,0.08);overflow:hidden}
  #dawnbar i{display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#3a2230,#b4646e 58%,#ffd6a0)}

  /* ── the world ───────────────────────────────────────────────── */
  #stage{flex:1;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;min-height:0;
    background:radial-gradient(120% 60% at 50% 22%,rgba(70,38,26,0.5),rgba(15,10,18,0) 70%)}
  #view{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    width:100%;height:auto;max-height:calc(100% - 34px);object-fit:contain;background:#0c0810}

  #banner{position:absolute;left:0;right:0;top:14%;text-align:center;padding:0 22px;
    pointer-events:none;opacity:0;transition:opacity .5s}
  #banner.on{opacity:1}
  #banner b{display:block;font:800 19px/1.2 var(--body);color:#fff6e6;
    text-shadow:0 2px 3px #000,0 3px 14px rgba(0,0,0,0.9)}
  #banner span{display:block;margin:5px auto 0;max-width:20em;
    font:600 11.5px/1.45 var(--body);color:var(--core);
    text-shadow:0 2px 3px #000,0 3px 12px rgba(0,0,0,0.9)}

  /* ── the road, twenty nights of it ───────────────────────────── */
  #road{flex:none;display:flex;gap:5px;justify-content:center;align-items:center;
    padding:13px 16px 0;width:100%}
  #road i{width:9px;height:9px;border-radius:2px;display:block;
    background:rgba(242,228,204,0.12);transition:background .3s}
  #road i.done{background:rgba(255,181,71,0.72)}
  #road i.now{background:var(--core);box-shadow:0 0 9px rgba(255,181,71,0.9)}

  /* ── controls ────────────────────────────────────────────────── */
  #pad{flex:none;display:flex;align-items:flex-end;justify-content:space-between;
    padding:10px 16px 0;gap:12px}
  .keys{display:flex;gap:12px;align-items:flex-end}
  .key{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--panel);color:var(--bone);
    font:700 26px/1 var(--body);cursor:pointer;transition:transform .06s,background .1s}
  .key:active,.key.on{transform:scale(.94);background:rgba(255,181,71,0.2);border-color:var(--ember)}
  .key.act{width:88px;height:88px;border-radius:25px;color:var(--ember);
    font:700 11px/1.35 var(--body);letter-spacing:.13em;white-space:pre-line;
    background:radial-gradient(120% 120% at 50% 20%,rgba(120,50,10,0.9),rgba(24,16,20,0.9));
    border-color:rgba(255,181,71,0.5)}
  .key.act.cool{color:#7d6a56;border-color:var(--line);background:var(--panel)}
  .key.hop{width:68px;height:68px;border-radius:19px;color:#cbbba4;
    font:700 10px/1 var(--body);letter-spacing:.12em}
  .key.act.go{color:#2a1a08;border-color:#ffc86b;
    background:linear-gradient(180deg,#ffc86b,#ef9a22);
    box-shadow:0 0 22px rgba(255,160,50,0.45)}

  /* ── cards ───────────────────────────────────────────────────── */
  #veil{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:22px;
    background:radial-gradient(120% 90% at 50% 45%,rgba(34,19,11,0.8),rgba(9,5,4,0.96) 70%);
    overflow-y:auto;transition:opacity .3s}
  #veil.hide{opacity:0;pointer-events:none}
  .card{width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:14px}
  .eyebrow{font:700 10px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--ember)}
  h1{font:800 40px/1.04 var(--body);letter-spacing:-.02em}
  h1 em{font-style:normal;color:var(--ember);display:block}
  .lede{font:400 15px/1.5 var(--body);color:var(--mute)}
  .tally{display:flex;gap:8px}
  .tally div{flex:1;padding:11px 6px;border:1px solid var(--line);border-radius:12px}
  .tally span{display:block;font:700 8px/1 var(--body);letter-spacing:.14em;
    text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .tally b{font:700 19px/1 var(--mono)}
  button.go{padding:17px;border-radius:15px;border:none;cursor:pointer;
    font:800 17px/1 var(--body);color:#2a1a08;
    background:linear-gradient(180deg,#ffc86b,#ef9a22);box-shadow:0 0 26px rgba(255,160,50,0.4)}
  button.ghost{padding:13px;border-radius:13px;cursor:pointer;
    font:600 14px/1 var(--body);color:var(--bone);
    border:1px solid var(--line);background:transparent}
  .rules{text-align:left;display:flex;flex-direction:column;gap:9px;
    padding:14px;border:1px solid var(--line);border-radius:14px}
  .rules p{font:400 13.5px/1.45 var(--body);color:var(--mute)}
  .rules b{color:var(--bone);font-weight:700}
  .nights{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
  .nights i{width:13px;height:13px;border-radius:3px;background:rgba(242,228,204,0.11);
    display:block;font-style:normal}
  .nights i.done{background:var(--ember)}
  .nights i.now{background:var(--bone);box-shadow:0 0 8px rgba(255,181,71,0.8)}
  .foot{font:500 10px/1.5 var(--mono);color:#6b5c4e;letter-spacing:.05em}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="row"><span class="lbl" id="fireLbl">Fire</span><span class="num" id="fireNum">60</span></div>
    <div class="bar" id="fireBar"><i></i></div>
    <div id="dawnbar"><i></i></div>
    <div class="row">
      <span class="lbl">Night <b id="nightNum" style="color:var(--bone)">1</b></span>
      <span class="lbl" id="carryLbl">Carrying 0</span>
      <span class="num" id="tillDawn">40s</span>
    </div>
  </div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="banner"></div>
    <div id="road"></div>
  </div>
  <div id="pad">
    <div class="keys">
      <button class="key" id="kL" aria-label="Left">◀</button>
      <button class="key" id="kR" aria-label="Right">▶</button>
    </div>
    <div class="keys">
      <button class="key hop" id="kJ" aria-label="Jump">JUMP</button>
      <button class="key act" id="kA" aria-label="Swing">SWING</button>
    </div>
  </div>
</div>
<div id="veil"><div class="card" id="card"></div></div>
<script>
(function () {
  'use strict';
  var BUILD = 'v1.1.0';

  // ── measurements ──────────────────────────────────────────────────────────
  var TILE = 16;
  var W = TILE * 25;                         // 25 tiles across, always
  var WORLD = TILE * 75;                     // 1200 — three windows of road
  // how tall the window is depends on the phone: a tall screen gets more sky
  var H, GY;
  (function fit() {
    var st = document.getElementById('stage').getBoundingClientRect();
    var wpx = st.width || window.innerWidth || 390;
    var hpx = st.height || (window.innerHeight || 844) * 0.62;
    var tall = Math.round(hpx / (wpx / W) / TILE) * TILE;
    H = Math.max(TILE * 14, Math.min(TILE * 28, tall));
    GY = Math.round(H * 0.75 / TILE) * TILE;   // the grass line
  })();
  var GUY_H = 40, GUY_W = 18;                // 2.5 tiles tall, just over one wide
  var FIREX = Math.round(WORLD * 0.5);       // camp sits at the middle of the world

  var RAMPS = {
    sky:    ['#120c1c', '#1d1430', '#2b1d40', '#3d2a4c', '#553a54'],
    far:    ['#2a2038', '#372a45', '#463456'],
    tree:   ['#1d2a24', '#26382c', '#314736'],
    grass:  ['#243a22', '#31502c', '#3f6635', '#4f7d40'],
    dirt:   ['#2b1d12', '#3a2718', '#4a3220', '#5c4029', '#6e4e33'],
    stone:  ['#38352f', '#4c4841', '#635e55', '#7b7568'],
    tent:   ['#2c4a33', '#3f6b45', '#568c56', '#6fa869'],
    wood:   ['#33210f', '#4a3018', '#654222', '#83572d', '#a06f3d'],
    fire:   ['#8f2b08', '#c94513', '#ef7a22', '#ffb547', '#ffeeb8'],
    skin:   ['#8a5f42', '#b8865a', '#dbab7c', '#f2cfa4'],
    cloth:  ['#5e2018', '#8a3324', '#b84a33', '#d96b4a'],
    hair:   ['#2b1b10', '#43291a', '#5e3a24'],
    dog:    ['#4a2f18', '#6b4423', '#8a5a30', '#a9743f'],
    metal:  ['#2e2b28', '#484440', '#6b665f', '#918b82'],
    shade:  ['#2a2246', '#453a68', '#6b5aa0', '#b7a6f2']
  };
  var C = {};
  for (var rk in RAMPS) for (var ri = 0; ri < RAMPS[rk].length; ri++) C[rk + ri] = RAMPS[rk][ri];

  function hash(x, y) {
    var h = x * 374761393 + y * 668265263;
    h = (h ^ (h >> 13)) * 1274126177;
    return ((h ^ (h >> 16)) >>> 0) / 4294967295;
  }
  function mkPx(ctx) {
    return function (c, x, y, w, h2) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w || 1, h2 || 1); };
  }
  function box(px, fill, edge, x, y, w, h2) { px(edge, x, y, w, h2); px(fill, x + 1, y + 1, w - 2, h2 - 2); }
  function disc(px, col, cx, cy, rx, ry) {
    for (var y = -ry; y <= ry; y++) {
      var w2 = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
      if (w2 > 0) px(col, cx - w2, cy + y, w2 * 2 + 1, 1);
    }
  }

  // ── him ───────────────────────────────────────────────────────────────────
  function guy(px, x, feetY, t, face, mode, step) {
    var f = face < 0 ? -1 : 1;
    var y = feetY - GUY_H;
    var walk = mode === 'walk';
    var bob = walk ? (Math.floor(step) % 2 ? 1 : 0)
            : mode === 'jump' ? 0 : (Math.sin(t * 1.6) > 0 ? 0 : 1);
    y += bob;

    if (mode === 'jump') {
      px(C.wood0, x - 7, y + 27, 6, 10); px(C.wood1, x - 6, y + 27, 4, 9);
      px(C.wood0, x + 1, y + 29, 6, 9);  px(C.wood1, x + 2, y + 29, 4, 8);
      px(C.hair0, x - 8, y + 35, 7, 3);
      px(C.hair0, x + 1, y + 36, 7, 3);
    } else if (mode === 'sit') {
      var kx = x + (f > 0 ? 2 : -14);
      px(C.wood0, kx, y + 27, 14, 8); px(C.wood1, kx + 1, y + 28, 12, 6);
      var sx = x + (f > 0 ? 12 : -14);
      px(C.wood0, sx, y + 33, 6, 8); px(C.wood1, sx + 1, y + 34, 4, 7);
      px(C.hair0, sx - (f > 0 ? 0 : 2), y + 40, 8, 3);
    } else if (mode !== 'jump') {
      var sw = walk ? Math.sin(step * Math.PI) * 5 : 0;
      var la = Math.round(sw), lb = -Math.round(sw);
      px(C.wood0, x - 7 + la, y + 28, 6, 12); px(C.wood1, x - 6 + la, y + 28, 4, 11);
      px(C.wood0, x + 1 + lb, y + 28, 6, 12); px(C.wood1, x + 2 + lb, y + 28, 4, 11);
      px(C.hair0, x - 8 + la, y + 37, 7, 3);
      px(C.hair0, x + 1 + lb, y + 37, 7, 3);
    }

    box(px, C.cloth1, C.cloth0, x - 9, y + 16, 18, 13);
    px(C.cloth2, x - 8 + (f > 0 ? 9 : 0), y + 17, 8, 11);
    px(C.cloth3, x - 8 + (f > 0 ? 14 : 0), y + 17, 2, 11);
    px(C.cloth0, x - 8, y + 26, 16, 2);
    px(C.wood2, x - 4, y + 26, 8, 2);

    var swing = mode === 'jump' ? -3 : walk ? Math.round(Math.sin(step * Math.PI) * 3) : 0;
    px(C.cloth0, x - 12, y + 17 + swing, 4, 10); px(C.cloth1, x - 11, y + 18 + swing, 2, 9);
    px(C.cloth0, x + 8, y + 17 - swing, 4, 10);  px(C.cloth2, x + 9, y + 18 - swing, 2, 9);
    px(C.skin1, x - 12, y + 26 + swing, 4, 4);   px(C.skin2, x + 8, y + 26 - swing, 4, 4);

    box(px, C.skin2, C.skin0, x - 8, y + 2, 17, 15);
    px(C.skin3, x - 7 + (f > 0 ? 8 : 0), y + 3, 8, 13);
    px(C.skin1, x - 7, y + 15, 15, 1);
    var blink = (t % 4.1) < 0.14;
    var ex = x - 5 + (f > 0 ? 3 : 0);
    px(C.hair0, ex, y + 8, 3, blink ? 1 : 4);
    px(C.hair0, ex + 6, y + 8, 3, blink ? 1 : 4);
    if (!blink) { px('#e9f0ff', ex, y + 8, 2, 2); px('#e9f0ff', ex + 6, y + 8, 2, 2); }
    px(C.skin1, x - 1 + (f > 0 ? 3 : 0), y + 13, 3, 1);
    px(C.hair1, x - 9, y, 19, 6); px(C.hair2, x - 8, y, 17, 3);
    px(C.hair0, x - 9 - (f > 0 ? 0 : 1), y + 3, 4, 9);
    px(C.hair0, x + 6 + (f > 0 ? 1 : 0), y + 3, 4, 9);
    px(C.hair2, x - 6, y - 1, 11, 1);
  }

  function armful(px, x, feetY, n, face) {
    var f = face < 0 ? -1 : 1;
    var cx = x + f * 4;
    for (var i = 0; i < n; i++) {
      var ly = feetY - 17 - i * 5;
      px(C.wood0, cx - 12, ly - 5, 24, 7);
      px(C.wood2, cx - 12, ly - 4, 24, 5);
      px(C.wood3, cx - 11, ly - 4, 22, 2);
      disc(px, C.wood0, cx - 12, ly - 2, 3, 3); disc(px, C.wood1, cx - 12, ly - 2, 2, 2);
      disc(px, C.wood0, cx + 12, ly - 2, 3, 3); disc(px, C.wood2, cx + 12, ly - 2, 2, 2);
    }
    px(C.cloth0, cx - 13 * f, feetY - 22, 5, 5);
    px(C.skin2, cx - 13 * f, feetY - 20, 4, 4);
  }

  // ── the fire, drawn wherever the camera has put it ────────────────────────
  function campfire(px, fx, t, lvl, baseY, day) {
    var TONGUE = [
      { w: 15, h: 1.00, sp: 3.3, ox: -5, c: [C.fire0, C.fire1] },
      { w: 12, h: 0.86, sp: 4.7, ox:  6, c: [C.fire1, C.fire2] },
      { w:  9, h: 1.12, sp: 6.1, ox:  0, c: [C.fire2, C.fire3] },
      { w:  5, h: 0.66, sp: 8.4, ox:  1, c: [C.fire3, C.fire4] }
    ];
    var base = 2.5 * TILE * 0.42 * (0.35 + lvl * 0.75);
    for (var ti = 0; ti < TONGUE.length; ti++) {
      var T = TONGUE[ti];
      var th = Math.round(base * T.h * (1 + Math.sin(t * T.sp + ti) * 0.09));
      var tw = T.w * (0.55 + lvl * 0.5);
      for (var fy = 0; fy < th; fy++) {
        var u = fy / th;
        var prof = Math.sqrt(Math.max(0, 1 - u)) * (1 - u * 0.25);
        var ww = Math.max(1, Math.round(tw * prof));
        var lean = Math.round(Math.sin(u * 2.4 + t * T.sp * 0.5 + ti) * u * u * 7);
        px(u > 0.62 ? T.c[1] : T.c[0], fx + T.ox - ww + lean, baseY - 8 - fy, ww * 2, 1);
      }
    }
    for (var lg = 0; lg < 3; lg++) {
      px(C.wood0, fx - 11 + lg * 7, baseY - 9 + lg, 15, 5);
      px(C.wood1, fx - 10 + lg * 7, baseY - 8 + lg, 13, 3);
      px(C.fire1, fx - 9 + lg * 7, baseY - 7 + lg, 11, 1);
    }
    for (var sr = 0; sr < 11; sr++) {
      var sa = sr * 0.57, sx2 = fx + Math.round(Math.cos(sa) * 24), sy2 = baseY - 3 + Math.round(Math.sin(sa) * 3);
      disc(px, C.stone1, sx2, sy2, 3, 2); px(C.stone3, sx2 - 2, sy2 - 1, 3, 1);
    }
    for (var k = 0; k < 12; k++) {
      var sp = (t * 11 + k * 4.1) % 62, sy3 = baseY - 14 - base - sp;
      if (sy3 > 10) {
        var sw = 1 + Math.round(sp / 24);
        px(sp > 36 ? (day ? '#c9d6de' : C.far1) : (day ? '#aebcc6' : C.far2),
           fx + Math.round(Math.sin(sp * 0.11 + k) * (2 + sp * 0.17)), sy3 | 0, sw, sw);
      }
    }
    for (var e = 0; e < 8; e++) {
      var ep = (t * 16 + e * 5.2) % 42, ey = baseY - 12 - base - ep;
      if (ey > 14) px(ep > 28 ? C.fire2 : C.fire4, fx + Math.round(Math.sin(ep * 0.4 + e * 2) * 7), ey | 0, 1, 1);
    }
  }

  // one warm light at the fire, a smaller one on his lamp
  function lightPass(ctx, fx, fy, reach, lx, ly, lamp, dawn) {
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    var lm = ctx.createRadialGradient(fx, fy, 8, fx, fy, reach);
    lm.addColorStop(0, '#ffffff'); lm.addColorStop(0.30, '#f0d5b8');
    lm.addColorStop(0.62, '#a68a7c'); lm.addColorStop(1, dawn);
    ctx.fillStyle = lm; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    if (lamp > 0) {
      var pm = ctx.createRadialGradient(lx, ly, 2, lx, ly, 42);
      pm.addColorStop(0, 'rgba(255,186,96,' + (0.30 * lamp).toFixed(3) + ')');
      pm.addColorStop(0.5, 'rgba(255,150,60,' + (0.11 * lamp).toFixed(3) + ')');
      pm.addColorStop(1, 'rgba(255,140,50,0)');
      ctx.fillStyle = pm; ctx.fillRect(0, 0, W, H);
    }
    var bl = ctx.createRadialGradient(fx, fy - 8, 2, fx, fy - 8, reach * 0.6);
    bl.addColorStop(0, 'rgba(255,150,60,0.46)'); bl.addColorStop(0.4, 'rgba(255,110,40,0.14)');
    bl.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.fillStyle = bl; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ── the shape of the road ─────────────────────────────────────────────────
  // Terraced, the way that game does it: a step of one tile he walks up on his
  // own, a step of two he has to jump. The camp itself stays flat.
  var RISE = [
    { x0:   30, x1:  330, up: 1 },
    { x0:   64, x1:  286, up: 2 },
    { x0:  108, x1:  212, up: 3 },
    { x0:  300, x1:  356, up: 2 },      // a ledge on its own, two tiles up
    { x0:  848, x1: 1010, up: 1 },
    { x0:  880, x1:  964, up: 2 },
    { x0: 1024, x1: 1104, up: 2 },      // another, out east
    { x0: 1044, x1: 1084, up: 3 },
    { x0: 1140, x1: 1200, up: 1 }
  ];
  var DIP = [{ x0: 1108, x1: 1140, down: 1 }];   // a dry creek
  var FLAT0 = FIREX - 230, FLAT1 = FIREX + 230;  // the camp, level from end to end
  var GROUND;
  function buildGround() {
    GROUND = new Int16Array(WORLD);
    for (var x = 0; x < WORLD; x++) {
      var lvl = 0, i;
      if (x < FLAT0 || x > FLAT1) {
        for (i = 0; i < RISE.length; i++)
          if (x >= RISE[i].x0 && x < RISE[i].x1) lvl = Math.max(lvl, RISE[i].up);
        for (i = 0; i < DIP.length; i++)
          if (x >= DIP[i].x0 && x < DIP[i].x1) lvl = Math.min(lvl, -DIP[i].down);

  buildGround();
  function groundY(x) {
    var i = x | 0;

  }

  // ── the ground, baked once across the whole world ─────────────────────────
  var terrain = document.createElement('canvas');
  terrain.width = WORLD; terrain.height = H;
  var tctx = terrain.getContext('2d');
  var tpx = mkPx(tctx);

  function rgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function bakeTerrain() {
    tctx.clearRect(0, 0, WORLD, H);
    var soil = [C.grass3, C.grass2, C.grass1, C.grass0, C.dirt0, C.dirt1, C.dirt2, C.dirt3, C.dirt4].map(rgb);
    var wall = [[52, 36, 22], [60, 42, 27], [69, 49, 31]];
    var TOP = GY - TILE * 3;
    var img = tctx.createImageData(WORLD, H - TOP), d = img.data, o = 0;
    var deepest = Math.max(1, H - GY - 4);
    for (var gy = TOP; gy < H; gy++) for (var gx = 0; gx < WORLD; gx++) {
      var surf = GROUND[gx], depth = gy - surf;
      if (depth < 0) {
        if (gy < GY) { o += 4; continue; }             // open sky, left clear
        var wn = hash(gx, gy);                          // below the line: earth wall
        var wc = wall[wn > 0.7 ? 2 : wn > 0.35 ? 1 : 0];
        var wk = 1 - Math.min(0.34, (gy - GY) / deepest * 0.6);
        d[o++] = wc[0] * wk; d[o++] = wc[1] * wk; d[o++] = wc[2] * wk; d[o++] = 255;
        continue;
      }
      var n = hash(gx, gy), ci;
      if (depth < 4) ci = depth === 0 ? 0 : depth < 2 ? 1 : 2;
      else {
        ci = n > 0.82 ? 8 : n > 0.6 ? 7 : n > 0.25 ? 6 : 5;
        if ((gx % TILE === 0 || gy % TILE === 4) && n > 0.3) ci = 4;
      }
      if (depth === 3 && n > 0.7) ci = 3;
      var c3 = soil[ci], k2 = depth < 4 ? 1 : 1 - Math.min(0.62, (depth - 4) / deepest * 0.7);
      d[o++] = c3[0] * k2; d[o++] = c3[1] * k2; d[o++] = c3[2] * k2; d[o++] = 255;
    }
    tctx.putImageData(img, 0, TOP);
    for (var tf = 0; tf < WORLD; tf += 3) {
      if (hash(tf, 91) > 0.55) {
        var th = 1 + Math.round(hash(tf, 7) * 2), tg = GROUND[tf];
        tpx(C.grass3, tf, tg - th, 1, th);
        if (hash(tf, 11) > 0.7) tpx(C.grass2, tf + 1, tg - 1, 1, 1);
      }
    }
    for (var st = 0; st < 64; st++) {
      var sx = Math.round((st + 0.5) / 64 * WORLD + (hash(st * 7919 + 3, 31) - 0.5) * 16);
      sx = Math.max(2, Math.min(WORLD - 3, sx));
      var sy = GROUND[sx] + 10 + Math.round(hash(st * 7919 + 3, 37) * 40);
      var rw = 2 + Math.round(hash(st * 7919 + 3, 41) * 3);
      if (sy > H - 4) continue;
      disc(tpx, C.stone1, sx, sy, rw, Math.max(1, rw - 1));
      tpx(C.stone2, sx - rw + 1, sy - 1, rw, 1);

    // pines, standing on the grass line, thinning out near the camp
    for (var pt = 0; pt < 17; pt++) {
      var sd = pt * 7919 + 5;
      var px2 = Math.round((pt + 0.5) / 17 * WORLD + (hash(sd, 53) - 0.5) * 46);
      if (Math.abs(px2 - FIREX) < 160) continue;
      pine(tpx, px2, groundY(px2), 5 + Math.round(hash(sd, 59) * 6), hash(sd, 61));
    }
    // rocks big enough to sit on, out along the road
    for (var bo = 0; bo < 14; bo++) {
      var bx = Math.round((bo + 0.5) / 14 * WORLD + (hash(bo * 7919 + 7, 67) - 0.5) * 40);
      if (Math.abs(bx - FIREX) < 110) continue;
      var by2 = groundY(bx);
      disc(tpx, C.stone0, bx, by2 - 3, 11, 7);

  }

  var PINE = ['#1a2820', '#233729', '#2e4835', '#3c5c42'];
  function pine(px, x, baseY, tiles, v) {
    v = v || 0;

      var yTop = baseY - 10 - Math.round(u * (hgt - 14)) - 14;
      crown = Math.min(crown, yTop);

        px(PINE[1], x + off - ww, yTop + r, ww * 2 + 1, 1);

    px(PINE[2], x + Math.round(lean * 3) - 1, crown - 4, 2, 6);
  }

  var LPL = FIREX - 186, LPR = FIREX + 186, LTOP = GY - 78, LSAG = 20;

  function cfgFor(n) {

    var k = n - NIGHTS.length, b = NIGHTS[NIGHTS.length - 1];
    return {
      len: Math.min(78, b.len + k), drain: Math.min(5.4, b.drain + k * 0.05),
      gap: Math.max(1.8, b.gap - k * 0.03), spd: Math.min(34, b.spd + k * 0.2),
      wood: Math.max(1.6, b.wood - k * 0.02), lying: 7,
      name: 'The road goes on', note: 'Past the twenty now. As far as you like.'

  }

  function dropLog() {
    if (!S || S.logs.length >= S.cfg.lying) return;
    var tries = 0, x;
    do {
      var side = Math.random() < 0.5 ? -1 : 1;
      var out = 150 + Math.pow(Math.random(), 1.6) * 430;
      x = FIREX + side * out;
      if (x < 40 || x > WORLD - 40) x = FIREX - side * out;
      tries++;
    } while (tries < 24 && ((x > FIREX - 175 && x < FIREX + 142) || nearLog(x)));
    S.logs.push({ x: x, y: groundY(x), born: 0 });
  }
  function nearLog(x) {
    for (var i = 0; i < S.logs.length; i++) if (Math.abs(S.logs[i].x - x) < 34) return true;
    return false;
  }

  function spawnShade() {
    var cap = 3 + Math.floor(S.n / 8);
    if (S.shades.length >= cap) return;
    var side = Math.random() < 0.5 ? -1 : 1;
    var d = 210 + Math.random() * 260;
    var sx = FIREX + side * d;
    if (sx < 20 || sx > WORLD - 20) side = -side, sx = FIREX + side * d;
    S.shades.push({

  }

  // ── input ─────────────────────────────────────────────────────────────────
  var held = { l: false, r: false, a: false, j: false };

  function bindKey(el, set, tap) {
    var down = function (e) { e.preventDefault(); set(true); if (tap) taps[tap]++; el.classList.add('on'); ac(); };
    var up = function (e) { e.preventDefault(); set(false); el.classList.remove('on'); };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    window.addEventListener('mouseup', up);

    else if (k === 'd' || k === 'arrowright') held.r = true;
    else if (k === ' ' || k === 'arrowup' || k === 'w') { held.j = true; taps.j++; e.preventDefault(); }
    else if (k === 'f' || k === 'j' || k === 'x' || k === 'arrowdown') { held.a = true; taps.a++; e.preventDefault(); }
    else if (k === 'm') muted = !muted;
    else return;
    ac();
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') held.l = false;
    else if (k === 'd' || k === 'arrowright') held.r = false;
    else if (k === ' ' || k === 'arrowup' || k === 'w') held.j = false;
    else if (k === 'f' || k === 'j' || k === 'x' || k === 'arrowdown') held.a = false;
  });

  // ── one tick, of a night or of a day at the camp ──────────────────────────
  function step(dt) {
    var cfg = S.cfg;
    var day = S.mode === 'day';
    var hitA = held.a || took('a'), hitJ = held.j || took('j');

    // walking, over ground that is not all one height
    var mv = (held.r ? 1 : 0) - (held.l ? 1 : 0);
    S.moving = 0;
    if (mv) {
      S.dir = mv;
      var nx = Math.max(18, Math.min(WORLD - 18, S.x + mv * SPEED * dt));
      var ng = groundY(nx);
      if (ng >= S.y - STEP_UP) {                 // low enough to walk or step onto
        S.x = nx;
        if (S.onGround && ng < S.y) S.y = ng;    // up the step
      }
      if (S.onGround) { S.step += dt * 5.4; S.moving = 1; }
    }

    // the jump, and the fall that follows it
    var g = groundY(S.x);
    if (hitJ && S.onGround && !S.jumpHeld) {
      S.vy = -JUMPV; S.onGround = false; S.jumpHeld = true;
      bell(240, 0.09, 0.035, 1100);
    }
    if (!held.j) S.jumpHeld = false;
    if (!S.onGround) {
      S.vy += GRAV * dt;
      S.y += S.vy * dt;
      if (S.vy > 0 && S.y >= g) { S.y = g; S.vy = 0; S.onGround = true; }
    } else if (g > S.y + 1) {                    // he walked off the edge of it
      S.onGround = false; S.vy = 0;
    } else S.y = g;

    if (day) {
      S.fuel = 44 + Math.sin(t * 0.7) * 4;
      if (S.swing > 0) S.swing -= dt;
      if (S.swingCd > 0) S.swingCd -= dt;
      if (hitA && S.swingCd <= 0) { S.swingCd = 0.5; startNight(S.n); return; }
      if (S.shake > 0) S.shake -= dt;
      var want0 = Math.max(0, Math.min(WORLD - W, S.x - W / 2));
      S.cam += (want0 - S.cam) * Math.min(1, dt * 7);
      return;
    }

    // the brand
    if (S.swingCd > 0) S.swingCd -= dt;
    if (S.swing > 0) S.swing -= dt;
    if (hitA && S.swingCd <= 0) {
      S.swingCd = SWING_CD; S.swing = 0.22;
      bell(190, 0.14, 0.05, 900);
      var hx = S.x + S.dir * 18;
      for (var i = S.shades.length - 1; i >= 0; i--) {
        var sh = S.shades[i];
        if (Math.abs(sh.x - hx) < SWING_RANGE && Math.abs(sh.y - (S.y - 22)) < 32) {
          S.shades.splice(i, 1); S.driven++;
          burst(sh.x, sh.y, 9, 14);
          bell(560, 0.2, 0.06, 2400);
        }
      }
    }

    // picking wood up on the way past
    for (var j = S.logs.length - 1; j >= 0; j--) {
      S.logs[j].born += dt;
      if (S.carry < MAXCARRY && Math.abs(S.logs[j].x - S.x) < 17
          && Math.abs(S.logs[j].y - S.y) < 26) {
        S.logs.splice(j, 1); S.carry++;
        bell(300, 0.1, 0.045, 1400);
      }
    }
    S.woodT -= dt;
    if (S.woodT <= 0) { S.woodT = cfg.wood; dropLog(); }

    // feeding, which happens simply by standing at the stones
    if (S.feed > 0) S.feed -= dt;
    if (S.carry > 0 && Math.abs(S.x - FIREX) < 34 && S.feed <= 0) {
      S.carry--; S.fed++; S.feed = 0.34;
      S.fuel = Math.min(FUEL_MAX, S.fuel + LOG_FUEL);
      burst(FIREX, GY - 14, 12, 30);
      bell(420, 0.26, 0.05, 1700);
    }

    // the shades
    S.shadeT -= dt;
    if (S.shadeT <= 0) { S.shadeT = cfg.gap; spawnShade(); }
    for (var k = S.shades.length - 1; k >= 0; k--) {
      var s2 = S.shades[k];
      var toward = FIREX - s2.x;
      s2.x += Math.sign(toward) * cfg.spd * dt;
      var prog = 1 - Math.min(1, Math.abs(FIREX - s2.x) / s2.d0);
      s2.y = s2.y0 + (GY - 24 - s2.y0) * prog + Math.sin(t * 1.4 + s2.ph) * 4;
      if (Math.abs(FIREX - s2.x) < 26) {
        S.shades.splice(k, 1);
        S.fuel = Math.max(0, S.fuel - BITE);
        S.shake = 0.3;
        bell(96, 0.5, 0.07, 500);
        for (var p = 0; p < 8; p++) S.puffs.push({
          x: FIREX + (Math.random() - 0.5) * 26, y: GY - 20,
          vx: (Math.random() - 0.5) * 24, vy: -12 - Math.random() * 20, life: 1
        });
      }
    }

    // sparks and puffs
    for (var q = S.sparks.length - 1; q >= 0; q--) {
      var sp = S.sparks[q];
      sp.life -= dt * 0.95; if (sp.life <= 0) { S.sparks.splice(q, 1); continue; }
      sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.vy += 42 * dt;
    }
    for (var r = S.puffs.length - 1; r >= 0; r--) {
      var pf = S.puffs[r];
      pf.life -= dt * 0.7; if (pf.life <= 0) { S.puffs.splice(r, 1); continue; }
      pf.x += pf.vx * dt; pf.y += pf.vy * dt; pf.vy += 6 * dt;
    }
    if (S.shake > 0) S.shake -= dt;

    // the fire, and the clock
    S.fuel = Math.max(0, S.fuel - cfg.drain * dt);
    S.left -= dt;
    if (S.fuel <= 0) { finish(false); return; }
    if (S.left <= 0) { S.left = 0; finish(true); return; }

    // camera
    var want = Math.max(0, Math.min(WORLD - W, S.x - W / 2));
    S.cam += (want - S.cam) * Math.min(1, dt * 7);
  }

  // ── one frame ─────────────────────────────────────────────────────────────
  var DAYSKY = ['#3a79ad', '#5b96c6', '#86b6da', '#b2d2e9', '#dcebf2'];
  function draw() {
    var cam = Math.round(S.cam) + (S.shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0);
    var lvl = S.fuel / FUEL_MAX;
    var day = S.mode === 'day';
    var dawn = day ? 0 : Math.max(0, 1 - S.left / 8);   // the last eight seconds go pale

    if (day) { drawDay(cam, lvl); return; }

    // sky, with the horizon warming as dawn comes on
    for (var b = 0; b < 5; b++) {
      var col = RAMPS.sky[b];
      if (dawn > 0) col = mix(col, ['#241a2c', '#3b2740', '#5e3a4a', '#8a5352', '#c1785c'][b], dawn);
      px(col, 0, BAND[b], W, (b < 4 ? BAND[b + 1] : GY) - BAND[b]);
    }
    if (dawn < 0.75) {                              // stars, scattered right across it
      var drift = Math.round(cam * 0.06);
      for (var st = 0; st < STARS; st++) {
        var sx = Math.round(hash(st, 17) * W) - drift % W;
        if (sx < 0) sx += W; if (sx >= W) sx -= W;
        var sy = 3 + Math.round(hash(st, 23) * STARY);
        var tw = Math.sin(t * (0.8 + hash(st, 29) * 1.6) + st * 2.1);
        if (tw < -0.55) continue;
        var mag = hash(st, 31);
        var fade = dawn > 0.4 ? 1 : 0;
        px(mag > 0.93 ? (fade ? '#a99cb4' : '#ffe9c0') : mag > 0.6 ? (fade ? '#8f849e' : '#d6cee2')
          : (fade ? '#6d6480' : '#9d94ad'), sx, sy, 1, 1);
        if (mag > 0.96) { px('#fff6dc', sx - 1, sy, 1, 1); px('#fff6dc', sx + 1, sy, 1, 1); }
      }
    }
    if (dawn < 0.8) {                               // the moon, well up by now
      var mx = Math.round(W * 0.2), my = Math.round(GY * 0.19);
      var mA = dawn > 0.4 ? '#9d8f9c' : '#ded7ea', mB = dawn > 0.4 ? '#b3a4b0' : '#fbf6ff';
      disc(px, mA, mx, my, 13, 13); disc(px, mB, mx - 1, my - 1, 10, 10);
      disc(px, mA, mx - 4, my - 4, 3, 3); disc(px, mA, mx + 3, my + 2, 2, 2);
      disc(px, mA, mx - 1, my + 6, 2, 2);
    }
    for (var cl = 0; cl < 3; cl++) {                // haze lying over the hills
      var cy = Math.round(GY * (0.50 + cl * 0.07));
      var cw = 110 + cl * 40, cx = ((t * (2.4 + cl) + cl * 151 - cam * 0.05) % (W + cw * 2)) - cw;
      var cc = dawn > 0.3 ? mix(RAMPS.sky[4], '#b3705e', dawn) : RAMPS.sky[4];
      px(cc, cx + 10, cy, cw - 20, 2);
      px(cc, cx, cy + 2, cw, 3);
      px(cc, cx + 22, cy + 5, cw - 52, 2);
    }
    if (dawn > 0.15) {                              // the sun, coming up behind the hill
      var sunY = RIDGE + 18 - Math.round(dawn * 28);
      disc(px, dawn > 0.55 ? '#ffdfa0' : '#e8a06e', Math.round(W * 0.74), sunY, 15, 15);
      disc(px, dawn > 0.55 ? '#fff3cf' : '#f5bd83', Math.round(W * 0.74), sunY - 1, 11, 11);
    }

    // two ridges, moving slower than the ground
    var far = Math.round(cam * 0.22), mid = Math.round(cam * 0.48);
    for (var hx = 0; hx < W; hx++) {
      var wx = hx + far;
      var h1 = RIDGE - Math.round(11 * Math.sin(wx * 0.019) + 6 * Math.sin(wx * 0.043 + 1));
      px(C.far2, hx, h1, 1, 2); px(C.far1, hx, h1 + 2, 1, GY - h1 - 2);
    }
    for (var tx = 0; tx < W; tx++) {
      var wx2 = tx + mid;
      var tb = TLINE - Math.round(7 * Math.abs(Math.sin(wx2 * 0.08)) + 4 * Math.sin(wx2 * 0.028));
      px(C.tree2, tx, tb, 1, 2); px(C.tree1, tx, tb + 2, 1, GY - tb - 2);
      if (hash(wx2, 3) > 0.86) px(C.tree0, tx, tb - 2, 1, 3);
    }

    // the baked world, one slice of it
    ctx.drawImage(terrain, cam, 0, W, H, 0, 0, W, H);

    // wood on the ground
    for (var i = 0; i < S.logs.length; i++) {
      var lx = Math.round(S.logs[i].x) - cam;
      if (lx > -30 && lx < W + 30) logSprite(px, lx, S.logs[i].y, t, i);
    }

    signpost(px, SIGN - cam, groundY(SIGN), S.n);
    lights(cam, 0);
    dog(px, FIREX + 148 - cam, GY - 1, t);
    campfire(px, FIREX - cam, t, Math.max(0.06, lvl), GY);

    for (var q = 0; q < S.sparks.length; q++) {
      var sp = S.sparks[q];
      px(sp.life > 0.5 ? C.fire4 : C.fire2, (sp.x | 0) - cam, sp.y | 0, 2, 2);
    }
    for (var r = 0; r < S.puffs.length; r++) {
      var pf = S.puffs[r];
      px(pf.life > 0.5 ? C.shade2 : C.shade1, (pf.x | 0) - cam, pf.y | 0, 2, 2);
    }
    for (var k = 0; k < S.shades.length; k++) {
      var sh = S.shades[k];
      if (sh.x - cam > -24 && sh.x - cam < W + 24)
        shadeSprite(px, { x: sh.x - cam, y: sh.y, ph: sh.ph }, t, k);
    }

    // him
    var hx2 = Math.round(S.x) - cam, hy2 = Math.round(S.y);
    var pose = !S.onGround ? 'jump' : S.moving ? 'walk' : 'idle';
    guy(px, hx2, hy2, t, S.dir, pose, S.step);
    if (S.carry) armful(px, hx2, hy2, S.carry, S.dir);

    // the brand in his hand — lit, and swept when he swings
    var reach = S.swing > 0 ? 14 + Math.round((0.22 - S.swing) * 90) : 12;
    var by = hy2 - 20 + (S.swing > 0 ? Math.round((0.22 - S.swing) * 34) - 4 : 0);
    px(C.wood1, hx2 + S.dir * 11, by, S.dir * (reach - 4) || 1, 3);
    px(C.fire3, hx2 + S.dir * reach, by - 1, 4, 4);
    px(C.fire4, hx2 + S.dir * reach, by - 1, 3, 3);
    px('#fffbe6', hx2 + S.dir * reach + 1, by, 1, 1);

    var reachR = 96 + lvl * 96;
    var deep = dawn > 0 ? mix('#544c66', '#a99184', dawn) : '#544c66';
    lightPass(ctx, FIREX - cam, GY - 16, reachR, hx2 + S.dir * reach, by, 1, deep);
  }

  // ── the camp by daylight ──────────────────────────────────────────────────
  function drawDay(cam, lvl) {
    for (var b = 0; b < 5; b++)
      px(DAYSKY[b], 0, BAND[b], W, (b < 4 ? BAND[b + 1] : GY) - BAND[b]);
    var sunX = Math.round(W * 0.78) - Math.round(cam * 0.04);
    disc(px, '#ffe9ad', sunX, Math.round(GY * 0.16), 17, 17);
    disc(px, '#fffbe4', sunX, Math.round(GY * 0.16), 13, 13);
    for (var cl = 0; cl < 5; cl++) {              // proper daylight cloud
      var cy = Math.round(GY * (0.12 + cl * 0.1));
      var cw = 54 + cl * 22;
      var cx = ((t * (3 + cl * 1.4) + cl * 149 - cam * 0.08) % (W + cw * 2)) - cw;
      px('#e9f2f7', cx + 10, cy, cw - 20, 5);
      px('#ffffff', cx + 14, cy, cw - 34, 3);
      px('#e9f2f7', cx, cy + 5, cw, 5);
      px('#cfdde8', cx + 4, cy + 9, cw - 12, 2);
    }
    var far = Math.round(cam * 0.22), mid = Math.round(cam * 0.48);
    for (var hx = 0; hx < W; hx++) {
      var wx = hx + far;
      var h1 = RIDGE - Math.round(11 * Math.sin(wx * 0.019) + 6 * Math.sin(wx * 0.043 + 1));
      px('#9fb0d0', hx, h1, 1, 2); px('#8496bc', hx, h1 + 2, 1, GY - h1 - 2);
    }
    for (var tx = 0; tx < W; tx++) {
      var wx2 = tx + mid;
      var tb = TLINE - Math.round(7 * Math.abs(Math.sin(wx2 * 0.08)) + 4 * Math.sin(wx2 * 0.028));
      px('#3f6247', tx, tb, 1, 2); px('#2f4a36', tx, tb + 2, 1, GY - tb - 2);
      if (hash(wx2, 3) > 0.86) px('#25392a', tx, tb - 2, 1, 3);
    }
    ctx.drawImage(terrain, cam, 0, W, H, 0, 0, W, H);
    signpost(px, SIGN - cam, groundY(SIGN), S.n);
    lights(cam, 0.35);
    dog(px, FIREX + 148 - cam, GY - 1, t);
    campfire(px, FIREX - cam, t, Math.max(0.2, lvl), GY, 1);
    birds(cam);
    var hx3 = Math.round(S.x) - cam, hy3 = Math.round(S.y);
    guy(px, hx3, hy3, t, S.dir, !S.onGround ? 'jump' : S.moving ? 'walk' : 'idle', S.step);
    ctx.save();                                   // a wash of warm morning over it all
    ctx.globalCompositeOperation = 'multiply';
    var wm = ctx.createLinearGradient(0, 0, 0, H);
    wm.addColorStop(0, '#e8ecf6'); wm.addColorStop(0.6, '#fff3e2'); wm.addColorStop(1, '#f6dfc6');
    ctx.fillStyle = wm; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    var gl = ctx.createRadialGradient(FIREX - cam, GY - 14, 2, FIREX - cam, GY - 14, 70);
    gl.addColorStop(0, 'rgba(255,150,60,0.2)'); gl.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function birds(cam) {
    for (var i = 0; i < 5; i++) {
      var sp = 16 + i * 3;
      var bx = ((t * sp + i * 220 - cam * 0.3) % (W + 90)) - 45;
      var by = Math.round(GY * (0.2 + i * 0.045)) + Math.round(Math.sin(t * 0.7 + i) * 5);
      var f = Math.sin(t * 7 + i * 2) > 0 ? 0 : 1;
      px('#3d4a5c', bx - 3, by + f, 3, 1); px('#3d4a5c', bx + 1, by + f, 3, 1);
      px('#3d4a5c', bx, by + 1, 1, 1);
    }
  }

  // the post at the edge of camp, with the night ahead burned into it
  function signpost(px, x, baseY, n) {
    if (x < -30 || x > W + 30) return;
    px(C.wood0, x - 3, baseY - 46, 6, 46);
    px(C.wood1, x - 2, baseY - 45, 3, 44);
    box(px, C.wood2, C.wood0, x - 20, baseY - 62, 41, 19);
    px(C.wood3, x - 19, baseY - 61, 39, 6);
    for (var i = 0; i < Math.min(n, 10); i++)
      px(C.wood0, x - 16 + i * 4, baseY - 54, 2, 7);
    if (n > 10) px(C.fire2, x + 12, baseY - 54, 6, 7);
    px(C.stone1, x - 7, baseY - 3, 15, 4);
    px(C.stone2, x - 6, baseY - 4, 12, 2);
  }

  function lights(cam, dim) {
    for (var L = 1; L < 13; L++) {
      var u6 = L / 13, blx = Math.round(LPL + u6 * (LPR - LPL)) - cam;
      if (blx < -6 || blx > W + 6) continue;
      var bly = LTOP + Math.round(Math.sin(u6 * Math.PI) * LSAG);
      px(C.wood0, blx, bly + 1, 1, 2);
      var on = Math.sin(t * 1.5 + L * 1.7) > -0.55;
      if (dim) { disc(px, on ? C.fire3 : C.fire1, blx, bly + 5, 2, 3); continue; }
      disc(px, on ? C.fire4 : C.fire3, blx, bly + 5, 2, 3);
      px(on ? '#fffbe6' : C.fire4, blx - 1, bly + 4, 1, 1);
    }
  }

  function mix(a, b, u) {
    function n(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
    var A = n(a), B = n(b), o = '#';
    for (var i = 0; i < 3; i++) {
      var v = Math.round(A[i] + (B[i] - A[i]) * u).toString(16);
      o += v.length < 2 ? '0' + v : v;
    }
    return o;
  }

  // ── the readout ───────────────────────────────────────────────────────────
  var elFireNum = document.getElementById('fireNum'),
      elFireBar = document.getElementById('fireBar'),
      elFireFill = elFireBar.querySelector('i'),
      elDawn = document.getElementById('dawnbar').querySelector('i'),
      elNight = document.getElementById('nightNum'),
      elCarry = document.getElementById('carryLbl'),
      elTill = document.getElementById('tillDawn');

  var elRoad = document.getElementById('road');
  (function () {
    var h = '';
    for (var i = 0; i < NIGHTS.length; i++) h += '<i></i>';
    elRoad.innerHTML = h;
  })();
  function markRoad(n) {
    var d = elRoad.children;
    for (var i = 0; i < d.length; i++)
      d[i].className = n > d.length ? 'done' : i + 1 < n ? 'done' : i + 1 === n ? 'now' : '';
  }

  var elFireLbl = document.getElementById('fireLbl');
  function hud() {
    var pctF = Math.round(S.fuel / FUEL_MAX * 100);
    elFireNum.textContent = pctF;
    elFireFill.style.width = pctF + '%';
    if (S.mode === 'day') {
      elFireLbl.textContent = 'Camp';
      elFireBar.classList.remove('low');
      elDawn.style.width = '0%';
      elNight.textContent = S.n;
      elCarry.textContent = save.best ? 'Best night ' + save.best : 'Rested';
      elTill.textContent = 'ahead';
      return;
    }
    elFireLbl.textContent = 'Fire';
    elFireBar.classList.toggle('low', pctF < 25);
    elDawn.style.width = Math.round((1 - S.left / S.cfg.len) * 100) + '%';
    elNight.textContent = S.n;
    elCarry.textContent = 'Carrying ' + S.carry + '/' + MAXCARRY;
    elTill.textContent = Math.ceil(S.left) + 's';
  }

  // ── cards ─────────────────────────────────────────────────────────────────
  var veil = document.getElementById('veil'), card = document.getElementById('card');
  function show(html) { card.innerHTML = html; veil.classList.remove('hide'); running = false; }
  function hide() { veil.classList.add('hide'); running = true; }

  function strip(upto) {
    var s = '<div class="nights">';
    for (var i = 1; i <= NIGHTS.length; i++)
      s += '<i class="' + (i < upto ? 'done' : i === upto ? 'now' : '') + '"></i>';
    return s + '</div>';
  }
  function bindGo(fn, id) {
    var b = document.getElementById(id || 'go');
    if (b) b.addEventListener('click', function () { ac(); fn(); });
  }

  var elBan = document.getElementById('banner'), banT = null;
  function banner(head, sub, hold) {
    elBan.innerHTML = '<b>' + head + '</b><span>' + sub + '</span>';
    elBan.classList.add('on');
    clearTimeout(banT);
    banT = setTimeout(function () { elBan.classList.remove('on'); }, hold || 2600);
  }

  var elA = document.getElementById('kA'), elJ = document.getElementById('kJ');
  function camp() {
    newCamp();
    hide();
    elA.textContent = 'TAKE\nWATCH';
    elA.classList.add('go');
    banner('Camp', 'Wander as far as you like. TAKE WATCH when you are ready.', 3400);
  }
  function startNight(n) {
    var cfg = cfgFor(n);
    newNight(n);
    elA.textContent = 'SWING';
    elA.classList.remove('go');
    banner('Night ' + n + ' · ' + cfg.name, cfg.note, 3000);
  }

  function title() {
    newCamp();
    show(
      '<div class="eyebrow">' + (save.best >= NIGHTS.length ? 'The whole road, walked' : 'Night Watch') + '</div>' +
      '<h1>Keep it<em>burning</em></h1>' +
      '<p class="lede">Twenty nights on the road. One fire between you and the dark.</p>' +
      '<div class="rules">' +
        '<p><b>◀ ▶</b> walk, <b>JUMP</b> for anything more than a step high.</p>' +
        '<p>Step over wood to pick it up — three at a time.</p>' +
        '<p><b>Stand at the stones</b> and he feeds the fire himself, one log at a time.</p>' +
        '<p><b>SWING</b> the brand at the shades. Let one reach the fire and it takes a bite out of it.</p>' +
        '<p>Hold until dawn, then walk back to camp and rest.</p>' +
      '</div>' +
      strip(save.night) +
      '<button class="go" id="go">' + (save.night > 1 ? 'Back to camp — night ' + save.night + ' ahead' : 'Walk out to the camp') + '</button>' +
      '<div class="foot">' + (save.best ? 'Best: night ' + save.best + ' · ' : '') + BUILD + '</div>'
    );
    bindGo(function () { camp(); });
  }

  function finish(survived) {
    running = false;
    if (survived) {
      bell(523, 0.5, 0.06, 2600);
      setTimeout(function () { bell(784, 0.7, 0.05, 2800); }, 170);
      save.kept++;
      if (S.n > save.best) save.best = S.n;
      save.night = S.n + 1; store();
      if (S.n === NIGHTS.length) return won();
      var next = cfgFor(S.n + 1);
      show(
        '<div class="eyebrow">Dawn</div>' +
        '<h1>Night ' + S.n + '<em>held</em></h1>' +
        '<p class="lede">The sun comes over the hill and the fire is still going. Sit down a minute.</p>' +
        '<div class="tally">' +
          '<div><span>Logs fed</span><b>' + S.fed + '</b></div>' +
          '<div><span>Driven off</span><b>' + S.driven + '</b></div>' +
          '<div><span>Fire left</span><b>' + Math.round(S.fuel) + '</b></div>' +
        '</div>' +
        strip(S.n + 1) +
        '<p class="lede">Next: <b style="color:var(--bone)">' + next.name + '</b></p>' +
        '<button class="go" id="go">Back to camp</button>' +
        '<button class="ghost" id="stop">Put it down for now</button>'
      );
      bindGo(function () { camp(); });
      bindGo(function () { title(); }, 'stop');
    } else {
      bell(140, 0.8, 0.07, 700);
      if (S.n > save.best) save.best = S.n;
      store();
      var n2 = S.n;
      show(
        '<div class="eyebrow">The fire went out</div>' +
        '<h1>Night ' + n2 + '<em>lost</em></h1>' +
        '<p class="lede">He sat in the cold until the sky turned grey on its own. No harm done — but the dark got its way tonight.</p>' +
        '<div class="tally">' +
          '<div><span>Held for</span><b>' + Math.round(S.cfg.len - S.left) + 's</b></div>' +
          '<div><span>Logs fed</span><b>' + S.fed + '</b></div>' +
          '<div><span>Driven off</span><b>' + S.driven + '</b></div>' +
        '</div>' +
        strip(n2) +
        '<button class="go" id="go">Back to camp</button>' +
        '<button class="ghost" id="stop">Put it down for now</button>'
      );
      bindGo(function () { camp(); });
      bindGo(function () { title(); }, 'stop');
    }
  }

  function won() {
    show(
      '<div class="eyebrow">Twenty nights</div>' +
      '<h1>You kept it<em>all the way</em></h1>' +
      '<p class="lede">Every night on the road, and the fire never once went out. Put the brand down. You have earned the morning.</p>' +
      '<div class="tally">' +
        '<div><span>Nights held</span><b>' + NIGHTS.length + '</b></div>' +
        '<div><span>Logs fed</span><b>' + S.fed + '</b></div>' +
        '<div><span>Driven off</span><b>' + S.driven + '</b></div>' +
      '</div>' +
      strip(NIGHTS.length + 1) +
      '<p class="lede">The road does not end there. It just stops being counted.</p>' +
      '<button class="go" id="go">Back to camp — night ' + save.night + ' ahead</button>' +
      '<div class="foot">' + BUILD + '</div>'
    );
    bindGo(function () { camp(); });
  }

  // ── loop, fixed step ──────────────────────────────────────────────────────
  var last = performance.now(), acc = 0, STEP = 1 / 60;
  function frame(now) {
    var dt = Math.min(0.25, (now - last) / 1000); last = now;
    t += dt;
    if (running && S) {
      acc += dt;
      var guard = 0;
      while (acc >= STEP && running && guard++ < 8) { step(STEP); acc -= STEP; }
      hud();
    }
    if (S) draw();
    elA.classList.toggle('cool', !!(S && S.mode === 'night' && S.swingCd > 0));
    elJ.classList.toggle('on', !!(S && !S.onGround));
    requestAnimationFrame(frame);
  }

  title();
  requestAnimationFrame(frame);

  window.__NW = {
    get s() { return S; }, nights: NIGHTS, build: BUILD,
    hold: function (k, v) { held[k] = v; },
    ground: groundY,
    tap: function (id) { var e = document.getElementById(id); if (e) e.click(); },
    skip: function () { if (S) S.left = 0.02; },
    geo: { W: W, H: H, GY: GY, WORLD: WORLD, FIREX: FIREX },
    tick: function (dt) { if (S && running) step(dt); },
    begin: function (n) { startNight(n); running = true; veil.classList.add('hide'); },
    camp: function () { camp(); },
    live: function () { return running; },
    mute: function (v) { muted = v; }
  };
})();
</script>
</body>
</html>
