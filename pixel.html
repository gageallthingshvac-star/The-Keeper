      for (var k = S.shades.length - 1; k >= 0; k--) {
        var sh = S.shades[k];
        if (Math.abs(sh.x - b.x) > 13 || Math.abs(sh.y - b.y) > 13) continue;
        hurt(k, b.dmg, b.vx > 0 ? 1 : -1, b.kb, 1);
        if (--b.left <= 0) { S.shots.splice(i, 1); }
        break;
      }
    }
  }

  // damage one of them; drive it off if that finishes it
  function hurt(i, dmg, dir, kb, shot) {
    var sh = S.shades[i];
    if (sh.b && sh.b.armour && !shot) dmg = Math.max(1, Math.floor(dmg / 2));
    sh.hp -= dmg;
    sh.flash = 0.14;
    if (kb) { sh.x += dir * kb; sh.stun = 0.22; }
    if (sh.hp <= 0) {
      S.shades.splice(i, 1); S.driven++;
      S.emb += 1 + ((sh.b && sh.b.hp) || 1);           // embers, off the ones you drive off
      burst(sh.x, sh.y, 11, 16);
    } else {
      burst(sh.x, sh.y, 4, 10, ['#c9b6ff', '#6b5aa0'], 8);
      bell(330, 0.1, 0.04, 1600);
    }
  }

  function burst(x, y, n, up, cols, spread, grav) {
    for (var i = 0; i < n; i++) S.sparks.push({
      x: x + (Math.random() - 0.5) * (spread || 18), y: y,
      vx: (Math.random() - 0.5) * 46, vy: -(up || 26) - Math.random() * 44,
      life: 1, c: cols || null, g: grav
    });
  }

  // ── input ─────────────────────────────────────────────────────────────────
  var held = { l: false, r: false, a: false, j: false };
  var taps = { a: 0, j: 0 };
  function took(k) { if (taps[k]) { taps[k] = 0; return true; } return false; }
  function bindKey(el, set, tap) {
    var down = function (e) { e.preventDefault(); set(true); if (tap) taps[tap]++; el.classList.add('on'); ac(); };
    var up = function (e) { e.preventDefault(); set(false); el.classList.remove('on'); };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    window.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
  }
  bindKey(document.getElementById('kL'), function (v) { held.l = v; });
  bindKey(document.getElementById('kR'), function (v) { held.r = v; });
  bindKey(document.getElementById('kJ'), function (v) { held.j = v; }, 'j');
  bindKey(document.getElementById('kA'), function (v) { held.a = v; }, 'a');
  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    var k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') held.l = true;
    else if (k === 'd' || k === 'arrowright') held.r = true;
    else if (k === ' ' || k === 'arrowup' || k === 'w') { held.j = true; taps.j++; e.preventDefault(); }
    else if (k === 'f' || k === 'j' || k === 'x' || k === 'arrowdown') { held.a = true; taps.a++; e.preventDefault(); }
    else if (k === 'm') muted = !muted;
    else return;
    ac();
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') held.l = false;
    else if (k === 'd' || k === 'arrowright') held.r = false;
    else if (k === ' ' || k === 'arrowup' || k === 'w') held.j = false;
    else if (k === 'f' || k === 'j' || k === 'x' || k === 'arrowdown') held.a = false;
  });

  // ── left to himself ───────────────────────────────────────────────────────
  // Take your hands off the controls at camp and he gets on with his evening.
  // Touch anything and you have him back on the same frame.
  var HAUNTS = [
    { at: 'fire',   act: 'poke',  hold: 3.4 },
    { at: 'pile',   act: 'stack', hold: 3.0 },
    { at: 'pot',    act: 'stir',  hold: 3.2 },
    { at: 'bowl',   act: 'pet',   hold: 3.8 },
    { at: 'chop',   act: 'stack', hold: 2.8 },
    { at: 'barrel', act: 'stir',  hold: 2.6 },
    { at: 'seat',   act: 'sit',   hold: 5.0 },
    { at: 'tent',   act: 'look',  hold: 2.4 },
    { at: 'sign',   act: 'look',  hold: 3.6 }
  ];
  function idleAbout(dt, moving) {
    if (moving || held.a || held.j || S.chore) {     // you took over
      S.idleT = 0; S.auto = null; return;
    }
    S.idleT = (S.idleT || 0) + dt;
    if (S.idleT < 3.2) return;

    if (!S.auto) {                                   // pick somewhere to be
      var H = HAUNTS[Math.floor(Math.random() * HAUNTS.length)];
      var side = Math.random() < 0.5 ? -1 : 1;
      S.auto = { x: AT[H.at] + side * (H.act === 'sit' ? 34 : 26),
                 act: H.act, hold: H.hold, phase: 'walk', left: 0, dir: -side };
      S.sayT = S.sayT == null ? 4 : S.sayT;
    }
    var A2 = S.auto;
    if (A2.phase === 'walk') {
      var d = A2.x - S.x;
      if (Math.abs(d) < 3) { A2.phase = 'do'; A2.left = A2.hold; S.dir = A2.dir; S.moving = 0; }
      else {
        var step2 = Math.sign(d) * SPEED * 0.55 * dt;
        var nx2 = S.x + step2, ng2 = groundY(nx2);
        if (ng2 >= S.y - STEP_UP) { S.x = nx2; if (S.onGround && ng2 < S.y) S.y = ng2; }
        else A2.phase = 'do', A2.left = 1.2;         // something in the way; give up on it
        S.dir = Math.sign(d) || S.dir;
        S.step += dt * 4.2; S.moving = 1;
        S.y = groundY(S.x);
      }
    } else {
      A2.left -= dt; S.moving = 0;
      if (A2.left <= 0) S.auto = null;
    }

    // and every so often he says something
    S.sayT -= dt;
    if (S.sayT <= 0) {
      S.sayT = 7 + Math.random() * 6;
      var line = musing();
      if (line) { banner(HIM.name, line); S.sayT += readTime(line) / 1000; store(); }
    }
  }

  // ── one tick, of a night or of a day at the camp ──────────────────────────
  function step(dt) {
    var cfg = S.cfg;
    var day = S.mode === 'day';
    var hitA = held.a || took('a'), hitJ = held.j || took('j');

    // walking, over ground that is not all one height
    var mv = (held.r ? 1 : 0) - (held.l ? 1 : 0);
    S.moving = 0;
    if (mv) {
      S.dir = mv;
      var nx = Math.max(18, Math.min(WORLD - 18, S.x + mv * (S.spd || SPEED) * dt));
      var ng = groundY(nx);
      if (ng >= S.y - STEP_UP) {                 // low enough to walk or step onto
        S.x = nx;
        if (S.onGround && ng < S.y) S.y = ng;    // up the step
      }
      if (S.onGround) {
        S.step += dt * 5.4; S.moving = 1;
        if (Math.floor(S.step) !== S.foot) { S.foot = Math.floor(S.step); bell(78, 0.06, 0.022, 380); }
      }
    }

    // the jump, and the fall that follows it
    var g = groundY(S.x);
    if (hitJ && S.onGround && !S.jumpHeld) {
      S.vy = -JUMPV; S.onGround = false; S.jumpHeld = true;
      bell(240, 0.09, 0.035, 1100);
    }
    if (!held.j) S.jumpHeld = false;
    if (!S.onGround) {
      S.vy += GRAV * dt;
      S.y += S.vy * dt;
      if (S.vy > 0 && S.y >= g) {
        if (S.vy > 120) bell(64, 0.11, 0.04, 340);
        S.y = g; S.vy = 0; S.onGround = true;
      }
    } else if (g > S.y + 1) {                    // he walked off the edge of it
      S.onGround = false; S.vy = 0;
    } else S.y = g;

    if (day) {
      S.fuel = 94 + Math.sin(t * 0.7) * 5;   // at camp it is banked right up
      if (S.swing > 0) S.swing -= dt;
      if (S.swingCd > 0) S.swingCd -= dt;
      if (S.chore) {                               // head down, getting on with it
        var K2 = S.chore;
        K2.left -= dt;
        K2.p = 1 - Math.max(0, K2.left) / K2.dur;
        for (var bi = 0; bi < K2.c.beats.length; bi++)
          if (!K2.hit[bi] && K2.p >= K2.c.beats[bi]) { K2.hit[bi] = 1; choreBeat(K2.c.id, bi); }
        if (K2.left <= 0) {
          var c = K2.c; S.chore = null;
          PREP[c.id]++;
          bell(c.id === 'wood' ? 210 : 470, 0.26, 0.05, 1700);
          banner(c.did, c.say, 1700);
        }
        return;
      }
      if (hitA && S.swingCd <= 0) {
        var st = stationAt(S.x);
        S.swingCd = 0.35;
        if (st && !st.done && st.c.arms) { armsCard(); return; }
        if (st && !st.done && st.c.talk) {
          S.x = st.c.x + (S.x < st.c.x ? -1 : 1) * st.c.off;
          S.y = groundY(S.x); S.dir = S.x < st.c.x ? 1 : -1;
          talkCard();
          return;
        }
        if (st && !st.done) {
          S.chore = { c: st.c, left: st.c.dur, dur: st.c.dur, p: 0, hit: [] };
          var sd = S.x < st.c.x ? -1 : 1;           // he steps round to face the job
          S.x = st.c.x + st.c.off * sd;
          S.y = groundY(S.x); S.onGround = true; S.vy = 0;
          S.dir = -sd;
          bell(150, 0.1, 0.04, 800);
        } else if (st) {
          bell(160, 0.12, 0.03, 700);            // done already — walk clear to set out
          banner('That one is done', 'Step away from the camp things to take the watch.', 1500);
        } else startNight(S.n);
        return;
      }
      if (S.shake > 0) S.shake -= dt;
      if (S.walkTo || S.pose) { meetTick(dt); return; }
      idleAbout(dt, mv);
      var want0 = Math.max(0, Math.min(WORLD - W, S.x - W / 2));
      S.cam += (want0 - S.cam) * Math.min(1, dt * 7);
      return;
    }

    // ── the lamp, and the fire you have to carry to it ──────────────────
    // This is the point of the whole walk. On a landmark night a cold lamp
    // stands out past the ring; you take a light off the fire and carry it
    // there, and while you are carrying it you cannot swing at anything.
    if (S.rite) {
      S.riteT += dt;
      if (S.riteT > 0.55 && !S.riteFlare) {
        S.riteFlare = 1;
        S.lampLit = 1;
        burst(S.lamp.x, GY - LAMP_H, 46, 90, ['#fffbe6', '#ffd27a', '#ff9a2e'], 26, -30);
        S.shake = 0.5;
        bell(180, 0.9, 0.08, 1400);
        setTimeout(function () { bell(520, 1.1, 0.06, 2800); }, 200);
        if (save.lamps.indexOf(S.lamp.id) < 0) { save.lamps.push(S.lamp.id); store(); }
        S.emb += 40;
        banner(S.lamp.name + ' \u2014 lit',
               'That is one more of the five. The road is lit that far behind you.', 5200);
      }
      if (S.riteT > 2.4) { S.rite = 0; S.light = 0; }
      S.moving = 0;
    } else if (S.light > 0) {
      S.light -= dt;
      if (S.light <= 0) {
        S.light = 0;
        banner('It went out', 'Back to the fire and take another. Do not run with it.', 4000);
        bell(150, 0.4, 0.05, 700);
      } else if (Math.random() < dt * 22) {
        S.sparks.push({ x: S.x + S.dir * 8, y: S.y - 26, vx: (Math.random() - 0.5) * 10,
                        vy: -14 - Math.random() * 10, life: 0.5, g: 10 });
      }
    }
    var atLamp = !!(S.lamp && !S.lampLit && Math.abs(S.x - S.lamp.x) < 26);
    var atFire = Math.abs(S.x - FIREX) < 32;
    if (hitA && !S.rite) {
      if (S.light > 0 && atLamp) {                     // put it to the lamp
        S.rite = 1; S.riteT = 0; S.riteFlare = 0; S.dir = 1;
        S.swing = 0; S.swingCd = 0.6;
      } else if (S.light <= 0 && atFire && S.lamp && !S.lampLit && S.fuel > 18) {
        S.light = LIGHT_LIFE; S.fuel = Math.max(0, S.fuel - 6);
        bell(700, 0.2, 0.05, 2600);
        banner('Carrying fire', 'It burns down as you walk, and you cannot swing while you hold it.', 4600);
        hitA = false;
      }
    }
    if (S.rite) {                                      // nothing else happens mid-rite
      S.left -= dt;
      S.fuel = Math.max(0, S.fuel - cfg.drain * dt * 0.4);
      var wantR = Math.max(0, Math.min(WORLD - W, S.x - W / 2));
      S.cam += (wantR - S.cam) * Math.min(1, dt * 7);
      for (var qs = S.sparks.length - 1; qs >= 0; qs--) {
        var sq = S.sparks[qs];
        sq.life -= dt * 0.95; if (sq.life <= 0) { S.sparks.splice(qs, 1); continue; }
        sq.x += sq.vx * dt; sq.y += sq.vy * dt; sq.vy += (sq.g == null ? 42 : sq.g) * dt;
      }
      if (S.shake > 0) S.shake -= dt;
      return;
    }

    // ── the swing, over the top and down
    var WEP = S.wep || WEAPONS[0];
    if (S.swingCd > 0) S.swingCd -= dt;
    if (S.swing > 0) {
      S.swing -= dt;
      if (S.swing <= WEP.dur * 0.42 && !S.landed) { S.landed = 1; strike(WEP); }
    }
    if (hitA && S.swingCd <= 0 && !S.light) {
      S.swingCd = S.cd || WEP.cd; S.swing = WEP.dur; S.landed = 0;
      fire(WEP);
      bell(WEP.kind === 'torch' ? 190 : 150, 0.14, 0.05, 900);
    }
    // the old light does not wait to be asked
    if (WEP.aim && WEP.auto && !S.light) {
      S.autoT -= dt;
      if (S.autoT <= 0) { S.autoT = WEP.auto; fire(WEP); }
    }
    stepShots(dt);
    for (var tr = S.trails.length - 1; tr >= 0; tr--) {      // fire left hanging
      var TR = S.trails[tr];
      TR.life -= dt;
      if (TR.life <= 0) { S.trails.splice(tr, 1); continue; }
      for (var ti2 = S.shades.length - 1; ti2 >= 0; ti2--) {
        var sh2 = S.shades[ti2];
        if (sh2.burn > 0) continue;
        if (Math.abs(sh2.x - TR.x) < 13 && Math.abs(sh2.y - TR.y) < 13) {
          sh2.burn = 0.5; hurt(ti2, 1, TR.x < sh2.x ? 1 : -1, 8);
        }
      }
    }
    for (var bi2 = S.shades.length - 1; bi2 >= 0; bi2--)
      if (S.shades[bi2].burn > 0) S.shades[bi2].burn -= dt;

    // picking wood up on the way past
    for (var j = S.logs.length - 1; j >= 0; j--) {
      S.logs[j].born += dt;
      if (S.carry < (S.carryMax || MAXCARRY) && Math.abs(S.logs[j].x - S.x) < 17
          && Math.abs(S.logs[j].y - S.y) < 26) {
        S.logs.splice(j, 1); S.carry++;
        bell(300, 0.1, 0.045, 1400);
      }
    }
    S.woodT -= dt;
    if (S.woodT <= 0) { S.woodT = cfg.wood; dropLog(); }
    if (S.pileT > 0) S.pileT -= dt;
    if (S.pile > 0 && S.carry < (S.carryMax || MAXCARRY) && S.pileT <= 0
        && Math.abs(S.x - AT.chop) > 0 && Math.abs(S.x - AT.pile) < 20) {
      S.pile--; S.carry++; S.pileT = 0.3;
      bell(300, 0.1, 0.045, 1400);
    }

    // feeding, which happens simply by standing at the stones
    if (S.feed > 0) S.feed -= dt;
    if (S.carry > 0 && Math.abs(S.x - FIREX) < 34 && S.feed <= 0) {
      S.carry--; S.fed++; S.feed = 0.34;
      S.fuel = Math.min(FUEL_MAX, S.fuel + LOG_FUEL);
      burst(FIREX, GY - 14, 12, 30);
      bell(420, 0.26, 0.05, 1700);
    }

    // ── the ones who came back with you ─────────────────────────────────
    if (hasFolk('mara')) {                             // she feeds it while you are away
      S.helpT -= dt;
      if (S.helpT <= 0 && Math.abs(S.x - FIREX) > 90 && S.fuel < FUEL_MAX - LOG_FUEL) {
        S.helpT = 9; S.fuel = Math.min(FUEL_MAX, S.fuel + LOG_FUEL * 0.7);
        burst(FIREX, GY - 14, 7, 24);
      }
    }
    if (hasFolk('sella')) {                            // an arrow into anything close in
      S.arrowT -= dt;
      if (S.arrowT <= 0) {
        var near = null;
        for (var na = 0; na < S.shades.length; na++)
          if (Math.abs(S.shades[na].x - FIREX) < 120 &&
              (!near || Math.abs(S.shades[na].x - FIREX) < Math.abs(near.x - FIREX))) near = S.shades[na];
        if (near) {
          S.arrowT = 3.4;
          hurt(S.shades.indexOf(near), 2, near.x > FIREX ? 1 : -1, 14);
          bell(700, 0.09, 0.03, 2400);
        } else S.arrowT = 0.5;
      }
    }
    if (hasFolk('tam') && S.logs.length < 3 && Math.random() < dt * 0.5) dropLog();
    if (hasFolk('nell')) {                             // she holds the far side
      for (var nf = S.shades.length - 1; nf >= 0; nf--) {
        var fs = S.shades[nf];
        if (Math.sign(fs.x - FIREX) === -S.dir && Math.abs(fs.x - FIREX) < 46 && Math.random() < dt * 2.2) {
          hurt(nf, 2, fs.x > FIREX ? 1 : -1, 20);
        }
      }
    }

    // the shades
    S.shadeT -= dt;
    if (S.shadeT <= 0) { S.shadeT = cfg.gap; spawnShade(); }
    for (var k = S.shades.length - 1; k >= 0; k--) {
      var s2 = S.shades[k], B2 = s2.b || BEASTS[0];
      if (s2.flash > 0) s2.flash -= dt;
      if (s2.stun > 0) { s2.stun -= dt; continue; }

      // the thief goes for wood on the ground, not for the fire
      if (B2.steals && hasPet('cat')) {                // she sees them off the woodpile
        S.shades.splice(k, 1);
        burst(s2.x, s2.y, 6, 14, ['#c9b6ff', '#6b5aa0'], 10);
        continue;
      }
      if (B2.steals) {
        var want = null;
        for (var lj = 0; lj < S.logs.length; lj++)
          if (!want || Math.abs(S.logs[lj].x - s2.x) < Math.abs(want.x - s2.x)) want = S.logs[lj];
        var goX = want ? want.x : FIREX;
        s2.x += Math.sign(goX - s2.x) * cfg.spd * B2.spd * dt;
        s2.y = groundY(s2.x) - 14 + Math.sin(t * 6 + s2.ph) * 2;
        if (want && Math.abs(want.x - s2.x) < 12) {
          S.logs.splice(S.logs.indexOf(want), 1);
          S.shades.splice(k, 1);
          bell(210, 0.2, 0.05, 900);
          burst(s2.x, s2.y, 8, 20, ['#a06f3d', '#4a3018'], 10);
        }
        continue;
      }

      var toward = FIREX - s2.x;
      s2.x += Math.sign(toward) * cfg.spd * B2.spd * dt;
      var prog = 1 - Math.min(1, Math.abs(FIREX - s2.x) / s2.d0);
      if (B2.dive) {                                   // rides high then folds and drops
        var d2 = prog < 0.66 ? 0 : (prog - 0.66) / 0.34;
        s2.y = s2.y0 + (GY - 22 - s2.y0) * (d2 * d2) + Math.sin(t * 3.1 + s2.ph) * 6;
      } else if (B2.lo < 20) {                         // stays down on the ground
        s2.y = groundY(s2.x) - B2.lo + Math.sin(t * 7 + s2.ph) * 2;
      } else {
        s2.y = s2.y0 + (GY - 24 - s2.y0) * prog + Math.sin(t * 1.4 + s2.ph) * 4;
      }

      if (Math.abs(FIREX - s2.x) < 26) {
        S.shades.splice(k, 1);
        S.fuel = Math.max(0, S.fuel - BITE * B2.bite);
        if (B2.chill) S.chill = 3.2;                   // the light shrinks for a moment
        S.bitten++;
        S.shake = 0.3;
        buzz(30);
        bell(96, 0.5, 0.07, 500);
        for (var p = 0; p < 8; p++) S.puffs.push({
          x: FIREX + (Math.random() - 0.5) * 26, y: GY - 20,
          vx: (Math.random() - 0.5) * 24, vy: -12 - Math.random() * 20, life: 1
        });
      }
    }
    if (S.chill > 0) S.chill -= dt;

    // sparks and puffs
    for (var q = S.sparks.length - 1; q >= 0; q--) {
      var sp = S.sparks[q];
      sp.life -= dt * 0.95; if (sp.life <= 0) { S.sparks.splice(q, 1); continue; }
      sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.vy += (sp.g == null ? 42 : sp.g) * dt;
    }
    for (var r = S.puffs.length - 1; r >= 0; r--) {
      var pf = S.puffs[r];
      pf.life -= dt * 0.7; if (pf.life <= 0) { S.puffs.splice(r, 1); continue; }
      pf.x += pf.vx * dt; pf.y += pf.vy * dt; pf.vy += 6 * dt;
    }
    if (S.shake > 0) S.shake -= dt;

    // the fire, and the clock
    S.fuel = Math.max(0, S.fuel - cfg.drain * dt);
    if (S.fuel < 22 && !S.cried && S.left > 6) { S.cried = 1; bark('low'); }
    if (S.fuel > 40) S.cried = 0;
    S.left -= dt;
    if (S.fuel <= 0) { finish(false); return; }
    if (S.left <= 0) { S.left = 0; finish(true); return; }

    // camera
    var want = Math.max(0, Math.min(WORLD - W, S.x - W / 2));
    S.cam += (want - S.cam) * Math.min(1, dt * 7);
  }

  // ── one frame ─────────────────────────────────────────────────────────────
  var DAYSKY = ['#3a79ad', '#5b96c6', '#86b6da', '#b2d2e9', '#dcebf2'];
  function draw() {
    var cam = Math.round(S.cam) + (S.shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0);
    var lvl = S.fuel / FUEL_MAX;
    var day = S.mode === 'day';
    var dawn = day ? 0 : Math.max(0, 1 - S.left / 8);   // the last eight seconds go pale

    if (day) { drawDay(cam, lvl); return; }
    var reachR0 = (96 + lvl * 96) * (S.chill > 0 ? 0.72 : 1);

    // sky, with the horizon warming as dawn comes on
    for (var b = 0; b < 5; b++) {
      var col = RAMPS.sky[b];
      if (dawn > 0) col = mix(col, ['#241a2c', '#3b2740', '#5e3a4a', '#8a5352', '#c1785c'][b], dawn);
      px(col, 0, BAND[b], W, (b < 4 ? BAND[b + 1] : GY) - BAND[b]);
    }
    if (dawn < 0.75 && S.cfg.wx !== 'dark' && S.cfg.wx !== 'fog') {  // stars, when the sky is open
      var drift = Math.round(cam * 0.06);
      for (var st = 0; st < STARS; st++) {
        var sx = Math.round(hash(st, 17) * W) - drift % W;
        if (sx < 0) sx += W; if (sx >= W) sx -= W;
        var sy = 3 + Math.round(hash(st, 23) * STARY);
        var tw = Math.sin(t * (0.8 + hash(st, 29) * 1.6) + st * 2.1);
        if (tw < -0.55) continue;
        var mag = hash(st, 31);
        var fade = dawn > 0.4 ? 1 : 0;
        px(mag > 0.93 ? (fade ? '#a99cb4' : '#ffe9c0') : mag > 0.6 ? (fade ? '#8f849e' : '#d6cee2')
          : (fade ? '#6d6480' : '#9d94ad'), sx, sy, 1, 1);
        if (mag > 0.96) { px('#fff6dc', sx - 1, sy, 1, 1); px('#fff6dc', sx + 1, sy, 1, 1); }
      }
    }
    if (dawn < 0.8 && S.cfg.wx !== 'dark' && S.cfg.wx !== 'fog') {   // the moon, when there is one
      var mx = Math.round(W * 0.2), my = Math.round(GY * 0.19);
      var mA = dawn > 0.4 ? '#9d8f9c' : '#ded7ea', mB = dawn > 0.4 ? '#b3a4b0' : '#fbf6ff';
      disc(px, mA, mx, my, 13, 13); disc(px, mB, mx - 1, my - 1, 10, 10);
      disc(px, mA, mx - 4, my - 4, 3, 3); disc(px, mA, mx + 3, my + 2, 2, 2);
      disc(px, mA, mx - 1, my + 6, 2, 2);
    }
    for (var cl = 0; cl < 3; cl++) {                // haze lying over the hills
      var cy = Math.round(GY * (0.50 + cl * 0.07));
      var cw = 110 + cl * 40, cx = ((t * (2.4 + cl) + cl * 151 - cam * 0.05) % (W + cw * 2)) - cw;
      var cc = dawn > 0.3 ? mix(RAMPS.sky[4], '#b3705e', dawn) : RAMPS.sky[4];
      px(cc, cx + 10, cy, cw - 20, 2);
      px(cc, cx, cy + 2, cw, 3);
      px(cc, cx + 22, cy + 5, cw - 52, 2);
    }
    if (dawn > 0.15) {                              // the sun, coming up behind the hill
      var sunY = RIDGE + 18 - Math.round(dawn * 28);
      disc(px, dawn > 0.55 ? '#ffdfa0' : '#e8a06e', Math.round(W * 0.74), sunY, 15, 15);
      disc(px, dawn > 0.55 ? '#fff3cf' : '#f5bd83', Math.round(W * 0.74), sunY - 1, 11, 11);
    }

    // two ridges, moving slower than the ground
    var far = Math.round(cam * 0.22), mid = Math.round(cam * 0.48);
    for (var hx = 0; hx < W; hx++) {
      var wx = hx + far;
      var h1 = RIDGE - Math.round(11 * Math.sin(wx * 0.019) + 6 * Math.sin(wx * 0.043 + 1));
      px(C.far2, hx, h1, 1, 2); px(C.far1, hx, h1 + 2, 1, GY - h1 - 2);
    }
    for (var tx = 0; tx < W; tx++) {
      var wx2 = tx + mid;
      var tb = TLINE - Math.round(7 * Math.abs(Math.sin(wx2 * 0.08)) + 4 * Math.sin(wx2 * 0.028));
      px(C.tree2, tx, tb, 1, 2); px(C.tree1, tx, tb + 2, 1, GY - tb - 2);
      if (hash(wx2, 3) > 0.86) px(C.tree0, tx, tb - 2, 1, 3);
    }

    // the baked world, one slice of it
    ctx.drawImage(terrain, cam, 0, W, H, 0, 0, W, H);

    // wood on the ground
    for (var i = 0; i < S.logs.length; i++) {
      var lx = Math.round(S.logs[i].x) - cam;
      if (lx > -30 && lx < W + 30) logSprite(px, lx, S.logs[i].y, t, i);
    }

    signpost(px, SIGN - cam, groundY(SIGN), S.n);
    woodpile(px, AT.pile - cam, S.pile);
    axeInBlock(px, AT.chop - cam);
    lights(cam, 0);
    var watchful = 0;
    for (var wi = 0; wi < S.shades.length; wi++)
      if (Math.abs(S.shades[wi].x - FIREX) < 190) { watchful = 1; break; }
    dog(px, AT.dog - cam, GY - 1, t, watchful);
    campfire(px, FIREX - cam, t, Math.max(0.06, lvl), GY, 0, windLean(S.cfg.wx));

    for (var ff = 0; ff < 9; ff++) {                // fireflies, out past the light
      var fx2 = FIREX + (hash(ff, 71) - 0.5) * 620 + Math.sin(t * 0.5 + ff) * 26 - cam;
      if (fx2 < -4 || fx2 > W + 4) continue;
      var fy2 = GY - 20 - hash(ff, 73) * 70 + Math.sin(t * 0.8 + ff * 2.1) * 12;
      if (Math.sin(t * 1.7 + ff * 1.3) < 0.25) continue;
      px('#d8e86a', fx2, fy2, 1, 1);
    }

    for (var q = 0; q < S.sparks.length; q++) {
      var sp = S.sparks[q];
      var cc2 = sp.c || [C.fire4, C.fire2];
      px(sp.life > 0.5 ? cc2[0] : cc2[1], (sp.x | 0) - cam, sp.y | 0, sp.c ? 1 : 2, sp.c ? 1 : 2);
    }
    for (var r = 0; r < S.puffs.length; r++) {
      var pf = S.puffs[r];
      px(pf.life > 0.5 ? C.shade2 : C.shade1, (pf.x | 0) - cam, pf.y | 0, 2, 2);
    }
    for (var k = 0; k < S.shades.length; k++) {
      var sh = S.shades[k];
      if (sh.x - cam > -30 && sh.x - cam < W + 30)
        shadeSprite(px, { x: sh.x - cam, y: sh.y, ph: sh.ph, b: sh.b,
                          flash: sh.flash, burn: sh.burn }, t, k,
                    Math.abs(sh.x - FIREX) < reachR0);
    }

    if (S.lamp) lampPost(px, Math.round(S.lamp.x) - cam, S.lampLit,
                         S.light > 0 && Math.abs(S.x - S.lamp.x) < 40);
    for (var bq = 0; S.shots && bq < S.shots.length; bq++) {   // arrows, shot, sparks
      var bb = S.shots[bq], bx = Math.round(bb.x) - cam, byy = Math.round(bb.y);
      if (bb.kind === 'arrow') {
        var ad = bb.vx > 0 ? 1 : -1;
        px(C.wood1, bx - ad * 5, byy, 7, 1);
        px(C.fire3, bx, byy - 1, 3, 3);
        px(C.fire4, bx, byy, 2, 2);
      } else if (bb.kind === 'shot') {
        px(C.fire2, bx, byy, 2, 2); px(C.fire4, bx, byy, 1, 1);
      } else {
        disc(px, C.fire2, bx - 2, byy - 2, 5, 5);
        px('#fffbe6', bx, byy, 2, 2);
      }
    }

    // him
    var hx2 = Math.round(S.x) - cam, hy2 = Math.round(S.y);
    for (var tq = 0; tq < S.trails.length; tq++) {   // fire hanging in the air
      var TQ = S.trails[tq], tf = Math.min(1, TQ.life);
      px(tf > 0.55 ? C.fire4 : tf > 0.3 ? C.fire3 : C.fire1,
         Math.round(TQ.x) - cam, Math.round(TQ.y), 3, 3);
    }

    var pose = !S.onGround ? 'jump' : S.moving ? 'walk' : 'idle';
    guy(px, hx2, hy2, t, S.dir, pose, S.step);
    if (S.carry) armful(px, hx2, hy2, S.carry, S.dir);

    var tip;
    if (S.light > 0 || S.rite) {                     // both hands on the fire he is carrying
      var lyy = hy2 - GUY_H + (S.rite ? 6 - Math.min(14, S.riteT * 20) : 14);
      var lxx = hx2 + S.dir * 7;
      px(C.wood0, lxx - 1, lyy + 4, 2, 12);
      disc(px, C.fire1, lxx - 4, lyy - 4, 9, 9);
      disc(px, C.fire3, lxx - 3, lyy - 3, 7, 7);
      disc(px, C.fire4, lxx - 2, lyy - 2, 5, 5);
      px('#fffbe6', lxx, lyy, 2, 2);
      tip = { x: lxx, y: lyy };
    } else tip = weapon(px, hx2, hy2, S.dir, S.wep || WEAPONS[0], S.swing);
    var by = tip.y;

    weather(S.cfg.wx, cam, lvl);

    var reachR = reachR0;
    var deep = dawn > 0 ? mix('#544c66', '#a99184', dawn) : '#544c66';
    lightPass(ctx, FIREX - cam, GY - 16, reachR, tip.x, tip.y, 1, deep);
    if (S.lamp && S.lampLit) {                       // the lamp throws its own, and it is bigger
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var lg = ctx.createRadialGradient(S.lamp.x - cam, GY - LAMP_H - 4, 3,
                                        S.lamp.x - cam, GY - LAMP_H - 4, 132);
      lg.addColorStop(0, 'rgba(255,214,140,0.52)');
      lg.addColorStop(0.42, 'rgba(255,160,70,0.18)');
      lg.addColorStop(1, 'rgba(255,140,50,0)');
      ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    if (S.rite) {                                    // the moment it catches
      var fl = S.riteT < 0.55 ? 0 : Math.max(0, 1 - (S.riteT - 0.55) / 1.5);
      if (fl > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,236,190,' + (fl * fl * 0.85).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
    }

    if (lvl < 0.22) {                              // the fire is going: the edges close in
      ctx.save();
      var vg = ctx.createRadialGradient(W / 2, GY - 40, W * 0.28, W / 2, GY - 40, W * 0.78);
      var a = (0.16 + 0.1 * Math.sin(t * 3.4)) * (1 - lvl / 0.22);
      vg.addColorStop(0, 'rgba(140,20,0,0)');
      vg.addColorStop(1, 'rgba(140,20,0,' + a.toFixed(3) + ')');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    edges(cam);
  }

  // ── what is happening off the edge of the screen ──────────────────────────
  // You cannot watch the fire and fetch wood at once, so the edge tells you:
  // a flame for the camp, a violet eye for a shade closing on it, a log for wood.
  // a small plate against the edge, with an arrow off the side of it
  function edgeMark(sx, col, glyph, urgency) {
    var side = sx < 0 ? -1 : 1;
    var pw = 13, ph = 15;
    var ex = side < 0 ? 6 : W - 6 - pw;
    var ey = Math.round(GY * 0.58) + (glyph === 'fire' ? -26 : glyph === 'wood' ? 26 : 0);
    var pulse = urgency && Math.sin(t * 9) > 0 ? 1 : 0;
    px('#120d16', ex, ey, pw, ph);
    px(col, ex, ey, pw, 1); px(col, ex, ey + ph - 1, pw, 1);
    px(col, ex, ey, 1, ph); px(col, ex + pw - 1, ey, 1, ph);
    if (pulse) {                                   // urgent: the frame thickens
      px(col, ex + 1, ey + 1, pw - 2, 1); px(col, ex + 1, ey + ph - 2, pw - 2, 1);
      px(col, ex + 1, ey + 1, 1, ph - 2); px(col, ex + pw - 2, ey + 1, 1, ph - 2);
    }
    var ax = side < 0 ? ex - 2 : ex + pw + 1, cy = ey + (ph >> 1);
    for (var a = 0; a < 4; a++) px(col, ax + side * a, cy - 3 + a, 1, 7 - a * 2);
    var gx = ex + 3, gy = ey + 3;
    if (glyph === 'fire') {
      px(C.fire1, gx + 1, gy + 6, 5, 3); px(C.fire2, gx + 1, gy + 4, 5, 3);
      px(C.fire3, gx + 2, gy + 1, 3, 4); px(C.fire4, gx + 3, gy, 1, 4);
    } else if (glyph === 'shade') {
      disc(px, C.shade1, gx + 3, gy + 5, 4, 4);
      px('#e8e0ff', gx + 1, gy + 3, 2, 2); px('#e8e0ff', gx + 4, gy + 3, 2, 2);
    } else {
      px(C.wood0, gx, gy + 3, 7, 5); px(C.wood2, gx, gy + 4, 7, 3);
      px(C.wood3, gx + 1, gy + 4, 5, 1);
    }
  }
  function edges(cam) {
    var f = FIREX - cam;
    if (f < 8 || f > W - 8) edgeMark(f < 0 ? -1 : 1, C.fire2, 'fire', S.fuel < 26);
    var shown = 0;
    for (var i = 0; i < S.shades.length && shown < 3; i++) {
      var sx = S.shades[i].x - cam;
      if (sx > -10 && sx < W + 10) continue;
      var close = Math.abs(S.shades[i].x - FIREX) < 150;
      edgeMark(sx, close ? C.shade3 : C.shade2, 'shade', close);
      shown++;
    }
    var near = null;
    for (var j = 0; j < S.logs.length; j++) {
      var d = Math.abs(S.logs[j].x - S.x);
      if (!near || d < near.d) near = { d: d, x: S.logs[j].x };
    }
    if (near && S.carry < MAXCARRY) {
      var wx2 = near.x - cam;
      if (wx2 < 8 || wx2 > W - 8) edgeMark(wx2 < 0 ? -1 : 1, C.wood3, 'wood', 0);
    }
  }

  // ── weather ───────────────────────────────────────────────────────────────
  // Deterministic: each mote is a number, so nothing needs storing between frames.
  var WX = {
    rain:  { n: 90, vy: 300, vx:  26, len: 7, w: 1, c: ['#6f7f9c', '#8b9cb8'] },
    sleet: { n: 76, vy: 210, vx:  46, len: 4, w: 1, c: ['#8fa0b4', '#c6d3e0'] },
    snow:  { n: 64, vy:  46, vx:  16, len: 1, w: 2, c: ['#cfd8e6', '#f2f6ff'] },
    frost: { n: 40, vy:  30, vx:  10, len: 1, w: 1, c: ['#b9c6d8', '#e6eef8'] }
  };
  function weather(kind, cam, lit) {
    var w = WX[kind];
    if (w) {
      var span = H + 40;
      for (var i = 0; i < w.n; i++) {
        var sway = kind === 'snow' || kind === 'frost'
          ? Math.sin(t * (0.6 + hash(i, 5) * 0.9) + i) * 9 : 0;
        var x = (hash(i, 1) * W + t * w.vx * (0.7 + hash(i, 2) * 0.6) + sway - cam * 0.35) % W;
        if (x < 0) x += W;
        var y = (hash(i, 3) * span + t * w.vy * (0.75 + hash(i, 4) * 0.5)) % span - 20;
        if (y < -w.len || y > H) continue;
        var near = hash(i, 6) > 0.6;
        px(near ? w.c[1] : w.c[0], x, y, w.w, w.len);
      }
    }
    if (kind === 'fog') {                          // low cloud, lying along the road
      ctx.save();
      for (var b2 = 0; b2 < 8; b2++) {
        var fh = 10 + (b2 % 3) * 4;
        var fy = GY - 138 + b2 * 19 + Math.round(Math.sin(t * 0.3 + b2) * 5);
        var fw = 130 + b2 * 26;
        var fx = ((t * (4 + b2 * 1.7) - cam * 0.22 + b2 * 173) % (W + fw * 2)) - fw;
        ctx.globalAlpha = 0.055 + (b2 % 3) * 0.022;
        for (var r2 = 0; r2 < fh; r2++) {           // tapered, so it is cloud not a slab
          var u2 = Math.abs(r2 / (fh - 1) - 0.5) * 2;
          var inset = Math.round(u2 * u2 * fw * 0.34);
          px('#c4cddf', fx + inset, fy + r2, fw - inset * 2, 1);
        }
      }
      ctx.restore();
    }
    if (kind === 'wind') {                         // leaves and grit going past
      for (var k = 0; k < 22; k++) {
        var lx = ((t * (86 + hash(k, 7) * 70) + hash(k, 8) * W * 3 - cam * 0.5) % (W + 60)) - 30;
        var ly = GY - 8 - hash(k, 9) * 96 + Math.sin(t * 4 + k) * 7;
        if (ly < 0) continue;
        px(hash(k, 10) > 0.5 ? '#6b4423' : '#4a3018', lx, ly, 2, 2);
      }
    }
  }

  // how far the flame leans, and how much of it you can see through
  function windLean(kind) { return kind === 'wind' ? Math.sin(t * 0.9) * 0.9 + 1.2 : 0; }

  // ── the five chores, each with its own bit of business ────────────────────
  // Every one is driven off p (0 at the start of the job, 1 at the end). The
  // sounds and the bursts fire on beats, from step(), so they land on the frame
  // the arm does.
  var KIB = ['#8a5a30', '#5b3a1e'], WCHIP = ['#a06f3d', '#654222'],
      SPARKC = ['#fff3c8', '#ef7a22'], WATER = ['#8fc6d6', '#3d6f80'];

  function choreBeat(id, i) {
    var K = SK(), x = S.x, y = S.y;
    if (id === 'wood') {
      burst(AT.chop, GY - 20, 14, 46, WCHIP, 20, 200);
      bell(120, 0.13, 0.06, 620); bell(300, 0.07, 0.035, 1500);
      S.shake = 0.12;
    } else if (id === 'kettle') {
      if (i === 0) { burst(AT.barrel, GY - 24, 10, 22, WATER, 14, 150); bell(340, 0.16, 0.04, 1200); }
      else { burst(AT.barrel + 10, GY - 20, 6, 8, WATER, 6, 240); bell(620, 0.1, 0.03, 2400); }
    } else if (id === 'brand') {
      burst(AT.stool + (i % 2 ? 8 : -8), GY - 20, 7, 34, SPARKC, 4, 120);
      bell(700 + i * 40, 0.1, 0.035, 3200);
    } else if (id === 'banked') {
      burst(AT.fire, GY - 12, 12, 52, null, 18);
      bell(190, 0.15, 0.04, 900);
    } else if (id === 'dog') {
      if (i === 0) { burst(AT.bowl, GY - 12, 12, 16, KIB, 8, 300); bell(420, 0.12, 0.035, 2200); }
      else if (i === 1) bell(300, 0.16, 0.04, 1500);
      else { bell(520, 0.11, 0.05, 2000); setTimeout(function () { bell(430, 0.16, 0.045, 1700); }, 110); }
    }
  }

  // a shaft with a head on the end of it, pointing wherever his arms point
  function tool(px, gx, gy, ang, len, kind) {
    var cx2 = Math.cos(ang), sy2 = Math.sin(ang);
    for (var i = -6; i < len; i++)
      px(i > len - 5 ? C.wood1 : C.wood0,
         Math.round(gx + cx2 * i), Math.round(gy + sy2 * i), 2, 2);
    var hx2 = Math.round(gx + cx2 * len), hy2 = Math.round(gy + sy2 * len);
    if (kind === 'axe') {
      px(C.metal0, hx2 - 4, hy2 - 4, 9, 8);
      px(C.metal2, hx2 - 3, hy2 - 3, 7, 4);
      px(C.metal3, hx2 + 2, hy2 - 4, 3, 8);
    } else if (kind === 'brand') {
      px(C.fire2, hx2 - 2, hy2 - 2, 5, 5);
      px(C.fire3, hx2 - 1, hy2 - 2, 3, 4);
      px(C.fire4, hx2 - 1, hy2 - 1, 2, 2);
    } else if (kind === 'kettle') {
      px(C.metal0, hx2 - 6, hy2 - 3, 13, 10);          // body, wider at the base
      px(C.metal1, hx2 - 5, hy2 - 2, 11, 8);
      px(C.metal2, hx2 - 4, hy2 - 1, 3, 5);            // a highlight down one side
      px(C.metal0, hx2 - 4, hy2 - 6, 9, 3);            // lid
      px(C.metal1, hx2 - 3, hy2 - 5, 7, 1);
      px(C.metal2, hx2 - 1, hy2 - 8, 3, 2);            // knob
      px(C.metal0, hx2 + 6, hy2 - 3, 5, 3);            // spout
      px(C.metal1, hx2 + 7, hy2 - 3, 3, 1);
      px(C.metal0, hx2 - 9, hy2 - 5, 3, 8);            // handle
      px(C.metal0, hx2 - 9, hy2 - 6, 6, 2);
    }
  }
  // Point his arms at a spot in the world and hand back everything needed to
  // draw the tool reaching it: the angle to pass to guy(), where his hands end
  // up, and how long the shaft has to be to touch.
  function reach(hx, hy, crouch, tx, ty) {
    var sx2 = hx, sy2 = hy - GUY_H + crouch + 19;
    var ang = Math.atan2(ty - sy2, tx - sx2);
    var d = Math.max(10, Math.sqrt((tx - sx2) * (tx - sx2) + (ty - sy2) * (ty - sy2)));
    return { a: ang, x: sx2 + Math.cos(ang) * 9, y: sy2 + Math.sin(ang) * 9, len: d - 9 };
  }
  function lerp(a, b, u) { return a + (b - a) * u; }

  // returns true when it has drawn him itself
  function choreArt(px, cam) {
    if (!S.chore) return false;
    var K2 = S.chore, id = K2.c.id, p = Math.max(0, Math.min(1, K2.p));
    var hx = Math.round(S.x) - cam, hy = Math.round(S.y), f = S.dir;

    if (id === 'wood') {
      // Two strokes. Over the shoulder, then down through the round on the block.
      var u = (p * 2) % 1;
      var stump = AT.chop - cam, top = GY - 26;
      var tgt, lean2;
      if (u < 0.44) {                                  // winding up and back
        var w1 = u / 0.44;
        tgt = { x: lerp(hx - f * 4, hx + f * 13, w1), y: lerp(GY - 34, GY - 62, w1) };
        lean2 = -2;
      } else if (u < 0.58) {                           // the stroke itself
        var w2 = (u - 0.44) / 0.14;
        tgt = { x: lerp(hx + f * 13, stump, w2), y: lerp(GY - 62, top, w2) };
        lean2 = 3;
      } else {                                         // straightening up again
        var w3 = (u - 0.58) / 0.42;
        tgt = { x: lerp(stump, hx - f * 4, w3), y: lerp(top, GY - 34, w3) };
        lean2 = 1;
      }
      if (u < 0.5) {                                   // the round waiting for it
        disc(px, C.wood0, stump, GY - 22, 7, 7); disc(px, C.wood2, stump, GY - 22, 6, 6);
        disc(px, C.wood3, stump, GY - 22, 3, 3);
      }
      var R = reach(hx + lean2, hy, 0, tgt.x, tgt.y);
      guy(px, hx + lean2, hy, t, f, 'work', 0, R.a);
      tool(px, R.x, R.y, R.a, Math.max(16, Math.min(24, R.len)), 'axe');
      return true;
    }

    if (id === 'kettle') {
      // Held out, dipped under, then lifted dripping.
      var bx2 = AT.barrel - cam;
      var dip = p < 0.3 ? p / 0.3 : p < 0.72 ? 1 : 1 - (p - 0.72) / 0.28;
      var ty2 = lerp(GY - 40, GY - 20, dip) + (p > 0.3 && p < 0.72 ? Math.sin(t * 9) * 1 : 0);
      var R2 = reach(hx, hy, 6, lerp(hx - f * 12, bx2, dip), ty2);
      guy(px, hx, hy, t, f, 'kneel', 0, R2.a);
      tool(px, R2.x, R2.y, R2.a, R2.len, 'kettle');
      if (p > 0.3 && p < 0.76) {                       // the water moving in the butt
        for (var w = -8; w <= 8; w += 2)
          px(w % 4 ? WATER[0] : WATER[1], bx2 + w,
             GY - 23 + Math.round(Math.sin(t * 9 + w * 0.7) * 1.4), 2, 1);
      }
      if (p > 0.76) for (var dr = 0; dr < 4; dr++) {   // and running off it
        var dy2 = ((t * 60 + dr * 9) % 18);
        px(WATER[0], R2.x + Math.cos(R2.a) * R2.len + dr * 3 - 4, R2.y + 6 + dy2, 1, 2);
      }
      return true;
    }

    if (id === 'brand') {
      // Long strokes across the whetstone, both ways, sparks off each end.
      var stx = AT.stool - cam, side = Math.sin(p * 4 * Math.PI);
      var R3 = reach(hx, hy, 6, stx + side * 7, GY - 21);
      guy(px, hx, hy, t, f, 'kneel', 0, R3.a);
      tool(px, R3.x, R3.y, R3.a, Math.max(14, R3.len), 'brand');
      px(C.stone3, stx - 5, GY - 20, 11, 1);           // the stone catching the light
      return true;
    }

    if (id === 'banked') {
      // Three long rakes right through the coals.
      var fx3 = AT.fire - cam, poke = (p * 3) % 1;
      var deep = poke < 0.45 ? poke / 0.45 : 1 - (poke - 0.45) / 0.55;
      var R4 = reach(hx, hy, 6, lerp(hx - f * 20, fx3, deep), lerp(GY - 34, GY - 7, deep));
      guy(px, hx, hy, t, f, 'kneel', 0, R4.a);
      tool(px, R4.x, R4.y, R4.a, 28, 'brand');
      return true;
    }

    if (id === 'dog') {
      // He tips the bag out, then the dog comes over and gets on with it.
      var bwx = AT.bowl - cam, pour = p < 0.34;
      var g5;
      if (pour) {
        var R5 = reach(hx, hy, 6, bwx, GY - 28);
        guy(px, hx, hy, t, f, 'kneel', 0, R5.a);
        g5 = { x: R5.x + Math.cos(R5.a) * Math.min(R5.len, 20),
               y: R5.y + Math.sin(R5.a) * Math.min(R5.len, 20) };
      } else {
        guy(px, hx, hy, t, f, 'kneel', 0, 0);
        g5 = { x: hx + f * 15, y: GY - 8 };            // set down beside him
      }
      px(C.cloth0, g5.x - 5, g5.y - 9, 11, 14);        // the sack
      px(C.cloth1, g5.x - 4, g5.y - 8, 9, 12);
      px(C.cloth2, g5.x - 4, g5.y - 8, 3, 12);
      px(C.cloth0, g5.x - 3, g5.y - 10, 7, 2);
      px(C.wood1, g5.x - 3, g5.y - 11, 7, 2);
      if (pour) for (var kb = 0; kb < 6; kb++) {
        var span = Math.max(6, GY - 8 - (g5.y + 5));
        var ky = ((t * 110 + kb * 9) % span);
        px(kb % 2 ? KIB[0] : KIB[1], g5.x + Math.round(Math.sin(kb * 2) * 2), g5.y + 5 + ky, 2, 2);
      }
      var dEnd = AT.bowl - 15;
      var ddx = p < 0.34 ? AT.dog
              : p < 0.62 ? AT.dog + (dEnd - AT.dog) * ((p - 0.34) / 0.28)
              : dEnd;
      var eating = p > 0.62;
      dogAt(px, Math.round(ddx) - cam, GY - 1, eating, 1, eating ? 0 : t);
      if (eating) for (var cr = 0; cr < 3; cr++)
        px(KIB[1], AT.bowl - cam - 4 + cr * 4, GY - 8 - (cr % 2), 2, 2);
      return true;
    }
    return false;
  }

  // the dog, upright and busy rather than curled up
  function dogAt(px, dx, dy, eating, face, walkT) {
    var g = face < 0 ? -1 : 1;
    var bob2 = eating ? Math.round(Math.abs(Math.sin(t * 9)) * 3) : 0;
    // ── body: deeper at the chest, tucked at the waist
    for (var by3 = 0; by3 < 12; by3++) {
      var uu = by3 / 11;
      var lft = dx - 13 + Math.round(uu * uu * 3), rgt = dx + 12 - Math.round(uu * 2);
      px(C.dog0, lft, dy - 16 + by3, rgt - lft + 1, 1);
      px(by3 < 3 ? C.dog3 : by3 < 8 ? C.dog2 : C.dog1, lft + 1, dy - 16 + by3, rgt - lft - 1, 1);
    }
    disc(px, C.dog0, dx + 9 * g, dy - 12, 6, 6);       // chest
    disc(px, C.dog2, dx + 9 * g, dy - 13, 5, 5);
    disc(px, C.dog0, dx - 10 * g, dy - 12, 6, 6);      // haunch
    disc(px, C.dog1, dx - 10 * g, dy - 13, 5, 5);
    for (var lg2 = 0; lg2 < 4; lg2++) {                // four legs, stepping if walking
      var lx2 = dx - 10 + (lg2 < 2 ? lg2 * 5 : 12 + (lg2 - 2) * 5);
      var st3 = walkT ? Math.round(Math.sin(walkT * 9 + lg2 * 2.2) * 2) : 0;
      px(C.dog0, lx2 + st3, dy - 7, 4, 7); px(C.dog1, lx2 + 1 + st3, dy - 7, 2, 6);
      px(C.hair0, lx2 + st3, dy - 2, 5, 2);
    }
    var hx3 = dx + g * 15, hy3 = dy - 21 + bob2;       // head
    px(C.dog0, dx + g * 9, dy - 20, 8, 8);             // neck
    px(C.dog2, dx + g * 9, dy - 19, 7, 6);
    disc(px, C.dog0, hx3, hy3, 7, 6); disc(px, C.dog2, hx3, hy3 - 1, 6, 5);
    px(C.dog0, hx3 + (g > 0 ? 2 : -8), hy3 + 1, 7, 5);
    px(C.dog1, hx3 + (g > 0 ? 3 : -7), hy3 + 1, 5, 4);
    px(C.hair0, hx3 + (g > 0 ? 7 : -8), hy3 + 2, 2, 2);              // nose
    px(C.dog1, hx3 - g * 4, hy3 - 8, 4, 7); px(C.dog0, hx3 - g * 4, hy3 - 8, 1, 7);  // ear
    px(C.hair0, hx3 + (g > 0 ? 2 : -3), hy3 - 2, 2, 2);
    px('#e9f0ff', hx3 + (g > 0 ? 2 : -3), hy3 - 2, 1, 1);
    if (eating) px(C.cloth2, hx3 + (g > 0 ? 6 : -7), hy3 + 5, 3, 1);  // tongue
    var wag2 = Math.sin(t * (eating ? 16 : 8)) * 5;                   // tail
    px(C.dog1, dx - g * 20, dy - 19 - Math.round(wag2), 8, 3);
    px(C.dog2, dx - g * 20 + (g > 0 ? 0 : 2), dy - 19 - Math.round(wag2), 6, 2);
  }

  // ── the camp by daylight ──────────────────────────────────────────────────
  function drawDay(cam, lvl) {
    var du = S.dusk || 0;
    for (var b = 0; b < 5; b++)
      px(du ? mix(DAYSKY[b], ['#2a1c30', '#3c2740', '#5c3a48', '#8a5a52', '#c08a68'][b], du)
            : DAYSKY[b], 0, BAND[b], W, (b < 4 ? BAND[b + 1] : GY) - BAND[b]);
    var sunX = Math.round(W * 0.78) - Math.round(cam * 0.04);
    disc(px, '#ffe9ad', sunX, Math.round(GY * 0.16), 17, 17);
    disc(px, '#fffbe4', sunX, Math.round(GY * 0.16), 13, 13);
    for (var cl = 0; cl < 5; cl++) {              // proper daylight cloud
      var cy = Math.round(GY * (0.12 + cl * 0.1));
      var cw = 54 + cl * 22;
      var cx = ((t * (3 + cl * 1.4) + cl * 149 - cam * 0.08) % (W + cw * 2)) - cw;
      px('#e9f2f7', cx + 10, cy, cw - 20, 5);
      px('#ffffff', cx + 14, cy, cw - 34, 3);
      px('#e9f2f7', cx, cy + 5, cw, 5);
      px('#cfdde8', cx + 4, cy + 9, cw - 12, 2);
    }
    var far = Math.round(cam * 0.22), mid = Math.round(cam * 0.48);
    for (var hx = 0; hx < W; hx++) {
      var wx = hx + far;
      var h1 = RIDGE - Math.round(11 * Math.sin(wx * 0.019) + 6 * Math.sin(wx * 0.043 + 1));
      px(du ? mix('#9fb0d0', '#5e4f6e', du) : '#9fb0d0', hx, h1, 1, 2);
      px(du ? mix('#8496bc', '#4b3f5c', du) : '#8496bc', hx, h1 + 2, 1, GY - h1 - 2);
    }
    for (var tx = 0; tx < W; tx++) {
      var wx2 = tx + mid;
      var tb = TLINE - Math.round(7 * Math.abs(Math.sin(wx2 * 0.08)) + 4 * Math.sin(wx2 * 0.028));
      px(du ? mix('#3f6247', '#22331f', du) : '#3f6247', tx, tb, 1, 2);
      px(du ? mix('#2f4a36', '#1a281a', du) : '#2f4a36', tx, tb + 2, 1, GY - tb - 2);
      if (hash(wx2, 3) > 0.86) px('#25392a', tx, tb - 2, 1, 3);
    }
    ctx.drawImage(terrain, cam, 0, W, H, 0, 0, W, H);
    signpost(px, SIGN - cam, groundY(SIGN), S.n);
    woodpile(px, AT.pile - cam, PREP ? PREP.wood : 0);
    if (!(S.chore && S.chore.c.id === 'wood')) axeInBlock(px, AT.chop - cam);
    lights(cam, 0.35);
    var job = S.chore ? S.chore.c : choreAt(S.x);
    if (job && PREP[job.id] < job.max) {                                     // an arrow bobbing over the job
      var jx = job.x - cam, jb = Math.round(Math.sin(t * 4) * 2);
      var jy = GY - 62 + jb;
      px(C.core || '#ffeeb8', jx - 3, jy, 7, 2);
      px('#ffeeb8', jx - 2, jy + 2, 5, 2); px('#ffeeb8', jx - 1, jy + 4, 3, 2);
      px('#ffeeb8', jx, jy + 6, 1, 2);
    }
    if (!(S.chore && S.chore.c.id === 'dog')) dog(px, AT.dog - cam, GY - 1, t, 0);
    campfire(px, FIREX - cam, t, Math.max(0.2, lvl), GY, 1);
    birds(cam);
    if (!choreArt(px, cam)) {
      var hx3 = Math.round(S.x) - cam, hy3 = Math.round(S.y);
      var A3 = S.auto;
      if (S.pose) {
        if (S.pose === 'feed') {
          var Rf = reach(hx3, hy3, 6, AT.fire - cam, GY - 12);
          guy(px, hx3, hy3, t, S.dir, 'kneel', 0, Rf.a);
          var fx4 = Rf.x + Math.cos(Rf.a) * 14, fy4 = Rf.y + Math.sin(Rf.a) * 14;
          px(C.wood0, fx4 - 8, fy4 - 3, 17, 6); px(C.wood2, fx4 - 8, fy4 - 2, 17, 4);
        } else {
          guy(px, hx3, hy3 - (S.pose === 'sit' ? 8 : 0), t, S.dir, S.pose, S.step);
        }
      } else if (A3 && A3.phase === 'do') {
        if (A3.act === 'sit') {
          guy(px, hx3, hy3 - 8, t, S.dir, 'sit', 0);
        } else if (A3.act === 'poke' || A3.act === 'pet' || A3.act === 'stir') {
          var tgt2 = A3.act === 'poke' ? { x: AT.fire - cam, y: GY - 8 }
                   : A3.act === 'pet'  ? { x: AT.bowl - cam, y: GY - 14 }
                   : { x: (A3.x < AT.pot ? AT.pot : AT.barrel) - cam, y: GY - 26 };
          var reach2 = 0.4 + 0.6 * Math.abs(Math.sin(t * 2.2));
          var R6 = reach(hx3, hy3, 6, lerp(hx3 - S.dir * 16, tgt2.x, reach2),
                         lerp(GY - 32, tgt2.y, reach2));
          guy(px, hx3, hy3, t, S.dir, 'kneel', 0, R6.a);
          if (A3.act === 'poke') tool(px, R6.x, R6.y, R6.a, 22, 'brand');
        } else if (A3.act === 'stack') {
          var lift = Math.abs(Math.sin(t * 1.8));
          var R7 = reach(hx3, hy3, 0, hx3 + S.dir * 16, GY - 12 - lift * 20);
          guy(px, hx3, hy3, t, S.dir, 'work', 0, R7.a);
          var lx3 = R7.x + Math.cos(R7.a) * 12, ly3 = R7.y + Math.sin(R7.a) * 12;
          disc(px, C.wood0, lx3, ly3, 5, 5); disc(px, C.wood2, lx3, ly3, 4, 4);
        } else {
          guy(px, hx3, hy3, t, S.dir, 'idle', 0);
        }
      } else {
        guy(px, hx3, hy3, t, S.dir, !S.onGround ? 'jump' : S.moving ? 'walk' : 'idle', S.step);
      }
    }
    ctx.save();                                   // a wash of warm morning over it all
    ctx.globalCompositeOperation = 'multiply';
    var wm = ctx.createLinearGradient(0, 0, 0, H);
    wm.addColorStop(0, du ? mix('#e8ecf6', '#4a4260', du) : '#e8ecf6');
    wm.addColorStop(0.6, du ? mix('#fff3e2', '#7b5f5c', du) : '#fff3e2');
    wm.addColorStop(1, du ? mix('#f6dfc6', '#6d5450', du) : '#f6dfc6');
    ctx.fillStyle = wm; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    var gl = ctx.createRadialGradient(FIREX - cam, GY - 14, 2, FIREX - cam, GY - 14, 70);
    gl.addColorStop(0, 'rgba(255,150,60,0.2)'); gl.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function birds(cam) {
    for (var i = 0; i < 5; i++) {
      var sp = 16 + i * 3;
      var bx = ((t * sp + i * 220 - cam * 0.3) % (W + 90)) - 45;
      var by = Math.round(GY * (0.2 + i * 0.045)) + Math.round(Math.sin(t * 0.7 + i) * 5);
      var f = Math.sin(t * 7 + i * 2) > 0 ? 0 : 1;
      px('#3d4a5c', bx - 3, by + f, 3, 1); px('#3d4a5c', bx + 1, by + f, 3, 1);
      px('#3d4a5c', bx, by + 1, 1, 1);
    }
  }

  // the post at the edge of camp, with the night ahead burned into it
  function signpost(px, x, baseY, n) {
    if (x < -30 || x > W + 30) return;
    px(C.wood0, x - 3, baseY - 46, 6, 46);
    px(C.wood1, x - 2, baseY - 45, 3, 44);
    box(px, C.wood2, C.wood0, x - 20, baseY - 62, 41, 19);
    px(C.wood3, x - 19, baseY - 61, 39, 6);
    for (var i = 0; i < Math.min(n, 10); i++)
      px(C.wood0, x - 16 + i * 4, baseY - 54, 2, 7);
    if (n > 10) px(C.fire2, x + 12, baseY - 54, 6, 7);
    px(C.stone1, x - 7, baseY - 3, 15, 4);
    px(C.stone2, x - 6, baseY - 4, 12, 2);
  }

  function lights(cam, dim) {
    for (var L = 1; L < 13; L++) {
      var u6 = L / 13, blx = Math.round(LPL + u6 * (LPR - LPL)) - cam;
      if (blx < -6 || blx > W + 6) continue;
      var bly = LTOP + Math.round(Math.sin(u6 * Math.PI) * LSAG);
      px(C.wood0, blx, bly + 1, 1, 2);
      var on = Math.sin(t * 1.5 + L * 1.7) > -0.55;
      if (dim) { disc(px, on ? C.fire3 : C.fire1, blx, bly + 5, 2, 3); continue; }
      disc(px, on ? C.fire4 : C.fire3, blx, bly + 5, 2, 3);
      px(on ? '#fffbe6' : C.fire4, blx - 1, bly + 4, 1, 1);
    }
  }

  function mix(a, b, u) {
    function n(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
    var A = n(a), B = n(b), o = '#';
    for (var i = 0; i < 3; i++) {
      var v = Math.round(A[i] + (B[i] - A[i]) * u).toString(16);
      o += v.length < 2 ? '0' + v : v;
    }
    return o;
  }

  // ── the readout ───────────────────────────────────────────────────────────
  var elFireNum = document.getElementById('fireNum'),
      elFireBar = document.getElementById('fireBar'),
      elFireFill = elFireBar.querySelector('i'),
      elDawn = document.getElementById('dawnbar').querySelector('i'),
      elNight = document.getElementById('nightNum'),
      elCarry = document.getElementById('carryLbl'),
      elTill = document.getElementById('tillDawn');

  var elRoad = document.getElementById('road');
  (function () {
    var h = '';
    for (var i = 0; i < NIGHTS.length; i++) h += '<i></i>';
    elRoad.innerHTML = h;
  })();
  function markRoad(n) {
    var d = elRoad.children;
    for (var i = 0; i < d.length; i++)
      d[i].className = n > d.length ? 'done' : i + 1 < n ? 'done' : i + 1 === n ? 'now' : '';
  }

  var elFireLbl = document.getElementById('fireLbl');
  var SKYWORD = { clear: 'clear sky', wind: 'wind', frost: 'frost', fog: 'low cloud',
                  snow: 'snow', sleet: 'sleet', dark: 'no moon' };
  function hud() {
    var pctF = Math.round(S.fuel / FUEL_MAX * 100);
    elFireNum.textContent = pctF;
    elFireFill.style.width = pctF + '%';
    if (S.mode === 'day') {
      elFireLbl.textContent = 'Camp';
      elPause.hidden = true;
      elFireBar.classList.remove('low');
      elDawn.style.width = '0%';
      elNight.textContent = S.n;
      elCarry.textContent = SKYWORD[S.cfg.wx] || 'clear sky';
      var r = PREP ? prepDone() : 0;
      elTill.textContent = r ? r + ' ready' : 'ahead';
      return;
    }
    elFireLbl.textContent = 'Fire';
    elPause.hidden = false;
    elFireBar.classList.toggle('low', pctF < 25);
    elDawn.style.width = Math.round((1 - S.left / S.cfg.len) * 100) + '%';
    elNight.textContent = S.n;
    elCarry.textContent = 'Carrying ' + S.carry + '/' + MAXCARRY;
    elTill.textContent = Math.ceil(S.left) + 's';
  }

  // ── cards ─────────────────────────────────────────────────────────────────
  var veil = document.getElementById('veil'), card = document.getElementById('card');
  function show(html) {
    card.innerHTML = html;
    veil.classList.remove('hide'); veil.classList.remove('chat');
    running = false;
    if (elBan) { elBan.classList.remove('on'); clearTimeout(banT); }
  }
  function hide() { veil.classList.add('hide'); running = true; }

  function strip(upto) {
    var s = '<div class="nights">';
    for (var i = 1; i <= NIGHTS.length; i++)
      s += '<i class="' + (i < upto ? 'done' : i === upto ? 'now' : '') + '"></i>';
    return s + '</div>';
  }
  function bindGo(fn, id) {
    var b = document.getElementById(id || 'go');
    if (b) b.addEventListener('click', function () { ac(); fn(); });
  }

  var elBan = document.getElementById('banner'), banT = null;
  // Nothing he says goes by in under five seconds, and the longer the line the
  // longer it sits there \u2014 roughly the time it takes to read it, with a
  // ceiling so a long one does not camp on the screen.
  var READ_MIN = 5000, READ_FREE = 60, READ_PER = 58, READ_MAX = 14000;
  function readTime(txt) {
    var over = Math.max(0, String(txt || '').length - READ_FREE);
    return Math.min(READ_MAX, READ_MIN + over * READ_PER);
  }
  function banner(head, sub, hold) {
    elBan.innerHTML = '<b>' + head + '</b><span>' + sub + '</span>';
    elBan.classList.add('on');
    clearTimeout(banT);
    var want = Math.max(hold || 0, readTime(String(head || '') + ' ' + String(sub || '')));
    banT = setTimeout(function () { elBan.classList.remove('on'); }, want);
  }

  var elA = document.getElementById('kA'), elJ = document.getElementById('kJ');
  var elSnd = document.getElementById('kSnd'), elPause = document.getElementById('kPause');
  elSnd.addEventListener('click', function () { ac(); settings(); });
  function soundSwitch() { elSnd.classList.toggle('off', muted && save.music === false); }

  // ── the player ────────────────────────────────────────────────────────────
  function playing() { return !!(MUS.on && MUS.timer); }
  function deckHTML(withShelf) {
    var T = TUNES[MUS.tune];
    var h = '<div class="deck"><div class="nowLbl">Now playing</div>' +
            '<div class="nowTitle" id="nowT">' + T.name + '</div>' +
            '<div class="nowGenre" id="nowG">' + T.genre + ' · ' + T.bpm + ' bpm</div>' +
            '<div class="bars' + (playing() ? '' : ' off') + '" id="nowB">';
    for (var i = 0; i < 7; i++)
      h += '<i style="animation-delay:' + (i * 0.11).toFixed(2) + 's;height:' +
           (5 + (i % 3) * 4) + 'px"></i>';
    h += '</div><div class="tr">' +
      '<button class="tb" id="mPrev" aria-label="Previous">&#9664;&#9664;</button>' +
      '<button class="tb big" id="mPlay" aria-label="Play or pause">' + playGlyph() + '</button>' +
      '<button class="tb" id="mNext" aria-label="Next">&#9654;&#9654;</button>' +
      '<button class="tb' + (MUS.loop ? ' on' : '') + '" id="mLoop" aria-label="Repeat">&#8635;</button>' +
      (withShelf ? '<button class="tb" id="mList" aria-label="All tunes">&#9776;</button>' : '') +
      '</div></div>';
    return h;
  }
  function playGlyph() { return playing() ? '&#10073;&#10073;' : '&#9654;'; }
  function refreshTransport() {
    var T = TUNES[MUS.tune];
    var a = document.getElementById('nowT'); if (a) a.textContent = T.name;
    var g = document.getElementById('nowG'); if (g) g.textContent = T.genre + ' · ' + T.bpm + ' bpm';
    var p = document.getElementById('mPlay'); if (p) p.innerHTML = playGlyph();
    var bars = document.getElementById('nowB');
    if (bars) bars.classList.toggle('off', !playing());
    var lp = document.getElementById('mLoop'); if (lp) lp.classList.toggle('on', !!MUS.loop);
    var rows = document.querySelectorAll('.trk');

  // walk him somewhere over a second or so, then hold a pose
  function meetMove(toX, pose, then) {
    S.walkTo = { x: toX, pose: pose, then: then };
  }
  function meetTick(dt) {
    if (!S.walkTo) return;
    var d = S.walkTo.x - S.x;
    if (Math.abs(d) < 3) {
      S.pose = S.walkTo.pose; S.moving = 0;
      var fn = S.walkTo.then; S.walkTo = null; if (fn) fn();
      return;
    }
    S.pose = null;
    S.dir = Math.sign(d);
    S.x += Math.sign(d) * SPEED * 0.6 * dt;
    S.y = groundY(S.x);
    S.step += dt * 4.6; S.moving = 1;
    S.cam += (Math.max(0, Math.min(WORLD - W, S.x - W / 2)) - S.cam) * Math.min(1, dt * 5);
  }

  var MEET = [
      { l: ['\u2026'] },
      { l: ["You're the first thing up this road in nine days that wasn't weather.",
            "Sun's nearly off the ridge. You won't make the next ring before dark."] },
      { l: ["So don't stand out there. Come inside the stones.", 'Such as it is.'],

      { ask: [
          { t: 'Inside the stones?', k: 'asked_ring',

                "It's about six feet at the minute, which is my fault."] },
          { t: 'What happened to your fire?', k: 'asked_fire',
            r: ["I let it get away from me. That's the honest answer.",

          { t: '(say nothing, and come in)', k: 'quiet',

      { l: ['Here. Watch what it does.'],

      { l: ['There. See how far it goes now?'], act: function () {
          S.fuel = 62; S.dusk = 0.5; burst(AT.fire, GY - 12, 16, 40); bell(300, 0.3, 0.06, 2000);
        } },
      { l: ["The dark out here isn't the absence of anything. It's a thing, and it comes up at sundown.",
            "It doesn't cross light. That's all. That is the entire trick.",

      { l: ["Things live out in it. They spend all night leaning on the edge looking for a thin place.",

      { l: ["I'm walking to a place called Harrow Point. Twenty rings of stone between here and it.",

      { l: ['So I am going to put them back. All five, and the mole light last.',

          { t: "Then I'll keep the fire.", k: 'stay',

          { t: 'Twenty nights is a long time.', k: 'curious',

    ];
  function meetCard() {
    newMeet();
    veil.classList.add('lit');
    var beats = MEET;
    var bi = 0, li = 0, log = null, logIn = null, act = null, armed = 0;
    function ready(ms) { return !GUARD || Date.now() - armed >= ms; }

    // the same fixed screen the fireside talks use: he speaks into a log that
    // scrolls itself, and the button underneath stays exactly where it is
    function build() {
      card.innerHTML =
        '<div class="eyebrow">The road to Harrow Point</div>' +
        '<div class="who">' + HIM.name + '</div>' +
        '<div class="log" id="log"><div class="logIn" id="logIn"></div></div>' +
        '<div class="act" id="act"></div>';
      veil.classList.remove('hide');
      veil.classList.add('chat');
      running = false;
      if (elBan) { elBan.classList.remove('on'); clearTimeout(banT); }
      log = document.getElementById('log');
      logIn = document.getElementById('logIn');
      act = document.getElementById('act');
      log.addEventListener('click', function () {
        var B = beats[bi];
        if (B && B.l && li < B.l.length) { ac(); onward(); }
      });
    }
    function put(text, mine) {
      var was = logIn.querySelector('.fresh');
      if (was) was.classList.remove('fresh');
      var el = document.createElement('p');
      el.className = 'said fresh' + (mine ? ' me' : '');
      el.textContent = fill(text);
      logIn.appendChild(el);
      log.scrollTop = log.scrollHeight;
      requestAnimationFrame(function () { log.scrollTop = log.scrollHeight; });
    }
    function onward() {
      var B = beats[bi];
      if (B && B.l && li < B.l.length) {
        put(B.l[li++]);
        if (li === 1 && B.act) B.act();
        return controls();
      }
      bi++; li = 0;
      if (bi >= beats.length) {
        save.metHim = 1; MEM.bond += 2; store();
        veil.classList.remove('lit'); veil.classList.remove('chat');
        camp();
        return;
      }
      if (beats[bi].ask) return controls();     // he has asked you something
      onward();
    }
    function controls() {
      armed = Date.now();
      var B = beats[bi];
      if (B && B.ask) {
        var h = '';
        for (var q = 0; q < B.ask.length; q++)
          h += '<button class="pick" data-q="' + q + '">' + B.ask[q].t + '</button>';
        act.innerHTML = h;
        var ps = act.querySelectorAll('.pick');
        for (var j = 0; j < ps.length; j++) ps[j].addEventListener('click', function () {
          if (!ready(280)) return;
          ac();
          var A4 = B.ask[+this.getAttribute('data-q')];
          MEM.tags[A4.k] = 1; MEM.bond += 2; store();
          put(A4.t, 1);
          for (var r = 0; r < A4.r.length; r++) put(A4.r[r]);
          bell(430, 0.12, 0.04, 1900);
          bi++; li = 0; onward();
        });
        return;
      }
      var last = bi >= beats.length - 1 && li >= (B ? B.l.length : 0);
      act.innerHTML = '<button class="go" id="go">' + (last ? 'Have a look round' : 'Go on') + '</button>' +
                      (last ? '' : '<div class="tip">tap anywhere to carry on</div>');
      var g = document.getElementById('go');
      if (g) g.addEventListener('click', function () { ac(); onward(); });
    }

    build();
    put(beats[0].l[0]);
    bi = 0; li = 1;
    controls();
  }

  // ── sitting with him ──────────────────────────────────────────────────────
  function knownLine() {
    var b = MEM ? MEM.bond : 0;
    return b < 4 ? 'You have only just met.'
         : b < 9 ? 'He is getting used to you being there.'
         : b < 15 ? 'He talks more than he did.'

  function bondPips() {
    var lvl = Math.min(6, Math.floor((MEM ? MEM.bond : 0) / 3));
    var h = '<div class="bond">';
    for (var i = 0; i < 6; i++) h += '<i class="' + (i < lvl ? 'on' : '') + '"></i>';
    return h + '</div>';
  }
  // a line that leans on something you already told him
  var CALLBACKS = [
    { need: 'namedog',  at: 6,  say: 'The dog answers to whatever I call him now. Your fault, that.' },
    { need: 'learn',    at: 8,  say: 'You split a couple last night without being asked. I noticed.' },
    { need: 'gotit',    at: 7,  say: "You worked out what the fire is for quicker than I did." },
    { need: 'adrift',   at: 9,  say: "You said there wasn't much on. I've thought about that a fair bit." },
    { need: 'tired',    at: 9,  say: 'Still too much on, at yours?' },
    { need: 'restless', at: 11, say: "You said you weren't sleeping. Any better?" },
    { need: 'here',     at: 12, say: "You said you'd rather be here. I kept hold of that one." },
    { need: 'sister',   at: 12, say: "You asked what she's like. I've thought of six more things since." },
    { need: 'gentle',   at: 13, say: "You told me I didn't have to talk about her. That's why I can." },
    { need: 'hope',     at: 16, say: "You said she might still be there. I've been leaning on that." },
    { need: 'honest',   at: 16, say: "You asked what if she isn't. Glad one of us said it." },
    { need: 'itslit',   at: 19, say: 'You said it was the light. It was still there tonight.' },
    { need: 'forhim',   at: 19, say: "You said you wanted me to get mine. I haven't forgotten." }
  ];
  function callback() {
    if (!MEM) return [];
    for (var i = 0; i < CALLBACKS.length; i++) {
      var C2 = CALLBACKS[i];
      if (S.n < C2.at || tag('cb' + i)) continue;
      if (!tag(C2.need)) continue;
      MEM.tags['cb' + i] = 1; store();
      return [C2.say];
    }
    return [];
  }

  function talkCard() {
    var T = talkFor(S.n);
    var queue = [], log = null, logIn = null, act = null, armed = 0;
    // A tap that was meant for Go on must not go on to press whatever takes
    // its place. Carrying on is never guarded — mash that all you like — but
    // a choice, and above all leaving, wants a beat of deliberation first.
    function ready(ms) { return !GUARD || Date.now() - armed >= ms; }

    // The screen is built once. Lines are appended to the log, which scrolls
    // on its own; the button underneath never moves, so one tap is one line
    // and your finger is always in the right place.
    function build() {
      card.innerHTML =
        '<div class="eyebrow">Night ' + S.n + ' \u00b7 by the fire</div>' +
        '<div class="who">' + HIM.name + '</div>' +
        '<div class="log" id="log"><div class="logIn" id="logIn"></div></div>' +
        '<div class="act" id="act"></div>';
      veil.classList.remove('hide');
      veil.classList.add('chat');
      running = false;
      if (elBan) { elBan.classList.remove('on'); clearTimeout(banT); }
      log = document.getElementById('log');
      logIn = document.getElementById('logIn');
      act = document.getElementById('act');
      // the whole transcript is a Go on button too, so nothing needs aiming
      log.addEventListener('click', function () { if (queue.length) { ac(); next(); } });
    }
    function put(text, mine) {
      var was = logIn.querySelector('.fresh');
      if (was) was.classList.remove('fresh');
      var el = document.createElement('p');
      el.className = 'said fresh' + (mine ? ' me' : '');
      el.textContent = fill(text);
      logIn.appendChild(el);
      log.scrollTop = log.scrollHeight;                 // stay with the newest
      requestAnimationFrame(function () { log.scrollTop = log.scrollHeight; });
    }
    function feed(arr) {                                // a run of his lines
      queue = (arr && arr.length ? arr : ['Right.']).slice();
      next();
    }
    function next() { put(queue.shift()); controls(); }

    function openAsks() {                               // nearest topic first
      var here = [], rest = [];
      for (var a = 0; a < ASKS.length; a++) {
        var K = ASKS[a];
        if (S.n < (K.from || 1)) continue;
        if (K.until && S.n > K.until) continue;    // learning the rules is early-game
        if (K.need && !tag(K.need)) continue;
        if (MEM.asked.indexOf(K.id) >= 0) continue;
        (K.topic && K.topic === T.topic ? here : rest).push(K);
      }
      rest.sort(function (x, y) { return (y.from || 1) - (x.from || 1); });
      return here.concat(rest).slice(0, 3);
    }
    function on(el, fn) { if (el) el.addEventListener('click', function () { ac(); fn(); }); }

    // whatever you can do right now, in the one place at the bottom
    function controls() {
      armed = Date.now();
      if (queue.length) {
        act.innerHTML = '<button class="go" id="go">Go on</button>' +
                        '<div class="tip">tap anywhere to carry on</div>';
        on(document.getElementById('go'), next);
        return;
      }
      if (T.name && !MEM.you) {                         // he asks what to call you
        act.innerHTML = '<input class="nameIn" id="nm" maxlength="14" placeholder="your name" />' +
                        '<button class="go" id="go">Tell him</button>';
        var inp = document.getElementById('nm');
        setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60);
        on(document.getElementById('go'), function () {
          var v = (inp.value || '').replace(/[<>&]/g, '').trim().slice(0, 14);
          MEM.you = v || 'friend';
          MEM.bond += 2; store();
          put(MEM.you, 1);
          feed((T.after && T.after.any) || ['Right.']);
        });
        return;
      }
      if (T.ask && !tag('ask' + S.n)) {                 // answering what he asked
        var h = '';
        for (var q = 0; q < T.ask.length; q++)
          h += '<button class="pick" data-q="' + q + '">' + fill(T.ask[q].t) + '</button>';
        act.innerHTML = h;
        var ps = act.querySelectorAll('.pick');
        for (var j = 0; j < ps.length; j++) ps[j].addEventListener('click', function () {
          if (!ready(280)) return;
          ac();
          var A = T.ask[+this.getAttribute('data-q')];
          MEM.tags[A.k] = 1; MEM.tags['ask' + S.n] = 1; MEM.bond += 2; store();
          put(A.t, 1);
          bell(430, 0.12, 0.04, 1900);
          feed(A.r);
        });
        return;
      }
      var open2 = openAsks(), h2 = '';                  // and then your turn
      if (open2.length) {
        h2 += '<div class="who">Ask him</div>';
        for (var o = 0; o < open2.length; o++)
          h2 += '<button class="pick" data-a="' + open2[o].id + '">' + fill(open2[o].q) + '</button>';
      }
      h2 += '<button class="ghost" id="stop">Leave him to it</button>' + bondPips();
      act.innerHTML = h2;
      var qs = act.querySelectorAll('[data-a]');
      for (var m = 0; m < qs.length; m++) qs[m].addEventListener('click', function () {
        if (!ready(280)) return;
        ac();
        var id = this.getAttribute('data-a'), K2 = null;
        for (var z = 0; z < ASKS.length; z++) if (ASKS[z].id === id) K2 = ASKS[z];
        MEM.asked.push(id); MEM.bond += 1; store();
        put(K2.q, 1);
        bell(380, 0.12, 0.04, 1800);
        feed(K2.a);
      });
      on(document.getElementById('stop'), function () {
        if (!ready(650)) return;                 // not on a stray tap, it isn't
        PREP.talk = 1;
        if (MEM.seen.indexOf(S.n) < 0) MEM.seen.push(S.n);
        MEM.night = S.n; store();
        veil.classList.add('hide'); veil.classList.remove('chat');
        running = true; last = performance.now();
      });
    }

    build();
    feed(callback().concat(T.him));
  }

  // ── the chest ─────────────────────────────────────────────────────────────
  // Embers come off the things you drive away and out of the lamps you light.
  // Everything in here is paid for in them, and then worked on three times.
  function armsCard(back) {
    function row(Wp) {
      var have = owned(Wp.id), L = armLvl(Wp.id), n = save.night;
      var can = n >= Wp.at;
      var next = have ? (L < ARM_MAX ? UPG_COST[L + 1] : null) : Wp.cost;
      var carrying = save.wep === Wp.id;
      var h2 = '<div class="arm' + (have ? ' has' : '') + (carrying ? ' on' : '') + '">' +
        '<div class="armTop"><b>' + Wp.name + '</b>' +
        (have ? '<i class="pips">' + ('\u25cf'.repeat(L) + '\u25cb'.repeat(ARM_MAX - L)) + '</i>' : '') +
        '</div><p>' + Wp.note + '</p>';
      if (!can) h2 += '<span class="armWhen">Not found until night ' + Wp.at + '</span>';
      else if (!have)
        h2 += '<button class="armBuy" data-buy="' + Wp.id + '"' +
              (save.emb < Wp.cost ? ' disabled' : '') + '>Take it \u00b7 ' + Wp.cost + ' embers</button>';
      else {
        if (next != null)
          h2 += '<button class="armBuy" data-up="' + Wp.id + '"' +
                (save.emb < next ? ' disabled' : '') + '>Work on it \u00b7 ' + next + ' embers</button>';
        else h2 += '<span class="armWhen">As good as it gets</span>';
        h2 += carrying ? '<span class="armWhen on">Carrying this one</span>'
                       : '<button class="armBuy pick" data-use="' + Wp.id + '">Carry this one</button>';
      }
      return h2 + '</div>';
    }
    function draw3() {
      var h = '<div class="eyebrow">The chest</div><h1>What he<em>carries</em></h1>' +
        '<p class="lede">You have <b style="color:var(--ember)">' + save.emb + '</b> embers. ' +
        'They come off whatever you drive off the stones, and there are forty in every lamp you light.</p>';
      for (var i = 0; i < WEAPONS.length; i++) h += row(WEAPONS[i]);
      h += '<button class="go" id="go">Back to it</button>';
      show(h);
      var bs = card.querySelectorAll('[data-buy],[data-up],[data-use]');
      for (var j = 0; j < bs.length; j++) bs[j].addEventListener('click', function () {
        ac();
        var buy = this.getAttribute('data-buy'), up = this.getAttribute('data-up'),
            use = this.getAttribute('data-use');
        if (buy) {
          var Wp = wepById(buy);
          if (save.emb < Wp.cost) return;
          save.emb -= Wp.cost; save.arms[buy] = 0; save.wep = buy;
          bell(520, 0.3, 0.06, 2400);
          banner(Wp.name, fill(Wp.say), 5200);
        } else if (up) {
          var L2 = armLvl(up);
          if (L2 >= ARM_MAX || save.emb < UPG_COST[L2 + 1]) return;
          save.emb -= UPG_COST[L2 + 1]; save.arms[up] = L2 + 1;
          bell(660, 0.26, 0.06, 2800);
          banner(wepById(up).name + ' \u00b7 worked on',
                 'Longer in the reach, quicker back, and it hurts more.', 3600);
        } else if (use) { save.wep = use; bell(430, 0.14, 0.05, 2000); }
        store();
        if (S) S.wep = wepFor(save.night);
        draw3();
      });
      bindGo(function () {
        if (back) back();
        else { veil.classList.add('hide'); running = true; last = performance.now(); }
      });
    }
    draw3();
  }

  // ── dressing him ──────────────────────────────────────────────────────────
  var peek = null, peekCtx = null, peekPx = null;
  function looksCard(back) {
    function chips(key, list, kind) {
      var h2 = '<div class="pickRow"><span>' + kind + '</span><div class="chips">';
      for (var i = 0; i < list.length; i++) {
        var r = list[i].r;

    // whatever held things up; between the two the queue never runs dry.

      acc += dt;

    tunes: TUNES, genres: GENRE, music: function () { return MUS; },
    beatsAt: function (n, from) {                  // schedule n beats from a fixed point
      var a2 = ac(); if (!a2) return 0;
      var T = TUNES[MUS.tune], spb = 60 / T.bpm, meter = T.meter || 4;
      var at = (from || 0) + 0.05, t0 = at;
      applyTone(T);
      if (A.music) A.music.gain.setValueAtTime(MUSIC_LEVEL, a2.currentTime);
      for (var i = 0; i < n; i++) {
        playBeat(at, spb); at += spb;
        if (++MUS.beat >= meter) { MUS.beat = 0; MUS.bar++; }
      }
      return at - t0 + 0.6;
    },
    pick: function (i) { switchTo(i, 0); },
    setVox: function (v) { save.vox = v; },
    sung: function () { return SUNG; },
    singOne: function (f, d, vow) {
      var a2 = ac(); if (!a2) return;
      if (A.music) A.music.gain.setValueAtTime(MUSIC_LEVEL, a2.currentTime);
      sing(a2.currentTime + 0.05, f, d, 0.28, vow);
    },
    setNight: function (n) { save.night = n; store(); },
    landmarks: function () { return LANDMARKS; }, animals: function () { return ANIMALS; },
    folk: function () { return FOLK; }, arms: function () { return WEAPONS; },
    upgCost: function () { return UPG_COST; },
    talks: function () { return TALKS; }, asks: function () { return ASKS; },
    meet: function () { return MEET; }, barks: function () { return BARKS; },
    chores: function () { return CHORES; },
    callbacks: function () { return CALLBACKS; }, musings: function () { return MUSINGS; },
    talk: function () { talkCard(); }, banner: banner, readTime: readTime,
    noGuard: function (v) { GUARD = v ? 0 : 1; },
    audio: function () {
      var a2 = A.ctx;
      return { now: a2 ? a2.currentTime : 0, next: MUS.next, head: MUS.head,
               worst: MUS.worst, late: MUS.late || 0, ticks: MUS.ticks || 0,
               dropped: MUS.dropped || 0, bar: MUS.bar, beat: MUS.beat,
               on: !!MUS.timer, state: a2 ? a2.state : 'none' };
    },
    resetAudioStats: function () { MUS.worst = null; MUS.late = 0; MUS.ticks = 0; MUS.dropped = 0; },
    tick: function (dt) { if (S && running) step(dt); },
    begin: function (n) { startNight(n); running = true; veil.classList.add('hide'); },
    camp: function () { camp(); },
    mus: function () { return { on: MUS.on, bar: MUS.bar, next: MUS.next }; },
    musBars: function (n) { for (var i = 0; i < n; i++) musBar(); },
    live: function () { return running; },
    mute: function (v) { muted = v; }
  };
})();
</script>
