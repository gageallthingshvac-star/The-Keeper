      outer.push([vx * ct + e1[0] * cf + e2[0] * sf,
                  vy * ct + e1[1] * cf + e2[1] * sf,
                  vz * ct + e1[2] * cf + e2[2] * sf]);
    }
    const inner = prevN || ring[NR], iR = prevR;
    for (let k = 0; k < NS; k++) {
      const q = [inner[k], inner[k + 1], outer[k + 1], outer[k]];
      const rr = [iR, iR, R2, R2];
      let ok = false;
      for (let i = 0; i < 4; i++) {
        const n = q[i], rq = rr[i];
        const px = b.p.x + n[0] * rq - cp.x, py = b.p.y + n[1] * rq - cp.y, pz = b.p.z + n[2] * rq - cp.z;
        const w = m[6] * px + m[7] * py + m[8] * pz;
        _vp[i * 3] = m[0] * px + m[1] * py + m[2] * pz;
        _vp[i * 3 + 1] = m[3] * px + m[4] * py + m[5] * pz;
        _vp[i * 3 + 2] = w;
        if (w >= NEAR) ok = true;
      }
      if (!ok) continue;
      const mm = clipProject(4);
      if (mm < 3 || offscreen(mm)) continue;
      const n0 = q[0];
      const li2 = clamp((n0[0] * sx + n0[1] * sy + n0[2] * sz) * 1.7 + .10, 0, 1);
      const a = SH[s][1] * li2 * fade * (.45 + atm[3] * .40);
      if (a < .012) continue;
      grow(mm, SEAM_PX);
      DL.poly(d + .5 + s * .01, _sp, mm,
        "rgba(" + atm[0] + "," + atm[1] + "," + atm[2] + "," + a.toFixed(3) + ")", null, 0);
    }
    prevN = outer; prevR = R2;
  }
}

function drawBody(b) {
  // the home planet fades in exactly as the sky and the terrain fade out
  const fade = b.home ? (LIGHT.far || 0) : 1;
  if (fade < .01) return;
  const dx = b.p.x - cam.pos.x, dy = b.p.y - cam.pos.y, dz = b.p.z - cam.pos.z;
  const d = Math.hypot(dx, dy, dz);
  /* A basin floor is BELOW the mean radius, so flying in one is not the same
     as being inside the body. Only the deepest relief the surface can hold
     counts as inside. */
  const SB = typeof SURF !== "undefined" ? SURF[b.name] : null;
  if (d < b.r - (SB && SB.amp ? SB.amp * 2.6 : 1)) return;
  /* Close enough that the disc would break down — and, past a certain point,
     vanish entirely as its centre swings behind the camera. Draw the surface. */
  const c = projectRaw(b.p);
  /* The surface renderer, when the disc would be wrong: either the body is
     big enough in the sky that a flat circle stops being one, or its centre
     has swung behind the camera and there is nothing left to project. */
  if (!b.sun && (d < b.r * NEARBODY || !c)) {
    drawBodyNear(b, d, b.home ? clamp((LIGHT.far || 0) * 2, 0, 1) : fade);
    return;
  }
  if (!c) return;
  /* The silhouette of a sphere subtends asin(r/d) and projects to F*tan of
     that, not F*sin — identical while a body is far away and increasingly
     wrong as you close on it, which is exactly when it matters. */
  const sinT = clamp(b.r / Math.max(d, b.r), 0, .999);
  const rp = F * sinT / Math.sqrt(1 - sinT * sinT);   // = F * tan(asin(r/d))
  if (rp < .25 && !(b.home && (LIGHT.far || 0) > 0)) {   // far enough to be a star
    if (c.x < 0 || c.x > W || c.y < 0 || c.y > H) return;
    DL.sprite(d, c.x, c.y, Math.max(1.4, rp * 4), sprite(b.col[0], b.col[1], b.col[2], 3), .85);
    return;
  }
  if (c.x < -rp * 2 || c.x > W + rp * 2 || c.y < -rp * 2 || c.y > H + rp * 2) return;

  if (b.sun) {                                      // the Sun is its own light
    DL.sprite(d + 2, c.x, c.y, Math.max(rp * 9, 26), sprite(255, 232, 178, 3), .40);
    const pts = [];
    for (let i = 0; i < BODY_N; i++) {
      const t = i / BODY_N * TAU;
      pts.push(c.x + Math.cos(t) * rp, c.y + Math.sin(t) * rp);
    }
    DL.poly(d, pts, BODY_N, "rgb(255,250,232)", null, 0);
    return;
  }

  // toward the viewer, and toward the Sun, from the body
  const vx = -dx / d, vy = -dy / d, vz = -dz / d;
  let sx = SUNBODY.p.x - b.p.x, sy = SUNBODY.p.y - b.p.y, sz = SUNBODY.p.z - b.p.z;
  const sl = Math.hypot(sx, sy, sz) || 1; sx /= sl; sy /= sl; sz /= sl;
  const cosPh = clamp(sx * vx + sy * vy + sz * vz, -1, 1);

  // screen direction of the sunward side
  const sp2 = projectRaw(v3(b.p.x + sx * b.r, b.p.y + sy * b.r, b.p.z + sz * b.r));
  let ux = 1, uy = 0;
  if (sp2) {
    const ex = sp2.x - c.x, ey = sp2.y - c.y, el = Math.hypot(ex, ey);
    if (el > 1e-6) { ux = ex / el; uy = ey / el; }
  }
  const wx = -uy, wy = ux;

  drawBodyAir(b, c, d, rp, fade, cosPh, ux, uy);

  /* The disc, in shadow. Not black: starlight, the glow of whatever it is
     orbiting and sunlight bounced off its own air all fall on the night side,
     and a world you can only see half of is a world you cannot navigate by.
     Cold and blue, a fifth of daylight, and legible. */
  const nk = b.sun ? .10 : .27;
  const dark = [b.col[0] * nk * .62 * fade, b.col[1] * nk * .82 * fade, b.col[2] * nk * 1.30 * fade];
  /* Tessellation by how big it actually is. A fixed 44-gon is invisible at
     arm's length and a hexagon-ish mess when the planet fills the screen. */
  const NS = clamp(Math.round(rp * .55) * 2, BODY_N, 160);
  const full = [];
  for (let i = 0; i < NS; i++) {
    const t = i / NS * TAU;
    full.push(c.x + Math.cos(t) * rp * ux + Math.sin(t) * rp * wx,
              c.y + Math.cos(t) * rp * uy + Math.sin(t) * rp * wy);
  }
  DL.poly(d + 1, full, NS, rgb(dark[0], dark[1], dark[2]), null, 0);

  if (b.ring) drawRing(b, c, rp, ux, uy, wx, wy, d, cosPh);

  /* The lit part: the sunward half of the limb, then the terminator ellipse
     back again. The ellipse reaches -cosPh along the sunward axis, NOT
     +cosPh: with the sun behind you (cosPh = +1) the terminator is the far
     limb and the whole disc is lit, and with the sun behind the planet
     (cosPh = -1) it collapses onto the near limb and nothing is. The sign
     used to be the other way round, which lit every world in the sky on the
     side facing away from the Sun. */
  const lit = [];
  const H2 = NS / 2;
  for (let i = 0; i <= H2; i++) {
    const t = -Math.PI / 2 + i / H2 * Math.PI;
    lit.push(c.x + Math.cos(t) * rp * ux + Math.sin(t) * rp * wx,
             c.y + Math.cos(t) * rp * uy + Math.sin(t) * rp * wy);
  }
  for (let i = H2; i >= 0; i--) {
    const t = -Math.PI / 2 + i / H2 * Math.PI;
    lit.push(c.x - cosPh * Math.cos(t) * rp * ux + Math.sin(t) * rp * wx,
             c.y - cosPh * Math.cos(t) * rp * uy + Math.sin(t) * rp * wy);
  }
  const n = lit.length / 2;
  // a little limb darkening so it reads as a ball and not a sticker
  const lc = fade < 1 ? [b.col[0] * fade, b.col[1] * fade, b.col[2] * fade] : b.col;
  DL.poly(d, lit, n, rgb(lc[0], lc[1], lc[2]), null, 0);
  drawBodyDetail(b, c, d, rp, vx, vy, vz, sx, sy, sz, fade);
  DL.sprite(d - 1, c.x - ux * rp * .22, c.y - uy * rp * .22, rp * .82,
    sprite(lc[0] * 1.12, lc[1] * 1.12, lc[2] * 1.12, 0), BODYART[b.name] ? .14 : .30);
}

/* Saturn, because it would be a waste not to. */
function drawRing(b, c, rp, ux, uy, wx, wy, d, cosPh) {
  const inner = 1.24, outer = 2.27;                 // in planet radii, real
  const tilt = .42;                                 // how open the rings are
  const seg = 40;
  for (const [r0, r1, a] of [[inner, 1.52, .34], [1.56, 1.95, .46], [1.99, outer, .22]]) {
    const pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg * TAU;
      pts.push(c.x + Math.cos(t) * rp * r1 * ux + Math.sin(t) * rp * r1 * tilt * wx,
               c.y + Math.cos(t) * rp * r1 * uy + Math.sin(t) * rp * r1 * tilt * wy);
    }
    for (let i = seg; i >= 0; i--) {
      const t = i / seg * TAU;
      pts.push(c.x + Math.cos(t) * rp * r0 * ux + Math.sin(t) * rp * r0 * tilt * wx,
               c.y + Math.cos(t) * rp * r0 * uy + Math.sin(t) * rp * r0 * tilt * wy);
    }
    DL.poly(d + 2, pts, pts.length / 2,
      "rgba(216,200,164," + (a * clamp(.4 + cosPh * .6, .15, 1)).toFixed(3) + ")", null, 0);
  }
}

function drawBodies() {
  for (const b of BODIES) drawBody(b);
}

/* The nav marker. Where the thing you picked is, and if it is not on the
   glass, which way to turn to bring it there. Everything a pilot needs to
   point an aeroplane at something is in these two facts. */
function drawNavMarker() {
  const t = navTarget();
  if (!t || !GAME.started || GAME.paused || NAV.map) return;
  const P = PLANE, u = UI;
  const dx = t.p.x - P.pos.x, dy = t.p.y - P.pos.y, dz = t.p.z - P.pos.z;
  const d = Math.hypot(dx, dy, dz);
  const range = Math.max(d - t.r, 0);
  // closing speed: how fast the gap is shutting, which is the sign of whether
  // you are going to arrive or sail past
  const close = (P.vel.x * dx + P.vel.y * dy + P.vel.z * dz) / Math.max(d, 1);
  const sp = projectRaw(t.p);
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const on = sp && sp.x > 40 * u && sp.x < W - 40 * u && sp.y > 40 * u && sp.y < H - 40 * u;
  const col = close > 0 ? "rgba(126,232,154,.95)" : "rgba(255,176,90,.95)";
  if (on) {
    const r = 13 * u;
    ctx.strokeStyle = col; ctx.lineWidth = 1.6 * u;
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y - r); ctx.lineTo(sp.x + r, sp.y);
    ctx.lineTo(sp.x, sp.y + r); ctx.lineTo(sp.x - r, sp.y);
    ctx.closePath(); ctx.stroke();
    hudFont(11 * u, 700); ctx.fillStyle = col;
    ctx.fillText(t.name.toUpperCase(), sp.x, sp.y - r - 11 * u);
    hudFont(10.5 * u, 600);
    ctx.fillText(navRange(range), sp.x, sp.y + r + 11 * u);
  } else {
    /* Off the glass: an arrow on the rim of a circle, pointing the way you
       have to turn. The direction comes from the target in VIEW space, so it
       is correct even when the thing is behind you. */
    const m = cam.m;
    const vx = m[0] * dx + m[1] * dy + m[2] * dz;
    const vy = m[3] * dx + m[4] * dy + m[5] * dz;
    const vz = m[6] * dx + m[7] * dy + m[8] * dz;
    let ang = Math.atan2(-vy, vx);
    if (vz < 0 && Math.hypot(vx, vy) < 1e-6) ang = Math.PI / 2;
    const rad = Math.min(W, H) * .33;
    const ax = CX + Math.cos(ang) * rad, ay = CY + Math.sin(ang) * rad;
    ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(15 * u, 0); ctx.lineTo(-9 * u, 9 * u); ctx.lineTo(-4 * u, 0); ctx.lineTo(-9 * u, -9 * u);
    ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    hudFont(10.5 * u, 700);
    ctx.fillText(t.name.toUpperCase(), 0, -19 * u);
    hudFont(10 * u, 600);
    ctx.fillText(navRange(range), 0, 20 * u);
    if (vz < 0) { hudFont(9.5 * u, 600); ctx.fillText("BEHIND", 0, 31 * u); }
  }
  // the numbers, bottom centre, where they do not fight the HUD
  hudFont(11 * u, 600); ctx.fillStyle = "rgba(190,214,236,.85)";
  ctx.fillText("NAV " + t.name.toUpperCase() + "   " + navRange(range) + "   " +
    (close >= 0 ? "closing " : "opening ") + navSpeed(Math.abs(close)),
    CX, 136 * u);
  // and what the autopilot is doing about it, if it is flying the transfer
  if (AP.on && AP.mode) {
    hudFont(12 * u, 700);
    ctx.fillStyle = AP.mode === "BRAKING" ? "rgba(255,176,90,.95)"
      : AP.mode === "ARRIVED" ? "rgba(126,232,154,.95)" : "rgba(111,211,255,.95)";
    ctx.fillText("A/P TRANSFER \u00b7 " + AP.mode, CX, 154 * u);
  }
  ctx.restore();
}
function navRange(m) {
  const k = m / 1000;
  return k > 1e6 ? (k / 1e6).toFixed(2) + " Gm" : k > 1000 ? (k / 1000).toFixed(1) + " Mm"
    : k > 1 ? Math.round(k) + " km" : Math.round(m) + " m";
}
function navSpeed(v) {
  return v > 1e6 ? (v / 1e6).toFixed(2) + " Mm/s" : v > 1000 ? (v / 1000).toFixed(1) + " km/s"
    : Math.round(v) + " m/s";
}

/* The map. The solar system spans eleven orders of magnitude of distance, so
   a map drawn to scale is a dot and some empty paper. The radius here is the
   LOGARITHM of range, which puts the Moon and Neptune on the same sheet and
   still gets the directions right — and direction is the thing you actually
   need. Bearing around the circle is where to turn; the ring you are on is
   how far. */
function navETA(s) {
  if (!isFinite(s) || s <= 0) return "--";
  if (s < 90) return Math.round(s) + "s";
  if (s < 5400) return Math.floor(s / 60) + "m " + Math.round(s % 60) + "s";
  if (s < 172800) return Math.floor(s / 3600) + "h " + Math.round(s % 3600 / 60) + "m";
  return (s / 86400).toFixed(1) + " d";
}
/* One tappable thing on the map. Everything the map can be touched on goes
   through here, so the draw pass and the hit pass can never drift apart. */
function mapHit(k, i, x, y, w, h) {
  const m = Math.max(0, 46 * UI - Math.min(w, h)) / 2;   // finger-sized, always
  NAV.hits.push({ k: k, i: i, x: x - m, y: y - m, w: w + m * 2, h: h + m * 2 });
}
function mapAct(k, i) {
  TOUCH.flash["m_" + k] = .18;
  if (k === "close") { NAV.map = false; audio.beep(430, .12, .1); }
  else if (k === "off") { NAV.idx = -1; toast("NAV OFF", 1.2); audio.beep(430, .12, .1); }
  else if (k === "ap") toggleAP();
  else if (k === "spd") toggleSpeedHold();
  else if (k === "body") {
    NAV.idx = i;
    const t = navTarget();
    toast("NAV → " + t.name.toUpperCase(), 1.4);
    audio.beep(780, .14, .12);
  }
}
function mapChip(x, y, w, h, on, label, k, i) {
  const u = UI;
  box(x, y, w, h, 8 * u,
    on ? "rgba(70,150,110,.55)" : "rgba(10,20,30,.72)",
    on ? "rgba(140,246,180,.9)" : "rgba(120,170,215,.45)");
  hudFont(11 * u, 700);
  ctx.fillStyle = on ? "rgba(190,255,214,.98)" : "rgba(206,228,248,.9)";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2);
  if (k) mapHit(k, i, x, y, w, h);
}
function drawMap() {
  if (!NAV.map || typeof BODIES === "undefined") return;
  const u = UI, P = PLANE;
  NAV.hits = [];
  const top = SAFE.t * DPR + 12 * u, bot = H - SAFE.b * DPR - 12 * u;
  const inW = W - (SAFE.l + SAFE.r) * DPR - 24 * u;
  /* Narrow enough that a name, three numbers and two chips will not sit on
     one line: the bottom bar grows a second row instead of overlapping. */
  const narrow = inW < 460 * u;
  const barH = (narrow ? 104 : 58) * u;
  const head = top + 68 * u;                      // under the chips and title
  const R = Math.min(W * .40, (bot - barH - 14 * u - head) * .48);
  const cx = CX, cy = (head + bot - barH - 14 * u) * .5;
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  /* backdrop: deep space, not a grey sheet */
  ctx.fillStyle = "rgb(3,6,11)"; ctx.fillRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.6);
  bg.addColorStop(0, "rgba(28,58,92,.34)");
  bg.addColorStop(.6, "rgba(12,26,44,.16)");
  bg.addColorStop(1, "rgba(4,8,14,0)");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // a few hundred fixed specks, so the sheet has depth
  for (let i = 0; i < 260; i++) {
    const sx = hash2(i, 401) * W, sy = hash2(i, 402) * H;
    const a = .05 + hash2(i, 403) * .22;
    ctx.fillStyle = "rgba(200,220,255," + a.toFixed(3) + ")";
    ctx.fillRect(sx, sy, DPR, DPR);
  }

  /* range rings, one per decade of kilometres, and bearing spokes */
  const L0 = 3, L1 = 10;                       // 1e3 km .. 1e10 km
  const rr = lk => R * clamp((lk - L0) / (L1 - L0), 0, 1);
  ctx.lineWidth = 1 * u;
  for (let s = 0; s < 12; s++) {
    const a = s / 12 * TAU;
    ctx.strokeStyle = s % 3 === 0 ? "rgba(120,170,215,.26)" : "rgba(120,170,215,.10)";
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(a) * R, cy - Math.cos(a) * R);
    ctx.stroke();
  }
  for (let lk = L0; lk <= L1; lk++) {
    ctx.strokeStyle = "rgba(120,170,215,.22)";
    ctx.beginPath(); ctx.arc(cx, cy, rr(lk), 0, TAU); ctx.stroke();
    hudFont(9 * u, 600);
    const lbl = lk >= 9 ? (10 ** (lk - 9)) + " Gm" : lk >= 6 ? (10 ** (lk - 6)) + " Mm" : (10 ** lk) + " km";
    // down the left spoke, backed, so a world sitting on the ring cannot eat it
    const ly = cy - rr(lk) * .707, lx = cx - rr(lk) * .707;
    const lw = ctx.measureText(lbl).width;
    ctx.fillStyle = "rgba(3,6,11,.72)";
    ctx.fillRect(lx - lw / 2 - 3 * u, ly - 6 * u, lw + 6 * u, 12 * u);
    ctx.fillStyle = "rgba(150,190,225,.62)";
    ctx.fillText(lbl, lx, ly);
  }
  hudFont(9.5 * u, 700); ctx.fillStyle = "rgba(126,232,154,.75)";
  ctx.fillText("NOSE", cx, cy - R - 13 * u);
  ctx.fillStyle = "rgba(150,190,225,.45)";
  ctx.fillText("◀ LEFT", cx - R + 22 * u, cy - 11 * u);
  ctx.fillText("RIGHT ▶", cx + R - 22 * u, cy - 11 * u);
  ctx.fillText("TAIL", cx, cy + R + 13 * u);

  /* velocity vector: where the aeroplane is actually going, which in space is
     not where the nose points and is the thing that decides where you end up */
  const m2 = PLANE.m, V = Math.hypot(P.vel.x, P.vel.y, P.vel.z);
  if (V > 1) {
    const vf = (m2[6] * P.vel.x + m2[7] * P.vel.y + m2[8] * P.vel.z) / V;
    const vr = (m2[0] * P.vel.x + m2[1] * P.vel.y + m2[2] * P.vel.z) / V;
    const va = Math.atan2(vr, vf);
    const vX = cx + Math.sin(va) * R * .92, vY = cy - Math.cos(va) * R * .92;
    ctx.strokeStyle = "rgba(255,206,110,.75)"; ctx.lineWidth = 1.5 * u;
    ctx.setLineDash([5 * u, 5 * u]);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(vX, vY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(vX, vY, 5 * u, 0, TAU); ctx.stroke();
    hudFont(9 * u, 700); ctx.fillStyle = "rgba(255,206,110,.85)";
    ctx.fillText("VEL " + navSpeed(V), vX, vY - 12 * u);
  }

  /* the bodies. Nearest last, so what matters sits on top. */
  const list = [];
  for (let i = 0; i < BODIES.length; i++) {
    const b = BODIES[i];
    const dx = b.p.x - P.pos.x, dy = b.p.y - P.pos.y, dz = b.p.z - P.pos.z;
    const d = Math.hypot(dx, dy, dz);
    /* Bearing is measured from the NOSE, so straight up the map is straight
       ahead: turn the way the dot lies and you are pointing at it. */
    const fx = m2[6] * dx + m2[7] * dy + m2[8] * dz;   // ahead
    const rx = m2[0] * dx + m2[1] * dy + m2[2] * dz;   // right
    const ang = Math.atan2(rx, fx);
    const r = rr(Math.log10(Math.max(d, 1) / 1000));
    list.push({ b: b, i: i, d: d,
      x: cx + Math.sin(ang) * r, y: cy - Math.cos(ang) * r });
  }
  list.sort((a, b) => b.d - a.d);
  for (const it of list) {
    const b = it.b, px = it.x, py = it.y;
    const sel = NAV.idx === it.i;
    const rad = Math.max(4 * u, Math.min(13 * u, 3.4 * u + Math.log10(b.r / 1e5) * 2.8 * u));
    const cr = b.col[0] | 0, cg = b.col[1] | 0, cb2 = b.col[2] | 0;
    // glow, then disc, then a lit crescent so it reads as a world
    const gg = ctx.createRadialGradient(px, py, 0, px, py, rad * 3.2);
    gg.addColorStop(0, "rgba(" + cr + "," + cg + "," + cb2 + ",.45)");
    gg.addColorStop(1, "rgba(" + cr + "," + cg + "," + cb2 + ",0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(px, py, rad * 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgb(" + cr + "," + cg + "," + cb2 + ")";

const audio = {

    this.o1 = c.createOscillator(); this.o1.type = "sawtooth"; this.o1.frequency.value = 70;
    this.o2 = c.createOscillator(); this.o2.type = "square"; this.o2.frequency.value = 35;
    this.o1.connect(this.ef); this.o2.connect(this.ef);

    this.so.connect(this.sg); this.sg.connect(this.master);

    // and a wall of noise that the afterburners open right up

    this.o2.frequency.setTargetAtTime(390 + spool * 1150, t, .12);
    this.ef.frequency.setTargetAtTime(300 + spool * 2600 + ab * 1800, t, .12);
    this.eg.gain.setTargetAtTime(P.crashed ? 0 : (camMode === 1 ? .15 : .11) * (.18 + spool * .85), t, .12);

    this.nf.Q.setTargetAtTime(ab > .1 ? .35 : .7, t, .2);

      && !P.onGround && !P.crashed;

  boom() {

/* ========================================================== scenarios === */
const GAME = {
  t: 0, over: false, result: "", started: false, paused: false,
  rings: [], ringIdx: 0, ringT: 0, landScore: null
};
function buildRingCourse() {
  GAME.rings = [];
  let a = Math.PI, x = 0, z = -2000, y = 4000;
  for (let i = 0; i < 12; i++) {
    a += (hash2(i, 51) - .5) * .70 + (i % 2 ? .22 : -.22);
    if (i >= 6) {   // second half curves back toward the field
      let d = Math.atan2(-x, -z) - a;
      if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
      a += clamp(d, -.8, .8) * .55;
    }
    // gates are minutes apart, not seconds, at three times the speed of sound
    const step = 11000 + hash2(i, 52) * 9000;
    x += Math.sin(a) * step; z += Math.cos(a) * step;
    y = clamp(terrainH(x, z) + 2600 + hash2(i, 53) * 7000, 1200, 20000);
    GAME.rings.push({ p: v3(x, y, z), a, passed: false });
  }
  GAME.ringIdx = 0; GAME.ringT = 0;
}
function drawRings() {
  for (let i = 0; i < GAME.rings.length; i++) {
    const rg = GAME.rings[i];
    if (rg.passed) continue;
    const d = vlen(vsub(rg.p, cam.pos));
    if (d > 90000) continue;
    const M = qMat(qAxis(0, 1, 0, rg.a), new Float32Array(9));
    const tint = i === GAME.ringIdx ? [120, 255, 160] : null;
    drawMesh(RING, rg.p, M, null, tint);
    // pylon to the ground so the gate reads in 3D
    const gh = terrainH(rg.p.x, rg.p.z);
    const a = projectPoint(v3(rg.p.x, rg.p.y - 240, rg.p.z)), b = projectPoint(v3(rg.p.x, gh, rg.p.z));
    if (a && b) DL.poly(a.z + 30, [a.x - 1.5, a.y, a.x + 1.5, a.y, b.x + 2.5, b.y, b.x - 2.5, b.y], 4,
      fogged([132, 138, 146], a.z), null, 0);
  }
}
function checkRings(dt) {
  if (SCEN !== "rings" || GAME.over) return;
  GAME.ringT += dt;
  const rg = GAME.rings[GAME.ringIdx];
  if (!rg) return;
  const rel = vsub(PLANE.pos, rg.p);
  const n = v3(Math.sin(rg.a), 0, Math.cos(rg.a));
  const along = vdot(rel, n);
  const radial = Math.hypot(rel.x - n.x * along, rel.y, rel.z - n.z * along);
  if (rg.last === undefined) rg.last = along;
  // `along` runs negative before the gate and positive once past it
  if (rg.last < 0 && along >= 0 && radial < 240) {
    rg.passed = true; GAME.ringIdx++;
    audio.beep(880, .13, .2);
    if (GAME.ringIdx >= GAME.rings.length) {
      GAME.over = true; GAME.result = "COURSE COMPLETE  " + GAME.ringT.toFixed(2) + "s";
      showBanner("COURSE COMPLETE — " + GAME.ringT.toFixed(2) + "s", "#8bf0a8");
    } else toast("GATE " + GAME.ringIdx + " / " + GAME.rings.length, 1.2);
  }

}
function checkLanding() {
  const P = PLANE;
  if (SCEN !== "land" || GAME.over || P.crashed) return;
  if (P.onGround && P.touched > 1.1 && GAME.landScore === null) {
    const onRwy = onRunway(P.pos.x, P.pos.z);
    const vs = P.hardLand;
    const offC = Math.abs(P.pos.x);
    const zone = 950 - P.pos.z;     // metres past the threshold
    let sc = 0, notes = [];
    if (!onRwy) { notes.push("OFF RUNWAY"); }
    else {
      sc = 100;
      sc -= clamp(Math.abs(vs) * 11, 0, 45); notes.push("SINK " + (Math.abs(vs) * 196.85).toFixed(0) + " fpm");
      sc -= clamp(offC * 1.8, 0, 25); notes.push("CENTRE " + offC.toFixed(1) + " m");
      sc -= clamp(Math.abs(zone - 380) * .05, 0, 30); notes.push("TOUCHDOWN " + zone.toFixed(0) + " m");
      sc = Math.max(0, Math.round(sc));
    }
    GAME.landScore = sc;
    GAME.over = true;
    GAME.result = (onRwy ? "TOUCHDOWN — " + sc + " / 100" : "MISSED THE RUNWAY");
    showBanner(GAME.result, onRwy ? (sc > 75 ? "#8bf0a8" : "#ffd27a") : "#ff8c6a");
    toast(notes.join("   "), 5);

/* ============================================================== touch ==== */
/* On a phone the whole control set is drawn into the canvas and driven by
   pointer events: a relative thumb stick on the left, an absolute throttle
   slider on the right, tap buttons for the switches, and rudder pads in
   complex mode. Nothing is a DOM element, so it scales with the canvas and
   costs nothing in layout. */

  on: MOBILE, ptr: new Map(),

  thr: { id: null, x: 0, y: 0, w: 0, h: 0 },

    { k: "spd", x: bx + bw + g, y: by - (bh + g) * 3, w: bw, h: bh },
    { k: "ap", x: bx, y: by - (bh + g) * 2, w: bw, h: bh },
    { k: "keys", x: bx + bw + g, y: by - (bh + g) * 2, w: bw, h: bh },
    { k: "chute", x: bx, y: by - bh - g, w: bw, h: bh },
    { k: "flapup", x: bx + bw + g, y: by - bh - g, w: bw, h: bh },
    { k: "gear", x: bx, y: by, w: bw, h: bh },
    { k: "flap", x: bx + bw + g, y: by, w: bw, h: bh },
    { k: "brake", x: bx, y: by + bh + g, w: bw, h: bh, hold: 1 },

function touchAct(k) {

  // tap on a control marked FLAP-DOWN dumped the whole configuration on short final.

    ctx.fillStyle = P.onBody ? "rgba(126,232,154,.95)" : P.bodyAlt < 3000 ? "rgba(255,170,90,.95)" : G;
    ctx.fillText(P.onBody ? "LANDED" : navRange(Math.max(P.bodyAlt, 0)), rx + 8 * U, CY + 16 * U);
  } else if (nb && nb.body && !nb.body.home) {
    hudFont(12 * U); ctx.fillStyle = GD;
    ctx.fillText(nb.body.name.toUpperCase().slice(0, 8), rx + 8 * U, CY - 4 * U);
    hudFont(16 * U, 600); ctx.fillStyle = nb.alt < 2e6 ? "rgba(255,170,90,.95)" : G;
    const k = nb.alt / 1000;
    ctx.fillText(k > 1e6 ? (k / 1e6).toFixed(2) + "Gm" : k > 1000 ? (k / 1000).toFixed(1) + "Mm"
      : Math.round(k) + "km", rx + 8 * U, CY + 16 * U);
  } else if (P.pos.y > 4e5) {
    // nothing out there worth ranging to, so range to the one you came from
    hudFont(12 * U); ctx.fillStyle = GD; ctx.fillText("EARTH", rx + 8 * U, CY - 4 * U);
    hudFont(16 * U, 600); ctx.fillStyle = G;
    ctx.fillText(navRange(P.pos.y), rx + 8 * U, CY + 16 * U);
  } else {
    hudFont(12 * U); ctx.fillStyle = GD; ctx.fillText("AGL ft", rx + 8 * U, CY - 4 * U);
    hudFont(16 * U, 600); ctx.fillStyle = G;
    ctx.fillText(Math.round((P.pos.y - groundH(P.pos.x, P.pos.z)) * FT), rx + 8 * U, CY + 16 * U);
  }
  hudFont(12 * U); ctx.fillStyle = GD; ctx.fillText("MACH", rx + 8 * U, CY + 38 * U);
  hudFont(16 * U, 600); ctx.fillStyle = G;
  // Mach against air that is not there is a number about nothing
  ctx.fillText((P.qbar || 0) > 5 ? P.mach.toFixed(2) : "--", rx + 8 * U, CY + 54 * U);
  drawGMeter(P, 96 * U + tw + 74 * U, H - 146 * U, 60 * U);

  // throttle + prop
  const tx = 96 * U - 24 * U, ty = CY + tapeH / 2 + 34 * U, tbw = 100 * U, tbh = 14 * U;
  box(tx, ty, tbw, tbh, 3 * U, PANEL, GD);
  ctx.fillStyle = "rgba(150,255,190,.65)"; ctx.fillRect(tx + 2 * U, ty + 2 * U, (tbw - 4 * U) * P.thr, tbh - 4 * U);
  hudFont(11 * U); ctx.fillStyle = "rgba(190,230,208,.92)"; ctx.textAlign = "left";
  // out of the air the lever has no thrust to set, so it sets the speed
  if (SPD.on && SPD.auto) {
    ctx.fillText("SPEED SEL " + navSpeed(SPD.tgt), tx, ty + tbh + 13 * U);
    ctx.fillText("HOLDING " + navSpeed(P.tas), tx, ty + tbh + 27 * U);
  } else {
    ctx.fillText("THROTTLE " + Math.round(P.thr * 100) + "%", tx, ty + tbh + 13 * U);
    ctx.fillText("RPM " + Math.round(P.rpm * 2700), tx, ty + tbh + 27 * U);
  }

  // configuration strip
  const cfg = [];
  cfg.push(["GEAR", P.gear > .98 ? "DN" : P.gear < .02 ? "UP" : "↑↓", P.gear > .98 ? "#7ce89a" : P.gear < .02 ? "#9fb0c4" : "#ffc451"]);
  cfg.push(["FLAP", Math.round(P.flap * 100) + "%", P.flap > .05 ? "#7ce89a" : "#9fb0c4"]);
  cfg.push(["TRIM", (P.trim >= 0 ? "+" : "") + P.trim.toFixed(2), "#9fb0c4"]);
  cfg.push(["BRK", P.brake > .5 ? "ON" : "off", P.brake > .5 ? "#ffc451" : "#69788c"]);
  cfg.push(["CHUTE", P.chuteCmd ? "OUT" : "stowed", P.chuteCmd ? "#ffc451" : "#69788c"]);
  cfg.push(["A/P", AP.on ? "ON" : "off", AP.on ? "#7ce89a" : "#69788c"]);
  /* Angle of attack and sideslip are angles between the nose and the
     velocity vector. In vacuum they are large, meaningless, and were printed
     in warning colours the whole time. Out there they read as unavailable. */
  const aeroValid = (P.qbar || 0) > 60;
  cfg.push(["AoA", aeroValid ? (P.alpha * RAD).toFixed(1) + "°" : "--",
    aeroValid && P.alpha > 22 * DEG ? "#ff8b6a" : "#9fb0c4"]);
  cfg.push(["SLIP", aeroValid ? (P.beta * RAD).toFixed(1) + "°" : "--",
    aeroValid && Math.abs(P.beta) > .08 ? "#ffc451" : "#9fb0c4"]);
  const perRow = 4, colW = 108 * U;
  hudFont(12 * U);
  for (let i = 0; i < cfg.length; i++) {
    const row = Math.floor(i / perRow), col = i % perRow;
    const x = 26 * U + col * colW, cy2 = H - 46 * U + row * 19 * U;
    ctx.fillStyle = "rgba(159,176,196,.75)"; ctx.textAlign = "left";
    ctx.fillText(cfg[i][0], x, cy2);
    ctx.fillStyle = cfg[i][2]; hudFont(13.5 * U, 600);
    ctx.fillText(cfg[i][1], x + 50 * U, cy2); hudFont(12 * U);
  }
  // slip/skid ball for complex mode
  {
    const bx = CX, by = H - 22 * U, bw2 = 110 * U;
    ctx.strokeStyle = GD; ctx.lineWidth = 1.2 * U;
    ctx.beginPath(); ctx.moveTo(bx - bw2 / 2, by); ctx.lineTo(bx + bw2 / 2, by); ctx.stroke();
    ctx.beginPath(); ctx.arc(bx - 9 * U, by, 2 * U, 0, TAU); ctx.arc(bx + 9 * U, by, 2 * U, 0, TAU); ctx.stroke();
    // the ball is a pendulum in a tube of fluid, and beta is an air angle:
    // in vacuum it pegged and stayed pegged, so out there it centres
    const lat = ((P.qbar || 0) > 60) ? clamp(P.beta * 6, -1, 1) : 0;
    ctx.fillStyle = Math.abs(lat) < .18 ? "#7ce89a" : "#ffc451";
    ctx.beginPath(); ctx.arc(bx + lat * bw2 * .45, by, 5 * U, 0, TAU); ctx.fill();
  }

  /* ---- warnings ---- */
  const warn = [];
  // angle of attack only means something where there is air; see P.stall
  const aoaReal = (P.qbar || 0) > 900;
  if (P.stall > .2 && !P.onGround) warn.push(["STALL", "#ff6a56"]);
  else if (aoaReal && P.alpha > 24 * DEG && !P.onGround) warn.push(["APPROACHING STALL", "#ffb03a"]);
  if (P.aoaCap) warn.push(["AoA LIMIT", "#ffb03a"]);
  if (P.gear < .98 && P.pos.y - groundH(P.pos.x, P.pos.z) < 220 && P.ias * KT < 130 && !P.crashed) warn.push(["GEAR", "#ff6a56"]);
  if (P.gload > 8.5) warn.push(["HIGH G", "#ffb03a"]);
  if (P.unstart > 0) warn.push(["INLET UNSTART", "#ff6a56"]);
  // nothing below this line will break the aeroplane; they are read-outs
  if (P.qbar > 150000) warn.push(["HIGH Q", "#7fd4ff"]);
  if (P.heat > 3.2) warn.push(["RE-ENTRY", "#ff9a5a"]);
  else if (P.heat > .90) warn.push(["SKIN TEMP", "#7fd4ff"]);
  // with this much thrust you are through rotation speed in seconds, so the
  // callout matters more here than it does in a real aeroplane
  if (P.onGround && P.ias * 1.94384 > 195 && !P.crashed) warn.push(["ROTATE", "#7ce89a"]);
  hudFont(20 * U, 700); ctx.textAlign = "center";
  const blink = (GAME.t * 4 | 0) % 2 === 0;
  for (let i = 0; i < warn.length; i++) {
    if (!blink && i === 0) continue;
    ctx.fillStyle = warn[i][1];
    ctx.fillText(warn[i][0], CX, CY - 150 * U + i * 26 * U);
  }

  /* ---- objective line + guidance arrow ---- */
  const obj = objectiveLine();
  hudFont(12.5 * U); ctx.textAlign = "center"; ctx.fillStyle = "rgba(200,224,244,.8)";
  ctx.fillText(obj, CX, H - 74 * U);
  hudFont(11 * U); ctx.fillStyle = "rgba(140,158,178,.75)";
  ctx.fillText(CAMNAMES[camMode] + "  ·  " + (AP.on ? "AUTOPILOT ON" : "MANUAL") + "  ·  L controls  ·  H help", CX, hy + 74 * U);

  // direction cue to the next objective
  const tgt = SCEN === "rings" ? (GAME.rings[GAME.ringIdx] && GAME.rings[GAME.ringIdx].p) : v3(0, E, 950);
  if (tgt && !GAME.over) {
    const rel = mRotT(cam.m, vsub(tgt, cam.pos));
    if (rel.z < 40) {
      const a = Math.atan2(rel.x, -rel.z) * (rel.z < 0 ? 1 : 1);
      const rr2 = 190 * U;
      const px = CX + Math.sin(a) * rr2, py = CY + 40 * U;
      ctx.save(); ctx.translate(px, py); ctx.rotate(a * .4);
      ctx.fillStyle = "rgba(255,210,110,.75)";
      ctx.beginPath(); ctx.moveTo(0, -9 * U); ctx.lineTo(7 * U, 6 * U); ctx.lineTo(-7 * U, 6 * U); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}


/* Compact instrument set for phones: large read-outs, no tall tapes, and
   nothing in the corners the thumbs live in. */
function drawHUDCompact() {
  const P = PLANE, e = eulerOf(P.m), u = UI;
  const st = SAFE.t * DPR, sl = SAFE.l * DPR, sr = SAFE.r * DPR;
  const G = "rgba(150,255,190,.95)", GD = "rgba(150,255,190,.50)", PANEL = "rgba(6,12,18,.55)";
  ctx.save();
  ctx.textBaseline = "middle";
  const panel = (x, y, w, h, lbl, val, col, sub) => {
    box(x, y, w, h, 6 * u, PANEL, GD);
    hudFont(10 * u); ctx.fillStyle = GD; ctx.textAlign = "left";
    ctx.fillText(lbl, x + 8 * u, y + 11 * u);
    hudFont(25 * u, 700); ctx.fillStyle = col || G;
    ctx.fillText(val, x + 8 * u, y + h * .60);
    if (sub) { hudFont(10 * u); ctx.fillStyle = GD; ctx.textAlign = "right"; ctx.fillText(sub, x + w - 8 * u, y + h - 9 * u); }
  };
  const pw = 112 * u, ph = 56 * u, py = st + 8 * u;

  /* Every vacuum guard the full HUD got, the phone HUD needs too — and it had
     none of them. This panel is about seven characters wide: indicated
     airspeed reads zero above a hundred kilometres, so the speed instrument
     showed nothing at all, and altitude in feet is ten digits at the Moon,
     which sheared off the right-hand edge of the screen because the panel is
     anchored to it. The phone was the worst place to fly this, not the best. */
  const cvac = (P.qbar || 0) < 40;
  const spdVal = cvac
    ? (P.tas > 1e5 ? (P.tas / 1000).toFixed(0) : Math.round(P.tas))
    : Math.round(P.ias * KT);
  panel(sl + 12 * u, py, pw, ph, cvac ? (P.tas > 1e5 ? "KM/S" : "M/S TAS") : "KIAS",
    String(spdVal), P.stall > .2 ? "rgba(255,120,96,.95)" : G);

  const vs = P.vsi * FPM, avs = Math.abs(vs);
  const vsTxt = avs > 1e6 ? (vs / 1e6).toFixed(1) + "M" : avs > 99999 ? (vs / 1000).toFixed(0) + "k"
    : (vs >= 0 ? "+" : "") + Math.round(vs / 10) * 10;
  const km = P.pos.y / 1000;
  const altBig = P.pos.y > 4e5;
  panel(W - sr - 12 * u - pw, py, pw, ph,
    altBig ? (km > 4e5 ? "ALT Mm" : "ALT KM") : "ALT FT",
    altBig ? (km > 4e5 ? (km / 1000).toFixed(1) : Math.round(km).toString())
           : String(Math.round(P.pos.y * FT)), G, vsTxt);

  /* And the third line: height above the ground until there is no ground,
     then range to whatever you are flying at — which on a phone was the only
     instrument left that could have told the pilot anything. */
  hudFont(10 * u); ctx.textAlign = "right"; ctx.fillStyle = GD;
  const cnt = (typeof navTarget === "function") ? navTarget() : null;
  if (P.pos.y > 4e5 && cnt && !cnt.home) {
    const cr = Math.max(Math.hypot(cnt.p.x - P.pos.x, cnt.p.y - P.pos.y, cnt.p.z - P.pos.z) - cnt.r, 0);
    ctx.fillText(cnt.name.toUpperCase() + " " + navRange(cr), W - sr - 12 * u, py + ph + 11 * u);
  } else if (P.pos.y > 4e5) {
    ctx.fillText("ALT " + navRange(P.pos.y), W - sr - 12 * u, py + ph + 11 * u);
  } else {
    ctx.fillText("AGL " + Math.round((P.pos.y - groundH(P.pos.x, P.pos.z)) * FT),
      W - sr - 12 * u, py + ph + 11 * u);
  }
  drawGMeter(P, W - sr - 12 * u - pw * .5, py + ph + 24 * u + 46 * u, 46 * u);
  // Mach and A/P badge under the speed panel
  box(sl + 12 * u, py + ph + 6 * u, pw, 34 * u, 5 * u, PANEL, GD);
  hudFont(10 * u); ctx.fillStyle = GD; ctx.textAlign = "left";
  ctx.fillText("MACH", sl + 20 * u, py + ph + 16 * u);
  hudFont(17 * u, 700); ctx.fillStyle = P.mach > 3.2 ? "rgba(255,150,90,.95)" : G;
  ctx.fillText((P.qbar || 0) > 5 ? P.mach.toFixed(2) : "\u2014", sl + 60 * u, py + ph + 23 * u);
  if (P.ab > .01) {
    hudFont(11 * u, 700); ctx.fillStyle = "rgba(255,176,80,.95)";
    ctx.fillText("A/B", sl + 20 * u, py + ph + 30 * u);
  }
  if (AP.on) {
    hudFont(11 * u, 700); ctx.fillStyle = "rgba(124,232,154,.95)"; ctx.textAlign = "right";
    ctx.fillText("A/P", sl + 12 * u + pw - 8 * u, py + ph + 30 * u);
  }

  // heading strip
  const hw2 = Math.min(W * .34, 300 * u), hx = CX - hw2 / 2, hy = py;
  box(hx, hy, hw2, 26 * u, 4 * u, PANEL, GD);
  ctx.save(); ctx.beginPath(); ctx.rect(hx, hy, hw2, 26 * u); ctx.clip();
  const hdgDeg = e.hdg * RAD, pxPerDeg = hw2 / 80;
  hudFont(11 * u);
  for (let d = -45; d <= 45; d += 5) {
    const a = Math.round(hdgDeg / 5) * 5 + d, x = CX + (a - hdgDeg) * pxPerDeg;
    const aa = ((a % 360) + 360) % 360;
    ctx.strokeStyle = GD; ctx.beginPath();
    ctx.moveTo(x, hy + 26 * u); ctx.lineTo(x, hy + 26 * u - (aa % 10 === 0 ? 8 : 4) * u); ctx.stroke();
    if (aa % 30 === 0) {
      ctx.fillStyle = G; ctx.textAlign = "center";
      ctx.fillText(aa === 0 ? "N" : aa === 90 ? "E" : aa === 180 ? "S" : aa === 270 ? "W" : String(aa), x, hy + 10 * u);
    }
  }
  ctx.restore();
  ctx.fillStyle = G; ctx.beginPath();
  ctx.moveTo(CX, hy + 28 * u); ctx.lineTo(CX - 5 * u, hy + 37 * u); ctx.lineTo(CX + 5 * u, hy + 37 * u); ctx.fill();

  // attitude: ladder in the cockpit, ball everywhere else
  if (camMode === 1) {
    ctx.save(); ctx.translate(CX, CY); ctx.rotate(-e.roll);
    ctx.strokeStyle = G; ctx.fillStyle = G; ctx.lineWidth = 1.6 * u;
    hudFont(11 * u);
    for (let pp = -60; pp <= 60; pp += 10) {
      const y = Math.tan(e.pitch - pp * DEG) * F;
      if (Math.abs(y) > H * .46) continue;
      const wl = pp === 0 ? 150 * u : 82 * u;
      ctx.globalAlpha = pp === 0 ? .95 : .7;
      ctx.beginPath();
      if (pp < 0) ctx.setLineDash([8 * u, 6 * u]); else ctx.setLineDash([]);
      ctx.moveTo(-wl, y); ctx.lineTo(-wl * .3, y);
      ctx.moveTo(wl * .3, y); ctx.lineTo(wl, y);
      ctx.stroke(); ctx.setLineDash([]);
      if (pp !== 0) { ctx.textAlign = "right"; ctx.fillText(String(Math.abs(pp)), -wl - 5 * u, y); }
    }
    ctx.globalAlpha = 1; ctx.restore();
    const vv = PLANE.vel;
    if (vlen(vv) > 6) {
      const sp = projectPoint(vadd(cam.pos, vmul(vnorm(vv), 400)));
      if (sp) {
        ctx.strokeStyle = "rgba(190,255,150,.95)"; ctx.lineWidth = 2 * u;
        ctx.beginPath(); ctx.arc(sp.x, sp.y, 6 * u, 0, TAU); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sp.x - 14 * u, sp.y); ctx.lineTo(sp.x - 6 * u, sp.y);
        ctx.moveTo(sp.x + 6 * u, sp.y); ctx.lineTo(sp.x + 14 * u, sp.y);
        ctx.moveTo(sp.x, sp.y - 6 * u); ctx.lineTo(sp.x, sp.y - 12 * u); ctx.stroke();
      }
    }
    ctx.strokeStyle = "rgba(255,240,170,.9)"; ctx.lineWidth = 2.4 * u;
    ctx.beginPath();
    ctx.moveTo(CX - 40 * u, CY); ctx.lineTo(CX - 15 * u, CY); ctx.lineTo(CX - 8 * u, CY + 8 * u);
    ctx.moveTo(CX + 40 * u, CY); ctx.lineTo(CX + 15 * u, CY); ctx.lineTo(CX + 8 * u, CY + 8 * u);
    ctx.stroke();
  } else {
    const r = 46 * u, ox = CX, oy = hy + 26 * u + 12 * u + r;
    ctx.save();
    ctx.beginPath(); ctx.arc(ox, oy, r, 0, TAU); ctx.clip();
    ctx.translate(ox, oy); ctx.rotate(-e.roll);
    const yo = clamp(Math.tan(e.pitch) * r * 1.5, -r * 2, r * 2);
    ctx.fillStyle = "rgba(60,116,178,.92)"; ctx.fillRect(-r * 2, -r * 2 + yo, r * 4, r * 2);
    ctx.fillStyle = "rgba(112,84,50,.92)"; ctx.fillRect(-r * 2, yo, r * 4, r * 2);
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 1.5 * u;
    ctx.beginPath(); ctx.moveTo(-r, yo); ctx.lineTo(r, yo); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = GD; ctx.lineWidth = 1.5 * u;
    ctx.beginPath(); ctx.arc(ox, oy, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = "rgba(255,226,120,.95)"; ctx.lineWidth = 2.2 * u;
    ctx.beginPath();
    ctx.moveTo(ox - 20 * u, oy); ctx.lineTo(ox - 7 * u, oy);
    ctx.moveTo(ox + 20 * u, oy); ctx.lineTo(ox + 7 * u, oy); ctx.stroke();
  }

  // warnings + objective
  const warn = [];
  // angle of attack only means something where there is air; see P.stall
  const aoaReal = (P.qbar || 0) > 900;
  if (P.stall > .2 && !P.onGround) warn.push(["STALL", "#ff6a56"]);
  else if (aoaReal && P.alpha > 24 * DEG && !P.onGround) warn.push(["APPROACHING STALL", "#ffb03a"]);
  if (P.gear < .98 && P.pos.y - groundH(P.pos.x, P.pos.z) < 220 && P.ias * KT < 130 && !P.crashed) warn.push(["GEAR", "#ff6a56"]);
  if (P.gload > 8.5) warn.push(["HIGH G", "#ffb03a"]);
  if (P.unstart > 0) warn.push(["INLET UNSTART", "#ff6a56"]);
  hudFont(19 * u, 700); ctx.textAlign = "center";
  const blink = (GAME.t * 4 | 0) % 2 === 0;
  for (let i = 0; i < warn.length; i++) {
    if (!blink && i === 0) continue;
    ctx.fillStyle = warn[i][1];
    ctx.fillText(warn[i][0], CX, CY - 60 * u + i * 24 * u);
  }
  hudFont(11.5 * u); ctx.fillStyle = "rgba(200,224,244,.85)"; ctx.textAlign = "center";
  ctx.fillText(objectiveLine(), CX, hy + 26 * u + (camMode === 1 ? 14 * u : 118 * u));
  ctx.restore();
}

/* The G meter. Load factor is the number this airframe actually lives or dies
   by, so it gets a dial of its own: current needle on an arc from -2 to +7,
   the live figure, and the peaks held since the last reset. */
function drawGMeter(P, x, y, r) {
  const u = UI;
  const A0 = Math.PI * .78, A1 = Math.PI * 2.22;      // sweep, clockwise from lower left
  const gToA = g => A0 + (clamp(g, -4, 12) + 4) / 16 * (A1 - A0);
  ctx.save();
  ctx.textBaseline = "middle";
  // dial face
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = "rgba(6,12,18,.62)"; ctx.fill();
  // coloured bands: the safe range, then caution, then the structural limit
  const band = (g0, g1, col, w) => {
    ctx.beginPath(); ctx.arc(x, y, r - w * .5 - 2 * u, gToA(g0), gToA(g1));
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
  };
  // there is no structural limit any more, so the top of the dial is simply
  // where the wing stops giving: caution, then everything it has
  band(-4, -2.2, "rgba(255,196,80,.50)", 4 * u);
  band(-2.2, 5, "rgba(150,255,190,.40)", 4 * u);
  band(5, 8.5, "rgba(255,196,80,.55)", 4 * u);
  band(8.5, 12, "rgba(255,150,90,.55)", 4 * u);
  // ticks and numerals
  hudFont(9 * u, 600); ctx.textAlign = "center";
  for (let g = -4; g <= 12; g++) {
    const a = gToA(g), major = g % 1 === 0;
    const r0 = r - 8 * u, r1 = r - (major ? 14 : 11) * u;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);
    ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
    ctx.strokeStyle = "rgba(170,206,232,.55)"; ctx.lineWidth = 1.3 * u; ctx.stroke();
    if (g % 4 !== 0) continue;
    ctx.fillStyle = "rgba(190,214,236,.75)";
    ctx.fillText(String(g), x + Math.cos(a) * (r - 24 * u), y + Math.sin(a) * (r - 24 * u));
  }
  // peak markers, held
  for (const [pk, col] of [[P.gMax, "rgba(255,150,90,.95)"], [P.gMin, "rgba(120,190,255,.95)"]]) {
    const a = gToA(pk);
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * (r - 7 * u), y + Math.sin(a) * (r - 7 * u));
    ctx.lineTo(x + Math.cos(a) * (r - 16 * u), y + Math.sin(a) * (r - 16 * u));
    ctx.strokeStyle = col; ctx.lineWidth = 2.2 * u; ctx.stroke();
  }
  // needle
  const an = gToA(P.gload);
  const nc = P.gload > 8.5 || P.gload < -2.2 ? "rgba(255,150,90,.98)"
    : P.gload > 5 ? "rgba(255,206,110,.98)" : "rgba(226,244,255,.98)";
  ctx.beginPath();
  ctx.moveTo(x + Math.cos(an + 2.4) * 4 * u, y + Math.sin(an + 2.4) * 4 * u);
  ctx.lineTo(x + Math.cos(an) * (r - 12 * u), y + Math.sin(an) * (r - 12 * u));
  ctx.lineTo(x + Math.cos(an - 2.4) * 4 * u, y + Math.sin(an - 2.4) * 4 * u);
  ctx.closePath(); ctx.fillStyle = nc; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, 3.2 * u, 0, TAU);
  ctx.fillStyle = "rgba(226,244,255,.95)"; ctx.fill();
  // read-out
  hudFont(21 * u, 700); ctx.fillStyle = nc; ctx.textAlign = "center";
  ctx.fillText(P.gload.toFixed(1), x, y + r * .48);
  hudFont(9 * u, 600); ctx.fillStyle = "rgba(170,196,220,.8)";
  ctx.fillText("G", x, y - r * .40);
  hudFont(9.5 * u, 600);
  ctx.fillStyle = "rgba(255,150,90,.9)"; ctx.textAlign = "right";
  ctx.fillText("\u25b2" + P.gMax.toFixed(1), x + r * .92, y + r * .78);
  ctx.fillStyle = "rgba(120,190,255,.9)"; ctx.textAlign = "left";
  ctx.fillText("\u25bc" + P.gMin.toFixed(1), x - r * .92, y + r * .78);
  ctx.restore();
}

/* Grey-out and red-out. Sustained G drains blood from the eyes before it
   breaks anything, so the view tunnels in before the airframe complains. */
function drawGEffect(P) {
  const s = P.gStress || 0;
  if (s < .02) return;
  const k = clamp(s, 0, 1.0);
  const r0 = Math.hypot(W, H) * .58 * (1 - clamp(k * .34, 0, .44));
  const g = ctx.createRadialGradient(CX, CY, r0 * .25, CX, CY, r0);
  if (P.gRed) {
    g.addColorStop(0, "rgba(120,10,10,0)");
    g.addColorStop(.55, "rgba(150,16,16," + (k * .18).toFixed(3) + ")");
    g.addColorStop(1, "rgba(120,8,8," + Math.min(.60, k * .58).toFixed(3) + ")");
  } else {
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(.5, "rgba(6,8,10," + (k * .13).toFixed(3) + ")");
    g.addColorStop(1, "rgba(3,4,6," + Math.min(.62, k * .60).toFixed(3) + ")");
  }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (k > .96) {
    hudFont(17 * UI, 700); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = P.gRed ? "rgba(255,180,180,.9)" : "rgba(210,224,236,.85)";
    ctx.fillText(P.gRed ? "RED-OUT" : "GREY-OUT", CX, CY + 120 * UI);
  }
}

/* the one-line mission read-out, shared by both HUDs */
function objectiveLine() {
  const P = PLANE;
  if (SCEN === "rings") {
    let o = "GATE " + Math.min(GAME.ringIdx + 1, GAME.rings.length) + "/" + GAME.rings.length + "   T " + GAME.ringT.toFixed(1) + "s";
    const rg = GAME.rings[GAME.ringIdx];
    if (rg) o += "   " + (vlen(vsub(rg.p, P.pos)) / 1000).toFixed(2) + " km";
    return o;
  }
  if (SCEN === "land") return "LAND RWY 18   " + (Math.hypot(P.pos.x, P.pos.z - 950) / 1000).toFixed(2) + " km to threshold";
  /* Off the planet, a latitude and a distance from Tokyo are noise: the map
     that produces them is a flat sheet under the runway, and out here you are
     nowhere on it. Say what there is instead — how far out, and what is
     nearest. */
  if (!onPlanet() || Math.hypot(P.pos.x, P.pos.z) > 2e7) {
    if (P.bodyRef && P.bodyAlt < 140000) {
      const b = P.bodyRef, S = typeof SURF !== "undefined" ? SURF[b.name] : null;
      const g = b.gm / (b.r * b.r) / 9.81;
      return (P.onBody ? "DOWN ON " : "APPROACHING ") + b.name.toUpperCase()
        + "   " + (P.onBody ? "surface" : navRange(Math.max(P.bodyAlt, 0)) + " AGL")
        + "   " + g.toFixed(2) + " g"
        + (S && S.kind === "cloud" ? "   cloud deck" : "")
        + "   " + navSpeed(vlen(P.vel));
    }
    let s = "EARTH " + navRange(Math.max(P.pos.y, 0));
    const nb = typeof nearestBody === "function" ? nearestBody() : null;
    if (nb && nb.body && !nb.body.home)
      s += "   NEAREST " + nb.body.name.toUpperCase() + " " + navRange(Math.max(nb.alt, 0));
    return s + "   " + navSpeed(vlen(P.vel));
  }
  // anywhere else, say where on earth you actually are
  const lon = worldToLon(P.pos.x), lat = worldToLat(P.pos.z);
  let near = null, nd = 1e12;
  for (const c of CITIES) {
    const d = Math.hypot(c.x - P.pos.x, c.z - P.pos.z) / Math.max(1, Math.pow(c.pop, .28));
    if (d < nd) { nd = d; near = c; }
  }
  const pos = Math.abs(lat).toFixed(2) + (lat >= 0 ? "\u00b0N " : "\u00b0S ") +
    Math.abs(lon).toFixed(2) + (lon >= 0 ? "\u00b0E" : "\u00b0W");
  const dn = near ? Math.hypot(near.x - P.pos.x, near.z - P.pos.z) / 1000 : 0;
  return pos + (near ? "   " + dn.toFixed(0) + " km from " + near.name : "");
  return "FREE FLIGHT   " + (Math.hypot(P.pos.x, P.pos.z) / 1000).toFixed(1) + " km from field   " + (P.dist / 1000).toFixed(1) + " km flown";
}

/* Every control, named, for both a keyboard and a thumb. Toggled with L or
   the KEYS button; tap or click anywhere to dismiss. */
const KEYCARD = [
  ["Pitch", "\u2193 pull back / \u2191 push fwd", "thumb back / forward"],
  ["Roll", "\u2190  \u2192", "thumb left / right"],
  ["Rudder", "A  D", "RUD pads"],
  ["Throttle", "W  S   (Shift / Ctrl)", "drag the slider"],
  ["Afterburner", "throttle past 80%", "slider past the A/B line"],
  ["Speed select", "in vacuum the throttle sets SPEED", "same slider, marked SPD"],
  ["Autopilot", "Z   flies the transfer", "A/P button, or FLY IT"],
  ["Speed hold", "O", "HOLD button"],
  ["Nav target", "J   cycles Moon / planets / Sun", "tap a world on the map"],
  ["Solar system map", "N", "MAP button"],
  ["Wheel brakes", "Space (hold)", "BRAKE (hold)"],
  ["Parking brake", "B", "\u2014"],
  ["Drag chute", "X", "CHUTE button"],
  ["Landing gear", "G", "GEAR button"],
  ["Flaps", "F down / V up", "FLAP \u2193 / FLAP \u2191"],
  ["Elevator trim", ",  .", "\u2014"],
  ["Camera", "C", "VIEW button"],
  ["Reset aircraft", "R", "\u2014"],
  ["Pitch sense", "T", "\u2014"],
  ["Pause", "Esc  or  P", "II button"],
  ["This card", "L", "KEYS button"]
];
function drawKeyCard() {
  const u = UI;
  const rows = KEYCARD.length;
  const rowH = 22 * u, padX = 22 * u, padY = 20 * u;
  const cw = [128 * u, 196 * u, 168 * u];
  const bw2 = padX * 2 + cw[0] + cw[1] + cw[2];
  const bh2 = padY * 2 + 30 * u + rows * rowH;
  const scale = Math.min(1, (W - 24 * u) / bw2, (H - 24 * u) / bh2);
  ctx.save();
  ctx.fillStyle = "rgba(4,8,13,.80)"; ctx.fillRect(0, 0, W, H);
  ctx.translate(CX, CY); ctx.scale(scale, scale); ctx.translate(-bw2 / 2, -bh2 / 2);
  box(0, 0, bw2, bh2, 10 * u, "rgba(9,16,24,.96)", "rgba(120,180,220,.42)");
  ctx.textBaseline = "middle";
  hudFont(15 * u, 700); ctx.fillStyle = "rgba(190,232,255,.95)"; ctx.textAlign = "left";
  ctx.fillText("CONTROLS", padX, padY + 4 * u);
  hudFont(10.5 * u, 600); ctx.fillStyle = "rgba(150,180,206,.8)";
  ctx.fillText("KEYBOARD", padX + cw[0], padY + 22 * u);
  ctx.fillText("TOUCH", padX + cw[0] + cw[1], padY + 22 * u);
  let y = padY + 30 * u + rowH * .5;
  for (const [what, pc, touch] of KEYCARD) {
    hudFont(12 * u, 600); ctx.fillStyle = "rgba(214,232,246,.95)";
    ctx.fillText(what, padX, y);
    hudFont(12 * u); ctx.fillStyle = "rgba(150,255,190,.92)";
    ctx.fillText(pc, padX + cw[0], y);
    ctx.fillStyle = "rgba(160,206,236,.85)";
    ctx.fillText(touch, padX + cw[0] + cw[1], y);
    y += rowH;
  }
  hudFont(10.5 * u); ctx.fillStyle = "rgba(140,164,186,.8)";
  ctx.fillText("tap or press L to close", padX, bh2 - padY * .5);
  ctx.restore();
}

function drawHUD(dt) {
  if (TOUCH.on || W < 900 || H < 620) drawHUDCompact(); else drawHUDFull();
  drawTouch(dt);
}

/* ============================================================= input ==== */
const K = Object.create(null);
let mouseStick = false, mdx = 0, mdy = 0;
const KEYMAP = {
  common: [
    ["&larr; &rarr;", "roll rate left / right &mdash; same response at any speed"],
    ["&darr;", "pull back &mdash; commands g, up to 7.5"],
    ["&uarr;", "push forward &mdash; commands g, down to &minus;2.6"],
    ["A D", "rudder &mdash; commands sideslip, damped"],
    ["W S", "throttle up / down (also Shift / Ctrl)"],
    ["Drag slider", "throttle, past 80% lights the afterburners"],
    ["Z", "autopilot on / off"],
    ["O", "speed hold &mdash; throttle then sets the speed"],
    ["J", "cycle nav target &mdash; Moon, planets, Sun"],
    ["N", "solar system map"],
    ["Space", "wheel brakes"],
    ["B", "parking brake"],
    ["G", "landing gear"],
    ["F V", "flaps extend / retract"],
    [", .", "trim &mdash; shifts the g the system holds hands off"],
    ["C", "cycle camera"],
    ["L", "control reference"],
    ["R", "reset aircraft"],
    ["T", "swap pitch sense"],
    ["Esc P", "pause"], ["H", "help"], ["M", "mute"],
    ["Y", "mouse as stick"]
  ]
};
(function fillKeys() {
  const el = document.getElementById("keyList");
  const rows = KEYMAP.common;
  el.innerHTML = rows.map(r => "<div><kbd>" + r[0].split(" ").join("</kbd><kbd>") + "</kbd>" + r[1] + "</div>").join("");
  if (MOBILE || COARSE) showTouchHelp();
})();
function showTouchHelp() {
  const note = document.getElementById("touchNote"), list = document.getElementById("keyList");
  document.getElementById("keyHead").textContent = "Touch controls";
  list.classList.add("hide"); note.classList.remove("hide");
  note.innerHTML =
    "<b>Left thumb</b> &mdash; put it anywhere on the left of the screen and the stick appears there. " +
    "Left / right rolls; pull the thumb <b>back</b> to raise the nose.<br>" +
    "<b>Right slider</b> &mdash; throttle. Past the orange <b>A/B</b> line the afterburners light.<br>" +
    "<b>A/P</b> flies it for you &middot; <b>CHUTE</b> stops it on the runway &middot; " +
    "<b>KEYS</b> lists every control &middot; <b>II</b> pauses.<br>" +
    "Rudder pads sit along the bottom. Turn the phone <b>landscape</b> for the widest view.";
}

window.addEventListener("keydown", ev => {
  const k = ev.key;
  if (k === " " || k.startsWith("Arrow") || k === "Tab") ev.preventDefault();
  if (K[k.toLowerCase()] === undefined || !K[k.toLowerCase()]) onKeyPress(k);
  K[k.toLowerCase()] = true;
  if (k === "Shift") K.shift = true;
  if (k === "Control") K.ctrl = true;
});
window.addEventListener("keyup", ev => {
  K[ev.key.toLowerCase()] = false;
  if (ev.key === "Shift") K.shift = false;
  if (ev.key === "Control") K.ctrl = false;
});
window.addEventListener("blur", () => { for (const k in K) K[k] = false; });

function onKeyPress(k) {
  const P = PLANE;
  const lk = k.toLowerCase();
  if (!GAME.started) return;
  if (lk === "escape" || lk === "p") { togglePause(); return; }
  if (lk === "h") { togglePause(); return; }
  if (GAME.paused) return;
  if (lk === "c") { camMode = (camMode + 1) % CAMNAMES.length; toast("CAMERA: " + CAMNAMES[camMode], 1.2); }
  if (lk === "r") { startFlight(); }
  if (lk === "g") {
    P.gearCmd = P.gearCmd > .5 ? 0 : 1;
    toast(P.gearCmd ? "GEAR DOWN" : "GEAR UP", 1.2); audio.beep(P.gearCmd ? 520 : 400, .18, .12);
  }
  if (lk === "f") { P.flapCmd = clamp(P.flapCmd + .25, 0, 1); toast("FLAPS " + Math.round(P.flapCmd * 100) + "%", 1); }
  if (lk === "v") { P.flapCmd = clamp(P.flapCmd - .25, 0, 1); toast("FLAPS " + Math.round(P.flapCmd * 100) + "%", 1); }
  if (lk === "b") { P.park = !P.park; toast(P.park ? "PARKING BRAKE SET" : "BRAKES RELEASED", 1.4); }
  if (lk === "m") { if (audio.ok) { audio.master.gain.value = audio.master.gain.value > .01 ? 0 : .55; toast(audio.master.gain.value > .01 ? "SOUND ON" : "MUTED", 1.2); } }
  if (lk === "z") { toggleAP(); }
  if (lk === "o") { toggleSpeedHold(); }
  if (lk === "j") { cycleNav(1); }
  if (lk === "n") { NAV.map = !NAV.map; }
  if (lk === "x") {
    if (P.chuteCmd) { P.chuteCmd = 0; toast("CHUTE JETTISONED", 1.4); }
    else if (P.ias * 1.94384 > CHUTE_LIMIT) toast("TOO FAST FOR THE CHUTE", 1.6);
    else { P.chuteCmd = 1; toast("DRAG CHUTE STREAMED", 1.6); audio.beep(240, .3, .16); }
  }
  if (lk === "l") { SHOWKEYS = !SHOWKEYS; }
  if (lk === "t") {
    PITCH_REAL = !PITCH_REAL;
    toast(PITCH_REAL ? "PITCH: PULL BACK TO CLIMB" : "PITCH: PUSH UP TO CLIMB", 2.2);
  }
  if (lk === "y") {
    mouseStick = !mouseStick;
    if (mouseStick) cv.requestPointerLock && cv.requestPointerLock();
    else document.exitPointerLock && document.exitPointerLock();
    toast(mouseStick ? "MOUSE STICK ON" : "MOUSE STICK OFF", 1.4);
  }
}
document.addEventListener("pointerlockchange", () => {
  if (!document.pointerLockElement) mouseStick = false;
});
window.addEventListener("mousemove", ev => {
  if (!mouseStick || !document.pointerLockElement) return;
  mdx = clamp(mdx + ev.movementX * .0045, -1, 1);
  mdy = clamp(mdy + ev.movementY * .0045, -1, 1);
});

const touchHeld = k => TOUCH.flash[k] === 1;
function applyInput(dt) {
  const P = PLANE;

  let a = 0, e2 = 0, r = 0;
  const stick = TOUCH.on && TOUCH.stick.id !== null;
  if (K.arrowleft) a -= 1;
  if (K.arrowright) a += 1;
  // A real stick is pulled back to raise the nose, so Down is nose-up by
  // default. PITCH_REAL flips it for anyone who wants the arcade sense.
  const ps = PITCH_REAL ? -1 : 1;
  if (K.arrowup) e2 += ps;
  if (K.arrowdown) e2 -= ps;
  if (K.k) e2 -= ps; if (K.i) e2 += ps;
  if (K.a) r -= 1; if (K.d) r += 1;
  if (K.q) r -= 1; if (K.e) r += 1;
  if (mouseStick) { a = clamp(a + mdx, -1, 1); e2 = clamp(e2 + mdy * ps, -1, 1); mdx *= Math.exp(-.8 * dt); mdy *= Math.exp(-.8 * dt); }
  if (TOUCH.on && TOUCH.rud.v) r = TOUCH.rud.v;
  const rate = 4.0, ret = 4.8;
  if (stick) {
    // the thumb stick is an absolute position, not a rate
    P.inA = approach(P.inA, TOUCH.stick.dx, 15, dt);
    // pushing the thumb forward (up the screen) is pushing the stick forward
    P.inE = approach(P.inE, TOUCH.stick.dy * ps, 15, dt);
  } else {
    P.inA = a ? clamp(P.inA + a * rate * dt, -1, 1) : approach(P.inA, 0, ret, dt);
    P.inE = e2 ? clamp(P.inE + e2 * rate * dt, -1, 1) : approach(P.inE, 0, ret, dt);
  }
  P.inR = r ? clamp(P.inR + r * 5 * dt, -1, 1) : approach(P.inR, 0, 6, dt);
  // throttle
  let tdir = 0;
  if (K.w || K.shift) tdir += 1;
  if (K.s || K.ctrl) tdir -= 1;
  if (tdir) {
    if (SPD.on) {
      // the lever is a speed now: a proportional nudge, so it is usable from
      // a taxi speed to a hundred kilometres a second
      // changing the number is not the same as taking the system out; the
      // auto flag only records who armed it, so that leaving the atmosphere
      // does not re-arm it underneath a pilot who has set their own speed
      SPD.tgt = clamp(SPD.tgt * (1 + tdir * .55 * dt) + tdir * 22 * dt, 0, 4e8);
    } else { P.thr = clamp(P.thr + tdir * .5 * dt, 0, 1); if (P.thr > .02) P.park = false; }
  }
  // trim (the autopilot owns trim while it is engaged)
  if (!AP.on) {
    if (K[","] || K.home) P.trim = clamp(P.trim + .30 * dt, -.8, .8);
    if (K["."] || K.end) P.trim = clamp(P.trim - .30 * dt, -.8, .8);
  }
  // brakes
  const held = (K[" "] || touchHeld("brake")) ? 1 : 0;
  P.brake = clamp(approach(P.brake, Math.max(held, P.park && P.onGround ? 1 : 0), 12, dt), 0, 1);
}

/* ============================================================== flow ==== */
function toggleAP() {
  AP.on = !AP.on;
  const P = PLANE;
  P.pitchI = 0; P.fbwI = 0; P.apAlt = undefined; P.apHdg = undefined; P.holdHdg = undefined;
  if (!AP.on) { P.dE = P.dA = P.dR = 0; }
  toast(AP.on ? "AUTOPILOT ENGAGED" : "AUTOPILOT OFF \u00b7 MANUAL", 1.8);
  audio.beep(AP.on ? 760 : 420, .16, .14);
}
let SHOWKEYS = false;

function togglePause() {
  if (!GAME.started) return;
  GAME.paused = !GAME.paused;
  const m = document.getElementById("menu");
  m.classList.toggle("hide", !GAME.paused);
  document.getElementById("startBtn").textContent = GAME.paused ? (dirty ? "RESTART FLIGHT" : "RESUME FLIGHT") : "BEGIN FLIGHT";
  if (GAME.paused && mouseStick) { mouseStick = false; document.exitPointerLock && document.exitPointerLock(); }
}
let dirty = false;
function startFlight(keepMode) {
  GAME.t = 0; GAME.over = false; GAME.result = ""; GAME.landScore = null;
  GAME.paused = false; GAME.started = true; dirty = false;
  PARTS.length = 0; cam.shake = 0; cam.init = 0; cam.off = v3();
  hideBanner();
  resetPlane(SCEN);
  if (SCEN === "rings") buildRingCourse(); else GAME.rings = [];
  document.getElementById("menu").classList.add("hide");
  audio.init();
  toast(SCEN === "free" ? "BRAKES SET · THROTTLE UP WITH W · PRESS L FOR CONTROLS" :
    SCEN === "land" ? "RUNWAY 18 AHEAD · CHUTE ON TOUCHDOWN WITH X" :
      SCEN === "rings" ? "FLY THROUGH THE GREEN GATE" : "AIRBORNE · PRESS L FOR CONTROLS", 3.6);
}
document.querySelectorAll("#pitchRow .opt").forEach(b => b.addEventListener("click", () => {
  PITCH_REAL = b.dataset.pitch === "real";
  document.querySelectorAll("#pitchRow .opt").forEach(o => o.classList.toggle("on", o === b));
}));
document.querySelectorAll("#scenRow .opt").forEach(b => b.addEventListener("click", () => {
  SCEN = b.dataset.scen; dirty = true;
  document.querySelectorAll("#scenRow .opt").forEach(o => o.classList.toggle("on", o === b));
  document.getElementById("startBtn").textContent = GAME.started ? "RESTART FLIGHT" : "BEGIN FLIGHT";
}));
document.getElementById("startBtn").addEventListener("click", () => {
  if (GAME.started && GAME.paused && !dirty) { togglePause(); return; }
  startFlight();
});

/* ============================================================== loop ==== */
let last = performance.now(), fps = 60, acc = 0;
function frame(now) {
  const work0 = performance.now();
  let dt = (now - last) / 1000; last = now;
  if (!isFinite(dt) || dt < 0) dt = .016;
  dt = Math.min(dt, .066);
  fps = lerp(fps, 1 / Math.max(dt, .001), .06);

  if (GAME.started && !GAME.paused) {
    WIND.t += dt;
    applyInput(dt);
    const h = 1 / 240;
    acc += dt;
    let steps = 0;
    while (acc >= h && steps < 16) { physics(PLANE, h); acc -= h; steps++; }
    if (acc > h) acc = 0;
    GAME.t += dt;
    updateParts(dt);
    spawnTrails(dt);
    checkRings(dt);
    checkLanding();
    if (PLANE.crashed) {
      PLANE.crashT += dt;
      if (PLANE.crashT > 1 && PLANE.crashT < 3.4 && Math.random() < .35) spawnFire(PLANE.pos);
    }
    cam.shake = Math.max(0, cam.shake - dt * 1.6);
    updateCamera(dt);
    audio.update(PLANE, dt);
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.style.opacity = 0; }
  } else if (GAME.started) {
    updateCamera(0);
  } else {
    // slow fly-by of the field behind the menu
    const a = now * .00007;
    cam.pos = v3(Math.cos(a) * 900, E + 320, Math.sin(a) * 900 + 200);
    const look = v3(0, E + 20, 0);
    const f2 = vnorm(vsub(look, cam.pos)), r2 = vnorm(vcross(v3(0, 1, 0), f2)), u2 = vcross(f2, r2);
    cam.m[0] = r2.x; cam.m[1] = r2.y; cam.m[2] = r2.z;
    cam.m[3] = u2.x; cam.m[4] = u2.y; cam.m[5] = u2.z;
    cam.m[6] = f2.x; cam.m[7] = f2.y; cam.m[8] = f2.z;
  }

  // ---- render ----
  updateAtmosphere(cam.pos.y);
  fogCol = LIGHT.hazeNear;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawSky();
  DL.reset();
  drawBodies();
  drawTerrain();
  // the airfield was gated on horizontal distance alone, so it stayed in
  // view all the way to the Moon if you climbed straight up off the runway
  if (onPlanet() && Math.hypot(cam.pos.x, cam.pos.z) < 40000)
    drawMesh(AIRPORT, v3(0, 0, 0), mIdent(), null);
  drawLakes();
  drawTrees();
  drawRoadsRivers();
  drawCities();
  if (GAME.rings.length) drawRings();
  if (GAME.started) { drawShadow(); drawAircraft(); }
  drawParts();
  drawClouds();
  DL.flush();
  drawReentryWash(PLANE);
  drawLandmarks();
  drawGlare();
  if (Q.q.vig && vignette) { ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H); }
  if (GAME.started && !GAME.paused) { drawGEffect(PLANE); drawHUD(dt); drawNavMarker(); drawMap(); }
  tuneQuality(dt, performance.now() - work0);
  requestAnimationFrame(frame);
}
applyQuality();
resetPlane("free");
qMat(PLANE.q, PLANE.m);
requestAnimationFrame(frame);
</script>
</body>
</html>
