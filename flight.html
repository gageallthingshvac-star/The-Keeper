<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080c">
<title>Blackbird Mach 3</title>
<style>
  :root{
    --ink:#e8eef6; --dim:#9fb0c4; --accent:#6fd3ff; --warn:#ffb03a; --bad:#ff5a4d; --good:#6fe08a;
    --panel:rgba(8,14,22,.82); --edge:rgba(120,170,215,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#05080c;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;image-rendering:auto}
  .layer{position:absolute;inset:0;pointer-events:none}
  .modal{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;
    background:radial-gradient(1200px 700px at 50% 30%,rgba(18,40,64,.78),rgba(3,6,10,.94));
    backdrop-filter:blur(3px);pointer-events:auto;overflow:auto;padding:24px}
  .card{width:min(900px,96vw);margin:auto;background:var(--panel);border:1px solid var(--edge);
    border-radius:14px;padding:22px 24px 20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  h1{margin:0 0 2px;font-size:30px;letter-spacing:.20em;font-weight:600}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:12.5px;letter-spacing:.06em;margin-bottom:18px}
  h2{font-size:12px;letter-spacing:.20em;color:var(--dim);margin:18px 0 8px;font-weight:600;text-transform:uppercase}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .opt{flex:1 1 200px;min-width:190px;text-align:left;background:rgba(255,255,255,.04);
    border:1px solid var(--edge);border-radius:10px;padding:11px 13px;cursor:pointer;color:var(--ink);
    font:inherit;transition:background .12s,border-color .12s,transform .12s}
  .opt:hover{background:rgba(111,211,255,.10);border-color:rgba(111,211,255,.5)}
  .opt.on{background:rgba(111,211,255,.16);border-color:var(--accent)}
  .opt b{display:block;font-size:14px;letter-spacing:.06em;margin-bottom:3px}
  .opt i{font-style:normal;color:var(--dim);font-size:11.5px;line-height:1.45;display:block}
  .go{margin-top:20px;width:100%;padding:14px;font:inherit;font-size:15px;letter-spacing:.22em;
    background:linear-gradient(180deg,#1d6f96,#12475f);color:#fff;border:1px solid #5fc8f0;
    border-radius:10px;cursor:pointer}
  .go:hover{filter:brightness(1.15)}
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:4px 18px;
    font-size:11.5px;color:var(--dim);line-height:1.6}
  .keys kbd{display:inline-block;min-width:16px;text-align:center;padding:1px 5px;margin-right:6px;
    background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:4px;color:var(--ink);font-size:10.5px}
  .foot{margin-top:16px;font-size:11px;color:#68788c;letter-spacing:.05em}
  #toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);text-align:center;
    font-size:19px;letter-spacing:.12em;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .25s}
  #banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:40px;letter-spacing:.2em;
    text-shadow:0 4px 30px #000;opacity:0;transition:opacity .4s}
  .hide{display:none !important}
  #safe{position:fixed;top:0;left:0;width:0;height:0;pointer-events:none;visibility:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  html,body{overscroll-behavior:none;-webkit-touch-callout:none}
  canvas{touch-action:none}
  .modal{touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .modal{padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
         calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  @media (max-width:760px),(max-height:520px){
    .card{padding:15px 16px 14px;border-radius:12px}
    h1{font-size:22px;letter-spacing:.16em}
    .sub{font-size:11px;margin-bottom:12px}
    h2{font-size:10.5px;margin:12px 0 6px}
    .opt{flex:1 1 140px;min-width:130px;padding:9px 10px}
    .opt b{font-size:12px} .opt i{font-size:10.5px;line-height:1.35}
    .keys{font-size:10.5px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
    .go{padding:16px;font-size:14px;margin-top:14px}
    .foot{font-size:10px}
  }
  #touchNote{font-size:11.5px;color:var(--dim);line-height:1.6}
  #touchNote b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div id="safe"></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="layer"><div id="toast"></div><div id="banner"></div></div>

  <div class="modal" id="menu">
    <div class="card">
      <h1>BLACK<span>BIRD</span></h1>
      <div class="sub">Mach&nbsp;3 reconnaissance jet &mdash; software-rendered, no plugins</div>

      <h2>Pitch sense</h2>
      <div class="row" id="pitchRow">
        <button class="opt on" data-pitch="real"><b>PULL BACK TO CLIMB</b><i>What a control stick really does. <kbd>&darr;</kbd> or thumb back raises the nose, <kbd>&uarr;</kbd> or thumb forward drops it. Swap any time with <kbd>T</kbd>.</i></button>
        <button class="opt" data-pitch="direct"><b>PUSH UP TO CLIMB</b><i>Arcade sense. <kbd>&uarr;</kbd> or thumb forward raises the nose.</i></button>
      </div>

      <h2>Flight</h2>
      <div class="row" id="scenRow">
        <button class="opt on" data-scen="free"><b>FREE FLIGHT</b><i>Cold on runway 18 at Keeper Field. Brakes set, engines at idle. Go anywhere &mdash; the envelope reaches Mach 3.2 above 80,000 ft.</i></button>
        <button class="opt" data-scen="air"><b>AIRBORNE START</b><i>Airborne at 23,000 ft and already supersonic. Climb and accelerate.</i></button>
        <button class="opt" data-scen="rings"><b>RING RACE</b><i>12 gates strung across 120 km of sky, against the clock.</i></button>
        <button class="opt" data-scen="land"><b>LANDING CHALLENGE</b><i>9 km final, gear and flaps set. Stream the chute with <kbd>X</kbd> after touchdown. Scored on centreline, sink rate and touchdown point.</i></button>
      </div>

      <h2 id="keyHead">Keys</h2>
      <div class="keys" id="keyList"></div>
      <div id="touchNote" class="hide"></div>

      <button class="go" id="startBtn">BEGIN FLIGHT</button>
      <div class="foot">Esc pauses &middot; R resets the aircraft &middot; L shows the control card in flight &middot; Z flies the autopilot</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   SKYWARD — a single-file flight simulator.
   Everything is drawn with a hand-written 3D pipeline on a 2D canvas:
   view transform -> near-plane clip -> perspective project -> painter's fill.
   ========================================================================== */

/* ---------------------------------------------------------------- math ---- */
const TAU = Math.PI * 2, DEG = Math.PI / 180, RAD = 180 / Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const sstep = (a, b, x) => smooth(clamp((x - a) / (b - a), 0, 1));
const sign = Math.sign;
// exponential smoothing that is stable for any dt
const approach = (cur, tgt, rate, dt) => cur + (tgt - cur) * (1 - Math.exp(-rate * dt));

const v3 = (x = 0, y = 0, z = 0) => ({ x, y, z });
const vadd = (a, b) => v3(a.x + b.x, a.y + b.y, a.z + b.z);
const vsub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
const vmul = (a, s) => v3(a.x * s, a.y * s, a.z * s);
const vdot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const vcross = (a, b) => v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const vlen = a => Math.hypot(a.x, a.y, a.z);
const vnorm = a => { const l = vlen(a) || 1; return v3(a.x / l, a.y / l, a.z / l); };

/* Quaternion [w,x,y,z] rotating body vectors into world space.
   Body axes: +X right wing, +Y up through canopy, +Z out the nose (right-handed). */
const qId = () => [1, 0, 0, 0];
function qmul(a, b) {
  return [
    a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
    a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
    a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
    a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]];
}
function qnorm(q) {
  const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  q[0] /= l; q[1] /= l; q[2] /= l; q[3] /= l; return q;
}
function qAxis(ax, ay, az, ang) {
  const h = ang * .5, s = Math.sin(h), l = Math.hypot(ax, ay, az) || 1;
  return [Math.cos(h), ax / l * s, ay / l * s, az / l * s];
}
/* 3x3 matrix, column-major triples: m[0..2]=body X in world, m[3..5]=Y, m[6..8]=Z */
function qMat(q, m) {
  const w = q[0], x = q[1], y = q[2], z = q[3];
  const xx = x * x, yy = y * y, zz = z * z, xy = x * y, xz = x * z, yz = y * z,
    wx = w * x, wy = w * y, wz = w * z;
  m[0] = 1 - 2 * (yy + zz); m[1] = 2 * (xy + wz); m[2] = 2 * (xz - wy);
  m[3] = 2 * (xy - wz); m[4] = 1 - 2 * (xx + zz); m[5] = 2 * (yz + wx);
  m[6] = 2 * (xz + wy); m[7] = 2 * (yz - wx); m[8] = 1 - 2 * (xx + yy);
  return m;
}
const mRot = (m, v) => v3(
  m[0] * v.x + m[3] * v.y + m[6] * v.z,
  m[1] * v.x + m[4] * v.y + m[7] * v.z,
  m[2] * v.x + m[5] * v.y + m[8] * v.z);
const mRotT = (m, v) => v3(     // inverse rotation (transpose)
  m[0] * v.x + m[1] * v.y + m[2] * v.z,
  m[3] * v.x + m[4] * v.y + m[5] * v.z,
  m[6] * v.x + m[7] * v.y + m[8] * v.z);
/* Integrate an orientation quaternion by a body-frame angular velocity. */
function qIntegrate(q, w, dt) {
  const d = [0, w.x * dt * .5, w.y * dt * .5, w.z * dt * .5];
  const r = qmul(q, [1, d[1], d[2], d[3]]);
  return qnorm(r);
}
/* Euler read-outs for the instruments (aviation convention). */
function eulerOf(m) {
  const fwd = v3(m[6], m[7], m[8]), up = v3(m[3], m[4], m[5]);
  const pitch = Math.asin(clamp(fwd.y, -1, 1));
  const hdg = Math.atan2(fwd.x, fwd.z);
  // roll: angle of the wing plane about the nose axis
  const rightLevel = vnorm(vcross(v3(0, 1, 0), fwd));
  const upLevel = vcross(fwd, rightLevel);
  const roll = Math.atan2(vdot(up, rightLevel), vdot(up, upLevel)); // +ve = right bank
  return { pitch, hdg: (hdg + TAU) % TAU, roll };
}

/* --------------------------------------------------------------- colour --- */
const rgb = (r, g, b) => "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
function mixc(c1, c2, t) { return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }
function shade(c, k) { return [clamp(c[0] * k, 0, 255), clamp(c[1] * k, 0, 255), clamp(c[2] * k, 0, 255)]; }

/* ----------------------------------------------------------- value noise -- */
function hash2(i, j) {
  let n = (i * 374761393 + j * 668265263) | 0;
  n = (n ^ (n >> 13)) | 0; n = Math.imul(n, 1274126177);
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = smooth(xf), v = smooth(yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct) {
  let s = 0, a = .5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f); n += a; a *= .5; f *= 2.03; }
  return s / n;
}

/* ================================================================ world == */
const WORLD = {
  sea: 0,                       // water surface height (m)
  fieldElev: 16,                // airport elevation (m)
  fieldR: 2400,                 // radius of flattened airport basin
  rwyLen: 1900, rwyW: 46,       // runway 18/36, aligned with the Z (north) axis
  sun: vnorm(v3(-.40, .55, .73)),
  ground: [82, 104, 60],
};

/* Lighting: one directional sun plus a hemisphere ambient (cool light from the
   sky above, warm bounce from the ground below). Everything in the scene is
   shaded through this, which is what makes surfaces read as the same material
   under the same sky. Distance is handled as aerial perspective rather than
   flat fog: the haze warms up toward the sun and stays blue away from it. */
const LIGHT = {
  sun: null,
  sunCol: [1.08, 1.00, .86],
  skyCol: [.34, .42, .56],
  gndCol: [.24, .23, .17],
  hazeNear: [178, 199, 222],    // horizon haze away from the sun
  hazeSun: [248, 234, 204],     // haze looking into the sun
  hazeHigh: [120, 150, 190],    // what distance does to things above the horizon
  density: 1 / 15000, dens: 1 / 15000,
  zenith: [34, 82, 156], mid: [108, 160, 212]
};
/* Haze lives in the lower atmosphere, so the view opens right up as you climb;
   by the tropopause you can see a hundred kilometres. */
function updateAtmosphere(camY) {
  const k = Math.exp(-Math.max(camY, 0) / 3400);
  LIGHT.dens = LIGHT.density * (.06 + .94 * k);
  LIGHT.space = clamp((camY - 12000) / 16000, 0, 1);
}
LIGHT.space = 0;
LIGHT.sun = WORLD.sun;

/* Shade a base colour by a world-space normal. */
function litColor(col, nx, ny, nz) {
  const L = LIGHT, s = Math.max(nx * L.sun.x + ny * L.sun.y + nz * L.sun.z, 0);
  const sky = .5 + .5 * ny, gnd = .5 - .5 * ny;
  return [col[0] * (L.sunCol[0] * s + L.skyCol[0] * sky + L.gndCol[0] * gnd),
          col[1] * (L.sunCol[1] * s + L.skyCol[1] * sky + L.gndCol[1] * gnd),
          col[2] * (L.sunCol[2] * s + L.skyCol[2] * sky + L.gndCol[2] * gnd)];
}
/* Aerial perspective. `v` is the normalised world direction from eye to point. */
function aerial(col, dist, vx, vy, vz) {
  const L = LIGHT;
  const f = 1 - Math.exp(-dist * L.dens);
  if (f < .004) return rgb(col[0], col[1], col[2]);
  const cs = clamp(vx * L.sun.x + vy * L.sun.y + vz * L.sun.z, 0, 1);
  const up = clamp(vy * 2.2, 0, 1);
  const h0 = lerp(L.hazeNear[0], L.hazeHigh[0], up), h1 = lerp(L.hazeNear[1], L.hazeHigh[1], up),
    h2 = lerp(L.hazeNear[2], L.hazeHigh[2], up);
  const mie = Math.pow(cs, 5) * .85;
  return rgb(
    lerp(col[0], lerp(h0, L.hazeSun[0], mie), f),
    lerp(col[1], lerp(h1, L.hazeSun[1], mie), f),
    lerp(col[2], lerp(h2, L.hazeSun[2], mie), f));
}

/* Terrain height at any point. Mountains ring a flat basin holding the field. */
function terrainH(x, z, cell) {
  const d = Math.hypot(x, z);
  const basin = 1 - sstep(WORLD.fieldR, WORLD.fieldR * 2.8, d);
  let m = fbm(x / 2600, z / 2600, 5);
  m = Math.pow(clamp(m, 0, 1), 2.25);
  let h = m * 1500 - 95;
  // a lake to the east keeps the terrain from feeling uniform
  const lake = sstep(2600, 1200, Math.hypot(x - 6200, z + 2300));
  h = lerp(h, -30, lake * .9);
  // Fine relief is dropped once the sampling grid is coarser than the feature:
  // sampled at 500 m intervals it aliases into a checkerboard of hills and
  // hollows. `cell` is the grid spacing the caller is using; physics and trees
  // omit it and always get the full detail.
  const det = cell ? clamp(1 - (cell - 110) / 260, 0, 1) : 1;
  if (det > 0) h += fbm(x / 340, z / 340, 3) * 24 * (1 - basin * .8) * det;
  return lerp(h, WORLD.fieldElev, basin);
}
/* Cheap normal by finite difference. */
function terrainN(x, z, e) {
  e = e || 6;
  const hl = terrainH(x - e, z), hr = terrainH(x + e, z);
  const hd = terrainH(x, z - e), hu = terrainH(x, z + e);
  return vnorm(v3(hl - hr, 2 * e, hd - hu));
}
const onRunway = (x, z) => Math.abs(x) < WORLD.rwyW * .5 + 1 && Math.abs(z) < WORLD.rwyLen * .5;
/* Footprint of the paved airfield. The runway is coplanar with the terrain, so
   a centroid depth sort alone lets nearer ground quads paint over it. Terrain
   inside this box is pushed back in the order instead, which settles it
   without disturbing how anything else sorts against the ground. */
const inField = (x, z) => x > -260 && x < 440 && Math.abs(z) < 1100;
const FIELD_PUSH = 400;
/* Height used for contact: runway and apron are perfectly flat. */
function groundH(x, z) {
  if (onRunway(x, z)) return WORLD.fieldElev;
  if (Math.abs(x - 225) < 108 && Math.abs(z - 650) < 132) return WORLD.fieldElev; // apron
  return terrainH(x, z);
}
function terrainColor(h, slope, x, z) {
  const rock = sstep(.34, .64, slope);
  const snow = sstep(900, 1180, h) * (1 - rock * .45) * sstep(.62, .30, slope);
  const dry = sstep(150, 640, h);
  const scrub = sstep(520, 980, h);
  // meadow -> dry upland -> alpine scrub, with rock on anything steep
  let c = mixc([78, 112, 56], [134, 126, 78], dry);
  c = mixc(c, [96, 104, 74], scrub * .7);
  c = mixc(c, [108, 102, 96], rock);
  c = mixc(c, mixc([120, 112, 104], [86, 82, 80], sstep(.5, .8, slope)), rock * .4);
  c = mixc(c, [240, 246, 252], snow);
  // a narrow beach where the land meets the water
  c = mixc(c, [182, 170, 138], sstep(5, .5, h) * (1 - rock) * .85);
  // field-sized patchwork, plus a gentle regional tint
  const v = (fbm(x / 190, z / 190, 2) - .5) * .30 + (fbm(x / 3200, z / 3200, 2) - .5) * .10;
  return shade(c, 1 + v);
}

/* ============================================================== renderer == */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false, desynchronized: true });
let W = 0, H = 0, CX = 0, CY = 0, F = 800, DPR = 1;
const NEAR = 0.30;
let FOV = 62 * DEG, FOVBASE = 62 * DEG;

const COARSE = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
const MOBILE = COARSE || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || "");

/* Quality ladder. Phones start two rungs down and the frame timer moves the
   dial at runtime, so a 60 Hz phone and a desktop both stay smooth. */
/* More LOD rings than a propeller aeroplane needs: at Mach 3 you cross the
   old draw distance in eight seconds, and from 24 km you can see most of it. */
const QLEVELS = [
  { dpr: 1.00, lev: 7, half: 6, base: 78, trees: .22, treeR: 750, clouds: 9000, glare: 0, vig: 0, shadow: 1, stars: 0 },
  { dpr: 1.25, lev: 8, half: 6, base: 68, trees: .30, treeR: 950, clouds: 14000, glare: 1, vig: 1, shadow: 1, stars: 1 },
  { dpr: 1.50, lev: 8, half: 7, base: 62, trees: .38, treeR: 1150, clouds: 20000, glare: 1, vig: 1, shadow: 1, stars: 1 },
  { dpr: 2.00, lev: 9, half: 7, base: 58, trees: .44, treeR: 1350, clouds: 26000, glare: 1, vig: 1, shadow: 1, stars: 1 }
];
const Q = { i: MOBILE ? 1 : 3, auto: true, work: 9, hold: 0, q: QLEVELS[MOBILE ? 1 : 3] };

function applyQuality() {
  Q.q = QLEVELS[Q.i];
  resize();
}
/* Tuned on the time spent inside the frame, not the frame interval: vsync
   pins the interval at 16.7 ms whatever the load, so it can never show headroom. */
function tuneQuality(dt, workMs) {
  Q.work += (workMs - Q.work) * .06;
  if (!Q.auto || !GAME.started || GAME.paused) return;
  Q.hold -= dt;
  if (Q.hold > 0) return;
  if (Q.work > 11.5 && Q.i > 0) { Q.i--; Q.hold = 2.5; applyQuality(); }
  else if (Q.work < 6.5 && Q.i < QLEVELS.length - 1) { Q.i++; Q.hold = 4; applyQuality(); }
}

let PORTRAIT = false, UI = 1;
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
function readSafe() {
  const el = document.getElementById("safe");
  if (!el) return;
  const cs = getComputedStyle(el);
  SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0;
  SAFE.b = parseFloat(cs.paddingBottom) || 0; SAFE.l = parseFloat(cs.paddingLeft) || 0;
}
function resize() {
  const cw = cv.clientWidth || window.innerWidth, ch = cv.clientHeight || window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, Q.q.dpr);

    this.fill[i] = fill; this.stroke[i] = stroke || null; this.lw[i] = lw || 1;

    this.fill[i] = img; this.stroke[i] = null;

    gl.addColorStop(0, "rgba(255,250,228,.85)");
    gl.addColorStop(.035, "rgba(255,246,214,.42)");
    gl.addColorStop(.12, "rgba(255,240,206,.16)");
    gl.addColorStop(.42, "rgba(250,236,210,.05)");

      this.quad(p(-1, 1, 1), p(1, 1, 1), p(1, 1, -1), p(-1, 1, -1), shade(col, 1.06), o);
      this.quad(p(-1, -1, -1), p(1, -1, -1), p(1, -1, 1), p(-1, -1, 1), shade(col, .80), o);
      this.quad(p(-1, -1, 1), p(1, -1, 1), p(1, 1, 1), p(-1, 1, 1), col, o);
      this.quad(p(1, -1, -1), p(-1, -1, -1), p(-1, 1, -1), p(1, 1, -1), shade(col, .88), o);
      this.quad(p(1, -1, 1), p(1, -1, -1), p(1, 1, -1), p(1, 1, 1), shade(col, .96), o);
      this.quad(p(-1, -1, -1), p(-1, -1, 1), p(-1, 1, 1), p(-1, 1, -1), shade(col, .96), o);
    },
    disc(cx, cy, cz, r, n, axis, col, o) {  // axis 0=x 1=y 2=z
      const pts = [];
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU, s = Math.sin(a) * r, c2 = Math.cos(a) * r;
        pts.push(axis === 2 ? [cx + s, cy + c2, cz] : axis === 0 ? [cx, cy + c2, cz + s] : [cx + s, cy, cz + c2]);
      }
      for (let i = 1; i < n - 1; i++) this.tri(pts[0], pts[i], pts[i + 1], col, Object.assign({ two: true }, o || {}));
    },
    done() { return { v: new Float32Array(this.v), f: this.f }; }
  };
}

/* transform + emit a mesh. M maps local->world; origin is the world position of
   the local pivot; verts are taken relative to `pivot`. */
const _mw = []; const _mv = [];
function drawMesh(mesh, origin, M, pivot, tint, alphaFade) {
  const v = mesh.v, nv = v.length / 3;
  while (_mw.length < nv * 3) { _mw.push(0); _mv.push(0); }
  const px = pivot ? pivot[0] : 0, py = pivot ? pivot[1] : 0, pz = pivot ? pivot[2] : 0;
  const cm = cam.m, cp = cam.pos;
  for (let i = 0; i < nv; i++) {
    const lx = v[i * 3] - px, ly = v[i * 3 + 1] - py, lz = v[i * 3 + 2] - pz;
    const wx = origin.x + M[0] * lx + M[3] * ly + M[6] * lz;
    const wy = origin.y + M[1] * lx + M[4] * ly + M[7] * lz;
    const wz = origin.z + M[2] * lx + M[5] * ly + M[8] * lz;
    _mw[i * 3] = wx; _mw[i * 3 + 1] = wy; _mw[i * 3 + 2] = wz;
    const dx = wx - cp.x, dy = wy - cp.y, dz = wz - cp.z;
    _mv[i * 3] = cm[0] * dx + cm[1] * dy + cm[2] * dz;
    _mv[i * 3 + 1] = cm[3] * dx + cm[4] * dy + cm[5] * dz;
    _mv[i * 3 + 2] = cm[6] * dx + cm[7] * dy + cm[8] * dz;
  }
  for (let fi = 0; fi < mesh.f.length; fi++) {
    const fc = mesh.f[fi], idx = fc.i, n = idx.length;
    let cxv = 0, cyv = 0, czv = 0, front = false, dmin = 1e9;
    for (let k = 0; k < n; k++) {
      const o = idx[k] * 3;
      _vp[k * 3] = _mv[o]; _vp[k * 3 + 1] = _mv[o + 1]; _vp[k * 3 + 2] = _mv[o + 2];
      cxv += _mv[o]; cyv += _mv[o + 1]; czv += _mv[o + 2];
      if (_mv[o + 2] >= NEAR) front = true;
      if (_mv[o + 2] < dmin) dmin = _mv[o + 2];
    }
    if (!front) continue;
    cxv /= n; cyv /= n; czv /= n;
    // world-space normal, for lighting and back-face rejection
    const a = idx[0] * 3, b = idx[1] * 3, c = idx[2] * 3;
    const e1x = _mw[b] - _mw[a], e1y = _mw[b + 1] - _mw[a + 1], e1z = _mw[b + 2] - _mw[a + 2];
    const e2x = _mw[c] - _mw[a], e2y = _mw[c + 1] - _mw[a + 1], e2z = _mw[c + 2] - _mw[a + 2];
    let nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
    const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    // view direction to the face (world space)
    const vx = (_mw[a] + _mw[b] + _mw[c]) / 3 - cam.pos.x;
    const vy = (_mw[a + 1] + _mw[b + 1] + _mw[c + 1]) / 3 - cam.pos.y;
    const vz = (_mw[a + 2] + _mw[b + 2] + _mw[c + 2]) / 3 - cam.pos.z;
    const facing = nx * vx + ny * vy + nz * vz;
    if (facing > 0) { if (!fc.two) continue; nx = -nx; ny = -ny; nz = -nz; }
    const m = clipProject(n);
    if (m < 3 || offscreen(m)) continue;
    let col = fc.c;
    if (tint) col = mixc(col, tint, .55);
    const dist = Math.hypot(cxv, cyv, czv) || 1;
    const ex = vx / dist, ey = vy / dist, ez = vz / dist;   // eye -> surface
    let c2 = litColor(col, nx, ny, nz);
    // Blinn-Phong highlight: paint and glass both catch the sun
    const sh = fc.spec;
    if (sh) {
      const hx = LIGHT.sun.x - ex, hy = LIGHT.sun.y - ey, hz = LIGHT.sun.z - ez;
      const hl = Math.hypot(hx, hy, hz) || 1;
      const sp2 = Math.pow(clamp((nx * hx + ny * hy + nz * hz) / hl, 0, 1), fc.gloss || 30) * sh;
      c2 = [c2[0] + sp2 * 235, c2[1] + sp2 * 232, c2[2] + sp2 * 215];
      // sky reflection at grazing angles gives curved metal its sheen
      const fres = Math.pow(1 - clamp(-(nx * ex + ny * ey + nz * ez), 0, 1), 4) * .30 * sh;
      c2 = [c2[0] + fres * LIGHT.mid[0], c2[1] + fres * LIGHT.mid[1], c2[2] + fres * LIGHT.mid[2]];
    }
    const alpha = (fc.alpha !== undefined ? fc.alpha : 1) * (alphaFade !== undefined ? alphaFade : 1);
    let fill;
    if (alpha < .999) {
      const f = 1 - Math.exp(-dist * LIGHT.dens);
      const cc = mixc(c2, fogCol, f);
      fill = "rgba(" + (clamp(cc[0], 0, 255) | 0) + "," + (clamp(cc[1], 0, 255) | 0) + "," +
        (clamp(cc[2], 0, 255) | 0) + "," + alpha.toFixed(3) + ")";
    } else {
      fill = aerial([clamp(c2[0], 0, 255), clamp(c2[1], 0, 255), clamp(c2[2], 0, 255)], dist, ex, ey, ez);
    }
    DL.poly(dist - (fc.bias || 0), _sp, m, fill,
      fc.edge ? aerial([clamp(c2[0] * .76, 0, 255), clamp(c2[1] * .76, 0, 255), clamp(c2[2] * .76, 0, 255)], dist, ex, ey, ez) : null,
      Math.max(1, .9 * DPR));
  }
}

/* ======================================================= aircraft model == */
const LIV = {
  skin: [30, 32, 38], top: [36, 39, 46], belly: [24, 26, 31], edge: [58, 62, 72],
  chine: [27, 29, 35], nac: [33, 35, 41], hot: [70, 66, 66],
  metal: [126, 132, 142], rubber: [30, 30, 34], glass: [96, 140, 170],
  paint: [214, 220, 228], red: [172, 44, 40]
};
const TWO = { two: true };
/* The skin is a dark, slightly blue iron ferrite black with a hard sheen —
   not matte, not chrome. High gloss keeps the highlight tight. */
const SKIN = { two: true, spec: .55, gloss: 48 };
const SPEC = { two: true, spec: .55, gloss: 26 };   // painted scenery metal
const ZSHIFT = 0;

function buildAircraft() {
  const P = {};
  /* ---- fuselage: a slender body, flattened top and bottom ---- */
  // [z, half width, half height, y centre]
  const FST = [
    [18.20, .06, .05, .00], [16.60, .34, .26, .00], [14.40, .66, .44, .00],
    [11.80, .98, .60, .03], [8.80, 1.24, .74, .06], [5.40, 1.42, .84, .08],
    [1.60, 1.48, .88, .08], [-2.40, 1.44, .86, .06], [-6.40, 1.26, .76, .03],
    [-10.00, .98, .60, .00], [-12.60, .68, .42, -.03], [-14.10, .40, .26, -.05]
  ];
  const NF = 12;
  // a flattened section: |cos|^0.7 keeps the top and bottom broad and the
  // sides tucked, which is what gives the real thing its slab-sided look
  const fpt = (st, k) => {
    const a = k / NF * TAU, sa = Math.sin(a), ca = Math.cos(a);
    const fx = Math.sign(sa) * Math.pow(Math.abs(sa), .78);
    const fy = Math.sign(ca) * Math.pow(Math.abs(ca), .70);
    return [st[1] * fx, st[3] + st[2] * fy, st[0]];
  };
  {
    const mb = MB();
    for (let i = 0; i < FST.length - 1; i++) {
      for (let k = 0; k < NF; k++) {
        const a = k / NF * TAU, up = Math.cos(a);
        let col = up > .5 ? LIV.top : up < -.5 ? LIV.belly : LIV.skin;
        if (FST[i][0] > 15.5) col = mixc(col, [14, 15, 18], .6);   // radome
        mb.quad(fpt(FST[i], k), fpt(FST[i], k + 1), fpt(FST[i + 1], k + 1), fpt(FST[i + 1], k), col, SKIN);
      }
    }
    P.fuse = mb.done();
  }
  /* ---- chines: the blade that runs the whole length and blends into the wing ---- */
  {
    const mb = MB();
    // [z, chine half width, y]
    const CH = [
      [17.60, .16, .00], [15.20, .95, .00], [12.40, 1.75, .02], [9.20, 2.55, .05],
      [5.40, 3.15, .07], [1.60, 3.55, .07], [-2.40, 3.72, .05]
    ];
    const wOf = z => {   // fuselage half width at this station
      for (let i = 0; i < FST.length - 1; i++)
        if (z <= FST[i][0] && z >= FST[i + 1][0]) {
          const t = (FST[i][0] - z) / (FST[i][0] - FST[i + 1][0]);
          return [lerp(FST[i][1], FST[i + 1][1], t), lerp(FST[i][3], FST[i + 1][3], t)];
        }
      return [FST[FST.length - 1][1], FST[FST.length - 1][3]];
    };
    for (let i = 0; i < CH.length - 1; i++) {
      const a = CH[i], b = CH[i + 1];
      const fa = wOf(a[0]), fb = wOf(b[0]);
      for (const sx of [1, -1]) {
        const t = .10;
        // top and bottom of the blade, and its knife edge
        mb.quad([sx * fa[0], fa[1] + a[2], a[0]], [sx * a[1], a[2] + t, a[0]],
          [sx * b[1], b[2] + t, b[0]], [sx * fb[0], fb[1] + b[2], b[0]], LIV.chine, SKIN);
        mb.quad([sx * fa[0], fa[1] + a[2] - .1, a[0]], [sx * fb[0], fb[1] + b[2] - .1, b[0]],
          [sx * b[1], b[2] - t, b[0]], [sx * a[1], a[2] - t, a[0]], shade(LIV.belly, .92), SKIN);
        mb.quad([sx * a[1], a[2] + t, a[0]], [sx * a[1], a[2] - t, a[0]],
          [sx * b[1], b[2] - t, b[0]], [sx * b[1], b[2] + t, b[0]], LIV.edge, SKIN);
      }
    }
    P.chine = mb.done();
  }
  /* ---- delta wing ---- */
  // planform, right side: leading edge from the chine out to the tip
  const WLE = [[3.72, -2.40], [8.42, -9.30]];        // [x, z]
  const WTE = [[8.42, -11.30], [3.30, -14.05]];
  function wingEdge(t) {   // t 0 at root, 1 at tip
    const xl = lerp(WLE[0][0], WLE[1][0], t), zl = lerp(WLE[0][1], WLE[1][1], t);
    const xt = lerp(WTE[1][0], WTE[0][0], t), zt = lerp(WTE[1][1], WTE[0][1], t);
    const th = lerp(.30, .10, t);
    return { xl, zl, xt, zt, th, chord: zl - zt };
  }
  for (const side of [1, -1]) {
    const mb = MB();
    const N = 5;
    const sect = t => {
      const w = wingEdge(t);
      const x = side * lerp(w.xl, w.xt, 0);
      // a symmetric thin section: LE, upper, TE, lower
      const zle = w.zl, zte = w.zl - w.chord * .72;   // fixed part; elevons take the rest
      return [[side * w.xl, .02, zle], [side * lerp(w.xl, w.xt, .35), w.th, lerp(zle, zte, .38)],
              [side * w.xt, .02, zte], [side * lerp(w.xl, w.xt, .35), -w.th * .75, lerp(zle, zte, .38)]];
    };
    let prev = sect(0);
    for (let i = 1; i <= N; i++) {
      const cur = sect(i / N);
      for (let k = 0; k < 4; k++) {
        const k2 = (k + 1) % 4;
        const up = k === 0 || k === 1;
        mb.quad(prev[k], prev[k2], cur[k2], cur[k], up ? LIV.top : LIV.belly, SKIN);
      }
      prev = cur;
    }
    mb.quad(prev[0], prev[1], prev[2], prev[3], LIV.edge, SKIN);   // tip cap
    P[side > 0 ? "wingR" : "wingL"] = mb.done();

    // elevons: the whole trailing edge, split inboard and outboard
    const mkElevon = (t0, t1) => {
      const mb2 = MB(), a = wingEdge(t0), b = wingEdge(t1);
      const za = a.zl - a.chord * .72, zb = b.zl - b.chord * .72;
      const ca = a.chord * .28, cb = b.chord * .28;
      const xa = side * lerp(a.xl, a.xt, .72), xb = side * lerp(b.xl, b.xt, .72);
      const th = .055;
      mb2.quad([xa, th, za], [xb, th, zb], [xb, th * .3, zb - cb], [xa, th * .3, za - ca], mixc(LIV.top, LIV.edge, .2), SKIN);
      mb2.quad([xa, -th, za], [xa, -th * .3, za - ca], [xb, -th * .3, zb - cb], [xb, -th, zb], shade(LIV.belly, .95), SKIN);
      mb2.quad([xa, th, za], [xa, -th, za], [xb, -th, zb], [xb, th, zb], LIV.edge, TWO);
      return { mesh: mb2.done(), pivot: [0, 0, (za + zb) / 2] };
    };
    P[side > 0 ? "elevOutR" : "elevOutL"] = mkElevon(.54, .97);
    P[side > 0 ? "elevInR" : "elevInL"] = mkElevon(.10, .50);
  }
  /* ---- engine nacelles with inlet spikes ---- */
  const NACX = 4.62;
  for (const side of [1, -1]) {
    const mb = MB();
    const NN = 12, r = .98;
    // [z, radius] — spike, inlet lip, body, nozzle
    const NS = [[7.60, .10], [6.40, .52], [5.30, .95], [2.00, 1.00], [-3.00, 1.00],
                [-6.60, .95], [-8.10, .80], [-8.60, .74]];
    const npt = (st, k) => {
      const a = k / NN * TAU;
      return [side * NACX + st[1] * Math.sin(a), -.06 + st[1] * Math.cos(a), st[0]];
    };
    for (let i = 0; i < NS.length - 1; i++) {
      for (let k = 0; k < NN; k++) {
        const a = k / NN * TAU, up = Math.cos(a);
        let col = NS[i][0] > 5.2 ? [20, 21, 25] : up > .4 ? LIV.top : LIV.nac;
        if (NS[i][0] < -6.0) col = mixc(LIV.hot, [92, 84, 80], .4);   // scorched nozzle
        mb.quad(npt(NS[i], k), npt(NS[i], k + 1), npt(NS[i + 1], k + 1), npt(NS[i + 1], k), col, SKIN);
      }
    }
    // inlet lip ring and the dark duct behind it
    mb.disc(side * NACX, -.06, 5.28, .80, NN, 2, [10, 11, 13], { two: true, bias: -1 });
    mb.disc(side * NACX, -.06, -8.62, .70, NN, 2, [14, 12, 12], { two: true, bias: -1 });
    P[side > 0 ? "nacR" : "nacL"] = mb.done();

    // canted vertical fin on top of each nacelle
    const mb2 = MB();
    const cant = side * 15 * DEG, hgt = 3.15;
    const fp = (up, zz) => [side * NACX + Math.sin(-cant) * up * hgt, .86 + Math.cos(cant) * up * hgt, zz];
    const prof = [[0, -1.30], [0, -5.40], [1, -4.70], [1, -2.90]];
    for (const t of [.08, -.08]) {
      for (let k = 1; k < prof.length - 1; k++) {
        const a = fp(prof[0][0], prof[0][1]), b = fp(prof[k][0], prof[k][1]), c = fp(prof[k + 1][0], prof[k + 1][1]);
        mb2.tri([a[0] + t, a[1], a[2]], [b[0] + t, b[1], b[2]], [c[0] + t, c[1], c[2]], LIV.skin, SKIN);
      }
    }
    for (let k = 0; k < prof.length; k++) {
      const a = fp(prof[k][0], prof[k][1]), b = fp(prof[(k + 1) % prof.length][0], prof[(k + 1) % prof.length][1]);
      mb2.quad([a[0] - .08, a[1], a[2]], [a[0] + .08, a[1], a[2]], [b[0] + .08, b[1], b[2]], [b[0] - .08, b[1], b[2]], LIV.edge, SKIN);
    }
    P[side > 0 ? "finR" : "finL"] = { mesh: mb2.done(), pivot: [side * NACX, .86, -3.4] };
  }
  /* ---- cockpit: two small windows well forward ---- */
  {
    const mb = MB();
    const st = [[12.60, .30, .12], [11.40, .56, .34], [10.00, .62, .40], [8.60, .58, .34], [7.40, .44, .14]];
    const N = 6, base = .70;
    const pt = (sq, k) => { const a = -Math.PI / 2 + k / N * Math.PI; return [sq[1] * Math.sin(a), base + sq[2] * Math.cos(a), sq[0]]; };
    for (let i = 0; i < st.length - 1; i++)
      for (let k = 0; k < N; k++)
        mb.quad(pt(st[i], k), pt(st[i], k + 1), pt(st[i + 1], k + 1), pt(st[i + 1], k),
          i === 1 || i === 2 ? LIV.glass : [18, 19, 22], i === 1 || i === 2
            ? { two: true, spec: 1.1, gloss: 70, alpha: .55 } : SKIN);
    P.glass = mb.done();
  }
  /* ---- what the pilot sees over the coaming ---- */
  {
    const mb = MB();
    const st = [[9.40, 1.28, .78, .06], [11.80, .98, .60, .03], [14.40, .66, .44, .00],
                [16.60, .34, .26, .00], [18.20, .06, .05, .00]];
    for (let i = 0; i < st.length - 1; i++)
      for (let k = 0; k < NF; k++) {
        const a = k / NF * TAU, up = Math.cos(a);
        const col = up > .55 ? [30, 32, 37] : up > .05 ? mixc(LIV.top, [34, 36, 42], .5) : LIV.skin;
        mb.quad(fpt(st[i], k), fpt(st[i], k + 1), fpt(st[i + 1], k + 1), fpt(st[i + 1], k), col, SKIN);
      }
    mb.box(0, .88, 10.10, .24, .05, .26, [130, 170, 190], { two: true, alpha: .30 });
    P.cowl = mb.done();
  }
  /* ---- landing gear ---- */
  function leg(len, wheelR, pairs, col) {
    const mb = MB();
    mb.box(0, -len * .5, 0, .16, len, .20, LIV.metal, TWO);
    mb.box(0, -len * .84, 0, .30, .26, .30, shade(LIV.metal, .85), TWO);
    const off = pairs === 3 ? [-.34, 0, .34] : [-.20, .20];
    for (const sx of off) {
      mb.disc(sx, -len - wheelR * .12, 0, wheelR, 10, 0, LIV.rubber, TWO);
      mb.disc(sx + .001, -len - wheelR * .12, 0, wheelR * .45, 8, 0, shade(LIV.metal, .7), TWO);
    }
    mb.box(0, -len - wheelR * .12, 0, pairs === 3 ? .9 : .55, wheelR * 1.1, wheelR * 1.1, shade(LIV.rubber, 1.1), TWO);
    return mb.done();
  }
  P.gearL = { mesh: leg(1.30, .52, 3), pivot: [-3.30, -1.02, -3.00] };
  P.gearR = { mesh: leg(1.30, .52, 3), pivot: [3.30, -1.02, -3.00] };
  P.gearN = { mesh: leg(1.425, .46, 2), pivot: [0, -.96, 10.50] };
  for (const k of ["gearL", "gearR", "gearN"]) {
    const g = P[k], q = g.pivot, v = g.mesh.v;
    for (let i = 0; i < v.length; i += 3) { v[i] += q[0]; v[i + 1] += q[1]; v[i + 2] += q[2]; }
  }
  /* ---- markings: the only paint on an otherwise black aeroplane ---- */
  {
    const mb = MB();
    for (const side of [1, -1]) {
      const cant = side * 15 * DEG;
      const fp = (up, zz, t) => [side * NACX + Math.sin(-cant) * up * 3.15 + t, .86 + Math.cos(cant) * up * 3.15, zz];
      for (const t of [.10, -.10])
        mb.quad(fp(.62, -3.30, t), fp(.62, -4.50, t), fp(.86, -4.30, t), fp(.86, -3.35, t), LIV.paint, { two: true, bias: -.4 });
    }
    P.marks = mb.done();
  }
  /* ---- drag chute ---- */
  {
    const mb = MB(), N = 12, R = 3.4;
    for (let i = 0; i < N; i++) {
      const a0 = i / N * TAU, a1 = (i + 1) / N * TAU;
      const p = (a, r, z) => [Math.sin(a) * r, Math.cos(a) * r, z];
      const col = i % 2 ? [226, 108, 52] : [238, 238, 234];
      mb.tri([0, 0, -24.5], p(a0, R, -22.0), p(a1, R, -22.0), col, TWO);
      mb.quad(p(a0, R, -22.0), p(a1, R, -22.0), p(a1, R * .82, -20.6), p(a0, R * .82, -20.6), shade(col, .85), TWO);
    }
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      mb.quad([Math.sin(a) * R * .8, Math.cos(a) * R * .8, -20.6], [Math.sin(a) * R * .8 + .05, Math.cos(a) * R * .8, -20.6],
        [.05, 0, -14.4], [0, 0, -14.4], [210, 206, 196], TWO);
    }
    P.chute = mb.done();
  }
  return P;
}

const E = WORLD.fieldElev;
function buildAirport() {
  const mb = MB();

    let c = shade(asph, 1 + (hash2(i, 7) - .5) * .09);

  for (let z = -L / 2 + 40; z < L / 2 - 40; z += 50) mark(-.7, z, .7, z + 30);

/* scattered trees, drawn as depth-sorted billboards */
function drawTrees() {
  const cell = 86, rad = Q.q.treeR, dens = Q.q.trees;
  const gx = Math.round(cam.pos.x / cell), gz = Math.round(cam.pos.z / cell);
  const n = Math.ceil(rad / cell);
  // which way is the sun on screen? the lit half of each canopy goes that side
  const right = v3(cam.m[0], cam.m[1], cam.m[2]);
  const sunSide = vdot(right, LIGHT.sun) >= 0 ? 1 : -1;
  for (let j = -n; j <= n; j++) {
    for (let i = -n; i <= n; i++) {
      const h1 = hash2((gx + i) * 31 + 7, (gz + j) * 17 + 3);
      if (h1 > dens) continue;
      const x = (gx + i) * cell + (hash2(gx + i, gz + j) - .5) * cell * .9;
      const z = (gz + j) * cell + (hash2(gz + j, gx + i) - .5) * cell * .9;
      const dx = x - cam.pos.x, dz = z - cam.pos.z;
      if (dx * dx + dz * dz > rad * rad) continue;
      const gy = terrainH(x, z);
      if (gy < 2 || gy > 820) continue;
      if (Math.abs(x) < 320 && Math.abs(z) < WORLD.rwyLen * .6) continue;   // keep the field clear
      const hgt = 5.5 + (h1 / dens) * (h1 / dens) * 15;
      const base = projectPoint(v3(x, gy, z));
      if (!base) continue;
      const top = projectPoint(v3(x, gy + hgt, z));
      if (!top) continue;
      const w = Math.abs(base.y - top.y) * .40;
      if (w < .6) continue;
      if (base.x < -w * 2 || base.x > W + w * 2) continue;
      const dist = base.z;
      const dy = gy + hgt * .5 - cam.pos.y, d3 = Math.hypot(dx, dy, dz) || 1;
      const ex = dx / d3, ey = dy / d3, ez = dz / d3;
      // species variation, then light the two halves of the canopy differently
      const tone = hash2((gx + i) * 5, (gz + j) * 11);
      const leaf = mixc([46, 78, 44], [74, 96, 52], tone);
      const litc = litColor(leaf, sunSide * .55, .72, 0);
      const shc = litColor(leaf, -sunSide * .55, .34, 0);
      const fillL = aerial(litc, dist, ex, ey, ez), fillS = aerial(shc, dist, ex, ey, ez);
      const trunkW = Math.max(.9, w * .17);
      const ty = top.y * .34 + base.y * .66;
      DL.poly(dist + .6, [base.x - trunkW, base.y, base.x + trunkW, base.y,
        base.x + trunkW * .5, ty, base.x - trunkW * .5, ty], 4,
        aerial(litColor([58, 45, 34], 0, .3, 0), dist, ex, ey, ez), null, 0);
      const mid = base.y - (base.y - top.y) * .24;
      // shaded half
      DL.poly(dist, [top.x, top.y, base.x - sunSide * w, mid,
        base.x - sunSide * w * .52, base.y, base.x, base.y], 4, fillS, null, 0);
      // sunlit half
      DL.poly(dist - .05, [top.x, top.y, base.x + sunSide * w, mid,
        base.x + sunSide * w * .52, base.y, base.x, base.y], 4, fillL, null, 0);
    }
  }
}

/* The aircraft's own shadow, cast along the sun onto the ground beneath it.
   Nothing sells altitude like this on takeoff and landing. */
const SHADOW_HULL = [
  v3(0, 0, 18.2), v3(1.7, 0, 12.4), v3(3.2, 0, 5.4), v3(3.7, 0, -2.4), v3(8.4, 0, -9.3),

function drawShadow() {
  if (!Q.q.shadow) return;
  const P = PLANE, sun = LIGHT.sun;
  const gh = groundH(P.pos.x, P.pos.z);

  if (agl > 1400 || agl < -2) return;
  const fade = (1 - sstep(150, 1400, agl)) * .46 + .04;
  const N = SHADOW_HULL.length;
  let cxs = 0, cys = 0, ok = true, dmin = 1e9;

  // soften the edge as the aircraft climbs away from the ground
  grow(N, clamp(agl * .02, .5, 8) * DPR);

/* ---------------------------------------------------------- atmosphere -- */
/* A proper standard atmosphere: at 24 km the exponential approximation is out
   by enough to matter, and Mach number drives the whole flight envelope here. */
function isa(h) {
  h = clamp(h, -500, 47000);
  let T, p;
  if (h < 11000) { T = 288.15 - .0065 * h; p = 101325 * Math.pow(T / 288.15, 5.2559); }
  else if (h < 20000) { T = 216.65; p = 22632 * Math.exp(-9.80665 * (h - 11000) / (287.05 * 216.65)); }
  else if (h < 32000) { T = 216.65 + .001 * (h - 20000); p = 5474.9 * Math.pow(T / 216.65, -34.163); }
  else { T = 228.65 + .0028 * (h - 32000); p = 868.02 * Math.pow(T / 228.65, -12.201); }
  return { rho: p / (287.05 * T), a: 20.046 * Math.sqrt(T), T, p };
}
const rhoAt = y => isa(y).rho;

  Cnb: .090, Cndr: .062, Cnr: .170,
  Cla: .040, Clp: .400, Clb: .030,

  thrustMil: 100000, thrustAB: 190000,
  wheels: [

    { p: v3(3.30, -2.90, -3.00), brake: 1, steer: 0, grip: 1 },

/* Zero-lift drag against Mach: the transonic hump, then the thin-wing
   supersonic floor that lets it cruise at three times the speed of sound. */
function cd0OfMach(M) {
  return .0165 + .040 * Math.exp(-Math.pow((M - 1.06) / .30, 2)) + .012 * sstep(0, .35, .35 - M);
}
/* Lift-curve slope: slender-delta value subsonic, 4/sqrt(M^2-1) supersonic. */
function claOfMach(M) {
  const suP = 4 / Math.sqrt(Math.max(M * M - 1, .30));
  return lerp(SPECS.CLa, Math.min(suP, 4.6), sstep(.82, 1.25, M));

/* The autopilot. It rides on top of the one flight model: the stick commands
   bank angle and pitch attitude instead of control-surface deflection, the
   rudder coordinates itself, angle of attack is limited, and with hands off it
   holds the altitude and heading it had when you let go. */
function assist(P, dt, e) {

  if (!hands && !P.onGround) {

    let he = P.apHdg - e.hdg;

  let pitchTgt = P.inE * 26 * DEG + (lvl - 1) * 7 * DEG;

    const ae = clamp((P.apAlt - P.pos.y) * .012, -12 * DEG, 12 * DEG);
    pitchTgt = clamp(ae - P.vel.y * .035, -14 * DEG, 18 * DEG) + (lvl - 1) * 7 * DEG;
  } else P.apAlt = undefined;
  const pitchErr = pitchTgt - e.pitch;
  P.pitchI = clamp((P.pitchI || 0) + pitchErr * dt * 1.2, -.55, .55);
  P.dE = clamp(pitchErr * 2.8 + P.pitchI + P.w.x * .55, -1, 1);

  // hard angle-of-attack limiter: a delta will keep flying far past where it
  // should, and the drag that comes with it is what actually kills you
  const amax = 18 * DEG;
  P.aoaCap = P.alpha > amax && P.dE > 0;
  if (P.aoaCap) P.dE = clamp(P.dE - (P.alpha - amax) * 22, -1, .05);

  if (P.onGround) {
    if (Math.abs(P.inA) > .05 || P.holdHdg === undefined) P.holdHdg = e.hdg;
    let err = P.holdHdg - e.hdg;
    if (err > Math.PI) err -= TAU; else if (err < -Math.PI) err += TAU;
    P.dR = clamp(P.inA * .9 + err * 2.4 - P.w.y * .9, -1, 1);
  } else {
    P.holdHdg = undefined;
    P.dR = clamp(P.beta * 4.5 - P.w.y * .45, -1, 1);
  }
  P.trim = 0;
}

function physics(P, dt) {
  const m = P.m;
  const e = eulerOf(m);
  // --- control surface response ------------------------------------------
  if (AP.on) assist(P, dt, e);
  else {
    P.dE = approach(P.dE, P.inE, 9, dt);
    P.dA = approach(P.dA, P.inA, 11, dt);
    P.dR = approach(P.dR, P.inR, 9, dt);
  }
  // Flaps blow back above their placard speed, and the chute is torn away if
  // you stream it too fast.
  const kias = P.ias * 1.94384;
  if (kias > FLAP_LIMIT && P.flapCmd > 0) {
    P.flapCmd = 0;
    if (P.flapWarn === undefined || GAME.t - P.flapWarn > 4) { P.flapWarn = GAME.t; toast("FLAPS BLOWN BACK \u00b7 OVER " + FLAP_LIMIT + " KT", 2.2); }
  }
  P.flap = approach(P.flap, P.flapCmd, .9, dt);
  if (P.chuteCmd && kias > CHUTE_LIMIT) { P.chuteCmd = 0; toast("CHUTE TORN AWAY \u00b7 OVER " + CHUTE_LIMIT + " KT", 2.2); }
  if (!P.onGround && P.chute > 0 && P.tas < 30) P.chuteCmd = 0;   // cut it when stopped
  P.chute = approach(P.chute, P.chuteCmd, 2.6, dt);
  P.gear = clamp(P.gear + (P.gearCmd - P.gear > 0 ? dt / 3.2 : -dt / 3.2), 0, 1);
  if (Math.abs(P.gearCmd - P.gear) < .02) P.gear = P.gearCmd;

  // --- engine -------------------------------------------------------------
  const thrCmd = P.crashed ? 0 : P.thr;
  P.rpm = approach(P.rpm, .035 + thrCmd * .965, 1.5, dt);
  const air = isa(P.pos.y);
  const rho = air.rho;
  const wind = WIND.at(P.pos, P);
  const va = vsub(P.vel, wind);
  const vb = mRotT(m, va);
  const V = vlen(vb);
  P.tas = V;
  P.mach = V / air.a;
  P.ias = V * Math.sqrt(rho / 1.225);
  // Afterburner lives in the top fifth of the throttle and is what the gate
  // between "fast aeroplane" and "Mach 3" actually is.
  P.ab = clamp((thrCmd - AB_GATE) / (1 - AB_GATE), 0, 1);
  const abSm = approach(P.abSm === undefined ? 0 : P.abSm, P.ab, 3.5, dt);
  P.abSm = abSm;
  // Ram compression: these inlets make more thrust the faster they go, right
  // up to design Mach, then fall away.
  const ram = 1 + 2.0 * sstep(.4, 3.05, P.mach) - 1.3 * sstep(3.2, 4.0, P.mach);
  const dens = Math.pow(clamp(rho / 1.225, .0005, 1), .62);
  const perEngine = SPECS.thrustMil * clamp(P.rpm, 0, 1) + SPECS.thrustAB * abSm;
  const thrust = 2 * perEngine * ram * dens;

  let F = v3(0, -SPECS.mass * 9.81, 0);      // world-frame accumulator
  let M = v3();                              // body-frame torque

  if (V > .6) {
    const vd = vmul(vb, 1 / V);
    const slow = clamp((V - 3) / 6, 0, 1);   // the angles are meaningless at a standstill
    P.alpha = clamp(Math.atan2(-vd.y, vd.z), -1.4, 1.4) * slow;
    P.beta = Math.asin(clamp(vd.x, -1, 1)) * slow;
    const qbar = .5 * rho * V * V, qS = qbar * SPECS.S;
    P.qbar = qbar;
    const M8 = P.mach;
    // A slender delta does not stall the way a straight wing does: the leading
    // edge sheds a vortex that keeps adding lift far past where a wing would
    // let go, so the break is late and soft.
    const aStall = (27 + P.flap * 2) * DEG;
    let st = 1 - sstep(aStall, aStall + 12 * DEG, Math.abs(P.alpha));
    if (AP.on) st = Math.max(st, .55);
    const sa = Math.sin(P.alpha);
    const vortex = 1.55 * sa * sa * Math.cos(P.alpha) * Math.sign(P.alpha);
    const CLlin = SPECS.CL0 + claOfMach(M8) * P.alpha + vortex + .35 * P.flap;
    const CLstall = 1.15 * Math.sin(2 * P.alpha);
    const CL = lerp(CLstall, CLlin, st);
    P.stall = approach(P.stall, 1 - st, 6, dt);
    // Flaps are mostly drag: full flap roughly triples the zero-lift drag,
    // which is what makes them work as a speed brake on approach. The chute
    // adds an area of its own once it is out.
    const CD = cd0OfMach(M8) + SPECS.k * CL * CL + .030 * P.gear
      + (.055 * P.flap + .105 * P.flap * P.flap) + (1 - st) * .12
      + 1.05 * P.chute * (P.onGround ? 1 : .8);
    const L = qS * CL, D = qS * CD, Y = -qS * .90 * P.beta;
    // lift acts perpendicular to the relative wind, in the plane of symmetry
    const liftDir = vnorm(vcross(vd, v3(1, 0, 0)));
    const fb = vadd(vadd(vmul(liftDir, L), vmul(vd, -D)), v3(Y, 0, 0));
    fb.z += thrust;
    F = vadd(F, mRot(m, fb));
    P.gload = L / (SPECS.mass * 9.81);
    // moments
    const cq = .5 * rho * V * SPECS.S;
    const dET = clamp(P.dE + P.trim, -1.3, 1.3);
    // control power falls away supersonically as the shock moves aft
    const ctlM = lerp(1, .55, sstep(1.0, 2.2, M8));
    M.x = qS * SPECS.cbar * (SPECS.CmA * P.alpha - SPECS.CmE * ctlM * dET + .070 * P.flap) - cq * SPECS.cbar * SPECS.cbar * SPECS.CmQ * P.w.x;
    M.y = qS * SPECS.b * (SPECS.Cnb * P.beta + SPECS.Cndr * ctlM * P.dR - .020 * P.dA) - cq * SPECS.b * SPECS.b * SPECS.Cnr * P.w.y;
    M.z = qS * SPECS.b * (-SPECS.Cla * ctlM * P.dA + SPECS.Clb * P.beta) - cq * SPECS.b * SPECS.b * SPECS.Clp * P.w.z;
    if (1 - st > .05) {   // asymmetric stall: wing drop and buffet
      const drop = (1 - st) * (hash2((P.pos.x * 3) | 0, (P.pos.z * 3) | 0) - .5);
      M.z += drop * 260000;
      M.x += (1 - st) * 150000;      // nose drops
      cam.shake = Math.max(cam.shake, (1 - st) * .5);
    }
  } else {
    P.alpha = 0; P.beta = 0; P.gload = 0; P.stall = 0;
    F = vadd(F, mRot(m, v3(0, 0, thrust)));
  }
  if (!AP.on && V > 40) {
    // an inlet unstart: one duct loses its shock and yaws the aircraft hard.
    // Only ever at high Mach and high angle of attack, as in the real thing.
    const risk = sstep(2.4, 3.2, P.mach) * sstep(6 * DEG, 13 * DEG, Math.abs(P.alpha) + Math.abs(P.beta));
    if (risk > .01 && Math.random() < risk * dt * .45) P.unstart = .9 + Math.random() * .8;
    if (P.unstart > 0) {
      P.unstart -= dt;
      const sgn = P.unstartSide || (P.unstartSide = Math.random() < .5 ? -1 : 1);
      M.y += sgn * 2.4e6 * clamp(P.unstart, 0, 1);
      M.z += sgn * 6.0e5 * clamp(P.unstart, 0, 1);
      cam.shake = Math.max(cam.shake, 1.1);
      if (P.unstart <= 0) P.unstartSide = 0;
    }
  }

  // --- ground contact ------------------------------------------------------
  let wow = 0, maxFn = 0;
  if (P.pos.y - groundH(P.pos.x, P.pos.z) < 6) {
    const wOmega = mRot(m, P.w);
    for (const wh of SPECS.wheels) {
      const legDrop = (1 - P.gear) * .95;   // retracted wheels sit inside the airframe
      const wl = v3(wh.p.x, wh.p.y + legDrop, wh.p.z);
      const rw = mRot(m, wl);
      const wp = vadd(P.pos, rw);
      const gh = groundH(wp.x, wp.z);
      const pen = gh - wp.y;
      if (pen <= 0) continue;
      wow++;
      const flat = onRunway(wp.x, wp.z);
      const n = flat ? v3(0, 1, 0) : terrainN(wp.x, wp.z, 4);
      const vp = vadd(P.vel, vcross(wOmega, rw));
      const vn = vdot(vp, n);
      let Fn = clamp(pen * SPECS.gearK - vn * SPECS.gearC, 0, SPECS.mass * 9.81 * 5);
      maxFn = Math.max(maxFn, Fn);
      let Fw = vmul(n, Fn);
      // rolling / lateral friction in the wheel's own frame
      let fwd = mRot(m, v3(0, 0, 1));
      if (wh.steer) {
        // with the autopilot in, dR already carries both the pilot's steering
        // and the auto-coordination that keeps the roll straight
        const st = P.dR * (AP.on ? .6 : 1) * 22 * DEG * clamp(1 - V / 55, .25, 1);
        fwd = mRot(m, v3(Math.sin(st), 0, Math.cos(st)));
      }
      fwd = vnorm(vsub(fwd, vmul(n, vdot(fwd, n))));
      const side = vnorm(vcross(n, fwd));
      const vs = vdot(vp, side), vf = vdot(vp, fwd);
      // nose-wheel grip fades with speed; a hard-gripping wheel ahead of the
      // centre of gravity is directionally unstable and ground-loops the aircraft
      const grip = wh.grip || lerp(.75, .16, clamp(V / 26, 0, 1));
      const muS = (flat ? 1.00 : .74) * grip;
      Fw = vadd(Fw, vmul(side, clamp(-vs * 3200 * grip, -muS * Fn, muS * Fn)));
      const bk = P.brake * wh.brake;
      // Static friction at a crawl. Without it the idle thrust always wins
      // against rolling resistance and the aircraft creeps along the runway
      // for ever instead of coming to a stop.
      const stick = (1 - sstep(0, 2.2, Math.abs(vf))) * .14;
      const roll = (flat ? .016 : .070) + bk * 1.05 + stick;
      Fw = vadd(Fw, vmul(fwd, clamp(-vf * 26000, -roll * Fn, roll * Fn)));
      F = vadd(F, Fw);
      M = vadd(M, mRotT(m, vcross(rw, Fw)));
      if (Fn > 4000 && V > 6 && Math.random() < .25) spawnDust(wp, vmul(vp, -.1));
    }
    // structural contact = crash
    if (!P.crashed) {
      for (const hp of SPECS.hard) {
        const wp = vadd(P.pos, mRot(m, hp));
        if (wp.y < groundH(wp.x, wp.z) - .05) { crash("STRUCTURAL CONTACT"); break; }
      }
      const vsLim = AP.on ? 9.0 : 5.6;
      if (wow && P.lastVS < -vsLim && !P.touched) crash("HARD LANDING");
      if (maxFn > SPECS.mass * 9.81 * (AP.on ? 6.5 : 4.6)) crash("GEAR COLLAPSE");
      if (wow && !P.gear) crash("GEAR UP LANDING");
    }
  }
  P.wow = wow;
  if (wow && !P.onGround) { P.touched = 1.2; P.hardLand = -P.lastVS; }
  P.onGround = wow > 0;
  if (P.touched > 0) P.touched = Math.max(0, P.touched - dt);
  if (!wow) P.lastVS = P.vel.y;

  // --- integrate -----------------------------------------------------------
  if (P.crashed) {
    F = v3(0, -SPECS.mass * 9.81, 0);
    if (P.pos.y <= groundH(P.pos.x, P.pos.z) + 1.0) {
      P.vel = vmul(P.vel, Math.exp(-6 * dt));
      P.w = vmul(P.w, Math.exp(-5 * dt));
      F = v3();
    }
  }
  const acc = vmul(F, 1 / SPECS.mass);
  P.vel = vadd(P.vel, vmul(acc, dt));
  P.pos = vadd(P.pos, vmul(P.vel, dt));
  P.w = v3(P.w.x + M.x / SPECS.Ipitch * dt, P.w.y + M.y / SPECS.Iyaw * dt, P.w.z + M.z / SPECS.Iroll * dt);
  const wcap = 3.2;
  P.w = v3(clamp(P.w.x, -wcap, wcap), clamp(P.w.y, -wcap, wcap), clamp(P.w.z, -wcap, wcap));
  P.q = qIntegrate(P.q, P.w, dt);
  qMat(P.q, P.m);
  P.propAng += P.rpm * 145 * dt;
  P.vsi = P.vel.y;
  P.dist += vlen(P.vel) * dt;
  // Dynamic pressure is the real limit low down: this airframe is built for
  // thin air, and holding Mach 3 at low level tears it apart.
  if (!P.crashed && P.qbar > 125000) {
    P.overQ = (P.overQ || 0) + dt;
    cam.shake = Math.max(cam.shake, clamp(P.overQ * .5, 0, 1.4));
    if (P.overQ > 4) crash("OVERSTRESS");
  } else P.overQ = Math.max(0, (P.overQ || 0) - dt * .6);
  // never let the aircraft sink through the world
  const gh = groundH(P.pos.x, P.pos.z);
  if (P.pos.y < gh + 1.2) { P.pos.y = gh + 1.2; if (P.vel.y < 0) P.vel.y *= -.05; }
}

/* wind & turbulence */
const WIND = {
  base: v3(3.2, 0, -1.6), t: 0,
  at(pos, P) {
    const g = Math.sin(this.t * .7) * .5 + Math.sin(this.t * 1.9 + 1.3) * .3;
    const alt = clamp(pos.y / 1200, 0, 1);
    const turb = (1 - alt) * .9 + .15;
    return v3(
      this.base.x * (1 + g * .5) * (.6 + alt) + Math.sin(this.t * 3.1 + pos.x * .01) * turb,
      Math.sin(this.t * 2.6 + pos.z * .013) * turb * .8,
      this.base.z * (1 + g * .5) * (.6 + alt) + Math.cos(this.t * 2.3 + pos.z * .011) * turb);
  }
};

/* ======================================================== particles ====== */
const PARTS = [];
function addPart(p, v, r, life, col, grow, kind) {
  if (PARTS.length > 420) PARTS.shift();
  PARTS.push({ p: v3(p.x, p.y, p.z), v: v3(v.x, v.y, v.z), r, t: 0, life, col, grow: grow || 1.6, kind: kind || 0 });
}
function spawnDust(p, v) {
  addPart(p, v3(v.x + (Math.random() - .5) * 3, 1 + Math.random() * 2, v.z + (Math.random() - .5) * 3),
    .6, .9 + Math.random() * .7, [196, 188, 170], 5.5);
}
function spawnSmoke(p, v) {
  addPart(p, v3(v.x * .2 + (Math.random() - .5) * 2, 2 + Math.random() * 3, v.z * .2 + (Math.random() - .5) * 2),
    1.2, 2.4, [58, 58, 62], 7);
}
function spawnFire(p) {
  addPart(p, v3((Math.random() - .5) * 9, 5 + Math.random() * 9, (Math.random() - .5) * 9),
    1.6, .5 + Math.random() * .5, [255, 178, 60], 6, 1);
}
function updateParts(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const q = PARTS[i];
    q.t += dt;
    if (q.t >= q.life) { PARTS.splice(i, 1); continue; }
    q.p = vadd(q.p, vmul(q.v, dt));
    q.v = vmul(q.v, Math.exp(-1.6 * dt));
    if (q.kind === 1) q.v.y += 18 * dt; else q.v.y += 1.2 * dt;
  }
}
function drawParts() {
  for (const q of PARTS) {
    const sp = projectPoint(q.p);
    if (!sp) continue;
    const f = q.t / q.life;
    const r = (q.r + q.grow * q.t) * sp.s;
    if (r < .6) continue;
    const a = (1 - f) * (q.kind === 1 ? .9 : .55);
    const col = q.kind === 1 ? mixc([255, 226, 140], [220, 70, 30], f) : q.col;
    DL.sprite(sp.z, sp.x, sp.y, r, sprite(col[0], col[1], col[2], 1), a);
  }
}

/* Wingtip vortices when the wing is working hard, and exhaust haze at power. */
function spawnTrails(dt) {
  const P = PLANE;
  if (P.crashed || P.onGround || P.tas < 60) return;
  // wingtip vortices when the delta is working
  if ((P.gload > 2.0 || P.alpha > 12 * DEG) && Math.random() < dt * 30) {
    for (const sx of [-8.3, 8.3]) {
      const wp = vadd(P.pos, mRot(P.m, v3(sx, .05, -10.2)));
      addPart(wp, vmul(P.vel, .02), 1.0, .7 + Math.random() * .5, [252, 253, 255], 7);
    }
  }
  // contrails: only where the air is cold enough to make them
  const air = isa(P.pos.y);
  if (air.T < 233 && P.rpm > .45 && Math.random() < dt * 60) {
    for (const sx of [-4.62, 4.62]) {
      const ex = vadd(P.pos, mRot(P.m, v3(sx, -.06, -9.6)));
      addPart(ex, v3(), 3.0, 16 + Math.random() * 8, [246, 249, 255], 2.1);
    }
  }
  // transonic vapour cone through the sound barrier
  if (P.mach > .95 && P.mach < 1.06 && P.pos.y < 11000 && Math.random() < dt * 55) {
    const a = Math.random() * TAU, r = 3 + Math.random() * 4;
    const wp = vadd(P.pos, mRot(P.m, v3(Math.cos(a) * r, Math.sin(a) * r * .5, -7 - Math.random() * 3)));
    addPart(wp, v3(), 1.1, .13, [238, 244, 255], 5);
  }
}

/* ============================================================ events ==== */
let banner = document.getElementById("banner"), toastEl = document.getElementById("toast");
let toastT = 0;
function toast(msg, secs) { toastEl.textContent = msg; toastEl.style.opacity = 1; toastT = secs || 2.2; }
function showBanner(msg, col) {
  banner.textContent = msg; banner.style.color = col || "#fff"; banner.style.opacity = 1;
}
function hideBanner() { banner.style.opacity = 0; }

function crash(why) {
  const P = PLANE;
  if (P.crashed) return;
  P.crashed = true; P.crashT = 0; P.msg = why;
  for (let i = 0; i < 34; i++) spawnFire(P.pos);
  for (let i = 0; i < 16; i++) spawnSmoke(P.pos, P.vel);
  cam.shake = 2.2;
  audio.boom();
  showBanner(why + "  \u00b7  R TO RESET", "#ff6a56");
  GAME.over = true; GAME.result = why;
}

/* ============================================================ camera ==== */
let camMode = 0;
const CAMNAMES = ["CHASE", "COCKPIT", "ORBIT", "WING", "TOWER"];
let orbitA = 0;
function updateCamera(dt) {
  const P = PLANE, m = P.m;
  const fwd = v3(m[6], m[7], m[8]), up = v3(m[3], m[4], m[5]), right = v3(m[0], m[1], m[2]);
  let want, look, rollBlend = 1;
  if (camMode === 1) {                      // cockpit
    want = vadd(P.pos, mRot(m, v3(0, .92, 9.10)));
    cam.pos = want;
    cam.m = qMat(P.q, cam.m);
    FOV = FOVBASE * 1.16; F = (H * .5) / Math.tan(FOV * .5);
    return;
  }
  FOV = FOVBASE; F = (H * .5) / Math.tan(FOV * .5);
  if (camMode === 0) {
    const back = 52 + clamp(vlen(P.vel) * .10, 0, 34);
    want = vadd(P.pos, vadd(vmul(fwd, -back), vmul(up, 9)));
    look = vadd(P.pos, vmul(fwd, 24));
    rollBlend = .35;
  } else if (camMode === 2) {
    orbitA += dt * .22;
    const r = 62;
    want = vadd(P.pos, v3(Math.cos(orbitA) * r, 16, Math.sin(orbitA) * r));
    look = P.pos; rollBlend = 0;
  } else if (camMode === 3) {
    want = vadd(P.pos, mRot(m, v3(26, 6, -14)));
    look = vadd(P.pos, mRot(m, v3(0, .3, 2)));
    rollBlend = 1;
  } else {
    want = v3(-70, E + 26, 620);
    look = P.pos; rollBlend = 0;
  }
  // Smooth the offset from the aircraft, not the world position. Smoothing in
  // world space works fine at 60 m/s and leaves the camera kilometres behind at
  // Mach 3, because the lag scales with speed.
  const anchor = camMode === 4 ? v3(0, 0, 0) : P.pos;
  const wantOff = vsub(want, anchor);
  if (!cam.init) { cam.off = wantOff; cam.init = 1; }
  const k = camMode === 0 ? 7 : 5;
  cam.off = v3(approach(cam.off.x, wantOff.x, k, dt), approach(cam.off.y, wantOff.y, k, dt),
               approach(cam.off.z, wantOff.z, k, dt));
  cam.pos = vadd(anchor, cam.off);
  const gh = groundH(cam.pos.x, cam.pos.z) + 3;
  if (cam.pos.y < gh) cam.pos.y = gh;
  // build a look-at basis, then blend in some of the aircraft roll
  const f2 = vnorm(vsub(look, cam.pos));
  let upRef = v3(0, 1, 0);
  if (rollBlend > 0) upRef = vnorm(vadd(vmul(v3(0, 1, 0), 1 - rollBlend), vmul(up, rollBlend)));
  let r2 = vnorm(vcross(upRef, f2));
  if (!isFinite(r2.x) || vlen(r2) < .01) r2 = vnorm(vcross(v3(0, 0, 1), f2));
  const u2 = vcross(f2, r2);
  const sh = cam.shake;
  cam.m[0] = r2.x; cam.m[1] = r2.y; cam.m[2] = r2.z;
  cam.m[3] = u2.x; cam.m[4] = u2.y; cam.m[5] = u2.z;
  cam.m[6] = f2.x; cam.m[7] = f2.y; cam.m[8] = f2.z;
  if (sh > .001) {
    const jq = qmul(qAxis(1, 0, 0, (Math.random() - .5) * sh * .05), qAxis(0, 1, 0, (Math.random() - .5) * sh * .05));
    const jm = qMat(jq, new Float32Array(9));
    cam.m = mmul(cam.m, jm);
  }
}

/* ======================================================= draw aircraft == */
function drawAircraft() {
  const P = PLANE, Rb = P.m, pos = P.pos;
  const external = camMode !== 1;
  const ail = P.dA * 20 * DEG, ele = P.dE * 22 * DEG, rud = P.dR * 22 * DEG, fl = P.flap * 28 * DEG;
  const gearAng = (1 - P.gear) * 92 * DEG;
  const hinge = (part, mat) => {
    const piv = part.pivot;
    const o = vadd(pos, mRot(Rb, v3(piv[0], piv[1], piv[2])));
    drawMesh(part.mesh, o, mmul(Rb, mat), piv);
  };
  if (external) {
    drawMesh(AC.fuse, pos, Rb, null);
    drawMesh(AC.chine, pos, Rb, null);
    drawMesh(AC.wingL, pos, Rb, null);
    drawMesh(AC.wingR, pos, Rb, null);
    drawMesh(AC.nacL, pos, Rb, null);
    drawMesh(AC.nacR, pos, Rb, null);
    drawMesh(AC.marks, pos, Rb, null);
    // Elevons do both jobs: they move together for pitch and differentially
    // for roll, exactly as they do on a tailless delta.
    hinge(AC.elevOutR, mAxis(1, 0, 0, -ele - ail - fl * .35));
    hinge(AC.elevOutL, mAxis(1, 0, 0, -ele + ail - fl * .35));
    hinge(AC.elevInR, mAxis(1, 0, 0, -ele - ail * .4 - fl));
    hinge(AC.elevInL, mAxis(1, 0, 0, -ele + ail * .4 - fl));
    hinge(AC.finL, mAxis(0, 1, 0, rud));
    hinge(AC.finR, mAxis(0, 1, 0, rud));
    if (P.gear > .01) {
      hinge(AC.gearL, mAxis(0, 0, 1, -gearAng));
      hinge(AC.gearR, mAxis(0, 0, 1, gearAng));
      hinge(AC.gearN, mAxis(1, 0, 0, gearAng));
    }
    drawMesh(AC.glass, pos, Rb, null);
    if (P.chute > .02) {
      // the canopy trails behind and streams with the airflow
      const back = vnorm(vsub(P.vel, vmul(mRot(Rb, v3(0, 0, 1)), 0)));
      const sway = Math.sin(GAME.t * 3.1) * .04, sway2 = Math.cos(GAME.t * 2.3) * .03;
      const swing = mmul(mAxis(1, 0, 0, sway), mAxis(0, 1, 0, sway2));
      drawMesh(AC.chute, pos, mmul(Rb, swing), null, null, clamp(P.chute * 1.4, 0, 1));
    }
    drawNozzles(P, Rb, pos);
    const navs = [[v3(-8.40, .06, -9.5), [255, 70, 60]], [v3(8.40, .06, -9.5), [70, 255, 120]],
                  [v3(0, .22, -14.0), [255, 255, 255]]];
    for (const [lp, c] of navs) {
      const sp = projectPoint(vadd(pos, mRot(Rb, lp)));
      if (!sp) continue;
      DL.sprite(sp.z - 2, sp.x, sp.y, clamp(.8 * sp.s, 1.6, 18), sprite(c[0], c[1], c[2], 3), .9);
    }
  } else {
    drawMesh(AC.wingL, pos, Rb, null);
    drawMesh(AC.wingR, pos, Rb, null);
    drawMesh(AC.nacL, pos, Rb, null);
    drawMesh(AC.nacR, pos, Rb, null);
    drawMesh(AC.chine, pos, Rb, null);
    drawMesh(AC.cowl, pos, Rb, null);
    drawMesh(AC.glass, pos, Rb, null, null, .16);
  }
  if (P.crashed && Math.random() < .5) spawnSmoke(vadd(pos, mRot(Rb, v3(0, .3, 2))), P.vel);
}

/* Afterburner: a translucent cone out of each nozzle with shock diamonds
   standing in it, plus a bloom sprite. Only lit when the throttle is past the
   A/B gate, and it stretches with how hard the burners are working. */
function drawNozzles(P, Rb, pos) {
  const ab = P.abSm || 0, core = clamp(P.rpm * .55 + ab * .8, 0, 1.4);
  if (P.crashed || core < .12) return;
  const len = 3.0 + ab * 16;
  for (const sx of [-4.62, 4.62]) {
    const base = vadd(pos, mRot(Rb, v3(sx, -.06, -8.7)));
    const b = projectPoint(base);
    if (!b) continue;
    const tip = projectPoint(vadd(pos, mRot(Rb, v3(sx, -.06, -8.7 - len))));
    if (!tip) continue;
    const r0 = .66 * b.s;
    DL.sprite(b.z - 1, b.x, b.y, Math.max(r0 * 1.3, 2), sprite(255, 196, 120, 1), clamp(core * .45, 0, .7));
    // Built in short segments so the plume can fade and narrow along its
    // length instead of reading as a solid rod.
    const SEG = 7;
    let px = b.x, py = b.y, pr = r0;
    for (let i = 1; i <= SEG; i++) {
      const t = i / SEG;
      const sp = projectPoint(vadd(pos, mRot(Rb, v3(sx, -.06, -8.7 - len * t))));
      if (!sp) break;
      const rr = r0 * (1 - t * .86) * (1 + Math.sin(t * 9 + GAME.t * 26) * .12 * ab);
      const dx = sp.x - px, dy = sp.y - py, dl = Math.hypot(dx, dy) || 1;
      const nx = -dy / dl, ny = dx / dl;
      const a = (ab * .30 + .06) * (1 - t) * (1 - t);
      const col = t < .25 ? "rgba(190,214,255," : t < .55 ? "rgba(255,186,96," : "rgba(255,142,58,";
      DL.poly(b.z - 1.5 - i * .01,
        [px + nx * pr, py + ny * pr, px - nx * pr, py - ny * pr,
         sp.x - nx * rr, sp.y - ny * rr, sp.x + nx * rr, sp.y + ny * rr],
        4, col + a.toFixed(3) + ")", null, 0);
      px = sp.x; py = sp.y; pr = rr;
    }
    if (ab > .05) {
      for (let i = 1; i <= 4; i++) {   // shock diamonds standing in the plume
        const t = i / 5, dz = -8.7 - len * t * .55;
        const sp = projectPoint(vadd(pos, mRot(Rb, v3(sx, -.06, dz))));
        if (!sp) continue;
        DL.sprite(sp.z - 2, sp.x, sp.y, Math.max(.22 * sp.s * (1 - t * .7), .8),
          sprite(255, 240, 200, 1), ab * (1 - t) * .40);
      }
    }
  }
}

/* ============================================================= audio ==== */
const audio = {
  ctx: null, ok: false,
  init() {
    if (this.ctx) return;
    const AC2 = window.AudioContext || window.webkitAudioContext;
    if (!AC2) return;
    this.ctx = new AC2();
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = .55; this.master.connect(c.destination);
    // engine: two detuned saws through a lowpass
    this.eg = c.createGain(); this.eg.gain.value = 0;
    this.ef = c.createBiquadFilter(); this.ef.type = "lowpass"; this.ef.frequency.value = 900;
    this.o1 = c.createOscillator(); this.o1.type = "sawtooth"; this.o1.frequency.value = 70;
    this.o2 = c.createOscillator(); this.o2.type = "square"; this.o2.frequency.value = 35;
    this.o1.connect(this.ef); this.o2.connect(this.ef);
    this.ef.connect(this.eg); this.eg.connect(this.master);
    this.o1.start(); this.o2.start();
    // wind: filtered noise
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.ns = c.createBufferSource(); this.ns.buffer = buf; this.ns.loop = true;
    this.nf = c.createBiquadFilter(); this.nf.type = "bandpass"; this.nf.frequency.value = 500; this.nf.Q.value = .7;
    this.ng = c.createGain(); this.ng.gain.value = 0;
    this.ns.connect(this.nf); this.nf.connect(this.ng); this.ng.connect(this.master);
    this.ns.start();
    // stall horn
    this.sg = c.createGain(); this.sg.gain.value = 0;
    this.so = c.createOscillator(); this.so.type = "sawtooth"; this.so.frequency.value = 420;
    this.so.connect(this.sg); this.sg.connect(this.master);
    this.so.start();
    this.ok = true;
  },
  update(P, dt) {
    if (!this.ok) return;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const t = this.ctx.currentTime;
    // two turbojets: a low rumble, a compressor whine that tracks spool speed,
    // and a wall of noise that the afterburners open right up
    const spool = P.rpm, ab = P.abSm || 0;
    this.o1.frequency.setTargetAtTime(52 + spool * 46, t, .12);
    this.o2.frequency.setTargetAtTime(390 + spool * 1150, t, .12);
    this.ef.frequency.setTargetAtTime(300 + spool * 2600 + ab * 1800, t, .12);
    this.eg.gain.setTargetAtTime(P.crashed ? 0 : (camMode === 1 ? .15 : .11) * (.18 + spool * .85), t, .12);
    const wv = clamp(P.tas / 240, 0, 1.5);
    this.ng.gain.setTargetAtTime(clamp(wv * wv * .16 + ab * .20 + spool * .06, 0, .42), t, .12);
    this.nf.frequency.setTargetAtTime(240 + wv * 700 + ab * 420, t, .12);
    this.nf.Q.setTargetAtTime(ab > .1 ? .35 : .7, t, .2);
    const warn = (P.stall > .22 || P.alpha > 24 * DEG || P.unstart > 0) && !P.onGround && !P.crashed;
    this.sg.gain.setTargetAtTime(warn ? (Math.sin(t * 34) > 0 ? .06 : 0) : 0, t, .02);
  },
  boom() {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime;
    const len = c.sampleRate * 1.4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380;
    const g = c.createGain(); g.gain.value = .85;
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  beep(freq, dur, vol) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .18, t + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + (dur || .12));
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + (dur || .14));
  }
};

/* ========================================================== scenarios === */
const GAME = {
  t: 0, over: false, result: "", started: false, paused: false,
  rings: [], ringIdx: 0, ringT: 0, landScore: null
};
function buildRingCourse() {
  GAME.rings = [];
  let a = Math.PI, x = 0, z = -2000, y = 4000;
  for (let i = 0; i < 12; i++) {
    a += (hash2(i, 51) - .5) * .70 + (i % 2 ? .22 : -.22);
    if (i >= 6) {   // second half curves back toward the field
      let d = Math.atan2(-x, -z) - a;
      if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
      a += clamp(d, -.8, .8) * .55;
    }
    // gates are minutes apart, not seconds, at three times the speed of sound
    const step = 11000 + hash2(i, 52) * 9000;
    x += Math.sin(a) * step; z += Math.cos(a) * step;
    y = clamp(terrainH(x, z) + 2600 + hash2(i, 53) * 7000, 1200, 20000);
    GAME.rings.push({ p: v3(x, y, z), a, passed: false });
  }
  GAME.ringIdx = 0; GAME.ringT = 0;
}
function drawRings() {
  for (let i = 0; i < GAME.rings.length; i++) {
    const rg = GAME.rings[i];
    if (rg.passed) continue;
    const d = vlen(vsub(rg.p, cam.pos));
    if (d > 90000) continue;
    const M = qMat(qAxis(0, 1, 0, rg.a), new Float32Array(9));
    const tint = i === GAME.ringIdx ? [120, 255, 160] : null;
    drawMesh(RING, rg.p, M, null, tint);
    // pylon to the ground so the gate reads in 3D
    const gh = terrainH(rg.p.x, rg.p.z);
    const a = projectPoint(v3(rg.p.x, rg.p.y - 240, rg.p.z)), b = projectPoint(v3(rg.p.x, gh, rg.p.z));
    if (a && b) DL.poly(a.z + 30, [a.x - 1.5, a.y, a.x + 1.5, a.y, b.x + 2.5, b.y, b.x - 2.5, b.y], 4,
      fogged([132, 138, 146], a.z), null, 0);
  }
}
function checkRings(dt) {
  if (SCEN !== "rings" || GAME.over) return;
  GAME.ringT += dt;
  const rg = GAME.rings[GAME.ringIdx];
  if (!rg) return;
  const rel = vsub(PLANE.pos, rg.p);
  const n = v3(Math.sin(rg.a), 0, Math.cos(rg.a));
  const along = vdot(rel, n);
  const radial = Math.hypot(rel.x - n.x * along, rel.y, rel.z - n.z * along);
  if (rg.last === undefined) rg.last = along;
  // `along` runs negative before the gate and positive once past it
  if (rg.last < 0 && along >= 0 && radial < 240) {
    rg.passed = true; GAME.ringIdx++;
    audio.beep(880, .13, .2);
    if (GAME.ringIdx >= GAME.rings.length) {
      GAME.over = true; GAME.result = "COURSE COMPLETE  " + GAME.ringT.toFixed(2) + "s";
      showBanner("COURSE COMPLETE — " + GAME.ringT.toFixed(2) + "s", "#8bf0a8");
    } else toast("GATE " + GAME.ringIdx + " / " + GAME.rings.length, 1.2);
  }
  rg.last = along;
}
function checkLanding() {
  const P = PLANE;
  if (SCEN !== "land" || GAME.over || P.crashed) return;
  if (P.onGround && P.touched > 1.1 && GAME.landScore === null) {
    const onRwy = onRunway(P.pos.x, P.pos.z);
    const vs = P.hardLand;
    const offC = Math.abs(P.pos.x);
    const zone = 950 - P.pos.z;     // metres past the threshold
    let sc = 0, notes = [];
    if (!onRwy) { notes.push("OFF RUNWAY"); }
    else {
      sc = 100;
      sc -= clamp(Math.abs(vs) * 11, 0, 45); notes.push("SINK " + (Math.abs(vs) * 196.85).toFixed(0) + " fpm");
      sc -= clamp(offC * 1.8, 0, 25); notes.push("CENTRE " + offC.toFixed(1) + " m");
      sc -= clamp(Math.abs(zone - 380) * .05, 0, 30); notes.push("TOUCHDOWN " + zone.toFixed(0) + " m");
      sc = Math.max(0, Math.round(sc));
    }
    GAME.landScore = sc;
    GAME.over = true;
    GAME.result = (onRwy ? "TOUCHDOWN — " + sc + " / 100" : "MISSED THE RUNWAY");
    showBanner(GAME.result, onRwy ? (sc > 75 ? "#8bf0a8" : "#ffd27a") : "#ff8c6a");
    toast(notes.join("   "), 5);
  }
}

/* ============================================================== touch ==== */
/* On a phone the whole control set is drawn into the canvas and driven by
   pointer events: a relative thumb stick on the left, an absolute throttle
   slider on the right, tap buttons for the switches, and rudder pads in
   complex mode. Nothing is a DOM element, so it scales with the canvas and
   costs nothing in layout. */
/* The throttle slider, the switches and the pause button are always on screen
   and work with a mouse as well as a thumb; only the virtual stick is
   touch-only, since a keyboard already has one. */
const TOUCH = {
  on: MOBILE, ptr: new Map(),
  stick: { id: null, hx: 0, hy: 0, cx: 0, cy: 0, r: 80, dx: 0, dy: 0, zw: 0, zh: 0 },
  thr: { id: null, x: 0, y: 0, w: 0, h: 0 },
  rud: { l: null, r: null, v: 0, boxes: [] },
  btns: [], pause: { x: 0, y: 0, w: 0, h: 0 }, flash: {}
};
function layoutTouch() {
  if (!W || !H) return;
  const T = TOUCH, u = UI;
  const sl = SAFE.l * DPR, sr = SAFE.r * DPR, sb = SAFE.b * DPR, st = SAFE.t * DPR;
  const r = clamp(Math.min(W, H) * (PORTRAIT ? .20 : .17), 54 * u, 130 * u);
  T.stick.r = r;
  T.stick.hx = sl + r + 24 * u;
  T.stick.hy = H - sb - r - 24 * u;
  T.stick.zw = PORTRAIT ? W * .58 : W * .46;
  T.stick.zh = PORTRAIT ? H * .40 : H * .70;
  const bw = 78 * u, bh = 54 * u, g = 9 * u, tw = 54 * u;
  let th, bx, by;
  if (PORTRAIT) {
    // narrow screen: throttle low on the right, switches stacked above it
    th = Math.min(H * .30, 300 * u);
    T.thr.x = W - sr - tw - 16 * u;
    T.thr.y = H - sb - th - 16 * u;
    bx = W - sr - 16 * u - (bw * 2 + g);
    by = T.thr.y - 14 * u - (bh * 2 + g);
  } else {
    th = Math.min(H * .54, 330 * u);
    T.thr.x = W - sr - tw - 16 * u;
    T.thr.y = H - sb - th - 16 * u;
    bx = T.thr.x - 16 * u - (bw * 2 + g);
    by = H - sb - 16 * u - (bh * 2 + g);
  }
  T.thr.w = tw; T.thr.h = th;
  T.btns = [
    { k: "ap", x: bx, y: by - (bh + g) * 2, w: bw, h: bh },
    { k: "keys", x: bx + bw + g, y: by - (bh + g) * 2, w: bw, h: bh },
    { k: "chute", x: bx, y: by - bh - g, w: bw, h: bh },
    { k: "flapup", x: bx + bw + g, y: by - bh - g, w: bw, h: bh },
    { k: "gear", x: bx, y: by, w: bw, h: bh },
    { k: "flap", x: bx + bw + g, y: by, w: bw, h: bh },
    { k: "brake", x: bx, y: by + bh + g, w: bw, h: bh, hold: 1 },
    { k: "cam", x: bx + bw + g, y: by + bh + g, w: bw, h: bh }
  ];
  const rw = 82 * u, rh = 54 * u, ry = H - sb - 16 * u - rh;
  const rcx = PORTRAIT ? W * .5 : clamp((T.stick.hx + r + bx) / 2, T.stick.hx + r + rw + 16 * u, bx - rw - 16 * u);
  T.rud.boxes = [
    { k: "rudL", x: rcx - rw - 8 * u, y: ry, w: rw, h: rh },
    { k: "rudR", x: rcx + 8 * u, y: ry, w: rw, h: rh }
  ];
  // tucked under the altitude read-out so it never sits on top of it
  T.pause = { x: W - sr - 12 * u - 46 * u, y: st + 8 * u + 56 * u + 20 * u, w: 46 * u, h: 40 * u };
}
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

function touchAct(k) {
  const P = PLANE;
  TOUCH.flash[k] = .18;
  if (k === "gear") { P.gearCmd = P.gearCmd > .5 ? 0 : 1; toast(P.gearCmd ? "GEAR DOWN" : "GEAR UP", 1.2); audio.beep(P.gearCmd ? 520 : 400, .18, .12); }
  else if (k === "flap") { P.flapCmd = P.flapCmd >= .99 ? 0 : clamp(P.flapCmd + .25, 0, 1); toast("FLAPS " + Math.round(P.flapCmd * 100) + "%", 1); }
  else if (k === "cam") { camMode = (camMode + 1) % CAMNAMES.length; toast("CAMERA: " + CAMNAMES[camMode], 1.2); }
  else if (k === "ap") toggleAP();
  else if (k === "keys") SHOWKEYS = !SHOWKEYS;
  else if (k === "flapup") { P.flapCmd = clamp(P.flapCmd - .25, 0, 1); toast("FLAPS " + Math.round(P.flapCmd * 100) + "%", 1); }
  else if (k === "chute") {
    if (P.chuteCmd) { P.chuteCmd = 0; toast("CHUTE JETTISONED", 1.4); }
    else if (P.ias * 1.94384 > CHUTE_LIMIT) toast("TOO FAST FOR THE CHUTE", 1.6);
    else { P.chuteCmd = 1; toast("DRAG CHUTE STREAMED", 1.6); }
  }
}
function touchDown(id, x, y, isTouch) {
  const T = TOUCH;

  if (SHOWKEYS) { SHOWKEYS = false; return true; }
  if (inBox(T.pause, x, y)) { togglePause(); return true; }
  for (const b of T.btns) {
    if (inBox(b, x, y)) {
      T.ptr.set(id, { kind: "btn", b });
      if (!b.hold) touchAct(b.k); else TOUCH.flash[b.k] = 1;
      return true;
    }
  }
  if (isTouch) {
    for (const b of T.rud.boxes) {
      if (inBox(b, x, y)) { T.ptr.set(id, { kind: "rud", b }); T.rud.v = b.k === "rudR" ? 1 : -1; return true; }
    }
  }
  if (x > T.thr.x - 28 * UI && y > T.thr.y - 28 * UI) {
    T.ptr.set(id, { kind: "thr" }); T.thr.id = id; touchThrottle(y); return true;
  }
  if (isTouch && x < T.stick.zw && y > H - T.stick.zh) {

    T.stick.id = id; T.stick.cx = x; T.stick.cy = y; T.stick.dx = 0; T.stick.dy = 0;

}
function touchMove(id, x, y) {
  const e = TOUCH.ptr.get(id);

  else if (e.kind === "rud") {
    if (!inBox(e.b, x, y)) { TOUCH.rud.v = 0; TOUCH.ptr.delete(id); }
  } else if (e.kind === "btn" && e.b.hold) {
    if (!inBox(e.b, x, y)) { TOUCH.flash[e.b.k] = 0; TOUCH.ptr.delete(id); }
  }

}

  if (e.kind === "stick") { TOUCH.stick.id = null; TOUCH.stick.dx = 0; TOUCH.stick.dy = 0; }
  else if (e.kind === "thr") TOUCH.thr.id = null;
  else if (e.kind === "rud") TOUCH.rud.v = 0;
  else if (e.kind === "btn" && e.b.hold) TOUCH.flash[e.b.k] = 0;

}
