     the runway — it is what makes rotation the same controllable thing at any
     ground speed — and it has no integral path, so it holds an ATTITUDE, not
     a flight path. Blending it up to 262 kt therefore left the pitch loop
     with no way to close a steady error exactly where it most needed one:
     hands off at 190 kt the aeroplane sank at 6,000 fpm with the integrator
     pinned against its stop. It now hands over by 140 kt, just above the
     stall, and the g law owns the aeroplane everywhere above that.
     (P.ias is metres per second: 50 to 72 is 97 to 140 knots.) */
  P.fbwG = approach(P.fbwG === undefined ? 1 : P.fbwG,
    P.onGround ? 1 : (1 - sstep(50, 72, P.ias || 0)), 3.0, dt);
  const gnd = clamp(P.fbwG, 0, 1);

  /* ---------------- pitch ------------------------------------------------ */
  const lvl = levelG(e, P.gRatio);
  const sE = curve(cE), sA = curve(cA), sR = curve(cR);
  /* Trim on a fly-by-wire aeroplane is not an offset on the tailplane — the
     computer already holds whatever it is asked to hold. It shifts the datum
     instead: a touch of nose-up trim means hands off it holds a gentle climb
     rather than level flight. */
  const gCmd = (sE >= 0 ? lvl + (FBW.gMax - lvl) * sE : lvl + (lvl - FBW.gMin) * sE)
    + (P.trim || 0) * .30;
  const gErr = gCmd - (P.gload || 0);
  /* Anti-windup. The span scales with the command range: fixed at 1.2-3.0 g
     it would have gated the integrator off for the whole of any pull worth
     making once the ceiling went to 12, leaving the loop proportional-only. */
  const iSpan = clamp((FBW.gMax - 1) * .25, 1.5, 4);
  const iGate = 1 - sstep(iSpan, iSpan * 2.5, Math.abs(gErr));
  P.fbwI = clamp((P.fbwI || 0) + gErr * dt * FBW.kPitchI * iGate, -1.6, 1.6);
  /* Pitch-rate damping.

     Two things were wrong with this before. It fed back the raw rate, and a
     sustained turn carries a real body pitch rate of omega*sin(bank), so it
     subtracted nose-up elevator for as long as the turn lasted and left a
     standing g error. And its gain was a fixed number of units of ELEVATOR
     per unit of rate, while every other term in this loop is scheduled by
     dynamic pressure — so at Mach 3 it was applying the same deflection into
     forty times the air, and the loop rang against the actuator lag at the
     short-period frequency. That is the rocking chair.

     Both are fixed here. The rate is high-passed, so the damping works on the
     way into a manoeuvre and lets go once the rate is steady. And the gain is
     expressed the way the rest of the loop is — as a pitch ACCELERATION per
     unit of rate — which means scheduling it against the frequency of the
     very mode it is damping. The short period goes as the square root of
     dynamic pressure, so the damping follows it up. */
  const wsp = Math.sqrt(Math.max(qS * SPECS.cbar * SPECS.CmA / SPECS.Ipitch, .25));
  P.wxF = approach(P.wxF === undefined ? 0 : P.wxF, P.w.x, 1.1, dt);
  let dEg = (gErr * FBW.kPitch + P.fbwI) / gPer
    + (P.w.x - P.wxF) * (2 * FBW.zeta * wsp) / qPer;

  // low-speed / ground law: the stick asks for a pitch rate instead, so that
  // rotation on the runway is the same positive, controllable thing at any
  // speed rather than a snap into a loop
  /* Out of the air the rate limit comes off. In air the pitch rate is capped
     by what the wing will survive; in vacuum there is no wing loading to
     respect and the only reason to be slow is the thrusters, which are now
     quick. */
  const qCmd = -sE * FBW.qMax * (1 + 1.6 * rcsAuth) * (P.onGround ? .62 : 1);
  const gearQ = clamp(FBW.qRef / Math.max(qbar, 500), .03, 1);
  let dEq = clamp(sE * gearQ + (P.w.x - qCmd) * 2.4 / qPer, -1, 1);

  let dE = clamp(lerp(dEg, dEq, gnd), -1, 1);

  /* The one remaining protection, and it is on your side: past about 27
     degrees this delta stops flying and starts falling, with the vortex gone
     and nothing but drag left. The limiter holds the pull right at the peak
     of the lift curve instead of letting you haul it over the back. */
  /* ...and it only applies where there is air to stall in. Coasting in free
     fall the velocity vector swings round under gravity while the nose stays
     where you left it, so angle of attack grows without limit — it reached
     fifty-six degrees in twenty seconds at 200 km. The limiter read that as
     an imminent stall and fired full nose-down thrusters against it, for
     ever, and the aeroplane tumbled with the stick centred. There is no wing
     loading in vacuum and nothing to protect, so out there it stands down. */
  const a = P.alpha || 0;
  P.aoaCap = aeroShare > .25 && a > FBW.aoaMax && dE > 0;
  if (P.aoaCap) {
    dE = clamp(dE - (a - FBW.aoaMax) * 26 * aeroShare, -1, .04);
    P.fbwI = Math.min(P.fbwI, .1);          // don't wind the integrator up against the limit
  }
  /* There is no load limiter any more. The only thing still standing between
     the stick and the wing is the angle-of-attack limit above, and that one
     is there to keep the aeroplane flying, not to keep you off the numbers. */

  /* ---------------- roll ------------------------------------------------- */
  /* w.z positive is a roll to the left, so a right stick asks for negative
     w.z. The command is eased rather than stepped: with a loop this quick,
     feeding it a square edge rolls the aeroplane off its wing in a tenth of
     a second, which is accurate and horrible to fly. */
  P.pCmdS = approach(P.pCmdS === undefined ? 0 : P.pCmdS, -sA * FBW.pMax * (1 + .7 * rcsAuth), FBW.pSmooth, dt);
  const pCmd = P.pCmdS;
  /* A wing resists rolling in proportion to how fast it is already rolling,
     so a purely proportional loop settles wherever its gain happens to
     balance that damping and never reaches what it asked for — full stick was
     buying 99 deg/s at one speed and 125 at another against a command of 149.
     The damping is not a mystery, though: it is Clp, and the model already
     knows it. Feeding it forward means the aeroplane rolls at the rate the
     stick asked for, and at the same rate at every speed that can sustain it. */
  const rollD = qS * SPECS.b * SPECS.b * SPECS.Clp / (Math.max(P.tas || 1, 25) * SPECS.Iroll);
  let dA = clamp(-((pCmd - P.w.z) * FBW.kRoll + pCmd * rollD) / pPer, -1, 1);

  /* ---------------- yaw -------------------------------------------------- */
  /* Right rudder yaws the nose right, which drives sideslip negative.

     The sideslip term only means something when there is air to slip through.
     In vacuum `beta` is just the angle between the nose and the velocity
     vector, and under thrust and gravity that angle wanders continuously —
     so the loop chased it with the thrusters and yawed the aeroplane through
     three hundred and fifty-eight degrees while the pilot sat with the stick
     centred. Out there the rudder commands a yaw RATE and nothing else, which
     is what a reaction control system does; the sideslip loop fades out with
     the air that justifies it. */
  const aero = aeroShare;
  const bCmd = -sR * FBW.bMax * (1 - gnd);
  /* w.y positive is nose right, and right rudder gives nose right — so this
     is +sR. The sideslip command above is -sR because beta runs the other
     way (negative beta IS nose right), and carrying that sign across to the
     rate command reversed the rudder everywhere there was no air. */
  const yRate = sR * 0.45 * rcsAuth * (1 + 1.4 * rcsAuth);
  let dR = clamp(
    aero * (((P.beta || 0) - bCmd) * FBW.kBeta / Math.max(rPer, .01) * .12)
    + (P.w.y - yRate) * FBW.kYawD / Math.max(rPer, .01) * -(.10 + .16 * rcsAuth), -1, 1);
  // on the ground the pedals are the nosewheel, and the computer keeps the
  // roll straight rather than trying to hold a sideslip that means nothing
  if (gnd > .5 && P.onGround) {
    if (Math.abs(cR) > .05 || P.holdHdg === undefined) P.holdHdg = e.hdg;
    let err = P.holdHdg - e.hdg;
    if (err > Math.PI) err -= TAU; else if (err < -Math.PI) err += TAU;
    dR = clamp(cR + err * 1.8 - P.w.y * .8, -1, 1);
    P.steer = clamp(cR * .9 + err * 1.2 - P.w.y * .5, -1, 1);
  } else { P.holdHdg = undefined; P.steer = approach(P.steer || 0, 0, 4, dt); }

  /* ---------------- actuators -------------------------------------------- */
  /* A reaction control system is a set of valves, not a proportional surface,
     and every real one has a deadband — without it the thing chatters around
     null for ever, firing at rates far too small to matter. Inside the
     atmosphere there are no valves and no deadband. */
  if (rcsAuth > .5) {
    const db = .035 * rcsAuth;
    if (Math.abs(dE) < db && Math.abs(P.w.x) < .004) dE = 0;
    if (Math.abs(dA) < db && Math.abs(P.w.z) < .004) dA = 0;
    if (Math.abs(dR) < db && Math.abs(P.w.y) < .004) dR = 0;
  }
  // the surfaces themselves still take time to move
  P.dE = approach(P.dE, dE, 14, dt);
  P.dA = approach(P.dA, dA, 16, dt);
  P.dR = approach(P.dR, dR, 12, dt);
  P.cmdG = gCmd;
}

/* The autopilot sits on top of the fly-by-wire, not beside it: it produces
   stick commands and the flight control system flies them, exactly as it
   flies yours. Hands on, the stick commands bank angle and pitch attitude;
   hands off, it holds the altitude and heading it had when you let go. */
/* ------------------------------------------------- transfer autopilot ----
   Flying to the Moon by hand means judging, from 384,000 km out and with no
   horizon to judge it against, the exact moment to turn round and start
   braking — and being wrong by a few seconds means arriving at half a million
   metres a second or stopping short in empty space. That is not a flying
   task, it is an arithmetic task, and it is what a flight computer is for.

   With the autopilot in and a nav target picked, this flies the whole
   transfer: it points the nose where the nose needs to be, accelerates, works
   out the range at which it must flip, turns round, brakes, and parks you off
   the surface at walking pace relative to the body.

   The braking distance is the only real sum in it: v^2 / 2a. It flips when
   the remaining range has fallen to that, plus a margin, which is the same
   thing a pilot would do with a slide rule and much better timing. */
function transferAP(P, dt) {
  const t = navTarget();
  if (!t) return null;
  const dx = t.p.x - P.pos.x, dy = t.p.y - P.pos.y, dz = t.p.z - P.pos.z;
  const d = Math.hypot(dx, dy, dz) || 1;
  const lx = dx / d, ly = dy / d, lz = dz / d;             // line of sight
  const range = d - t.r;
  const park = Math.max(t.r * .40, 60000);                 // where we aim to end up
  const togo = Math.max(range - park, 0);
  const V = vlen(P.vel);
  const close = P.vel.x * lx + P.vel.y * ly + P.vel.z * lz;
  const aMax = 800000 * .55;                               // headroom for gravity

  /* Steer the VELOCITY VECTOR, not the nose.

     Pointing the nose at the thing and pushing does not arrive anywhere: the
     Earth keeps pulling sideways the whole way, so the path bows, and the
     first version of this sailed past the Moon by nine thousand kilometres
     with the nose pointed dead at it the entire time. What matters is not
     where the nose is but where the velocity is, and the fix is to work out
     the velocity you WANT and thrust along the difference.

     Want: all of your speed along the line of sight, at the fastest you could
     still stop from in the range remaining — v = sqrt(2*a*d), with a margin.
     Difference: that minus what you have. Thrust along it. Every error the
     trajectory can have — too fast, too slow, drifting sideways — is one
     vector, and this cancels all of them at once. */
  /* The profile is now set by how long it takes to TURN ROUND, not by how
     far it takes to stop. With the brake sized to two and a half seconds,
     stopping distance is about 1.25 seconds of your current speed — nothing
     — so what is left is the ten-odd seconds the thrusters need to reverse
     the nose, during which you are still closing. Allowing fourteen seconds
     of range at all times covers the turn with margin to spare, and it means
     the whole approach is one smooth ramp rather than a cliff. */
  /* Twenty-six seconds of range, not fourteen. Fourteen covers the turn on
     paper and leaves nothing for being wrong, and at Mars the aeroplane
     arrived with the brake still running and put itself into the surface at
     nine hundred thousand metres a second. The margin costs a little time
     and buys the difference between arriving and not. */
  const TURN = 26;
  /* And a ceiling, because there is a speed past which no guidance converges.
     Left uncapped this accelerated for the whole of a Mars transfer and
     arrived doing a third of the speed of light, at which point fourteen
     seconds of range is a billion and a half metres, the line of sight swings
     faster than the thrusters can follow it, and the aeroplane goes past on a
     hyperbola. Twenty thousand kilometres a second is quick enough to put the
     Moon three minutes away and slow enough that the geometry stays still. */
  const VMAX = 2.0e8;
  const vProf = Math.min(togo / TURN + 150, VMAX);
  const wx = lx * vProf - P.vel.x, wy = ly * vProf - P.vel.y, wz = lz * vProf - P.vel.z;
  const wl = Math.hypot(wx, wy, wz) || 1;

  let mode;
  if (togo <= 0 && V < 600) mode = "ARRIVED";
  else if (close > 0 && V > vProf * 1.06) mode = "BRAKING";
  else mode = "BURNING";
  if (mode === "ARRIVED") {
    // hold station: kill whatever is left and look at it
    AP.ramp = 0;
    AP.accel = clamp(V * 1.2, 0, Math.max(V / 2.5, 3000));
    /* Hand back cleanly. The speed hold's target was set once, on arming at
       the edge of the atmosphere, and the transfer commands acceleration
       directly rather than through it — so the stale number sat there for the
       whole flight and the instant anything took the transfer off the engine
       (a touch of the stick, Z, or clearing the target) the speed hold spooled
       straight back up to it. Arrive at the Moon, reach for the stick to look
       around, and it flew you into the surface about ninety seconds later. */
    SPD.tgt = Math.min(SPD.tgt, Math.max(V, 60));
    AP.mode = mode; AP.togo = range; AP.close = close;
    AP.aimW = v3(-P.vel.x / Math.max(V, 1), -P.vel.y / Math.max(V, 1), -P.vel.z / Math.max(V, 1));
    return { aim: AP.aimW, look: v3(lx, ly, lz) };
  }
  /* The same asymmetry the pilot gets: gradual up, near-instant down.

     This matters more here than anywhere. The transfer guidance bypasses the
     speed controller and commands acceleration directly, so it needs its own
     copy of the rule — without it the autopilot braked at the cruise figure
     and sailed past the Moon at five million metres a second having barely
     slowed at all. Whether we are speeding up or slowing down is simply
     whether the correction opposes the velocity we already have. */
  SPD.tgt = Math.min(SPD.tgt, Math.max(V, vProf));   // never hand back a stale target
  const slowing = (wx * P.vel.x + wy * P.vel.y + wz * P.vel.z) < 0;
  if (slowing) {
    AP.ramp = 0;
    AP.accel = clamp(wl * .9, 0, Math.max(V / 2.5, 3000));
  } else {
    AP.ramp = Math.min((AP.ramp || 0) + dt * 40000, aMax);
    AP.accel = clamp(Math.min(wl * .9, AP.ramp), 0, aMax);
  }
  AP.mode = mode; AP.togo = range; AP.close = close;
  AP.aimW = v3(wx / wl, wy / wl, wz / wl);
  return { aim: AP.aimW, look: null };
}

/* Point the nose at a world direction, as stick commands. Pitch and yaw
   errors are read in the BODY frame, which is what makes this work with the
   nose anywhere at all — including pointing away from where you want to go,
   which is most of a braking burn. */
function pointAt(P, aim, dt) {
  const m = P.m;
  const fx = m[6] * aim.x + m[7] * aim.y + m[8] * aim.z;   // ahead
  const rx = m[0] * aim.x + m[1] * aim.y + m[2] * aim.z;   // right
  const uy = m[3] * aim.x + m[4] * aim.y + m[5] * aim.z;   // up
  // angle off the nose, split into the two axes
  const yawErr = Math.atan2(rx, fx);
  const pitchErr = Math.atan2(uy, Math.hypot(fx, rx));
  // rate commands, damped on the measured body rates
  /* Pure proportional on the ANGLE, and no rate feedback at all.

     The loop underneath this one is already a rate command: the stick asks
     for so many radians a second and the thrusters deliver it. Feeding body
     rate back into the input of a rate loop closes a second loop around the
     first one and the two fight — which is precisely what happened, and why
     the nose swung through a hundred and sixty degrees either side of where
     it was pointed for the whole flight. Commanding a rate proportional to
     the angle left to go is a first-order approach to the target attitude,
     and first-order systems do not oscillate.

     The divisors are the rate each axis gets at full stick, so the constants
     are the time constant of the turn — about a second and a half. */
  /* A proportional attitude loop lags a MOVING target by the time constant
     times the rate it is moving, and on a fast approach the line of sight
     really does move — a second and a half of lag left the nose a steady
     twenty-seven degrees behind it. Shortening the constant shortens the lag
     in proportion. */
  const cE = clamp(pitchErr / (FBW.qMax * 0.7), -1, 1);
  const cR = clamp(yawErr / (0.45 * 0.7), -1, 1);
  const cA = 0;         // the roll rate loop already holds the wings still
  return { e: cE, a: cA, r: cR };
}

function autopilot(P, dt, e) {
  const hands = Math.abs(P.inA) > .04 || Math.abs(P.inE) > .04;
  const lvl = levelG(e, P.gRatio);
  P.trim = 0;
  if (P.onGround) { P.apAlt = undefined; P.apHdg = undefined; AP.mode = ""; return { e: P.inE * .55, a: P.inA, r: P.inR }; }

  /* Out of the air, with somewhere to go and hands off the stick, the
     autopilot flies the transfer instead of holding an altitude that no
     longer means anything. */
  if ((P.qbar || 0) < 60 && !hands && navTarget()) {
    const g = transferAP(P, dt);
    if (g) return pointAt(P, g.aim, dt);
  }
  AP.mode = ""; AP.accel = 0;

  let bankTgt, dG;
  if (hands) {
    P.apAlt = undefined; P.apHdg = undefined;
    bankTgt = P.inA * 62 * DEG;
    const pitchTgt = P.inE * 28 * DEG;
    dG = clamp((pitchTgt - e.pitch) * 3.2, -2.0, 4.0);
  } else if ((P.qbar || 0) < 60) {
    /* Hands off, out of the air, with nowhere to go: hold the attitude you
       are in rather than an "altitude" and a "heading", neither of which
       means anything in orbit. The altitude hold used to run here and fought
       gravity with elevons that were moving nothing. */
    P.apAlt = undefined; P.apHdg = undefined; AP.mode = "";
    return { e: clamp(P.w.x * 2.2, -1, 1), a: clamp(P.w.z * 2.6, -1, 1), r: clamp(-P.w.y * 2.2, -1, 1) };
  } else {
    if (P.apHdg === undefined) P.apHdg = e.hdg;
    if (P.apAlt === undefined) P.apAlt = P.pos.y;
    let he = P.apHdg - e.hdg;
    if (he > Math.PI) he -= TAU; else if (he < -Math.PI) he += TAU;
    bankTgt = clamp(he * 1.5, -24 * DEG, 24 * DEG);
    const vsTgt = clamp((P.apAlt - P.pos.y) * .042, -34, 34);
    dG = clamp((vsTgt - P.vel.y) * .058, -.9, 1.15);
  }
  // bank angle through the roll-rate law
  const cA = clamp((bankTgt - e.roll) * 1.15, -.85, .85);
  return { e: gToStick(dG, lvl), a: cA, r: 0 };
}

function physics(P, dt) {
  const m = P.m;
  const e = eulerOf(m);
  // --- control law ---------------------------------------------------------
  let cE = P.inE, cA = P.inA, cR = P.inR;
  if (AP.on) { const c = autopilot(P, dt, e); cE = c.e; cA = c.a; cR = c.r; }
  flightControl(P, dt, e, cE, cA, cR);
  // Flaps blow back above their placard speed, and the chute is torn away if
  // you stream it too fast.
  const kias = P.ias * 1.94384;
  if (kias > FLAP_LIMIT && P.flapCmd > 0) {
    P.flapCmd = 0;
    if (P.flapWarn === undefined || GAME.t - P.flapWarn > 4) { P.flapWarn = GAME.t; toast("FLAPS BLOWN BACK \u00b7 OVER " + FLAP_LIMIT + " KT", 2.2); }
  }
  P.flap = approach(P.flap, P.flapCmd, .9, dt);
  if (P.chuteCmd && kias > CHUTE_LIMIT) { P.chuteCmd = 0; toast("CHUTE TORN AWAY \u00b7 OVER " + CHUTE_LIMIT + " KT", 2.2); }
  if (!P.onGround && P.chute > 0 && P.tas < 30) P.chuteCmd = 0;   // cut it when stopped
  P.chute = approach(P.chute, P.chuteCmd, 2.6, dt);
  P.gear = clamp(P.gear + (P.gearCmd - P.gear > 0 ? dt / 3.2 : -dt / 3.2), 0, 1);
  if (Math.abs(P.gearCmd - P.gear) < .02) P.gear = P.gearCmd;

  // --- engine -------------------------------------------------------------
  const thrCmd = P.crashed ? 0 : P.thr;
  P.rpm = approach(P.rpm, .035 + thrCmd * .965, 1.5, dt);
  const air = isa(P.pos.y);
  const rho = air.rho;
  const wind = WIND.at(P.pos, P);
  const va = vsub(P.vel, wind);
  const vb = mRotT(m, va);
  const V = vlen(vb);
  P.tas = V;
  P.mach = V / air.a;
  P.ias = V * Math.sqrt(rho / 1.225);
  // Afterburner lives in the top fifth of the throttle and is what the gate
  // between "fast aeroplane" and "Mach 3" actually is.
  P.ab = clamp((thrCmd - AB_GATE) / (1 - AB_GATE), 0, 1);
  const abSm = approach(P.abSm === undefined ? 0 : P.abSm, P.ab, 3.5, dt);
  P.abSm = abSm;
  // Ram compression keeps climbing well past Mach 3 — the inlet is doing more
  // of the compressing the faster it goes — and only gives up in the high
  // twenties. The density floor is the rocket: it keeps working where there is
  // no useful air left to breathe.
  const ram = 1 + 2.4 * sstep(.4, 5, P.mach) + 1.6 * sstep(5, 14, P.mach)
    - 2.6 * sstep(18, 26.5, P.mach);
  const dens = Math.max(Math.pow(clamp(rho / 1.225, .0005, 1), .62), .14);
  const perEngine = SPECS.thrustMil * clamp(P.rpm, 0, 1) + SPECS.thrustAB * abSm;
  const thrust = 2 * perEngine * ram * dens;

  /* Gravity. It used to be a flat 9.81 straight down at every altitude and
     every speed, which is exactly right for an aeroplane and quite wrong for
     anything that leaves the atmosphere. Two terms were missing.

     It falls off as the inverse square — 9.81 at the surface, 9.51 at a
     hundred kilometres, 8.69 at four hundred, 7.33 at a thousand.

     And going fast enough sideways over a round planet takes the weight off
     you, because part of what gravity is doing is bending your path around
     the curve instead of pulling you down. That term is v_horizontal squared
     over your distance from the centre, and it is the whole of what an orbit
     is: at 7.78 km/s a hundred kilometres up it exactly cancels, which is why
     that is the speed low orbit runs at. Without it you could not orbit at
     any speed whatsoever — you came straight back down from 7,900 m/s at
     200 km, losing seventy kilometres in two minutes.

     Both terms vanish at any speed you would fly a circuit at: at 250 m/s the
     centrifugal relief is a tenth of one percent of your weight. */
  const rOrb = EARTH_R + Math.max(P.pos.y, 0);
  const gLoc = 9.81 * (EARTH_R / rOrb) * (EARTH_R / rOrb);
  /* Going faster than orbital speed genuinely does push you outward, and
     that is the term doing it — but it is unbounded in v squared, so at forty
     thousand metres a second down low it reaches thirty g of lift and throws
     the aeroplane off the planet. Real physics, wrong model: at that speed
     over a flat plane the geometry stopped applying long ago. The floor keeps
     orbits exact (they need a fraction of a g) and stops the absurdity. */
  const gEff = Math.max(gLoc - (P.vel.x * P.vel.x + P.vel.z * P.vel.z) / rOrb, -3 * 9.81);
  P.gRatio = gEff / 9.81;
  let F = v3(0, -SPECS.mass * gEff, 0);      // world-frame accumulator

  /* And everything else in the solar system, by GM over r squared. Near the
     Earth these are rounding errors — the Sun pulls at six millimetres per
     second squared out here — but they are what make the Moon something you
     can fall toward and orbit rather than a painted disc. At the lunar
     surface this gives 1.62 m/s^2, because that is what 4.905e12 over
     1737 km squared comes to. */
  if (typeof BODIES !== "undefined") {
    for (let i = 0; i < BODIES.length; i++) {
      const b = BODIES[i];
      const bx = b.p.x - P.pos.x, by = b.p.y - P.pos.y, bz = b.p.z - P.pos.z;
      const r2 = bx * bx + by * by + bz * bz;
      if (r2 < 1) continue;
      const r = Math.sqrt(r2);
      if (b.gm <= 0) continue;
      const a = b.gm / r2;
      if (a < 2e-4) continue;                // below noticing, skip the work
      F.x += SPECS.mass * a * bx / r;
      F.y += SPECS.mass * a * by / r;
      F.z += SPECS.mass * a * bz / r;
    }
  }
  let M = v3();                              // body-frame torque

  if (V > .6) {
    const vd = vmul(vb, 1 / V);
    const slow = clamp((V - 3) / 6, 0, 1);   // the angles are meaningless at a standstill
    P.alpha = clamp(Math.atan2(-vd.y, vd.z), -1.4, 1.4) * slow;
    P.beta = Math.asin(clamp(vd.x, -1, 1)) * slow;
    const qbar = .5 * rho * V * V, qS = qbar * SPECS.S;
    P.qbar = qbar;
    const M8 = P.mach;
    // A slender delta does not stall the way a straight wing does: the leading
    // edge sheds a vortex that keeps adding lift far past where a wing would
    // let go, so the break is late and soft.
    // Drooping a trailing edge buys lift at every angle and gives the stall
    // angle back: the wing lets go a couple of degrees EARLIER with flap out.
    // The stall SPEED still falls, because the lift increment more than pays
    // for the lost angle.
    const aStall = (27 - P.flap * 2) * DEG;
    let st = 1 - sstep(aStall, aStall + 12 * DEG, Math.abs(P.alpha));
    if (AP.on) st = Math.max(st, .55);
    const sa = Math.sin(P.alpha);
    const vortex = 1.55 * sa * sa * Math.cos(P.alpha) * Math.sign(P.alpha);
    const CLlin = SPECS.CL0 + claOfMach(M8) * P.alpha + vortex + .35 * P.flap;
    const CLstall = 1.15 * Math.sin(2 * P.alpha) + .12 * P.flap;
    const CL = lerp(CLstall, CLlin, st);
    /* A stall is a wing that has stopped working, and a wing that was never
       working cannot stop. In vacuum `alpha` is just the angle between the
       nose and the velocity vector, and coasting it runs to eighty degrees
       simply because gravity is bending the trajectory while the nose stays
       where you left it — so this pinned to 1 and every warning, horn and
       red light keyed to it stayed on for the whole flight. It is scaled by
       how much air there is to stall in. */
    const stallable = clamp(qbar / 6000, 0, 1);
    P.stall = approach(P.stall, (1 - st) * stallable, 6, dt);
    // Flaps are mostly drag: full flap adds .160 to the zero-lift drag, which
    // on an airframe this clean is very nearly ten times it —
    // which is what makes them work as a speed brake on approach. The chute
    // adds an area of its own once it is out.
    const CD = cd0OfMach(M8) + SPECS.k * CL * CL + .030 * P.gear
      + (.055 * P.flap + .105 * P.flap * P.flap) + (1 - st) * .12
      + 1.05 * P.chute * (P.onGround ? 1 : .8);
    const L = qS * CL, D = qS * CD, Y = -qS * .90 * P.beta;
    // lift acts perpendicular to the relative wind, in the plane of symmetry
    const liftDir = vnorm(vcross(vd, v3(1, 0, 0)));
    const fb = vadd(vadd(vmul(liftDir, L), vmul(vd, -D)), v3(Y, 0, 0));
    fb.z += thrust;
    /* The afterburner does not run out of breath.

       Drag rises with the SQUARE of speed, so an engine whose thrust rises
       any slower gets matched by it sooner or later and the needle stops —
       that is what a terminal velocity is, and it is why there was a top
       speed. With the burners lit there is no longer one: whatever the air
       is taking out of you, the burners put back more, and the surplus is a
       guaranteed net acceleration rather than a guaranteed thrust.

       It has to be done that way round. The obvious fix is to let thrust
       climb faster than drag — but any law that makes acceleration grow
       faster than linearly with speed reaches infinity in FINITE time, and a
       cubic one duly did: it ran to NaN eighty-five seconds after brake
       release. The surplus here grows with the logarithm of Mach instead, so
       the aeroplane accelerates harder and harder for ever and never reaches
       a singularity. Twenty-eight metres per second per second at Mach 3,
       thirty-nine at Mach 10, sixty-four at Mach 100, ninety at Mach 1000.

       On the dry throttle none of this applies and drag still sets an honest
       top end, which is the point: it is the burners that buy you infinity. */
    /* Speed hold takes precedence over everything the throttle would
       otherwise do. It arms itself once the air is gone and the pilot has not
       already taken charge, and from then on the aeroplane holds the number
       until somebody changes it. */
    const thinAir = rho < 2e-5;
    if (thinAir && !SPD.on && !SPD.auto && !P.crashed && P.tas > 40) {
      SPD.on = true; SPD.auto = true; SPD.tgt = P.tas;
      SPD.thrSave = P.thr;
      SPD.lever = leverOfSpd(P.tas); P.thr = SPD.lever;   // lever meets the speed
      toast("SPEED SELECT \u00b7 " + Math.round(P.tas) + " m/s \u00b7 throttle sets it", 2.8);
    }
    if (!thinAir && SPD.auto) {
      SPD.on = false; SPD.auto = false;
      if (SPD.thrSave !== undefined) { P.thr = SPD.thrSave; SPD.thrSave = undefined; }
      SPD.lever = null;
    }
    /* Moving the lever commands a new speed. Moving it is the ONLY thing that
       does, so an autopilot transfer trimming the target back does not drag
       the lever around under the pilot's hand. */
    if (SPD.on && thinAir && !P.crashed) {
      if (SPD.lever === null || SPD.lever === undefined) SPD.lever = leverOfSpd(SPD.tgt);
      if (Math.abs(P.thr - SPD.lever) > .0015) {
        SPD.lever = P.thr;
        SPD.tgt = spdOfLever(P.thr);
      }
    }

    /* Under transfer guidance the engine pushes along the NOSE, because the
       guidance has already decided where the nose should be. It only pushes
       once the nose is actually near that direction — thrusting hard while
       still swinging round just adds a new error to correct. */
    if (AP.on && AP.mode && AP.accel > 0 && !P.crashed) {
      const gAim = AP.aimW;
      let align = 1;
      if (gAim) {
        const fwdx = m[6], fwdy = m[7], fwdz = m[8];
        align = clamp((fwdx * gAim.x + fwdy * gAim.y + fwdz * gAim.z - .55) / .40, 0, 1);
      }
      fb.z += SPECS.mass * AP.accel * align - (thrust - D);
    } else if (SPD.on && !P.crashed) {
      /* Whatever it takes to sit on the number, either way — including
         thrusting backwards to slow down.

         The error has to be taken on the SIGNED forward component, not on
         speed. `V` is a magnitude, so asking for 3,000 while doing 40,000
         decelerated the aeroplane through zero and then kept pushing: going
         backwards, the magnitude rose again, the error stayed negative, and
         it ran away to two and a half million metres a second in the wrong
         direction. Against vb.z it simply settles on the number. */
      /* The correction goes along the VELOCITY, not along the nose.

         Down the nose it only works while the two are lined up, and they stop
         being lined up the moment gravity bends the trajectory — so braking
         quietly died whenever it was most needed. Along velocity it is a
         cruise control: it holds the number whatever attitude you are in, and
         it cannot run away, because the error is on speed and speed falls to
         the target and stops there. */
      /* Gradual on the way up, near-instant on the way down.

         Speeding up ramps: the acceleration itself builds over about twenty
         seconds rather than arriving all at once, so the needle climbs
         instead of jumping. Slowing down does not ramp at all — the brake is
         sized to wash off whatever you are doing in roughly two and a half
         seconds, from any speed, because waiting out a deceleration is not
         flying and because it is what makes arriving somewhere possible: the
         distance needed to stop collapses from megametres to almost nothing. */
      const aMax = thinAir ? 800000 : 400;
      const err = SPD.tgt - V;
      let aCmd;
      if (err >= 0) {
        SPD.ramp = Math.min((SPD.ramp || 0) + dt * (thinAir ? 40000 : 55), aMax);
        aCmd = Math.min(err * 2.4, SPD.ramp);
      } else {
        SPD.ramp = 0;
        const stop = Math.max(V / 2.5, thinAir ? 12000 : 45);
        aCmd = -Math.min(-err * 2.4, stop);
      }
      const along = thrust * vd.z - D;            // what the engine is already doing
      const add = SPECS.mass * aCmd - along;
      fb.x += add * vd.x; fb.y += add * vd.y; fb.z += add * vd.z;
    } else if (abSm > .01 && !P.crashed) {
      /* Out of the atmosphere the burners have nothing left to fight and the
         distances stop being aeronautical: the Moon is 384,400 km away and
         Mars is two hundred times that. At aircraft accelerations those are
         not journeys, they are careers. Once the air is genuinely gone the
         surplus is multiplied, which puts the Moon a couple of minutes out
         and the inner planets within half an hour. Inside the atmosphere
         nothing changes — the boost is keyed to there being no air at all. */
      const vac = 1 - clamp(rho / 2e-5, 0, 1);
      /* In air the surplus grows with the logarithm of Mach and never stops.
         In vacuum it goes to a flat figure instead of carrying on growing:
         multiplying the two ran the speed to a third of the speed of light
         inside a quarter of an hour, which is not flying anything. Eighty
         thousand puts the Moon a couple of minutes out on a burn-and-brake
         and Mars in the half hour it deserves to be. */
      const aAir = 12 + 26 * Math.log10(1 + Math.max(P.mach, 0));
      const push = SPECS.mass * abSm * lerp(aAir, Math.max(aAir, 800000), vac);
      const net = thrust - D;
      if (net < push) fb.z += push - net;
    }
    F = vadd(F, mRot(m, fb));
    // Load factor as an accelerometer would read it: the aerodynamic force
    // along the body vertical, in g, which is what the pilot and the airframe
    // actually feel — not lift over weight.
    P.gload = (L * Math.cos(P.alpha) + D * Math.sin(P.alpha)) / (SPECS.mass * 9.81);
    // moments
    const cq = .5 * rho * V * SPECS.S;
    const dET = clamp(P.dE, -1.3, 1.3);   // the trim datum lives in the command, not here
    // control power falls away supersonically as the shock moves aft
    const ctlM = lerp(1, .55, sstep(1.0, 2.2, M8));
    M.x = qS * SPECS.cbar * (SPECS.CmA * P.alpha - SPECS.CmE * ctlM * dET + .070 * P.flap) - cq * SPECS.cbar * SPECS.cbar * SPECS.CmQ * P.w.x;
    M.y = qS * SPECS.b * (SPECS.Cnb * P.beta + SPECS.Cndr * ctlM * P.dR - .020 * P.dA) - cq * SPECS.b * SPECS.b * SPECS.Cnr * P.w.y;
    M.z = qS * SPECS.b * (-SPECS.Cla * ctlM * P.dA + SPECS.Clb * P.beta) - cq * SPECS.b * SPECS.b * SPECS.Clp * P.w.z;
    /* Asymmetric stall: wing drop and buffet. These were flat newton-metre
       constants rather than aerodynamic moments, so they did not scale with
       dynamic pressure and fired at full strength in vacuum — where angle of
       attack runs to eighty degrees simply because you are coasting and
       gravity is bending the velocity vector away from the nose. A stall with
       no air in it was throwing the aeroplane around in orbit. They are
       proper coefficients now and go to nothing with the air. */
    if (1 - st > .05) {
      const drop = (1 - st) * (hash2((P.pos.x * 3) | 0, (P.pos.z * 3) | 0) - .5);
      M.z += drop * qS * SPECS.b * .031;
      M.x += (1 - st) * qS * SPECS.cbar * .028;      // nose drops
      cam.shake = Math.max(cam.shake, (1 - st) * .5 * clamp(qbar / 2500, 0, 1));
    }
  } else {
    P.alpha = 0; P.beta = 0; P.gload = 0; P.stall = 0;
    F = vadd(F, mRot(m, v3(0, 0, thrust)));
  }
  /* Ballistic control. Out where there is no air, the elevons are moving
     nothing and a control law with no authority leaves you a passenger. The
     X-15 carried peroxide thrusters for exactly this, and so does this: they
     fade in as dynamic pressure fades out. The pitch law has already handed
     over to its rate mode by then, since indicated airspeed in vacuum is
     zero — so out there the stick asks for a rotation rate and the thrusters
     deliver it, which is how a reaction control system is flown. */
  const rcs = 1 - clamp(P.qbar / 1200, 0, 1);
  if (rcs > .002 && !P.crashed) {
    M.x -= SPECS.rcsP * rcs * clamp(P.dE, -1, 1);
    M.y += SPECS.rcsY * rcs * clamp(P.dR, -1, 1);
    M.z -= SPECS.rcsR * rcs * clamp(P.dA, -1, 1);
  }

  if (!AP.on && V > 40) {
    // an inlet unstart: one duct loses its shock and yaws the aircraft hard.
    // Only ever at high Mach and high angle of attack, as in the real thing.
    /* An inlet unstart is the shock falling out of an air intake. It needs an
       intake with air going through it, so it is gated on there being enough
       of that to matter — it was firing in orbit and kicking the aeroplane
       through a quarter of a radian a second with the stick centred. */
    const risk = sstep(2.4, 3.2, P.mach) * sstep(6 * DEG, 13 * DEG, Math.abs(P.alpha) + Math.abs(P.beta))
      * clamp(P.qbar / 4000, 0, 1);
    if (risk > .01 && Math.random() < risk * dt * .16) P.unstart = .5 + Math.random() * .5;
    if (P.unstart > 0) {
      P.unstart -= dt;
      const sgn = P.unstartSide || (P.unstartSide = Math.random() < .5 ? -1 : 1);
      M.y += sgn * 1.2e6 * clamp(P.unstart, 0, 1);
      M.z += sgn * 3.0e5 * clamp(P.unstart, 0, 1);
      cam.shake = Math.max(cam.shake, .7);
      if (P.unstart <= 0) P.unstartSide = 0;
    }
  }

  // --- ground contact ------------------------------------------------------
  let wow = 0, maxFn = 0;
  if (P.pos.y - groundH(P.pos.x, P.pos.z) < 6) {
    const wOmega = mRot(m, P.w);
    for (const wh of SPECS.wheels) {
      const legDrop = (1 - P.gear) * .95;   // retracted wheels sit inside the airframe
      const wl = v3(wh.p.x, wh.p.y + legDrop, wh.p.z);
      const rw = mRot(m, wl);
      const wp = vadd(P.pos, rw);
      const gh = groundH(wp.x, wp.z);
      const pen = gh - wp.y;
      if (pen <= 0) continue;
      wow++;
      const flat = onRunway(wp.x, wp.z);
      const n = flat ? v3(0, 1, 0) : terrainN(wp.x, wp.z, 4);
      const vp = vadd(P.vel, vcross(wOmega, rw));
      const vn = vdot(vp, n);
      // the clamp is a solver guard on the contact spike, not the gear's own
      // limit — it has to sit above the collapse threshold or that test is dead
      let Fn = clamp(pen * SPECS.gearK - vn * SPECS.gearC, 0, SPECS.mass * 9.81 * 11);
      maxFn = Math.max(maxFn, Fn);
      let Fw = vmul(n, Fn);
      // rolling / lateral friction in the wheel's own frame
      let fwd = mRot(m, v3(0, 0, 1));
      if (wh.steer) {
        const st = (P.steer || 0) * 22 * DEG * clamp(1 - V / 55, .25, 1);
        fwd = mRot(m, v3(Math.sin(st), 0, Math.cos(st)));
      }
      fwd = vnorm(vsub(fwd, vmul(n, vdot(fwd, n))));
      const side = vnorm(vcross(n, fwd));
      const vs = vdot(vp, side), vf = vdot(vp, fwd);
      // nose-wheel grip fades with speed; a hard-gripping wheel ahead of the
      // centre of gravity is directionally unstable and ground-loops the aircraft
      const grip = wh.grip || lerp(.75, .16, clamp(V / 26, 0, 1));
      const muS = (flat ? 1.00 : .74) * grip;
      Fw = vadd(Fw, vmul(side, clamp(-vs * 3200 * grip, -muS * Fn, muS * Fn)));
      const bk = P.brake * wh.brake;
      // Static friction at a crawl. Without it the idle thrust always wins
      // against rolling resistance and the aircraft creeps along the runway
      // for ever instead of coming to a stop.
      const stick = (1 - sstep(0, 2.2, Math.abs(vf))) * .14;
      const roll = (flat ? .016 : .070) + bk * 1.05 + stick;
      Fw = vadd(Fw, vmul(fwd, clamp(-vf * 26000, -roll * Fn, roll * Fn)));
      F = vadd(F, Fw);
      M = vadd(M, mRotT(m, vcross(rw, Fw)));
      if (Fn > 4000 && V > 6 && Math.random() < .25) spawnDust(wp, vmul(vp, -.1));
    }
    // structural contact = crash
    if (!P.crashed) {
      for (const hp of SPECS.hard) {
        const wp = vadd(P.pos, mRot(m, hp));
        if (wp.y < groundH(wp.x, wp.z) - .05) { crash("STRUCTURAL CONTACT"); break; }
      }
      const vsLim = AP.on ? 9.0 : 5.6;
      if (wow && P.lastVS < -vsLim && !P.touched) crash("HARD LANDING");
      // the undercarriage is still made of metal, but it is a lot harder to fold
      if (maxFn > SPECS.mass * 9.81 * (AP.on ? 9.5 : 8.0)) crash("GEAR COLLAPSE");
      if (wow && !P.gear) crash("GEAR UP LANDING");
    }
  }
  P.wow = wow;
  if (wow && !P.onGround) { P.touched = 1.2; P.hardLand = -P.lastVS; }
  P.onGround = wow > 0;
  if (P.touched > 0) P.touched = Math.max(0, P.touched - dt);
  if (!wow) P.lastVS = P.vel.y;

  // --- integrate -----------------------------------------------------------
  if (P.crashed) {
    F = v3(0, -SPECS.mass * gEff, 0);
    if (P.pos.y <= groundH(P.pos.x, P.pos.z) + 1.0) {
      P.vel = vmul(P.vel, Math.exp(-6 * dt));
      P.w = vmul(P.w, Math.exp(-5 * dt));
      F = v3();
    }
  }
  const acc = vmul(F, 1 / SPECS.mass);
  P.vel = vadd(P.vel, vmul(acc, dt));
  P.pos = vadd(P.pos, vmul(P.vel, dt));
  P.w = v3(P.w.x + M.x / SPECS.Ipitch * dt, P.w.y + M.y / SPECS.Iyaw * dt, P.w.z + M.z / SPECS.Iroll * dt);
  const wcap = 3.2;
  P.w = v3(clamp(P.w.x, -wcap, wcap), clamp(P.w.y, -wcap, wcap), clamp(P.w.z, -wcap, wcap));
  P.q = qIntegrate(P.q, P.w, dt);
  qMat(P.q, P.m);
  P.vsi = P.vel.y;
  P.dist += vlen(P.vel) * dt;
  // Stagnation heating rises with the cube of speed and the root of density:
  // this is the real hypersonic limit, and it is worth seeing.
  /* No density floor. It was clamped at 1e-7 kg/m^3 — the air at about 135 km
     — which meant there was never "no air" as far as heating was concerned.
     Coasting between planets at twenty thousand kilometres a second, velocity
     cubed against that floor pegged the skin at its limit and left the
     aeroplane sitting inside a re-entry fireball in empty space, for ever. */
  /* Stagnation heating goes as the cube of speed, and cubing twenty thousand
     kilometres a second beats ANY density: even the 1e-14 kg/m^3 of deep
     space came out pegged at the limit, so the aeroplane cruised between the
     planets inside a permanent fireball. Removing the old 1e-7 density floor
     was not enough on its own.

     The formula is a continuum-flow one and simply does not apply out there —
     below about the mesopause the air stops being a fluid and starts being
     occasional molecules. So it is faded out with the density that justifies
     it, which puts full heating anywhere you could actually re-enter and none
     at all where there is nothing to re-enter through. */
  const heatAir = clamp(rho / 1e-7, 0, 1);
  const heatRate = heatAir * Math.sqrt(Math.max(rho, 0) / 1.225) * Math.pow(Math.max(V, 0) / 1000, 3.1);
  /* Stagnation heating, and the ceiling is gone with it. It was pinned at 1.6
     — reached at about Mach 10 in the stratosphere — so everything past that
     looked identical. A return from orbit runs to about 5, and there is head
     room above that for anything faster. The thermal lag is real: the skin
     takes a couple of seconds to catch up, and a couple to let go. */
  P.heat = clamp(approach(P.heat || 0, clamp(heatRate * .52, 0, 8), .55, dt), 0, 8);
  /* Heat is a read-out and a rumble, not a countdown. It used to burn the
     airframe through after six seconds over the limit; it does not any more.
     Fly it as hot as you like. */
  if (!P.crashed && P.heat > 1.25) {
    P.burn = (P.burn || 0) + dt;
    cam.shake = Math.max(cam.shake, clamp((P.heat - 1.25) * .42, 0, .8));
  } else P.burn = Math.max(0, (P.burn || 0) - dt * .5);

  // peak tracking, and the physiological price of pulling
  // only once actually flying, or the spawn transient records a false peak
  if (!P.onGround && V > 60 && GAME.t > 2) {
    if (P.gload > (P.gMax || 0)) P.gMax = Math.min(P.gload, 20);
    if (P.gload < (P.gMin === undefined ? 1 : P.gMin)) P.gMin = Math.max(P.gload, -8);
  }
  /* Vision still narrows under sustained g, because it should — but it comes
     on later and never closes all the way, so it reads as the pull costing you
     something rather than as the sim taking the aeroplane away. */
  const strain = P.gload > 7.5 ? (P.gload - 7.5) * .26 : P.gload < -2.2 ? (-2.2 - P.gload) * .34 : -1.4;
  P.gStress = clamp((P.gStress || 0) + strain * dt, 0, 1.0);
  P.gRed = P.gload < -2.2 ? 1 : 0;
  /* The wings used to come off past nine g. They do not any more — pull as
     hard as the aeroplane will give you. All that is left of it is the
     airframe groaning, which is feedback rather than a sentence. */
  if (!P.crashed && Math.abs(P.gload) > 9)
    cam.shake = Math.max(cam.shake, clamp((Math.abs(P.gload) - 9) * .22, 0, .7));

  /* Dynamic pressure down low used to tear the airframe apart after four
     seconds. Now it just shakes: Mach 3 on the deck is punishing to look at
     and free to do. */
  if (!P.crashed && P.qbar > 160000) {
    P.overQ = (P.overQ || 0) + dt;
    cam.shake = Math.max(cam.shake, clamp(P.overQ * .22, 0, .65));
  } else P.overQ = Math.max(0, (P.overQ || 0) - dt * .6);
  /* They are places, not walls. Arrive slowly, wings level, on the wheels,
     and you have landed on the Moon; arrive any other way and you have
     arrived the way every unmanned probe before Luna 9 did. */
  if (!P.crashed && typeof BODIES !== "undefined" && P.prev) {
    /* First the swept test, for speeds where a substep is longer than the
       planet. It asks how close the SEGMENT travelled this step came to the
       centre, against a radius no surface can rise above — so it never fires
       on a valley floor, and it always fires on a body you flew through. */
    const ax = P.prev.x, ay = P.prev.y, az = P.prev.z;
    const mx = P.pos.x - ax, my = P.pos.y - ay, mz = P.pos.z - az;
    const mm = mx * mx + my * my + mz * mz;
    for (let i = 0; i < BODIES.length && !P.crashed; i++) {
      const b = BODIES[i];
      if (b.noHit) continue;
      const S = SURF[b.name];
      const rIn = b.r - (S && S.amp ? S.amp * 2.2 : 0);
      const cx = b.p.x - ax, cy = b.p.y - ay, cz = b.p.z - az;
      let t = mm > 1e-9 ? (cx * mx + cy * my + cz * mz) / mm : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const ex = cx - mx * t, ey = cy - my * t, ez = cz - mz * t;
      if (ex * ex + ey * ey + ez * ez < rIn * rIn) { bodyBounce(P, b, "IMPACT"); break; }
    }
    if (!P.crashed) bodyContact(P, dt);
  }
  P.prev = v3(P.pos.x, P.pos.y, P.pos.z);

  // never let the aircraft sink through the world
  const gh = groundH(P.pos.x, P.pos.z);
  if (P.pos.y < gh + 1.2) { P.pos.y = gh + 1.2; if (P.vel.y < 0) P.vel.y *= -.05; }
}

/* ---- standing on another world ------------------------------------------

   The undercarriage sits a couple of metres under the datum, and the ground
   is wherever bodyRelief puts it — the SAME function the renderer draws, at
   full detail, so the wheels touch the surface you can see rather than a
   sphere somewhere underneath it. */
const gearDrop = P => 1.9 + (P.gear || 0) * 2.4;
/* A planet cannot break this aeroplane.

   Hitting a world at speed used to end the flight. It no longer does: the
   airframe takes it, the energy goes into the ground, and you are left
   sitting on the surface being told what you just did. The Earth is the one
   exception — its runway and its hills are the game, and they still bite. */
function bodyBounce(P, b, why) {
  let dx = P.pos.x - b.p.x, dy = P.pos.y - b.p.y, dz = P.pos.z - b.p.z;
  let d = Math.hypot(dx, dy, dz);
  if (d < 1) { dx = 0; dy = 1; dz = 0; d = 1; }   // dead centre: pick a way out
  const nx = dx / d, ny = dy / d, nz = dz / d;
  const S = SURF[b.name];
  const surf = b.r + (S && S.amp ? bodyRelief(b, nx, ny, nz, 0) : 0);
  const out = surf + gearDrop(P) + 1.5;
  P.pos.x = b.p.x + nx * out; P.pos.y = b.p.y + ny * out; P.pos.z = b.p.z + nz * out;
  const vr = P.vel.x * nx + P.vel.y * ny + P.vel.z * nz;
  const tx = P.vel.x - vr * nx, ty = P.vel.y - vr * ny, tz = P.vel.z - vr * nz;
  const keep = .22;                               // most of it goes into the dust
  P.vel.x = nx * Math.max(vr, 0) * .1 + tx * keep;
  P.vel.y = ny * Math.max(vr, 0) * .1 + ty * keep;
  P.vel.z = nz * Math.max(vr, 0) * .1 + tz * keep;
  P.w.x *= .25; P.w.y *= .25; P.w.z *= .25;
  P.prev = null;                                  // the swept test starts again from here
  cam.shake = Math.max(cam.shake || 0, 1.8);
  if ((P.hardT || 0) <= 0) {
    toast(why + " \u00b7 " + b.name.toUpperCase() + " \u00b7 AIRFRAME HELD", 3.2);
    audio.beep(110, .45, .30);
  }
  P.hardT = 2.6;
  P.onBody = b;
}
function bodyContact(P, dt) {
  P.hardT = Math.max(0, (P.hardT || 0) - dt);
  P.bodyRef = null; P.bodyAlt = 0;
  let touching = null;
  for (let i = 0; i < BODIES.length; i++) {
    const b = BODIES[i];
    if (b.noHit) continue;
    const S = SURF[b.name];
    const dx = P.pos.x - b.p.x, dy = P.pos.y - b.p.y, dz = P.pos.z - b.p.z;
    const d = Math.hypot(dx, dy, dz) || 1;
    // the shell within which the ground can possibly be, plus a little reading room
    if (d > b.r + (S && S.amp ? S.amp * 2.6 : 0) + 120000) continue;
    const nx = dx / d, ny = dy / d, nz = dz / d;
    const surf = b.r + (S && S.amp ? bodyRelief(b, nx, ny, nz, 0) : 0);
    const clear = d - surf - gearDrop(P);
    if (!P.bodyRef || clear < P.bodyAlt) { P.bodyRef = b; P.bodyAlt = clear; }
    /* Sticky. Resting on the ground puts the wheels exactly at zero, and a
       test for "below zero" then flickers in and out of contact on floating
       point alone — which re-judges the landing, and re-announces it, several
       times a second. Once down, you stay down until you are three metres up. */
    if (clear > (P.onBody === b ? 3 : 0)) continue;
    touching = { b: b, S: S, nx: nx, ny: ny, nz: nz, d: d, surf: surf };
    break;
  }
  if (!touching) { P.onBody = null; return; }

  const b = touching.b, S = touching.S;
  const nx = touching.nx, ny = touching.ny, nz = touching.nz;
  const vr = P.vel.x * nx + P.vel.y * ny + P.vel.z * nz;        // + is climbing away
  const tx = P.vel.x - vr * nx, ty = P.vel.y - vr * ny, tz = P.vel.z - vr * nz;
  const vt = Math.hypot(tx, ty, tz);
  const m = P.m;
  const lev = m[3] * nx + m[4] * ny + m[5] * nz;                // canopy vs local up
  const L = (S && S.land) || { vs: 8, vt: 160, g: .4 };

  if (!P.onBody) {                        // the moment of arrival, judged once
    const why = (-vr) > L.vs ? "TOO FAST DOWN"
      : vt > L.vt ? "TOO FAST ACROSS"
      : lev < .74 ? "NOT WINGS LEVEL"
      : P.gear < .9 ? "GEAR UP" : null;
    if (why) { bodyBounce(P, b, why); return; }
    P.onBody = b;
    const g = b.gm / (touching.surf * touching.surf);
    toast("DOWN ON " + b.name.toUpperCase() + " · " + (g / 9.81).toFixed(2) + " g · "
      + Math.round(vt) + " m/s", 3.4);
    audio.beep(300, .30, .18);
  }

  // sit on it: no sinking in, and the descent stops here
  const rest = touching.surf + gearDrop(P) - .04;
  P.pos.x = b.p.x + nx * rest;
  P.pos.y = b.p.y + ny * rest;
  P.pos.z = b.p.z + nz * rest;
  let newR = vr > 0 ? vr : 0;
  /* Rolling, and braking. There is no air out here to slow anything down, so
     the wheels are the only thing that will, and they work against whatever
     gravity this world happens to have. */
  const gl = b.gm / (touching.surf * touching.surf);
  const mu = (P.brake > .4 ? .62 : .035) + (P.park ? .8 : 0);
  const dec = mu * Math.max(gl, .05) * dt;
  const k = vt > 1e-6 ? Math.max(vt - dec, 0) / vt : 0;
  P.vel.x = nx * newR + tx * k;
  P.vel.y = ny * newR + ty * k;
  P.vel.z = nz * newR + tz * k;
  // and the airframe settles level rather than pivoting on a wingtip
  P.w.x *= .90; P.w.y *= .92; P.w.z *= .86;
  P.bodyAlt = 0;
}

/* wind & turbulence */
const WIND = {
  base: v3(3.2, 0, -1.6), t: 0,
  at(pos, P) {
    // There is no weather above the stratosphere, and there was: this used to
    // return a steady seven metres a second at three hundred kilometres up.
    const air = 1 - sstep(20000, 46000, pos.y);
    if (air <= 0) return v3();
    const g = Math.sin(this.t * .7) * .5 + Math.sin(this.t * 1.9 + 1.3) * .3;
    const alt = clamp(pos.y / 1200, 0, 1);
    const turb = ((1 - alt) * .9 + .15) * air;
    return v3(
      (this.base.x * (1 + g * .5) * (.6 + alt)) * air + Math.sin(this.t * 3.1 + pos.x * .01) * turb,
      Math.sin(this.t * 2.6 + pos.z * .013) * turb * .8,
      (this.base.z * (1 + g * .5) * (.6 + alt)) * air + Math.cos(this.t * 2.3 + pos.z * .011) * turb);
  }
};

/* ======================================================== particles ====== */
const PARTS = [];
function addPart(p, v, r, life, col, grow, kind) {
  if (PARTS.length > 420) PARTS.shift();
  PARTS.push({ p: v3(p.x, p.y, p.z), v: v3(v.x, v.y, v.z), r, t: 0, life, col, grow: grow || 1.6, kind: kind || 0 });
}
function spawnDust(p, v) {
  addPart(p, v3(v.x + (Math.random() - .5) * 3, 1 + Math.random() * 2, v.z + (Math.random() - .5) * 3),
    .6, .9 + Math.random() * .7, [196, 188, 170], 5.5);
}
function spawnSmoke(p, v) {
  addPart(p, v3(v.x * .2 + (Math.random() - .5) * 2, 2 + Math.random() * 3, v.z * .2 + (Math.random() - .5) * 2),
    1.2, 2.4, [58, 58, 62], 7);
}
function spawnFire(p) {
  addPart(p, v3((Math.random() - .5) * 9, 5 + Math.random() * 9, (Math.random() - .5) * 9),
    1.6, .5 + Math.random() * .5, [255, 178, 60], 6, 1);
}
function updateParts(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const q = PARTS[i];
    q.t += dt;
    if (q.t >= q.life) { PARTS.splice(i, 1); continue; }
    q.p = vadd(q.p, vmul(q.v, dt));
    q.v = vmul(q.v, Math.exp(-1.6 * dt));
    if (q.kind === 1) q.v.y += 18 * dt; else q.v.y += 1.2 * dt;
  }
}
function drawParts() {
  for (const q of PARTS) {
    const sp = projectPoint(q.p);
    if (!sp) continue;
    const f = q.t / q.life;
    const r = (q.r + q.grow * q.t) * sp.s;
    if (r < .6) continue;
    const a = (1 - f) * (q.kind === 1 ? .9 : .42);
    const col = q.kind === 1 ? mixc([255, 226, 140], [220, 70, 30], f) : q.col;
    DL.sprite(sp.z, sp.x, sp.y, r, sprite(col[0], col[1], col[2], 1), a);
  }
}

/* Wingtip vortices when the wing is working hard, and exhaust haze at power. */
function spawnTrails(dt) {
  const P = PLANE;
  if (P.crashed || P.onGround || P.tas < 60) return;
  /* Every trail below this line is water vapour in air, so all of them need
     air. They were streaming off the wingtips and drawing contrails between
     the planets — the contrail test only asks whether the air is cold, and
     the vacuum this model returns is 185 K, which is very cold indeed. */
  const air = isa(P.pos.y);
  if (air.rho < 5e-4) return;
  // wingtip vortices when the delta is working
  if ((P.gload > 2.0 || P.alpha > 12 * DEG) && Math.random() < dt * 30) {
    for (const sx of [-8.3, 8.3]) {
      const wp = vadd(P.pos, mRot(P.m, v3(sx, .05, -10.2)));
      addPart(wp, vmul(P.vel, .02), 1.0, .7 + Math.random() * .5, [252, 253, 255], 7);
    }
  }
  // contrails: only where the air is cold enough to make them
  if (air.T < 233 && P.rpm > .45 && Math.random() < dt * 60) {
    for (const sx of [-4.62, 4.62]) {
      const ex = vadd(P.pos, mRot(P.m, v3(sx, -.06, -9.6)));
      addPart(ex, v3(), 1.2, 18 + Math.random() * 10, [244, 248, 255], 1.15);
    }
  }
  // transonic vapour cone through the sound barrier
  if (P.mach > .95 && P.mach < 1.06 && P.pos.y < 11000 && Math.random() < dt * 55) {
    const a = Math.random() * TAU, r = 3 + Math.random() * 4;
    const wp = vadd(P.pos, mRot(P.m, v3(Math.cos(a) * r, Math.sin(a) * r * .5, -7 - Math.random() * 3)));
    addPart(wp, v3(), 1.1, .13, [238, 244, 255], 5);
  }
}

/* ============================================================ events ==== */
let banner = document.getElementById("banner"), toastEl = document.getElementById("toast");
let toastT = 0;
function toast(msg, secs) { toastEl.textContent = msg; toastEl.style.opacity = 1; toastT = secs || 2.2; }
function showBanner(msg, col) {
  banner.textContent = msg; banner.style.color = col || "#fff"; banner.style.opacity = 1;
}
function hideBanner() { banner.style.opacity = 0; }

function crash(why) {
  const P = PLANE;
  if (P.crashed) return;
  P.crashed = true; P.crashT = 0; P.msg = why;
  for (let i = 0; i < 34; i++) spawnFire(P.pos);
  for (let i = 0; i < 16; i++) spawnSmoke(P.pos, P.vel);
  cam.shake = 2.2;
  audio.boom();
  showBanner(why + "  \u00b7  R TO RESET", "#ff6a56");
  GAME.over = true; GAME.result = why;
}

/* ============================================================ camera ==== */
let camMode = 0;
const CAMNAMES = ["CHASE", "COCKPIT", "ORBIT", "WING", "TOWER"];
let orbitA = 0;
function updateCamera(dt) {
  const P = PLANE, m = P.m;
  const fwd = v3(m[6], m[7], m[8]), up = v3(m[3], m[4], m[5]), right = v3(m[0], m[1], m[2]);
  let want, look, rollBlend = 1;
  if (camMode === 1) {                      // cockpit
    want = vadd(P.pos, mRot(m, v3(0, .92, 9.10)));
    cam.pos = want;
    cam.m = qMat(P.q, cam.m);
    FOV = FOVBASE * 1.16; F = (H * .5) / Math.tan(FOV * .5);
    return;
  }
  FOV = FOVBASE; F = (H * .5) / Math.tan(FOV * .5);
  if (camMode === 0) {
    const back = 52 + clamp(vlen(P.vel) * .10, 0, 34);
    want = vadd(P.pos, vadd(vmul(fwd, -back), vmul(up, 9)));
    look = vadd(P.pos, vmul(fwd, 24));
    rollBlend = .35;
  } else if (camMode === 2) {
    orbitA += dt * .22;
    const r = 62;
    want = vadd(P.pos, v3(Math.cos(orbitA) * r, 16, Math.sin(orbitA) * r));
    look = P.pos; rollBlend = 0;
  } else if (camMode === 3) {
    want = vadd(P.pos, mRot(m, v3(26, 6, -14)));
    look = vadd(P.pos, mRot(m, v3(0, .3, 2)));
    rollBlend = 1;
  } else {
    want = v3(-70, E + 26, 620);
    look = P.pos; rollBlend = 0;
  }
  // Smooth the offset from the aircraft, not the world position. Smoothing in
  // world space works fine at 60 m/s and leaves the camera kilometres behind at
  // Mach 3, because the lag scales with speed.
  const anchor = camMode === 4 ? v3(0, 0, 0) : P.pos;
  const wantOff = vsub(want, anchor);
  if (!cam.init) { cam.off = wantOff; cam.init = 1; }
  const k = camMode === 0 ? 7 : 5;
  cam.off = v3(approach(cam.off.x, wantOff.x, k, dt), approach(cam.off.y, wantOff.y, k, dt),
               approach(cam.off.z, wantOff.z, k, dt));
  cam.pos = vadd(anchor, cam.off);
  const gh = groundH(cam.pos.x, cam.pos.z) + 3;
  if (cam.pos.y < gh) cam.pos.y = gh;
  // build a look-at basis, then blend in some of the aircraft roll
  const f2 = vnorm(vsub(look, cam.pos));
  let upRef = v3(0, 1, 0);
  if (rollBlend > 0) upRef = vnorm(vadd(vmul(v3(0, 1, 0), 1 - rollBlend), vmul(up, rollBlend)));
  let r2 = vnorm(vcross(upRef, f2));
  if (!isFinite(r2.x) || vlen(r2) < .01) r2 = vnorm(vcross(v3(0, 0, 1), f2));
  const u2 = vcross(f2, r2);
  const sh = cam.shake;
  cam.m[0] = r2.x; cam.m[1] = r2.y; cam.m[2] = r2.z;
  cam.m[3] = u2.x; cam.m[4] = u2.y; cam.m[5] = u2.z;
  cam.m[6] = f2.x; cam.m[7] = f2.y; cam.m[8] = f2.z;
  if (sh > .001) {
    const jq = qmul(qAxis(1, 0, 0, (Math.random() - .5) * sh * .05), qAxis(0, 1, 0, (Math.random() - .5) * sh * .05));
    const jm = qMat(jq, new Float32Array(9));
    cam.m = mmul(cam.m, jm);
  }
}

/* ======================================================= draw aircraft == */
function drawAircraft() {
  const P = PLANE, Rb = P.m, pos = P.pos;
  const external = camMode !== 1;
  const ail = P.dA * 20 * DEG, ele = P.dE * 22 * DEG, rud = P.dR * 22 * DEG, fl = P.flap * 28 * DEG;
  const gearAng = (1 - P.gear) * 92 * DEG;
  const hinge = (part, mat) => {
    const piv = part.pivot;
    const o = vadd(pos, mRot(Rb, v3(piv[0], piv[1], piv[2])));
    drawMesh(part.mesh, o, mmul(Rb, mat), piv);
  };
  /* The skin itself, heating up. The ramp used to top out at a warm cream
     around heat 1.25; it now runs all the way to the blue-white of a shock
     layer, because there is now somewhere past 1.25 to go. */
  const heat = P.heat || 0;
  const glow = heat > .22 ? plasmaColor(heat) : null;
  const gk = glow ? clamp((heat - .22) * .62, 0, .94) : 0;
  if (external) {
    drawMesh(AC.fuse, pos, Rb, null, glow, undefined, gk);
    drawMesh(AC.chine, pos, Rb, null, glow, undefined, gk);
    drawMesh(AC.wingL, pos, Rb, null, glow, undefined, gk * .8);
    drawMesh(AC.wingR, pos, Rb, null, glow, undefined, gk * .8);
    drawMesh(AC.nacL, pos, Rb, null, glow, undefined, gk * .8);
    drawMesh(AC.nacR, pos, Rb, null, glow, undefined, gk * .8);
    drawMesh(AC.marks, pos, Rb, null);
    drawPlasma(P, Rb, pos);
    // Elevons do both jobs: they move together for pitch and differentially
    // for roll, exactly as they do on a tailless delta.
    // A positive rotation about the wing axis puts a trailing edge DOWN, so
    // nose-up elevator is -ele and drooped flap is +fl. The flap term used to
    // carry the elevator's sign, which drew the flaps deflecting upward.
    hinge(AC.elevOutR, mAxis(1, 0, 0, -ele - ail + fl * .35));
    hinge(AC.elevOutL, mAxis(1, 0, 0, -ele + ail + fl * .35));
    hinge(AC.elevInR, mAxis(1, 0, 0, -ele - ail * .4 + fl));
    hinge(AC.elevInL, mAxis(1, 0, 0, -ele + ail * .4 + fl));
    hinge(AC.finL, mAxis(0, 1, 0, rud));
    hinge(AC.finR, mAxis(0, 1, 0, rud));
    if (P.gear > .01) {
      hinge(AC.gearL, mAxis(0, 0, 1, -gearAng));
      hinge(AC.gearR, mAxis(0, 0, 1, gearAng));
      hinge(AC.gearN, mAxis(1, 0, 0, gearAng));
    }
    drawMesh(AC.glass, pos, Rb, null);
    if (P.chute > .02) {
      // the canopy trails behind and streams with the airflow
      const back = vnorm(vsub(P.vel, vmul(mRot(Rb, v3(0, 0, 1)), 0)));
      const sway = Math.sin(GAME.t * 3.1) * .04, sway2 = Math.cos(GAME.t * 2.3) * .03;
      const swing = mmul(mAxis(1, 0, 0, sway), mAxis(0, 1, 0, sway2));
      drawMesh(AC.chute, pos, mmul(Rb, swing), null, null, clamp(P.chute * 1.4, 0, 1));
    }
    drawNozzles(P, Rb, pos);
    const navs = [[v3(-8.40, .06, -9.5), [255, 70, 60]], [v3(8.40, .06, -9.5), [70, 255, 120]],
                  [v3(0, .22, -14.0), [255, 255, 255]]];
    for (const [lp, c] of navs) {
      const sp = projectPoint(vadd(pos, mRot(Rb, lp)));
      if (!sp) continue;
      DL.sprite(sp.z - 2, sp.x, sp.y, clamp(.8 * sp.s, 1.6, 18), sprite(c[0], c[1], c[2], 3), .9);
    }
  } else {
    drawMesh(AC.wingL, pos, Rb, null);
    drawMesh(AC.wingR, pos, Rb, null);
    drawMesh(AC.nacL, pos, Rb, null);
    drawMesh(AC.nacR, pos, Rb, null);
    drawMesh(AC.chine, pos, Rb, null);
    drawMesh(AC.cowl, pos, Rb, null);
    drawMesh(AC.glass, pos, Rb, null, null, .16);
  }
  if (P.crashed && Math.random() < .5) spawnSmoke(vadd(pos, mRot(Rb, v3(0, .3, 2))), P.vel);
}

/* Afterburner: a translucent cone out of each nozzle with shock diamonds
   standing in it, plus a bloom sprite. Only lit when the throttle is past the
   A/B gate, and it stretches with how hard the burners are working. */
function drawNozzles(P, Rb, pos) {
  const ab = P.abSm || 0, core = clamp(P.rpm * .55 + ab * .8, 0, 1.4);
  if (P.crashed || core < .12) return;
  const len = 3.0 + ab * 16;
  for (const sx of [-4.62, 4.62]) {
    const base = vadd(pos, mRot(Rb, v3(sx, -.06, -8.7)));
    const b = projectPoint(base);
    if (!b) continue;
    const tip = projectPoint(vadd(pos, mRot(Rb, v3(sx, -.06, -8.7 - len))));
    if (!tip) continue;
    const r0 = .66 * b.s;
    DL.sprite(b.z - 1, b.x, b.y, Math.max(r0 * 1.3, 2), sprite(255, 196, 120, 1), clamp(core * .45, 0, .7));
    // Built in short segments so the plume can fade and narrow along its
    // length instead of reading as a solid rod.
    const SEG = 7;
    let px = b.x, py = b.y, pr = r0;
    for (let i = 1; i <= SEG; i++) {
      const t = i / SEG;
      const sp = projectPoint(vadd(pos, mRot(Rb, v3(sx, -.06, -8.7 - len * t))));
      if (!sp) break;
      const rr = r0 * (1 - t * .86) * (1 + Math.sin(t * 9 + GAME.t * 26) * .12 * ab);
      const dx = sp.x - px, dy = sp.y - py, dl = Math.hypot(dx, dy) || 1;
      const nx = -dy / dl, ny = dx / dl;
      const a = (ab * .30 + .06) * (1 - t) * (1 - t);
      const col = t < .25 ? "rgba(190,214,255," : t < .55 ? "rgba(255,186,96," : "rgba(255,142,58,";
      DL.poly(b.z - 1.5 - i * .01,
        [px + nx * pr, py + ny * pr, px - nx * pr, py - ny * pr,
         sp.x - nx * rr, sp.y - ny * rr, sp.x + nx * rr, sp.y + ny * rr],
        4, col + a.toFixed(3) + ")", null, 0);
      px = sp.x; py = sp.y; pr = rr;
    }
    if (ab > .05) {
      for (let i = 1; i <= 4; i++) {   // shock diamonds standing in the plume
        const t = i / 5, dz = -8.7 - len * t * .55;
        const sp = projectPoint(vadd(pos, mRot(Rb, v3(sx, -.06, dz))));
        if (!sp) continue;
        DL.sprite(sp.z - 2, sp.x, sp.y, Math.max(.22 * sp.s * (1 - t * .7), .8),
          sprite(255, 240, 200, 1), ab * (1 - t) * .40);
      }
    }
  }
}

/* What air looks like at a given stagnation temperature. It runs from a dull
   cherry red through orange and straw to white, and then to the blue-white of
   a shock layer hot enough to be ionising — which is the colour a capsule
   comes home in. */
function plasmaColor(h) {
  if (h < 1.1) return mixc([104, 24, 10], [236, 104, 28], clamp(h / 1.1, 0, 1));
  if (h < 2.8) return mixc([236, 104, 28], [255, 218, 158], clamp((h - 1.1) / 1.7, 0, 1));
  return mixc([255, 218, 158], [188, 222, 255], clamp((h - 2.8) / 3.2, 0, 1));
}

/* The re-entry sheath.

   Every part of this is driven by skin temperature, and skin temperature is
   the square root of density times velocity cubed — so it is speed that
   lights it and thin air that puts it out. That is the shape of a real
   re-entry and it falls out of the physics rather than being staged: nothing

        Math.max(sp.s * (3.4 + k * 9) * (.5 + t * 1.9), 1.2),
        sprite(cool[0], cool[1], cool[2], 1),
        clamp(k * .30 * (1 - t) * (1 - t) * (1 + hot), 0, .55));
