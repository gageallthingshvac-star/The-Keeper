<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080c">
<title>Skyward — Flight Simulator</title>
<style>
  :root{
    --ink:#e8eef6; --dim:#9fb0c4; --accent:#6fd3ff; --warn:#ffb03a; --bad:#ff5a4d; --good:#6fe08a;
    --panel:rgba(8,14,22,.82); --edge:rgba(120,170,215,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#05080c;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;image-rendering:auto}
  .layer{position:absolute;inset:0;pointer-events:none}
  .modal{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;
    background:radial-gradient(1200px 700px at 50% 30%,rgba(18,40,64,.78),rgba(3,6,10,.94));
    backdrop-filter:blur(3px);pointer-events:auto;overflow:auto;padding:24px}
  .card{width:min(900px,96vw);margin:auto;background:var(--panel);border:1px solid var(--edge);
    border-radius:14px;padding:22px 24px 20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  h1{margin:0 0 2px;font-size:30px;letter-spacing:.20em;font-weight:600}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:12.5px;letter-spacing:.06em;margin-bottom:18px}
  h2{font-size:12px;letter-spacing:.20em;color:var(--dim);margin:18px 0 8px;font-weight:600;text-transform:uppercase}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .opt{flex:1 1 200px;min-width:190px;text-align:left;background:rgba(255,255,255,.04);
    border:1px solid var(--edge);border-radius:10px;padding:11px 13px;cursor:pointer;color:var(--ink);
    font:inherit;transition:background .12s,border-color .12s,transform .12s}
  .opt:hover{background:rgba(111,211,255,.10);border-color:rgba(111,211,255,.5)}
  .opt.on{background:rgba(111,211,255,.16);border-color:var(--accent)}
  .opt b{display:block;font-size:14px;letter-spacing:.06em;margin-bottom:3px}
  .opt i{font-style:normal;color:var(--dim);font-size:11.5px;line-height:1.45;display:block}
  .go{margin-top:20px;width:100%;padding:14px;font:inherit;font-size:15px;letter-spacing:.22em;
    background:linear-gradient(180deg,#1d6f96,#12475f);color:#fff;border:1px solid #5fc8f0;
    border-radius:10px;cursor:pointer}
  .go:hover{filter:brightness(1.15)}
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:4px 18px;
    font-size:11.5px;color:var(--dim);line-height:1.6}
  .keys kbd{display:inline-block;min-width:16px;text-align:center;padding:1px 5px;margin-right:6px;
    background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:4px;color:var(--ink);font-size:10.5px}
  .foot{margin-top:16px;font-size:11px;color:#68788c;letter-spacing:.05em}
  #toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);text-align:center;
    font-size:19px;letter-spacing:.12em;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .25s}
  #banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:40px;letter-spacing:.2em;
    text-shadow:0 4px 30px #000;opacity:0;transition:opacity .4s}
  .hide{display:none !important}
  #safe{position:fixed;top:0;left:0;width:0;height:0;pointer-events:none;visibility:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  html,body{overscroll-behavior:none;-webkit-touch-callout:none}
  canvas{touch-action:none}
  .modal{touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .modal{padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
         calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  @media (max-width:760px),(max-height:520px){
    .card{padding:15px 16px 14px;border-radius:12px}
    h1{font-size:22px;letter-spacing:.16em}
    .sub{font-size:11px;margin-bottom:12px}
    h2{font-size:10.5px;margin:12px 0 6px}
    .opt{flex:1 1 140px;min-width:130px;padding:9px 10px}
    .opt b{font-size:12px} .opt i{font-size:10.5px;line-height:1.35}
    .keys{font-size:10.5px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
    .go{padding:16px;font-size:14px;margin-top:14px}
    .foot{font-size:10px}
  }
  #touchNote{font-size:11.5px;color:var(--dim);line-height:1.6}
  #touchNote b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div id="safe"></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="layer"><div id="toast"></div><div id="banner"></div></div>

  <div class="modal" id="menu">
    <div class="card">
      <h1>SKY<span>WARD</span></h1>
      <div class="sub">single-engine flight simulator &mdash; software-rendered, no plugins</div>

      <h2>Flight controls</h2>
      <div class="row" id="modeRow">
        <button class="opt on" data-mode="simple"><b>SIMPLE</b><i>Stability assist flies the hard parts. Bank to turn, auto-coordinated rudder, stall protection, auto-trim. Forgiving landings.</i></button>
        <button class="opt" data-mode="complex"><b>COMPLEX</b><i>Full aerodynamics. Independent rudder, trim, flaps, gear, brakes, mixture-free prop. Real stalls, spins, p-factor, torque roll, crosswind.</i></button>
      </div>

      <h2>Flight</h2>
      <div class="row" id="scenRow">
        <button class="opt on" data-scen="free"><b>FREE FLIGHT</b><i>Start on runway 18 at Keeper Field. Go anywhere.</i></button>
        <button class="opt" data-scen="air"><b>AIRBORNE START</b><i>Already at 900 m, trimmed and fast.</i></button>
        <button class="opt" data-scen="rings"><b>RING RACE</b><i>12 gates through the valley, against the clock.</i></button>
        <button class="opt" data-scen="land"><b>LANDING CHALLENGE</b><i>4 km final approach, gear and flaps already set. Scored on centreline, sink rate and touchdown point.</i></button>
      </div>

      <h2 id="keyHead">Keys</h2>
      <div class="keys" id="keyList"></div>
      <div id="touchNote" class="hide"></div>

      <button class="go" id="startBtn">BEGIN FLIGHT</button>
      <div class="foot">Esc pauses &middot; R resets the aircraft &middot; H toggles this help in flight</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   SKYWARD — a single-file flight simulator.
   Everything is drawn with a hand-written 3D pipeline on a 2D canvas:
   view transform -> near-plane clip -> perspective project -> painter's fill.
   ========================================================================== */

/* ---------------------------------------------------------------- math ---- */
const TAU = Math.PI * 2, DEG = Math.PI / 180, RAD = 180 / Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const sstep = (a, b, x) => smooth(clamp((x - a) / (b - a), 0, 1));
const sign = Math.sign;
// exponential smoothing that is stable for any dt
const approach = (cur, tgt, rate, dt) => cur + (tgt - cur) * (1 - Math.exp(-rate * dt));

const v3 = (x = 0, y = 0, z = 0) => ({ x, y, z });
const vadd = (a, b) => v3(a.x + b.x, a.y + b.y, a.z + b.z);
const vsub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
const vmul = (a, s) => v3(a.x * s, a.y * s, a.z * s);
const vdot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const vcross = (a, b) => v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const vlen = a => Math.hypot(a.x, a.y, a.z);
const vnorm = a => { const l = vlen(a) || 1; return v3(a.x / l, a.y / l, a.z / l); };

/* Quaternion [w,x,y,z] rotating body vectors into world space.
   Body axes: +X right wing, +Y up through canopy, +Z out the nose (right-handed). */
const qId = () => [1, 0, 0, 0];
function qmul(a, b) {
  return [
    a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
    a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
    a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
    a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]];
}
function qnorm(q) {
  const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  q[0] /= l; q[1] /= l; q[2] /= l; q[3] /= l; return q;
}
function qAxis(ax, ay, az, ang) {
  const h = ang * .5, s = Math.sin(h), l = Math.hypot(ax, ay, az) || 1;
  return [Math.cos(h), ax / l * s, ay / l * s, az / l * s];
}
/* 3x3 matrix, column-major triples: m[0..2]=body X in world, m[3..5]=Y, m[6..8]=Z */
function qMat(q, m) {
  const w = q[0], x = q[1], y = q[2], z = q[3];
  const xx = x * x, yy = y * y, zz = z * z, xy = x * y, xz = x * z, yz = y * z,
    wx = w * x, wy = w * y, wz = w * z;
  m[0] = 1 - 2 * (yy + zz); m[1] = 2 * (xy + wz); m[2] = 2 * (xz - wy);
  m[3] = 2 * (xy - wz); m[4] = 1 - 2 * (xx + zz); m[5] = 2 * (yz + wx);
  m[6] = 2 * (xz + wy); m[7] = 2 * (yz - wx); m[8] = 1 - 2 * (xx + yy);
  return m;
}
const mRot = (m, v) => v3(
  m[0] * v.x + m[3] * v.y + m[6] * v.z,
  m[1] * v.x + m[4] * v.y + m[7] * v.z,
  m[2] * v.x + m[5] * v.y + m[8] * v.z);
const mRotT = (m, v) => v3(     // inverse rotation (transpose)
  m[0] * v.x + m[1] * v.y + m[2] * v.z,
  m[3] * v.x + m[4] * v.y + m[5] * v.z,
  m[6] * v.x + m[7] * v.y + m[8] * v.z);
/* Integrate an orientation quaternion by a body-frame angular velocity. */
function qIntegrate(q, w, dt) {
  const d = [0, w.x * dt * .5, w.y * dt * .5, w.z * dt * .5];
  const r = qmul(q, [1, d[1], d[2], d[3]]);
  return qnorm(r);
}
/* Euler read-outs for the instruments (aviation convention). */
function eulerOf(m) {
  const fwd = v3(m[6], m[7], m[8]), up = v3(m[3], m[4], m[5]);
  const pitch = Math.asin(clamp(fwd.y, -1, 1));
  const hdg = Math.atan2(fwd.x, fwd.z);
  // roll: angle of the wing plane about the nose axis
  const rightLevel = vnorm(vcross(v3(0, 1, 0), fwd));
  const upLevel = vcross(fwd, rightLevel);
  const roll = Math.atan2(vdot(up, rightLevel), vdot(up, upLevel)); // +ve = right bank
  return { pitch, hdg: (hdg + TAU) % TAU, roll };
}

/* --------------------------------------------------------------- colour --- */
const rgb = (r, g, b) => "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
function mixc(c1, c2, t) { return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }
function shade(c, k) { return [clamp(c[0] * k, 0, 255), clamp(c[1] * k, 0, 255), clamp(c[2] * k, 0, 255)]; }

/* ----------------------------------------------------------- value noise -- */
function hash2(i, j) {
  let n = (i * 374761393 + j * 668265263) | 0;
  n = (n ^ (n >> 13)) | 0; n = Math.imul(n, 1274126177);
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = smooth(xf), v = smooth(yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct) {
  let s = 0, a = .5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f); n += a; a *= .5; f *= 2.03; }
  return s / n;
}

/* ================================================================ world == */
const WORLD = {
  sea: 0,                       // water surface height (m)
  fieldElev: 16,                // airport elevation (m)
  fieldR: 2400,                 // radius of flattened airport basin
  rwyLen: 1900, rwyW: 46,       // runway 18/36, aligned with the Z (north) axis
  sun: vnorm(v3(-.40, .55, .73)),
  ground: [82, 104, 60],
};

/* Lighting: one directional sun plus a hemisphere ambient (cool light from the
   sky above, warm bounce from the ground below). Everything in the scene is
   shaded through this, which is what makes surfaces read as the same material
   under the same sky. Distance is handled as aerial perspective rather than
   flat fog: the haze warms up toward the sun and stays blue away from it. */
const LIGHT = {
  sun: null,
  sunCol: [1.08, 1.00, .86],
  skyCol: [.34, .42, .56],
  gndCol: [.24, .23, .17],
  hazeNear: [178, 199, 222],    // horizon haze away from the sun
  hazeSun: [248, 234, 204],     // haze looking into the sun
  hazeHigh: [120, 150, 190],    // what distance does to things above the horizon
  density: 1 / 15000,
  zenith: [34, 82, 156], mid: [108, 160, 212]
};
LIGHT.sun = WORLD.sun;

/* Shade a base colour by a world-space normal. */
function litColor(col, nx, ny, nz) {
  const L = LIGHT, s = Math.max(nx * L.sun.x + ny * L.sun.y + nz * L.sun.z, 0);
  const sky = .5 + .5 * ny, gnd = .5 - .5 * ny;
  return [col[0] * (L.sunCol[0] * s + L.skyCol[0] * sky + L.gndCol[0] * gnd),
          col[1] * (L.sunCol[1] * s + L.skyCol[1] * sky + L.gndCol[1] * gnd),
          col[2] * (L.sunCol[2] * s + L.skyCol[2] * sky + L.gndCol[2] * gnd)];
}
/* Aerial perspective. `v` is the normalised world direction from eye to point. */
function aerial(col, dist, vx, vy, vz) {
  const L = LIGHT;
  const f = 1 - Math.exp(-dist * L.density);
  if (f < .004) return rgb(col[0], col[1], col[2]);
  const cs = clamp(vx * L.sun.x + vy * L.sun.y + vz * L.sun.z, 0, 1);
  const up = clamp(vy * 2.2, 0, 1);
  const h0 = lerp(L.hazeNear[0], L.hazeHigh[0], up), h1 = lerp(L.hazeNear[1], L.hazeHigh[1], up),
    h2 = lerp(L.hazeNear[2], L.hazeHigh[2], up);
  const mie = Math.pow(cs, 5) * .85;
  return rgb(
    lerp(col[0], lerp(h0, L.hazeSun[0], mie), f),
    lerp(col[1], lerp(h1, L.hazeSun[1], mie), f),
    lerp(col[2], lerp(h2, L.hazeSun[2], mie), f));
}

/* Terrain height at any point. Mountains ring a flat basin holding the field. */
function terrainH(x, z, cell) {
  const d = Math.hypot(x, z);
  const basin = 1 - sstep(WORLD.fieldR, WORLD.fieldR * 2.8, d);
  let m = fbm(x / 2600, z / 2600, 5);
  m = Math.pow(clamp(m, 0, 1), 2.25);
  let h = m * 1500 - 95;
  // a lake to the east keeps the terrain from feeling uniform
  const lake = sstep(2600, 1200, Math.hypot(x - 6200, z + 2300));
  h = lerp(h, -30, lake * .9);
  // Fine relief is dropped once the sampling grid is coarser than the feature:
  // sampled at 500 m intervals it aliases into a checkerboard of hills and
  // hollows. `cell` is the grid spacing the caller is using; physics and trees
  // omit it and always get the full detail.
  const det = cell ? clamp(1 - (cell - 110) / 260, 0, 1) : 1;
  if (det > 0) h += fbm(x / 340, z / 340, 3) * 24 * (1 - basin * .8) * det;
  return lerp(h, WORLD.fieldElev, basin);
}
/* Cheap normal by finite difference. */
function terrainN(x, z, e) {
  e = e || 6;
  const hl = terrainH(x - e, z), hr = terrainH(x + e, z);
  const hd = terrainH(x, z - e), hu = terrainH(x, z + e);
  return vnorm(v3(hl - hr, 2 * e, hd - hu));
}
const onRunway = (x, z) => Math.abs(x) < WORLD.rwyW * .5 + 1 && Math.abs(z) < WORLD.rwyLen * .5;
/* Footprint of the paved airfield. The runway is coplanar with the terrain, so
   a centroid depth sort alone lets nearer ground quads paint over it. Terrain
   inside this box is pushed back in the order instead, which settles it
   without disturbing how anything else sorts against the ground. */
const inField = (x, z) => x > -260 && x < 440 && Math.abs(z) < 1100;
const FIELD_PUSH = 400;
/* Height used for contact: runway and apron are perfectly flat. */
function groundH(x, z) {
  if (onRunway(x, z)) return WORLD.fieldElev;
  if (Math.abs(x - 225) < 108 && Math.abs(z - 650) < 132) return WORLD.fieldElev; // apron
  return terrainH(x, z);
}
function terrainColor(h, slope, x, z) {
  const rock = sstep(.34, .64, slope);
  const snow = sstep(900, 1180, h) * (1 - rock * .45) * sstep(.62, .30, slope);
  const dry = sstep(150, 640, h);
  const scrub = sstep(520, 980, h);
  // meadow -> dry upland -> alpine scrub, with rock on anything steep
  let c = mixc([78, 112, 56], [134, 126, 78], dry);
  c = mixc(c, [96, 104, 74], scrub * .7);
  c = mixc(c, [108, 102, 96], rock);
  c = mixc(c, mixc([120, 112, 104], [86, 82, 80], sstep(.5, .8, slope)), rock * .4);
  c = mixc(c, [240, 246, 252], snow);
  // a narrow beach where the land meets the water
  c = mixc(c, [182, 170, 138], sstep(5, .5, h) * (1 - rock) * .85);
  // field-sized patchwork, plus a gentle regional tint
  const v = (fbm(x / 190, z / 190, 2) - .5) * .30 + (fbm(x / 3200, z / 3200, 2) - .5) * .10;
  return shade(c, 1 + v);
}

/* ============================================================== renderer == */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false, desynchronized: true });
let W = 0, H = 0, CX = 0, CY = 0, F = 800, DPR = 1;
const NEAR = 0.30;
let FOV = 62 * DEG, FOVBASE = 62 * DEG;

const COARSE = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
const MOBILE = COARSE || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || "");

/* Quality ladder. Phones start two rungs down and the frame timer moves the
   dial at runtime, so a 60 Hz phone and a desktop both stay smooth. */
const QLEVELS = [
  { dpr: 1.00, lev: 4, half: 6, base: 78, trees: .22, treeR: 750, clouds: 7000, glare: 0, vig: 0, shadow: 1 },
  { dpr: 1.25, lev: 5, half: 6, base: 68, trees: .30, treeR: 950, clouds: 10000, glare: 1, vig: 1, shadow: 1 },
  { dpr: 1.50, lev: 5, half: 7, base: 62, trees: .38, treeR: 1150, clouds: 13000, glare: 1, vig: 1, shadow: 1 },
  { dpr: 2.00, lev: 6, half: 7, base: 58, trees: .44, treeR: 1350, clouds: 16000, glare: 1, vig: 1, shadow: 1 }
];
const Q = { i: MOBILE ? 1 : 3, auto: true, work: 9, hold: 0, q: QLEVELS[MOBILE ? 1 : 3] };

function applyQuality() {
  Q.q = QLEVELS[Q.i];
  resize();
}
/* Tuned on the time spent inside the frame, not the frame interval: vsync
   pins the interval at 16.7 ms whatever the load, so it can never show headroom. */
function tuneQuality(dt, workMs) {
  Q.work += (workMs - Q.work) * .06;
  if (!Q.auto || !GAME.started || GAME.paused) return;
  Q.hold -= dt;
  if (Q.hold > 0) return;
  if (Q.work > 11.5 && Q.i > 0) { Q.i--; Q.hold = 2.5; applyQuality(); }
  else if (Q.work < 6.5 && Q.i < QLEVELS.length - 1) { Q.i++; Q.hold = 4; applyQuality(); }
}

let PORTRAIT = false, UI = 1;
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
function readSafe() {
  const el = document.getElementById("safe");
  if (!el) return;
  const cs = getComputedStyle(el);
  SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0;
  SAFE.b = parseFloat(cs.paddingBottom) || 0; SAFE.l = parseFloat(cs.paddingLeft) || 0;
}
function resize() {
  const cw = cv.clientWidth || window.innerWidth, ch = cv.clientHeight || window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, Q.q.dpr);
  W = Math.max(2, Math.round(cw * DPR)); H = Math.max(2, Math.round(ch * DPR));
  cv.width = W; cv.height = H; CX = W / 2; CY = H / 2;
  PORTRAIT = H > W;
  readSafe();
  // HUD scale: proportional to the canvas, then boosted on a physically small
  // screen so the numbers stay readable at arm's length
  UI = (H / 900) * clamp(640 / Math.max(H / DPR, 1), 1, 2);
  // a phone held upright has almost no horizontal view, so widen the lens
  FOVBASE = (PORTRAIT ? 78 : MOBILE ? 68 : 62) * DEG;
  FOV = FOVBASE;
  F = (H * .5) / Math.tan(FOV * .5);
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  makeVignette();
  if (typeof layoutTouch === "function") layoutTouch();
}
window.addEventListener("resize", resize);

/* vignette + lens dirt, baked once per resize */

  g.addColorStop(0, "rgba(0,0,0,0)");

/* camera */
const cam = { pos: v3(), m: new Float32Array(9), roll: 0, pitch: 0, shake: 0 };

    gr.addColorStop(0, rgba(.95)); gr.addColorStop(.58, rgba(.46));
    gr.addColorStop(.86, rgba(.10)); gr.addColorStop(1, rgba(0));
  } else if (profile === 1) {     // smoke / dust / fire
    gr.addColorStop(0, rgba(1)); gr.addColorStop(.45, rgba(.55)); gr.addColorStop(1, rgba(0));
  } else if (profile === 2) {     // propeller disc: bright rim, clear centre

/* ---- display list: every polygon in the scene, sorted back-to-front ---- */
const DLMAX = 9000;
const DL = {
  n: 0, kind: new Uint8Array(DLMAX), depth: new Float64Array(DLMAX),
  off: new Int32Array(DLMAX), cnt: new Int32Array(DLMAX),
  fill: new Array(DLMAX), stroke: new Array(DLMAX), lw: new Float32Array(DLMAX),
  pts: new Float32Array(DLMAX * 10), pn: 0,
  order: new Int32Array(DLMAX),
  reset() { this.n = 0; this.pn = 0; },
  poly(depth, sp, count, fill, stroke, lw) {
    if (this.n >= DLMAX || this.pn + count * 2 > this.pts.length) return;
    const i = this.n++;
    this.kind[i] = 0; this.depth[i] = depth; this.off[i] = this.pn; this.cnt[i] = count;
    this.fill[i] = fill; this.stroke[i] = stroke || null; this.lw[i] = lw || 1;
    for (let k = 0; k < count * 2; k++) this.pts[this.pn++] = sp[k];
  },
  sprite(depth, x, y, r, img, alpha) {
    if (this.n >= DLMAX || this.pn + 4 > this.pts.length) return;
    const i = this.n++;
    this.kind[i] = 1; this.depth[i] = depth; this.off[i] = this.pn; this.cnt[i] = 1;
    this.fill[i] = img; this.stroke[i] = null;
    this.pts[this.pn++] = x; this.pts[this.pn++] = y; this.pts[this.pn++] = r;
    this.pts[this.pn++] = alpha === undefined ? 1 : alpha;
  },
  flush() {
    const n = this.n, ord = this.order;
    for (let i = 0; i < n; i++) ord[i] = i;
    const sub = ord.subarray(0, n);
    Array.prototype.sort.call(sub, (a, b) => this.depth[b] - this.depth[a]);
    for (let k = 0; k < n; k++) {
      const i = sub[k], o = this.off[i];
      if (this.kind[i] === 1) {
        const r = this.pts[o + 2], a = this.pts[o + 3];
        if (r < .4 || a < .012) continue;
        ctx.globalAlpha = a > 1 ? 1 : a;
        ctx.drawImage(this.fill[i], this.pts[o] - r, this.pts[o + 1] - r, r * 2, r * 2);
        ctx.globalAlpha = 1;
        continue;
      }
      const c = this.cnt[i];
      ctx.beginPath();
      ctx.moveTo(this.pts[o], this.pts[o + 1]);
      for (let p = 1; p < c; p++) ctx.lineTo(this.pts[o + p * 2], this.pts[o + p * 2 + 1]);
      ctx.closePath();
      if (this.fill[i]) { ctx.fillStyle = this.fill[i]; ctx.fill(); }
      if (this.stroke[i]) { ctx.strokeStyle = this.stroke[i]; ctx.lineWidth = this.lw[i]; ctx.stroke(); }

/* fog toward the horizon colour */

  const f = 1 - Math.exp(-dist * LIGHT.density);

/* --------------------------------------------------------------- sky ----- */
/* The sky is a rotated gradient anchored to the true horizon line, plus the
   sun's Mie halo. Its horizon colour is exactly the haze colour used by aerial
   perspective, so distant terrain dissolves into the sky with no visible seam. */
function drawSky() {
  const e = eulerOf(cam.m);
  const pitch = clamp(e.pitch, -1.45, 1.45);
  const yOff = F * Math.tan(pitch);
  const R = Math.hypot(W, H) * 1.3;
  const L = LIGHT;
  // how much the camera is looking into the sun, for the horizon warm-up
  const fwd = v3(cam.m[6], cam.m[7], cam.m[8]);
  const toSun = clamp(vdot(fwd, L.sun), 0, 1);
  const warm = Math.pow(toSun, 3);
  const horizon = mixc(L.hazeNear, L.hazeSun, warm * .55);
  // thinner air with altitude: the zenith darkens as you climb
  const alt = clamp(cam.pos.y / 9000, 0, 1);
  const zen = mixc(L.zenith, [14, 36, 92], alt);

  ctx.save();
  ctx.translate(CX, CY); ctx.rotate(-e.roll);
  const g = ctx.createLinearGradient(0, yOff - R, 0, yOff + 2);
  g.addColorStop(0, rgb(...zen));
  g.addColorStop(.42, rgb(...mixc(zen, L.mid, .72)));
  g.addColorStop(.72, rgb(...L.mid));
  g.addColorStop(.90, rgb(...mixc(L.mid, horizon, .72)));
  g.addColorStop(1, rgb(...horizon));
  ctx.fillStyle = g; ctx.fillRect(-R, yOff - R, R * 2, R);
  // below the horizon: haze fading into distant ground colour
  const g2 = ctx.createLinearGradient(0, yOff, 0, yOff + R * .40);
  g2.addColorStop(0, rgb(...horizon));
  g2.addColorStop(.30, rgb(...mixc(horizon, WORLD.ground, .5)));
  g2.addColorStop(1, rgb(...mixc(shade(WORLD.ground, .92), horizon, .18)));
  ctx.fillStyle = g2; ctx.fillRect(-R, yOff, R * 2, R);
  ctx.restore();

  // sun: halo, then the disc itself
  const sp = projectPoint(vadd(cam.pos, vmul(L.sun, 9000)));
  if (sp) {
    const big = Math.max(W, H);
    const gl = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, big * .46);
    gl.addColorStop(0, "rgba(255,250,228,.85)");
    gl.addColorStop(.035, "rgba(255,246,214,.42)");
    gl.addColorStop(.12, "rgba(255,240,206,.16)");
    gl.addColorStop(.42, "rgba(250,236,210,.05)");
    gl.addColorStop(1, "rgba(250,238,214,0)");
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
    const rd = big * .016;
    const gd = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, rd);
    gd.addColorStop(0, "rgba(255,255,248,1)");
    gd.addColorStop(.62, "rgba(255,252,232,.96)");
    gd.addColorStop(1, "rgba(255,244,214,0)");
    ctx.fillStyle = gd;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, rd, 0, TAU); ctx.fill();
  }
}

/* anamorphic glare streaks, drawn over the scene when the sun is in frame */
function drawGlare() {
  if (!Q.q.glare) return;
  const sp = projectPoint(vadd(cam.pos, vmul(LIGHT.sun, 9000)));
  if (!sp || sp.x < -W * .4 || sp.x > W * 1.4 || sp.y < -H * .4 || sp.y > H * 1.4) return;
  const big = Math.max(W, H);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.translate(sp.x, sp.y);
  for (const [ang, len, wid, a] of [[0, .40, .012, .20], [Math.PI / 2, .13, .010, .10], [.7, .22, .006, .07]]) {
    ctx.save(); ctx.rotate(ang);
    const g = ctx.createLinearGradient(-big * len, 0, big * len, 0);
    g.addColorStop(0, "rgba(255,240,206,0)");
    g.addColorStop(.5, "rgba(255,246,222," + a + ")");
    g.addColorStop(1, "rgba(255,240,206,0)");
    ctx.fillStyle = g;
    ctx.fillRect(-big * len, -big * wid, big * len * 2, big * wid * 2);
    ctx.restore();
  }

/* --------------------------------------------------------------- terrain - */
const _hg = new Float32Array(19 * 19);
function drawTerrain() {
  const LEV = Q.q.lev, base = Q.q.base, half = Q.q.half, span = half * 2 + 1;
  const sunv = LIGHT.sun;
  const cm = cam.m;
  const inflate = SEAM_PX * DPR;
  for (let L = LEV - 1; L >= 0; L--) {
    const cell = base * (1 << L);
    const gx = Math.round(cam.pos.x / cell), gz = Math.round(cam.pos.z / cell);
    for (let j = 0; j <= span - 1; j++) {
      const wz = (gz - half + j) * cell;
      for (let i = 0; i <= span - 1; i++) {
        _hg[j * span + i] = terrainH((gx - half + i) * cell, wz, cell);
      }
    }
    const lodBias = L * 140;
    for (let j = 0; j < span - 1; j++) {
      for (let i = 0; i < span - 1; i++) {
        const ax = Math.max(Math.abs(i - half + .5), Math.abs(j - half + .5));
        if (L > 0 && ax < 2.9) continue;            // finer ring covers this, with overlap
        const x0 = (gx - half + i) * cell, z0 = (gz - half + j) * cell;
        const x1 = x0 + cell, z1 = z0 + cell;
        let h00 = _hg[j * span + i], h10 = _hg[j * span + i + 1],
          h01 = _hg[(j + 1) * span + i], h11 = _hg[(j + 1) * span + i + 1];
        const mcx = x0 + cell * .5, mcz = z0 + cell * .5;
        const dx = mcx - cam.pos.x, dz = mcz - cam.pos.z;
        const dist = Math.hypot(dx, dz);
        if (dist > cell * 11 + 400) continue;
        const push = inField(mcx, mcz) ? FIELD_PUSH : 0;
        // how flooded this patch is, from its mean height rather than a corner
        // count, which would alternate between neighbours and read as a checkerboard
        const hRaw = (h00 + h10 + h01 + h11) * .25;
        const wetF = sstep(4, -7, hRaw);
        const water = wetF > .02;
        if (h00 < 0 || h10 < 0 || h01 < 0 || h11 < 0) {
          h00 = Math.max(h00, 0); h10 = Math.max(h10, 0); h01 = Math.max(h01, 0); h11 = Math.max(h11, 0);
        }
        _vp[0] = x0; _vp[1] = h00; _vp[2] = z0;
        _vp[3] = x1; _vp[4] = h10; _vp[5] = z0;
        _vp[6] = x1; _vp[7] = h11; _vp[8] = z1;
        _vp[9] = x0; _vp[10] = h01; _vp[11] = z1;
        // world -> view in place
        let anyFront = false, dmin = 1e9;
        for (let k = 0; k < 4; k++) {
          const px = _vp[k * 3] - cam.pos.x, py = _vp[k * 3 + 1] - cam.pos.y, pz = _vp[k * 3 + 2] - cam.pos.z;
          const vx = cm[0] * px + cm[1] * py + cm[2] * pz;
          const vy = cm[3] * px + cm[4] * py + cm[5] * pz;
          const vz = cm[6] * px + cm[7] * py + cm[8] * pz;
          _vp[k * 3] = vx; _vp[k * 3 + 1] = vy; _vp[k * 3 + 2] = vz;
          if (vz >= NEAR) anyFront = true;
          if (vz < dmin) dmin = vz;

        const m = clipProject(4);
        if (m < 3 || offscreen(m)) continue;

        const nl = Math.hypot(nxr, cell, nzr);
        const nx = nxr / nl, ny = cell / nl, nz = nzr / nl;
        const slope = 1 - ny;
        const hAvg = (h00 + h10 + h01 + h11) * .25;
        // direction from the eye to this patch, for aerial perspective
        const dy = hAvg - cam.pos.y;
        const d3 = Math.hypot(dx, dy, dz) || 1;
        const ex = dx / d3, ey = dy / d3, ez = dz / d3;
        let col;
        if (water) {
          // Fresnel: water is dark looking down into it and mirror-bright at a
          // grazing angle, where it picks up the sky
          const cosi = clamp(-ey, 0, 1);
          const fres = .03 + .97 * Math.pow(1 - cosi, 5);
          const skyRefl = mixc(LIGHT.mid, LIGHT.hazeNear, .45);
          col = mixc([22, 52, 76], skyRefl, clamp(fres, 0, .92));
          // specular glitter where the reflected sun lines up with the view
          const rx = ex, ry = -ey, rz = ez;
          const g = Math.pow(clamp(rx * sunv.x + ry * sunv.y + rz * sunv.z, 0, 1), 64);
          const chop = .5 + .5 * Math.sin(mcx * .06 + mcz * .045 + WIND.t * 1.7);

          // the shoreline fades from wet sand into open water
          if (wetF < 1) col = mixc(litColor(terrainColor(1.5, slope, mcx, mcz), nx, ny, nz), col, wetF);
        } else {
          col = litColor(terrainColor(hAvg, slope, mcx, mcz), nx, ny, nz);
        }
        const fill = aerial(col, Math.max(dist, dmin), ex, ey, ez);
        // adjacent fills leave hairline gaps from antialiasing; grow each quad a
        // fraction of a pixel instead of paying for a stroke on every one
        if (inflate > 0) grow(m, inflate);
        DL.poly(dist + lodBias + push, _sp, m, fill, null, 0);
      }
    }
  }
}

/* ========================================================= mesh plumbing == */
function mmul(A, B) {   // column-major 3x3 product A*B

    const bx = B[c * 3], by = B[c * 3 + 1], bz = B[c * 3 + 2];
    o[c * 3] = A[0] * bx + A[3] * by + A[6] * bz;

    quad(p0, p1, p2, p3, col, o) {
      const a = this.vt(p0[0], p0[1], p0[2]), b = this.vt(p1[0], p1[1], p1[2]),
        c = this.vt(p2[0], p2[1], p2[2]), d = this.vt(p3[0], p3[1], p3[2]);
      this.f.push(Object.assign({ i: [a, b, c, d], c: col }, o || {}));
    },
    tri(p0, p1, p2, col, o) {
      const a = this.vt(p0[0], p0[1], p0[2]), b = this.vt(p1[0], p1[1], p1[2]), c = this.vt(p2[0], p2[1], p2[2]);
      this.f.push(Object.assign({ i: [a, b, c], c: col }, o || {}));
    },
    box(cx, cy, cz, sx, sy, sz, col, o) {
      const X = sx / 2, Y = sy / 2, Z = sz / 2;
      const p = (a, b, c) => [cx + a * X, cy + b * Y, cz + c * Z];
      this.quad(p(-1, 1, 1), p(1, 1, 1), p(1, 1, -1), p(-1, 1, -1), shade(col, 1.06), o);
      this.quad(p(-1, -1, -1), p(1, -1, -1), p(1, -1, 1), p(-1, -1, 1), shade(col, .80), o);
      this.quad(p(-1, -1, 1), p(1, -1, 1), p(1, 1, 1), p(-1, 1, 1), col, o);
      this.quad(p(1, -1, -1), p(-1, -1, -1), p(-1, 1, -1), p(1, 1, -1), shade(col, .88), o);
      this.quad(p(1, -1, 1), p(1, -1, -1), p(1, 1, -1), p(1, 1, 1), shade(col, .96), o);
      this.quad(p(-1, -1, -1), p(-1, -1, 1), p(-1, 1, 1), p(-1, 1, -1), shade(col, .96), o);

    disc(cx, cy, cz, r, n, axis, col, o) {  // axis 0=x 1=y 2=z

  const cm = cam.m, cp = cam.pos;

    let cxv = 0, cyv = 0, czv = 0, front = false, dmin = 1e9;
    for (let k = 0; k < n; k++) {
      const o = idx[k] * 3;
      _vp[k * 3] = _mv[o]; _vp[k * 3 + 1] = _mv[o + 1]; _vp[k * 3 + 2] = _mv[o + 2];
      cxv += _mv[o]; cyv += _mv[o + 1]; czv += _mv[o + 2];
      if (_mv[o + 2] >= NEAR) front = true;
      if (_mv[o + 2] < dmin) dmin = _mv[o + 2];
    }
    if (!front) continue;
    cxv /= n; cyv /= n; czv /= n;
    // world-space normal, for lighting and back-face rejection
    const a = idx[0] * 3, b = idx[1] * 3, c = idx[2] * 3;
    const e1x = _mw[b] - _mw[a], e1y = _mw[b + 1] - _mw[a + 1], e1z = _mw[b + 2] - _mw[a + 2];
    const e2x = _mw[c] - _mw[a], e2y = _mw[c + 1] - _mw[a + 1], e2z = _mw[c + 2] - _mw[a + 2];
    let nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
    const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    // view direction to the face (world space)
    const vx = (_mw[a] + _mw[b] + _mw[c]) / 3 - cam.pos.x;
    const vy = (_mw[a + 1] + _mw[b + 1] + _mw[c + 1]) / 3 - cam.pos.y;
    const vz = (_mw[a + 2] + _mw[b + 2] + _mw[c + 2]) / 3 - cam.pos.z;
    const facing = nx * vx + ny * vy + nz * vz;
    if (facing > 0) { if (!fc.two) continue; nx = -nx; ny = -ny; nz = -nz; }
    const m = clipProject(n);
    if (m < 3 || offscreen(m)) continue;
    let col = fc.c;
    if (tint) col = mixc(col, tint, .55);
    const dist = Math.hypot(cxv, cyv, czv) || 1;
    const ex = vx / dist, ey = vy / dist, ez = vz / dist;   // eye -> surface
    let c2 = litColor(col, nx, ny, nz);
    // Blinn-Phong highlight: paint and glass both catch the sun
    const sh = fc.spec;
    if (sh) {
      const hx = LIGHT.sun.x - ex, hy = LIGHT.sun.y - ey, hz = LIGHT.sun.z - ez;
      const hl = Math.hypot(hx, hy, hz) || 1;
      const sp2 = Math.pow(clamp((nx * hx + ny * hy + nz * hz) / hl, 0, 1), fc.gloss || 30) * sh;
      c2 = [c2[0] + sp2 * 235, c2[1] + sp2 * 232, c2[2] + sp2 * 215];
      // sky reflection at grazing angles gives curved metal its sheen
      const fres = Math.pow(1 - clamp(-(nx * ex + ny * ey + nz * ez), 0, 1), 4) * .30 * sh;
      c2 = [c2[0] + fres * LIGHT.mid[0], c2[1] + fres * LIGHT.mid[1], c2[2] + fres * LIGHT.mid[2]];
    }
    const alpha = (fc.alpha !== undefined ? fc.alpha : 1) * (alphaFade !== undefined ? alphaFade : 1);
    let fill;
    if (alpha < .999) {
      const f = 1 - Math.exp(-dist * LIGHT.density);
      const cc = mixc(c2, fogCol, f);
      fill = "rgba(" + (clamp(cc[0], 0, 255) | 0) + "," + (clamp(cc[1], 0, 255) | 0) + "," +
        (clamp(cc[2], 0, 255) | 0) + "," + alpha.toFixed(3) + ")";
    } else {
      fill = aerial([clamp(c2[0], 0, 255), clamp(c2[1], 0, 255), clamp(c2[2], 0, 255)], dist, ex, ey, ez);
    }
    DL.poly(dist - (fc.bias || 0), _sp, m, fill,
      fc.edge ? aerial([clamp(c2[0] * .76, 0, 255), clamp(c2[1] * .76, 0, 255), clamp(c2[2] * .76, 0, 255)], dist, ex, ey, ez) : null,
      Math.max(1, .9 * DPR));
  }
}

/* ======================================================= aircraft model == */
const LIV = {
  top: [48, 66, 94], side: [98, 118, 146], belly: [176, 184, 193],
  red: [178, 52, 44], yellow: [226, 194, 84], dark: [34, 40, 50],
  metal: [150, 158, 168], rubber: [38, 38, 42], glass: [150, 196, 226]

const TWO = { two: true };
const SPEC = { two: true, spec: .9 };

function buildAircraft() {
  const P = {};
  /* ---- fuselage: lathe of elliptical stations ---- */
  {
    const mb = MB();
    const st = [
      [-4.75, .09, .13, .30], [-4.10, .17, .22, .27], [-3.30, .27, .34, .22],
      [-2.30, .40, .47, .14], [-1.20, .52, .60, .06], [-.10, .60, .67, .01],
      [1.00, .59, .65, .00], [1.95, .54, .60, .03], [2.70, .46, .50, .05],
      [3.25, .38, .40, .06], [3.62, .30, .31, .06]
    ];
    const N = 12;
    const pt = (s, k) => {
      const a = k / N * TAU;
      return [s[1] * Math.sin(a), s[3] + s[2] * Math.cos(a), s[0]];
    };
    for (let i = 0; i < st.length - 1; i++) {
      for (let k = 0; k < N; k++) {
        const a = k / N * TAU, up = Math.cos(a);
        let col = up > .45 ? LIV.top : up < -.45 ? LIV.belly : LIV.side;
        col = mixc(col, up > .45 ? LIV.top : LIV.side, .15);

        if (st[i][0] < -3.25) col = mixc(col, LIV.red, .85);
        if (st[i][0] > 3.2) col = mixc(col, LIV.yellow, .75);

    mb.box(.34, -.05, 2.55, .12, .10, .7, LIV.dark, TWO);

      for (let k = 0; k < 6; k++) {

    };

      let prev = sect(side, 0);
      for (let s2 = 1; s2 <= 3; s2++) {
        const cur = sect(side, s2 / 3);
        for (let k = 0; k < 4; k++) {
          const k2 = (k + 1) % 4;
          const up = k === 0 || k === 1;
          const col = up ? mixc(LIV.top, LIV.side, .4) : LIV.belly;
          mb.quad(prev[k], prev[k2], cur[k2], cur[k], col, SPEC);
        }
        prev = cur;
      }
      mb.quad(prev[0], prev[1], prev[2], prev[3], mixc(LIV.red, LIV.side, .3), TWO);
    }
    // fin
    const fz = -3.15;
    const fin = [[0, .34, fz + .35], [0, 1.05, fz - .12], [0, 1.72, fz - .55], [0, 1.72, fz - 1.05], [0, .34, fz - 1.05]];
    for (const sx of [-.055, .055]) {
      for (let k = 1; k < fin.length - 1; k++)
        mb.tri([sx, fin[0][1], fin[0][2]], [sx, fin[k][1], fin[k][2]], [sx, fin[k + 1][1], fin[k + 1][2]], mixc(LIV.red, LIV.top, .25), SPEC);
    }
    for (let k = 0; k < fin.length; k++) {
      const a = fin[k], b = fin[(k + 1) % fin.length];
      mb.quad([-.055, a[1], a[2]], [.055, a[1], a[2]], [.055, b[1], b[2]], [-.055, b[1], b[2]], mixc(LIV.red, LIV.side, .15), TWO);
    }

  }
  /* ---- elevator & rudder as hinged plates ---- */

    const mb = MB(), th = .05, zH = -4.05;
    for (const side of [1, -1]) {
      const xo = side * .14, xt = side * 2.2;
      mb.quad([xo, .16 + th, zH], [xt, .30 + th, zH - .28], [xt, .30, zH - .28 - .36], [xo, .16, zH - .60], mixc(LIV.side, [255, 255, 255], .1), TWO);
      mb.quad([xo, .16 - th, zH], [xo, .16, zH - .60], [xt, .30, zH - .28 - .36], [xt, .30 - th, zH - .28], shade(LIV.side, .82), TWO);
    }
    P.elev = { mesh: mb.done(), pivot: [0, .16, zH] };
  }
  {
    const mb = MB(), th = .05, zH = -4.20;
    const pr = [[0, .34, zH], [0, 1.02, zH - .10], [0, 1.68, zH - .22], [0, 1.68, zH - .50], [0, .34, zH - .80]];
    for (const s of [th, -th]) {
      for (let k = 1; k < pr.length - 1; k++)
        mb.tri([s, pr[0][1], pr[0][2]], [s, pr[k][1], pr[k][2]], [s, pr[k + 1][1], pr[k + 1][2]], mixc(LIV.red, LIV.side, .2), TWO);
    }

      const a = pr[k], b = pr[(k + 1) % pr.length];

    const st = [[2.10, .26, .16], [1.60, .42, .34], [.85, .47, .42], [.10, .45, .40], [-.55, .34, .26], [-1.10, .20, .10]];
    const N = 6, base = .50;
    const pt = (s, k) => { const a = -Math.PI / 2 + k / N * Math.PI; return [s[1] * Math.sin(a), base + s[2] * Math.cos(a), s[0]]; };
    for (let i = 0; i < st.length - 1; i++)
      for (let k = 0; k < N; k++)
        mb.quad(pt(st[i], k), pt(st[i], k + 1), pt(st[i + 1], k + 1), pt(st[i + 1], k), LIV.glass, { two: true, spec: .75, gloss: 60, alpha: .46 });

    const mb2 = MB();
    mb2.box(0, .58, .95, .96, .30, 1.9, LIV.dark, TWO);  // cockpit interior shell
    mb2.box(0, .72, .30, .48, .34, .30, [58, 48, 42], TWO); // seat back
    mb2.box(0, .70, 1.75, .70, .26, .22, [26, 28, 32], TWO); // panel

    }

      mb2.quad(p(.24, w0, -.05), p(L, w1, .06), p(L, -w1, -.02), p(.24, -w0, -.10), LIV.dark, { two: true, spec: .2 });

         so the nose is shaped and lit exactly as it is from outside ---- */

    // eye forward to the spinner so there is no open rear rim to see down
    const st = [
      [.20, .60, .66, .01], [1.00, .59, .65, .00], [1.95, .54, .60, .03],
      [2.70, .46, .50, .05], [3.25, .38, .40, .06], [3.62, .30, .31, .06]
    ];
    const N = 12;
    const pt = (sq, k) => { const a = k / N * TAU; return [sq[1] * Math.sin(a), sq[3] + sq[2] * Math.cos(a), sq[0]]; };
    for (let i = 0; i < st.length - 1; i++) {
      for (let k = 0; k < N; k++) {
        const a = k / N * TAU, up = Math.cos(a);
        // matte anti-glare panel along the top, normal livery down the sides
        let col = up > .62 ? [62, 67, 75] : up > .05 ? mixc(LIV.top, [70, 76, 84], .4) : LIV.side;
        if (st[i][0] > 3.2) col = mixc(col, LIV.yellow, .55);
        mb.quad(pt(st[i], k), pt(st[i], k + 1), pt(st[i + 1], k + 1), pt(st[i + 1], k), col, SPEC);
      }
    }
    // close off the front so the pilot is not looking down an open tube
    mb.disc(0, .06, 3.62, .30, 10, 2, [30, 32, 36], { two: true });
    // reflector gunsight, sitting proud of the cowling
    mb.box(0, .72, 2.60, .05, .13, .07, [28, 30, 34], TWO);
    mb.box(0, .83, 2.62, .16, .012, .12, [170, 215, 185], { two: true, alpha: .28 });
    P.cowl = mb.done();
  }
  /* ---- landing gear ---- */
  function leg(len, wheelR, col) {
    const mb = MB();
    mb.box(0, -len * .5, 0, .09, len, .11, LIV.metal, TWO);
    mb.box(0, -len * .82, 0, .16, .16, .16, LIV.metal, TWO);
    for (const s of [-.055, .055]) mb.disc(s, -len - wheelR * .15, 0, wheelR, 9, 0, LIV.rubber, TWO);
    mb.box(0, -len - wheelR * .15, 0, .16, wheelR * 1.4, wheelR * 1.4, shade(LIV.rubber, 1.15), TWO);

  P.gearR = { mesh: leg(.85, .32), pivot: [1.05, -.22, .85] };
  P.gearN = { mesh: leg(.74, .24), pivot: [0, -.42, 2.75] };
  for (const k of ["gearL", "gearR", "gearN"]) {
    const g = P[k], p = g.pivot;
    // the generic leg is built at the origin; slide it under its own hinge
    const v = g.mesh.v;
    for (let i = 0; i < v.length; i += 3) { v[i] += p[0]; v[i + 1] += p[1]; v[i + 2] += p[2]; }

  // physics works from — sits on the wing quarter chord, with the main wheels
  // just behind it and the nose wheel well forward.
  for (const key in P) {
    const part = P[key], mesh = part.v ? part : part.mesh;
    for (let i = 2; i < mesh.v.length; i += 3) mesh.v[i] += ZSHIFT;
    if (part.pivot) part.pivot[2] += ZSHIFT;
  }
  return P;
}

/* ========================================================== scenery ====== */
const E = WORLD.fieldElev;
function buildAirport() {
  const mb = MB();
  const L = WORLD.rwyLen, Wd = WORLD.rwyW, hw = Wd / 2, y = E + .10;
  const PAVE_PUSH = 220;
  const asph = [52, 54, 58], paint = [230, 234, 238];
  const segs = 38;
  for (let i = 0; i < segs; i++) {
    const z0 = -L / 2 + i * L / segs, z1 = z0 + L / segs;
    const zc = Math.abs((z0 + z1) * .5);
    // tyre rubber laid down where aeroplanes actually touch down
    const rub = sstep(L / 2 - 430, L / 2 - 190, zc) * (1 - sstep(L / 2 - 95, L / 2 - 25, zc));
    let c = shade(asph, 1 + (hash2(i, 7) - .5) * .09);
    c = mixc(c, [33, 32, 33], rub * .78);
    mb.quad([-hw, y, z0], [hw, y, z0], [hw, y, z1], [-hw, y, z1], c, { two: true, bias: -PAVE_PUSH, edge: 1 });
  }
  /* Paint sits at true depth. The asphalt under it is pushed back instead, and
     the terrain under that further still, so the three coplanar layers stack in
     the right order without any of them jumping in front of the aeroplane. */
  const mark = (x0, z0, x1, z1, col) => mb.quad([x0, y + .02, z0], [x1, y + .02, z0], [x1, y + .02, z1], [x0, y + .02, z1], col || paint, { two: true, bias: 0 });
  // centreline dashes
  for (let z = -L / 2 + 40; z < L / 2 - 40; z += 50) mark(-.7, z, .7, z + 30);
  // threshold bars at both ends
  for (const dir of [1, -1]) {
    const zt = dir * (L / 2 - 6);
    for (let k = -4; k <= 4; k++) {
      if (k === 0) continue;
      const x = k * 4.2;
      mark(x - 1.1, zt - dir * 22, x + 1.1, zt);
    }
    // touchdown zone bars
    for (const off of [150, 230]) {
      const z = dir * (L / 2 - off);
      mark(-9, z, -5.6, z - dir * 20); mark(5.6, z, 9, z - dir * 20);
    }
    // aiming point
    const za = dir * (L / 2 - 300);
    mark(-12, za, -6.5, za - dir * 42); mark(6.5, za, 12, za - dir * 42);
  }
  /* Runway designators. A seven-segment block font is how these are actually
     painted, and each reads correctly from its own approach end. */
  const SEGS = { 1: "bc", 3: "abcdg", 6: "acdefg", 8: "abcdefg" };
  const digit = (d, cx, cz, dir) => {
    const hh = 9, hwd = 5, t = 2.3, on = SEGS[d];
    const put = (u0, v0, u1, v1) => {
      const za = cz + dir * v0, zb = cz + dir * v1;
      mark(cx + Math.min(u0, u1), Math.min(za, zb), cx + Math.max(u0, u1), Math.max(za, zb), paint, 50);
    };
    if (on.includes("a")) put(-hwd, hh - t, hwd, hh);
    if (on.includes("g")) put(-hwd, -t / 2, hwd, t / 2);
    if (on.includes("d")) put(-hwd, -hh, hwd, -hh + t);
    if (on.includes("f")) put(-hwd, 0, -hwd + t, hh);
    if (on.includes("b")) put(hwd - t, 0, hwd, hh);

function buildRing() {

/* scattered trees, drawn as depth-sorted billboards */
function drawTrees() {
  const cell = 86, rad = Q.q.treeR, dens = Q.q.trees;
  const gx = Math.round(cam.pos.x / cell), gz = Math.round(cam.pos.z / cell);
  const n = Math.ceil(rad / cell);
  // which way is the sun on screen? the lit half of each canopy goes that side
  const right = v3(cam.m[0], cam.m[1], cam.m[2]);
  const sunSide = vdot(right, LIGHT.sun) >= 0 ? 1 : -1;
  for (let j = -n; j <= n; j++) {
    for (let i = -n; i <= n; i++) {
      const h1 = hash2((gx + i) * 31 + 7, (gz + j) * 17 + 3);
      if (h1 > dens) continue;
      const x = (gx + i) * cell + (hash2(gx + i, gz + j) - .5) * cell * .9;
      const z = (gz + j) * cell + (hash2(gz + j, gx + i) - .5) * cell * .9;
      const dx = x - cam.pos.x, dz = z - cam.pos.z;
      if (dx * dx + dz * dz > rad * rad) continue;
      const gy = terrainH(x, z);
      if (gy < 2 || gy > 820) continue;
      if (Math.abs(x) < 320 && Math.abs(z) < WORLD.rwyLen * .6) continue;   // keep the field clear
      const hgt = 5.5 + (h1 / dens) * (h1 / dens) * 15;
      const base = projectPoint(v3(x, gy, z));
      if (!base) continue;
      const top = projectPoint(v3(x, gy + hgt, z));
      if (!top) continue;
      const w = Math.abs(base.y - top.y) * .40;
      if (w < .6) continue;
      if (base.x < -w * 2 || base.x > W + w * 2) continue;
      const dist = base.z;
      const dy = gy + hgt * .5 - cam.pos.y, d3 = Math.hypot(dx, dy, dz) || 1;
      const ex = dx / d3, ey = dy / d3, ez = dz / d3;
      // species variation, then light the two halves of the canopy differently
      const tone = hash2((gx + i) * 5, (gz + j) * 11);
      const leaf = mixc([46, 78, 44], [74, 96, 52], tone);
      const litc = litColor(leaf, sunSide * .55, .72, 0);
      const shc = litColor(leaf, -sunSide * .55, .34, 0);
      const fillL = aerial(litc, dist, ex, ey, ez), fillS = aerial(shc, dist, ex, ey, ez);
      const trunkW = Math.max(.9, w * .17);
      const ty = top.y * .34 + base.y * .66;
      DL.poly(dist + .6, [base.x - trunkW, base.y, base.x + trunkW, base.y,
        base.x + trunkW * .5, ty, base.x - trunkW * .5, ty], 4,
        aerial(litColor([58, 45, 34], 0, .3, 0), dist, ex, ey, ez), null, 0);
      const mid = base.y - (base.y - top.y) * .24;
      // shaded half
      DL.poly(dist, [top.x, top.y, base.x - sunSide * w, mid,
        base.x - sunSide * w * .52, base.y, base.x, base.y], 4, fillS, null, 0);
      // sunlit half
      DL.poly(dist - .05, [top.x, top.y, base.x + sunSide * w, mid,
        base.x + sunSide * w * .52, base.y, base.x, base.y], 4, fillL, null, 0);
    }
  }
}

/* The aircraft's own shadow, cast along the sun onto the ground beneath it.
   Nothing sells altitude like this on takeoff and landing. */
const SHADOW_HULL = [
  v3(0, 0, 2.9), v3(1.0, 0, 1.4), v3(5.45, 0, .2), v3(5.3, 0, -.9), v3(1.1, 0, -1.7),
  v3(2.2, 0, -4.4), v3(.5, 0, -5.4), v3(-.5, 0, -5.4), v3(-2.2, 0, -4.4), v3(-1.1, 0, -1.7),
  v3(-5.3, 0, -.9), v3(-5.45, 0, .2), v3(-1.0, 0, 1.4)
];
function drawShadow() {
  if (!Q.q.shadow) return;
  const P = PLANE, sun = LIGHT.sun;
  const gh = groundH(P.pos.x, P.pos.z);
  const agl = P.pos.y - gh;
  if (agl > 420 || agl < -2) return;
  const fade = (1 - sstep(60, 420, agl)) * .46 + .04;
  const N = SHADOW_HULL.length;
  let cxs = 0, cys = 0, ok = true, dmin = 1e9;
  for (let i = 0; i < N; i++) {
    const w = vadd(P.pos, mRot(P.m, SHADOW_HULL[i]));
    const t = (w.y - gh) / sun.y;
    const sx = w.x - sun.x * t, sz = w.z - sun.z * t;
    const sp = projectPoint(v3(sx, groundH(sx, sz) + .10, sz));
    if (!sp) { ok = false; break; }
    _sp[i * 2] = sp.x; _sp[i * 2 + 1] = sp.y;
    cxs += sp.x; cys += sp.y;
    if (sp.z < dmin) dmin = sp.z;
  }
  if (!ok) return;
  // soften the edge as the aircraft climbs away from the ground
  grow(N, clamp(agl * .05, .5, 6) * DPR);
  DL.poly(dmin - 4, _sp, N, "rgba(16,26,22," + fade.toFixed(3) + ")", null, 0);
}

/* volumetric-ish cloud field */
const CLOUDS = [];
(function makeClouds() {
  for (let i = 0; i < 150; i++) {
    const a = hash2(i, 11) * TAU, r = 900 + hash2(i, 12) * 21000;
    const base = 760 + hash2(i, 13) * 1350;
    const puffs = [];
    const np = 5 + ((hash2(i, 14) * 7) | 0);
    const sc = .7 + hash2(i, 19) * 1.4;
    for (let k = 0; k < np; k++) {
      puffs.push({
        x: (hash2(i * 13 + k, 15) - .5) * 460 * sc,
        y: (hash2(i * 13 + k, 16) - .5) * 110 * sc,
        z: (hash2(i * 13 + k, 17) - .5) * 460 * sc,
        r: (70 + hash2(i * 13 + k, 18) * 130) * sc
      });
    }
    CLOUDS.push({ p: v3(Math.cos(a) * r, base, Math.sin(a) * r), puffs, t: hash2(i, 21) });
  }
})();
function drawClouds() {
  for (const cl of CLOUDS) {
    const dx = cl.p.x - cam.pos.x, dz = cl.p.z - cam.pos.z;
    const d2 = dx * dx + dz * dz;
    if (d2 > Q.q.clouds * Q.q.clouds) continue;
    for (const pf of cl.puffs) {
      const wp = v3(cl.p.x + pf.x, cl.p.y + pf.y, cl.p.z + pf.z);
      const sp = projectPoint(wp);
      if (!sp) continue;
      const r = pf.r * sp.s;
      if (r < 1.5 || sp.x < -r * 2 || sp.x > W + r * 2 || sp.y < -r * 2 || sp.y > H + r * 2) continue;
      const fog = 1 - Math.exp(-sp.z * LIGHT.density * .5);
      // light each puff by where it sits in the cloud: tops and the sun side
      // catch the light, the underside stays blue-grey
      const pl = Math.hypot(pf.x, pf.y, pf.z) || 1;
      const sd = (pf.x / pl) * LIGHT.sun.x + (pf.y / pl) * LIGHT.sun.y + (pf.z / pl) * LIGHT.sun.z;
      const lit = clamp(.42 + .58 * (sd * .5 + .5) + clamp(pf.y / 140, -.3, .3), 0, 1);
      let c = mixc([150, 166, 192], [255, 253, 246], lit);
      c = mixc(c, LIGHT.hazeNear, fog * .8);
      DL.sprite(sp.z, sp.x, sp.y, r, sprite(c[0], c[1], c[2], 0), .92);
    }
  }
}

/* ======================================================= flight model === */
const SPECS = {
  mass: 1450, S: 16.2, b: 11.0, cbar: 1.55,
  Ipitch: 4200, Iroll: 3000, Iyaw: 4800,
  CL0: .15, CLa: 5.2, CD0: .026, k: .0533,
  CmA: .60, CmE: .300, CmQ: 14.0,
  Cnb: .095, Cndr: .070, Cnr: .150,
  Cla: .200, Clp: .420, Clb: .055,
  thrustMax: 7100, vProp: 200,
  // main wheels just aft of the CG, nose wheel well forward (tricycle gear)
  wheels: [
    { p: v3(-1.05, -1.44, -.45), brake: 1, steer: 0, grip: 1 },
    { p: v3(1.05, -1.44, -.45), brake: 1, steer: 0, grip: 1 },
    { p: v3(0, -1.44, 1.35), brake: .15, steer: 1, grip: 0 }
  ],
  // points that must never touch the ground
  hard: [v3(-5.47, .18, -.10), v3(5.47, .18, -.10), v3(0, -.26, 2.95), v3(0, .26, -6.00), v3(0, -.62, 0)]

const PLANE = {
  pos: v3(0, E + 1.46, 800), vel: v3(), q: qId(), w: v3(), m: mIdent(),
  thr: 0, inE: 0, inA: 0, inR: 0, dE: 0, dA: 0, dR: 0,
  trim: 0, flap: 0, flapCmd: 0, gear: 1, gearCmd: 1, brake: 0, park: true,
  rpm: 0, propAng: 0, alpha: 0, beta: 0, ias: 0, tas: 0, gload: 1, vsi: 0,
  onGround: true, wow: 0, stall: 0, crashed: false, crashT: 0, msg: "", holdHdg: undefined,
  hardLand: 0, touched: 0, lastVS: 0, aoaCap: false, dist: 0
};
let MODE = "simple", SCEN = "free";

function resetPlane(scen) {
  const P = PLANE;
  P.vel = v3(); P.w = v3(); P.thr = 0; P.dE = P.dA = P.dR = 0;
  P.inE = P.inA = P.inR = 0; P.trim = 0; P.flap = P.flapCmd = 0;
  P.crashed = false; P.crashT = 0; P.stall = 0; P.hardLand = 0; P.touched = 0; P.pitchI = 0; P.holdHdg = undefined;
  P.gear = P.gearCmd = 1; P.brake = 0; P.rpm = 0; P.dist = 0;
  P.q = qAxis(0, 1, 0, Math.PI);            // runway 18: heading south
  if (scen === "free") {
    P.pos = v3(0, E + 1.46, 800); P.thr = 0; P.park = true; P.brake = 1;
  } else if (scen === "air") {
    P.pos = v3(0, 900, 1200); P.q = qAxis(0, 1, 0, Math.PI);
    P.vel = mRot(qMat(P.q, new Float32Array(9)), v3(0, 0, 72)); P.thr = .72; P.park = false;
  } else if (scen === "rings") {
    P.pos = v3(0, 620, 900); P.q = qAxis(0, 1, 0, Math.PI);
    P.vel = mRot(qMat(P.q, new Float32Array(9)), v3(0, 0, 80)); P.thr = .85; P.park = false;
  } else if (scen === "land") {
    // 4.2 km out on final for runway 18, ~720 ft above the field, dirty and slow
    P.pos = v3(0, E + 220, 4200); P.q = qAxis(0, 1, 0, Math.PI);
    P.q = qmul(P.q, qAxis(1, 0, 0, 3 * DEG));
    P.vel = mRot(qMat(P.q, new Float32Array(9)), v3(0, 0, 40)); P.thr = .34;
    P.flap = P.flapCmd = .5; P.park = false;
  }

/* pilot assist for SIMPLE mode: turns the stick into an autopilot command */
function assist(P, dt, e) {
  const bankTgt = P.inA * 58 * DEG;
  const rollErr = bankTgt - e.roll;
  // w.z is positive when rolling LEFT, so it damps a right-roll command directly
  P.dA = clamp(rollErr * 2.4 + P.w.z * .55, -1, 1);
  // pitch: stick commands a flight-path change, with turn compensation
  const lvl = 1 / Math.max(Math.cos(clamp(e.roll, -1.2, 1.2)), .35);
  let pitchTgt = P.inE * 26 * DEG + (lvl - 1) * 9 * DEG;
  if (P.onGround) pitchTgt = P.inE * 14 * DEG;
  const pitchErr = pitchTgt - e.pitch;
  // proportional alone leaves a standing error, which shows up as a banked turn
  // that quietly descends, so trim it out with a bounded integral term
  P.pitchI = clamp((P.pitchI || 0) + pitchErr * dt * 1.5, -.55, .55);
  // w.x is positive pitching DOWN, so it adds directly to a nose-up command
  P.dE = clamp(pitchErr * 3.2 + P.pitchI + P.w.x * .50, -1, 1);
  // hard angle-of-attack limiter keeps the wing flying
  const amax = (13.5 - P.flap * 1.5) * DEG;
  P.aoaCap = P.alpha > amax && P.dE > 0;
  if (P.aoaCap) P.dE = clamp(P.dE - (P.alpha - amax) * 26, -1, .05);
  if (P.onGround) {
    // on the ground, hold the runway heading rather than chasing zero sideslip:
    // zeroing sideslip in a crosswind just walks the aircraft off the centreline
    if (Math.abs(P.inA) > .05 || P.holdHdg === undefined) P.holdHdg = e.hdg;
    let err = P.holdHdg - e.hdg;
    if (err > Math.PI) err -= TAU; else if (err < -Math.PI) err += TAU;
    P.dR = clamp(P.inA * .9 + err * 2.4 - P.w.y * .9, -1, 1);
  } else {
    // in the air, auto-coordinate: a slip to the right needs RIGHT rudder
    P.holdHdg = undefined;
    P.dR = clamp(P.beta * 4.5 - P.w.y * .45, -1, 1);
  }
  P.trim = 0;
}

function physics(P, dt) {
  const m = P.m;
  const e = eulerOf(m);
  // --- control surface response ------------------------------------------
  if (MODE === "simple") assist(P, dt, e);
  else {
    P.dE = approach(P.dE, P.inE, 9, dt);
    P.dA = approach(P.dA, P.inA, 11, dt);
    P.dR = approach(P.dR, P.inR, 9, dt);
  }
  P.flap = approach(P.flap, P.flapCmd, 1.1, dt);
  P.gear = clamp(P.gear + (P.gearCmd - P.gear > 0 ? dt / 3.2 : -dt / 3.2), 0, 1);
  if (Math.abs(P.gearCmd - P.gear) < .02) P.gear = P.gearCmd;

  // --- engine -------------------------------------------------------------
  const thrCmd = P.crashed ? 0 : P.thr;
  P.rpm = approach(P.rpm, .18 + thrCmd * .82, 2.4, dt);
  const rho = rhoAt(P.pos.y);
  const wind = WIND.at(P.pos, P);
  const va = vsub(P.vel, wind);
  const vb = mRotT(m, va);
  const V = vlen(vb);
  P.tas = V;
  P.ias = V * Math.sqrt(rho / 1.225);
  const thrust = SPECS.thrustMax * P.rpm * clamp(1 - V / SPECS.vProp, .10, 1) *
    Math.pow(rho / 1.225, .85) * (MODE === "simple" ? 1.12 : 1);

  let F = v3(0, -SPECS.mass * 9.81, 0);      // world-frame accumulator
  let M = v3();                              // body-frame torque

  if (V > .6) {
    const vd = vmul(vb, 1 / V);
    const slow = clamp((V - 3) / 6, 0, 1);   // the angles are meaningless at a standstill
    P.alpha = clamp(Math.atan2(-vd.y, vd.z), -1.4, 1.4) * slow;
    P.beta = Math.asin(clamp(vd.x, -1, 1)) * slow;
    const qbar = .5 * rho * V * V, qS = qbar * SPECS.S;
    // lift curve with a proper stall break
    const aStall = (15.5 + P.flap * 1.5) * DEG;
    let st = 1 - sstep(aStall, aStall + 8 * DEG, Math.abs(P.alpha));
    if (MODE === "simple") st = Math.max(st, .55);
    const CLlin = SPECS.CL0 + SPECS.CLa * P.alpha + .60 * P.flap;
    const CLstall = 1.05 * Math.sin(2 * P.alpha);
    const CL = lerp(CLstall, CLlin, st);
    P.stall = approach(P.stall, 1 - st, 6, dt);
    const CD = SPECS.CD0 + SPECS.k * CL * CL + .022 * P.gear + .055 * P.flap + (1 - st) * .09;
    const L = qS * CL, D = qS * CD, Y = -qS * .90 * P.beta;
    // lift acts perpendicular to the relative wind, in the plane of symmetry
    const liftDir = vnorm(vcross(vd, v3(1, 0, 0)));
    const fb = vadd(vadd(vmul(liftDir, L), vmul(vd, -D)), v3(Y, 0, 0));
    fb.z += thrust;
    F = vadd(F, mRot(m, fb));
    P.gload = L / (SPECS.mass * 9.81);
    // moments
    const cq = .5 * rho * V * SPECS.S;
    const dET = clamp(P.dE + P.trim, -1.3, 1.3);
    M.x = qS * SPECS.cbar * (SPECS.CmA * P.alpha - SPECS.CmE * dET) - cq * SPECS.cbar * SPECS.cbar * SPECS.CmQ * P.w.x;
    M.y = qS * SPECS.b * (SPECS.Cnb * P.beta + SPECS.Cndr * P.dR - .020 * P.dA) - cq * SPECS.b * SPECS.b * SPECS.Cnr * P.w.y;
    M.z = qS * SPECS.b * (-SPECS.Cla * P.dA + SPECS.Clb * P.beta) - cq * SPECS.b * SPECS.b * SPECS.Clp * P.w.z;
    if (1 - st > .05) {   // asymmetric stall: wing drop and buffet
      const drop = (1 - st) * (hash2((P.pos.x * 3) | 0, (P.pos.z * 3) | 0) - .5);
      M.z += drop * 9000;
      M.x += (1 - st) * 5200;      // nose drops
      cam.shake = Math.max(cam.shake, (1 - st) * .5);
    }
  } else {
    P.alpha = 0; P.beta = 0; P.gload = 0; P.stall = 0;
    F = vadd(F, mRot(m, v3(0, 0, thrust)));
  }
  if (MODE === "complex") {
    // engine torque rolls the airframe left, p-factor yaws it left
    const pw = P.rpm * clamp(1 - V / 110, .15, 1);
    M.z += 900 * pw;
    M.y -= 700 * pw * (.5 + clamp(P.alpha, 0, .5));
  }

  // --- ground contact ------------------------------------------------------
  let wow = 0, maxFn = 0;
  if (P.pos.y - groundH(P.pos.x, P.pos.z) < 6) {
    const wOmega = mRot(m, P.w);
    for (const wh of SPECS.wheels) {
      const legDrop = (1 - P.gear) * .95;   // retracted wheels sit inside the airframe
      const wl = v3(wh.p.x, wh.p.y + legDrop, wh.p.z);
      const rw = mRot(m, wl);
      const wp = vadd(P.pos, rw);
      const gh = groundH(wp.x, wp.z);
      const pen = gh - wp.y;
      if (pen <= 0) continue;
      wow++;
      const flat = onRunway(wp.x, wp.z);
      const n = flat ? v3(0, 1, 0) : terrainN(wp.x, wp.z, 4);
      const vp = vadd(P.vel, vcross(wOmega, rw));
      const vn = vdot(vp, n);
      let Fn = clamp(pen * 190000 - vn * 14000, 0, SPECS.mass * 9.81 * 7);
      maxFn = Math.max(maxFn, Fn);
      let Fw = vmul(n, Fn);
      // rolling / lateral friction in the wheel's own frame
      let fwd = mRot(m, v3(0, 0, 1));
      if (wh.steer) {
        // in simple mode dR already carries the pilot's steering plus the
        // auto-coordination that keeps the roll straight
        const st = P.dR * (MODE === "simple" ? .6 : 1) * 26 * DEG * clamp(1 - V / 40, .25, 1);
        fwd = mRot(m, v3(Math.sin(st), 0, Math.cos(st)));
      }
      fwd = vnorm(vsub(fwd, vmul(n, vdot(fwd, n))));
      const side = vnorm(vcross(n, fwd));
      const vs = vdot(vp, side), vf = vdot(vp, fwd);
      // nose-wheel grip fades with speed; a hard-gripping wheel ahead of the
      // centre of gravity is directionally unstable and ground-loops the aircraft
      const grip = wh.grip || lerp(.75, .16, clamp(V / 26, 0, 1));
      const muS = (flat ? .92 : .72) * grip;
      Fw = vadd(Fw, vmul(side, clamp(-vs * 3200 * grip, -muS * Fn, muS * Fn)));
      const bk = P.brake * wh.brake * (MODE === "simple" ? .8 : 1);
      const roll = (flat ? .022 : .075) + bk * .70;
      Fw = vadd(Fw, vmul(fwd, clamp(-vf * 900, -roll * Fn, roll * Fn)));
      F = vadd(F, Fw);
      M = vadd(M, mRotT(m, vcross(rw, Fw)));
      if (Fn > 200 && V > 3 && Math.random() < .25) spawnDust(wp, vmul(vp, -.1));
    }
    // structural contact = crash
    if (!P.crashed) {
      for (const hp of SPECS.hard) {
        const wp = vadd(P.pos, mRot(m, hp));
        if (wp.y < groundH(wp.x, wp.z) - .05) { crash("STRUCTURAL CONTACT"); break; }
      }
      const vsLim = MODE === "simple" ? 9.5 : 5.2;
      if (wow && P.lastVS < -vsLim && !P.touched) crash("HARD LANDING");
      if (maxFn > SPECS.mass * 9.81 * (MODE === "simple" ? 6.5 : 4.4)) crash("GEAR COLLAPSE");
      if (wow && !P.gear) crash("GEAR UP LANDING");
    }
  }
  P.wow = wow;
  if (wow && !P.onGround) { P.touched = 1.2; P.hardLand = -P.lastVS; }
  P.onGround = wow > 0;
  if (P.touched > 0) P.touched = Math.max(0, P.touched - dt);
  if (!wow) P.lastVS = P.vel.y;

  // --- integrate -----------------------------------------------------------
  if (P.crashed) {
    F = v3(0, -SPECS.mass * 9.81, 0);
    if (P.pos.y <= groundH(P.pos.x, P.pos.z) + 1.0) {
      P.vel = vmul(P.vel, Math.exp(-6 * dt));
      P.w = vmul(P.w, Math.exp(-5 * dt));
      F = v3();
    }
  }
  const acc = vmul(F, 1 / SPECS.mass);
  P.vel = vadd(P.vel, vmul(acc, dt));
  P.pos = vadd(P.pos, vmul(P.vel, dt));
  P.w = v3(P.w.x + M.x / SPECS.Ipitch * dt, P.w.y + M.y / SPECS.Iyaw * dt, P.w.z + M.z / SPECS.Iroll * dt);
  const wcap = 6;
  P.w = v3(clamp(P.w.x, -wcap, wcap), clamp(P.w.y, -wcap, wcap), clamp(P.w.z, -wcap, wcap));
  P.q = qIntegrate(P.q, P.w, dt);
  qMat(P.q, P.m);
  P.propAng += P.rpm * 145 * dt;
  P.vsi = P.vel.y;
  P.dist += vlen(P.vel) * dt;
  // never let the aircraft sink through the world
  const gh = groundH(P.pos.x, P.pos.z);
  if (P.pos.y < gh + .35) { P.pos.y = gh + .35; if (P.vel.y < 0) P.vel.y *= -.05; }
}

/* wind & turbulence */
const WIND = {
  base: v3(3.2, 0, -1.6), t: 0,
  at(pos, P) {
    if (MODE === "simple") return v3(this.base.x * .22, 0, this.base.z * .22);
    const g = Math.sin(this.t * .7) * .5 + Math.sin(this.t * 1.9 + 1.3) * .3;
    const alt = clamp(pos.y / 1200, 0, 1);
    const turb = (1 - alt) * .9 + .15;
    return v3(
      this.base.x * (1 + g * .5) * (.6 + alt) + Math.sin(this.t * 3.1 + pos.x * .01) * turb,
      Math.sin(this.t * 2.6 + pos.z * .013) * turb * .8,
      this.base.z * (1 + g * .5) * (.6 + alt) + Math.cos(this.t * 2.3 + pos.z * .011) * turb);
  }
};

/* ======================================================== particles ====== */
const PARTS = [];
function addPart(p, v, r, life, col, grow, kind) {
  if (PARTS.length > 420) PARTS.shift();
  PARTS.push({ p: v3(p.x, p.y, p.z), v: v3(v.x, v.y, v.z), r, t: 0, life, col, grow: grow || 1.6, kind: kind || 0 });
}
function spawnDust(p, v) {
  addPart(p, v3(v.x + (Math.random() - .5) * 3, 1 + Math.random() * 2, v.z + (Math.random() - .5) * 3),
    .6, .9 + Math.random() * .7, [196, 188, 170], 5.5);
}
function spawnSmoke(p, v) {
  addPart(p, v3(v.x * .2 + (Math.random() - .5) * 2, 2 + Math.random() * 3, v.z * .2 + (Math.random() - .5) * 2),
    1.2, 2.4, [58, 58, 62], 7);
}
function spawnFire(p) {
  addPart(p, v3((Math.random() - .5) * 9, 5 + Math.random() * 9, (Math.random() - .5) * 9),
    1.6, .5 + Math.random() * .5, [255, 178, 60], 6, 1);
}
function updateParts(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const q = PARTS[i];
    q.t += dt;
    if (q.t >= q.life) { PARTS.splice(i, 1); continue; }
    q.p = vadd(q.p, vmul(q.v, dt));
    q.v = vmul(q.v, Math.exp(-1.6 * dt));
    if (q.kind === 1) q.v.y += 18 * dt; else q.v.y += 1.2 * dt;
  }
}
function drawParts() {
  for (const q of PARTS) {
    const sp = projectPoint(q.p);
    if (!sp) continue;
    const f = q.t / q.life;
    const r = (q.r + q.grow * q.t) * sp.s;
    if (r < .6) continue;
    const a = (1 - f) * (q.kind === 1 ? .9 : .55);
    const col = q.kind === 1 ? mixc([255, 226, 140], [220, 70, 30], f) : q.col;
    DL.sprite(sp.z, sp.x, sp.y, r, sprite(col[0], col[1], col[2], 1), a);
  }
}

/* Wingtip vortices when the wing is working hard, and exhaust haze at power. */
function spawnTrails(dt) {
  const P = PLANE;
  if (P.crashed || P.onGround || P.tas < 45) return;
  if ((P.gload > 2.3 || P.alpha > 9 * DEG) && Math.random() < dt * 34) {
    for (const sx of [-5.35, 5.35]) {
      const wp = vadd(P.pos, mRot(P.m, v3(sx, .24, -.15)));
      addPart(wp, vmul(P.vel, .04), .30, .6 + Math.random() * .4, [252, 253, 255], 3.4);
    }
  }
  if (P.rpm > .72 && Math.random() < dt * 9) {
    const ex = vadd(P.pos, mRot(P.m, v3((Math.random() < .5 ? -.34 : .34), -.05, 1.25)));
    addPart(ex, vmul(P.vel, -.02), .18, .5, [86, 84, 82], 2.2);
  }
}

/* ============================================================ events ==== */
let banner = document.getElementById("banner"), toastEl = document.getElementById("toast");
let toastT = 0;
function toast(msg, secs) { toastEl.textContent = msg; toastEl.style.opacity = 1; toastT = secs || 2.2; }
function showBanner(msg, col) {
  banner.textContent = msg; banner.style.color = col || "#fff"; banner.style.opacity = 1;
}
function hideBanner() { banner.style.opacity = 0; }

function crash(why) {
  const P = PLANE;
  if (P.crashed) return;
  P.crashed = true; P.crashT = 0; P.msg = why;
  for (let i = 0; i < 34; i++) spawnFire(P.pos);
  for (let i = 0; i < 16; i++) spawnSmoke(P.pos, P.vel);
  cam.shake = 2.2;
  audio.boom();
  showBanner(why + "  \u00b7  R TO RESET", "#ff6a56");
  GAME.over = true; GAME.result = why;
}

/* ============================================================ camera ==== */
let camMode = 0;
const CAMNAMES = ["CHASE", "COCKPIT", "ORBIT", "WING", "TOWER"];
let orbitA = 0;
function updateCamera(dt) {
  const P = PLANE, m = P.m;
  const fwd = v3(m[6], m[7], m[8]), up = v3(m[3], m[4], m[5]), right = v3(m[0], m[1], m[2]);
  let want, look, rollBlend = 1;
  if (camMode === 1) {                      // cockpit
    want = vadd(P.pos, mRot(m, v3(0, .80, -.45)));
    cam.pos = want;
    cam.m = qMat(P.q, cam.m);
    FOV = FOVBASE * 1.16; F = (H * .5) / Math.tan(FOV * .5);
    return;
  }
  FOV = FOVBASE; F = (H * .5) / Math.tan(FOV * .5);
  if (camMode === 0) {
    const back = 17 + clamp(vlen(P.vel) * .06, 0, 7);
    want = vadd(P.pos, vadd(vmul(fwd, -back), vadd(vmul(up, 3.4), vmul(right, 0))));
    look = vadd(P.pos, vmul(fwd, 10));
    rollBlend = .35;
  } else if (camMode === 2) {
    orbitA += dt * .22;
    const r = 26;
    want = vadd(P.pos, v3(Math.cos(orbitA) * r, 7, Math.sin(orbitA) * r));
    look = P.pos; rollBlend = 0;
  } else if (camMode === 3) {
    want = vadd(P.pos, mRot(m, v3(7.5, 1.4, -1.5)));
    look = vadd(P.pos, mRot(m, v3(0, .3, 2)));
    rollBlend = 1;
  } else {
    want = v3(-70, E + 24, 620);
    look = P.pos; rollBlend = 0;
  }
  // smooth follow
  if (!cam.init) { cam.pos = want; cam.init = 1; }
  const k = camMode === 0 ? 9 : 5;
  cam.pos = v3(approach(cam.pos.x, want.x, k, dt), approach(cam.pos.y, want.y, k, dt), approach(cam.pos.z, want.z, k, dt));
  const gh = groundH(cam.pos.x, cam.pos.z) + 1.5;
  if (cam.pos.y < gh) cam.pos.y = gh;
  // build a look-at basis, then blend in some of the aircraft roll
  const f2 = vnorm(vsub(look, cam.pos));
  let upRef = v3(0, 1, 0);
  if (rollBlend > 0) upRef = vnorm(vadd(vmul(v3(0, 1, 0), 1 - rollBlend), vmul(up, rollBlend)));
  let r2 = vnorm(vcross(upRef, f2));
  if (!isFinite(r2.x) || vlen(r2) < .01) r2 = vnorm(vcross(v3(0, 0, 1), f2));
  const u2 = vcross(f2, r2);
  const sh = cam.shake;
  cam.m[0] = r2.x; cam.m[1] = r2.y; cam.m[2] = r2.z;
  cam.m[3] = u2.x; cam.m[4] = u2.y; cam.m[5] = u2.z;
  cam.m[6] = f2.x; cam.m[7] = f2.y; cam.m[8] = f2.z;
  if (sh > .001) {
    const jq = qmul(qAxis(1, 0, 0, (Math.random() - .5) * sh * .05), qAxis(0, 1, 0, (Math.random() - .5) * sh * .05));
    const jm = qMat(jq, new Float32Array(9));
    cam.m = mmul(cam.m, jm);
  }
}

/* ======================================================= draw aircraft == */
function drawAircraft() {
  const P = PLANE, Rb = P.m, pos = P.pos;
  const external = camMode !== 1;
  const ail = P.dA * 22 * DEG, ele = P.dE * 24 * DEG, rud = P.dR * 26 * DEG, fl = P.flap * 35 * DEG;
  const gearAng = (1 - P.gear) * 84 * DEG;
  if (external) {
    drawMesh(AC.fuse, pos, Rb, null);
    drawMesh(AC.wingL, pos, Rb, null);
    drawMesh(AC.wingR, pos, Rb, null);
    drawMesh(AC.tail, pos, Rb, null);
    drawMesh(AC.pit, pos, Rb, null);
    // hinged surfaces: rotate about the body axis through each pivot
    const hinge = (part, mat) => {
      const piv = part.pivot;
      const o = vadd(pos, mRot(Rb, v3(piv[0], piv[1], piv[2])));
      drawMesh(part.mesh, o, mmul(Rb, mat), piv);
    };
    hinge(AC.ailR, mAxis(1, 0, 0, -ail));   // right aileron up when rolling right
    hinge(AC.ailL, mAxis(1, 0, 0, ail));
    hinge(AC.flapL, mAxis(1, 0, 0, -fl));
    hinge(AC.flapR, mAxis(1, 0, 0, -fl));
    hinge(AC.elev, mAxis(1, 0, 0, -ele));
    hinge(AC.rud, mAxis(0, 1, 0, rud));
    if (P.gear > .01) {
      hinge(AC.gearL, mAxis(0, 0, 1, -gearAng));
      hinge(AC.gearR, mAxis(0, 0, 1, gearAng));
      hinge(AC.gearN, mAxis(1, 0, 0, gearAng));
    }
    // propeller: discrete blades when slow, a translucent disc when spinning up
    const spin = P.rpm;
    drawMesh(AC.spin, pos, mmul(Rb, mAxis(0, 0, 1, P.propAng)), null);
    if (spin < .32) {
      drawMesh(AC.blades, pos, mmul(Rb, mAxis(0, 0, 1, P.propAng)), null);
    } else {
      for (let i = 0; i < 3; i++)
        drawMesh(AC.blades, pos, mmul(Rb, mAxis(0, 0, 1, P.propAng + i * .55)), null, null, .17);
      const hub = projectPoint(vadd(pos, mRot(Rb, v3(0, .06, 2.65))));
      if (hub) DL.sprite(hub.z - .5, hub.x, hub.y, 1.45 * hub.s, sprite(208, 216, 226, 2), 1);
    }
    drawMesh(AC.glass, pos, Rb, null);
    // navigation lights
    const navs = [[v3(-5.45, .24, -.15), [255, 70, 60]], [v3(5.45, .24, -.15), [70, 255, 120]], [v3(0, 1.7, -5.1), [255, 255, 255]]];
    for (const [lp, c] of navs) {
      const sp = projectPoint(vadd(pos, mRot(Rb, lp)));
      if (!sp) continue;
      DL.sprite(sp.z - 2, sp.x, sp.y, clamp(.55 * sp.s, 1.6, 16), sprite(c[0], c[1], c[2], 3), .9);
    }
  } else {
    // from inside: the nose deck, the wings and the propeller, nothing else
    drawMesh(AC.wingL, pos, Rb, null);
    drawMesh(AC.wingR, pos, Rb, null);
    drawMesh(AC.cowl, pos, Rb, null);
    drawMesh(AC.spin, pos, mmul(Rb, mAxis(0, 0, 1, P.propAng)), null);
    // only the blur disc: the blades themselves are a smear at these speeds
    const hub = projectPoint(vadd(pos, mRot(Rb, v3(0, .06, 2.65))));
    if (hub && P.rpm > .2) DL.sprite(hub.z - .5, hub.x, hub.y, 1.45 * hub.s, sprite(208, 216, 226, 2), 1);
    drawMesh(AC.glass, pos, Rb, null, null, .055);
  }
  // engine smoke when damaged
  if (P.crashed && Math.random() < .5) spawnSmoke(vadd(pos, mRot(Rb, v3(0, .3, 1.2))), P.vel);
}

/* ============================================================= audio ==== */
const audio = {
  ctx: null, ok: false,
  init() {
    if (this.ctx) return;
    const AC2 = window.AudioContext || window.webkitAudioContext;
    if (!AC2) return;
    this.ctx = new AC2();
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = .55; this.master.connect(c.destination);
    // engine: two detuned saws through a lowpass
    this.eg = c.createGain(); this.eg.gain.value = 0;
    this.ef = c.createBiquadFilter(); this.ef.type = "lowpass"; this.ef.frequency.value = 900;
    this.o1 = c.createOscillator(); this.o1.type = "sawtooth"; this.o1.frequency.value = 70;
    this.o2 = c.createOscillator(); this.o2.type = "square"; this.o2.frequency.value = 35;
    this.o1.connect(this.ef); this.o2.connect(this.ef);
    this.ef.connect(this.eg); this.eg.connect(this.master);
    this.o1.start(); this.o2.start();
    // wind: filtered noise
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.ns = c.createBufferSource(); this.ns.buffer = buf; this.ns.loop = true;
    this.nf = c.createBiquadFilter(); this.nf.type = "bandpass"; this.nf.frequency.value = 500; this.nf.Q.value = .7;
    this.ng = c.createGain(); this.ng.gain.value = 0;
    this.ns.connect(this.nf); this.nf.connect(this.ng); this.ng.connect(this.master);
    this.ns.start();
    // stall horn
    this.sg = c.createGain(); this.sg.gain.value = 0;
    this.so = c.createOscillator(); this.so.type = "sawtooth"; this.so.frequency.value = 420;
    this.so.connect(this.sg); this.sg.connect(this.master);
    this.so.start();
    this.ok = true;
  },
  update(P, dt) {
    if (!this.ok) return;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const t = this.ctx.currentTime;
    const rpmHz = 46 + P.rpm * 128;
    this.o1.frequency.setTargetAtTime(rpmHz, t, .08);
    this.o2.frequency.setTargetAtTime(rpmHz * .5, t, .08);
    this.ef.frequency.setTargetAtTime(420 + P.rpm * 2100, t, .1);
    this.eg.gain.setTargetAtTime(P.crashed ? 0 : (camMode === 1 ? .17 : .12) * (.25 + P.rpm * .9), t, .1);
    const wv = clamp(P.tas / 130, 0, 1.4);
    this.ng.gain.setTargetAtTime(wv * wv * .21, t, .12);
    this.nf.frequency.setTargetAtTime(320 + wv * 900, t, .12);
    const warn = (P.stall > .22 || (MODE === "complex" && P.alpha > 13.5 * DEG)) && !P.onGround && !P.crashed;
    this.sg.gain.setTargetAtTime(warn ? (Math.sin(t * 34) > 0 ? .06 : 0) : 0, t, .02);
  },
  boom() {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime;
    const len = c.sampleRate * 1.4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380;
    const g = c.createGain(); g.gain.value = .85;
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  beep(freq, dur, vol) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .18, t + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + (dur || .12));
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + (dur || .14));
  }
};

/* ========================================================== scenarios === */
const GAME = {
  t: 0, over: false, result: "", started: false, paused: false,
  rings: [], ringIdx: 0, ringT: 0, landScore: null
};
function buildRingCourse() {
  GAME.rings = [];
  let a = Math.PI, x = 0, z = -300, y = 560;
  for (let i = 0; i < 12; i++) {
    a += (hash2(i, 51) - .5) * .85 + (i % 2 ? .30 : -.30);
    if (i >= 6) {   // second half curves back toward the field
      let d = Math.atan2(-x, -z) - a;
      if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
      a += clamp(d, -.8, .8) * .55;
    }
    const step = 950 + hash2(i, 52) * 550;
    x += Math.sin(a) * step; z += Math.cos(a) * step;
    y = clamp(terrainH(x, z) + 180 + hash2(i, 53) * 260, 140, 1500);
    GAME.rings.push({ p: v3(x, y, z), a, passed: false });
  }
  GAME.ringIdx = 0; GAME.ringT = 0;
}
function drawRings() {
  for (let i = 0; i < GAME.rings.length; i++) {
    const rg = GAME.rings[i];
    if (rg.passed) continue;
    const d = vlen(vsub(rg.p, cam.pos));
    if (d > 9000) continue;
    const M = qMat(qAxis(0, 1, 0, rg.a), new Float32Array(9));
    const tint = i === GAME.ringIdx ? [120, 255, 160] : null;
    drawMesh(RING, rg.p, M, null, tint);
    // pylon to the ground so the gate reads in 3D
    const gh = terrainH(rg.p.x, rg.p.z);
    const a = projectPoint(v3(rg.p.x, rg.p.y - 30, rg.p.z)), b = projectPoint(v3(rg.p.x, gh, rg.p.z));
    if (a && b) DL.poly(a.z + 30, [a.x - 1.5, a.y, a.x + 1.5, a.y, b.x + 2.5, b.y, b.x - 2.5, b.y], 4,
      fogged([132, 138, 146], a.z), null, 0);
  }
}
function checkRings(dt) {
  if (SCEN !== "rings" || GAME.over) return;
  GAME.ringT += dt;
  const rg = GAME.rings[GAME.ringIdx];
  if (!rg) return;
  const rel = vsub(PLANE.pos, rg.p);
  const n = v3(Math.sin(rg.a), 0, Math.cos(rg.a));
  const along = vdot(rel, n);
  const radial = Math.hypot(rel.x - n.x * along, rel.y, rel.z - n.z * along);
  if (rg.last === undefined) rg.last = along;
  // `along` runs negative before the gate and positive once past it
  if (rg.last < 0 && along >= 0 && radial < 30) {
    rg.passed = true; GAME.ringIdx++;
    audio.beep(880, .13, .2);
    if (GAME.ringIdx >= GAME.rings.length) {
      GAME.over = true; GAME.result = "COURSE COMPLETE  " + GAME.ringT.toFixed(2) + "s";
      showBanner("COURSE COMPLETE — " + GAME.ringT.toFixed(2) + "s", "#8bf0a8");
    } else toast("GATE " + GAME.ringIdx + " / " + GAME.rings.length, 1.2);
  }
  rg.last = along;
}
function checkLanding() {
  const P = PLANE;
  if (SCEN !== "land" || GAME.over || P.crashed) return;
  if (P.onGround && P.touched > 1.1 && GAME.landScore === null) {
    const onRwy = onRunway(P.pos.x, P.pos.z);
    const vs = P.hardLand;
