<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Night Watch — The Keeper</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Night Watch" />
<meta name="theme-color" content="#08060a" />
<style>
  :root{
    --bg:#08060a;
    --ember:#FF9F0A;
    --core:#FFD60A;
    --coal:#B34A3D;
    --bone:#E8DCC8;
    --mute:#8E8E93;
    --line:rgba(232,220,200,0.16);
    --panel:rgba(20,16,14,0.82);
    --danger:#FF453A;
    --display:-apple-system,'SF Pro Display',system-ui,sans-serif;
    --body:-apple-system,'SF Pro Text',system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono','SFMono-Regular',menlo,monospace;
    --safeT:env(safe-area-inset-top,0px);
    --safeB:env(safe-area-inset-bottom,0px);
    --safeL:env(safe-area-inset-left,0px);
    --safeR:env(safe-area-inset-right,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);
    color:var(--bone);font-family:var(--body);
    overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #c{position:fixed;inset:0;display:block;z-index:0}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;z-index:2;left:0;right:0;top:0;
    padding:calc(var(--safeT) + 10px) calc(var(--safeR) + 14px) 0 calc(var(--safeL) + 14px);
    display:flex;align-items:flex-start;gap:12px;pointer-events:none;
    max-width:660px;margin:0 auto;
    opacity:0;transition:opacity .35s ease;
  }
  #hud.on{opacity:1}
  .meter{flex:1;min-width:0}
  .meter .lbl{
    display:flex;justify-content:space-between;align-items:baseline;
    font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
    color:var(--mute);margin-bottom:6px;
  }
  .meter .lbl b{font:700 11px/1 var(--mono);letter-spacing:.06em;color:var(--bone)}
  .bar{height:7px;border-radius:4px;background:rgba(232,220,200,0.10);overflow:hidden}
  .bar i{
    display:block;height:100%;width:60%;border-radius:4px;
    background:linear-gradient(90deg,var(--coal),var(--ember) 55%,var(--core));
    box-shadow:0 0 12px rgba(255,159,10,0.55);
    transition:width .12s linear, background .3s ease;
  }
  .bar.low i{background:linear-gradient(90deg,#7a2520,var(--danger));box-shadow:0 0 14px rgba(255,69,58,0.6)}
  #dawnWrap{width:88px;flex:none}
  #dawnWrap .bar i{background:linear-gradient(90deg,#2a3550,#5E5CE6 60%,#9AD5FF);box-shadow:0 0 10px rgba(94,92,230,0.5)}
  #stats{
    flex:none;text-align:right;font:700 12px/1.5 var(--mono);letter-spacing:.04em;
    color:var(--bone);text-shadow:0 1px 8px #000;
  }
  #stats small{display:block;font:600 9px/1 var(--body);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-bottom:4px}

  /* ---------- Controls ---------- */
  .btn{
    position:fixed;z-index:3;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--panel);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--bone);cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity .35s ease, transform .1s ease, background .15s ease;
  }
  .btn.on{opacity:1;pointer-events:auto}
  .btn:active{transform:scale(.94)}
  #flare{
    right:calc(var(--safeR) + 22px);bottom:calc(var(--safeB) + 30px);
    width:88px;height:88px;border-radius:50%;
    font:700 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
    color:var(--core);border-color:rgba(255,214,10,0.34);
    box-shadow:0 0 26px rgba(255,159,10,0.14), inset 0 0 22px rgba(255,159,10,0.10);
    overflow:hidden;
  }
  #flare .fill{
    position:absolute;left:0;right:0;bottom:0;height:0%;
    background:rgba(255,159,10,0.14);transition:height .08s linear;
  }
  #flare span{position:relative;z-index:1}
  #flare.cool{color:#7d7369;border-color:var(--line);box-shadow:none}
  #flare.ready{animation:flarePulse 2.6s ease-in-out infinite}
  @keyframes flarePulse{
    0%,100%{box-shadow:0 0 22px rgba(255,159,10,0.12), inset 0 0 20px rgba(255,159,10,0.08)}
    50%{box-shadow:0 0 34px rgba(255,159,10,0.26), inset 0 0 26px rgba(255,159,10,0.16)}
  }
  #pause{
    top:calc(var(--safeT) + 58px);right:calc(var(--safeR) + 14px);
    width:38px;height:38px;border-radius:12px;
  }
  #pause svg{opacity:.75}

  /* ---------- Overlays ---------- */
  #veil{
    position:fixed;inset:0;z-index:4;display:grid;place-items:center;
    padding:calc(var(--safeT) + 24px) 26px calc(var(--safeB) + 24px);
    background:radial-gradient(120% 90% at 50% 45%, rgba(24,14,8,0.72), rgba(4,3,5,0.94) 70%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    transition:opacity .4s ease;
  }
  #veil.hide{opacity:0;pointer-events:none}
  .card{width:100%;max-width:380px;text-align:center;animation:rise .5s cubic-bezier(.2,.9,.25,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .eyebrow{font:700 10px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--ember);margin-bottom:14px}
  h1{font:700 40px/1.02 var(--display);letter-spacing:-.02em;margin-bottom:14px}
  h1 em{font-style:normal;display:block;color:var(--ember);text-shadow:0 0 34px rgba(255,159,10,0.45)}
  .lede{font:400 15px/1.55 var(--body);color:#B8AEA0;margin-bottom:26px}
  .rules{
    text-align:left;border:1px solid var(--line);border-radius:16px;
    background:rgba(20,16,14,0.5);padding:14px 16px;margin-bottom:24px;
  }
  .rules li{list-style:none;display:flex;gap:11px;align-items:flex-start;padding:7px 0;font:400 13.5px/1.45 var(--body);color:#C4BAAC}
  .rules li+li{border-top:1px solid rgba(232,220,200,0.07)}
  .rules b{color:var(--bone);font-weight:600}
  .glyph{flex:none;width:22px;text-align:center;font-size:15px;line-height:1.45;filter:saturate(.9)}
  .go{
    display:block;width:100%;padding:17px;border:none;border-radius:16px;cursor:pointer;
    background:linear-gradient(180deg,#FFB13A,#E07C0A);color:#20130a;
    font:700 16px/1 var(--body);letter-spacing:.02em;
    box-shadow:0 10px 34px rgba(255,159,10,0.28);
    transition:transform .1s ease,filter .15s ease;
  }
  .go:active{transform:scale(.98);filter:brightness(1.06)}
  .ghost{
    display:block;width:100%;padding:15px;margin-top:10px;cursor:pointer;
    background:transparent;border:1px solid var(--line);border-radius:16px;
    color:var(--mute);font:600 14px/1 var(--body);
  }
  .ghost:active{background:rgba(232,220,200,0.05)}
  .tally{display:flex;gap:10px;margin-bottom:24px}
  .tally div{
    flex:1;border:1px solid var(--line);border-radius:14px;padding:14px 8px;
    background:rgba(20,16,14,0.5);
  }
  .tally span{display:block;font:600 9px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
  .tally b{font:700 24px/1 var(--mono);letter-spacing:-.02em;color:var(--bone)}
  .tally b.hi{color:var(--core)}
  .foot{margin-top:20px;font:500 10px/1.6 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#57514c}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;z-index:3;left:50%;top:38%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;opacity:0;
  }
  #toast.show{animation:toast 1.7s cubic-bezier(.2,.9,.25,1) both}
  #toast .t1{font:700 34px/1 var(--display);letter-spacing:-.01em;color:var(--core);text-shadow:0 0 40px rgba(255,214,10,0.5)}
  #toast .t2{margin-top:8px;font:600 11px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:#B8AEA0}
  @keyframes toast{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.86)}
    16%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    72%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-58%) scale(1.02)}
  }

  /* ---------- HUD row 2: heat + held upgrades ---------- */
  #hud2{
    position:fixed;z-index:2;left:0;right:0;top:calc(var(--safeT) + 52px);
    padding:0 calc(var(--safeR) + 62px) 0 calc(var(--safeL) + 14px);
    max-width:660px;margin:0 auto;
    display:flex;align-items:center;gap:8px;
    pointer-events:none;opacity:0;transition:opacity .35s ease;
  }
  #hud2.on{opacity:1}
  #heat{
    flex:none;font:800 13px/1 var(--mono);letter-spacing:.02em;
    padding:5px 9px;border-radius:8px;color:#FFD60A;
    background:rgba(255,159,10,0.12);border:1px solid rgba(255,214,10,0.3);
    opacity:0;transform:scale(.8);transition:transform .12s ease;
  }
  #heat.show{opacity:1;transform:scale(1)}
  #heat.warm{color:#FF9F0A;background:rgba(255,159,10,0.2);border-color:rgba(255,159,10,0.5)}
  #heat.hot{
    color:#fff;background:rgba(255,69,58,0.35);border-color:rgba(255,107,107,0.7);
    box-shadow:0 0 18px rgba(255,69,58,0.4);
  }
  #chips{display:flex;gap:4px;min-width:0;overflow:hidden}
  #chips .none{display:none}
  .chip{
    display:inline-flex;align-items:center;gap:3px;
    font:600 11px/1 var(--body);
    padding:4px 6px;border-radius:7px;
    background:rgba(20,16,14,0.7);border:1px solid var(--line);
  }
  .chip u{text-decoration:none;font:700 9px/1 var(--mono);color:var(--core);opacity:.9}
  /* emoji ship in their own palette; warm them so the UI reads as one piece */
  .chip em,.dg,.sg,.rules .glyph{
    font-style:normal;
    filter:sepia(.55) saturate(1.7) hue-rotate(-14deg) brightness(1.04);
  }
  .chip.t2{border-color:rgba(94,92,230,0.45);background:rgba(40,36,70,0.55)}
  .chip.t3{border-color:rgba(255,159,10,0.55);background:rgba(60,36,10,0.6)}
  .chip.more{font:700 10px/1 var(--mono);color:var(--mute)}
  .chip.big{font-size:12.5px;padding:7px 10px;gap:6px}
  .chip.big b{font-weight:600;color:var(--bone)}

  /* ---------- overlay layout ---------- */
  #veil{overflow-y:auto;overscroll-behavior:contain;align-items:safe center}
  .card.wide{max-width:440px}
  .row2{display:flex;gap:10px;margin-top:10px}
  .row2 .ghost{margin-top:0}
  .tally.sm b{font-size:19px}
  .held{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
  .held.big{gap:7px;margin:18px 0 4px}
  .held.big + .go{margin-top:16px}
  .held .none{font:400 12.5px/1.5 var(--body);color:#57514c}

  /* ---------- level strip ---------- */
  .lvl{
    border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:18px;
    background:rgba(20,16,14,0.5);text-align:left;
  }
  .lvl.tight{padding:11px 14px;margin:16px 0 4px}
  .lvl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .lvl-top b{font:700 14px/1 var(--body);color:var(--bone)}
  .embers{font:700 13px/1 var(--mono);color:var(--core)}
  .embers i{font-style:normal;font:600 9px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .xp{height:6px;border-radius:4px;background:rgba(232,220,200,0.10);overflow:hidden}
  .xp i{
    display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,#5E5CE6,#9AD5FF);box-shadow:0 0 10px rgba(94,92,230,0.5);
  }
  .lvl-sub{margin-top:8px;font:500 10px/1.5 var(--body);letter-spacing:.06em;color:#6b635c;text-transform:uppercase}

  /* ---------- draft ---------- */
  .draft{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .dcard{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
    padding:14px 15px;border-radius:16px;
    border:1px solid var(--line);background:rgba(24,19,16,0.72);
    color:var(--bone);transition:transform .1s ease,border-color .15s ease,background .15s ease;
  }
  .dcard:active{transform:scale(.98)}
  .dcard:hover{border-color:rgba(255,159,10,0.45);background:rgba(38,28,18,0.8)}
  .dcard.t2{border-color:rgba(94,92,230,0.42)}
  .dcard.t2:hover{border-color:rgba(120,118,255,0.7)}
  .dcard.t3{
    border-color:rgba(255,159,10,0.5);
    background:linear-gradient(120deg,rgba(58,32,10,0.8),rgba(24,19,16,0.72));
    box-shadow:0 0 24px rgba(255,159,10,0.12);
  }
  .dg{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:21px;
      border-radius:12px;background:rgba(255,255,255,0.04)}
  .db{flex:1;min-width:0}
  .db b{display:block;font:700 15px/1.2 var(--body);margin-bottom:3px}
  .db span{display:block;font:400 12.5px/1.4 var(--body);color:#B0A69A}
  .dt{flex:none;text-align:right;font:700 8px/1.4 var(--body);letter-spacing:.14em;color:var(--mute)}
  .dcard.t3 .dt{color:var(--ember)}
  .dcard.t2 .dt{color:#9A98FF}
  .dt u{display:block;text-decoration:none;font:700 10px/1.4 var(--mono);color:var(--bone);opacity:.55;letter-spacing:0}

  /* ---------- shop + feats ---------- */
  .shoplist{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .shop,.feat{
    display:flex;align-items:center;gap:12px;text-align:left;
    padding:12px 13px;border-radius:14px;
    border:1px solid var(--line);background:rgba(20,16,14,0.5);
  }
  .shop.maxed{opacity:.55}
  .sg,.fk{flex:none;width:34px;height:34px;display:grid;place-items:center;font-size:18px;
          border-radius:10px;background:rgba(255,255,255,0.04)}
  .sb,.fb{flex:1;min-width:0}
  .sb b,.fb b{display:block;font:700 13.5px/1.2 var(--body);margin-bottom:2px}
  .sb span,.fb span{display:block;font:400 11.5px/1.35 var(--body);color:#A99F94}
  .pips{display:flex;gap:3px;margin-top:6px}
  .pips i{width:14px;height:3px;border-radius:2px;background:rgba(232,220,200,0.14)}
  .pips i.on{background:var(--ember);box-shadow:0 0 6px rgba(255,159,10,0.5)}
  .sc{
    flex:none;min-width:52px;padding:9px 10px;border-radius:11px;cursor:pointer;
    border:1px solid var(--line);background:transparent;
    font:700 13px/1 var(--mono);color:var(--mute);
  }
  .sc.can{color:#20130a;background:linear-gradient(180deg,#FFB13A,#E07C0A);border-color:transparent}
  .sc.can:active{transform:scale(.95)}
  .sc.done{border:none;font:700 9px/1 var(--body);letter-spacing:.14em;color:var(--ember);background:none}
  .feat{opacity:.5}
  .feat.got{opacity:1;border-color:rgba(255,159,10,0.32)}
  .feat.got .fk{color:var(--ember);background:rgba(255,159,10,0.12)}
  .fe{flex:none;font:700 12px/1 var(--mono);color:var(--core);opacity:.85}
  .feat:not(.got) .fe{color:var(--mute);opacity:.6}

  /* ---------- run summary extras ---------- */
  .newfeats{
    border:1px solid rgba(255,159,10,0.32);border-radius:14px;
    background:rgba(48,28,10,0.45);padding:11px 14px;margin-bottom:14px;text-align:left;
  }
  .newfeats>span{display:block;font:700 9px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--ember);margin-bottom:8px}
  .newfeats div{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
  .newfeats b{font:600 13px/1.3 var(--body);color:var(--bone)}
  .newfeats u{text-decoration:none;font:700 12px/1 var(--mono);color:var(--core)}
  .levelup{
    border-radius:14px;padding:12px 14px;margin-bottom:14px;
    background:linear-gradient(120deg,rgba(94,92,230,0.28),rgba(154,213,255,0.12));
    border:1px solid rgba(120,118,255,0.45);
    font:700 12.5px/1.4 var(--body);color:#DDE6FF;
    animation:rise .5s cubic-bezier(.2,.9,.25,1) both;
  }

  @media (max-height:620px){
    h1{font-size:32px}
    .rules li{font-size:12.5px;padding:6px 0}
    .lede{margin-bottom:18px;font-size:14px}
    .dcard{padding:11px 12px;gap:11px}
    .dg{width:34px;height:34px;font-size:18px}
    .db b{font-size:14px}
    .db span{font-size:11.5px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="meter" id="fuelWrap">
    <div class="lbl"><span>Fire</span><b id="fuelNum">60</b></div>
    <div class="bar" id="fuelBar"><i></i></div>
  </div>
  <div class="meter" id="dawnWrap">
    <div class="lbl"><span>Dawn</span></div>
    <div class="bar" id="dawnBar"><i></i></div>
  </div>
  <div id="stats"><small>Night <span id="nightNum">1</span></small><span id="scoreNum">0</span></div>
</div>
<div id="hud2"><div id="heat"></div><div id="chips"></div></div>

<button class="btn" id="pause" aria-label="Pause">
  <svg width="14" height="16" viewBox="0 0 14 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="9" y="1" width="4" height="14" rx="1.4" fill="currentColor"/></svg>
</button>

<button class="btn" id="flare" aria-label="Flare"><div class="fill"></div><span>Flare</span></button>

<div id="toast"><div class="t1"></div><div class="t2"></div></div>

<div id="veil"><div class="card" id="card"></div></div>

<script>
(function () {
  'use strict';

  // ────────────────────────────────────────────────────────────── setup
  var cvs = document.getElementById('c');
  var ctx = cvs.getContext('2d');
  var darkCvs = document.createElement('canvas');
  var dctx = darkCvs.getContext('2d');
  var groundCvs = document.createElement('canvas');
  var gctx = groundCvs.getContext('2d');

  var W = 0, H = 0, DPR = 1;
  var MUTE_KEY = 'keeper.nightwatch.mute';

  // ────────────────────────────────────────────────────────────── tuning
  var K = {
    keeperSpeed: 205,
    keeperR: 13,
    lampR: 84,
    fireCoreR: 34,
    depositR: 52,
    pickupR: 26,
    maxFuel: 100,
    startFuel: 68,
    logFuel: 24,
    nightLen: 42,          // seconds of darkness per night
    baseDrain: 1.35,       // fuel burned per second on night 1
    drainPerNight: 0.38,
    flareCost: 10,
    flareCd: 1.5,
    flareR: 148,
    maxLogs: 6,
    logEvery: 2.4
  };

  // ══════════════════════════════════════════ what carries between runs ══
  var META_KEY = 'keeper.nightwatch.meta.v2';

  // Bought once with embers, kept forever. Ranks are cumulative.
  var PERKS = [
    { id: 'provisions', name: 'Provisions',      glyph: '🎒', ranks: 5, cost: [40, 75, 120, 180, 260],
      desc: function (r) { return 'Start each run with +' + (r * 7) + ' fire.'; } },
    { id: 'richwood',   name: 'Woodcraft',       glyph: '🪓', ranks: 4, cost: [55, 100, 170, 260],
      desc: function (r) { return 'Every log is worth +' + (r * 2) + ' fire.'; } },
    { id: 'boots',      name: 'Worn Boots',      glyph: '👢', ranks: 4, cost: [45, 85, 140, 210],
      desc: function (r) { return 'Walk ' + (r * 4) + '% faster.'; } },
    { id: 'lamp',       name: 'Oil Reserve',     glyph: '🏮', ranks: 4, cost: [50, 90, 150, 220],
      desc: function (r) { return 'Lantern reaches ' + (r * 6) + '% farther.'; } },
    { id: 'flint',      name: 'Good Flint',      glyph: '⚡', ranks: 3, cost: [70, 130, 210],
      desc: function (r) { return 'Flare costs ' + r + ' less fire.'; } },
    { id: 'reroll',     name: 'Second Thoughts', glyph: '🔄', ranks: 2, cost: [120, 260],
      desc: function (r) { return r + ' reroll' + (r === 1 ? '' : 's') + ' per dawn draft.'; } },
    { id: 'headstart',  name: 'Head Start',      glyph: '✨', ranks: 2, cost: [150, 320],
      desc: function (r) { return 'Begin each run holding ' + r + ' random upgrade' + (r === 1 ? '' : 's') + '.'; } },
    { id: 'sifter',     name: 'Ash Sifter',      glyph: '⚱️', ranks: 4, cost: [80, 150, 240, 360],
      desc: function (r) { return 'Earn ' + (r * 12) + '% more embers.'; } }
  ];

  // Drafted during a run, one per dawn. `lv` gates it behind a keeper level,
  // which is what keeps the draft pool growing across dozens of runs.
  var UPGRADES = [
    // ── keeping the fire fed

  function paintGround() {
    var r = mulberry32(1337);
    gctx.clearRect(0, 0, W, H);
    var g = gctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, Math.max(W, H) * 0.8);

    g.addColorStop(0.45, '#150f10');
    g.addColorStop(1, '#08060a');
    gctx.fillStyle = g;
    gctx.fillRect(0, 0, W, H);

    // scattered grit
    for (var i = 0; i < Math.floor(W * H / 1400); i++) {
      var x = r() * W, y = r() * H, s = r() * 1.7 + 0.3;
      gctx.fillStyle = 'rgba(232,220,200,' + (0.02 + r() * 0.05).toFixed(3) + ')';
      gctx.fillRect(x, y, s, s);
    }
    // a few grass tufts / stones
    for (var j = 0; j < Math.floor((W * H) / 26000); j++) {
      var px = r() * W, py = r() * H;
      if (dist(px, py, W / 2, H / 2) < 90) continue;
      gctx.strokeStyle = 'rgba(150,168,107,0.10)';
      gctx.lineWidth = 1.1;
      for (var b = 0; b < 3; b++) {
        gctx.beginPath();
        gctx.moveTo(px + b * 2.6 - 2.6, py);

      gctx.ellipse(sx, sy, 8 + r() * 3, 6 + r() * 2, a, 0, Math.PI * 2);
      gctx.fill();
      gctx.fillStyle = 'rgba(0,0,0,0.35)';
      gctx.beginPath();
      gctx.ellipse(sx, sy + 2.5, 7 + r() * 2, 3, a, 0, Math.PI * 2);
      gctx.fill();
    }
  }

    var p = localPt(e);
    if (stick.id === null) {
      stick.id = e.pointerId; stick.ox = p.x; stick.oy = p.y;
      stick.x = p.x; stick.y = p.y; stick.dx = 0; stick.dy = 0; stick.on = true;
      try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
    } else {
      doFlare(); // second finger anywhere = flare
    }
  }, { passive: false });

  cvs.addEventListener('pointermove', function (e) {
    if (e.pointerId !== stick.id) return;
    var p = localPt(e);
    stick.x = p.x; stick.y = p.y;
    var dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    var d = Math.hypot(dx, dy);
    var MAX = 54;
    if (d > MAX) {                      // let the origin trail the finger
      stick.ox += dx * (1 - MAX / d);
      stick.oy += dy * (1 - MAX / d);
      dx = stick.x - stick.ox; dy = stick.y - stick.oy; d = MAX;
    }
    var n = d < 7 ? 0 : clamp((d - 7) / (MAX - 7), 0, 1);
    if (d > 0.001) { stick.dx = dx / d * n; stick.dy = dy / d * n; }
    else { stick.dx = 0; stick.dy = 0; }
  }, { passive: false });

  function endStick(e) {
    if (e.pointerId !== stick.id) return;
    stick.id = null; stick.on = false; stick.dx = 0; stick.dy = 0;
  }
  cvs.addEventListener('pointerup', endStick);
  cvs.addEventListener('pointercancel', endStick);

  var flareBtn = document.getElementById('flare');
  flareBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); doFlare(); });
  document.getElementById('pause').addEventListener('click', togglePause);

  // ────────────────────────────────────────────────────────────── actions
  function doFlare() {
    if (S.mode !== 'play') return;
    var k = S.keeper;
    if (k.cd > 0 || S.fuel < D.flareCost + 2) { tone(140, 0.06, 'square', 0.03); return; }
    k.cd = D.flareCd;
    S.fuel -= D.flareCost;
    S.flares++;
    S.fire.flare = Math.max(S.fire.flare, 1);
    S.shake = Math.max(S.shake, 7);
    SFX.flare(); buzz(22);
    spark(k.x, k.y, 22, 'gold', 230, 0.5);
    burst(k.x, k.y, D.flareR, 3.2, 1);

    if (u('cinder')) {
      var ring = 3 + u('cinder');
      for (var c = 0; c < ring; c++) {
        var ca = (c / ring) * Math.PI * 2 + rand(-0.3, 0.3);
        var cd2 = D.flareR * rand(0.4, 0.8);
        S.cinders.push({ x: k.x + Math.cos(ca) * cd2, y: k.y + Math.sin(ca) * cd2,
                         r: 30 + u('cinder') * 8, life: 4, max: 4 });
      }
    }
  }

  // Shared by the flare and by Pyre: knock everything back, burn it, and pay
  // the Backdraft refund for whatever it caught.
  function burst(x, y, radius, dmg, refund) {
    var caught = 0;
    for (var i = S.shades.length - 1; i >= 0; i--) {
      var s = S.shades[i];
      var d = dist(s.x, s.y, x, y);
      if (d > radius) continue;
      var force = (1 - d / radius);
      var ang = Math.atan2(s.y - y, s.x - x);
      s.kx += Math.cos(ang) * 420 * force;
      s.ky += Math.sin(ang) * 420 * force;
      s.latched = 0;
      s.hit = 0.25;
      s.hp -= dmg * force + 1;
      caught++;
      if (s.hp <= 0) killShade(i);
    }
    if (refund && u('backdraft') && caught) {
      var back = Math.min(caught * 2 * u('backdraft'), 30);
      S.fuel = Math.min(D.maxFuel, S.fuel + back);
      floatText(x, y - 30, '+' + back + ' back', 'rgba(99,230,190,0.95)', 14);
    }
    return caught;
  }

  function killShade(i) {
    var s = S.shades[i];
    spark(s.x, s.y, Math.round(s.r * 0.9), 'shade', 150, 0.55);
    spark(s.x, s.y, 5, 'gold', 90, 0.4);
    S.shades.splice(i, 1);
    S.kills++;
    if (s.kind === 'husk') S.husks++;
    bumpHeat();
    addScore(s.t.score, s.x, s.y - 12);
    if (u('tinder') && Math.random() < 0.28 * u('tinder')) spawnMote(s.x, s.y);
    SFX.kill();
  }

  // ────────────────────────────────────────────────────────────── update
  function update(dt) {
    S.time += dt;
    S.shake = Math.max(0, S.shake - dt * 26);
    S.fire.flare = Math.max(0, S.fire.flare - dt * 1.9);

    // embers off the fire
    if (Math.random() < dt * (12 + S.fuel * 0.5)) ember(S.fire.x, S.fire.y - 8);

    // particles
    for (var p = S.parts.length - 1; p >= 0; p--) {
      var pt = S.parts[p];
      pt.life -= dt;
      if (pt.life <= 0) { S.parts.splice(p, 1); continue; }
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vy += (pt.g || 0) * dt;
      pt.vx *= (1 - dt * 1.6); pt.vy *= (1 - dt * 1.6);
    }

    // floating numbers
    for (var ft = S.floats.length - 1; ft >= 0; ft--) {
      var f2 = S.floats[ft];
      f2.life -= dt;
      if (f2.life <= 0) { S.floats.splice(ft, 1); continue; }
      f2.y += f2.vy * dt;
      f2.vy *= (1 - dt * 2.4);
    }

    // heat cools off if you stop dispelling
    if (S.heatT > 0) { S.heatT -= dt; if (S.heatT <= 0) S.heat = 0; }

    if (S.mode === 'dawn') {
      S.dawnHold -= dt;
      if (S.dawnHold <= 0) { S.nightT = 0; openDraft(); }
      return;
    }
    if (S.mode !== 'play') return;

    // ── keeper movement
    var k = S.keeper;
    var ix = 0, iy = 0;
    if (keys['arrowleft'] || keys['a']) ix -= 1;
    if (keys['arrowright'] || keys['d']) ix += 1;
    if (keys['arrowup'] || keys['w']) iy -= 1;
    if (keys['arrowdown'] || keys['s']) iy += 1;
    var kd = Math.hypot(ix, iy);
    if (kd > 0) { ix /= kd; iy /= kd; }
    if (stick.on) { ix = stick.dx; iy = stick.dy; }

    var stunned = k.stun > 0;
    k.stun = Math.max(0, k.stun - dt);
    k.guard = Math.max(0, (k.guard || 0) - dt);
    var speed = D.speed * (k.carry ? D.carryMul : 1) * (stunned ? 0.25 : 1);
    k.vx = lerp(k.vx, ix * speed, 1 - Math.pow(0.0008, dt));
    k.vy = lerp(k.vy, iy * speed, 1 - Math.pow(0.0008, dt));
    k.x = clamp(k.x + k.vx * dt, 16, W - 16);
    k.y = clamp(k.y + k.vy * dt, 60, H - 24);
    if (Math.hypot(k.vx, k.vy) > 12) k.face = Math.atan2(k.vy, k.vx);
    k.cd = Math.max(0, k.cd - dt);

    // keep the keeper out of the coals
    var fd = dist(k.x, k.y, S.fire.x, S.fire.y);
    if (fd < K.fireCoreR) {
      var a = Math.atan2(k.y - S.fire.y, k.x - S.fire.x);
      k.x = S.fire.x + Math.cos(a) * K.fireCoreR;
      k.y = S.fire.y + Math.sin(a) * K.fireCoreR;
    }

    // ── logs
    S.logT -= dt;
    if (S.logT <= 0) { spawnLog(); S.logT = logInterval() * D.logRate * rand(0.75, 1.3); }
    for (var i = S.logs.length - 1; i >= 0; i--) {
      var lg = S.logs[i];
      lg.pop = Math.min(1, lg.pop + dt * 3.2);
      if (k.carry < D.carry && dist2(lg.x, lg.y, k.x, k.y) < D.pickupR * D.pickupR) {
        S.logs.splice(i, 1);
        k.carry++;
        SFX.pick(); buzz(8);
        spark(lg.x, lg.y, 5, 'wood', 70, 0.35);
      }
    }

    // ── motes of fire left by dispelled shades (Tinderburst)
    for (var mi = S.motes.length - 1; mi >= 0; mi--) {
      var mo = S.motes[mi];
      mo.life -= dt;
      if (mo.life <= 0) { S.motes.splice(mi, 1); continue; }
      var md = dist(mo.x, mo.y, k.x, k.y);
      if (md < 120) {                       // drift toward the keeper
        var ma = Math.atan2(k.y - mo.y, k.x - mo.x);
        var pull = (1 - md / 120) * 340;
        mo.vx += Math.cos(ma) * pull * dt;
        mo.vy += Math.sin(ma) * pull * dt;
      }
      mo.x += mo.vx * dt; mo.y += mo.vy * dt;
      mo.vx *= Math.pow(0.12, dt); mo.vy *= Math.pow(0.12, dt);
      if (md < 20) {
        S.fuel = Math.min(D.maxFuel, S.fuel + mo.val);
        floatText(mo.x, mo.y - 8, '+' + mo.val, 'rgba(255,214,10,0.95)', 13);
        spark(mo.x, mo.y, 5, 'gold', 70, 0.3);
        tone(880, 0.07, 'triangle', 0.035, 1180);
        S.motes.splice(mi, 1);
      }
    }

    // ── burning ground left by flares (Cinder Trail)
    for (var ci = S.cinders.length - 1; ci >= 0; ci--) {
      var cd3 = S.cinders[ci];
      cd3.life -= dt;
      if (cd3.life <= 0) { S.cinders.splice(ci, 1); continue; }
      for (var cs = S.shades.length - 1; cs >= 0; cs--) {
        var sh = S.shades[cs];
        if (dist2(sh.x, sh.y, cd3.x, cd3.y) < cd3.r * cd3.r) {
          sh.hp -= 4.5 * dt;
          sh.hit = Math.max(sh.hit, 0.1);
          if (sh.hp <= 0) killShade(cs);
        }
      }
    }

    // deposit — everything you are carrying goes on at once
    if (k.carry && fd < D.depositR) {
      var loads = k.carry;
      k.carry = 0;
      var gain = D.logFuel * loads;
      var room = D.maxFuel - S.fuel;
      S.fuel = Math.min(D.maxFuel, S.fuel + gain);
      S.logsBurned += loads;
      addScore(15 * loads, S.fire.x, S.fire.y - 46, 'rgba(255,176,58,0.95)');
      floatText(S.fire.x, S.fire.y - 26, '+' + Math.round(Math.min(gain, Math.max(room, 0))) + ' fire', 'rgba(255,232,140,0.95)', 16);
      S.fire.flare = Math.max(S.fire.flare, 0.75);
      S.shake = Math.max(S.shake, 3.5);
      SFX.feed(); buzz(14);
      for (var e = 0; e < 16; e++) ember(S.fire.x, S.fire.y - 6);
      spark(S.fire.x, S.fire.y - 6, 12, 'gold', 130, 0.7);

      // Pyre — every fourth log goes up properly
      if (u('pyre')) {
        S.pyreCount += loads;
        while (S.pyreCount >= 4) {
          S.pyreCount -= 4;
          S.fire.flare = 1.2;
          S.shake = Math.max(S.shake, 10);
          spark(S.fire.x, S.fire.y, 30, 'gold', 260, 0.7);
          burst(S.fire.x, S.fire.y, D.flareR * 1.25, 5, 0);
          floatText(S.fire.x, S.fire.y - 62, 'PYRE', 'rgba(255,120,20,0.95)', 20);
          SFX.flare();
        }
      }
    }

    // ── shades
    S.spawnT -= dt;
    var interval = Math.max(0.5, 2.0 - S.night * 0.13);
    if (S.spawnT <= 0 && S.shades.length < 28) {
      spawnShade();
      S.spawnT = interval * rand(0.7, 1.3);
    }

    var drain = (K.baseDrain + (S.night - 1) * K.drainPerNight) * D.drainMul;
    for (var j = S.shades.length - 1; j >= 0; j--) {
      var s = S.shades[j];
      s.wob += dt * s.t.wob;
      s.hit = Math.max(0, s.hit - dt);

      var li = lightAt(s.x, s.y);
      s.hp -= li * s.t.burn * D.burnMul * dt;
      if (s.hp <= 0) { killShade(j); continue; }

      var sd = dist(s.x, s.y, S.fire.x, S.fire.y);
      if (sd < K.fireCoreR + 8) {
        s.latched = 1;
        drain += s.t.drain;
      } else {
        s.latched = 0;
        var ang = Math.atan2(S.fire.y - s.y, S.fire.x - s.x);
        var slow = 1 - 0.6 * li;
        var wob = Math.sin(s.wob) * s.t.sway;
        s.x += Math.cos(ang + wob) * s.spd * slow * dt;
        s.y += Math.sin(ang + wob) * s.spd * slow * dt;
      }

      // knockback
      s.x += s.kx * dt; s.y += s.ky * dt;
      s.kx *= Math.pow(0.02, dt); s.ky *= Math.pow(0.02, dt);

      // touching the keeper
      if (k.stun <= 0 && k.guard <= 0 && dist2(s.x, s.y, k.x, k.y) < (s.r + K.keeperR) * (s.r + K.keeperR)) {
        k.stun = D.stunTime;
        k.guard = D.stunTime + D.guard;
        var ka = Math.atan2(k.y - s.y, k.x - s.x);
        k.vx = Math.cos(ka) * 340; k.vy = Math.sin(ka) * 340;
        s.kx = -Math.cos(ka) * 180; s.ky = -Math.sin(ka) * 180;
        S.shake = Math.max(S.shake, 9);
        SFX.hurt(); buzz([12, 40, 12]);
        floatText(k.x, k.y - 34, 'HIT', 'rgba(255,69,58,0.95)', 15);
        S.heat = 0; S.heatT = 0;
        while (k.carry > 0) {
          k.carry--;
          S.logs.push({ x: clamp(k.x + rand(-34, 34), 30, W - 30), y: clamp(k.y + rand(-34, 34), 90, H - 40), a: rand(0, 3.14), pop: 0 });
        }
      }
    }

    // ── fuel + night clock
    var wasLow = S.fuel <= 20;
    S.fuel -= drain * dt;
    S.score += dt * 6 * D.scoreMul;

    if (S.fuel <= 20 && !wasLow) SFX.low();
    if (S.fuel <= 0) {
      if (u('emberheart') && !S.revived) {
        S.revived = true;
        S.fuel = 35;
        S.fire.flare = 1.4;
        S.shake = 16;
        S.shades.length = 0;
        spark(S.fire.x, S.fire.y, 44, 'gold', 260, 1.1);
        floatText(S.fire.x, S.fire.y - 70, 'IT CATCHES', 'rgba(255,120,20,0.98)', 22);
        toast('Ember Heart', 'The fire takes again');
        SFX.dawn(); buzz([40, 60, 40]);
      } else {
        S.fuel = 0; gameOver(); return;
      }
    }

    S.nightT += dt;
    if (S.nightT >= K.nightLen) breakOfDawn();
  }

  function breakOfDawn() {
    S.mode = 'dawn';
    S.dawnHold = 2.2;
    S.score += 120 * S.night * D.scoreMul;
    S.fuel = Math.min(D.maxFuel, S.fuel + D.dawnFuel);
    S.shake = 6;
    for (var i = S.shades.length - 1; i >= 0; i--) {
      spark(S.shades[i].x, S.shades[i].y, 8, 'shade', 190, 0.6);
    }
    S.shades.length = 0;
    S.night++;
    S.nightT = 0;
    SFX.dawn(); buzz([18, 60, 18]);
    var omen = S.night === 3 ? 'Something quicker is out there'
             : S.night === 5 ? 'Husks walk tonight — light alone will not hold them'
             : 'Night ' + S.night + ' begins';
    toast('Dawn', omen);
  }

  // ────────────────────────────────────────────────────────────── render
  function render() {
    var ox = 0, oy = 0;
    if (S.shake > 0.2) { ox = rand(-S.shake, S.shake) * 0.5; oy = rand(-S.shake, S.shake) * 0.5; }

    ctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR);
    ctx.clearRect(-20, -20, W + 40, H + 40);
    ctx.drawImage(groundCvs, 0, 0, W, H);

    drawCinders();
    drawLogs();
    drawFire();
    drawShades();
    drawKeeper();

    drawDarkness();
    drawGlow();
    drawParticles();
    drawMotes();
    drawFloats();
    drawStick();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function drawLogs() {
    for (var i = 0; i < S.logs.length; i++) {
      var l = S.logs[i];
      var sc = 0.6 + 0.4 * l.pop;
      var li = lightAt(l.x, l.y);
      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.a);
      ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.ellipse(0, 6, 16, 5, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = 'rgb(' + Math.round(56 + li * 78) + ',' + Math.round(38 + li * 50) + ',' + Math.round(24 + li * 26) + ')';
      roundRect(-16, -6, 32, 12, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(20,12,8,0.75)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(-6, 6); ctx.moveTo(5, -6); ctx.lineTo(5, 6); ctx.stroke();
      ctx.fillStyle = 'rgba(' + Math.round(120 + li * 90) + ',' + Math.round(92 + li * 60) + ',60,0.9)';
      ctx.beginPath(); ctx.ellipse(-15, 0, 3, 5.5, 0, 0, 6.29); ctx.fill();
      ctx.restore();
    }
  }

  function drawCinders() {
    if (!S.cinders.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.cinders.length; i++) {
      var c = S.cinders[i];
      var t = clamp(c.life / c.max, 0, 1);
      var g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
      g.addColorStop(0, 'rgba(255,150,40,' + (0.30 * t).toFixed(3) + ')');
      g.addColorStop(0.6, 'rgba(220,80,20,' + (0.16 * t).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(160,40,10,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.29); ctx.fill();
      if (Math.random() < 0.25) ember(c.x + rand(-c.r * 0.6, c.r * 0.6), c.y);
    }
    ctx.restore();
  }

  function drawMotes() {
    if (!S.motes.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.motes.length; i++) {
      var m = S.motes[i];
      var pulse = 0.7 + 0.3 * Math.sin(S.time * 9 + i);
      var fade = clamp(m.life / 1.6, 0, 1);
      var g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 16 * pulse);
      g.addColorStop(0, 'rgba(255,236,150,' + (0.95 * fade).toFixed(3) + ')');
      g.addColorStop(0.35, 'rgba(255,176,58,' + (0.5 * fade).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,140,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x, m.y, 16 * pulse, 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  function drawFloats() {
    if (!S.floats.length) return;
    ctx.save();
    ctx.textAlign = 'center';
    for (var i = 0; i < S.floats.length; i++) {
      var f = S.floats[i];
      var t = clamp(f.life / f.max, 0, 1);
      var rise = (1 - t) * 8;
      ctx.globalAlpha = t < 0.35 ? t / 0.35 : 1;
      ctx.font = '700 ' + f.size + 'px ' + "-apple-system, 'SF Pro Text', system-ui, sans-serif";
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillText(f.txt, f.x, f.y - rise + 1.5);
      ctx.fillStyle = f.col;
      ctx.fillText(f.txt, f.x, f.y - rise);
    }
    ctx.restore();
  }

  function drawFire() {
    var f = S.fire;
    var lvl = S.fuel / D.maxFuel;
    var t = S.time;
    var pulse = 1 + Math.sin(t * 9) * 0.06 + Math.sin(t * 3.3) * 0.04 + S.fire.flare * 0.5;
    var h = (16 + lvl * 40) * pulse;

    // coals
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(f.x, f.y + 12, 40, 13, 0, 0, 6.29); ctx.fill();
    for (var i = 0; i < 7; i++) {
      var a = i * 0.9 + 0.4;
      var cg = 0.35 + 0.45 * lvl + Math.sin(t * 4 + i) * 0.12;
      ctx.fillStyle = 'rgba(' + Math.round(150 + 100 * cg) + ',' + Math.round(50 + 40 * cg) + ',20,' + clamp(cg, 0.12, 0.9) + ')';
      ctx.beginPath();
      ctx.ellipse(f.x + Math.cos(a) * 17, f.y + 8 + Math.sin(a) * 6, 7, 4, a, 0, 6.29);
      ctx.fill();
    }
    ctx.restore();

    if (lvl <= 0.001) return;

    // flame body — additive, three tapering tongues
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var tips = [
      { w: 25, h: 1.00, sp: 4.4, sw: 5.5, top: 'rgba(255,120,20,0.00)', mid: 'rgba(226,96,26,0.50)', hot: 'rgba(255,150,40,0.34)' },
      { w: 17, h: 0.74, sp: 6.7, sw: 4.0, top: 'rgba(255,190,60,0.00)', mid: 'rgba(255,168,32,0.62)', hot: 'rgba(255,206,90,0.48)' },
      { w: 9.5, h: 0.48, sp: 9.1, sw: 2.6, top: 'rgba(255,244,190,0.00)', mid: 'rgba(255,240,180,0.85)', hot: 'rgba(255,252,232,0.92)' }
    ];
    for (var L = 0; L < tips.length; L++) {
      var T = tips[L];
      var w = T.w * pulse * (0.55 + lvl * 0.55);
      var hh = h * T.h;
      var sway = Math.sin(t * T.sp + L * 1.7) * T.sw;
      var flick = 1 + Math.sin(t * (T.sp * 2.3) + L) * 0.07;
      var base = f.y + 9;
      var tipY = base - hh * flick;

      var fg = ctx.createLinearGradient(f.x, base, f.x, tipY);
      fg.addColorStop(0, T.hot);
      fg.addColorStop(0.42, T.mid);
      fg.addColorStop(1, T.top);

      ctx.beginPath();
      ctx.moveTo(f.x - w, base);
      // left edge sweeps in toward the tip
      ctx.bezierCurveTo(f.x - w * 0.98, base - hh * 0.36,
                        f.x - w * 0.42 + sway * 0.7, base - hh * 0.68,
                        f.x + sway, tipY);
      // right edge back down
      ctx.bezierCurveTo(f.x + w * 0.42 + sway * 0.7, base - hh * 0.68,
                        f.x + w * 0.98, base - hh * 0.36,
                        f.x + w, base);
      ctx.quadraticCurveTo(f.x, base + 5, f.x - w, base);
      ctx.closePath();
      ctx.fillStyle = fg;
      ctx.fill();
    }
    ctx.restore();
  }

  function drawKeeper() {
    var k = S.keeper;
    var bob = Math.sin(S.time * 9) * (Math.hypot(k.vx, k.vy) > 30 ? 1.7 : 0.5);
    ctx.save();
    ctx.translate(k.x, k.y + bob);

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(0, 12 - bob, 12, 4.5, 0, 0, 6.29); ctx.fill();

    var flashing = k.stun > 0 && Math.floor(S.time * 22) % 2 === 0;

    // cloak
    ctx.fillStyle = flashing ? '#FF453A' : '#2E2A33';
    ctx.beginPath();
    ctx.moveTo(-10, 12); ctx.quadraticCurveTo(-9, -6, 0, -9);
    ctx.quadraticCurveTo(9, -6, 10, 12);
    ctx.quadraticCurveTo(0, 15, -10, 12);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(232,220,200,0.28)'; ctx.lineWidth = 1.1; ctx.stroke();

    // head
    ctx.fillStyle = flashing ? '#FFD9D6' : '#E8DCC8';
    ctx.beginPath(); ctx.arc(0, -13, 5.6, 0, 6.29); ctx.fill();
    // hood brim
    ctx.fillStyle = '#3A343E';
    ctx.beginPath(); ctx.arc(0, -14.5, 6.4, Math.PI, 0); ctx.fill();

    // carried logs, stacked
    for (var ci = 0; ci < k.carry; ci++) {
      ctx.save();
      ctx.translate(0, -30 - ci * 9);
      ctx.rotate(Math.sin(S.time * 5 + ci * 0.8) * 0.09);
      ctx.fillStyle = ci % 2 ? '#7A5433' : '#6B4A2C';
      roundRect(-11.5, -4, 23, 8, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(20,12,8,0.7)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-3.5, -4); ctx.lineTo(-3.5, 4); ctx.stroke();
      ctx.fillStyle = 'rgba(190,150,90,0.85)';
      ctx.beginPath(); ctx.ellipse(-11, 0, 2.4, 4, 0, 0, 6.29); ctx.fill();
      ctx.restore();
    }

    // lantern arm
    var lx = Math.cos(k.face) * 13, ly = Math.sin(k.face) * 8 + 1;
    ctx.strokeStyle = 'rgba(232,220,200,0.5)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.fillStyle = '#FFD60A';
    ctx.beginPath(); ctx.arc(lx, ly, 3.4, 0, 6.29); ctx.fill();

    ctx.restore();
  }

  function drawShades() {
    for (var i = 0; i < S.shades.length; i++) {
      var s = S.shades[i];
      var li = lightAt(s.x, s.y);
      var hpF = clamp(s.hp / s.maxHp, 0, 1);
      var wob = Math.sin(s.wob) * (s.kind === 'wisp' ? 3 : 1.6);
      ctx.save();
      ctx.translate(s.x, s.y);

      // body — a torn wisp of dark
      ctx.globalAlpha = 0.55 + 0.45 * hpF;
      var grd = ctx.createRadialGradient(0, 0, 1, 0, 0, s.r * 1.7);
      var tint = s.hit > 0 ? '90,40,60' : s.t.tint;
      grd.addColorStop(0, 'rgba(' + tint + ',0.98)');
      grd.addColorStop(0.6, 'rgba(' + tint + ',0.55)');
      grd.addColorStop(1, 'rgba(10,6,14,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(-s.r + wob * 0.3, s.r * 0.5);
      ctx.quadraticCurveTo(-s.r * 1.1, -s.r * 0.9, wob, -s.r * 1.25);
      ctx.quadraticCurveTo(s.r * 1.1, -s.r * 0.9, s.r + wob * 0.3, s.r * 0.5);
      ctx.quadraticCurveTo(s.r * 0.4, s.r * 1.3 + wob, 0, s.r * 0.9);
      ctx.quadraticCurveTo(-s.r * 0.4, s.r * 1.3 - wob, -s.r + wob * 0.3, s.r * 0.5);
      ctx.closePath();
      ctx.fill();

      // burning-away shimmer — a scorched rim, so the body stays dark.
      // A husk shrugs most of it off, which is the visual tell that it will last.
      if (li > 0.12) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = li * 0.62 * (s.t.burn / 5.2);
        ctx.strokeStyle = 'rgba(255,150,40,0.75)';
        ctx.lineWidth = 2.2 + Math.sin(S.time * 14 + s.wob) * 0.7;
        ctx.beginPath(); ctx.arc(0, 0, s.r * 1.02, 0, 6.29); ctx.stroke();
        ctx.globalAlpha = li * 0.16 * (s.t.burn / 5.2);
        ctx.fillStyle = 'rgba(255,159,10,0.6)';
        ctx.beginPath(); ctx.arc(0, 0, s.r * 1.02, 0, 6.29); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }

      // husks carry a cracked ember core that dims as they take damage
      if (s.kind === 'husk') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + 0.4 * hpF;
        ctx.strokeStyle = 'rgba(255,120,20,0.85)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-5, -7); ctx.lineTo(-1.5, -1); ctx.lineTo(-5.5, 3.5);
        ctx.moveTo(4.5, -6); ctx.lineTo(1.5, 1.5); ctx.lineTo(5, 7);
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.restore();
    }
  }

  // darkness mask: black sheet with the light punched out
  function drawDarkness() {
    var lr = lightRadius();
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.fillStyle = 'rgba(3,2,6,0.93)';
    dctx.clearRect(0, 0, W, H);
    dctx.fillRect(0, 0, W, H);

    dctx.globalCompositeOperation = 'destination-out';
    // fire light
    var g1 = dctx.createRadialGradient(S.fire.x, S.fire.y, 0, S.fire.x, S.fire.y, lr);
    g1.addColorStop(0, 'rgba(0,0,0,1)');
    g1.addColorStop(0.42, 'rgba(0,0,0,0.94)');
    g1.addColorStop(0.78, 'rgba(0,0,0,0.42)');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g1;
    dctx.beginPath(); dctx.arc(S.fire.x, S.fire.y, lr, 0, 6.29); dctx.fill();
    // lantern
    var k = S.keeper;
    var g2 = dctx.createRadialGradient(k.x, k.y, 0, k.x, k.y, D.lampR);
    g2.addColorStop(0, 'rgba(0,0,0,0.86)');
    g2.addColorStop(0.55, 'rgba(0,0,0,0.44)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g2;
    dctx.beginPath(); dctx.arc(k.x, k.y, D.lampR, 0, 6.29); dctx.fill();

    dctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(darkCvs, 0, 0, W, H);
  }

  // warm additive bloom, drawn on top of the darkness
  function drawGlow() {
    var lr = lightRadius();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    var g = ctx.createRadialGradient(S.fire.x, S.fire.y, 0, S.fire.x, S.fire.y, lr);
    var warm = 0.10 + (S.fuel / D.maxFuel) * 0.16 + S.fire.flare * 0.2;
    g.addColorStop(0, 'rgba(255,176,58,' + (warm * 1.5).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(255,120,30,' + (warm * 0.5).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(S.fire.x, S.fire.y, lr, 0, 6.29); ctx.fill();

    var k = S.keeper;
    var g2 = ctx.createRadialGradient(k.x, k.y, 0, k.x, k.y, D.lampR);
    g2.addColorStop(0, 'rgba(255,214,10,0.15)');
    g2.addColorStop(1, 'rgba(255,214,10,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(k.x, k.y, D.lampR, 0, 6.29); ctx.fill();

    // flare shockwave
    if (S.keeper.cd > D.flareCd - 0.45) {
      var t = 1 - (S.keeper.cd - (D.flareCd - 0.45)) / 0.45;
      ctx.strokeStyle = 'rgba(255,214,10,' + (0.5 * (1 - t)).toFixed(3) + ')';
      ctx.lineWidth = 6 * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(k.x, k.y, D.flareR * t, 0, 6.29); ctx.stroke();
    }

    // log glints — a wet-bark catchlight so wood is findable out in the dark
    for (var g3 = 0; g3 < S.logs.length; g3++) {
      var lgg = S.logs[g3];
      var dark = 1 - lightAt(lgg.x, lgg.y);
      var tw = 0.5 + 0.5 * Math.sin(S.time * 2.2 + g3 * 1.9);
      var seen = u('nightsight') ? 0.34 : 0;
      ctx.fillStyle = 'rgba(255,176,80,' + (0.10 + seen + dark * 0.20 * tw).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(lgg.x, lgg.y, 13 * lgg.pop, 5.5 * lgg.pop, lgg.a, 0, 6.29);
      ctx.fill();
    }

    // something is on the fire — bleed a warning ring off the coals
    var latched = 0;
    for (var q = 0; q < S.shades.length; q++) if (S.shades[q].latched) latched++;
    if (latched) {
      var lp = 0.5 + 0.5 * Math.sin(S.time * 11);
      ctx.strokeStyle = 'rgba(255,69,58,' + (0.14 + 0.2 * lp + latched * 0.05).toFixed(3) + ')';
      ctx.lineWidth = 2 + lp * 2;
      ctx.beginPath();
      ctx.arc(S.fire.x, S.fire.y, K.fireCoreR + 12 + lp * 5, 0, 6.29);
      ctx.stroke();
    }

    // shade eyes — always faintly visible in the dark
    for (var i = 0; i < S.shades.length; i++) {
      var s = S.shades[i];
      var eo = s.t.eyeGap;
      if (u('nightsight')) {
        ctx.strokeStyle = s.t.eye;
        ctx.globalAlpha = 0.30;
        ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.1, 0, 6.29); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = s.t.eye;
      ctx.beginPath(); ctx.arc(s.x - eo, s.y - 2, 1.7, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(s.x + eo, s.y - 2, 1.7, 0, 6.29); ctx.fill();
    }

    // dawn wash
    if (S.mode === 'dawn') {
      var d = clamp(1 - Math.abs(S.dawnHold - 1.1) / 1.1, 0, 1);
      ctx.fillStyle = 'rgba(255,190,110,' + (d * 0.3).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();

    // low-fuel warning vignette
    if (S.mode === 'play' && S.fuel < 22) {
      var a = (1 - S.fuel / 22) * (0.16 + Math.sin(S.time * 6) * 0.08);
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.62);
      vg.addColorStop(0, 'rgba(255,69,58,0)');
      vg.addColorStop(1, 'rgba(255,69,58,' + clamp(a, 0, 0.4).toFixed(3) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.parts.length; i++) {
      var p = S.parts[i];
      var t = clamp(p.life / p.max, 0, 1);
      var col;
      if (p.c === 'ember') col = 'rgba(255,' + Math.round(120 + 100 * t) + ',40,' + (t * 0.85).toFixed(3) + ')';
      else if (p.c === 'gold') col = 'rgba(255,214,10,' + (t * 0.9).toFixed(3) + ')';
      else if (p.c === 'wood') col = 'rgba(190,150,90,' + (t * 0.8).toFixed(3) + ')';
      else col = 'rgba(150,110,220,' + (t * 0.75).toFixed(3) + ')';
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + t * 0.8), 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  function drawStick() {
    if (!stick.on || S.mode !== 'play') return;
    ctx.save();
    ctx.strokeStyle = 'rgba(232,220,200,0.20)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 46, 0, 6.29); ctx.stroke();
    ctx.fillStyle = 'rgba(232,220,200,0.22)';
    ctx.beginPath(); ctx.arc(stick.ox + stick.dx * 40, stick.oy + stick.dy * 40, 17, 0, 6.29); ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ────────────────────────────────────────────────────────────── DOM / HUD
  var elHud = document.getElementById('hud');
  var elFuelBar = document.getElementById('fuelBar');
  var elFuelFill = elFuelBar.firstElementChild;
  var elFuelNum = document.getElementById('fuelNum');
  var elDawnFill = document.querySelector('#dawnBar i');
  var elNight = document.getElementById('nightNum');
  var elScore = document.getElementById('scoreNum');
  var elVeil = document.getElementById('veil');
  var elCard = document.getElementById('card');
  var elPause = document.getElementById('pause');
  var elToast = document.getElementById('toast');
  var elFlareFill = flareBtn.querySelector('.fill');
  var elHud2 = document.getElementById('hud2');
  var elHeat = document.getElementById('heat');
  var elChips = document.getElementById('chips');
  function chipSig() { var o = ''; for (var k in S.up) o += k + S.up[k]; return o; }

  function syncHud() {
    var pct = clamp(S.fuel / D.maxFuel, 0, 1);
    elFuelFill.style.width = (pct * 100).toFixed(1) + '%';
    elFuelBar.classList.toggle('low', pct < 0.22);
    elFuelNum.textContent = Math.round(S.fuel);
    elDawnFill.style.width = (clamp(S.nightT / K.nightLen, 0, 1) * 100).toFixed(1) + '%';
    elNight.textContent = S.night;
    elScore.textContent = Math.round(S.score).toLocaleString();
    // heat pill + held-upgrade chips
    if (S.heat > 1) {
      elHeat.textContent = '×' + S.heat;
      elHeat.className = 'show' + (S.heat >= 15 ? ' hot' : S.heat >= 7 ? ' warm' : '');
      elHeat.style.opacity = clamp(S.heatT / 1.2, 0.35, 1);
    } else if (elHeat.className !== '') { elHeat.className = ''; }

    if (S._chipSig !== chipSig()) { S._chipSig = chipSig(); elChips.innerHTML = upChips(S.up); }

    var charging = S.keeper.cd > 0;
    var poor = S.fuel < D.flareCost + 2;
    var cd = clamp(1 - S.keeper.cd / D.flareCd, 0, 1);
    elFlareFill.style.height = charging ? (cd * 100).toFixed(0) + '%' : '0%';
    flareBtn.classList.toggle('cool', charging || poor);
    flareBtn.classList.toggle('ready', !charging && !poor);
  }

  var toastT = null;
  function toast(a, b) {
    elToast.querySelector('.t1').textContent = a;
    elToast.querySelector('.t2').textContent = b || '';
    elToast.classList.remove('show');
    void elToast.offsetWidth;
    elToast.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { elToast.classList.remove('show'); }, 1800);
  }

  function showChrome(on) {
    elHud2.classList.toggle('on', on);
    elHud.classList.toggle('on', on);
    flareBtn.classList.toggle('on', on);
    elPause.classList.toggle('on', on);
  }

  function veil(html, cls) {
    elCard.className = 'card' + (cls ? ' ' + cls : '');
    elCard.innerHTML = html;
    elVeil.classList.remove('hide');
    elVeil.scrollTop = 0;
  }
  function hideVeil() { elVeil.classList.add('hide'); }
  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ── shared fragments ──────────────────────────────────────────────────────
  function levelStrip() {
    var L = levelInfo(META.xp);
    var pct = clamp(L.into / L.need, 0, 1) * 100;
    return '<div class="lvl">' +
      '<div class="lvl-top"><b>Keeper level ' + L.level + '</b>' +
        '<span class="embers">' + META.embers.toLocaleString() + ' <i>embers</i></span></div>' +
      '<div class="xp"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="lvl-sub">' + L.into.toLocaleString() + ' / ' + L.need.toLocaleString() + ' to level ' + (L.level + 1) + nextUnlockNote(L.level) + '</div>' +
    '</div>';
  }
  function nextUnlockNote(level) {
    var soon = [];
    for (var i = 0; i < UPGRADES.length; i++) if (UPGRADES[i].lv === level + 1) soon.push(UPGRADES[i].name);
    return soon.length ? ' · unlocks ' + soon.join(' & ') : '';
  }
  function upChips(map, big) {
    var out = '', ids = Object.keys(map || {});
    if (!ids.length) return '<div class="none">Nothing drafted yet.</div>';
    // the in-play strip has a pause button to stay clear of, so it elides
    var cap = big ? ids.length : 8;
    var over = ids.length - cap;
    if (over > 0) ids = ids.slice(0, cap);
    for (var i = 0; i < ids.length; i++) {
      var def = UP_BY_ID[ids[i]]; if (!def || !map[ids[i]]) continue;
      out += '<span class="chip t' + def.tier + (big ? ' big' : '') + '" title="' + esc(def.desc) + '">' +
             '<em>' + def.glyph + '</em>' + (big ? '<b>' + esc(def.name) + '</b>' : '') +
             (map[ids[i]] > 1 ? '<u>×' + map[ids[i]] + '</u>' : '') + '</span>';
    }
    if (over > 0) out += '<span class="chip more">+' + over + '</span>';
    return out;
  }

  // ── camp: the hub between runs ────────────────────────────────────────────
  function menu() {
    S.mode = 'menu';
    showChrome(false);
    var lvl = keeperLevel();
    var locked = 0;
    for (var i = 0; i < UPGRADES.length; i++) if (UPGRADES[i].lv > lvl) locked++;
    var feats = 0;
    for (var j = 0; j < ACHIEVEMENTS.length; j++) if (META.ach[ACHIEVEMENTS[j].id]) feats++;

    veil(
      '<div class="eyebrow">The Keeper</div>' +
      '<h1>Night<em>Watch</em></h1>' +
      (META.runs
        ? levelStrip() +
          '<div class="tally sm">' +
            '<div><span>Best night</span><b>' + META.bestNight + '</b></div>' +
            '<div><span>Best score</span><b>' + META.bestScore.toLocaleString() + '</b></div>' +
            '<div><span>Watches</span><b>' + META.runs + '</b></div>' +
          '</div>'
        : '<p class="lede">The fire is the only thing between you and what waits past the light. Keep it burning until dawn.</p>' +
          '<ul class="rules">' +
            '<li><span class="glyph">🪵</span><span>Walk over <b>logs</b> to pick one up. Carry it into the fire to feed it.</span></li>' +
            '<li><span class="glyph">🔥</span><span>The fire burns down on its own — and a bigger fire throws a <b>wider ring of light</b>.</span></li>' +
            '<li><span class="glyph">👁</span><span><b>Shades</b> crawl in from the dark to drain it. Light burns them; your lantern helps.</span></li>' +
            '<li><span class="glyph">✦</span><span><b>Flare</b> blasts them back — but it costs fire. Later nights bring <b>husks</b> that shrug off firelight.</span></li>' +
            '<li><span class="glyph">🌅</span><span>Survive to <b>dawn</b> and you draft an upgrade. Embers you earn buy permanent gear.</span></li>' +
          '</ul>') +
      '<button class="go" id="btnStart">Take the Watch</button>' +
      '<div class="row2">' +
        '<button class="ghost" id="btnShop">Provisions</button>' +
        '<button class="ghost" id="btnFeats">Feats · ' + feats + '/' + ACHIEVEMENTS.length + '</button>' +
      '</div>' +
      '<div class="foot">' + (locked ? locked + ' upgrades still locked · level up to draft them' : 'Every upgrade unlocked') + '</div>'
    );
    on('btnStart', startGame);
    on('btnShop', shop);
    on('btnFeats', feats2);
  }

  // ── provisions: spend embers on things that persist ───────────────────────
  function shop() {
    S.mode = 'menu';
    var rows = '';
    for (var i = 0; i < PERKS.length; i++) {
      var P = PERKS[i], r = pk(P.id), maxed = r >= P.ranks;
      var cost = maxed ? 0 : P.cost[r];
      var afford = !maxed && META.embers >= cost;
      var pips = '';
      for (var d = 0; d < P.ranks; d++) pips += '<i class="' + (d < r ? 'on' : '') + '"></i>';
      rows +=
        '<div class="shop' + (maxed ? ' maxed' : '') + '">' +
          '<div class="sg">' + P.glyph + '</div>' +
          '<div class="sb">' +
            '<b>' + esc(P.name) + '</b>' +
            '<span>' + esc(P.desc(Math.min(r + (maxed ? 0 : 1), P.ranks))) + '</span>' +
            '<div class="pips">' + pips + '</div>' +
          '</div>' +
          (maxed
            ? '<div class="sc done">MAX</div>'
            : '<button class="sc' + (afford ? ' can' : '') + '" data-perk="' + P.id + '">' + cost + '</button>') +
        '</div>';
    }
    veil(
      '<div class="eyebrow">Provisions</div>' +
      '<h1>The <em>Store</em></h1>' +
      levelStrip() +
      '<div class="shoplist">' + rows + '</div>' +
      '<button class="ghost" id="btnBack">Back to camp</button>',
      'wide'
    );
    var btns = elCard.querySelectorAll('button[data-perk]');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var id = this.getAttribute('data-perk');
        var P2 = null;
        for (var q = 0; q < PERKS.length; q++) if (PERKS[q].id === id) P2 = PERKS[q];
        if (!P2) return;
        var rank = pk(id);
        if (rank >= P2.ranks) return;
        var price = P2.cost[rank];
        if (META.embers < price) { tone(140, 0.09, 'square', 0.04); return; }
        META.embers -= price;
        META.perks[id] = rank + 1;
        saveMeta(); recalc();
        tone(660, 0.12, 'triangle', 0.06, 990);
        buzz(14);
        shop();
      });
    }
    on('btnBack', menu);
  }

  // ── feats ─────────────────────────────────────────────────────────────────
  function feats2() {
    S.mode = 'menu';
    var rows = '';
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      var A = ACHIEVEMENTS[i], got = !!META.ach[A.id];
      rows += '<div class="feat' + (got ? ' got' : '') + '">' +
        '<div class="fk">' + (got ? '✓' : '·') + '</div>' +
        '<div class="fb"><b>' + esc(A.name) + '</b><span>' + esc(A.desc) + '</span></div>' +
        '<div class="fe">' + A.embers + '</div>' +
      '</div>';
    }
    veil(
      '<div class="eyebrow">Feats</div>' +
      '<h1>The <em>Ledger</em></h1>' +
      '<div class="shoplist">' + rows + '</div>' +
      '<button class="ghost" id="btnBack">Back to camp</button>',
      'wide'
    );
    on('btnBack', menu);
  }

  // ── the dawn draft ────────────────────────────────────────────────────────
  function draftPool() {
    var lvl = keeperLevel(), pool = [];
    for (var i = 0; i < UPGRADES.length; i++) {
      var U = UPGRADES[i];
      if (U.lv > lvl) continue;
      if (u(U.id) >= U.max) continue;
      var w = U.tier === 1 ? 10 : U.tier === 2 ? 4 : 1.5;
      if (u(U.id) > 0) w *= 0.7;              // mild nudge toward variety
      pool.push({ up: U, w: w });
    }
    return pool;
  }
  function rollDraft(n) {
    var pool = draftPool(), out = [];
    while (out.length < n && pool.length) {
      var total = 0, i;
      for (i = 0; i < pool.length; i++) total += pool[i].w;
      var roll = Math.random() * total, acc = 0, pickIdx = pool.length - 1;
      for (i = 0; i < pool.length; i++) { acc += pool[i].w; if (roll <= acc) { pickIdx = i; break; } }
      out.push(pool[pickIdx].up);
      pool.splice(pickIdx, 1);
    }
    return out;
  }

  function openDraft() {
    var offer = rollDraft(3);
    if (!offer.length) { S.mode = 'play'; hideVeil(); showChrome(true); return; }  // everything maxed
    S.mode = 'draft';
    showChrome(false);
    renderDraft(offer);
  }

  function renderDraft(offer) {
    var cards = '';
    for (var i = 0; i < offer.length; i++) {
      var U = offer[i], have = u(U.id);
      cards +=
        '<button class="dcard t' + U.tier + '" data-up="' + U.id + '">' +
          '<div class="dg">' + U.glyph + '</div>' +
          '<div class="db">' +
            '<b>' + esc(U.name) + '</b>' +
            '<span>' + esc(U.desc) + '</span>' +
          '</div>' +
          '<div class="dt">' + (U.tier === 3 ? 'RARE' : U.tier === 2 ? 'UNCOMMON' : '') +
            (have ? '<u>' + have + '/' + U.max + '</u>' : '') + '</div>' +
        '</button>';
    }
    veil(
      '<div class="eyebrow">Dawn · Night ' + S.night + '</div>' +
      '<h1>Take <em>One</em></h1>' +
      (upCount() ? '<div class="held">' + upChips(S.up) + '</div>' : '') +
      '<div class="draft">' + cards + '</div>' +
      (S.rerolls > 0 ? '<button class="ghost" id="btnRe">Reroll · ' + S.rerolls + ' left</button>' : ''),
      'wide'
    );
    var btns = elCard.querySelectorAll('button[data-up]');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () { takeUpgrade(this.getAttribute('data-up')); });
    }
    on('btnRe', function () {
      if (S.rerolls <= 0) return;
      S.rerolls--;
      tone(520, 0.1, 'triangle', 0.05, 700);
      renderDraft(rollDraft(3));
    });
  }

  function takeUpgrade(id) {
    var def = UP_BY_ID[id];
    if (!def) return;
    S.up[id] = (S.up[id] || 0) + 1;
    recalc();
    S.fuel = Math.min(S.fuel, D.maxFuel);
    tone(700, 0.16, 'triangle', 0.06, 1050);
    buzz(18);
    S.mode = 'play';
    S.nightT = 0;
    hideVeil();
    showChrome(true);
    toast(def.glyph + ' ' + def.name, def.desc);
    last = performance.now();
  }

  // ── run bookkeeping ───────────────────────────────────────────────────────
  function finishRun() {
    var r = {
      night: S.night, score: Math.round(S.score), logs: S.logsBurned, kills: S.kills,
      husks: S.husks, flares: S.flares, upCount: upCount(), bestHeat: S.bestHeat
    };
    var base = Math.round(r.score / 22) + r.night * 12;
    var embers = Math.max(1, Math.round(base * (1 + pk('sifter') * 0.12)));
    var runEmbers = embers;

    var newAch = [];
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      var A = ACHIEVEMENTS[i];
      if (!META.ach[A.id] && A.test(r)) { META.ach[A.id] = 1; newAch.push(A); embers += A.embers; }
    }

    var before = keeperLevel();
    META.embers += embers;
    META.xp += embers;
    META.runs++;
    META.lifeLogs += r.logs;
    META.lifeKills += r.kills;
    if (r.night > META.bestNight) META.bestNight = r.night;
    if (r.score > META.bestScore) META.bestScore = r.score;
    var after = keeperLevel();
    saveMeta();
    return { r: r, embers: embers, runEmbers: runEmbers, newAch: newAch, before: before, after: after };
  }

  function startGame() {
    S.up = {};          // clear the last run's draft *before* deriving stats
    recalc();
    S.mode = 'play';
    S.time = 0; S.night = 1; S.nightT = 0; S.score = 0;
    S.logs.length = 0; S.shades.length = 0; S.parts.length = 0;
    S.motes.length = 0; S.cinders.length = 0; S.floats.length = 0;
    S.logT = 0.6; S.spawnT = 3.2; S.shake = 0;
    S.kills = 0; S.logsBurned = 0; S.husks = 0; S.flares = 0;
    S.heat = 0; S.heatT = 0; S.bestHeat = 0;
    S.revived = false; S.pyreCount = 0; S.earned = null;
    S.rerolls = D.rerolls;
    S.fire.flare = 0.8;

    // Head Start hands you upgrades before the first night
    var hs = pk('headstart'), given = [];
    for (var i = 0; i < hs; i++) {
      var pick = rollDraft(1)[0];
      if (pick) { S.up[pick.id] = (S.up[pick.id] || 0) + 1; given.push(pick); recalc(); }
    }

    S.fuel = D.startFuel;
    S.keeper.x = W / 2; S.keeper.y = H / 2 + 96;
    S.keeper.vx = 0; S.keeper.vy = 0;
    S.keeper.carry = 0; S.keeper.cd = 0; S.keeper.stun = 0; S.keeper.guard = 0;
    S.keeper.face = -Math.PI / 2;
    stick.id = null; stick.on = false; stick.dx = 0; stick.dy = 0;
    for (var j = 0; j < 3; j++) spawnLog();
    hideVeil();
    showChrome(true);
    ac();
    last = performance.now();
    toast('Night 1', given.length ? given[0].glyph + ' ' + given[0].name : 'Hold the light');
  }

  function togglePause() {
    if (S.mode === 'play' || S.mode === 'dawn') {
      S._resume = S.mode;
      S.mode = 'paused';
      showChrome(false);
      veil(
        '<div class="eyebrow">Paused</div>' +
        '<h1>Hold<em>Fast</em></h1>' +
        '<div class="tally sm">' +
          '<div><span>Night</span><b>' + S.night + '</b></div>' +
          '<div><span>Score</span><b>' + Math.round(S.score).toLocaleString() + '</b></div>' +
          '<div><span>Fire</span><b>' + Math.round(S.fuel) + '</b></div>' +
        '</div>' +
        '<div class="held big">' + upChips(S.up, true) + '</div>' +
        '<button class="go" id="btnResume">Resume</button>' +
        '<button class="ghost" id="btnSound">Sound · ' + (S.muted ? 'Off' : 'On') + '</button>' +
        '<button class="ghost" id="btnQuit">Abandon the Watch</button>',
        'wide'
      );
      on('btnResume', togglePause);
      on('btnQuit', function () { finishRun(); menu(); });
      on('btnSound', function () {
        S.muted = !S.muted;
        try { localStorage.setItem(MUTE_KEY, S.muted ? '1' : '0'); } catch (e) {}
        this.textContent = 'Sound · ' + (S.muted ? 'Off' : 'On');
      });
    } else if (S.mode === 'paused') {
      S.mode = S._resume || 'play';
      hideVeil();
      showChrome(true);
      last = performance.now();
    }
  }

  function gameOver() {
    S.mode = 'over';
    S.shake = 14;
    showChrome(false);
    SFX.dead(); buzz([30, 80, 30, 80, 60]);
    spark(S.fire.x, S.fire.y, 40, 'ember', 200, 1.2);

    var out = finishRun();
    var r = out.r;
    var levelled = out.after > out.before;
    var L = levelInfo(META.xp);
    var pct = clamp(L.into / L.need, 0, 1) * 100;

    var achHtml = '';
    if (out.newAch.length) {
      achHtml = '<div class="newfeats"><span>Feats earned</span>';
      for (var i = 0; i < out.newAch.length; i++) {
        achHtml += '<div><b>' + esc(out.newAch[i].name) + '</b><u>+' + out.newAch[i].embers + '</u></div>';
      }
      achHtml += '</div>';
    }

    setTimeout(function () {
      veil(
        '<div class="eyebrow">' + (r.score > 0 && r.score >= META.bestScore ? 'New Best' : 'The fire went out') + '</div>' +
        '<h1>Cold<em>Ashes</em></h1>' +
        '<p class="lede">' + epitaph() + '</p>' +
        '<div class="tally">' +
          '<div><span>Night</span><b>' + r.night + '</b></div>' +
          '<div><span>Score</span><b class="' + (r.score >= META.bestScore ? 'hi' : '') + '">' + r.score.toLocaleString() + '</b></div>' +
          '<div><span>Embers</span><b class="hi">+' + out.embers + '</b></div>' +
        '</div>' +
        achHtml +
        (levelled ? '<div class="levelup">Keeper level ' + out.after + nextUnlockNote(out.after - 1) + '</div>' : '') +
        '<div class="lvl tight">' +
          '<div class="lvl-top"><b>Level ' + L.level + '</b><span class="embers">' + META.embers.toLocaleString() + ' <i>embers</i></span></div>' +
          '<div class="xp"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
        '</div>' +
        '<div class="held big">' + upChips(S.up, true) + '</div>' +
        '<button class="go" id="btnAgain">Take the Watch Again</button>' +
        '<div class="row2">' +
          '<button class="ghost" id="btnShop2">Provisions</button>' +
          '<button class="ghost" id="btnMenu">Camp</button>' +
        '</div>' +
        '<div class="foot">' + plural(r.logs, 'log') + ' burned · ' + plural(r.kills, 'shade') + ' dispelled · heat ×' + r.bestHeat + '</div>',
        'wide'
      );
      on('btnAgain', startGame);
      on('btnMenu', menu);
      on('btnShop2', shop);
    }, 900);
  }

  function epitaph() {
    var n = S.night - 1;
    if (n <= 0) return 'You did not make it to the first dawn. The dark is patient — try again.';
    if (n === 1) return 'One night held. The watch is longer than it looks.';
    if (n < 4) return n + ' nights held. You were learning the rhythm of it.';
    if (n < 7) return n + ' nights held. Steady hands — the fire remembers.';
    return n + ' nights held. Whoever comes after will find warm ground.';
  }

  // ────────────────────────────────────────────────────────────── loop
  var last = 0, acc = 0;
  var STEP = 1 / 120;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;

    if (S.mode !== 'paused') {
      acc += dt;
      var guard = 0;
      while (acc >= STEP && guard++ < 20) { update(STEP); acc -= STEP; }
    }
    render();
    syncHud();
  }

  // ────────────────────────────────────────────────────────────── boot
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && S.mode === 'play') togglePause();
  });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  try { S.muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
  loadMeta();
  recalc();
  // opt-in inspection hook for tuning/QA: open with #debug
  if (/[?#]debug/.test(location.href)) window.__NW = { S: S, K: K, D: D, META: META, UPGRADES: UPGRADES, PERKS: PERKS,
      flare: doFlare, lightAt: lightAt, recalc: recalc, saveMeta: saveMeta, rollDraft: rollDraft, take: takeUpgrade };
  resize();
  S.keeper.x = W / 2; S.keeper.y = H / 2 + 96;
  menu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
