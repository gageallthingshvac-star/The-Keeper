    { id: 'moth',    at: null,    w: 0.9, dur: [12, 20] },
    { id: 'ember',   at: 'fire',  w: 1.1, dur: [10, 17] },
    { id: 'stretch', at: null,    w: 0.6, dur: [2.4, 4] }
  ];

  // things he wonders about, and things he wonders about you
  var KN_SAYS = {
    world: ["This wood's burning better than the last lot.",
            'Somebody lit this fire long before me. I would like to thank them for it.',
            'Something moved out there. Probably a rabbit.',
            'It always gets cold about now. Every night, same hour.',
            "I keep meaning to fix that lean-to. I keep not doing it.",
            "Stew's nearly there. Nearly.",
            'Do you reckon the stars are fires too? With somebody sat by them?',
            'Found a really good stick today. It is over by the woodpile if you want to see it.',
            'The solar panel only works when the sun is out, which out here is basically never.',
            'People ask if I get bored. I honestly never have.',
            'This is my favourite part of the night. Right about now.',
            "I have been doing this longer than I can count and I still like it.",
            'It is quiet out here. That is sort of the whole point.',
            'The flame in there is older than any town it has lit. I only carry it about.',
            'When I get there they light theirs off mine and I still have mine. That is the good bit.',
            'A match would be quicker. It would also be the wrong fire.',
            'Some towns leave the lamp out on a post for me. Some hand it over in a jar. I like the jar ones.'],
    you:   ['You still there?', 'What is it like where you are?',
            'Have you got a fire of your own?', 'You watch me a lot. I do not mind it.',
            'Warm where you are sitting?', 'Do you sleep, out there?',
            'You can say something back, you know. I would not mind.',
            'I like it when you turn up.',
            'Have you got a camp too, or just the one chair?',
            'What do you get up to when I am not looking?'],
    named: ['Evening, {p}.', 'You came back. Good.',
            '{p}. I was hoping that was you.',
            'You ever get cold out there, {p}?', 'Stay a bit, {p}.'],
    // only ever said to a lad — easy company, a bit of ribbing
    lad:   ['You would like it out here. Nothing to do and all night to do it.',
            'If you had a fire, would you look after it as well as I look after mine? Be honest.',
            'I nearly caught a moth earlier. We are not going to talk about it.',
            'Between us, {p}, I have no idea what I am doing. Going well though.',
            'Go on then. Say something clever.',
            'I built that lean-to myself. Do not look at it too closely.',
            'One of these nights I will beat my own best. Then what.'],
    // only ever said to a lass — softer, a shade more careful
    lass:  ['I saved you the warm side, {p}.',
            'You do not have to say anything. It is just nice you are here.',
            'Found a good flat stone today. Put it on your side of the fire.',
            'Is it cold where you are? I would send some of this over if I could.',
            'I tidied up a bit. Before you got here. Not because you were coming.',
            'Stew is better tonight. I was sort of hoping you would turn up for it.',
            'You always show up on the long nights. I have noticed that.'],
    // only ever said once he has been told — see the filter in knightSay
    knew:  ['I painted the sign {c} because you like {c}. Can you see it?',
            'A {g} keeping watch with me. That suits the pair of us.',
            'If it gets cold out there, {p}, come and sit closer.',
            'You never did say what you do when you are not here, {p}.',
            'I told the fire your name. It did not answer, but it listened.',
            'Whole place has gone a bit {c}. Good call, {p}.',
            'Is every {g} out there as quiet as you are?']
  };

  function genderWord() { return META.player.gender === 'lass' ? 'lass' : 'lad'; }

  // He only says what he actually knows: a line asking for something he was
  // never told is dropped rather than filled with a guess.
  // Half of what he gets up to is legible from across the room and half is
  // not, so the lobby just says it. One short line, under his name.
  var KN_DOING = {
    idle:  'taking a breath',        warm:  'warming his hands',
    poke:  'poking the fire',        rub:   'thawing his hands out',
    stir:  'stirring the pot',       sip:   'having a brew',
    marsh: 'toasting a marshmallow', chop:  'splitting wood',
    haul:  'carrying wood over',     nap:   'having a nap',
    tidy:  'tidying the bedroll',    game:  'playing his game',
    sit:   'sitting a while',        stars: 'watching the stars',
    panel: 'wiping the solar panel', wander:'having a wander',
    moth:  'watching a moth',        ember: 'chasing an ember',
    stretch:'having a stretch',      dance: 'dancing to this one',
    wave:  'waving at you'
  };
  function doingLine() {
    if (KN.walking > 0.5) return 'on his way over';
    if (KN.petting > 0)   return 'enjoying that';
    if (KN.act === 'read') {
      var L = nextLandmark();
      return L ? 'reading up on ' + L.st : 'reading';
    }
    if (KN.treatT > 4.5)  return 'watching the dog with it';
    return KN_DOING[KN.act] || 'pottering about';
  }

  function knightSay(kind) {
    var pool = KN_SAYS[kind] || KN_SAYS.world, ok = [], i;
    for (i = 0; i < pool.length; i++) {
      var t = pool[i];
      if (t.indexOf('{p}') >= 0 && !META.player.name) continue;
      if (t.indexOf('{g}') >= 0 && !META.player.gender) continue;
      if (t.indexOf('{c}') >= 0 && !META.player.theme) continue;
      ok.push(t);
    }
    if (!ok.length) ok = KN_SAYS.world;
    var line = ok[Math.floor(Math.random() * ok.length)];
    if (line === KN.lastSay) return;
    KN.lastSay = line;
    KN.say = line.replace(/\{p\}/g, META.player.name || 'you')
                 .replace(/\{g\}/g, genderWord())
                 .replace(/\{c\}/g, hueOf().name.toLowerCase());
    KN.sayT = 4.4 + KN.say.length * 0.055;
  }

  // What he is reading about is wherever the flame is going next, so the book
  // is always the right book for the road he is on.
  function knightFact() {
    var L = nextLandmark();
    if (!L || !L.facts || !L.facts.length) { knightSay('world'); return; }
    var f = L.facts[Math.floor(Math.random() * L.facts.length)];
    if (f === KN.lastSay && L.facts.length > 1) f = L.facts[(L.facts.indexOf(f) + 1) % L.facts.length];
    KN.lastSay = f;
    KN.say = f;
    KN.sayT = 9 + f.length * 0.085;      // long enough to actually read it
  }

  function knightAct(force) {
    var pool = [], i;
    if (KN.onStage && MUS.timer && Math.random() < 0.3) {
      KN.act = 'dance'; KN.actT = rand(6, 14); KN.props.length = 0;
      KN.tx = rand(-24, 24);
      return;
    }
    for (i = 0; i < KN_ACTS.length; i++) {
      if (KN_ACTS[i].id === KN.act) continue;
      pool.push(KN_ACTS[i]);
    }
    var total = 0;
    for (i = 0; i < pool.length; i++) total += pool[i].w;
    var roll = Math.random() * total, acc = 0, picked = pool[0];
    for (i = 0; i < pool.length; i++) { acc += pool[i].w; if (roll <= acc) { picked = pool[i]; break; } }
    if (force) { for (i = 0; i < KN_ACTS.length; i++) if (KN_ACTS[i].id === force) picked = KN_ACTS[i]; }

    KN.act = picked.id;
    KN.actT = rand(picked.dur[0], picked.dur[1]);
    KN.props.length = 0;
    KN.factT = picked.id === 'read' ? rand(1.8, 3.4) : 0;   // let him settle, then read it out
    var spot = picked.at ? CAMP[picked.at] : null;
    KN.tx = spot ? spot.stand + rand(-4, 4) : rand(-104, 124);
    if (!spot && Math.abs(KN.tx) < 20) KN.tx += KN.tx < 0 ? -22 : 22;
    KN.spotFace = spot ? spot.face : 0;
    if (KN.act === 'ember') KN.props.push({ kind: 'ember', x: 0, y: 4, vx: rand(-5, 5), vy: -9, ph: rand(0, 6.28), life: KN.actT });
    if (KN.act === 'moth')  KN.props.push({ kind: 'moth', x: 0, y: -14, ph: rand(0, 6.28), life: KN.actT });
  }

  // ── the dog ────────────────────────────────────────────────────────────
  // He mostly wants to be near his person, and the rest of the time he is
  // asleep in his house or busy with something in the grass.
  var DOG = { x: -50, tx: -50, face: 1, step: 0, walking: 0, sit: 0, sleep: 0,
              wag: 0, hop: 0, bark: 0, head: 0, act: 'follow', actT: 3, party: 0 };
  // A biscuit that pops up out of the ground in front of the kennel when you
  // press the button, sits there until he gets to it, then goes.
  var TREAT = { on: 0, x: 0, t: 0, eat: 0, crumbs: [] };
  var DOG_ACTS = ['follow', 'follow', 'follow', 'kennel', 'sniff', 'sit', 'chase', 'watch'];

  function dogAct() {
    var pick = DOG_ACTS[Math.floor(Math.random() * DOG_ACTS.length)];
    DOG.act = pick;
    DOG.actT = rand(4, 10);
    if (pick === 'kennel') { DOG.tx = CAMP.kennel.x + rand(-3, 3); DOG.actT = rand(8, 18); }
    else if (pick === 'sniff') DOG.tx = rand(-104, 124);
    else if (pick === 'sit')   DOG.tx = CAMP.fire.stand + rand(10, 26);
    else if (pick === 'watch') DOG.tx = KN.x + rand(-30, 30);
  }

  function updateDog(dt) {
    DOG.actT -= dt;
    if (DOG.actT <= 0) dogAct();
    if (DOG.act === 'treat') {
      DOG.tx = TREAT.on ? TREAT.x : CAMP.kennel.x + 16;
      if (Math.abs(DOG.x - DOG.tx) < 5) {
        if (TREAT.on && TREAT.t > 0.5 && !TREAT.eat) TREAT.eat = 0.75;   // nose down, gone
        if (Math.random() < dt * 3) {
          KN.hearts.push({ x: DOG.x + rand(-4, 4), y: -12, vy: rand(-14, -20), vx: rand(-5, 5),
                           life: 1.3, max: 1.3, kind: 'heart', r: rand(0.6, 1) });
        }
      }
    } else if (DOG.act === 'follow' || DOG.act === 'chase') {
      var want = KN.x + (KN.x > DOG.x ? -16 : 16);
      DOG.tx += (want - DOG.tx) * Math.min(1, dt * (DOG.act === 'chase' ? 3 : 1.2));
    }
    var run = DOG.act === 'chase' ? 74 : 44;
    var dx = DOG.tx - DOG.x;
    if (Math.abs(dx) > 3) {
      var dir = dx > 0 ? 1 : -1;
      DOG.x += dir * run * dt;
      DOG.face = dir;
      DOG.walking = Math.min(1, DOG.walking + dt * 7);
      DOG.step += dt * (DOG.act === 'chase' ? 20 : 13);
    } else {
      DOG.walking = Math.max(0, DOG.walking - dt * 7);
    }
    DOG.x = clamp(DOG.x, -120, 134);

    var sit = 0, sleep = 0, wag = 0, head = 0;
    if (DOG.party > 0) {
      DOG.party -= dt;
      DOG.hop = Math.max(DOG.hop, Math.abs(Math.sin(S.time * 9)) * 5);
      wag = 1; head = -0.25;
      DOG.bark = Math.sin(S.time * 11) > 0.4 ? 1 : 0;
    } else if (DOG.walking > 0.3) {
      wag = 0.7;
      DOG.bark = 0;
    } else if (DOG.act === 'kennel') {
      sleep = 1; wag = 0.1;
    } else if (DOG.act === 'sit' || DOG.act === 'watch') {
      sit = 1; wag = 0.45; head = Math.sin(S.time * 0.7) * 0.12;
      DOG.face = DOG.act === 'watch' ? (KN.x > DOG.x ? 1 : -1) : -1;
    } else if (DOG.act === 'treat') {
      head = 0.62; wag = 1;
      if (Math.abs(DOG.x - DOG.tx) < 4) DOG.face = -1;
    } else if (DOG.act === 'sniff') {
      head = 0.5; wag = 0.5;
    } else {
      wag = 0.6;
      DOG.face = KN.x > DOG.x ? 1 : -1;
    }
    // near the kennel he can actually be asleep in it
    if (DOG.act === 'kennel' && Math.abs(DOG.x - CAMP.kennel.x) > 8) { sleep = 0; wag = 0.5; }
    if (KN.treatT <= 0 && DOG.act === 'treat') dogAct();

    DOG.sit += (sit - DOG.sit) * Math.min(1, dt * 5);
    DOG.sleep += (sleep - DOG.sleep) * Math.min(1, dt * 3);
    DOG.wag += (wag - DOG.wag) * Math.min(1, dt * 6);
    DOG.head += (head - DOG.head) * Math.min(1, dt * 5);
    DOG.hop = Math.max(0, DOG.hop - dt * 26);
  }

  // ── everyone who has joined him ────────────────────────────────────────
  // One per landmark reached. They stand about the camp doing very little,
  // which is the point of them.
  var FOLK_SPOTS = [34, -52, 74, -86, 18];
  var FOLK = [];
  function syncFolk() {
    var roll = META.partner ? [META.partner] : [];
    while (FOLK.length > roll.length) FOLK.pop();
    for (var i = FOLK.length; i < roll.length; i++) {
      var n = roll[i], h = 0;
      for (var c = 0; c < n.length; c++) h = (h * 33 + n.charCodeAt(c)) & 0xffff;
      FOLK.push({
        name: n,
        x: FOLK_SPOTS[i % FOLK_SPOTS.length],
        lass: true,
        flip: (h & 1) ? 1 : -1,
        plume: PLUMES[h % PLUMES.length].id,
        cape: OUTFITS[(h >> 3) % OUTFITS.length].id,
        helm: HEADS[(h >> 5) % HEADS.length].id,
        hair: HAIRS[(h >> 7) % HAIRS.length].id,
        ph: (h % 100) / 16,
        expr: 'content'
      });
    }
  }

  // ── celebrating ────────────────────────────────────────────────────────
  // A night held is worth marking. Which way they mark it is a different
  // roll every dawn.
  var PARTIES = [
    { id: 'cheer',  note: 'Another one held. {d} did three laps of the fire.' },
    { id: 'dance',  note: 'They danced. {f} started it and could not stop.' },
    { id: 'toast',  note: 'Mugs up all round. The stew was nearly right, too.' },
    { id: 'wave',   note: 'He waved at you for a solid minute. You are welcome here.' },
    { id: 'spin',   note: 'He span until he had to sit down and think about it.' },
    { id: 'howl',   note: '{d} howled at the dawn. Everyone joined in, badly.' },
    { id: 'sparks', note: 'Somebody put far too much on the fire. Worth it.' },
    { id: 'hug',    note: 'A great deal of hugging. Nobody seemed to mind.' }
  ];
  function partyNote(P) {
    var d = META.dog.name || 'the dog';
    var f = META.partner || META.knight.name || 'somebody';
    return P.note.replace(/\{d\}/g, d).replace(/\{f\}/g, f);
  }
  var CHEERS = ['That is another one!', 'Dawn already. Look at that.', 'We held it, {p}!',
    'Not a single one got through. Well, one did.', 'Every night is a good night eventually.',
    'Somebody put the kettle on.', 'I told you it was the best job.'];
  function startParty(kind) {
    KN.say = CHEERS[Math.floor(Math.random() * CHEERS.length)]
      .replace(/\{p\}/g, META.player.name || 'you');
    KN.sayT = 6.5;
    var P = kind ? PARTIES[0] : PARTIES[Math.floor(Math.random() * PARTIES.length)];
    for (var i = 0; kind && i < PARTIES.length; i++) if (PARTIES[i].id === kind) P = PARTIES[i];
    KN.party = P.id; KN.partyT = 900;
    KN.hearts.length = 0;
    DOG.party = 900;
    for (var j = 0; j < FOLK.length; j++) FOLK[j].ph = rand(0, 6.28);
    return P;
  }
  function endParty() { KN.party = ''; KN.partyT = 0; DOG.party = 0; }

  // What everybody who is not him does while it is going on.
  function folkPose(f, t) {
    var ph = f.ph, kind = KN.partyT > 0 ? KN.party : '';
    var o = { t: t, scale: 1, wear: f, build: f.lass ? 'lass' : 'lad', flip: f.flip, amt: 0.7, expr: 'content' };
    var b = Math.sin(t * 3 + ph);
    if (!kind) {
      o.expr = Math.sin(t * 0.4 + ph) > 0.5 ? 'happy' : 'content';
      o.tilt = Math.sin(t * 0.9 + ph) * 0.035;
      o.look = Math.sin(t * 0.3 + ph) > 0.4 ? 0.6 : 0;
      return o;
    }
    o.expr = 'happy'; o.amt = 0.95;
    if (kind === 'cheer' || kind === 'howl') {
      o.armR = -2.75 - b * 0.15; o.armL = 2.75 + b * 0.15;
      o.hop = Math.abs(Math.sin(t * 5 + ph)) * 4.5;
      if (kind === 'howl') o.headTilt = -0.34;
    } else if (kind === 'dance') {
      o.tilt = Math.sin(t * 4 + ph) * 0.16;
      o.armR = -1.5 - b * 0.6; o.armL = 1.4 + b * 0.5;
      o.hop = Math.abs(Math.sin(t * 4 + ph)) * 4;
    } else if (kind === 'toast') {
      o.armR = -2.35 + b * 0.08; o.item = 'mug'; o.headTilt = -0.1;
    } else if (kind === 'wave') {
      o.armR = -2.5 + Math.sin(t * 6 + ph) * 0.35;
    } else if (kind === 'spin') {
      o.spin = (t * 4 + ph) % 6.283;
      o.armR = -1.9; o.armL = 1.9;
    } else if (kind === 'sparks') {
      o.crouch = 0.3; o.armR = -1.4; o.armL = 1.3; o.expr = 'surprised';
    } else if (kind === 'hug') {
      o.armR = -1.55; o.armL = 1.55;
      o.tilt = Math.sin(t * 1.6 + ph) * 0.07;
    }
    return o;
  }

  // Who is at this fire, in one line.
  function campRoll() {
    var bits = [META.dog.name || 'a dog'];
    for (var i = 0; i < META.pets.length; i++) bits.push(META.pets[i].name);
    if (META.partner) bits.push(META.partner);
    if (bits.length === 1) return 'with ' + bits[0];
    return 'with ' + bits.slice(0, -1).join(', ') + ' and ' + bits[bits.length - 1];
  }
  function treatLabel() {
    var d = META.dog.name || 'the dog';
    return KN.treatT > 0 ? d + ' is busy with it' : 'Give ' + d + ' a treat';
  }
  function giveTreat() {
    if (KN.treatT > 0) return;
    KN.treatT = 7;
    KN.faceYou = 4;
    META.treats++;
    saveMeta();
    DOG.act = 'treat'; DOG.actT = 7; DOG.tx = CAMP.kennel.x + 16;
    TREAT.on = 1; TREAT.t = 0; TREAT.eat = 0; TREAT.crumbs.length = 0;
    TREAT.x = CAMP.kennel.x + 12;   // on the ground in front of his house
    knHeart('heart'); knHeart('heart');
    UI.buy();
    var b = document.getElementById('btnTreat');
    if (b) b.textContent = treatLabel();
  }

  function knJump(h, dur) {
    KN.jumpH = h; KN.jumpDur = dur || 0.66; KN.jumpT = KN.jumpDur;
  }

  function knHeart(kind) {
    KN.hearts.push({ x: KN.x + rand(-7, 7), y: -22, vy: rand(-16, -24), vx: rand(-6, 6),
                     life: 1.5, max: 1.5, kind: kind || 'heart', r: rand(0.8, 1.2) });
  }
  function knFeel(expr, secs, amt) {
    KN.expr = expr; KN.exprT = secs;
    KN.amtTarget = amt === undefined ? rand(0.3, 0.6) : amt;
  }

  function updateKnight(dt) {
    var i;
    if (KN.factT > 0) {
      KN.factT -= dt;
      if (KN.factT <= 0 && KN.act === 'read') {
        knightFact();
        // he will look up with another one before he puts the book down
        if (KN.actT > KN.sayT + 8) KN.factT = KN.sayT + rand(4, 8);
      }
    }
    if (KN.treatT > 0) {
      KN.treatT -= dt;
      if (KN.treatT <= 0) { var tb = document.getElementById('btnTreat'); if (tb) tb.textContent = treatLabel(); }
    }
    // the camera drifts after him rather than snapping, and stops at the
    // edges of the camp so you never see past the last thing he owns
    // he is the subject, so the shot stays on him, stopping at the ends of the
    // camp so you never pan off past the last thing he owns
    var camWant = clamp(KN.x, -102, 72);
    KN.cam += (camWant - KN.cam) * Math.min(1, dt * 1.8);
    // the fire answers whatever he is doing to it
    var fWant = KN.act === 'rub' ? 0.5 : (KN.act === 'poke' || KN.act === 'haul') ? 1.14 : 1;
    KN.fire += (fWant - KN.fire) * Math.min(1, dt * 0.8);
    for (i = KN.hearts.length - 1; i >= 0; i--) {
      var h = KN.hearts[i];
      h.life -= dt;
      if (h.life <= 0) { KN.hearts.splice(i, 1); continue; }
      h.y += h.vy * dt; h.x += h.vx * dt; h.vy *= (1 - dt * 0.6);
    }

    // A jump is a throw, not a slider. It was setting hop to nine and
    // draining it linearly, which is why it read as a glitch: no gather, no
    // arc, no landing. Now it gathers, leaves the ground stretched, hangs at
    // the top, and squashes when it lands.
    if (KN.jumpT > 0) {
      KN.jumpT = Math.max(0, KN.jumpT - dt);
      var ju = 1 - KN.jumpT / KN.jumpDur;
      if (ju < 0.2) {                                       // gather
        KN.hop = 0;
        KN.squash = 0.17 * Math.sin(ju / 0.2 * Math.PI);
      } else if (ju < 0.87) {                               // in the air
        var jf = (ju - 0.2) / 0.67;
        KN.hop = KN.jumpH * 4 * jf * (1 - jf);
        KN.squash = -0.15 * Math.abs(Math.cos(jf * Math.PI));
      } else {                                              // land
        var jl = (ju - 0.87) / 0.13;
        KN.hop = 0;
        KN.squash = 0.19 * (1 - jl) * (1 - jl);
      }
      if (KN.jumpT <= 0) { KN.hop = 0; KN.squash = 0; }
    } else {
      KN.hop = Math.max(0, KN.hop - dt * 26);
      KN.squash = KN.squash > 0 ? Math.max(0, KN.squash - dt * 3) : Math.min(0, KN.squash + dt * 3);
    }
    KN.spin = KN.spin > 0.001 ? Math.max(0, KN.spin - dt * 7) : 0;
    if (KN.bounce > 0) { KN.bounce -= dt; KN.hop = Math.max(KN.hop, Math.abs(Math.sin(KN.bounce * 15)) * 5 * KN.bounce); }
    KN.tapT = Math.max(0, KN.tapT - dt);
    if (KN.tapT <= 0) KN.taps = 0;
    if (KN.exprT > 0) KN.exprT -= dt;
    if (KN.partyT > 0 && KN.sayT <= 0) { KN.say = ''; }
    if (KN.scripted) { /* he is being asked something; leave it up */ }
    else if (KN.sayT > 0) KN.sayT -= dt;
    else KN.say = '';

    // he says something now and then, unprompted
    KN.sayNext -= dt;
    if (KN.sayNext <= 0 && KN.petting <= 0 && !KN.scripted && KN.partyT <= 0) {
      KN.sayNext = rand(11, 26);
      if (Math.random() < 0.62) {
        var r = Math.random(), gp = META.player.gender;
        knightSay(r < 0.3 ? 'world' : r < 0.48 ? 'you'
                : r < 0.66 ? (gp || 'you') : r < 0.84 ? 'knew' : 'named');
      }
    }

    if (KN.petting > 0) {
      KN.petting -= dt;
      KN.pet = Math.min(1, KN.pet + dt * 4);
      KN.tilt = Math.sin(S.time * 5) * 0.07 * KN.pet;
      KN.zzz = 0; KN.walking = 0; KN.item = null; KN.itemL = null;
      KN.armL = -0.5; KN.armR = 0.5;
      KN.back += (0 - KN.back) * Math.min(1, dt * 8);
      KN.lift += (0 - KN.lift) * Math.min(1, dt * 5);
      KN.lie += (0 - KN.lie) * Math.min(1, dt * 5);
      KN.crouch += (0 - KN.crouch) * Math.min(1, dt * 5);
      KN.headTilt += (0 - KN.headTilt) * Math.min(1, dt * 6);
      KN.sit = Math.min(0.4, KN.sit + dt);
      if (KN.exprT <= 0) knFeel('content', 0.25, Math.min(1, 0.55 + KN.pet * 0.45));
      KN.amt += (KN.amtTarget - KN.amt) * Math.min(1, dt * 4);
      if (Math.random() < dt * 2.2) knHeart('heart');
      return;
    }
    KN.pet = Math.max(0, KN.pet - dt * 2);

    KN.actT -= dt;
    if (KN.actT <= 0) knightAct();

    // walk to wherever he is going
    var dx = KN.tx - KN.x;
    if (Math.abs(dx) > 2.5) {
      var dir = dx > 0 ? 1 : -1;
      KN.x += dir * 34 * dt;
      KN.face = dir;
      KN.walking = Math.min(1, KN.walking + dt * 6);
      KN.step += dt * 11;
      KN.sit *= Math.max(0, 1 - dt * 8);
      KN.lift *= Math.max(0, 1 - dt * 8);
      KN.crouch *= Math.max(0, 1 - dt * 8);
      KN.lie *= Math.max(0, 1 - dt * 8);
      KN.back *= Math.max(0, 1 - dt * 8);
    } else {
      KN.walking = Math.max(0, KN.walking - dt * 6);
      if (KN.spotFace) KN.face = KN.spotFace;
    }
    KN.x = clamp(KN.x, -120, 134);

    for (i = KN.props.length - 1; i >= 0; i--) {
      var pr = KN.props[i];
      pr.life -= dt;
      if (pr.life <= 0) { KN.props.splice(i, 1); continue; }
      if (pr.kind === 'ember') {
        pr.x += pr.vx * dt; pr.y += pr.vy * dt;
        pr.vx += Math.sin(S.time * 3 + pr.ph) * 6 * dt;
        pr.vy = Math.max(-16, pr.vy - dt * 2);
      } else {
        pr.ph += dt * 2.2;
        pr.x = KN.x + Math.cos(pr.ph) * 16;
        pr.y = -18 + Math.sin(pr.ph * 2) * 7;
      }
    }

    var A2 = KN.act, wobble = Math.sin(S.time * 2) * 0.03;
    var armL, armR, item = null, itemL = null, expr = 'normal', lookD = 0, bodySc = 1;
    var tilt = wobble, lean = 0, sit = 0, zzz = 0;
    var crouch = 0, lie = 0, back = 0, headTilt = 0, lift = 0;

    if (KN.partyT > 0) {
      // a night held: he is not doing chores, he is celebrating
      KN.partyT -= dt;
      KN.tx = KN.x;
      var pk = KN.party, T = S.time, bb = Math.sin(T * 5);
      expr = 'happy';
      if (pk === 'cheer') {
        armR = -2.85 - bb * 0.12; armL = 2.85 + bb * 0.12;
        KN.hop = Math.max(KN.hop, Math.abs(Math.sin(T * 5)) * 6);
        if (Math.random() < dt * 1.6) knHeart('heart');
      } else if (pk === 'dance') {
        tilt = Math.sin(T * 4) * 0.18;
        armR = -1.5 - bb * 0.6; armL = 1.4 + bb * 0.5;
        KN.hop = Math.max(KN.hop, Math.abs(Math.sin(T * 4)) * 5);
        if (Math.random() < dt * 1.2) knHeart('note');
      } else if (pk === 'toast') {
        item = 'mug'; armR = -2.4 + bb * 0.06; headTilt = -0.12;
        if (Math.random() < dt * 0.5) knHeart('heart');
      } else if (pk === 'wave') {
        armR = -2.55 + Math.sin(T * 6.5) * 0.4; armL = 0.4;
        if (Math.random() < dt * 0.8) knHeart('heart');
      } else if (pk === 'spin') {
        KN.spin = (T * 4.5) % 6.283;
        armR = -1.9; armL = 1.9;
        if (Math.random() < dt * 1.2) knHeart('note');
      } else if (pk === 'howl') {
        headTilt = -0.42; armR = -0.6; armL = 0.6;
        if (Math.random() < dt * 0.9) knHeart('note');
      } else if (pk === 'sparks') {
        crouch = 0.34; armR = -2.6 + bb * 0.3; armL = 1.1; expr = 'surprised';
        if (Math.random() < dt * 9) spark2(KN.x + rand(-10, 10), -8);
      } else {
        armR = -1.55; armL = 1.55;
        tilt = Math.sin(T * 1.7) * 0.08;
        if (Math.random() < dt * 1.4) knHeart('heart');
      }
    } else if (KN.walking > 0.4) {
      expr = 'normal';
    } else if (A2 === 'dance') {
      var B2 = beatNow();
      if (!B2) knightAct('idle');
      else {
        var e2 = 1 - B2.phase, pop = e2 * e2;
        KN.hop = Math.max(KN.hop, pop * (B2.beat === 0 ? 7.5 : 4.6));
        KN.squash = B2.phase < 0.1 ? 0.1 : -pop * 0.08;
        tilt = ((B2.beat % 2) ? 1 : -1) * 0.15 * (0.35 + e2 * 0.65);
        armR = -1.05 - e2 * 0.5; armL = 0.95 + e2 * 0.42;
        expr = 'happy';
        KN.look = 0;                       // dancing, and dancing at you
        if (Math.random() < dt * 0.5) knHeart('note');
      }
    } else if (A2 === 'warm') {
      // squatting by the fire with both palms out to it
      crouch = 0.3;
      armR = -1.32 + Math.sin(S.time * 1.6) * 0.05;
      armL = 1.22 - Math.sin(S.time * 1.6) * 0.05;
      expr = 'content'; lean = 0.07; headTilt = 0.05;
    } else if (A2 === 'poke') {
      // down on his haunches, prodding the embers with a stick
      item = 'stick';
      crouch = 0.62;
      armR = -1.42 + Math.sin(S.time * 3.4) * 0.24;
      armL = 0.5;
      lean = 0.12; headTilt = 0.14; expr = 'think';
    } else if (A2 === 'rub') {
      // hunched right over, both hands together, working the sticks
      item = 'sticks';
      var rub = Math.sin(S.time * 13) * 0.2;
      crouch = 0.85;
      armR = -1.24 + rub; armL = 1.16 - rub;
      lean = 0.16; headTilt = 0.2; expr = 'think';
      if (Math.random() < dt * 0.55) spark2(KN.x, -6);
    } else if (A2 === 'stir') {
      // standing over the pot, one hand on the rim, the other going round
      item = 'spoon';
      armR = -1.68 + Math.sin(S.time * 3.2) * 0.34;
      armL = 1.55;
      lean = 0.1; headTilt = 0.12; expr = 'content';
    } else if (A2 === 'sip') {
      // mug up to his mouth, head tipped back
      item = 'mug';
      armR = -2.42 + Math.sin(S.time * 0.8) * 0.12;
      armL = 0.35;
      headTilt = -0.16; expr = 'content';
    } else if (A2 === 'marsh') {
      // sat on his heels holding the stick out over the flames
      item = 'marsh';
      crouch = 0.42;
      armR = -1.5 + Math.sin(S.time * 1.4) * 0.08;
      armL = 0.55;
      expr = 'happy'; lean = 0.06; headTilt = 0.1;
    } else if (A2 === 'chop') {
      // Both hands on the same haft. They were swinging in opposite
      // directions before, which is why it read as flailing rather than
      // chopping: a straight-arm rig only puts the hands together when the
      // two arms carry the same angle with opposite signs.
      item = 'axe';
      var ch = (S.time * 1.5) % 1;
      // slow lift, quick drop, then a beat stood over it
      var raise = ch < 0.46 ? Math.sin(ch / 0.46 * 1.5708)
                : ch < 0.62 ? 1 - (ch - 0.46) / 0.16
                : 0;
      var hit = ch >= 0.62 && ch < 0.74;               // the moment it lands
      // stops just past vertical, so the haft goes over his shoulder rather
      // than straight through his face
      var sw = 0.6 + raise * 1.32;
      armR = sw; armL = -sw;
      crouch = (1 - raise) * 0.42;
      lean = 0.04 + (1 - raise) * 0.13;
      headTilt = 0.06 + (1 - raise) * 0.14;
      KN.look = 0;
      expr = hit ? 'grumble' : (raise > 0.9 ? 'think' : 'normal');
    } else if (A2 === 'haul') {
      // an armful, held against his chest, leaning back under it
      item = 'log'; itemL = 'log';
      armR = -0.98; armL = 0.98; lean = -0.07; headTilt = -0.05;
      expr = 'normal';
    } else if (A2 === 'nap') {
      // Curled up on the bedroll rather than laid out flat — knees in, arms
      // tucked, and drawn a shade smaller so he fits inside the tent.
      lie = 1; zzz = 1; tilt = 0; expr = 'sleepy';
      bodySc = 0.74;
      armL = 0.22; armR = -0.18; headTilt = 0.34;   // arms tucked along him, not out
    } else if (A2 === 'tidy') {
      // bent over, sweeping things back where they belong
      crouch = 0.55;
      armR = -1.62 + Math.sin(S.time * 5) * 0.42; armL = 0.7;
      lean = 0.2; headTilt = 0.22; expr = 'normal';
    } else if (A2 === 'game') {
      // on the stool, back to you, looking up at the screen, both hands
      // bouncing along the keys
      sit = 1; lift = 2.4; lean = 0.04;
      // he turns round every few seconds to check you are still watching
      var peek = Math.sin(S.time * 0.44 + 1.1) > 0.72;
      back = peek ? 0 : 1;
      headTilt = peek ? -0.12 : -0.07;
      armR = -1.24 + Math.abs(Math.sin(S.time * 7.5)) * 0.13;
      armL = 1.24 - Math.abs(Math.sin(S.time * 7.5 + 2.1)) * 0.13;
      KN.look = 0;
      expr = peek ? 'happy' : (Math.sin(S.time * 0.7) > 0.6 ? 'surprised' : 'think');
    } else if (A2 === 'read') {
      // Settled back in the chair with the book held in both hands. The far
      // hand holds the spine, the near one turns the page; when he reads a bit
      // out to you he looks up from it, which is what makes it read as reading.
      sit = 1; lift = 2.4; lean = -0.04;
      var page = Math.sin(S.time * 0.62) > 0.94;
      var upAt = KN.sayT > 0;
      // Straight arms, so the only way a hand reaches the middle of his chest
      // is to come up and across. Both do, and they meet on the book.
      armR = 1.1 - (page ? 0.38 : 0) + Math.sin(S.time * 0.55) * 0.035;    // near hand, turns the page
      armL = -1.04 + Math.sin(S.time * 0.55 + 1) * 0.02;                   // far hand, under the spine
      item = 'book';
      headTilt = upAt ? -0.04 : 0.19;                                     // down at it, up at you
      lookD = upAt ? 0 : 0.72;                                            // and his eyes go with it
      expr = upAt ? 'happy' : (page ? 'surprised' : 'normal');
      KN.look = 0;
    } else if (A2 === 'sit') {
      // in the chair, hands on his knees
      sit = 1; lift = 2.4; expr = Math.sin(S.time) > 0 ? 'content' : 'normal';
      armL = 1.15; armR = -1.15;
    } else if (A2 === 'stars') {
      // in the chair, head right back
      sit = 1; lift = 2.4; headTilt = -0.34; expr = 'content';
      armL = 0.85; armR = -0.85;
      KN.look = 0;
    } else if (A2 === 'panel') {
      // turned away, both hands up wiping the panel down
      var peek2 = Math.sin(S.time * 0.6) > 0.66;
      back = peek2 ? 0 : 1;
      armR = -2.5 + Math.sin(S.time * 2.6) * 0.2;
      armL = 2.3 - Math.sin(S.time * 2.6 + 0.6) * 0.2;
      headTilt = -0.16; lean = 0.05;
      item = 'rag';
      expr = peek2 ? 'happy' : 'think';
      if (peek2) KN.look = 0;
    } else if (A2 === 'stretch') {
      armR = -2.85; armL = 2.85; tilt = Math.sin(S.time * 2.2) * 0.09;
      lean = -0.1; headTilt = -0.2;
      KN.hop = Math.max(KN.hop, 1.2); expr = 'sleepy';
    } else if (A2 === 'ember') {
      var em = KN.props[0];
      if (em) {
        armR = -2.5; armL = -1.9;
        headTilt = -0.22;
        KN.look = clamp((em.x - KN.x) / 12, -1, 1);
        if (Math.random() < dt * 2.5) KN.hop = Math.max(KN.hop, 4);
        expr = 'surprised';
      } else { expr = 'grumble'; }
    } else if (A2 === 'moth') {
      var mo = KN.props[0];
      if (mo) {
        KN.look = clamp((mo.x - KN.x) / 14, -1, 1);
        headTilt = -0.12;
        if (Math.abs(mo.x - KN.x) < 7 && Math.random() < dt * 3) { armR = -2.4; armL = -1.6; }
        expr = 'look';
      }
    }

    // anything you just did to him turns him round for a moment
    if (KN.faceYou > 0) { KN.faceYou -= dt; back = 0; KN.look = 0; }
    if (KN.scripted && KN.hold) expr = KN.hold;

    if (A2 === 'idle' || A2 === 'wander' || A2 === 'dance') KN.look = 0;
    else if (A2 !== 'ember' && A2 !== 'moth' && A2 !== 'stars') {
      KN.lookT -= dt;
      if (KN.lookT <= 0) { KN.lookT = rand(0.7, 2.2); KN.look = Math.random() < 0.4 ? rand(-1, 1) : 0; }
    }

    KN.armL = armL; KN.armR = armR; KN.item = item; KN.itemL = itemL;
    KN.lookD += (lookD - KN.lookD) * Math.min(1, dt * 7);
    KN.sc += (bodySc - KN.sc) * Math.min(1, dt * 4);
    KN.tilt = tilt;
    KN.lean += (lean - KN.lean) * Math.min(1, dt * 6);
    KN.sit += (sit - KN.sit) * Math.min(1, dt * 4);
    KN.crouch += (crouch - KN.crouch) * Math.min(1, dt * 5);
    KN.lie += (lie - KN.lie) * Math.min(1, dt * 3);
    KN.back += (back - KN.back) * Math.min(1, dt * 7);
    KN.lift += (lift - KN.lift) * Math.min(1, dt * 5);
    KN.headTilt += (headTilt - KN.headTilt) * Math.min(1, dt * 6);
    KN.zzz += (zzz - KN.zzz) * Math.min(1, dt * 3);

    KN.blink -= dt;
    if (KN.blink <= 0) { KN.blink = rand(1.8, 6); knFeel('blink', rand(0.1, 0.16), 1); }
    if (KN.exprT <= 0) {
      if (KN.expr !== expr) KN.amtTarget = rand(0.25, 0.62);
      KN.expr = expr;
    }
    KN.amt += (KN.amtTarget - KN.amt) * Math.min(1, dt * 4);
  }

  // a puff of sparks from the sticks, in camp coordinates
  function spark2(x, y) {
    KN.hearts.push({ x: x + rand(-3, 3), y: y, vy: rand(-8, -18), vx: rand(-10, 10),
                     life: 0.55, max: 0.55, kind: 'spark', r: rand(0.5, 0.9) });
  }

  // ── bothering him ──────────────────────────────────────────────────────
  // A bag of reactions rather than one response, so he never answers the
  // same way twice running.
  var KN_REACTS = [
    { id: 'hop',    w: 3,   go: function () { knFeel('happy', rand(1, 1.8), rand(0.7, 1)); knJump(rand(5, 7), 0.58); knHeart('heart'); bell(rand(820, 960), 0.28, 0.032, 3.2); } },
    { id: 'giggle', w: 2.4, go: function () { knFeel('happy', 1.6, rand(0.8, 1)); KN.bounce = 0.55; knHeart('heart'); knHeart('heart');
                                              bell(700, 0.22, 0.028, 3.4); bell(880, 0.24, 0.026, 3.4, 0.09); } },
    { id: 'shy',    w: 1.6, go: function () { knFeel('shy', rand(1.4, 2.2), rand(0.6, 0.9)); KN.look = rand(0, 1) > 0.5 ? 1 : -1; KN.lookT = 2; knHeart('heart'); bell(590, 0.4, 0.026, 2.6); } },
    { id: 'spin',   w: 1.2, go: function () { knFeel('happy', 1.4, rand(0.7, 1)); KN.spin = 6.28; knHeart('note'); bell(660, 0.3, 0.03, 2.8); bell(990, 0.3, 0.024, 2.8, 0.1); } },
    { id: 'wave',   w: 1.4, go: function () { knFeel('happy', 1.6, rand(0.55, 0.85)); KN.act = 'wave'; KN.actT = 2; bell(760, 0.26, 0.03, 3); } },
    { id: 'jump',   w: 1.1, go: function () { knFeel('surprised', 1.3, rand(0.8, 1)); knJump(9.5, 0.72); bell(1050, 0.2, 0.03, 3.6); } },
    { id: 'ignore', w: 0.9, go: function () { knFeel('blink', 0.5, rand(0.2, 0.4)); bell(430, 0.2, 0.018, 2.4); } },
    { id: 'grump',  w: 0.7, go: function () { knFeel('grumble', 1.6, rand(0.5, 0.85)); KN.tilt = 0.12; bell(300, 0.34, 0.03, 1.6); } }
  ];

  function knightPoke() {
    KN.taps++; KN.tapT = 2;
    KN.act = 'idle'; KN.actT = rand(1.2, 2.4); KN.props.length = 0;
    KN.faceYou = 3;

    // pester him and he stops being charmed by it
    if (KN.taps >= 5 && Math.random() < 0.7) {
      knFeel('grumble', 1.8, rand(0.7, 1));
      KN.bounce = 0.4;
      knHeart('note');
      bell(260, 0.4, 0.032, 1.5);
      KN.taps = 0;
      buzz(12);
      return;
    }
    var pool = [], i, total = 0;
    for (i = 0; i < KN_REACTS.length; i++) if (KN_REACTS[i].id !== KN.lastReact) pool.push(KN_REACTS[i]);
    for (i = 0; i < pool.length; i++) total += pool[i].w;
    var roll = Math.random() * total, acc = 0, picked = pool[0];
    for (i = 0; i < pool.length; i++) { acc += pool[i].w; if (roll <= acc) { picked = pool[i]; break; } }
    KN.lastReact = picked.id;
    picked.go();
    buzz(8);
  }

  function knightPet() {
    KN.faceYou = 2;
    if (KN.petting <= 0) {
      bell(rand(600, 700), 0.4, 0.026, 2.6);
      if (Math.random() < 0.25) { knFeel('surprised', 0.6, rand(0.7, 1)); knJump(3.6, 0.5); }   // caught him off guard
    }
    KN.petting = 0.35;
  }

  var portraitCv = null;
  // Where his feet land in a full-screen lobby: just clear of the name, so he
  // never stands behind his own controls whatever the phone's shape.
  var homeFrac = 0.555;
  function measureHomeFrac(h) {
    var nm = document.querySelector('.homename');
    if (!nm || !h) return 0.555;
    var top = nm.getBoundingClientRect().top;
    if (!(top > 0)) return 0.555;
    return clamp((top - h * 0.085) / h, 0.34, 0.8);
  }
  function paintPortrait() {
    var cv = portraitCv;
    if (!cv || !cv.isConnected) { portraitCv = null; return; }
    var w = cv.clientWidth || 128, h = cv.clientHeight || 128;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    // A full-screen stage is four times the pixels of a card-sized one, and
    // this is flat vector art: past a budget the extra resolution costs frames
    // without showing. Card-sized stages are well under it and keep full dpr.
    var cap = Math.sqrt(1500000 / Math.max(1, w * h));
    if (cap < dpr) dpr = Math.max(1.4, cap);
    // check BOTH axes: a canvas defaults to 300x150, and a 150px-wide box at
    // dpr 2 gives exactly 300, so a width-only guard silently skips the height
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      homeFrac = measureHomeFrac(h);
    }
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    if (cv.classList.contains('stage-knight')) {
      // full-screen lobby: he sits above the controls, not behind them
      paintCamp(g, w, h,
        cv.parentNode && cv.parentNode.classList.contains('homestage') ? homeFrac : 0.88, dpr);
    }
    else paintBust(g, w, h);
  }

  // The lobby: his whole camp, with him living in it, and the camera on him.
  var CAMP_GND = 8;         // the y everything in camp stands on
  // The moon, the hills and the ground never move and never change, and they
  // are the largest fills on the screen. Bake them once per canvas size and
  // slide the strip under the camera instead of re-pathing it every frame.
  var CAM_LO = -102, CAM_HI = 72;
  var campBack = null;
  // The cards you land on straight after watching the sun come up used to show
  // a night sky. Any screen that is a morning says so; every other screen is a
  // night, because veil() puts it back before the screen is built.
  var campMorning = 0;
  function campDawn() { return campMorning; }
  function campBackdrop(w, h, dpr, base, sc) {
    var dw = campDawn();
    if (campBack && campBack.w === w && campBack.h === h &&
        campBack.dpr === dpr && campBack.base === base && campBack.dawn === dw) return campBack;
    var half = w / sc / 2;
    var x0 = CAM_LO - half - 6;
    var cw = Math.ceil((CAM_HI - CAM_LO + w / sc + 12) * sc);
    var cv = (campBack && campBack.cv) || document.createElement('canvas');
    cv.width = Math.ceil(cw * dpr); cv.height = Math.ceil(h * dpr);
    var bg = cv.getContext('2d');
    bg.setTransform(dpr, 0, 0, dpr, 0, 0);
    bg.clearRect(0, 0, cw, h);
    bg.translate(-x0 * sc, base);
    bg.scale(sc, sc);
    bg.translate(0, -CAMP_GND);
    drawCampSky(bg);
    campBack = { w: w, h: h, dpr: dpr, base: base, sc: sc, cv: cv, x0: x0, cw: cw, dawn: dw };
    return campBack;
  }

  function paintCamp(g, w, h, baseFrac, dpr) {
    // Frame him rather than the frame: aim for him at about a fifth of the
    // height, but never so close you lose the camp or so far he is a speck.
    var sc = clamp(h / 140, w / 320, w / 162);
    var base = h * (baseFrac || 0.88);
    var cam = KN.cam;

    g.save();
    g.translate(w / 2 - cam * sc, base);
    g.scale(sc, sc);
    g.translate(0, -CAMP_GND);
    drawCampStars(g, S.time);
    g.restore();

    var bk = campBackdrop(w, h, dpr || 1, base, sc);
    g.drawImage(bk.cv, w / 2 + (bk.x0 - cam) * sc, 0, bk.cw, h);

    g.save();
    g.translate(w / 2 - cam * sc, base);
    g.scale(sc, sc);
    g.translate(0, -CAMP_GND);

    drawCamp(g, S.time, clamp(KN.fire, 0, 1.2), true);
    drawKnProps(g);

    // everyone who has joined him along the way
    for (var fi = 0; fi < FOLK.length; fi++) {
      var F2 = FOLK[fi];
      g.save();
      g.translate(F2.x, CAMP_GND - 14);
      g.scale(0.87, 0.87);
      drawKnight(g, folkPose(F2, S.time));
      g.restore();
    }

    // the rest of the animals
    for (var pi2 = 0; pi2 < PETS.length; pi2++) {
      g.save();
      g.translate(PETS[pi2].x, CAMP_GND);
      g.scale(1.25, 1.25);
      drawPet(g, PETS[pi2], S.time);
      g.restore();
    }

    // the dog
    g.save();
    g.translate(DOG.x, CAMP_GND);
    drawDog(g, { t: S.time, scale: 1.45, flip: DOG.face, walk: DOG.walking, step: DOG.step,
                 sit: DOG.sit, sleep: DOG.sleep, wag: DOG.wag, hop: DOG.hop,
                 head: DOG.head, bark: DOG.bark });
    g.restore();

    g.save();
    g.translate(KN.x, CAMP_GND - 14);
    drawKnight(g, {
      t: S.time, scale: KN.sc, expr: KN.expr, amt: KN.amt, look: KN.look, lookD: KN.lookD,
      tilt: KN.tilt, hop: KN.hop, squash: KN.squash, spin: KN.spin,
      lean: KN.lean, zzz: KN.zzz, sit: KN.sit, flip: KN.face,
      crouch: KN.crouch, lie: KN.lie, back: KN.back, headTilt: KN.headTilt, lift: KN.lift,
      walk: KN.walking, step: KN.step,
      armL: KN.armL, armR: KN.armR, item: KN.item, itemL: KN.itemL
    });
    g.restore();

    drawCampFront(g, S.time);
    drawKnFeels(g);
    g.restore();

    if (KN.say && KN.sayT > 0) {
      sayBubble(g, w, h, KN.say,
        w / 2 + (KN.x - cam) * sc, base - 40 * sc,
        Math.min(1, KN.sayT / 0.4));
    }
  }

  // The small framed portraits: no camp, just him, centred.
  function paintBust(g, w, h) {
    var TOP = -29, BOT = 15, MID = (TOP + BOT) / 2;
    var sc = Math.min(w, h) / ((BOT - TOP) * 1.28);
    g.save();
    g.translate(w / 2, h / 2 - MID * sc);
    g.scale(sc, sc);
    drawKnight(g, {
      t: S.time, scale: KN.sc, expr: KN.expr, amt: KN.amt, look: KN.look, lookD: KN.lookD,
      tilt: KN.tilt, hop: KN.hop, squash: KN.squash, spin: KN.spin,
      zzz: KN.zzz, sit: KN.sit * 0.5, flip: 1, crouch: KN.crouch * 0.4,
      armL: KN.armL, armR: KN.armR, item: KN.item, itemL: KN.itemL
    });
    // his feelings still show, drawn around his own origin
    for (var i = 0; i < KN.hearts.length; i++) feelAt(g, KN.hearts[i], -KN.x);
    g.globalAlpha = 1;
    g.restore();
  }

  // the ember he is chasing, or the moth bothering him
  function drawKnProps(g) {
    for (var pi = 0; pi < KN.props.length; pi++) {
      var pr = KN.props[pi];
      if (!isFinite(pr.x) || !isFinite(pr.y)) continue;
      if (pr.kind === 'ember') {
        var eg = g.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, 4);
        eg.addColorStop(0, 'rgba(255,236,170,0.95)');
        eg.addColorStop(0.4, 'rgba(255,168,50,0.7)');
        eg.addColorStop(1, 'rgba(255,120,20,0)');
        g.fillStyle = eg;
        g.beginPath(); g.arc(pr.x, pr.y, 4, 0, 6.29); g.fill();
      } else {
        var fl = Math.sin(S.time * 26 + pr.ph) * 0.5 + 0.5;
        g.fillStyle = 'rgba(226,214,190,0.85)';
        g.beginPath(); g.ellipse(pr.x - 1.4, pr.y, 1.7, 0.6 + fl * 1.5, -0.5, 0, 6.29); g.fill();
        g.beginPath(); g.ellipse(pr.x + 1.4, pr.y, 1.7, 0.6 + fl * 1.5, 0.5, 0, 6.29); g.fill();
        g.fillStyle = 'rgba(120,104,88,0.9)';
        g.beginPath(); g.ellipse(pr.x, pr.y, 0.7, 1.5, 0, 0, 6.29); g.fill();
      }
    }
  }

  // hearts, notes and sparks, in camp coordinates
  function drawKnFeels(g) {
    for (var i = 0; i < KN.hearts.length; i++) feelAt(g, KN.hearts[i], 0);
    g.globalAlpha = 1;
  }
  function feelAt(g, hh, dx) {
    var a = clamp(hh.life / hh.max, 0, 1);
    var x = hh.x + dx, y = hh.y;
    g.save();
    g.globalAlpha = a;
    if (hh.kind === 'spark') {
      g.fillStyle = 'rgba(255,206,120,0.95)';
      g.beginPath(); g.arc(x, y, 0.8 * hh.r, 0, 6.29); g.fill();
    } else if (hh.kind === 'note') {
      g.fillStyle = 'rgba(255,214,110,0.95)';
      g.beginPath(); g.arc(x, y, 1.5 * hh.r, 0, 6.29); g.fill();
      g.fillRect(x + 1.1 * hh.r, y - 5 * hh.r, 0.7 * hh.r, 5 * hh.r);
    } else {
      g.fillStyle = 'rgba(255,138,160,0.95)';
      var r = 1.7 * hh.r;
      g.beginPath();
      g.moveTo(x, y + r);
      g.bezierCurveTo(x - r * 1.6, y - r * 0.35, x - r * 0.5, y - r * 1.5, x, y - r * 0.5);
      g.bezierCurveTo(x + r * 0.5, y - r * 1.5, x + r * 1.6, y - r * 0.35, x, y + r);
      g.closePath(); g.fill();
    }
    g.restore();
  }

  // What he is thinking, said out loud over his head.
  function sayBubble(g, w, h, text, ax, ay, fade) {
    var font = '600 11px -apple-system,\'SF Pro Text\',system-ui,sans-serif';
    g.font = font;
    var maxW = Math.min(190, w - 24);
    var words = text.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var trial = cur ? cur + ' ' + words[i] : words[i];
      if (g.measureText(trial).width > maxW - 20 && cur) { lines.push(cur); cur = words[i]; }
      else cur = trial;
    }
    if (cur) lines.push(cur);
    var lw = 0;
    for (i = 0; i < lines.length; i++) lw = Math.max(lw, g.measureText(lines[i]).width);
    var bw = lw + 20, bh = lines.length * 14 + 12;
    var bx = clamp(ax - bw / 2, 8, Math.max(8, w - bw - 8));
    var by = Math.max(6, ay - bh);
    g.save();
    g.globalAlpha = clamp(fade === undefined ? 1 : fade, 0, 1);
    g.fillStyle = 'rgba(26,21,18,0.92)';
    g.strokeStyle = 'rgba(255,159,10,0.28)';
    g.lineWidth = 1;
    roundRectOn(g, bx, by, bw, bh, 9); g.fill(); g.stroke();
    // the little tail, pointing back down at him
    var tx = clamp(ax, bx + 12, bx + bw - 12);
    g.beginPath();
    g.moveTo(tx - 5, by + bh - 0.5);
    g.lineTo(tx + 5, by + bh - 0.5);
    g.lineTo(tx + (ax > tx ? 3 : -3), by + bh + 6);
    g.closePath();
    g.fillStyle = 'rgba(26,21,18,0.92)'; g.fill();
    g.fillStyle = '#EFE3CE';
    g.font = font;
    g.textAlign = 'left'; g.textBaseline = 'top';
    for (i = 0; i < lines.length; i++) g.fillText(lines[i], bx + 10, by + 7 + i * 14);
    g.textBaseline = 'alphabetic';
    g.restore();
  }

  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }

  // Poke him and he perks up; drag across him and he leans into it.
  function bindStage() {
    var st = document.getElementById('stage');
    if (!st) return;
    KN.onStage = true;
    var down = false, moved = 0, sx = 0, sy = 0;
    st.addEventListener('pointerdown', function (e) {
      down = true; moved = 0; sx = e.clientX; sy = e.clientY;
      try { st.setPointerCapture(e.pointerId); } catch (err) {}
    });
    st.addEventListener('pointermove', function (e) {
      if (!down) return;
      moved += Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy);
      sx = e.clientX; sy = e.clientY;
      if (moved > 24) knightPet();          // a stroke, not a tap
    });
    var end = function (e) {
      if (!down) return;
      down = false;
      if (moved <= 24) knightPoke();
      try { st.releasePointerCapture(e.pointerId); } catch (err) {}
    };
    st.addEventListener('pointerup', end);
    st.addEventListener('pointercancel', end);
  }

  function intro(step) {
    step = step || 0;
    if (step >= INTRO.length) { introDone(); return; }
    var sc = INTRO[step];
    S.mode = 'menu';
    showChrome(false);

    var body = '';
    if (sc.ask === 'name') {
      body = '<input id="pName" class="nameIn" maxlength="14" autocomplete="off" spellcheck="false" ' +
             'placeholder="Your name" value="' + esc(META.player.name) + '">' +
             '<button class="go" id="iNext">That is me</button>';
    } else if (sc.ask === 'gender') {
      body = '<div class="askrow">' +
             '<button class="ghost" data-gen="lad">A lad</button>' +
             '<button class="ghost" data-gen="lass">A lass</button>' +
             '</div>';
    } else if (sc.ask === 'hue') {
      body = '<div class="plumes wrap">' + hueSwatches() + '</div>' +
             '<button class="go" id="iNext">That one</button>';
    } else {
      body = '<button class="go" id="iNext">' + esc(sc.btn) + '</button>';
    }

    veil(
      '<div class="eyebrow">The first night</div>' +
      '<h1>Someone <em>Is Up</em></h1>' +

        '<canvas id="portrait" class="portrait stage-knight"></canvas>' +
      '</div>' +
      body +
      '<button class="ghost" id="iSkip">' + (step ? 'Never mind the rest' : 'Skip the introductions') + '</button>' +
      '<div class="foot">You can change any of this later in Settings</div>',
      'wide'
    );

    // he is at his fire, saying it out loud, for as long as the step lasts
    KN.props.length = 0;
    KN.x = -16; KN.tx = -16; KN.cam = -16; KN.face = 1; KN.spotFace = 1;
    KN.sit = 0; KN.zzz = 0; KN.item = null; KN.itemL = null;
    KN.scripted = true;
    KN.hold = sc.expr || 'normal';
    KN.act = sc.act || 'idle'; KN.actT = 999;
    KN.say = fillP(sc.say); KN.sayT = 999;
    knFeel(KN.hold, 1.6, rand(0.55, 0.9));
    hookPortrait();
    bindStage();

    var next = function () { intro(step + 1); };
    if (sc.ask === 'name') {
      var input = document.getElementById('pName');
      var take = function () {
        META.player.name = cleanName(input.value);
        saveMeta();
        next();
      };
      on('iNext', take);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); take(); } });
      setTimeout(function () { try { input.focus(); } catch (e) {} }, 320);
    } else if (sc.ask === 'gender') {
      var gb = elCard.querySelectorAll('[data-gen]');
      for (var i = 0; i < gb.length; i++) {
        gb[i].addEventListener('click', function () {
          META.player.gender = this.getAttribute('data-gen');
          saveMeta(); UI.tap(); next();
        });
      }
    } else if (sc.ask === 'hue') {
      var hb = elCard.querySelectorAll('[data-hue]');
      for (var j = 0; j < hb.length; j++) {
        hb[j].addEventListener('click', function () {
          META.player.hue = this.getAttribute('data-hue');
          META.player.theme = true;
          saveMeta(); applyHue(); UI.tap();
          var all = elCard.querySelectorAll('[data-hue]');
          for (var k = 0; k < all.length; k++) all[k].classList.toggle('on', all[k] === this);
        });
      }
      on('iNext', next);
    } else {
      on('iNext', next);
    }
    on('iSkip', introDone);
  }

  // ── naming your knight ─────────────────────────────────────────────────

  function nameKnight(after) {

    veil(
      '<div class="eyebrow">' + (first ? 'He asked you for one' : 'Your friend') + '</div>' +

          '<div class="plumes inrow">' + plumeSwatches() + '</div></div>' +
        wardrobeRow('Wearing','cape',   OUTFITS, outfitOf().id) +
        wardrobeRow('Head',   'helm',   HEADS,   headOf().id) +
        wardrobeRow('Hair',   'armour', HAIRS,   hairOf().id) +
        wardrobeRow('Cut',    'cut',    CUTS,    cutOf().id) +
      '</div>' +
      '<button class="go" id="btnName">' + (first ? 'Take the Watch' : 'Save') + '</button>' +
      (first ? '' : '<button class="ghost" id="btnNameBack">Back to camp</button>') +
      (first ? '' : '<button class="ghost danger" id="btnWipe">Start over from nothing</button>') +
      '<div class="foot">' + (first ? 'He will keep it. He has waited a while for one.' : 'He will be remembered by this name') + '</div>' +
      buildFoot(),
      'wide', first ? null : (after || menu)
    );
    hookPortrait();
    bindPlumes();
    bindWardrobe();
    var input = document.getElementById('nameIn');
    var commit = function () {
      var n = cleanName(input.value);
      META.knight.name = n || 'Pip';
      saveMeta();
      (after || menu)();
    };
    on('btnName', commit);
    on('btnNameBack', menu);
    on('btnWipe', function () {
      if (this.getAttribute('data-sure')) { wipeMeta(); nameKnight(menu); return; }
      this.setAttribute('data-sure', '1');
      this.classList.add('armed');
      this.textContent = 'Tap again — this erases everything';
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
    if (first) setTimeout(function () { try { input.focus(); } catch (e) {} }, 320);
  }

  // ── shared fragments ──────────────────────────────────────────────────────
  // How far along the road he is, and what is at the end of the next stretch.
  function journeyStrip(compact) {
    var done = journeyIndex(), L = nextLandmark();
    if (!L) {
      return '<div class="road done"><b>The whole road, walked.</b>' +
        '<span>All ' + LANDMARKS.length + ' of them, and the fire never went out for good.</span></div>';
    }
    var walked = (META.night - 1) - done * LM_NIGHTS;
    var pct = clamp(walked / LM_NIGHTS, 0, 1) * 100;
    var away = nightsToNext();
    // He reads about the next stop from his chair, which is the nicest way to
    // meet one of these — but he is only in that chair about a fifth of the
    // time, and it took nearly four minutes of watching before the first fact
    // came out. Nobody waits in camp that long, so the road carries one too.
    var fact = L.facts && L.facts.length ? L.facts[META.night % L.facts.length] : '';
    return '<div class="road">' +
      '<div class="road-top"><span>Next stop</span><b>' + esc(L.name) + '</b></div>' +
      '<div class="road-bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="road-sub">' + esc(L.st) + ' · ' +
        (away <= 1 ? 'one more night' : away + ' more nights') +
        (compact ? '' : ' · ' + done + ' of ' + LANDMARKS.length + ' behind you') + '</div>' +
      (fact ? '<div class="road-fact">' + esc(fact) + '</div>' : '') +
    '</div>';
  }

  function emberChip() {

  function levelStrip() {
    var L = levelInfo(META.xp);
    var pct = clamp(L.into / L.need, 0, 1) * 100;
    return '<div class="lvl">' +
      '<div class="lvl-top"><b>Watch level ' + L.level + '</b></div>' +
      '<div class="xp"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="lvl-sub">' + L.into.toLocaleString() + ' / ' + L.need.toLocaleString() + ' to level ' + (L.level + 1) + nextUnlockNote(L.level) + '</div>' +
    '</div>';
  }
  function nextUnlockNote(level) {
    var soon = [];
    for (var i = 0; i < UPGRADES.length; i++) if (UPGRADES[i].lv === level + 1) soon.push(UPGRADES[i].name);
    if (!soon.length) return '';
    var shown = soon.slice(0, 2).join(' & ');
    if (soon.length > 2) shown += ' +' + (soon.length - 2) + ' more';
    return ' · unlocks ' + shown;
  }
  function upChips(map, big) {
    var out = '', ids = Object.keys(map || {});
    if (!ids.length) return '<div class="none">Nothing drafted yet.</div>';
    // the in-play strip has a pause button to stay clear of, so it elides
    var cap = big ? ids.length : 8;
    var over = ids.length - cap;
    if (over > 0) ids = ids.slice(0, cap);
    for (var i = 0; i < ids.length; i++) {
      var def = UP_BY_ID[ids[i]]; if (!def || !map[ids[i]]) continue;
      out += '<span class="chip t' + def.tier + (big ? ' big' : '') + '" title="' + esc(def.desc) + '">' +
             '<em>' + def.glyph + '</em>' + (big ? '<b>' + esc(def.name) + '</b>' : '') +
             (map[ids[i]] > 1 ? '<u>×' + map[ids[i]] + '</u>' : '') + '</span>';
    }
    if (over > 0) out += '<span class="chip more">+' + over + '</span>';
    return out;
  }

  // ── the stores: spend embers on things that persist ──────────────────────
  function shopRows() {
    var rows = '';
    for (var i = 0; i < PERKS.length; i++) {
      var P = PERKS[i], r = pk(P.id), maxed = r >= P.ranks;
      var cost = maxed ? 0 : P.cost[r];
      var afford = !maxed && META.embers >= cost;
      var pips = '';
      for (var d = 0; d < P.ranks; d++) pips += '<i class="' + (d < r ? 'on' : '') + '"></i>';
      rows +=
        '<div class="shop' + (maxed ? ' maxed' : '') + '">' +
          '<div class="sg">' + P.glyph + '</div>' +
          '<div class="sb">' +
            '<b>' + esc(P.name) + '</b>' +
            '<span>' + (r && !maxed ? 'Next: ' + esc(lcFirst(P.desc(Math.min(r + 1, P.ranks))))
                                       : esc(P.desc(Math.min(r + (maxed ? 0 : 1), P.ranks)))) + '</span>' +
            '<div class="pips">' + pips + '</div>' +
          '</div>' +
          (maxed
            ? '<div class="sc done">MAX</div>'
            : '<button class="sc' + (afford ? ' can' : '') + '" data-perk="' + P.id + '">' +
                '<i>\u2726</i>' + cost + '</button>') +
        '</div>';
    }
    return rows;
  }
  function shop() {
    S.mode = 'menu';
    var rows = shopRows();
    veil(
      '<div class="eyebrow">The Stores</div>' +
      '<h1>Spend <em>Embers</em></h1>' +
      emberChip() +
      levelStrip() +
      '<div class="lede sm">Bought once and kept for good. Every watch you finish pays out more.</div>' +
      '<div class="shoplist">' + rows + '</div>' +
      '<button class="ghost" id="btnBack">Back to camp</button>' +
      buildFoot(),
      'wide', menu
    );
    // Buying used to rebuild the whole card, which threw you back to the top of
    // a list you had scrolled halfway down. The rows are delegated instead, so
    // a purchase repaints the list and the purse where they stand and the page
    // does not move under your thumb.
    var list = elCard.querySelector('.shoplist');
    var purse = document.getElementById('purseNum');
    if (list) list.addEventListener('click', function (ev) {
      var btn = ev.target.closest ? ev.target.closest('button[data-perk]') : null;
      if (!btn || !list.contains(btn)) return;
      var id = btn.getAttribute('data-perk');
      var P2 = null;
      for (var q = 0; q < PERKS.length; q++) if (PERKS[q].id === id) P2 = PERKS[q];
      if (!P2) return;
      var rank = pk(id);
      if (rank >= P2.ranks) return;
      var price = P2.cost[rank];
      if (META.embers < price) { UI.denied(); return; }
      META.embers -= price;
      META.perks[id] = rank + 1;
      saveMeta(); recalc();
      UI.buy();
      buzz(14);
      var keep = elVeil.scrollTop;
      list.innerHTML = shopRows();
      if (purse) purse.textContent = META.embers.toLocaleString();
      elVeil.scrollTop = keep;
    });
    on('btnBack', menu);
  }

  // ── the dawn draft ────────────────────────────────────────────────────────
  function draftPool() {
    var lvl = keeperLevel(), pool = [];
    for (var i = 0; i < UPGRADES.length; i++) {
      var U = UPGRADES[i];
      if (U.lv > lvl) continue;
      if (u(U.id) >= U.max) continue;
      var w = U.tier === 1 ? 10 : U.tier === 2 ? 4 : 1.5;
      if (u(U.id) > 0) w *= 0.7;              // mild nudge toward variety
      pool.push({ up: U, w: w });
    }
    return pool;
  }
  function rollDraft(n) {
    var pool = draftPool(), out = [];
    while (out.length < n && pool.length) {
      var total = 0, i;
      for (i = 0; i < pool.length; i++) total += pool[i].w;
      var roll = Math.random() * total, acc = 0, pickIdx = pool.length - 1;
      for (i = 0; i < pool.length; i++) { acc += pool[i].w; if (roll <= acc) { pickIdx = i; break; } }
      out.push(pool[pickIdx].up);
      pool.splice(pickIdx, 1);
    }
    return out;
  }

  // ── run bookkeeping ───────────────────────────────────────────────────────
  // One night's worth of accounting. Held or lost, the embers are yours and
  // the camp keeps everything you have bought — only the night number moves.
  function finishNight(held) {
    var r = {
      night: S.night, score: Math.round(S.score), logs: S.logsBurned, kills: S.kills,
      husks: S.husks, flares: S.flares, upCount: upCount(), bestHeat: S.bestHeat,
      brandKills: S.brandKills, damage: S.damageTaken, held: !!held
    };
    var base = Math.round(r.score / 22) + Math.round(nightP(r.night) * 14);
    if (!held) base = Math.round(base * 0.55);              // a lost night still pays
    var embers = Math.max(1, Math.round(base * (1 + pk('sifter') * 0.12)));
    var runEmbers = embers;

    var newAch = [];
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      var A = ACHIEVEMENTS[i];
      if (!META.ach[A.id] && A.test(r)) { META.ach[A.id] = 1; newAch.push(A); embers += A.embers; }
    }

    var before = keeperLevel();
    META.embers += embers;
    META.xp += embers;
    META.runs++;
    META.lifeLogs += r.logs;
    META.lifeKills += r.kills;
    META.lifeNights += held ? 1 : 0;
    if (held) META.night = r.night + 1;
    if (r.night > META.bestNight) META.bestNight = r.night;
    if (r.score > META.bestScore) META.bestScore = r.score;
    var after = keeperLevel();
    saveMeta();
    return { r: r, embers: embers, runEmbers: runEmbers, newAch: newAch, before: before, after: after };
  }
  function finishRun() { return finishNight(false); }

  // If the run pushed you past a landmark, that comes first — and somebody
  // new is waiting at the camp when you get there.
  function arrivals(after) {
    if (journeyIndex() <= META.reached) return false;
    var L = LANDMARKS[META.reached];
    META.reached++;
    var joined = null;
    if (META.reached === 1 && !META.partner) {
      META.partner = rollFrom(PARTNER_NAMES, []);
      joined = { kind: 'partner', name: META.partner };
    } else if (META.pets.length < extraPetsDue()) {
      var kind = PET_KINDS[META.pets.length];
      var taken = [];
      for (var i = 0; i < META.pets.length; i++) taken.push(META.pets[i].name);
      var nm = rollFrom(PET_NAMES[kind] || DOG_NAMES, taken);
      META.pets.push({ kind: kind, name: nm });
      joined = { kind: kind, name: nm };
    }
    saveMeta();
    syncFolk();
    arrivalCard(L, joined, after);
    return true;
  }

  // Nothing is lost when a night goes badly — the camp keeps everything.
  function epitaph() {
    var who = knightName(), fell = S.cause === 'fell';
    var lines = fell
      ? [who + ' woke up by the fire with a headache and no memory of the end of it.',
         'They dragged him in before it got him. He is fine. Mostly.',
         who + ' went down swinging, and somebody put the kettle on.']
      : ['The flame went out about an hour before dawn. It happens. He will walk back and borrow a light.',
         who + ' ran out of wood at the worst possible moment.',
         'Nearly. Genuinely nearly. Have another go.'];
    var tail = ' Everything he has bought is still his — try the night again, or spend what you earned first.';
    return lines[Math.floor(Math.random() * lines.length)] + tail;
  }

  // ────────────────────────────────────────────────────────────── loop
  var last = 0, acc = 0;
  var STEP = 1 / 120;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;

    if (S.mode !== 'paused') {
      // a sliver of held time on a kill: long enough to feel the hit land,
      // short enough that it never reads as a stutter
      if (S.hitstop > 0) { S.hitstop -= dt; if (acc > STEP) acc = STEP; }
      else {
        acc += dt;
        var guard = 0;
        while (acc >= STEP && guard++ < 20) { update(STEP); acc -= STEP; }
      }
    }
    // The lobby is opaque wall to wall, so the field behind it is drawn for
    // nobody. Skipping it there is most of a frame back on a phone.
    if (!elVeil.classList.contains('full')) { render(); }
    syncHud();
    if (portraitCv) {
      syncFolk(); syncPets(); updateKnight(dt); updateDog(dt); updatePets(dt);
      updateTreat(dt); paintPortrait();
      var doing = document.getElementById('homeDoing');
      if (doing) { var dl = doingLine(); if (doing.textContent !== dl) doing.textContent = dl; }
    }
  }

  // ────────────────────────────────────────────────────────────── boot
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && S.mode === 'play') togglePause();
    if (!A.ctx) return;
    if (document.hidden) { A.ctx.suspend(); }
    else if (MUS.on || !S.muted) { A.ctx.resume(); }

  // One soft tap for any button in the interface. Controls that already make
  // their own sound (the brand, the flare, and anything with a richer
  // confirmation below) are left alone so nothing doubles up.
  document.addEventListener('pointerdown', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.id === 'brand' || b.id === 'flare') return;
    if (b.hasAttribute('data-perk') || b.hasAttribute('data-up') || b.hasAttribute('data-plume')) return;
    if (/^(btnBack|btnNameBack|btnMenu)$/.test(b.id)) UI.back();
    else UI.tap();
  }, true);

  loadMeta();
  MUS.loop = META.opts.loop;
  applyHand();
  S.muted = !META.opts.sound;
  MUS.on = META.opts.music;
  MUS.tune = Math.floor(Math.random() * TUNES.length);
  recalc();

  // browsers hold audio until the first gesture, so the band starts then
  function wakeAudio() {
    document.removeEventListener('pointerdown', wakeAudio);
    document.removeEventListener('keydown', wakeAudio);
    ac();
    startMusic();
  }
  document.addEventListener('pointerdown', wakeAudio);
  document.addEventListener('keydown', wakeAudio);
  // opt-in inspection hook for tuning/QA: open with #debug
  if (/[?#]debug/.test(location.href)) window.__NW = { S: S, K: K, D: D, META: META, UPGRADES: UPGRADES, PERKS: PERKS,
      flare: doFlare, swing: doSwing, spawnShade: spawnShade, lightAt: lightAt, stick: stick, KN: KN, CAMP: CAMP, drawCamp: drawCamp, drawCampFront: drawCampFront, DOG: DOG, FOLK: FOLK, PETS: PETS, drawDog: drawDog, drawPet: drawPet, PET_KINDS: PET_KINDS, folkPose: folkPose, updateDog: updateDog, updateTreat: updateTreat, TREAT: TREAT, syncFolk: syncFolk, startParty: startParty, endParty: endParty, LANDMARKS: LANDMARKS, journeyIndex: journeyIndex, ZOOM: ZOOM, field: function () { return { w: W, h: H }; }, KN_ACTS: KN_ACTS, knightSay: knightSay, knightFact: knightFact, nextLandmark: nextLandmark, knightAct: knightAct, updateKnight: updateKnight, knightPoke: knightPoke, knightPet: knightPet, beatNow: beatNow, drawKnight: drawKnight, A: A, MUS: MUS, TUNES: TUNES,
      startMusic: startMusic, nextTune: nextTune, setMusic: setMusic, SFX: SFX, UI: UI, ac: ac, switchTo: switchTo, applyTone: applyTone, GENRE: GENRE,
      music: { parseChord: parseChord, voicing: voicing, bassNote: bassNote,
               leadNote: leadNote, chordAt: chordAt, QUAL: QUAL, mtof: mtof }, recalc: recalc, saveMeta: saveMeta, rollDraft: rollDraft, take: takeUpgrade };
  resize();
  S.keeper.x = W / 2; S.keeper.y = H / 2 + 96;
  if (!META.dog.name) { META.dog.name = rollFrom(DOG_NAMES, []); saveMeta(); }
  syncFolk();
  syncPets();
  applyHue();
  // He does not wait politely at the fire for you to arrive; whatever he was
  // doing, he was already doing it, somewhere in the camp.
  knightAct();
  KN.x = KN.tx; KN.face = KN.spotFace || (Math.random() < 0.5 ? -1 : 1);
  KN.cam = clamp(KN.x, -36, 47);
  KN.actT *= rand(0.2, 0.9);
  KN.sayNext = rand(3, 14);
  // With storage blocked nothing he learns would survive the tab, so he skips
  // the introductions rather than asking your name again every single launch.
  if (META.player.met || SAVE_FAILED) menu(); else intro(0);
  requestAnimationFrame(frame);
})();
</script>
