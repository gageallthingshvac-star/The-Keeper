  // ────────────────────────────────────────────────────────────── canvas sizing
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    [cvs, darkCvs, groundCvs].forEach(function (cv) {
      cv.width = Math.max(1, Math.round(W * DPR));
      cv.height = Math.max(1, Math.round(H * DPR));
      cv.style.width = W + 'px';
      cv.style.height = H + 'px';
    });
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S.fire.x = W / 2;
    S.fire.y = H / 2;
    S.keeper.x = clamp(S.keeper.x, 16, W - 16);
    S.keeper.y = clamp(S.keeper.y, 60, H - 24);
    paintGround();
  }

  function paintGround() {
    var r = mulberry32(1337);
    gctx.clearRect(0, 0, W, H);
    var g = gctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, Math.max(W, H) * 0.8);
    g.addColorStop(0, '#241a14');
    g.addColorStop(0.45, '#150f10');
    g.addColorStop(1, '#08060a');
    gctx.fillStyle = g;
    gctx.fillRect(0, 0, W, H);

    // scattered grit
    for (var i = 0; i < Math.floor(W * H / 1400); i++) {
      var x = r() * W, y = r() * H, s = r() * 1.7 + 0.3;
      gctx.fillStyle = 'rgba(232,220,200,' + (0.02 + r() * 0.05).toFixed(3) + ')';
      gctx.fillRect(x, y, s, s);
    }
    // a few grass tufts / stones
    for (var j = 0; j < Math.floor((W * H) / 26000); j++) {
      var px = r() * W, py = r() * H;
      if (dist(px, py, W / 2, H / 2) < 90) continue;
      gctx.strokeStyle = 'rgba(150,168,107,0.10)';
      gctx.lineWidth = 1.1;
      for (var b = 0; b < 3; b++) {
        gctx.beginPath();
        gctx.moveTo(px + b * 2.6 - 2.6, py);
        gctx.quadraticCurveTo(px + b * 2.6 - 4, py - 7, px + b * 3.4 - 6, py - 12);
        gctx.stroke();
      }
    }
    // fire ring stones
    for (var k = 0; k < 13; k++) {
      var a = (k / 13) * Math.PI * 2 + 0.2;
      var rr = 46 + r() * 5;
      var sx = W / 2 + Math.cos(a) * rr, sy = H / 2 + Math.sin(a) * rr * 0.72;
      gctx.fillStyle = 'rgba(120,112,104,0.32)';
      gctx.beginPath();
      gctx.ellipse(sx, sy, 8 + r() * 3, 6 + r() * 2, a, 0, Math.PI * 2);
      gctx.fill();
      gctx.fillStyle = 'rgba(0,0,0,0.35)';
      gctx.beginPath();
      gctx.ellipse(sx, sy + 2.5, 7 + r() * 2, 3, a, 0, Math.PI * 2);
      gctx.fill();
    }
  }

  // ────────────────────────────────────────────────────────────── lighting model
  function lightRadius() {
    return (74 + (S.fuel / D.maxFuel) * 196 + S.fire.flare * 90) * D.fireLight;
  }
  function lightAt(x, y) {
    var lr = lightRadius();
    var f = clamp(1 - dist(x, y, S.fire.x, S.fire.y) / lr, 0, 1);
    var l = clamp(1 - dist(x, y, S.keeper.x, S.keeper.y) / D.lampR, 0, 1) * 0.85;
    return clamp(Math.max(f * f * 1.15, l), 0, 1);
  }

  // ────────────────────────────────────────────────────────────── particles
  function spark(x, y, n, hue, spd, life) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
      S.parts.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rand(life * 0.5, life), max: life, r: rand(1, 2.6), c: hue, g: 0
      });
    }
  }
  function ember(x, y) {
    S.parts.push({
      x: x + rand(-13, 13), y: y + rand(-6, 6),
      vx: rand(-14, 14), vy: rand(-52, -24),
      life: rand(0.7, 1.7), max: 1.7, r: rand(0.9, 2.1), c: 'ember', g: -8
    });
  }

  // ── feedback: numbers that fly off the thing that produced them ────────
  function floatText(x, y, txt, col, size) {
    S.floats.push({ x: x, y: y, txt: txt, col: col || '#FFD60A', size: size || 15, life: 1.05, max: 1.05, vy: -46 });
  }

  // Heat is the combo: dispel shades back to back and everything scores more.
  function heatMul() { return 1 + S.heat * 0.10; }
  function bumpHeat() {
    S.heat++;
    S.heatT = 3.4;
    if (S.heat > S.bestHeat) S.bestHeat = S.heat;
    if (S.heat === 5 || S.heat === 10 || S.heat === 15 || S.heat % 10 === 0) {
      toast('Heat ×' + S.heat, S.heat >= 15 ? 'The dark is giving ground' : 'Keep them coming');
      bell(392 + Math.min(S.heat, 24) * 26, 0.5, 0.04, 2.4);
    }
  }
  function addScore(n, x, y, col) {
    var v = n * D.scoreMul * heatMul();
    S.score += v;
    if (x !== undefined) floatText(x, y, '+' + Math.round(v), col || 'rgba(255,214,10,0.95)', 14);
    return v;
  }

  function spawnMote(x, y) {
    S.motes.push({ x: x, y: y, vx: rand(-40, 40), vy: rand(-40, 40), life: 9, val: 4 });
  }

  // ────────────────────────────────────────────────────────────── spawning
  // wood gets scarcer and lies farther out as the nights wear on
  function logInterval() { return K.logEvery + Math.min(1.9, (S.night - 1) * 0.17); }
  function logMinDist() { return Math.min(Math.min(W, H) * 0.42, 128 + (S.night - 1) * 13); }

  function spawnLog() {
    if (S.logs.length >= D.maxLogs) return;
    var minD = logMinDist();
    for (var tries = 0; tries < 30; tries++) {
      var x = rand(46, W - 46), y = rand(88, H - 96);
      if (dist(x, y, S.fire.x, S.fire.y) < minD) continue;
      S.logs.push({ x: x, y: y, a: rand(0, Math.PI), pop: 0 });
      return;
    }
    // arena too small to honour the min distance — drop it on the ring instead
    var ang = rand(0, 6.283);
    S.logs.push({
      x: clamp(S.fire.x + Math.cos(ang) * minD, 46, W - 46),
      y: clamp(S.fire.y + Math.sin(ang) * minD, 88, H - 96),
      a: rand(0, Math.PI), pop: 0
    });
  }

  function spawnShade() {
    var edge = Math.floor(rand(0, 4)), x, y, m = 40;
    if (edge === 0) { x = rand(-m, W + m); y = -m; }
    else if (edge === 1) { x = W + m; y = rand(-m, H + m); }
    else if (edge === 2) { x = rand(-m, W + m); y = H + m; }
    else { x = -m; y = rand(-m, H + m); }

    // husks only start walking on night 5, and never crowd out everything else
    var huskChance = S.night >= 5 ? clamp((S.night - 4) * 0.07, 0, 0.34) : 0;
    var wispChance = S.night >= 3 ? clamp(0.16 + S.night * 0.04, 0, 0.42) : 0;
    var roll = Math.random();
    var kind = roll < huskChance ? 'husk' : (roll < huskChance + wispChance ? 'wisp' : 'crawler');
    var T = SHADE[kind];
    var hp = T.hp + S.night * T.hpN;

    S.shades.push({
      kind: kind, t: T,
      x: x, y: y,
      hp: hp, maxHp: hp,
      spd: rand(T.spd[0], T.spd[1]) + S.night * T.spdN,
      r: T.r,
      kx: 0, ky: 0,       // knockback velocity
      wob: rand(0, 6.28),
      latched: 0,
      hit: 0
    });
  }

  // Three kinds of dark. `burn` is how fast light eats them — a husk barely
  // cares about firelight, so it has to be met out in the open with a flare.
  var SHADE = {
    crawler: { hp: 6.0, hpN: 1.4, spd: [30, 41], spdN: 1.1, r: 15, burn: 5.2, drain: 5.4, wob: 3.4, sway: 0.22, score: 12, heal: 1.1, tint: '34,18,44',  eye: 'rgba(255,107,107,0.80)', eyeGap: 4.4 },
    wisp:    { hp: 3.4, hpN: 0.0, spd: [66, 80], spdN: 0.0, r: 10, burn: 6.5, drain: 3.6, wob: 7.0, sway: 0.50, score: 8,  heal: 0.7, tint: '78,48,142',  eye: 'rgba(200,180,255,0.85)', eyeGap: 3.2 },
    husk:    { hp: 13,  hpN: 2.2, spd: [22, 30], spdN: 0.5, r: 19, burn: 2.0, drain: 7.6, wob: 2.0, sway: 0.14, score: 26, heal: 2.6, tint: '14,8,20',   eye: 'rgba(255,168,32,0.90)', eyeGap: 6.0 }
  };

  // ────────────────────────────────────────────────────────────── input
  var keys = {};
  var stick = { id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0, on: false };

  window.addEventListener('keydown', function (e) {
    var tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) return;
    var k = e.key.toLowerCase();
    keys[k] = true;
    if (k === ' ') { e.preventDefault(); if (!e.repeat) doSwing(); }
    if (k === 'f' || k === 'shift') { e.preventDefault(); doFlare(); }
    if (k === 'escape' || k === 'p') togglePause();
    if (k === 'enter' && (S.mode === 'menu' || S.mode === 'over')) startGame();
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  function localPt(e) {
    return { x: e.clientX, y: e.clientY };
  }
  cvs.addEventListener('pointerdown', function (e) {
    if (S.mode !== 'play') return;
    e.preventDefault();
    var p = localPt(e);
    if (stick.id === null) {
      stick.id = e.pointerId; stick.ox = p.x; stick.oy = p.y;
      stick.x = p.x; stick.y = p.y; stick.dx = 0; stick.dy = 0; stick.on = true;
      try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
    } else {
      doSwing(); // second finger anywhere = swing the brand
    }
  }, { passive: false });

  cvs.addEventListener('pointermove', function (e) {
    if (e.pointerId !== stick.id) return;
    var p = localPt(e);
    stick.x = p.x; stick.y = p.y;
    var dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    var d = Math.hypot(dx, dy);
    var MAX = 54;
    if (d > MAX) {
      if (META.opts.stick === 'drift') {   // the origin follows your thumb
        stick.ox += dx * (1 - MAX / d);
        stick.oy += dy * (1 - MAX / d);
        dx = stick.x - stick.ox; dy = stick.y - stick.oy;
      }
      d = MAX;                             // fixed: the origin stays put
    }
    var n = d < 7 ? 0 : clamp((d - 7) / (MAX - 7), 0, 1);
    if (d > 0.001) { stick.dx = dx / d * n; stick.dy = dy / d * n; }
    else { stick.dx = 0; stick.dy = 0; }
  }, { passive: false });

  function endStick(e) {
    if (e.pointerId !== stick.id) return;
    stick.id = null; stick.on = false; stick.dx = 0; stick.dy = 0;
  }
  cvs.addEventListener('pointerup', endStick);
  cvs.addEventListener('pointercancel', endStick);

  var flareBtn = document.getElementById('flare');
  flareBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); doFlare(); });
  var brandBtn = document.getElementById('brand');
  brandBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); doSwing(); });
  document.getElementById('pause').addEventListener('click', togglePause);

  // ────────────────────────────────────────────────────────────── actions
  function doFlare() {
    if (S.mode !== 'play') return;
    var k = S.keeper;
    if (k.cd > 0 || S.fuel < D.flareCost + 2) { UI.denied(); return; }
    k.cd = D.flareCd;
    S.fuel -= D.flareCost;
    S.flares++;
    S.fire.flare = Math.max(S.fire.flare, 1);
    S.shake = Math.max(S.shake, 7);
    SFX.flare(); buzz(22);
    spark(k.x, k.y, 22, 'gold', 230, 0.5);
    burst(k.x, k.y, D.flareR, 3.2, 1);

    if (u('cinder')) {
      var ring = 3 + u('cinder');
      for (var c = 0; c < ring; c++) {
        var ca = (c / ring) * Math.PI * 2 + rand(-0.3, 0.3);
        var cd2 = D.flareR * rand(0.4, 0.8);
        S.cinders.push({ x: k.x + Math.cos(ca) * cd2, y: k.y + Math.sin(ca) * cd2,
                         r: 30 + u('cinder') * 8, life: 4, max: 4 });
      }
    }
  }

  function angDiff(a, b) {
    var d = (a - b) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  // The brand — a burning stick off the fire. Costs nothing but has to be
  // aimed and closes the distance, which is the trade against the flare.
  function doSwing() {
    if (S.mode !== 'play') return;
    var k = S.keeper;
    if (k.swingCd > 0) return;
    k.swingCd = D.swingCd;
    k.swing = D.swingDur;
    k.swingDir = k.face;

    // a hotter fire makes a hotter brand
    var heat = 0.75 + 0.5 * clamp(S.fuel / D.maxFuel, 0, 1);
    var dmg = D.brandDmg * heat;
    var half = D.brandArc / 2;
    var before = S.kills, hits = 0;

    for (var i = S.shades.length - 1; i >= 0; i--) {
      var sh = S.shades[i];
      var d = dist(sh.x, sh.y, k.x, k.y);
      if (d > D.brandR + sh.r) continue;
      var ang = Math.atan2(sh.y - k.y, sh.x - k.x);
      if (D.brandArc < Math.PI * 2 && Math.abs(angDiff(ang, k.swingDir)) > half) continue;
      sh.kx += Math.cos(ang) * 300;
      sh.ky += Math.sin(ang) * 300;
      sh.hit = 0.28;
      sh.latched = 0;
      sh.hp -= dmg;
      hits++;
      spark(sh.x, sh.y, 4, 'gold', 90, 0.3);
      if (sh.hp <= 0) killShade(i);
    }
    S.brandKills += S.kills - before;

    SFX.swing(hits > 0);
    if (hits) { buzz(10); S.shake = Math.max(S.shake, 4); }
  }

  // Shared by the flare and by Pyre: knock everything back, burn it, and pay
  // the Backdraft refund for whatever it caught.
  function burst(x, y, radius, dmg, refund) {
    var caught = 0;
    for (var i = S.shades.length - 1; i >= 0; i--) {
      var s = S.shades[i];
      var d = dist(s.x, s.y, x, y);
      if (d > radius) continue;
      var force = (1 - d / radius);
      var ang = Math.atan2(s.y - y, s.x - x);
      s.kx += Math.cos(ang) * 420 * force;
      s.ky += Math.sin(ang) * 420 * force;
      s.latched = 0;
      s.hit = 0.25;
      s.hp -= dmg * force + 1;
      caught++;
      if (s.hp <= 0) killShade(i);
    }
    if (refund && u('backdraft') && caught) {
      var back = Math.min(caught * 2 * u('backdraft'), 30);
      S.fuel = Math.min(D.maxFuel, S.fuel + back);
      floatText(x, y - 30, '+' + back + ' back', 'rgba(99,230,190,0.95)', 14);
    }
    return caught;
  }

  function killShade(i) {
    var s = S.shades[i];
    spark(s.x, s.y, Math.round(s.r * 0.9), 'shade', 150, 0.55);
    spark(s.x, s.y, 5, 'gold', 90, 0.4);
    S.shades.splice(i, 1);
    S.kills++;
    if (s.kind === 'husk') S.husks++;

    // dispelling a shade gives a little life back — the way home from a bad
    // night is killing your way out of it
    if (S.health < D.maxHealth) {
      var mend = s.t.heal * D.mend;
      S.health = Math.min(D.maxHealth, S.health + mend);
      S.mended += mend;
      if (S.mended >= 5) {                       // pooled, so it isn't a wall of +1s
        floatText(S.keeper.x, S.keeper.y - 52, '+' + Math.round(S.mended) + ' hp', 'rgba(99,230,190,0.95)', 14);
        S.mended = 0;
      }
    }
    bumpHeat();
    addScore(s.t.score, s.x, s.y - 12);
    if (u('tinder') && Math.random() < 0.28 * u('tinder')) spawnMote(s.x, s.y);
    SFX.kill();
  }

  // ────────────────────────────────────────────────────────────── update
  function update(dt) {
    S.time += dt;
    S.shake = Math.max(0, S.shake - dt * 26);
    S.fire.flare = Math.max(0, S.fire.flare - dt * 1.9);

    // embers off the fire
    if (Math.random() < dt * (12 + S.fuel * 0.5)) ember(S.fire.x, S.fire.y - 8);

    // particles
    for (var p = S.parts.length - 1; p >= 0; p--) {
      var pt = S.parts[p];
      pt.life -= dt;
      if (pt.life <= 0) { S.parts.splice(p, 1); continue; }
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vy += (pt.g || 0) * dt;
      pt.vx *= (1 - dt * 1.6); pt.vy *= (1 - dt * 1.6);
    }

    // floating numbers
    for (var ft = S.floats.length - 1; ft >= 0; ft--) {
      var f2 = S.floats[ft];
      f2.life -= dt;
      if (f2.life <= 0) { S.floats.splice(ft, 1); continue; }
      f2.y += f2.vy * dt;
      f2.vy *= (1 - dt * 2.4);
    }

    // heat cools off if you stop dispelling
    if (S.heatT > 0) { S.heatT -= dt; if (S.heatT <= 0) S.heat = 0; }

    if (S.mode === 'dawn') {
      S.dawnHold -= dt;
      if (S.dawnHold <= 0) { S.nightT = 0; openDraft(); }
      return;
    }
    if (S.mode !== 'play') return;

    // ── keeper movement
    var k = S.keeper;
    var ix = 0, iy = 0;
    if (keys['arrowleft'] || keys['a']) ix -= 1;
    if (keys['arrowright'] || keys['d']) ix += 1;
    if (keys['arrowup'] || keys['w']) iy -= 1;
    if (keys['arrowdown'] || keys['s']) iy += 1;
    var kd = Math.hypot(ix, iy);
    if (kd > 0) { ix /= kd; iy /= kd; }
    if (stick.on) { ix = stick.dx; iy = stick.dy; }

    k.guard = Math.max(0, (k.guard || 0) - dt);
    k.swingCd = Math.max(0, (k.swingCd || 0) - dt);
    k.swing = Math.max(0, (k.swing || 0) - dt);
    var load = Math.max(0.78, 1 - k.carry * D.carryPer);
    var speed = D.speed * load;
    k.vx = lerp(k.vx, ix * speed, 1 - Math.pow(0.0008, dt));
    k.vy = lerp(k.vy, iy * speed, 1 - Math.pow(0.0008, dt));
    k.x = clamp(k.x + k.vx * dt, 16, W - 16);
    k.y = clamp(k.y + k.vy * dt, 60, H - 24);
    if (Math.hypot(k.vx, k.vy) > 12) k.face = Math.atan2(k.vy, k.vx);
    k.cd = Math.max(0, k.cd - dt);

    // keep the keeper out of the coals
    var fd = dist(k.x, k.y, S.fire.x, S.fire.y);
    if (fd < K.fireCoreR) {
      var a = Math.atan2(k.y - S.fire.y, k.x - S.fire.x);
      k.x = S.fire.x + Math.cos(a) * K.fireCoreR;
      k.y = S.fire.y + Math.sin(a) * K.fireCoreR;
    }

    // ── logs
    S.logT -= dt;
    if (S.logT <= 0) { spawnLog(); S.logT = logInterval() * D.logRate * rand(0.75, 1.3); }
    var inFlight = 0;
    for (var fi = 0; fi < S.logs.length; fi++) if (S.logs[fi].fly) inFlight++;

    for (var i = S.logs.length - 1; i >= 0; i--) {
      var lg = S.logs[i];
      lg.pop = Math.min(1, lg.pop + dt * 3.2);
      if (lg.cool > 0) { lg.cool -= dt; lg.fly = 0; continue; }

      var room = k.carry + inFlight < D.carry;
      var ld = dist(lg.x, lg.y, k.x, k.y);

      if (!lg.fly && room && ld < D.pickupR) {
        lg.fly = 1;                       // it has noticed you
        lg.vx = lg.vx || 0; lg.vy = lg.vy || 0;
        inFlight++;
      } else if (lg.fly && k.carry + (inFlight - 1) >= D.carry && ld > 24) {
        lg.fly = 0; inFlight--;           // arms filled up — it settles again
      }

      if (lg.fly) {
        var la = Math.atan2(k.y - lg.y, k.x - lg.x);
        var pull = 620 + (1 - clamp(ld / Math.max(D.pickupR, 1), 0, 1)) * 900;
        lg.vx += Math.cos(la) * pull * dt;
        lg.vy += Math.sin(la) * pull * dt;
        lg.vx *= Math.pow(0.02, dt); lg.vy *= Math.pow(0.02, dt);
        lg.x += lg.vx * dt; lg.y += lg.vy * dt;
        lg.a += dt * 7;                   // tumbling as it comes
        if (ld < 15) {                    // landed in your hands
          S.logs.splice(i, 1);
          inFlight--;
          k.carry++;
          SFX.pick(); buzz(8);
          spark(k.x, k.y - 20, 6, 'wood', 80, 0.35);
          floatText(k.x, k.y - 46, '+1 log', 'rgba(190,150,90,0.95)', 13);
        }
      }
    }

    // ── motes of fire left by dispelled shades (Tinderburst)
    for (var mi = S.motes.length - 1; mi >= 0; mi--) {
      var mo = S.motes[mi];
      mo.life -= dt;
      if (mo.life <= 0) { S.motes.splice(mi, 1); continue; }
      var md = dist(mo.x, mo.y, k.x, k.y);
      if (md < 120) {                       // drift toward the keeper
        var ma = Math.atan2(k.y - mo.y, k.x - mo.x);
        var pull = (1 - md / 120) * 340;
        mo.vx += Math.cos(ma) * pull * dt;
        mo.vy += Math.sin(ma) * pull * dt;
      }
      mo.x += mo.vx * dt; mo.y += mo.vy * dt;
      mo.vx *= Math.pow(0.12, dt); mo.vy *= Math.pow(0.12, dt);
      if (md < 20) {
        S.fuel = Math.min(D.maxFuel, S.fuel + mo.val);
        floatText(mo.x, mo.y - 8, '+' + mo.val, 'rgba(255,214,10,0.95)', 13);
        spark(mo.x, mo.y, 5, 'gold', 70, 0.3);
        bell(1175, 0.26, 0.03, 3.2);
        S.motes.splice(mi, 1);
      }
    }

    // ── burning ground left by flares (Cinder Trail)
    for (var ci = S.cinders.length - 1; ci >= 0; ci--) {
      var cd3 = S.cinders[ci];
      cd3.life -= dt;
      if (cd3.life <= 0) { S.cinders.splice(ci, 1); continue; }
      for (var cs = S.shades.length - 1; cs >= 0; cs--) {
        var sh = S.shades[cs];
        if (dist2(sh.x, sh.y, cd3.x, cd3.y) < cd3.r * cd3.r) {
          sh.hp -= 4.5 * dt;
          sh.hit = Math.max(sh.hit, 0.1);
          if (sh.hp <= 0) killShade(cs);
        }
      }
    }

    // deposit — everything you are carrying goes on at once
    if (k.carry && fd < D.depositR) {
      var loads = k.carry;
      k.carry = 0;
      var gain = D.logFuel * loads;
      var room = D.maxFuel - S.fuel;
      S.fuel = Math.min(D.maxFuel, S.fuel + gain);
      S.logsBurned += loads;
      addScore(15 * loads, S.fire.x, S.fire.y - 46, 'rgba(255,176,58,0.95)');
      floatText(S.fire.x, S.fire.y - 26, '+' + Math.round(Math.min(gain, Math.max(room, 0))) + ' fire', 'rgba(255,232,140,0.95)', 16);
      S.fire.flare = Math.max(S.fire.flare, 0.75);
      S.shake = Math.max(S.shake, 3.5);
      SFX.feed(); buzz(14);
      for (var e = 0; e < 16; e++) ember(S.fire.x, S.fire.y - 6);
      spark(S.fire.x, S.fire.y - 6, 12, 'gold', 130, 0.7);

      // Pyre — every fourth log goes up properly
      if (u('pyre')) {
        S.pyreCount += loads;
        while (S.pyreCount >= 4) {
          S.pyreCount -= 4;
          S.fire.flare = 1.2;
          S.shake = Math.max(S.shake, 10);
          spark(S.fire.x, S.fire.y, 30, 'gold', 260, 0.7);
          burst(S.fire.x, S.fire.y, D.flareR * 1.25, 5, 0);
          floatText(S.fire.x, S.fire.y - 62, 'PYRE', 'rgba(255,120,20,0.95)', 20);
          SFX.flare();
        }
      }
    }

    // ── shades
    S.spawnT -= dt;
    var interval = Math.max(0.46, 1.95 - S.night * 0.135);
    if (S.spawnT <= 0 && S.shades.length < 32) {
      spawnShade();
      S.spawnT = interval * rand(0.7, 1.3);
    }

    var drain = (K.baseDrain + (S.night - 1) * K.drainPerNight) * D.drainMul;
    for (var j = S.shades.length - 1; j >= 0; j--) {
      var s = S.shades[j];
      s.wob += dt * s.t.wob;
      s.hit = Math.max(0, s.hit - dt);

      var li = lightAt(s.x, s.y);
      s.hp -= li * s.t.burn * D.burnMul * dt;
      if (s.hp <= 0) { killShade(j); continue; }

      var sd = dist(s.x, s.y, S.fire.x, S.fire.y);
      if (sd < K.fireCoreR + 8) {
        s.latched = 1;
        drain += s.t.drain;
      } else {
        s.latched = 0;
        var ang = Math.atan2(S.fire.y - s.y, S.fire.x - s.x);
        var slow = 1 - 0.6 * li;
        var wob = Math.sin(s.wob) * s.t.sway;
        s.x += Math.cos(ang + wob) * s.spd * slow * dt;
        s.y += Math.sin(ang + wob) * s.spd * slow * dt;
      }

      // knockback
      s.x += s.kx * dt; s.y += s.ky * dt;
      s.kx *= Math.pow(0.02, dt); s.ky *= Math.pow(0.02, dt);

      // touching a shade costs you health — but never your footing
      if (k.guard <= 0 && dist2(s.x, s.y, k.x, k.y) < (s.r + K.keeperR) * (s.r + K.keeperR)) {
        k.guard = D.iframe;
        var ka = Math.atan2(k.y - s.y, k.x - s.x);
        s.kx = -Math.cos(ka) * 210; s.ky = -Math.sin(ka) * 210;   // it recoils, you stand firm
        S.health -= D.hitDamage;
        S.damageTaken += D.hitDamage;
        S.shake = Math.max(S.shake, 9);
        SFX.hurt(); buzz([12, 40, 12]);
        floatText(k.x, k.y - 42, '-' + D.hitDamage, 'rgba(255,69,58,0.98)', 19);
        S.heat = 0; S.heatT = 0;
        if (k.carry > 0) {                    // you fumble one, not the armful
          k.carry--;
          var da = ka + rand(-1.1, 1.1);      // flung back past the shade
          var dd = D.pickupR + rand(26, 52);
          S.logs.push({
            x: clamp(k.x - Math.cos(da) * dd, 30, W - 30),
            y: clamp(k.y - Math.sin(da) * dd, 90, H - 40),
            a: rand(0, 3.14), pop: 0, cool: 0.7, fly: 0, vx: 0, vy: 0
          });
        }
        if (S.health <= 0) { S.health = 0; gameOver('fell'); return; }
      }
    }

    // ── fuel + night clock
    var wasLow = S.fuel <= 20;
    S.fuel -= drain * dt;
    S.score += dt * 6 * D.scoreMul;

    if (S.fuel <= 20 && !wasLow) SFX.low();
    if (S.fuel <= 0) {
      if (u('emberheart') && !S.revived) {
        S.revived = true;
        S.fuel = 35;
        S.fire.flare = 1.4;
        S.shake = 16;
        S.shades.length = 0;
        spark(S.fire.x, S.fire.y, 44, 'gold', 260, 1.1);
        floatText(S.fire.x, S.fire.y - 70, 'IT CATCHES', 'rgba(255,120,20,0.98)', 22);
        toast('Ember Heart', 'The fire takes again');
        SFX.dawn(); buzz([40, 60, 40]);
      } else {
        S.fuel = 0; gameOver('dark'); return;
      }
    }

    S.nightT += dt;
    if (S.nightT >= K.nightLen) breakOfDawn();
  }

  function breakOfDawn() {
    S.mode = 'dawn';
    S.dawnHold = 2.2;
    S.score += 120 * S.night * D.scoreMul;
    S.fuel = Math.min(D.maxFuel, S.fuel + D.dawnFuel);
    S.health = Math.min(D.maxHealth, S.health + D.dawnHeal);
    S.shake = 6;
    for (var i = S.shades.length - 1; i >= 0; i--) {
      spark(S.shades[i].x, S.shades[i].y, 8, 'shade', 190, 0.6);
    }
    S.shades.length = 0;
    S.night++;
    S.nightT = 0;
    SFX.dawn(); buzz([18, 60, 18]);
    nextTune();
    var omen = S.night === 3 ? 'Something quicker is out there'
             : S.night === 5 ? 'Husks walk tonight — light alone will not hold them'
             : 'Night ' + S.night + ' begins';
    toast('Dawn', omen);
  }

  // ────────────────────────────────────────────────────────────── render
  function render() {
    var ox = 0, oy = 0;
    if (S.shake > 0.2) { ox = rand(-S.shake, S.shake) * 0.5; oy = rand(-S.shake, S.shake) * 0.5; }

    ctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR);
    ctx.clearRect(-20, -20, W + 40, H + 40);
    ctx.drawImage(groundCvs, 0, 0, W, H);

    drawCinders();
    drawLogs();
    drawFire();
    drawShades();
    drawKeeper();

    drawDarkness();
    drawGlow();
    drawParticles();
    drawMotes();
    drawFloats();
    drawStick();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function drawLogs() {
    for (var i = 0; i < S.logs.length; i++) {
      var l = S.logs[i];
      var sc = 0.6 + 0.4 * l.pop;
      var li = lightAt(l.x, l.y);
      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.a);
      ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.ellipse(0, 6, 16, 5, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = 'rgb(' + Math.round(56 + li * 78) + ',' + Math.round(38 + li * 50) + ',' + Math.round(24 + li * 26) + ')';
      roundRect(-16, -6, 32, 12, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(20,12,8,0.75)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(-6, 6); ctx.moveTo(5, -6); ctx.lineTo(5, 6); ctx.stroke();
      ctx.fillStyle = 'rgba(' + Math.round(120 + li * 90) + ',' + Math.round(92 + li * 60) + ',60,0.9)';
      ctx.beginPath(); ctx.ellipse(-15, 0, 3, 5.5, 0, 0, 6.29); ctx.fill();
      ctx.restore();
    }
  }

  function drawCinders() {
    if (!S.cinders.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.cinders.length; i++) {
      var c = S.cinders[i];
      var t = clamp(c.life / c.max, 0, 1);
      var g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
      g.addColorStop(0, 'rgba(255,150,40,' + (0.30 * t).toFixed(3) + ')');
      g.addColorStop(0.6, 'rgba(220,80,20,' + (0.16 * t).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(160,40,10,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.29); ctx.fill();
      if (Math.random() < 0.25) ember(c.x + rand(-c.r * 0.6, c.r * 0.6), c.y);
    }
    ctx.restore();
  }

  function drawMotes() {
    if (!S.motes.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.motes.length; i++) {
      var m = S.motes[i];
      var pulse = 0.7 + 0.3 * Math.sin(S.time * 9 + i);
      var fade = clamp(m.life / 1.6, 0, 1);
      var g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 16 * pulse);
      g.addColorStop(0, 'rgba(255,236,150,' + (0.95 * fade).toFixed(3) + ')');
      g.addColorStop(0.35, 'rgba(255,176,58,' + (0.5 * fade).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,140,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x, m.y, 16 * pulse, 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  function drawFloats() {
    if (!S.floats.length) return;
    ctx.save();
    ctx.textAlign = 'center';
    for (var i = 0; i < S.floats.length; i++) {
      var f = S.floats[i];
      var t = clamp(f.life / f.max, 0, 1);
      var rise = (1 - t) * 8;
      ctx.globalAlpha = t < 0.35 ? t / 0.35 : 1;
      ctx.font = '700 ' + f.size + 'px ' + "-apple-system, 'SF Pro Text', system-ui, sans-serif";
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillText(f.txt, f.x, f.y - rise + 1.5);
      ctx.fillStyle = f.col;
      ctx.fillText(f.txt, f.x, f.y - rise);
    }
    ctx.restore();
  }

  function drawFire() {
    var f = S.fire;
    var lvl = S.fuel / D.maxFuel;
    var t = S.time;
    var pulse = 1 + Math.sin(t * 9) * 0.06 + Math.sin(t * 3.3) * 0.04 + S.fire.flare * 0.5;
    var h = (16 + lvl * 40) * pulse;

    // coals
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(f.x, f.y + 12, 40, 13, 0, 0, 6.29); ctx.fill();
    for (var i = 0; i < 7; i++) {
      var a = i * 0.9 + 0.4;
      var cg = 0.35 + 0.45 * lvl + Math.sin(t * 4 + i) * 0.12;
      ctx.fillStyle = 'rgba(' + Math.round(150 + 100 * cg) + ',' + Math.round(50 + 40 * cg) + ',20,' + clamp(cg, 0.12, 0.9) + ')';
      ctx.beginPath();
      ctx.ellipse(f.x + Math.cos(a) * 17, f.y + 8 + Math.sin(a) * 6, 7, 4, a, 0, 6.29);
      ctx.fill();
    }
    ctx.restore();

    if (lvl <= 0.001) return;

    // flame body — additive, three tapering tongues
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var tips = [
      { w: 25, h: 1.00, sp: 4.4, sw: 5.5, top: 'rgba(255,120,20,0.00)', mid: 'rgba(226,96,26,0.50)', hot: 'rgba(255,150,40,0.34)' },
      { w: 17, h: 0.74, sp: 6.7, sw: 4.0, top: 'rgba(255,190,60,0.00)', mid: 'rgba(255,168,32,0.62)', hot: 'rgba(255,206,90,0.48)' },
      { w: 9.5, h: 0.48, sp: 9.1, sw: 2.6, top: 'rgba(255,244,190,0.00)', mid: 'rgba(255,240,180,0.85)', hot: 'rgba(255,252,232,0.92)' }
    ];
    for (var L = 0; L < tips.length; L++) {
      var T = tips[L];
      var w = T.w * pulse * (0.55 + lvl * 0.55);
      var hh = h * T.h;
      var sway = Math.sin(t * T.sp + L * 1.7) * T.sw;
      var flick = 1 + Math.sin(t * (T.sp * 2.3) + L) * 0.07;
      var base = f.y + 9;
      var tipY = base - hh * flick;

      var fg = ctx.createLinearGradient(f.x, base, f.x, tipY);
      fg.addColorStop(0, T.hot);
      fg.addColorStop(0.42, T.mid);
      fg.addColorStop(1, T.top);

      ctx.beginPath();
      ctx.moveTo(f.x - w, base);
      // left edge sweeps in toward the tip
      ctx.bezierCurveTo(f.x - w * 0.98, base - hh * 0.36,
                        f.x - w * 0.42 + sway * 0.7, base - hh * 0.68,
                        f.x + sway, tipY);
      // right edge back down
      ctx.bezierCurveTo(f.x + w * 0.42 + sway * 0.7, base - hh * 0.68,
                        f.x + w * 0.98, base - hh * 0.36,
                        f.x + w, base);
      ctx.quadraticCurveTo(f.x, base + 5, f.x - w, base);
      ctx.closePath();
      ctx.fillStyle = fg;
      ctx.fill();
    }
    ctx.restore();
  }

  // ── the knight ─────────────────────────────────────────────────────────
  // Drawn from scratch so the same routine paints both the sprite in play
  // and the portrait on the camp screen.
  var PLUMES = [
    { id: 'crimson', name: 'Crimson', plume: '#FF6B6B', tabard: '#B34A3D', trim: '#FFD9A0' },
    { id: 'ember',   name: 'Ember',   plume: '#FF9F0A', tabard: '#C0894A', trim: '#FFE9C0' },
    { id: 'moss',    name: 'Moss',    plume: '#95A86B', tabard: '#5E7346', trim: '#DDE8C4' },
    { id: 'dusk',    name: 'Dusk',    plume: '#8E86FF', tabard: '#4A4478', trim: '#DDD9FF' },
    { id: 'tide',    name: 'Tide',    plume: '#5AC8FA', tabard: '#2F6D86', trim: '#D6F1FF' },
    { id: 'rose',    name: 'Rose',    plume: '#FF9FC4', tabard: '#8E4468', trim: '#FFE0EE' }
  ];
  // Two builds. Both are meant to be likeable — the lass is rounder and
  // softer-featured, the lad squarer and scruffier, neither is the "serious"
  // one.
  var BUILDS = [
    { id: 'lad',  name: 'Lad',  waist: 1.06, head: 9.3, brow: 1,   lash: 0, jaw: 1.1, eye: 2.3, plume: 0.9 },
    { id: 'lass', name: 'Lass', waist: 0.9,  head: 9.7, brow: 0.5, lash: 1, jaw: 0.85, eye: 2.6, plume: 1.15 }
  ];
  var HELMS = [
    { id: 'dome',    name: 'Dome' },
    { id: 'horned',  name: 'Horned' },
    { id: 'winged',  name: 'Winged' },
    { id: 'hood',    name: 'Hood' },
    { id: 'circlet', name: 'Circlet' }
  ];
  var CAPES = [
    { id: 'none',  name: 'None' },
    { id: 'short', name: 'Short' },
    { id: 'long',  name: 'Long' }
  ];
  var ARMOURS = [
    { id: 'steel',  name: 'Steel',  light: '#CBD2DB', dark: '#94A1AF' },
    { id: 'bronze', name: 'Bronze', light: '#D9AE7A', dark: '#9C7546' },
    { id: 'iron',   name: 'Iron',   light: '#9AA0A8', dark: '#63696F' },
    { id: 'ivory',  name: 'Ivory',  light: '#EDE3D2', dark: '#B9AB93' }
  ];
  function pickFrom(list, want, dflt) {
    for (var i = 0; i < list.length; i++) if (list[i].id === want) return list[i];
    return dflt || list[0];
  }
  function buildOf()  { return pickFrom(BUILDS,  META.knight && META.knight.build); }
  function helmOf()   { return pickFrom(HELMS,   META.knight && META.knight.helm); }
  function capeOf()   { return pickFrom(CAPES,   META.knight && META.knight.cape); }
  function armourOf() { return pickFrom(ARMOURS, META.knight && META.knight.armour); }

  function plumeOf() {
    var want = META.knight && META.knight.plume;
    for (var i = 0; i < PLUMES.length; i++) if (PLUMES[i].id === want) return PLUMES[i];
    return PLUMES[0];
  }
  var TITLES = [
    [1, 'Squire'], [2, 'Ember Squire'], [3, 'Knight of the Watch'], [5, 'Knight of the Ember'],
    [7, 'Warden of the Flame'], [10, 'Keeper of the Long Night'], [14, 'Dawnbringer']
  ];
  function knightTitle() {
    var lv = keeperLevel(), out = TITLES[0][1];
    for (var i = 0; i < TITLES.length; i++) if (lv >= TITLES[i][0]) out = TITLES[i][1];
    return out;
  }
  function knightName() {
    return (META.knight && META.knight.name) ? META.knight.name : 'the Keeper';
  }

  // opts: { t, scale, flash, expr, amt, tilt, hop, squash, wave, reach, zzz, sit, spin, look }
  function drawKnight(g, o) {
    var P = plumeOf(), B = buildOf(), H = helmOf(), C = capeOf(), AR = armourOf();
    var sc = o.scale || 1;
    var skin  = o.flash ? '#FFD3CF' : '#F7E0C4';
    var skinS = o.flash ? '#E9B4B0' : '#E2C29F';
    var steel = o.flash ? '#FFD9D6' : AR.light;
    var dark  = o.flash ? '#E0A9A6' : AR.dark;
    var hop = o.hop || 0, sit = o.sit || 0;
    var lookX = (o.look || 0) * 1.5;
    // how strongly he is pulling the face — most of the time, not all the way
    var amt = o.amt === undefined ? 1 : clamp(o.amt, 0, 1);
    var W = B.waist;

    g.save();
    g.scale(sc, sc);

    g.fillStyle = 'rgba(0,0,0,' + Math.max(0.12, 0.42 - hop * 0.03).toFixed(3) + ')';
    g.beginPath(); g.ellipse(0, 14, 10.5 - hop * 0.42, 3.5 - hop * 0.12, 0, 0, 6.29); g.fill();

    g.translate(0, -hop + sit * 4);
    if (o.tilt) g.rotate(o.tilt);
    if (o.spin) g.scale(Math.cos(o.spin), 1);
    var sq = o.squash || 0;
    g.scale(1 + sq, 1 - sq);

    // ── cape, behind everything
    if (C.id !== 'none') {
      var cl = C.id === 'long' ? 15 : 9.5;
      g.fillStyle = P.plume;              // the plume colour, so it reads against the tabard
      g.globalAlpha = 0.85;
      g.beginPath();
      g.moveTo(-6.5, -3);
      g.quadraticCurveTo(-9.5 - Math.sin((o.t || 0) * 2) * 0.8, cl * 0.5, -6, cl);
      g.quadraticCurveTo(0, cl + 2.4, 6, cl);
      g.quadraticCurveTo(9.5 + Math.sin((o.t || 0) * 2) * 0.8, cl * 0.5, 6.5, -3);
      g.closePath(); g.fill();
      g.globalAlpha = 1;
      g.strokeStyle = P.trim; g.lineWidth = 0.8; g.globalAlpha = 0.5;
      g.stroke(); g.globalAlpha = 1;
    }

    // ── little boots
    g.fillStyle = '#5E4C3E';
    roundRectOn(g, -6.4 * W, 9.6 - sit * 2, 5.2, 4.6, 2.2); g.fill();
    roundRectOn(g, 1.2 * W, 9.6 - sit * 2, 5.2, 4.6, 2.2); g.fill();

    // ── body
    g.fillStyle = dark;
    roundRectOn(g, -7.8 * W, -2.6, 15.6 * W, 13.4, 6.8); g.fill();
    g.fillStyle = P.tabard;
    g.beginPath();
    g.moveTo(-5.4 * W, -2.2); g.lineTo(5.4 * W, -2.2); g.lineTo(4.5 * W, 8.6);
    g.quadraticCurveTo(0, 11.2, -4.5 * W, 8.6);
    g.closePath(); g.fill();
    g.fillStyle = P.trim; g.globalAlpha = 0.85;
    roundRectOn(g, -5.4 * W, 0.6, 10.8 * W, 1.1, 0.5); g.fill();
    g.globalAlpha = 1;

    // ── arms
    var reach = o.reach || 0, wave = o.wave || 0;
    g.fillStyle = steel;
    g.save();
    g.translate(-8.2 * W, 2.2); g.rotate(-0.2 - reach * 0.5);
    g.beginPath(); g.ellipse(0, 0, 2.6, 3.6, 0, 0, 6.29); g.fill();
    g.restore();
    g.save();
    g.translate(7.8 * W, 2);
    var lift = Math.max(wave, reach);
    g.rotate(0.2 - wave * (1.3 + Math.sin((o.t || 0) * 13) * 0.35) - reach * 1.55);
    g.beginPath(); g.ellipse(0, 0, 2.6, 3.4, 0, 0, 6.29); g.fill();
    if (lift > 0.05) {
      g.beginPath(); g.ellipse(0, -3.6 * lift, 2.3, 3.4, 0, 0, 6.29); g.fill();
      g.fillStyle = skin;
      g.beginPath(); g.arc(0, -6.6 * lift, 1.9, 0, 6.29); g.fill();
      g.fillStyle = steel;
    }
    g.restore();

    // shield
    g.save();
    g.translate(-10.4 * W, 3.4); g.rotate(-0.3 - reach * 0.4);
    g.fillStyle = dark;
    g.beginPath(); g.ellipse(0, 0, 5.6, 6.6, 0, 0, 6.29); g.fill();
    g.fillStyle = P.tabard;
    g.beginPath(); g.ellipse(0, 0, 3.8, 4.6, 0, 0, 6.29); g.fill();
    g.fillStyle = P.trim;
    g.beginPath(); g.arc(0, 0, 1.5, 0, 6.29); g.fill();
    g.restore();

    // ── head
    var hr = B.head;
    g.fillStyle = skin;
    g.beginPath(); g.arc(0, -10.2, hr, 0, 6.29); g.fill();
    g.fillStyle = skinS;
    g.beginPath(); g.ellipse(0, -3.6, 6.4 * B.jaw, 2.2, 0, 0, Math.PI); g.fill();

    // ── the face
    var ex = 3.7, ey = -10.4, s, e = o.expr || 'normal';
    var ink = '#3A2E30';
    g.strokeStyle = ink; g.fillStyle = ink; g.lineCap = 'round';

    function eyeArc(cx, up) {
      g.lineWidth = 1.7;
      var r = 2.3 * (0.6 + 0.4 * amt);
      g.beginPath();
      if (up) g.arc(cx, ey + 1.1, r, Math.PI * 1.12, Math.PI * 1.88);
      else    g.arc(cx, ey - 1.1, r, Math.PI * 0.12, Math.PI * 0.88);
      g.stroke();
    }
    function eyeBall(cx, r, ry) {
      g.fillStyle = ink;
      g.beginPath(); g.ellipse(cx + lookX, ey, r, ry || r, 0, 0, 6.29); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.92)';
      g.beginPath(); g.arc(cx + lookX - r * 0.34, ey - r * 0.42, r * 0.36, 0, 6.29); g.fill();
      g.fillStyle = ink;
      if (B.lash) {                              // a couple of lashes, not a fan
        g.strokeStyle = ink; g.lineWidth = 1;
        g.beginPath();
        g.moveTo(cx + (cx < 0 ? -1 : 1) * r * 0.9, ey - r * 0.9);
        g.lineTo(cx + (cx < 0 ? -1 : 1) * (r * 1.7), ey - r * 1.5);
        g.stroke();
      }
    }

    var eyeR = B.eye;
    if (e === 'happy' || e === 'content') {
      if (amt < 0.45) { eyeBall(-ex, eyeR * 0.95, eyeR * 1.05); eyeBall(ex, eyeR * 0.95, eyeR * 1.05); }
      else { eyeArc(-ex, true); eyeArc(ex, true); }
    } else if (e === 'blink') {
      g.lineWidth = 1.7;
      for (s = -1; s <= 1; s += 2) { g.beginPath(); g.moveTo(s * ex - 1.7, ey); g.lineTo(s * ex + 1.7, ey); g.stroke(); }
    } else if (e === 'sleepy') {
      eyeArc(-ex, false); eyeArc(ex, false);
    } else if (e === 'surprised') {
      eyeBall(-ex, eyeR * (1 + 0.25 * amt), eyeR * (1.1 + 0.3 * amt));
      eyeBall(ex, eyeR * (1 + 0.25 * amt), eyeR * (1.1 + 0.3 * amt));
    } else if (e === 'shy') {
      eyeArc(-ex, true); eyeArc(ex, true);
    } else if (e === 'grumble') {
      eyeBall(-ex, eyeR * 0.8, eyeR * (0.75 - 0.2 * amt));
      eyeBall(ex, eyeR * 0.8, eyeR * (0.75 - 0.2 * amt));
      g.strokeStyle = ink; g.lineWidth = 1.5 * B.brow;
      g.beginPath(); g.moveTo(-ex - 2.4, ey - 5); g.lineTo(-ex + 1.6, ey - 3.4 - amt * 0.8); g.stroke();
      g.beginPath(); g.moveTo(ex + 2.4, ey - 5); g.lineTo(ex - 1.6, ey - 3.4 - amt * 0.8); g.stroke();
    } else {
      eyeBall(-ex, eyeR, eyeR * 1.12); eyeBall(ex, eyeR, eyeR * 1.12);
    }

    // brows on the lad, faint and only when he means it
    if (B.brow > 0.8 && amt > 0.5 && (e === 'surprised' || e === 'happy')) {
      g.strokeStyle = ink; g.lineWidth = 1.2; g.globalAlpha = 0.5;
      var bl = e === 'surprised' ? 5.6 : 4.8;
      g.beginPath(); g.moveTo(-ex - 2, ey - bl); g.lineTo(-ex + 1.8, ey - bl - 0.4); g.stroke();
      g.beginPath(); g.moveTo(ex + 2, ey - bl); g.lineTo(ex - 1.8, ey - bl - 0.4); g.stroke();
      g.globalAlpha = 1;
    }

    // mouth — scales with how much he means it
    g.strokeStyle = ink; g.fillStyle = ink; g.lineWidth = 1.5;
    var my = -4.6;
    if (e === 'happy' && amt > 0.55) {
      g.beginPath(); g.arc(0, my - 0.6, 1.6 + amt * 1.1, 0.15, Math.PI - 0.15); g.fill();
      g.fillStyle = '#C97C86';
      g.beginPath(); g.arc(0, my + 0.5, 0.8 + amt * 0.7, 0.1, Math.PI - 0.1); g.fill();
    } else if (e === 'surprised') {
      g.fillStyle = ink;
      g.beginPath(); g.ellipse(0, my, 0.9 + amt * 0.7, 1.1 + amt * 0.9, 0, 0, 6.29); g.fill();
    } else if (e === 'grumble') {
      g.beginPath(); g.arc(0, my + 2.4, 1.5 + amt * 0.9, Math.PI * 1.25, Math.PI * 1.75); g.stroke();
    } else if (e === 'sleepy') {
      g.beginPath(); g.ellipse(0, my, 0.7 + amt * 0.4, 0.9 + amt * 0.5, 0, 0, 6.29); g.fill();
    } else {
      g.beginPath(); g.arc(0, my - 1, 1.5 + amt * 0.8, 0.35, Math.PI - 0.35); g.stroke();
    }

    if (e === 'happy' || e === 'content' || e === 'shy' || e === 'surprised') {
      var ba = (e === 'shy' ? 0.55 : 0.42) * (0.35 + 0.65 * amt);
      g.fillStyle = 'rgba(255,' + (e === 'shy' ? 120 : 140) + ',150,' + ba.toFixed(3) + ')';
      g.beginPath(); g.ellipse(-6.6, -6.6, 2.4, 1.5, 0, 0, 6.29); g.fill();
      g.beginPath(); g.ellipse(6.6, -6.6, 2.4, 1.5, 0, 0, 6.29); g.fill();
    }

    // ── headgear
    g.fillStyle = steel;
    if (H.id === 'hood') {
      g.fillStyle = P.tabard;
      g.beginPath(); g.arc(0, -11, hr + 1.9, Math.PI * 0.98, Math.PI * 2.02); g.fill();
      g.beginPath();
      g.moveTo(-hr - 1.9, -11); g.quadraticCurveTo(-hr - 3, -3, -hr + 1.5, -2);
      g.lineTo(-hr + 1.5, -6); g.closePath(); g.fill();
      g.beginPath();
      g.moveTo(hr + 1.9, -11); g.quadraticCurveTo(hr + 3, -3, hr - 1.5, -2);
      g.lineTo(hr - 1.5, -6); g.closePath(); g.fill();
    } else if (H.id === 'circlet') {
      g.fillStyle = P.trim;
      roundRectOn(g, -hr - 0.6, -15.4, (hr + 0.6) * 2, 2.4, 1.2); g.fill();
      g.beginPath(); g.moveTo(0, -19.4); g.lineTo(2.2, -15.2); g.lineTo(-2.2, -15.2); g.closePath(); g.fill();
    } else {
      g.beginPath();
      g.arc(0, -11.4, hr + 0.7, Math.PI, 0);
      g.lineTo(hr + 0.7, -13.4); g.lineTo(-hr - 0.7, -13.4);
      g.closePath(); g.fill();
      g.fillStyle = dark;
      roundRectOn(g, -hr - 1.1, -14.6, (hr + 1.1) * 2, 2.9, 1.4); g.fill();
      g.fillStyle = steel;
      roundRectOn(g, -hr - 1.4, -13.4, 3.1, 8.2, 1.5); g.fill();
      roundRectOn(g, hr - 1.7, -13.4, 3.1, 8.2, 1.5); g.fill();
      g.fillStyle = P.trim;
      g.beginPath(); g.arc(0, -13.2, 1, 0, 6.29); g.fill();

      if (H.id === 'horned') {
        g.fillStyle = '#EFE6D2';
        for (s = -1; s <= 1; s += 2) {
          g.beginPath();
          g.moveTo(s * (hr - 1), -17.6);
          g.quadraticCurveTo(s * (hr + 5.4), -19.6, s * (hr + 4.2), -24.4);
          g.quadraticCurveTo(s * (hr + 2.2), -20.6, s * (hr - 1.4), -19.6);
          g.closePath(); g.fill();
        }
      } else if (H.id === 'winged') {
        g.fillStyle = '#EFE6D2';
        for (s = -1; s <= 1; s += 2) {
          g.beginPath();
          g.moveTo(s * (hr - 1.4), -17);
          g.quadraticCurveTo(s * (hr + 6.6), -19.4, s * (hr + 7.4), -14.2);
          g.quadraticCurveTo(s * (hr + 3), -16.2, s * (hr - 1.4), -15.2);
          g.closePath(); g.fill();
        }
      }
    }

    // ── plume
    if (H.id !== 'circlet') {
      g.fillStyle = P.plume;
      var pl = B.plume;
      var sway = Math.sin((o.t || 0) * 4) * 0.13 + (o.tilt || 0) * -0.7;
      g.save();
      g.translate(0, H.id === 'hood' ? -19 : -21.2);
      g.rotate(sway);
      g.scale(pl, pl);
      g.beginPath();
      g.moveTo(0, 2.4);
      g.quadraticCurveTo(-6, -2.4, -2.6, -10);
      g.quadraticCurveTo(0.7, -4.8, 3.7, -8.6);
      g.quadraticCurveTo(4.6, -1.6, 0, 2.4);
      g.closePath(); g.fill();
      g.restore();
    }

    if (o.zzz) {
      g.font = '700 7px -apple-system, system-ui, sans-serif';
      for (var z = 0; z < 3; z++) {
        var zt = ((o.t || 0) * 0.45 + z * 0.33) % 1;
        g.globalAlpha = (1 - zt) * o.zzz;
        g.fillStyle = 'rgba(232,220,200,0.75)';
        g.fillText('z', 9 + zt * 7, -20 - zt * 13);
      }
      g.globalAlpha = 1;
    }

    g.restore();
  }

  function roundRectOn(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawKeeper() {
    var k = S.keeper;
    var moving = Math.hypot(k.vx, k.vy) > 30;
    var bob = Math.sin(S.time * 9) * (moving ? 1.7 : 0.5);
    ctx.save();
    ctx.translate(k.x, k.y + bob);

    // the brand, held out to the side or mid-swing
    var bAng = k.swing > 0
      ? k.swingDir - D.brandArc / 2 + D.brandArc * (1 - k.swing / D.swingDur)
      : k.face + 1.1;
    var bLen = k.swing > 0 ? 26 : 17;
    ctx.save();
    ctx.rotate(bAng);
    ctx.strokeStyle = '#6B4A2C';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(bLen, 0); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,170,50,0.95)';
    ctx.beginPath(); ctx.arc(bLen + 2, 0, k.swing > 0 ? 4.6 : 3.4, 0, 6.29); ctx.fill();
    ctx.restore();

    drawKnight(ctx, {
      t: S.time,
      scale: 1.32,
      expr: k.guard > 0 ? 'surprised' : (k.carry >= D.carry ? 'happy' : 'normal'),
      flash: k.guard > 0 && Math.floor(S.time * 18) % 2 === 0
    });

    // carried logs, stacked over the helmet
    for (var ci = 0; ci < k.carry; ci++) {
      ctx.save();
      ctx.translate(0, -38 - ci * 9);
      ctx.rotate(Math.sin(S.time * 5 + ci * 0.8) * 0.09);
      ctx.fillStyle = ci % 2 ? '#7A5433' : '#6B4A2C';
      roundRect(-11.5, -4, 23, 8, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(20,12,8,0.7)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-3.5, -4); ctx.lineTo(-3.5, 4); ctx.stroke();
      ctx.fillStyle = 'rgba(190,150,90,0.85)';
      ctx.beginPath(); ctx.ellipse(-11, 0, 2.4, 4, 0, 0, 6.29); ctx.fill();
      ctx.restore();
    }

    // lantern arm
    var lx = Math.cos(k.face) * 13, ly = Math.sin(k.face) * 8 + 1;
    ctx.strokeStyle = 'rgba(232,220,200,0.5)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.fillStyle = '#FFD60A';
    ctx.beginPath(); ctx.arc(lx, ly, 3.4, 0, 6.29); ctx.fill();

    ctx.restore();
  }

  function drawShades() {
    for (var i = 0; i < S.shades.length; i++) {
      var s = S.shades[i];
      var li = lightAt(s.x, s.y);
      var hpF = clamp(s.hp / s.maxHp, 0, 1);
      var wob = Math.sin(s.wob) * (s.kind === 'wisp' ? 3 : 1.6);
      ctx.save();
      ctx.translate(s.x, s.y);

      // body — a torn wisp of dark
      ctx.globalAlpha = 0.55 + 0.45 * hpF;
      var grd = ctx.createRadialGradient(0, 0, 1, 0, 0, s.r * 1.7);
      var tint = s.hit > 0 ? '90,40,60' : s.t.tint;
      grd.addColorStop(0, 'rgba(' + tint + ',0.98)');
      grd.addColorStop(0.6, 'rgba(' + tint + ',0.55)');
      grd.addColorStop(1, 'rgba(10,6,14,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(-s.r + wob * 0.3, s.r * 0.5);
      ctx.quadraticCurveTo(-s.r * 1.1, -s.r * 0.9, wob, -s.r * 1.25);
      ctx.quadraticCurveTo(s.r * 1.1, -s.r * 0.9, s.r + wob * 0.3, s.r * 0.5);
      ctx.quadraticCurveTo(s.r * 0.4, s.r * 1.3 + wob, 0, s.r * 0.9);
      ctx.quadraticCurveTo(-s.r * 0.4, s.r * 1.3 - wob, -s.r + wob * 0.3, s.r * 0.5);
      ctx.closePath();
      ctx.fill();

      // burning-away shimmer — a scorched rim, so the body stays dark.
      // A husk shrugs most of it off, which is the visual tell that it will last.
      if (li > 0.12) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = li * 0.62 * (s.t.burn / 5.2);
        ctx.strokeStyle = 'rgba(255,150,40,0.75)';
        ctx.lineWidth = 2.2 + Math.sin(S.time * 14 + s.wob) * 0.7;
        ctx.beginPath(); ctx.arc(0, 0, s.r * 1.02, 0, 6.29); ctx.stroke();
        ctx.globalAlpha = li * 0.16 * (s.t.burn / 5.2);
        ctx.fillStyle = 'rgba(255,159,10,0.6)';
        ctx.beginPath(); ctx.arc(0, 0, s.r * 1.02, 0, 6.29); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }

      // husks carry a cracked ember core that dims as they take damage
      if (s.kind === 'husk') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + 0.4 * hpF;
        ctx.strokeStyle = 'rgba(255,120,20,0.85)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-5, -7); ctx.lineTo(-1.5, -1); ctx.lineTo(-5.5, 3.5);
        ctx.moveTo(4.5, -6); ctx.lineTo(1.5, 1.5); ctx.lineTo(5, 7);
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.restore();
    }
  }

  // darkness mask: black sheet with the light punched out
  function drawDarkness() {
    var lr = lightRadius();
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.fillStyle = 'rgba(3,2,6,0.93)';
    dctx.clearRect(0, 0, W, H);
    dctx.fillRect(0, 0, W, H);

    dctx.globalCompositeOperation = 'destination-out';
    // fire light
    var g1 = dctx.createRadialGradient(S.fire.x, S.fire.y, 0, S.fire.x, S.fire.y, lr);
    g1.addColorStop(0, 'rgba(0,0,0,1)');
    g1.addColorStop(0.42, 'rgba(0,0,0,0.94)');
    g1.addColorStop(0.78, 'rgba(0,0,0,0.42)');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g1;
    dctx.beginPath(); dctx.arc(S.fire.x, S.fire.y, lr, 0, 6.29); dctx.fill();
    // lantern
    var k = S.keeper;
    var g2 = dctx.createRadialGradient(k.x, k.y, 0, k.x, k.y, D.lampR);
    g2.addColorStop(0, 'rgba(0,0,0,0.86)');
    g2.addColorStop(0.55, 'rgba(0,0,0,0.44)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g2;
    dctx.beginPath(); dctx.arc(k.x, k.y, D.lampR, 0, 6.29); dctx.fill();

    dctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(darkCvs, 0, 0, W, H);
  }

  // warm additive bloom, drawn on top of the darkness
  function drawGlow() {
    var lr = lightRadius();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    var g = ctx.createRadialGradient(S.fire.x, S.fire.y, 0, S.fire.x, S.fire.y, lr);
    var warm = 0.10 + (S.fuel / D.maxFuel) * 0.16 + S.fire.flare * 0.2;
    g.addColorStop(0, 'rgba(255,176,58,' + (warm * 1.5).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(255,120,30,' + (warm * 0.5).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(S.fire.x, S.fire.y, lr, 0, 6.29); ctx.fill();

    var k = S.keeper;
    var g2 = ctx.createRadialGradient(k.x, k.y, 0, k.x, k.y, D.lampR);
    g2.addColorStop(0, 'rgba(255,214,10,0.15)');
    g2.addColorStop(1, 'rgba(255,214,10,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(k.x, k.y, D.lampR, 0, 6.29); ctx.fill();

    // the swing's burning trail
    var kk = S.keeper;
    if (kk.swing > 0) {
      var p = 1 - kk.swing / D.swingDur;
      var half2 = D.brandArc / 2;
      var from = kk.swingDir - half2;
      var to = from + D.brandArc * p;
      // body of the sweep — fades out behind the leading edge
      var grd = ctx.createRadialGradient(kk.x, kk.y, D.brandR * 0.3, kk.x, kk.y, D.brandR);
      grd.addColorStop(0, 'rgba(255,90,10,0)');
      grd.addColorStop(0.55, 'rgba(255,140,30,0.42)');
      grd.addColorStop(0.85, 'rgba(255,180,60,0.80)');
      grd.addColorStop(1, 'rgba(255,120,20,0)');
      ctx.strokeStyle = grd;
      ctx.lineWidth = D.brandR * 0.44;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(kk.x, kk.y, D.brandR * 0.7, from, to);
      ctx.stroke();

      // hot core of the trail
      ctx.strokeStyle = 'rgba(255,214,110,0.55)';
      ctx.lineWidth = D.brandR * 0.16;
      ctx.beginPath();
      ctx.arc(kk.x, kk.y, D.brandR * 0.78, from, to);
      ctx.stroke();

      // white-hot leading edge, where the brand actually is
      ctx.strokeStyle = 'rgba(255,248,225,' + (0.95 * (1 - p * 0.35)).toFixed(3) + ')';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(kk.x, kk.y, D.brandR * 0.78, Math.max(from, to - 0.30), to);
      ctx.stroke();
      ctx.lineCap = 'butt';
    }

    // flare shockwave
    if (S.keeper.cd > D.flareCd - 0.45) {
      var t = 1 - (S.keeper.cd - (D.flareCd - 0.45)) / 0.45;
      ctx.strokeStyle = 'rgba(255,214,10,' + (0.5 * (1 - t)).toFixed(3) + ')';
      ctx.lineWidth = 6 * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(k.x, k.y, D.flareR * t, 0, 6.29); ctx.stroke();
    }

    // where you are pointed — the arc the brand will actually sweep
    if (META.opts.aim && (S.mode === 'play' || S.mode === 'paused')) {
      var ak = S.keeper;
      var ar = D.brandR * 0.82;
      var half = Math.min(D.brandArc, Math.PI * 1.9) / 2;
      var pulse = 0.5 + 0.5 * Math.sin(S.time * 3);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,196,110,' + (0.16 + 0.08 * pulse).toFixed(3) + ')';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(ak.x, ak.y, ar, ak.face - half, ak.face + half);
      ctx.stroke();
      // a small nose on the arc so the facing reads at a glance
      var nx = ak.x + Math.cos(ak.face) * (ar + 7);
      var ny = ak.y + Math.sin(ak.face) * (ar + 7);
      ctx.fillStyle = 'rgba(255,214,110,' + (0.5 + 0.25 * pulse).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(nx + Math.cos(ak.face) * 5, ny + Math.sin(ak.face) * 5);
      ctx.lineTo(nx + Math.cos(ak.face + 2.4) * 5.5, ny + Math.sin(ak.face + 2.4) * 5.5);
      ctx.lineTo(nx + Math.cos(ak.face - 2.4) * 5.5, ny + Math.sin(ak.face - 2.4) * 5.5);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // your reach — a faint ring so the pickup range is never a guess
    var kp = S.keeper;
    if (S.mode === 'play' || S.mode === 'paused') {
      var full = kp.carry >= D.carry;
      var ringPulse = 0.5 + 0.5 * Math.sin(S.time * 2.4);
      ctx.strokeStyle = full
        ? 'rgba(232,220,200,' + (0.05 + 0.03 * ringPulse).toFixed(3) + ')'
        : 'rgba(255,196,110,' + (0.13 + 0.07 * ringPulse).toFixed(3) + ')';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([5, 7]);
      ctx.beginPath();
      ctx.arc(kp.x, kp.y, D.pickupR, 0, 6.29);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // log glints — a wet-bark catchlight so wood is findable out in the dark
    for (var g3 = 0; g3 < S.logs.length; g3++) {
      var lgg = S.logs[g3];
      var dark = 1 - lightAt(lgg.x, lgg.y);
      var tw = 0.5 + 0.5 * Math.sin(S.time * 2.2 + g3 * 1.9);
      var seen = u('nightsight') ? 0.34 : 0;
      if (lgg.fly) seen += 0.42;
      ctx.fillStyle = 'rgba(255,176,80,' + (0.10 + seen + dark * 0.20 * tw).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(lgg.x, lgg.y, 13 * lgg.pop, 5.5 * lgg.pop, lgg.a, 0, 6.29);
      ctx.fill();
    }

    // something is on the fire — bleed a warning ring off the coals
    var latched = 0;
    for (var q = 0; q < S.shades.length; q++) if (S.shades[q].latched) latched++;
    if (latched) {
      var lp = 0.5 + 0.5 * Math.sin(S.time * 11);
      ctx.strokeStyle = 'rgba(255,69,58,' + (0.14 + 0.2 * lp + latched * 0.05).toFixed(3) + ')';
      ctx.lineWidth = 2 + lp * 2;
      ctx.beginPath();
      ctx.arc(S.fire.x, S.fire.y, K.fireCoreR + 12 + lp * 5, 0, 6.29);
      ctx.stroke();
    }

    // shade eyes — always faintly visible in the dark
    for (var i = 0; i < S.shades.length; i++) {
      var s = S.shades[i];
      var eo = s.t.eyeGap;
      if (u('nightsight')) {
        ctx.strokeStyle = s.t.eye;
        ctx.globalAlpha = 0.30;
        ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.1, 0, 6.29); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = s.t.eye;
      ctx.beginPath(); ctx.arc(s.x - eo, s.y - 2, 1.7, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(s.x + eo, s.y - 2, 1.7, 0, 6.29); ctx.fill();
    }

    // dawn wash
    if (S.mode === 'dawn') {
      var d = clamp(1 - Math.abs(S.dawnHold - 1.1) / 1.1, 0, 1);
      ctx.fillStyle = 'rgba(255,190,110,' + (d * 0.3).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();

    // low-fuel / low-health warning vignette
    var hpFrac = S.health / D.maxHealth;
    if (S.mode === 'play' && (S.fuel < 22 || hpFrac < 0.3)) {
      var danger = Math.max(S.fuel < 22 ? 1 - S.fuel / 22 : 0, hpFrac < 0.3 ? 1 - hpFrac / 0.3 : 0);
      var a = danger * (0.16 + Math.sin(S.time * 6) * 0.08);
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.62);
      vg.addColorStop(0, 'rgba(255,69,58,0)');
      vg.addColorStop(1, 'rgba(255,69,58,' + clamp(a, 0, 0.42).toFixed(3) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.parts.length; i++) {
      var p = S.parts[i];
      var t = clamp(p.life / p.max, 0, 1);
      var col;
      if (p.c === 'ember') col = 'rgba(255,' + Math.round(120 + 100 * t) + ',40,' + (t * 0.85).toFixed(3) + ')';
      else if (p.c === 'gold') col = 'rgba(255,214,10,' + (t * 0.9).toFixed(3) + ')';
      else if (p.c === 'wood') col = 'rgba(190,150,90,' + (t * 0.8).toFixed(3) + ')';
      else col = 'rgba(150,110,220,' + (t * 0.75).toFixed(3) + ')';
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + t * 0.8), 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  function drawStick() {
    if (!stick.on || S.mode !== 'play') return;
    ctx.save();
    ctx.strokeStyle = 'rgba(232,220,200,0.20)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 46, 0, 6.29); ctx.stroke();
    ctx.fillStyle = 'rgba(232,220,200,0.22)';
    ctx.beginPath(); ctx.arc(stick.ox + stick.dx * 40, stick.oy + stick.dy * 40, 17, 0, 6.29); ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();

  // ── his little life ────────────────────────────────────────────────────
  // Nothing here is on a schedule. He picks something, does it for a while
  // he chose, and picks again — and when you bother him he answers with
  // whichever reaction he feels like, not the same one every time.
  var KN = {
    act: 'idle', actT: 2, expr: 'normal', exprT: 0,
    blink: 1.8, hop: 0, tilt: 0, wave: 0, reach: 0, zzz: 0, sit: 0,
    spin: 0, squash: 0, look: 0, lookT: 0,
    hearts: [], props: [], taps: 0, tapT: 0, petting: 0, pet: 0,
    onStage: false, lastReact: '', bounce: 0, danceT: 0,
    amt: 0.5, amtTarget: 0.5
  };

  // weight, and how long he might keep at it
  var KN_ACTS = [
    { id: 'idle',    w: 4,   dur: [1.6, 4.5] },
    { id: 'look',    w: 2.6, dur: [2, 4] },
    { id: 'wave',    w: 1.2, dur: [1.6, 2.6] },
    { id: 'stretch', w: 1.2, dur: [1.4, 2.4] },
    { id: 'doze',    w: 1.3, dur: [3.5, 8] },
    { id: 'hum',     w: 1.6, dur: [3, 6] },
    { id: 'poke',    w: 1.4, dur: [2, 3.5] },
    { id: 'ember',   w: 1.7, dur: [3, 4.5] },
    { id: 'moth',    w: 1.5, dur: [4, 7] },
    { id: 'spin',    w: 0.7, dur: [1, 1.4] },
    { id: 'sit',     w: 1.1, dur: [3, 6] }
  ];

  function knightAct(force) {
    var pool = [], i;
    // dancing only exists on the camp screen, and only when the band is playing
    if (KN.onStage && MUS.timer && Math.random() < 0.42) {
      KN.act = 'dance'; KN.actT = rand(6, 14); KN.props.length = 0; return;
    }
    for (i = 0; i < KN_ACTS.length; i++) {
      if (KN_ACTS[i].id === KN.act) continue;          // never twice in a row
      pool.push(KN_ACTS[i]);
    }
    var total = 0;
    for (i = 0; i < pool.length; i++) total += pool[i].w;
    var roll = Math.random() * total, acc = 0, picked = pool[0];
    for (i = 0; i < pool.length; i++) { acc += pool[i].w; if (roll <= acc) { picked = pool[i]; break; } }
    KN.act = force || picked.id;
    KN.actT = rand(picked.dur[0], picked.dur[1]);
    KN.props.length = 0;
    if (KN.act === 'ember') KN.props.push({ kind: 'ember', x: rand(-6, 6), y: 6, vx: rand(-5, 5), vy: -9, ph: rand(0, 6.28), life: KN.actT });
    if (KN.act === 'moth')  KN.props.push({ kind: 'moth', x: rand(-14, 14), y: -14, ph: rand(0, 6.28), life: KN.actT });
  }

  function knHeart(kind) {
    KN.hearts.push({ x: rand(-7, 7), y: -18, vy: rand(-16, -24), vx: rand(-6, 6),
                     life: 1.5, max: 1.5, kind: kind || 'heart', r: rand(0.8, 1.2) });
  }
  // Idle faces sit around half strength so he mostly just looks like he is
  // thinking about something; reactions push it up.
  function knFeel(expr, secs, amt) {
    KN.expr = expr; KN.exprT = secs;
    KN.amtTarget = amt === undefined ? rand(0.3, 0.6) : amt;
  }

  function updateKnight(dt) {
    var i;
    for (i = KN.hearts.length - 1; i >= 0; i--) {
      var h = KN.hearts[i];
      h.life -= dt;
      if (h.life <= 0) { KN.hearts.splice(i, 1); continue; }
      h.y += h.vy * dt; h.x += h.vx * dt; h.vy *= (1 - dt * 0.6);
    }

    KN.hop = Math.max(0, KN.hop - dt * 26);
    KN.squash = KN.squash > 0 ? Math.max(0, KN.squash - dt * 3) : Math.min(0, KN.squash + dt * 3);
    KN.spin = KN.spin > 0.001 ? Math.max(0, KN.spin - dt * 7) : 0;
    if (KN.bounce > 0) { KN.bounce -= dt; KN.hop = Math.max(KN.hop, Math.abs(Math.sin(KN.bounce * 15)) * 5 * KN.bounce); }
    KN.tapT = Math.max(0, KN.tapT - dt);
    if (KN.tapT <= 0) KN.taps = 0;
    if (KN.exprT > 0) KN.exprT -= dt;

    // being stroked beats anything he had planned
    if (KN.petting > 0) {
      KN.petting -= dt;
      KN.pet = Math.min(1, KN.pet + dt * 4);
      KN.tilt = Math.sin(S.time * 5) * 0.07 * KN.pet;
      KN.wave = 0; KN.reach = 0; KN.zzz = 0; KN.sit = Math.min(0.4, KN.sit + dt);
      if (KN.exprT <= 0) knFeel('content', 0.25, Math.min(1, 0.55 + KN.pet * 0.45));
      KN.amt += (KN.amtTarget - KN.amt) * Math.min(1, dt * 4);
      if (Math.random() < dt * 2.2) knHeart('heart');
      return;
    }
    KN.pet = Math.max(0, KN.pet - dt * 2);

    KN.actT -= dt;
    if (KN.actT <= 0) knightAct();

    // props live their own little lives
    for (i = KN.props.length - 1; i >= 0; i--) {
      var pr = KN.props[i];
      pr.life -= dt;
      if (pr.life <= 0) { KN.props.splice(i, 1); continue; }
      if (pr.kind === 'ember') {
        pr.x += pr.vx * dt; pr.y += pr.vy * dt;
        pr.vx += Math.sin(S.time * 3 + pr.ph) * 6 * dt;
        pr.vy = Math.max(-16, pr.vy - dt * 2);
      } else {
        pr.ph += dt * 2.2;
        pr.x = Math.cos(pr.ph) * 15;
        pr.y = -14 + Math.sin(pr.ph * 2) * 7;
      }
    }

    // ease every gesture toward what this behaviour wants
    var wantWave = 0, wantReach = 0, wantZzz = 0, wantSit = 0, tilt = Math.sin(S.time * 1.1) * 0.02, expr = 'normal';

    if (KN.act === 'dance') {
      var B = beatNow();
      if (!B) { knightAct('idle'); }
      else {
        var e = 1 - B.phase;
        var pop = e * e;
        KN.hop = Math.max(KN.hop, pop * (B.beat === 0 ? 7.5 : 4.6));
        KN.squash = B.phase < 0.1 ? 0.1 : -pop * 0.08;
        tilt = ((B.beat % 2) ? 1 : -1) * 0.15 * (0.35 + e * 0.65);
        wantWave = B.beat % 2 ? 0.55 : 0;
        expr = 'happy';
        KN.danceT += dt;
        if (Math.random() < dt * 0.5) knHeart('note');
      }
    } else if (KN.act === 'wave')    { wantWave = 1; expr = 'happy'; }
    else if (KN.act === 'stretch')   { tilt = Math.sin(S.time * 2.2) * 0.11; KN.hop = Math.max(KN.hop, 1.4 + Math.sin(S.time * 2.2) * 1.4); expr = 'sleepy'; }
    else if (KN.act === 'doze')      { wantZzz = 1; wantSit = 0.5; tilt = 0.1; expr = 'sleepy'; }
    else if (KN.act === 'sit')       { wantSit = 1; expr = Math.sin(S.time) > 0 ? 'content' : 'normal'; }
    else if (KN.act === 'hum')       { tilt = Math.sin(S.time * 2.6) * 0.1; expr = 'content'; }
    else if (KN.act === 'poke')      { wantReach = 0.5 + Math.sin(S.time * 5) * 0.5; tilt = 0.09; expr = 'normal'; }
    else if (KN.act === 'spin')      { if (KN.spin < 0.01) KN.spin = 6.28; expr = 'happy'; }
    else if (KN.act === 'look')      { expr = 'normal'; }
    else if (KN.act === 'ember') {
      var em = KN.props[0];
      wantReach = em ? 1 : 0;
      if (em) {
        KN.look = clamp(em.x / 12, -1, 1);
        tilt = clamp(em.x / 60, -0.12, 0.12);
        if (Math.random() < dt * 2.5) KN.hop = Math.max(KN.hop, 4);
        expr = 'surprised';
      } else { expr = 'grumble'; }        // it got away
    } else if (KN.act === 'moth') {
      var mo = KN.props[0];
      if (mo) {
        KN.look = clamp(mo.x / 14, -1, 1);
        tilt = clamp(mo.x / 90, -0.1, 0.1);
        if (Math.abs(mo.x) < 6 && Math.random() < dt * 3) { wantWave = 1; }
        expr = 'look';
      }
    }

    if (KN.act !== 'ember' && KN.act !== 'moth') {
      KN.lookT -= dt;
      if (KN.lookT <= 0) { KN.lookT = rand(0.7, 2.2); KN.look = KN.act === 'look' ? rand(-1, 1) : 0; }
    }

    KN.wave  += (wantWave - KN.wave) * Math.min(1, dt * 7);
    KN.reach += (wantReach - KN.reach) * Math.min(1, dt * 7);
    KN.zzz   += (wantZzz - KN.zzz) * Math.min(1, dt * 3);
    KN.sit   += (wantSit - KN.sit) * Math.min(1, dt * 4);
    KN.tilt = tilt;

    KN.blink -= dt;
    if (KN.blink <= 0) { KN.blink = rand(1.8, 6); knFeel('blink', rand(0.1, 0.16), 1); }
    if (KN.exprT <= 0) {
      if (KN.expr !== expr) KN.amtTarget = rand(0.25, 0.62);   // a fresh, partial reading
      KN.expr = expr;
    }
    KN.amt += (KN.amtTarget - KN.amt) * Math.min(1, dt * 4);
  }

  // ── bothering him ──────────────────────────────────────────────────────
  // A bag of reactions rather than one response, so he never answers the
  // same way twice running.
  var KN_REACTS = [
    { id: 'hop',    w: 3,   go: function () { knFeel('happy', rand(1, 1.8), rand(0.7, 1)); KN.hop = rand(5.5, 8); KN.squash = -0.1; knHeart('heart'); bell(rand(820, 960), 0.28, 0.032, 3.2); } },
    { id: 'giggle', w: 2.4, go: function () { knFeel('happy', 1.6, rand(0.8, 1)); KN.bounce = 0.55; knHeart('heart'); knHeart('heart');
                                              bell(700, 0.22, 0.028, 3.4); bell(880, 0.24, 0.026, 3.4, 0.09); } },
    { id: 'shy',    w: 1.6, go: function () { knFeel('shy', rand(1.4, 2.2), rand(0.6, 0.9)); KN.look = rand(0, 1) > 0.5 ? 1 : -1; KN.lookT = 2; knHeart('heart'); bell(590, 0.4, 0.026, 2.6); } },
    { id: 'spin',   w: 1.2, go: function () { knFeel('happy', 1.4, rand(0.7, 1)); KN.spin = 6.28; knHeart('note'); bell(660, 0.3, 0.03, 2.8); bell(990, 0.3, 0.024, 2.8, 0.1); } },
    { id: 'wave',   w: 1.4, go: function () { knFeel('happy', 1.6, rand(0.55, 0.85)); KN.act = 'wave'; KN.actT = 2; bell(760, 0.26, 0.03, 3); } },
    { id: 'jump',   w: 1.1, go: function () { knFeel('surprised', 1.1, rand(0.8, 1)); KN.hop = 9; KN.squash = -0.14; bell(1050, 0.2, 0.03, 3.6); } },
    { id: 'ignore', w: 0.9, go: function () { knFeel('blink', 0.5, rand(0.2, 0.4)); bell(430, 0.2, 0.018, 2.4); } },
    { id: 'grump',  w: 0.7, go: function () { knFeel('grumble', 1.6, rand(0.5, 0.85)); KN.tilt = 0.12; bell(300, 0.34, 0.03, 1.6); } }
  ];

  function knightPoke() {
    KN.taps++; KN.tapT = 2;
    KN.act = 'idle'; KN.actT = rand(1.2, 2.4); KN.props.length = 0;

    // pester him and he stops being charmed by it
    if (KN.taps >= 5 && Math.random() < 0.7) {
      knFeel('grumble', 1.8, rand(0.7, 1));
      KN.bounce = 0.4;
      knHeart('note');
      bell(260, 0.4, 0.032, 1.5);
      KN.taps = 0;
      buzz(12);
      return;
    }
    var pool = [], i, total = 0;
    for (i = 0; i < KN_REACTS.length; i++) if (KN_REACTS[i].id !== KN.lastReact) pool.push(KN_REACTS[i]);
    for (i = 0; i < pool.length; i++) total += pool[i].w;
    var roll = Math.random() * total, acc = 0, picked = pool[0];
    for (i = 0; i < pool.length; i++) { acc += pool[i].w; if (roll <= acc) { picked = pool[i]; break; } }
    KN.lastReact = picked.id;
    picked.go();
    buzz(8);
  }

  function knightPet() {
    if (KN.petting <= 0) {
      bell(rand(600, 700), 0.4, 0.026, 2.6);
      if (Math.random() < 0.25) { knFeel('surprised', 0.5, rand(0.7, 1)); KN.hop = 4; }   // caught him off guard
    }
    KN.petting = 0.35;
  }

  var portraitCv = null;
  function paintPortrait() {
    var cv = portraitCv;
    if (!cv || !cv.isConnected) { portraitCv = null; return; }
    var w = cv.clientWidth || 128, h = cv.clientHeight || 128;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    // check BOTH axes: a canvas defaults to 300x150, and a 150px-wide box at
    // dpr 2 gives exactly 300, so a width-only guard silently skips the height
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    // the knight occupies roughly y -29..+13 around his own origin; fit that
    // box with a margin rather than guessing, so nothing clips at any size
    var TOP = -29, BOT = 13, MID = (TOP + BOT) / 2;
    var sc = Math.min(w, h) / ((BOT - TOP) * 1.28);
    g.save();
    g.translate(w / 2, h / 2 - MID * sc);
    // the ember he is chasing, or the moth bothering him
    g.save();
    g.scale(sc, sc);
    for (var pi = 0; pi < KN.props.length; pi++) {
      var pr = KN.props[pi];
      if (!isFinite(pr.x) || !isFinite(pr.y)) continue;
      if (pr.kind === 'ember') {
        var eg = g.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, 4);
        eg.addColorStop(0, 'rgba(255,236,170,0.95)');
        eg.addColorStop(0.4, 'rgba(255,168,50,0.7)');
        eg.addColorStop(1, 'rgba(255,120,20,0)');
        g.fillStyle = eg;
        g.beginPath(); g.arc(pr.x, pr.y, 4, 0, 6.29); g.fill();
      } else {
        var fl = Math.sin(S.time * 26 + pr.ph) * 0.5 + 0.5;
        g.fillStyle = 'rgba(226,214,190,0.85)';
        g.beginPath(); g.ellipse(pr.x - 1.4, pr.y, 1.7, 0.6 + fl * 1.5, -0.5, 0, 6.29); g.fill();
        g.beginPath(); g.ellipse(pr.x + 1.4, pr.y, 1.7, 0.6 + fl * 1.5, 0.5, 0, 6.29); g.fill();
        g.fillStyle = 'rgba(120,104,88,0.9)';
        g.beginPath(); g.ellipse(pr.x, pr.y, 0.7, 1.5, 0, 0, 6.29); g.fill();
      }
    }
    g.restore();

    drawKnight(g, {
      t: S.time, scale: sc, expr: KN.expr, amt: KN.amt, look: KN.look,
      tilt: KN.tilt, hop: KN.hop, squash: KN.squash, spin: KN.spin,
      wave: KN.wave, reach: KN.reach, zzz: KN.zzz, sit: KN.sit
    });
    // whatever he is feeling about it
    for (var i = 0; i < KN.hearts.length; i++) {
      var hh = KN.hearts[i], a = clamp(hh.life / hh.max, 0, 1);
      g.save();
      g.scale(sc, sc);
      g.globalAlpha = a;
      g.fillStyle = hh.kind === 'note' ? 'rgba(255,214,110,0.95)' : 'rgba(255,138,160,0.95)';
      if (hh.kind === 'note') {
        g.beginPath(); g.arc(hh.x, hh.y, 1.5 * hh.r, 0, 6.29); g.fill();
        g.fillRect(hh.x + 1.1 * hh.r, hh.y - 5 * hh.r, 0.7 * hh.r, 5 * hh.r);
      } else {
        var r = 1.7 * hh.r;
        g.beginPath();
        g.moveTo(hh.x, hh.y + r);
        g.bezierCurveTo(hh.x - r * 1.6, hh.y - r * 0.35, hh.x - r * 0.5, hh.y - r * 1.5, hh.x, hh.y - r * 0.5);
        g.bezierCurveTo(hh.x + r * 0.5, hh.y - r * 1.5, hh.x + r * 1.6, hh.y - r * 0.35, hh.x, hh.y + r);
        g.closePath(); g.fill();
      }
      g.restore();
    }
    g.globalAlpha = 1;
    g.restore();
  }

  function veil(html, cls) {
    portraitCv = null;
    KN.onStage = false;
    elCard.className = 'card' + (cls ? ' ' + cls : '');
    elCard.innerHTML = html;
    elVeil.classList.remove('hide');
    elVeil.scrollTop = 0;
  }
  function hideVeil() { elVeil.classList.add('hide'); }
  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  function hookPortrait() { portraitCv = document.getElementById('portrait'); paintPortrait(); }

  // Poke him and he perks up; drag across him and he leans into it.
  function bindStage() {
    var st = document.getElementById('stage');
    if (!st) return;
    KN.onStage = true;
    var down = false, moved = 0, sx = 0, sy = 0;
    st.addEventListener('pointerdown', function (e) {
      down = true; moved = 0; sx = e.clientX; sy = e.clientY;
      try { st.setPointerCapture(e.pointerId); } catch (err) {}
    });
    st.addEventListener('pointermove', function (e) {
      if (!down) return;
      moved += Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy);
      sx = e.clientX; sy = e.clientY;
      if (moved > 24) knightPet();          // a stroke, not a tap
    });
    var end = function (e) {
      if (!down) return;
      down = false;
      if (moved <= 24) knightPoke();
      try { st.releasePointerCapture(e.pointerId); } catch (err) {}
    };
    st.addEventListener('pointerup', end);
    st.addEventListener('pointercancel', end);
  }

  // ── naming your knight ─────────────────────────────────────────────────
  function cleanName(v) {
    return String(v || '').replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 14);
  }
  function nameKnight(after) {
    S.mode = 'menu';
    showChrome(false);
    var first = !META.knight.name;
    veil(
      '<div class="eyebrow">' + (first ? 'Before you begin' : 'Your knight') + '</div>' +
      '<h1>Who <em>Holds?</em></h1>' +
      '<canvas id="portrait" class="portrait big"></canvas>' +
      '<input id="nameIn" class="nameIn" maxlength="14" autocomplete="off" spellcheck="false" ' +
        'placeholder="Name your knight" value="' + esc(META.knight.name) + '">' +
      '<div class="plumes">' + plumeSwatches() + '</div>' +
      '<div class="wearlist">' +
        wardrobeRow('Build',  'build',  BUILDS,  buildOf().id) +
        wardrobeRow('Helm',   'helm',   HELMS,   helmOf().id) +
        wardrobeRow('Cape',   'cape',   CAPES,   capeOf().id) +
        wardrobeRow('Armour', 'armour', ARMOURS, armourOf().id) +
      '</div>' +
      '<button class="go" id="btnName">' + (first ? 'Take the Watch' : 'Save') + '</button>' +
      (first ? '' : '<button class="ghost" id="btnNameBack">Back to camp</button>') +
      (first ? '' : '<button class="ghost danger" id="btnWipe">Start over from nothing</button>') +
      '<div class="foot">They will be remembered by this name</div>' +
      buildFoot(),
      'wide'
    );
    hookPortrait();
    bindPlumes();
    bindWardrobe();
    var input = document.getElementById('nameIn');
    var commit = function () {
      var n = cleanName(input.value);
      META.knight.name = n || 'Pip';
      saveMeta();
      (after || menu)();
    };
    on('btnName', commit);
    on('btnNameBack', menu);
    on('btnWipe', function () {
      if (this.getAttribute('data-sure')) { wipeMeta(); nameKnight(menu); return; }
      this.setAttribute('data-sure', '1');
      this.classList.add('armed');
      this.textContent = 'Tap again — this erases everything';
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
    if (first) setTimeout(function () { try { input.focus(); } catch (e) {} }, 320);
  }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

      ? '<svg width="14" height="16" viewBox="0 0 14 16"><rect x="1.5" y="1" width="4" height="14" rx="1.3" fill="currentColor"/><rect x="8.5" y="1" width="4" height="14" rx="1.3" fill="currentColor"/></svg>'

  function refreshTransport() {
    var box = document.querySelector('.transport');
    if (!box) return;
    var T = TUNES[MUS.tune];
    var b = box.querySelector('.tinfo b'), sp = box.querySelector('.tinfo span');
    if (b) b.textContent = T.name;
    if (sp) sp.textContent = T.genre + ' · ' + T.bpm + ' bpm' + (MUS.on ? '' : ' · paused');

  function bindTransport(browseFn) {
    on('mPrev', function () { UI.back(); stepTune(-1); });

  // ── shared fragments ──────────────────────────────────────────────────────
  function levelStrip() {
    var L = levelInfo(META.xp);
    var pct = clamp(L.into / L.need, 0, 1) * 100;
    return '<div class="lvl">' +
      '<div class="lvl-top"><b>Keeper level ' + L.level + '</b>' +
        '<span class="embers">' + META.embers.toLocaleString() + ' <i>embers</i></span></div>' +
      '<div class="xp"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="lvl-sub">' + L.into.toLocaleString() + ' / ' + L.need.toLocaleString() + ' to level ' + (L.level + 1) + nextUnlockNote(L.level) + '</div>' +
    '</div>';
  }
  function nextUnlockNote(level) {
    var soon = [];
    for (var i = 0; i < UPGRADES.length; i++) if (UPGRADES[i].lv === level + 1) soon.push(UPGRADES[i].name);
    if (!soon.length) return '';
    var shown = soon.slice(0, 2).join(' & ');
    if (soon.length > 2) shown += ' +' + (soon.length - 2) + ' more';
    return ' · unlocks ' + shown;
  }
  function upChips(map, big) {
    var out = '', ids = Object.keys(map || {});
    if (!ids.length) return '<div class="none">Nothing drafted yet.</div>';
    // the in-play strip has a pause button to stay clear of, so it elides
    var cap = big ? ids.length : 8;
    var over = ids.length - cap;
    if (over > 0) ids = ids.slice(0, cap);
    for (var i = 0; i < ids.length; i++) {
      var def = UP_BY_ID[ids[i]]; if (!def || !map[ids[i]]) continue;
      out += '<span class="chip t' + def.tier + (big ? ' big' : '') + '" title="' + esc(def.desc) + '">' +
             '<em>' + def.glyph + '</em>' + (big ? '<b>' + esc(def.name) + '</b>' : '') +
             (map[ids[i]] > 1 ? '<u>×' + map[ids[i]] + '</u>' : '') + '</span>';
    }
    if (over > 0) out += '<span class="chip more">+' + over + '</span>';
    return out;
  }

      var P = PERKS[i], r = pk(P.id), maxed = r >= P.ranks;

      for (var d = 0; d < P.ranks; d++) pips += '<i class="' + (d < r ? 'on' : '') + '"></i>';
      rows +=
        '<div class="shop' + (maxed ? ' maxed' : '') + '">' +
          '<div class="sg">' + P.glyph + '</div>' +
          '<div class="sb">' +
            '<b>' + esc(P.name) + '</b>' +

            '<div class="pips">' + pips + '</div>' +
          '</div>' +
          (maxed
            ? '<div class="sc done">MAX</div>'
            : '<button class="sc' + (afford ? ' can' : '') + '" data-perk="' + P.id + '">' + cost + '</button>') +
        '</div>';
    }
    veil(
      '<div class="eyebrow">Provisions</div>' +
      '<h1>Spend <em>Embers</em></h1>' +
      levelStrip() +
      '<div class="explain">' +
        '<div><i>🔥</i><span><b>What they buy.</b> Gear on this page, kept forever — ' +
          'every rank you buy applies to every run from now on.</span></div>' +
        '<div><i>🌙</i><span><b>How you earn them.</b> Every watch pays out when it ends: ' +
          'further nights and higher scores pay more.</span></div>' +
        '<div><i>🎖</i><span><b>Bonus.</b> Each Feat pays a one-time bounty the first time you manage it.</span></div>' +
      '</div>' +
      '<div class="shoplist">' + rows + '</div>' +
      '<button class="ghost" id="btnBack">Back to camp</button>' +
      buildFoot(),
      'wide'
    );
    var btns = elCard.querySelectorAll('button[data-perk]');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var id = this.getAttribute('data-perk');
        var P2 = null;
        for (var q = 0; q < PERKS.length; q++) if (PERKS[q].id === id) P2 = PERKS[q];
        if (!P2) return;
        var rank = pk(id);
        if (rank >= P2.ranks) return;
        var price = P2.cost[rank];
        if (META.embers < price) { UI.denied(); return; }
        META.embers -= price;
