<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Night Watch</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Night Watch" />
<meta name="theme-color" content="#08060a" />
<style>
  :root{
    --bg:#08060a;
    --ember:#FF9F0A;
    --core:#FFD60A;
    --glow:rgba(255,159,10,0.45);
    --go1:#FFB13A;
    --go2:#E07C0A;
    --goInk:#20130a;
    --coal:#B34A3D;
    --bone:#E8DCC8;
    --mute:#8E8E93;
    --line:rgba(232,220,200,0.16);
    --panel:rgba(20,16,14,0.82);
    --danger:#FF453A;
    --display:-apple-system,'SF Pro Display',system-ui,sans-serif;
    --body:-apple-system,'SF Pro Text',system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono','SFMono-Regular',menlo,monospace;
    --safeT:env(safe-area-inset-top,0px);
    --safeB:env(safe-area-inset-bottom,0px);
    --safeL:env(safe-area-inset-left,0px);
    --safeR:env(safe-area-inset-right,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);
    color:var(--bone);font-family:var(--body);
    overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #c{position:fixed;inset:0;display:block;z-index:0}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;z-index:2;left:0;right:0;top:0;
    padding:calc(var(--safeT) + 10px) calc(var(--safeR) + 14px) 0 calc(var(--safeL) + 14px);
    display:flex;align-items:flex-start;gap:12px;pointer-events:none;
    max-width:660px;margin:0 auto;
    opacity:0;transition:opacity .35s ease;
  }
  #hud.on{opacity:1}
  .meter{flex:1;min-width:0}
  .meter .lbl{
    display:flex;justify-content:space-between;align-items:baseline;
    font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
    color:#A79C90;margin-bottom:7px;
  }
  .meter .lbl b{font:800 17px/1 var(--mono);letter-spacing:.02em;color:var(--bone);text-shadow:0 1px 6px #000}
  .bar{
    height:15px;border-radius:8px;background:rgba(232,220,200,0.13);
    border:1px solid rgba(232,220,200,0.10);overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.5);
  }
  .bar i{
    display:block;height:100%;width:60%;border-radius:7px;
    background:linear-gradient(90deg,var(--coal),var(--ember) 55%,var(--core));
    box-shadow:0 0 16px rgba(255,159,10,0.7);
    transition:width .12s linear, background .3s ease;
  }
  .bar.low i{background:linear-gradient(90deg,#7a2520,var(--danger));box-shadow:0 0 18px rgba(255,69,58,0.75)}
  .bar.low{border-color:rgba(255,69,58,0.4)}
  .meters{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
  .bar.thin{height:10px;border-radius:6px}
  .bar.thin i{border-radius:5px}
  #hpBar i{
    background:linear-gradient(90deg,#2f8f5b,#63E6BE 60%,#9CF6D4);
    box-shadow:0 0 14px rgba(99,230,190,0.55);
  }
  #hpBar.hurt i{background:linear-gradient(90deg,#8a6a1c,#FFD60A);box-shadow:0 0 14px rgba(255,214,10,0.6)}
  #hpBar.crit i{background:linear-gradient(90deg,#7a2520,var(--danger));box-shadow:0 0 16px rgba(255,69,58,0.75)}
  #hpBar.crit{border-color:rgba(255,69,58,0.4)}
  /* dawn is a hairline along the very top edge — the bar became health */
  #dawnLine{
    position:fixed;z-index:3;left:0;top:0;width:100%;height:3px;
    background:rgba(232,220,200,0.07);opacity:0;transition:opacity .35s ease;
    pointer-events:none;
  }
  #dawnLine.on{opacity:1}
  #dawnLine i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#2a3550,#5E5CE6 60%,#9AD5FF);
    box-shadow:0 0 8px rgba(94,92,230,0.7);
    transition:width .12s linear;
  }
  #stats{
    flex:none;text-align:right;font:700 12px/1.5 var(--mono);letter-spacing:.04em;
    color:var(--bone);text-shadow:0 1px 8px #000;
  }
  #stats small{display:block;font:600 9px/1 var(--body);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-bottom:4px}
  #stats small.scr{margin-bottom:0}
  #stats small.scr b{font:700 13px/1 var(--mono);letter-spacing:.02em;color:var(--bone);margin-left:5px}

  /* ---------- Controls ---------- */
  .btn{
    position:fixed;z-index:3;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--panel);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--bone);cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity .35s ease, transform .1s ease, background .15s ease;
  }
  .btn.on{opacity:1;pointer-events:auto}
  .btn:active{transform:scale(.94)}
  /* primary action sits under the thumb; the flare moved up out of it */
  html[data-hand="right"] #brand{left:auto;right:calc(var(--safeR) + 20px)}
  html[data-hand="right"] #flare{left:auto;right:calc(var(--safeR) + 30px)}
  html[data-hand="right"] #pause{right:auto;left:calc(var(--safeL) + 14px)}
  html[data-hand="right"] #build{right:auto;left:calc(var(--safeL) + 12px)}
  #brand{
    left:calc(var(--safeL) + 20px);bottom:calc(var(--safeB) + 28px);
    width:104px;height:104px;border-radius:50%;
    font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
    color:#FFC46B;border-color:rgba(255,150,40,0.42);
    background:radial-gradient(120% 120% at 50% 20%, rgba(72,34,8,0.9), rgba(20,16,14,0.86));
    box-shadow:0 0 30px rgba(255,120,20,0.20), inset 0 0 26px rgba(255,120,20,0.14);
    overflow:hidden;
  }
  #brand .fill{
    position:absolute;left:0;right:0;bottom:0;height:0%;
    background:rgba(255,120,20,0.20);transition:height .06s linear;
  }
  #brand span{position:relative;z-index:1}
  #brand.cool{color:#8a7b6a;border-color:var(--line);box-shadow:none}
  #brand.ready{
    color:#FFD9A0;border-color:rgba(255,168,60,0.75);
    box-shadow:0 0 38px rgba(255,120,20,0.34), inset 0 0 30px rgba(255,120,20,0.20);
  }
  #flare{
    left:calc(var(--safeL) + 30px);bottom:calc(var(--safeB) + 150px);
    width:78px;height:78px;border-radius:50%;
    font:700 9px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
    color:var(--core);border-color:rgba(255,214,10,0.34);
    box-shadow:0 0 26px rgba(255,159,10,0.14), inset 0 0 22px rgba(255,159,10,0.10);
    overflow:hidden;
  }
  #flare .fill{
    position:absolute;left:0;right:0;bottom:0;height:0%;
    background:rgba(255,159,10,0.14);transition:height .08s linear;
  }
  #flare span{position:relative;z-index:1;display:block;text-align:center}
  #flare span u{display:block;margin-top:3px;font:700 8.5px/1 var(--mono);letter-spacing:.06em;
    text-decoration:none;opacity:.72}
  #flare.cool{color:#7d7369;border-color:var(--line);box-shadow:none}
  #flare.ready{animation:flarePulse 2.6s ease-in-out infinite}
  @keyframes flarePulse{
    0%,100%{box-shadow:0 0 22px rgba(255,159,10,0.12), inset 0 0 20px rgba(255,159,10,0.08)}
    50%{box-shadow:0 0 34px rgba(255,159,10,0.26), inset 0 0 26px rgba(255,159,10,0.16)}
  }
  #pause{
    top:calc(var(--safeT) + 116px);right:calc(var(--safeR) + 14px);
    width:38px;height:38px;border-radius:12px;
  }
  #pause svg{opacity:.75}

  /* ---------- Overlays ---------- */
  #veil{
    position:fixed;inset:0;z-index:4;display:grid;place-items:center;
    padding:calc(var(--safeT) + 24px) 26px calc(var(--safeB) + 24px);
    background:radial-gradient(120% 90% at 50% 45%, rgba(24,14,8,0.72), rgba(4,3,5,0.94) 70%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    transition:opacity .4s ease;
  }
  #veil.hide{opacity:0;pointer-events:none}
  #veilback{
    position:fixed;z-index:6;display:none;
    top:calc(var(--safeT) + 12px);left:calc(var(--safeL) + 12px);
    width:42px;height:42px;border-radius:50%;cursor:pointer;
    border:1px solid var(--line);background:rgba(20,16,14,0.86);
    color:var(--bone);font:400 27px/1 var(--display);padding:0 4px 4px 0;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:transform .12s ease,border-color .2s ease;
  }
  #veilback.on{display:block}
  #veilback:active{transform:scale(.92);border-color:var(--ember)}
  #veil.hide #veilback{display:none}
  #veilgear{
    position:fixed;z-index:6;display:none;
    top:calc(var(--safeT) + 12px);right:calc(var(--safeR) + 12px);
    width:42px;height:42px;border-radius:50%;cursor:pointer;
    border:1px solid var(--line);background:rgba(20,16,14,0.86);
    color:var(--mute);font:400 19px/1 var(--body);padding:0;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:transform .3s ease,color .2s ease,border-color .2s ease;
  }
  #veilgear.on{display:block}
  #veilgear:active{transform:rotate(60deg) scale(.92);color:var(--ember);border-color:var(--ember)}
  #veil.hide #veilgear{display:none}
  .card{width:100%;max-width:380px;text-align:center;animation:rise .5s cubic-bezier(.2,.9,.25,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .eyebrow{font:700 10px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--ember);margin-bottom:14px}
  h1{font:700 40px/1.02 var(--display);letter-spacing:-.02em;margin-bottom:14px}
  h1 em{font-style:normal;display:block;color:var(--ember);text-shadow:0 0 34px var(--glow)}
  .lede{font:400 15px/1.55 var(--body);color:#B8AEA0;margin-bottom:26px}
  .rules{
    text-align:left;border:1px solid var(--line);border-radius:16px;
    background:rgba(20,16,14,0.5);padding:14px 16px;margin-bottom:24px;
  }
  .rules li{list-style:none;display:flex;gap:11px;align-items:flex-start;padding:7px 0;font:400 13.5px/1.45 var(--body);color:#C4BAAC}
  .rules li+li{border-top:1px solid rgba(232,220,200,0.07)}
  .rules b{color:var(--bone);font-weight:600}
  .glyph{flex:none;width:22px;text-align:center;font-size:15px;line-height:1.45;filter:saturate(.9)}
  .go{
    display:block;width:100%;padding:17px;border:none;border-radius:16px;cursor:pointer;
    background:linear-gradient(180deg,var(--go1),var(--go2));color:var(--goInk);
    font:700 16px/1 var(--body);letter-spacing:.02em;
    box-shadow:0 10px 34px var(--glow);
    transition:transform .1s ease,filter .15s ease;
  }
  .go:active{transform:scale(.98);filter:brightness(1.06)}
  .ghost{
    display:block;width:100%;padding:15px;margin-top:10px;cursor:pointer;
    background:transparent;border:1px solid var(--line);border-radius:16px;
    color:var(--mute);font:600 14px/1 var(--body);
  }
  .ghost:active{background:rgba(232,220,200,0.05)}
  .ghost.danger{color:#c98b84;border-color:rgba(255,69,58,0.3)}
  .ghost.danger.armed{color:#fff;background:rgba(255,69,58,0.22);border-color:rgba(255,69,58,0.65)}
  .tally{display:flex;gap:10px;margin-bottom:24px}
  .tally div{
    flex:1;border:1px solid var(--line);border-radius:14px;padding:14px 8px;
    background:rgba(20,16,14,0.5);
  }
  .tally span{display:block;font:600 9px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
  .tally b{font:700 24px/1 var(--mono);letter-spacing:-.02em;color:var(--bone)}
  .tally b.hi{color:var(--core)}
  .foot{margin-top:20px;font:500 10px/1.6 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#57514c}

  /* ---------- Toast ---------- */
  #build{
    position:fixed;z-index:1;right:calc(var(--safeR) + 12px);bottom:calc(var(--safeB) + 10px);
    font:600 9px/1 var(--mono);letter-spacing:.1em;color:rgba(232,220,200,0.22);
    pointer-events:none;user-select:none;
  }
  .buildfoot{
    margin-top:14px;font:600 9px/1.6 var(--mono);letter-spacing:.12em;
    text-transform:uppercase;color:#4a453f;
  }
  .warnbox{
    border:1px solid rgba(255,159,10,0.4);border-radius:14px;
    background:rgba(60,34,8,0.5);padding:12px 14px;margin-bottom:16px;text-align:left;
    font:500 12px/1.5 var(--body);color:#E4C79A;
  }
  .warnbox b{color:var(--core);font-weight:700}

  #toast{
    position:fixed;z-index:3;left:50%;top:38%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;opacity:0;
  }
  #toast.show{animation:toast 1.7s cubic-bezier(.2,.9,.25,1) both}
  #toast .t1{font:700 34px/1 var(--display);letter-spacing:-.01em;color:var(--core);text-shadow:0 0 40px rgba(255,214,10,0.5)}
  #toast .t2{margin-top:8px;font:600 11px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:#B8AEA0}
  @keyframes toast{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.86)}
    16%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    72%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-58%) scale(1.02)}
  }

  /* ---------- HUD row 2: heat + held upgrades ---------- */
  #hud2{
    position:fixed;z-index:2;left:0;right:0;top:calc(var(--safeT) + 110px);
    padding:0 calc(var(--safeR) + 62px) 0 calc(var(--safeL) + 14px);
    max-width:660px;margin:0 auto;
    display:flex;align-items:center;gap:8px;
    pointer-events:none;opacity:0;transition:opacity .35s ease;
  }
  #hud2.on{opacity:1}
  #heat{
    flex:none;font:800 13px/1 var(--mono);letter-spacing:.02em;
    padding:5px 9px;border-radius:8px;color:#FFD60A;
    background:rgba(255,159,10,0.12);border:1px solid rgba(255,214,10,0.3);
    opacity:0;transform:scale(.8);transition:transform .12s ease;
  }
  #heat.show{opacity:1;transform:scale(1)}
  #heat.warm{color:#FF9F0A;background:rgba(255,159,10,0.2);border-color:rgba(255,159,10,0.5)}
  #heat.hot{
    color:#fff;background:rgba(255,69,58,0.35);border-color:rgba(255,107,107,0.7);
    box-shadow:0 0 18px rgba(255,69,58,0.4);
  }
  #chips{display:flex;gap:4px;min-width:0;overflow:hidden}
  #chips .none{display:none}
  .chip{
    display:inline-flex;align-items:center;gap:3px;
    font:600 11px/1 var(--body);
    padding:4px 6px;border-radius:7px;
    background:rgba(20,16,14,0.7);border:1px solid var(--line);
  }
  .chip u{text-decoration:none;font:700 9px/1 var(--mono);color:var(--core);opacity:.9}
  /* emoji ship in their own palette; warm them so the UI reads as one piece */
  .chip em,.dg,.sg,.rules .glyph{
    font-style:normal;
    filter:sepia(.55) saturate(1.7) hue-rotate(-14deg) brightness(1.04);
  }
  .chip.t2{border-color:rgba(94,92,230,0.45);background:rgba(40,36,70,0.55)}
  .chip.t3{border-color:rgba(255,159,10,0.55);background:rgba(60,36,10,0.6)}
  .chip.more{font:700 10px/1 var(--mono);color:var(--mute)}
  .chip.big{font-size:12.5px;padding:7px 10px;gap:6px}
  .chip.big b{font-weight:600;color:var(--bone)}

  /* ---------- overlay layout ---------- */
  #veil{overflow-y:auto;overscroll-behavior:contain;align-items:safe center}
  .card.wide{max-width:440px}
  .row2{display:flex;gap:10px;margin-top:10px}
  .row2 .ghost{margin-top:0}
  .tally.sm b{font-size:19px}
  .held{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
  .held.big{gap:7px;margin:18px 0 4px}
  .held.big + .go{margin-top:16px}
  .held .none{font:400 12.5px/1.5 var(--body);color:#57514c}

  /* ---------- level strip ---------- */
  .lvl{
    border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:18px;
    background:rgba(20,16,14,0.5);text-align:left;
  }
  .lvl.tight{padding:11px 14px;margin:16px 0 4px}
  .lvl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .lvl-top b{font:700 14px/1 var(--body);color:var(--bone)}
  .embers{font:700 13px/1 var(--mono);color:var(--core)}
  .embers i{font-style:normal;font:600 9px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .xp{height:6px;border-radius:4px;background:rgba(232,220,200,0.10);overflow:hidden}
  .xp i{
    display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,#5E5CE6,#9AD5FF);box-shadow:0 0 10px rgba(94,92,230,0.5);
  }
  .lvl-sub{margin-top:8px;font:500 10px/1.5 var(--body);letter-spacing:.06em;color:#6b635c;text-transform:uppercase}

  /* ---------- draft ---------- */
  .draft{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .dcard{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
    padding:14px 15px;border-radius:16px;
    border:1px solid var(--line);background:rgba(24,19,16,0.72);
    color:var(--bone);transition:transform .1s ease,border-color .15s ease,background .15s ease;
  }
  .dcard:active{transform:scale(.98)}
  .dcard:hover{border-color:rgba(255,159,10,0.45);background:rgba(38,28,18,0.8)}
  .dcard.t2{border-color:rgba(94,92,230,0.42)}
  .dcard.t2:hover{border-color:rgba(120,118,255,0.7)}
  .dcard.t3{
    border-color:rgba(255,159,10,0.5);
    background:linear-gradient(120deg,rgba(58,32,10,0.8),rgba(24,19,16,0.72));
    box-shadow:0 0 24px rgba(255,159,10,0.12);
  }
  .dg{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:21px;
      border-radius:12px;background:rgba(255,255,255,0.04)}
  .db{flex:1;min-width:0}
  .db b{display:block;font:700 15px/1.2 var(--body);margin-bottom:3px}
  .db span{display:block;font:400 12.5px/1.4 var(--body);color:#B0A69A}
  .dt{flex:none;text-align:right;font:700 8px/1.4 var(--body);letter-spacing:.14em;color:var(--mute)}
  .dcard.t3 .dt{color:var(--ember)}
  .dcard.t2 .dt{color:#9A98FF}
  .dt u{display:block;text-decoration:none;font:700 10px/1.4 var(--mono);color:var(--bone);opacity:.55;letter-spacing:0}

  /* ---------- shop + feats ---------- */
  .shoplist{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .shop,.feat{
    display:flex;align-items:center;gap:12px;text-align:left;
    padding:12px 13px;border-radius:14px;
    border:1px solid var(--line);background:rgba(20,16,14,0.5);
  }
  .shop.maxed{opacity:.55}
  .sg,.fk{flex:none;width:34px;height:34px;display:grid;place-items:center;font-size:18px;
          border-radius:10px;background:rgba(255,255,255,0.04)}
  .sb,.fb{flex:1;min-width:0}
  .sb b,.fb b{display:block;font:700 13.5px/1.2 var(--body);margin-bottom:2px}
  .sb span,.fb span{display:block;font:400 11.5px/1.35 var(--body);color:#A99F94}
  .pips{display:flex;gap:3px;margin-top:6px}
  .pips i{width:14px;height:3px;border-radius:2px;background:rgba(232,220,200,0.14)}
  .pips i.on{background:var(--ember);box-shadow:0 0 6px var(--glow)}
  .sc{
    flex:none;min-width:52px;padding:9px 10px;border-radius:11px;cursor:pointer;
    border:1px solid var(--line);background:transparent;
    font:700 13px/1 var(--mono);color:var(--mute);
  }
  .sc.can{color:#20130a;background:linear-gradient(180deg,#FFB13A,#E07C0A);border-color:transparent}
  .sc.can:active{transform:scale(.95)}
  .sc.done{border:none;font:700 9px/1 var(--body);letter-spacing:.14em;color:var(--ember);background:none}
  .feat{opacity:.5}
  .feat.got{opacity:1;border-color:rgba(255,159,10,0.32)}
  .feat.got .fk{color:var(--ember);background:rgba(255,159,10,0.12)}

<body>
<canvas id="c"></canvas>

<div id="dawnLine"><i></i></div>
<div id="hud">
  <div class="meters">
    <div class="meter" id="fuelWrap">
      <div class="lbl"><span>Fire</span><b id="fuelNum">60</b></div>
      <div class="bar" id="fuelBar"><i></i></div>
    </div>
    <div class="meter" id="hpWrap">
      <div class="lbl"><span>Health</span><b id="hpNum">100</b></div>
      <div class="bar thin" id="hpBar"><i></i></div>
    </div>
  </div>
  <div id="stats"><small>Night <span id="nightNum">1</span></small><small class="scr">Score <b id="scoreNum">0</b></small></div>
</div>
<div id="hud2"><div id="heat"></div><div id="chips"></div></div>

<button class="btn" id="pause" aria-label="Pause">
  <svg width="14" height="16" viewBox="0 0 14 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="9" y="1" width="4" height="14" rx="1.4" fill="currentColor"/></svg>
</button>

<button class="btn" id="flare" aria-label="Flare"><div class="fill"></div><span>Flare<u id="flareCost"></u></span></button>
<button class="btn" id="brand" aria-label="Swing the brand"><div class="fill"></div><span>Brand</span></button>

<div id="build"></div>
<div id="toast"><div class="t1"></div><div class="t2"></div></div>

<div id="veil"><button id="veilback" aria-label="Back" title="Back">‹</button><button id="veilgear" aria-label="Settings" title="Settings">⚙</button><div class="card" id="card"></div></div>

<script>
(function () {
  'use strict';

  // ────────────────────────────────────────────────────────────── setup
  var cvs = document.getElementById('c');
  var ctx = cvs.getContext('2d');
  var darkCvs = document.createElement('canvas');
  var dctx = darkCvs.getContext('2d');
  var groundCvs = document.createElement('canvas');
  var gctx = groundCvs.getContext('2d');

  var W = 0, H = 0, DPR = 1;
  // The field is drawn smaller than life so more of it fits on the glass. All
  // the game's numbers stay in field units; only the transform knows about it.
  var ZOOM = 0.6;
  var VS = 1;                     // device pixels per field unit
  function px(n) { return n / ZOOM; }   // n screen pixels, in field units

    for (i = 0; i < HAIRS.length; i++)   if (HAIRS[i].id === k.armour)    f.knight.armour = k.armour;

  function loadMeta() {
    var raw = null;
    try { raw = localStorage.getItem(META_KEY); } catch (e) { SAVE_FAILED = true; return; }
    if (!raw) { migrateLegacy(); return; }
    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    META = sanitizeMeta(parsed);
    if (!parsed) saveMeta();          // repair an unreadable record in place
  }

  // sound/music used to live in their own keys; fold them in once
  function migrateLegacy() {
    try {
      var mu = localStorage.getItem(MUTE_KEY);
      var mus = localStorage.getItem(MUSIC_KEY);
      if (mu !== null) { META.opts.sound = mu !== '1'; localStorage.removeItem(MUTE_KEY); }
      if (mus !== null) { META.opts.music = mus !== '0'; localStorage.removeItem(MUSIC_KEY); }
      if (mu !== null || mus !== null) saveMeta();
    } catch (e) {}
  }

  function saveMeta() {
    try {
      localStorage.setItem(META_KEY, JSON.stringify(META));
      SAVE_FAILED = false;
      return true;
    } catch (e) {
      SAVE_FAILED = true;           // quota, private mode, blocked site data
      return false;
    }
  }
  function wipeMeta() {
    META = freshMeta();
    try { localStorage.removeItem(META_KEY); } catch (e) {}
    saveMeta();
    recalc();
  }

  // Levels come from embers *earned*, so spending never costs you progress.
  function xpFor(l) { return Math.round(95 * Math.pow(l, 1.18)); }
  function levelInfo(xp) {
    var l = 1, spent = 0, need = xpFor(1);
    while (xp >= spent + need && l < 60) { spent += need; l++; need = xpFor(l); }
    return { level: l, into: xp - spent, need: need };
  }
  function keeperLevel() { return levelInfo(META.xp).level; }
  function u(id) { return S.up[id] || 0; }
  function pk(id) { return META.perks[id] || 0; }
  function upCount() { var n = 0; for (var k in S.up) n += S.up[k]; return n; }

  // Every number the run actually reads. Recomputed when something changes
  // rather than per-frame, so stacking upgrades stays cheap.
  var D = {};
  function recalc() {
    var reachMul = 1 + u('reach') * 0.45;
    D.maxFuel   = 100 + u('hearth') * 20;
    D.startFuel = Math.min(D.maxFuel, K.startFuel + pk('provisions') * 7);
    D.logFuel   = K.logFuel + u('seasoned') * 6 + pk('richwood') * 2;
    D.drainMul  = Math.pow(0.88, u('banked'));
    D.dawnFuel  = 26 + u('firstlight') * 16;
    D.maxLogs   = K.maxLogs + u('hoard') * 2;
    D.logRate   = Math.pow(0.8, u('cache'));          // multiplies the interval
    D.pickupR   = K.pickupR * reachMul;
    D.depositR  = K.depositR * reachMul;
    D.carry     = K.carryBase + u('broadback') * 2;

    // the brand: free, fast, and aimed — the everyday answer to a shade
    D.brandR    = K.brandR * (1 + u('longbrand') * 0.35);
    D.brandArc  = u('sweep') ? Math.PI * 2 : Math.min(Math.PI * 1.75, K.brandArc * (1 + u('deft') * 0.26));
    D.brandDmg  = K.brandDmg + u('whitehot') * 2.1;
    D.swingCd   = K.swingCd;
    D.swingDur  = K.swingDur;

    D.lampR     = K.lampR * (1 + u('lantern') * 0.28) * (1 + pk('lamp') * 0.06);
    D.fireLight = 1 + u('ward') * 0.15;
    D.burnMul   = 1 + u('hungry') * 0.30;

    D.flareCost = Math.max(3, K.flareCost - u('cheap') * 3 - pk('flint'));
    D.flareCd   = K.flareCd * Math.pow(0.70, u('quick'));
    D.flareR    = K.flareR * (1 + u('wide') * 0.30);

    D.speed     = K.keeperSpeed * (1 + u('feet') * 0.17) * (1 + pk('boots') * 0.05) * (1 + pk('rig') * 0.06);
    D.carryPer  = u('unburdened') ? 0 : 0.05;   // speed lost per log carried
    D.maxHealth = K.maxHealth + u('hearty') * 25 + pk('mail') * 8;
    D.startHealth = Math.min(D.maxHealth, D.maxHealth * 0 + K.maxHealth + u('hearty') * 25 + pk('mail') * 8);
    D.hitDamage = Math.max(4, K.hitDamage - u('nerve') * 2);
    D.iframe    = K.iframe + u('nerve') * 0.35;
    D.dawnHeal  = u('mend') ? 9999 : 40;
    D.mend      = 1 + u('draught') * 1.1 + pk('draught') * 0.25 + pk('rig') * 0.15;
    D.scoreMul  = 1 + u('veteran') * 0.25;
    D.rerolls   = pk('reroll');
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }

    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;

  // ══════════════════════════════════════════════════════════════ audio ══
  // Every sound here is synthesised at runtime — no samples, no external
  // files — so the game stays one portable HTML file.
  var A = { ctx: null, master: null, comp: null, sfx: null, music: null, verb: null, noise: null };
  var SFX_TRIM = 0.42;        // everything got a lot softer
  var MUSIC_LEVEL = 0.5;

  function ac() {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return A.ctx; }
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    var a;
    try { a = new Ctor(); } catch (e) { return null; }
    A.ctx = a;

    var comp = a.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 26; comp.ratio.value = 3.2;
    comp.attack.value = 0.006; comp.release.value = 0.25;
    var master = a.createGain(); master.gain.value = 0.85;
    comp.connect(master); master.connect(a.destination);

    // a small warm room, so nothing lands bone dry
    var verb = a.createConvolver();
    verb.buffer = impulse(a, 2.4, 2.6);
    var verbG = a.createGain(); verbG.gain.value = 0.75;
    verb.connect(verbG); verbG.connect(comp);

    // sfx bus — rolled off up top so nothing is sharp any more
    var sfx = a.createGain(); sfx.gain.value = 1;
    var sfxLP = a.createBiquadFilter();
    sfxLP.type = 'lowpass'; sfxLP.frequency.value = 2300; sfxLP.Q.value = 0.4;
    sfx.connect(sfxLP); sfxLP.connect(comp);
    var sfxSend = a.createGain(); sfxSend.gain.value = 0.2;
    sfxLP.connect(sfxSend); sfxSend.connect(verb);

    // music bus — starts silent and fades up
    var music = a.createGain(); music.gain.value = 0.0001;
    var musLP = a.createBiquadFilter();
    musLP.type = 'lowpass'; musLP.frequency.value = 5000; musLP.Q.value = 0.3;
    music.connect(musLP);
    musLP.connect(comp);

    // chorus: a slowly detuned copy of the band, for tape-ish warmth and width
    var chDelay = a.createDelay(0.06); chDelay.delayTime.value = 0.019;
    var chLfo = a.createOscillator(); chLfo.type = 'sine'; chLfo.frequency.value = 0.21;
    var chAmt = a.createGain(); chAmt.gain.value = 0.0055;
    chLfo.connect(chAmt); chAmt.connect(chDelay.delayTime); chLfo.start();
    var chMix = a.createGain(); chMix.gain.value = 0.36;
    musLP.connect(chDelay); chDelay.connect(chMix); chMix.connect(comp);

    // a soft echo, kept quiet and dark so it never muddies the changes
    var dl = a.createDelay(1.5); dl.delayTime.value = 0.4;
    var dlLP = a.createBiquadFilter(); dlLP.type = 'lowpass'; dlLP.frequency.value = 1900;
    var dlFb = a.createGain(); dlFb.gain.value = 0.27;
    var dlMix = a.createGain(); dlMix.gain.value = 0.15;
    musLP.connect(dl); dl.connect(dlLP); dlLP.connect(dlFb); dlFb.connect(dl);
    dlLP.connect(dlMix); dlMix.connect(comp);

    var musSend = a.createGain(); musSend.gain.value = 0.36;
    musLP.connect(musSend); musSend.connect(verb);

    // vinyl crackle, idle at zero until a lo-fi tune wants it
    var cbuf = a.createBuffer(1, Math.floor(a.sampleRate * 4), a.sampleRate);
    var cd = cbuf.getChannelData(0);
    for (var ci = 0; ci < cd.length; ci++) cd[ci] = (Math.random() * 2 - 1) * 0.04;
    var pops = Math.floor(cd.length * 0.004);
    for (var pi2 = 0; pi2 < pops; pi2++) cd[Math.floor(Math.random() * cd.length)] = (Math.random() * 2 - 1);
    var csrc = a.createBufferSource(); csrc.buffer = cbuf; csrc.loop = true;
    var chp = a.createBiquadFilter(); chp.type = 'highpass'; chp.frequency.value = 700;
    var clp = a.createBiquadFilter(); clp.type = 'lowpass'; clp.frequency.value = 4200;
    var cgain = a.createGain(); cgain.gain.value = 0;
    csrc.connect(chp); chp.connect(clp); clp.connect(cgain); cgain.connect(comp);
    csrc.start();

    A.master = master; A.comp = comp; A.verb = verb; A.sfx = sfx; A.music = music;
    A.musLP = musLP; A.musSend = musSend; A.chMix = chMix; A.dlMix = dlMix;
    A.dlTime = dl.delayTime; A.dlFb = dlFb; A.crackle = cgain;
    return a;
  }

  function impulse(a, dur, decay) {
    var len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(2, len, a.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) {
        var t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
    }
    return buf;
  }
  function noiseBuffer(a) {
    if (A.noise) return A.noise;
    var len = Math.floor(a.sampleRate * 2), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    A.noise = b; return b;
  }

  // ── effects ────────────────────────────────────────────────────────────

  // A soft struck-bell voice. Almost every sound in the game is built from
  // this — rounded attack, long gentle tail, nothing sharp anywhere.
  function bell(freq, dur, vol, bright, delay) {
    if (S.muted) return;
    var a = ac(); if (!a) return;
    var t = a.currentTime + (delay || 0);
    var car = a.createOscillator(); car.type = 'sine'; car.frequency.value = freq;
    var mod = a.createOscillator(); mod.type = 'sine'; mod.frequency.value = freq * (bright || 2.01);
    var modG = a.createGain();
    modG.gain.setValueAtTime(freq * 0.9, t);
    modG.gain.exponentialRampToValueAtTime(freq * 0.03, t + dur * 0.5);
    mod.connect(modG); modG.connect(car.frequency);
    var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 0.5;
    var g = a.createGain();
    var peak = Math.max(0.0002, vol * SFX_TRIM);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.022);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    car.connect(lp); lp.connect(g); g.connect(A.sfx);
    car.start(t); mod.start(t);
    car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
  }

  // Air rather than noise — a filtered sweep that breathes instead of hissing.
  function air(dur, vol, from, to) {
    if (S.muted) return;
    var a = ac(); if (!a) return;
    var t = a.currentTime;
    var src = a.createBufferSource(); src.buffer = noiseBuffer(a); src.loop = true;
    var f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(from, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, to), t + dur);
    var g = a.createGain();
    var peak = Math.max(0.0002, vol * SFX_TRIM);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(A.sfx);
    src.start(t); src.stop(t + dur + 0.05);
  }

  // ── voices ─────────────────────────────────────────────────────────────
  function upright(t, freq, dur, vol) {
    var a = A.ctx;
    var o = a.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); sub.connect(f); f.connect(g); g.connect(A.music);
    o.start(t); sub.start(t); o.stop(t + dur + 0.05); sub.stop(t + dur + 0.05);
  }
  function rhodes(t, freq, dur, vol) {
    var a = A.ctx;
    var car = a.createOscillator(); car.type = 'sine'; car.frequency.value = freq;
    var mod = a.createOscillator(); mod.type = 'sine'; mod.frequency.value = freq * 2.005;
    var modG = a.createGain();
    modG.gain.setValueAtTime(freq * 2.2, t);                 // bell-like attack
    modG.gain.exponentialRampToValueAtTime(freq * 0.05, t + 0.4);
    mod.connect(modG); modG.connect(car.frequency);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    car.connect(g); g.connect(A.music);
    car.start(t); mod.start(t); car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);

  function horn(t, freq, dur, vol) {
    var a = A.ctx;
    var o = a.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(freq, t);

    g.gain.setValueAtTime(vol, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  // A slow warm pad under the changes — most of the "vibe" lives here.

    f.frequency.linearRampToValueAtTime(1500, t + dur * 0.45);
    f.frequency.linearRampToValueAtTime(600, t + dur);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.35);   // very slow swell
    g.gain.setValueAtTime(vol, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        o.frequency.value = fr * (d ? 1.004 : 0.996);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); o2.connect(o2g); o2g.connect(f); f.connect(g); g.connect(A.music);

  function env(g, t, dur, vol, attack) {

  function paintGround() {
    var r = mulberry32(1337);

    var g = gctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, Math.max(W, H) * 0.8);
    g.addColorStop(0, '#523016');
    g.addColorStop(0.28, '#33202A');
    g.addColorStop(0.62, '#181435');
    g.addColorStop(1, '#0A0820');
    gctx.fillStyle = g;
    gctx.fillRect(0, 0, W, H);

    // scattered grit

      gctx.fillStyle = 'rgba(255,226,180,' + (0.03 + r() * 0.08).toFixed(3) + ')';
      gctx.fillRect(x, y, s, s);

    for (var j = 0; j < Math.floor((W * H) / 26000); j++) {
      var px = r() * W, py = r() * H;
      if (dist(px, py, W / 2, H / 2) < 90) continue;

      gctx.lineWidth = 1.1;

    // keeping, it is the place he lives

    // fire ring stones
    for (var k = 0; k < 13; k++) {
      var a = (k / 13) * Math.PI * 2 + 0.2;
      var rr = 46 + r() * 5;
      var sx = W / 2 + Math.cos(a) * rr, sy = H / 2 + Math.sin(a) * rr * 0.72;
      gctx.fillStyle = 'rgba(120,112,104,0.32)';
      gctx.beginPath();
      gctx.ellipse(sx, sy, 8 + r() * 3, 6 + r() * 2, a, 0, Math.PI * 2);
      gctx.fill();
      gctx.fillStyle = 'rgba(0,0,0,0.35)';
      gctx.beginPath();
      gctx.ellipse(sx, sy + 2.5, 7 + r() * 2, 3, a, 0, Math.PI * 2);
      gctx.fill();
    }
  }

  // The camp, laid out around the fire and baked into the ground layer once —
  // it costs nothing per frame and the darkness falls over it like everything
  // else. Same furniture as his lobby, just further apart.
  var CAMP_PROPS = [
    ['bed',   -0.86, 0.10], ['wood',  -0.34, 0.30], ['chair',  0.40, 0.26],
    ['desk',   0.78, -0.06], ['line', -0.80, -0.20], ['crates', 0.16, -0.34],
    ['pot',   -0.46, 0.44],  ['duck', -0.62, 0.16]
  ];
  function campProps(g, fx, fy) {
    var rx = Math.min(W, H) * 0.42, ry = Math.min(W, H) * 0.40;
    for (var i = 0; i < CAMP_PROPS.length; i++) {
      var P = CAMP_PROPS[i];
      campProp(g, P[0], fx + P[1] * rx, fy + P[2] * ry);
    }
  }
  function campProp(g, kind, x, y) {
    var i;
    g.save();
    g.translate(x, y);
    g.scale(1.45, 1.45);
    g.fillStyle = 'rgba(0,0,0,0.3)';
    g.beginPath(); g.ellipse(0, 1, 14, 4, 0, 0, 6.29); g.fill();
    if (kind === 'bed') {
      g.fillStyle = '#4A4038';
      g.beginPath(); g.moveTo(-20, 0); g.lineTo(4, -24); g.lineTo(18, 0); g.closePath(); g.fill();
      g.fillStyle = '#3A322C';
      g.beginPath(); g.moveTo(4, -24); g.lineTo(18, 0); g.lineTo(10, 0); g.closePath(); g.fill();
      g.fillStyle = '#7C6A58'; roundRectOn(g, -13, -6, 24, 6, 3); g.fill();
      g.fillStyle = '#C9BBA4'; roundRectOn(g, -13, -8, 8, 4.5, 2.2); g.fill();
    } else if (kind === 'wood') {
      for (i = 0; i < 5; i++) {
        var wy = -1 - (i % 3) * 4.4, wx = -10 + ((i / 3) | 0) * 11 + (i % 3) * 1.5;
        g.fillStyle = i % 2 ? '#6B4A2C' : '#7A5433';
        roundRectOn(g, wx, wy, 13, 4, 2); g.fill();
        g.fillStyle = 'rgba(190,150,90,0.7)';
        g.beginPath(); g.ellipse(wx + 0.8, wy + 2, 1.2, 1.6, 0, 0, 6.29); g.fill();
      }
    } else if (kind === 'chair') {
      g.strokeStyle = '#3F3833'; g.lineWidth = 1.7; g.lineCap = 'round';
      g.beginPath(); g.moveTo(-8.5, 1); g.lineTo(5.5, -7.6); g.stroke();
      g.beginPath(); g.moveTo(7.5, 1); g.lineTo(-6.5, -7.6); g.stroke();
      g.fillStyle = '#4E6B5A';
      g.beginPath();
      g.moveTo(-9.2, -5.4); g.lineTo(5.8, -7); g.lineTo(5.8, -8.8); g.lineTo(-9.2, -7.3);
      g.closePath(); g.fill();
      g.beginPath();
      g.moveTo(3.2, -7.1); g.lineTo(6, -7.3); g.lineTo(8.2, -20.8); g.lineTo(4.4, -20.6);
      g.closePath(); g.fill();
      g.strokeStyle = '#5E4530'; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(-7, -13.6); g.lineTo(5, -14.6); g.stroke();
    } else if (kind === 'desk') {
      g.fillStyle = '#453B31';
      roundRectOn(g, -22, -3, 6, 4, 1); g.fill();
      roundRectOn(g, 16, -3, 6, 4, 1); g.fill();
      g.fillStyle = '#514639'; roundRectOn(g, -24, -5, 48, 2.4, 1); g.fill();
      g.fillStyle = '#4C4137'; roundRectOn(g, -9, -17, 18, 12, 1.4); g.fill();
      g.fillStyle = '#26262C'; roundRectOn(g, -13, -33, 26, 17, 2); g.fill();
      g.fillStyle = 'rgba(70,110,190,0.5)'; roundRectOn(g, -11, -31, 22, 13, 1); g.fill();
      g.fillStyle = '#3A3A42'; roundRectOn(g, -12, -4.6, 22, 2, 0.8); g.fill();
    } else if (kind === 'line') {
      g.strokeStyle = '#4A4038'; g.lineWidth = 1.4; g.lineCap = 'round';
      g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -30); g.stroke();
      g.beginPath(); g.moveTo(-34, -6); g.lineTo(-34, -26); g.stroke();
      g.strokeStyle = 'rgba(180,164,142,0.4)'; g.lineWidth = 0.8;
      g.beginPath(); g.moveTo(0, -29); g.quadraticCurveTo(-17, -22, -34, -25); g.stroke();
      var socks = ['#D9695E', '#7FA8C9', '#E2C46A'];
      for (i = 0; i < 3; i++) {
        g.fillStyle = socks[i];
        roundRectOn(g, -9 - i * 9, -26 + Math.sin(i) * 1.2, 4.6, 6.6, 1.8); g.fill();
      }
    } else if (kind === 'crates') {
      g.fillStyle = '#4C4137'; roundRectOn(g, -14, -10, 14, 11, 1.4); g.fill();
      g.fillStyle = '#43392F'; roundRectOn(g, 1, -8, 12, 9, 1.4); g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.24)'; g.lineWidth = 0.8;
      g.beginPath(); g.moveTo(-14, -4.6); g.lineTo(0, -4.6); g.stroke();
      g.fillStyle = '#C9BBA4'; roundRectOn(g, 3, -12, 5, 4.4, 1.2); g.fill();
    } else if (kind === 'pot') {
      g.strokeStyle = '#4A4038'; g.lineWidth = 1.4; g.lineCap = 'round';
      g.beginPath(); g.moveTo(-11, 0); g.lineTo(0, -22); g.lineTo(11, 0); g.stroke();
      g.fillStyle = '#57514C'; roundRectOn(g, -6, -15, 12, 9, 3); g.fill();
      g.fillStyle = '#6E6660'; g.beginPath(); g.ellipse(0, -15, 6.4, 2, 0, 0, 6.29); g.fill();
    } else if (kind === 'duck') {
      g.fillStyle = '#E9C558';
      g.beginPath(); g.ellipse(0, -2, 4, 3, 0, 0, 6.29); g.fill();
      g.beginPath(); g.arc(2.4, -5.6, 2.4, 0, 6.29); g.fill();
      g.fillStyle = '#E08A3C';
      g.beginPath(); g.moveTo(4.4, -5.6); g.lineTo(7.2, -4.9); g.lineTo(4.4, -4.2); g.closePath(); g.fill();
    }
    g.restore();
  }

  // ────────────────────────────────────────────────────────────── lighting model
  function lightRadius() {
    return (74 + (S.fuel / D.maxFuel) * 196 + S.fire.flare * 90) * D.fireLight * FIELD;
  }
  function lightAt(x, y) {
    var lr = lightRadius();
    var f = clamp(1 - dist(x, y, S.fire.x, S.fire.y) / lr, 0, 1);
    var l = clamp(1 - dist(x, y, S.keeper.x, S.keeper.y) / D.lampR, 0, 1) * 0.85;
    return clamp(Math.max(f * f * 1.15, l), 0, 1);
  }

  // ────────────────────────────────────────────────────────────── particles
  function spark(x, y, n, hue, spd, life) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
      S.parts.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rand(life * 0.5, life), max: life, r: rand(1, 2.6), c: hue, g: 0
      });
    }
  }
  function ember(x, y) {
    S.parts.push({
      x: x + rand(-13, 13), y: y + rand(-6, 6),
      vx: rand(-14, 14), vy: rand(-52, -24),
      life: rand(0.7, 1.7), max: 1.7, r: rand(0.9, 2.1), c: 'ember', g: -8
    });
  }

  // ── feedback: numbers that fly off the thing that produced them ────────
  function floatText(x, y, txt, col, size) {
    S.floats.push({ x: x, y: y, txt: txt, col: col || '#FFD60A', size: size || 15, life: 1.05, max: 1.05, vy: -46 });
  }

  // Heat is the combo: dispel shades back to back and everything scores more.
  function heatMul() { return 1 + S.heat * 0.10; }
  function bumpHeat() {
    S.heat++;
    S.heatT = 3.4;
    if (S.heat > S.bestHeat) S.bestHeat = S.heat;
    if (S.heat === 5 || S.heat === 10 || S.heat === 15 || S.heat % 10 === 0) {
      toast('Heat ×' + S.heat, S.heat >= 15 ? 'The dark is giving ground' : 'Keep them coming');
      bell(392 + Math.min(S.heat, 24) * 26, 0.5, 0.04, 2.4);
    }
  }
  function addScore(n, x, y, col) {
    var v = n * D.scoreMul * heatMul();
    S.score += v;
    if (x !== undefined) floatText(x, y, '+' + Math.round(v), col || 'rgba(255,214,10,0.95)', 14);
    return v;
  }

  function spawnMote(x, y) {
    S.motes.push({ x: x, y: y, vx: rand(-40, 40), vy: rand(-40, 40), life: 9, val: 4 });
  }

  // ────────────────────────────────────────────────────────────── spawning
  // wood gets scarcer and lies farther out as the nights wear on
  function logInterval() { return K.logEvery + Math.min(1.9, (nightP(S.night) - 1) * 0.2); }
  // Distance is the tension; not being able to see was never the tension. The
  // logs carry their own ember now, so they can sit as far out as they always did.
  function logMinDist() { return Math.min(Math.min(W, H) * 0.40, (126 + (nightP(S.night) - 1) * 15) * FIELD); }
  // and a ceiling, so nothing lands in a corner you would spend half the night
  // walking to. The arena is taller than it is wide; the play is round.
  function logMaxDist() { return Math.min(W, H) * 0.72; }

  function spawnLog() {
    if (S.logs.length >= D.maxLogs) return;
    var minD = logMinDist(), maxD = logMaxDist();
    for (var tries = 0; tries < 30; tries++) {
      var x = rand(px(46), W - px(46)), y = rand(px(88), H - px(96));
      var dd = dist(x, y, S.fire.x, S.fire.y);
      if (dd < minD || dd > maxD) continue;
      S.logs.push({ x: x, y: y, a: rand(0, Math.PI), pop: 0 });
      return;
    }
    // arena too small to honour the min distance — drop it on the ring instead
    var ang = rand(0, 6.283);
    S.logs.push({
      x: clamp(S.fire.x + Math.cos(ang) * minD, px(46), W - px(46)),
      y: clamp(S.fire.y + Math.sin(ang) * minD, px(88), H - px(96)),
      a: rand(0, Math.PI), pop: 0
    });
  }

  function spawnShade() {
    var edge = Math.floor(rand(0, 4)), x, y, m = 40;
    if (edge === 0) { x = rand(-m, W + m); y = -m; }
    else if (edge === 1) { x = W + m; y = rand(-m, H + m); }
    else if (edge === 2) { x = rand(-m, W + m); y = H + m; }
    else { x = -m; y = rand(-m, H + m); }

    // husks only start walking on night 5, and never crowd out everything else
    var NP = nightP(S.night);
    var huskChance = S.night >= 8 ? clamp((NP - 4) * 0.09, 0, 0.34) : 0;
    var wispChance = S.night >= 4 ? clamp(0.1 + NP * 0.05, 0, 0.42) : 0;
    var roll = Math.random();
    var kind = roll < huskChance ? 'husk' : (roll < huskChance + wispChance ? 'wisp' : 'crawler');
    var T = SHADE[kind];
    var hp = T.hp + nightP(S.night) * T.hpN * 1.35;

    S.shades.push({
      kind: kind, t: T,
      x: x, y: y,
      hp: hp, maxHp: hp,
      spd: (rand(T.spd[0], T.spd[1]) + NP * T.spdN * 1.3) * 0.78 * FIELD,
      r: T.r,
      kx: 0, ky: 0,       // knockback velocity
      wob: rand(0, 6.28),
      latched: 0,
      hit: 0
    });
  }

  // Three kinds of dark. `burn` is how fast light eats them — a husk barely
  // cares about firelight, so it has to be met out in the open with a flare.
  var SHADE = {
    crawler: { hp: 6.0, hpN: 1.4, spd: [30, 41], spdN: 1.1, r: 15, burn: 5.2, drain: 5.4, wob: 3.4, sway: 0.22, score: 12, heal: 1.1, tint: '66,28,92',  rim: '188,110,255', eye: 'rgba(255,107,107,0.80)', eyeGap: 4.4 },
    wisp:    { hp: 3.4, hpN: 0.0, spd: [66, 80], spdN: 0.0, r: 10, burn: 6.5, drain: 3.6, wob: 7.0, sway: 0.50, score: 8,  heal: 0.7, tint: '104,72,214', rim: '168,196,255', eye: 'rgba(200,180,255,0.85)', eyeGap: 3.2 },
    husk:    { hp: 13,  hpN: 2.2, spd: [22, 30], spdN: 0.5, r: 19, burn: 2.0, drain: 7.6, wob: 2.0, sway: 0.14, score: 26, heal: 2.6, tint: '38,18,56',  rim: '128,88,190', eye: 'rgba(255,168,32,0.90)', eyeGap: 6.0 }
  };

  // ────────────────────────────────────────────────────────────── input
  var keys = {};
  var stick = { id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0, on: false };

  window.addEventListener('keydown', function (e) {
    var tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) return;
    var k = e.key.toLowerCase();
    keys[k] = true;
    if (k === ' ') { e.preventDefault(); if (!e.repeat) doSwing(); }
    if (k === 'f' || k === 'shift') { e.preventDefault(); doFlare(); }
    if (k === 'escape' || k === 'p') togglePause();
    if (k === 'enter' && (S.mode === 'menu' || S.mode === 'over')) startGame();
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  function localPt(e) {
    return { x: e.clientX / ZOOM, y: e.clientY / ZOOM };
  }
  cvs.addEventListener('pointerdown', function (e) {
    if (S.mode !== 'play') return;
    e.preventDefault();
    var p = localPt(e);
    if (stick.id === null) {
      stick.id = e.pointerId; stick.ox = p.x; stick.oy = p.y;
      stick.x = p.x; stick.y = p.y; stick.dx = 0; stick.dy = 0; stick.on = true;
      try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
    } else {
      doSwing(); // second finger anywhere = swing the brand
    }
  }, { passive: false });

  cvs.addEventListener('pointermove', function (e) {
    if (e.pointerId !== stick.id) return;
    var p = localPt(e);
    stick.x = p.x; stick.y = p.y;
    var dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    var d = Math.hypot(dx, dy);
    var MAX = px(54);
    if (d > MAX) {
      if (META.opts.stick === 'drift') {   // the origin follows your thumb
        stick.ox += dx * (1 - MAX / d);
        stick.oy += dy * (1 - MAX / d);
        dx = stick.x - stick.ox; dy = stick.y - stick.oy;
      } else {                             // fixed: the origin stays put
        dx *= MAX / d; dy *= MAX / d;
      }
      d = MAX;
    }
    var dead = px(7);
    var n = d < dead ? 0 : clamp((d - dead) / (MAX - dead), 0, 1);
    n = n * (0.4 + 0.6 * n);            // fine control near the middle, full tilt at the rim
    if (d > 0.001) { stick.dx = dx / d * n; stick.dy = dy / d * n; }
    else { stick.dx = 0; stick.dy = 0; }
  }, { passive: false });

  function endStick(e) {
    if (e.pointerId !== stick.id) return;
    stick.id = null; stick.on = false; stick.dx = 0; stick.dy = 0;
  }
  cvs.addEventListener('pointerup', endStick);
  cvs.addEventListener('pointercancel', endStick);

  var flareBtn = document.getElementById('flare');
  flareBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); doFlare(); });
  var brandBtn = document.getElementById('brand');
  brandBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); doSwing(); });
  document.getElementById('pause').addEventListener('click', togglePause);

  // ────────────────────────────────────────────────────────────── actions
  function doFlare() {
    if (S.mode !== 'play') return;
    var k = S.keeper;
    if (k.cd > 0 || S.fuel < D.flareCost + 2) { UI.denied(); return; }
    k.cd = D.flareCd;
    S.fuel -= D.flareCost;
    S.flares++;
    S.fire.flare = Math.max(S.fire.flare, 1);
    S.shake = Math.max(S.shake, 7);
    SFX.flare(); buzz(22);
    spark(k.x, k.y, 22, 'gold', 230, 0.5);
    burst(k.x, k.y, D.flareR, 3.2, 1);

    if (u('cinder')) {
      var ring = 3 + u('cinder');
      for (var c = 0; c < ring; c++) {
        var ca = (c / ring) * Math.PI * 2 + rand(-0.3, 0.3);
        var cd2 = D.flareR * rand(0.4, 0.8);
        S.cinders.push({ x: k.x + Math.cos(ca) * cd2, y: k.y + Math.sin(ca) * cd2,
                         r: 30 + u('cinder') * 8, life: 4, max: 4 });
      }
    }
  }

  function angDiff(a, b) {
    var d = (a - b) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  // The brand — a burning stick off the fire. Costs nothing but has to be
  // aimed and closes the distance, which is the trade against the flare.
  function doSwing() {
    if (S.mode !== 'play') return;
    var k = S.keeper;
    if (k.swingCd > 0) return;
    k.swingCd = D.swingCd;
    k.swing = D.swingDur;
    k.swingDir = k.face;
    k.lunge = 132;                    // he steps into it rather than swinging flat-footed

    // a hotter fire makes a hotter brand
    var heat = 0.75 + 0.5 * clamp(S.fuel / D.maxFuel, 0, 1);
    var dmg = D.brandDmg * heat;
    var half = D.brandArc / 2;
    var before = S.kills, hits = 0;

    for (var i = S.shades.length - 1; i >= 0; i--) {
      var sh = S.shades[i];
      var d = dist(sh.x, sh.y, k.x, k.y);
      if (d > D.brandR + sh.r) continue;
      var ang = Math.atan2(sh.y - k.y, sh.x - k.x);
      // anything you are practically stood on counts as in front of you —
      // at that range the angle is noise, and missing it feels broken
      var hugging = d < K.keeperR + sh.r + 6;
      if (!hugging && D.brandArc < Math.PI * 2 && Math.abs(angDiff(ang, k.swingDir)) > half) continue;
      sh.kx += Math.cos(ang) * 300;
      sh.ky += Math.sin(ang) * 300;
      sh.hit = 0.28;
      sh.latched = 0;
      sh.hp -= dmg;
      hits++;
      spark(sh.x, sh.y, 4, 'gold', 90, 0.3);
      if (sh.hp <= 0) killShade(i);
    }
    S.brandKills += S.kills - before;

    SFX.swing(hits > 0);
    if (hits) { buzz(10); S.shake = Math.max(S.shake, 4); }
  }

  // Shared by the flare and by Pyre: knock everything back, burn it, and pay
  // the Backdraft refund for whatever it caught.
  function burst(x, y, radius, dmg, refund) {
    var caught = 0;
    for (var i = S.shades.length - 1; i >= 0; i--) {
      var s = S.shades[i];
      var d = dist(s.x, s.y, x, y);
      if (d > radius) continue;
      var force = (1 - d / radius);
      var ang = Math.atan2(s.y - y, s.x - x);
      s.kx += Math.cos(ang) * 420 * force;
      s.ky += Math.sin(ang) * 420 * force;
      s.latched = 0;
      s.hit = 0.25;
      s.hp -= dmg * force + 1;
      caught++;
      if (s.hp <= 0) killShade(i);
    }
    if (refund && u('backdraft') && caught) {
      var back = Math.min(caught * 2 * u('backdraft'), 30);
      S.fuel = Math.min(D.maxFuel, S.fuel + back);
      floatText(x, y - 30, '+' + back + ' back', 'rgba(99,230,190,0.95)', 14);
    }
    return caught;
  }

  function killShade(i) {
    var s = S.shades[i];
    spark(s.x, s.y, Math.round(s.r * 0.9), 'shade', 150, 0.55);
    spark(s.x, s.y, 5, 'gold', 90, 0.4);
    S.shades.splice(i, 1);
    S.kills++;
    if (s.kind === 'husk') S.husks++;

    // dispelling a shade gives a little life back — the way home from a bad
    // night is killing your way out of it
    if (S.health < D.maxHealth) {
      var mend = s.t.heal * D.mend;
      S.health = Math.min(D.maxHealth, S.health + mend);
      S.mended += mend;
      if (S.mended >= 5) {                       // pooled, so it isn't a wall of +1s
        floatText(S.keeper.x, S.keeper.y - 52, '+' + Math.round(S.mended) + ' hp', 'rgba(99,230,190,0.95)', 14);
        S.mended = 0;
      }
    }
    S.hitstop = Math.min(0.055, (S.hitstop || 0) + (s.kind === 'husk' ? 0.05 : 0.028));
    bumpHeat();
    addScore(s.t.score, s.x, s.y - 12);
    if (u('tinder') && Math.random() < 0.28 * u('tinder')) spawnMote(s.x, s.y);
    SFX.kill();
  }

  // ────────────────────────────────────────────────────────────── update
  function update(dt) {
    S.time += dt;
    S.shake = Math.max(0, S.shake - dt * 26);
    S.fire.flare = Math.max(0, S.fire.flare - dt * 1.9);

    // embers off the fire
    if (Math.random() < dt * (12 + S.fuel * 0.5)) ember(S.fire.x, S.fire.y - 8);

    // particles
    for (var p = S.parts.length - 1; p >= 0; p--) {
      var pt = S.parts[p];
      pt.life -= dt;
      if (pt.life <= 0) { S.parts.splice(p, 1); continue; }
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vy += (pt.g || 0) * dt;
      pt.vx *= (1 - dt * 1.6); pt.vy *= (1 - dt * 1.6);
    }

    // floating numbers
    for (var ft = S.floats.length - 1; ft >= 0; ft--) {
      var f2 = S.floats[ft];
      f2.life -= dt;
      if (f2.life <= 0) { S.floats.splice(ft, 1); continue; }
      f2.y += f2.vy * dt;
      f2.vy *= (1 - dt * 2.4);
    }

    // heat cools off if you stop dispelling
    if (S.heatT > 0) { S.heatT -= dt; if (S.heatT <= 0) S.heat = 0; }

    if (S.mode === 'dawn') {
      S.dawnHold -= dt;
      if (S.dawnHold <= 0) { S.nightT = 0; nightHeld(); }
      return;
    }
    if (S.mode !== 'play') return;

    // ── keeper movement
    var k = S.keeper;
    var ix = 0, iy = 0;
    if (keys['arrowleft'] || keys['a']) ix -= 1;
    if (keys['arrowright'] || keys['d']) ix += 1;
    if (keys['arrowup'] || keys['w']) iy -= 1;
    if (keys['arrowdown'] || keys['s']) iy += 1;
    var kd = Math.hypot(ix, iy);
    if (kd > 0) { ix /= kd; iy /= kd; }
    if (stick.on) { ix = stick.dx; iy = stick.dy; }

    k.guard = Math.max(0, (k.guard || 0) - dt);
    k.swingCd = Math.max(0, (k.swingCd || 0) - dt);
    k.swing = Math.max(0, (k.swing || 0) - dt);
    var load = Math.max(0.78, 1 - k.carry * D.carryPer);
    var speed = D.speed * load;
    var tvx = ix * speed, tvy = iy * speed;

    // He has weight. He leans into a start, coasts half a step when you let
    // go, and digs in harder when you ask him to turn against his own
    // momentum — an armful of wood makes all three slower.
    var pushing = Math.hypot(ix, iy) > 0.02;
    var against = pushing && (k.vx * tvx + k.vy * tvy) < 0;
    var tau = (!pushing ? 0.19 : against ? 0.085 : 0.115) * (1 + k.carry * 0.085);
    var m = 1 - Math.exp(-dt / tau);
    k.vx += (tvx - k.vx) * m;
    k.vy += (tvy - k.vy) * m;

    // a short shove forward on the swing, so the brand carries him into it
    if (k.lunge > 0) {
      k.x += Math.cos(k.face) * k.lunge * dt;
      k.y += Math.sin(k.face) * k.lunge * dt;
      k.lunge = Math.max(0, k.lunge - dt * 460);
    }
    k.x = clamp(k.x + k.vx * dt, px(16), W - px(16));
    k.y = clamp(k.y + k.vy * dt, px(60), H - px(24));

    var sp = Math.hypot(k.vx, k.vy);
    // the body turns rather than snapping, but fast enough to aim with
    if (sp > 12) {
      var wa = Math.atan2(k.vy, k.vx), dA = wa - k.face;
      while (dA > Math.PI) dA -= 6.283185307;
      while (dA < -Math.PI) dA += 6.283185307;
      k.face += dA * Math.min(1, dt * 17);
    }
    // stride length, not a metronome: he takes longer paces when he is quick
    k.step += sp * dt * 0.105;
    k.walk += ((sp > 26 ? 1 : 0) - k.walk) * Math.min(1, dt * 9);
    k.lean += ((sp > 26 ? 0.1 : 0) - k.lean) * Math.min(1, dt * 6);
    if (k.vx < -8) k.flip = -1; else if (k.vx > 8) k.flip = 1;
    // a scuff of dust under each footfall
    k.stepT -= sp * dt * 0.021;
    if (k.stepT <= 0 && sp > 40) {
      k.stepT = 1;
      S.parts.push({ x: k.x + rand(-5, 5), y: k.y + 13, vx: -k.vx * 0.06, vy: rand(-6, -14),
                     g: 26, r: rand(1.4, 2.6), life: 0.38, max: 0.38, c: 'dust' });
    }
    k.cd = Math.max(0, k.cd - dt);

    // keep the keeper out of the coals
    var fd = dist(k.x, k.y, S.fire.x, S.fire.y);
    if (fd < K.fireCoreR) {
      var a = Math.atan2(k.y - S.fire.y, k.x - S.fire.x);
      k.x = S.fire.x + Math.cos(a) * K.fireCoreR;
      k.y = S.fire.y + Math.sin(a) * K.fireCoreR;
    }

    // ── on a landmark night, somebody is out here holding the other side
    if (S.ally) {
      var AL = S.ally;
      AL.t += dt;
      AL.x = S.fire.x + Math.cos(AL.t * 0.5) * K.fireCoreR * 2.1;
      AL.y = S.fire.y + Math.sin(AL.t * 0.5) * K.fireCoreR * 1.5;
      AL.pulse = Math.max(0, AL.pulse - dt * 2.2);
      AL.cd -= dt;
      if (AL.cd <= 0) {
        AL.cd = 3.1;
        var hit = 0;
        for (var ai = S.shades.length - 1; ai >= 0; ai--) {
          var as = S.shades[ai];
          if (dist(as.x, as.y, AL.x, AL.y) > px(96)) continue;
          var aa = Math.atan2(as.y - AL.y, as.x - AL.x);
          as.kx += Math.cos(aa) * 260; as.ky += Math.sin(aa) * 260;
          as.hit = 0.28; as.latched = 0;
          as.hp -= 3.4 + nightP(S.night) * 0.5;
          hit++;
          if (as.hp <= 0) killShade(ai);
        }
        if (hit) { AL.pulse = 1; S.allyHits += hit; spark(AL.x, AL.y, 8, 'gold', 130, 0.5); }
      }
    }

    // ── logs
    S.logT -= dt;
    if (S.logT <= 0) { spawnLog(); S.logT = logInterval() * D.logRate * rand(0.75, 1.3); }
    var inFlight = 0;
    for (var fi = 0; fi < S.logs.length; fi++) if (S.logs[fi].fly) inFlight++;

    for (var i = S.logs.length - 1; i >= 0; i--) {
      var lg = S.logs[i];
      lg.pop = Math.min(1, lg.pop + dt * 3.2);
      if (lg.cool > 0) { lg.cool -= dt; lg.fly = 0; continue; }

      var room = k.carry + inFlight < D.carry;
      var ld = dist(lg.x, lg.y, k.x, k.y);

      if (!lg.fly && room && ld < D.pickupR) {
        lg.fly = 1;                       // it has noticed you
        lg.vx = lg.vx || 0; lg.vy = lg.vy || 0;
        inFlight++;
      } else if (lg.fly && k.carry + (inFlight - 1) >= D.carry && ld > 24) {
        lg.fly = 0; inFlight--;           // arms filled up — it settles again
      }

      if (lg.fly) {
        var la = Math.atan2(k.y - lg.y, k.x - lg.x);
        var pull = 620 + (1 - clamp(ld / Math.max(D.pickupR, 1), 0, 1)) * 900;
        lg.vx += Math.cos(la) * pull * dt;
        lg.vy += Math.sin(la) * pull * dt;
        lg.vx *= Math.pow(0.02, dt); lg.vy *= Math.pow(0.02, dt);
        lg.x += lg.vx * dt; lg.y += lg.vy * dt;
        lg.a += dt * 7;                   // tumbling as it comes
        if (ld < 15) {                    // landed in your hands
          S.logs.splice(i, 1);
          inFlight--;
          k.carry++;
          SFX.pick(); buzz(8);
          spark(k.x, k.y - 20, 6, 'wood', 80, 0.35);
          floatText(k.x, k.y - 46, '+1 log', 'rgba(190,150,90,0.95)', 13);
        }
      }
    }

    // ── motes of fire left by dispelled shades (Tinderburst)
    for (var mi = S.motes.length - 1; mi >= 0; mi--) {
      var mo = S.motes[mi];
      mo.life -= dt;
      if (mo.life <= 0) { S.motes.splice(mi, 1); continue; }
      var md = dist(mo.x, mo.y, k.x, k.y);
      if (md < 120) {                       // drift toward the keeper
        var ma = Math.atan2(k.y - mo.y, k.x - mo.x);
        var pull = (1 - md / 120) * 340;
        mo.vx += Math.cos(ma) * pull * dt;
        mo.vy += Math.sin(ma) * pull * dt;
      }
      mo.x += mo.vx * dt; mo.y += mo.vy * dt;
      mo.vx *= Math.pow(0.12, dt); mo.vy *= Math.pow(0.12, dt);
      if (md < 20) {
        S.fuel = Math.min(D.maxFuel, S.fuel + mo.val);
        floatText(mo.x, mo.y - 8, '+' + mo.val, 'rgba(255,214,10,0.95)', 13);
        spark(mo.x, mo.y, 5, 'gold', 70, 0.3);
        bell(1175, 0.26, 0.03, 3.2);
        S.motes.splice(mi, 1);
      }
    }

    // ── burning ground left by flares (Cinder Trail)
    for (var ci = S.cinders.length - 1; ci >= 0; ci--) {
      var cd3 = S.cinders[ci];
      cd3.life -= dt;
      if (cd3.life <= 0) { S.cinders.splice(ci, 1); continue; }
      for (var cs = S.shades.length - 1; cs >= 0; cs--) {
        var sh = S.shades[cs];
        if (dist2(sh.x, sh.y, cd3.x, cd3.y) < cd3.r * cd3.r) {
          sh.hp -= 4.5 * dt;
          sh.hit = Math.max(sh.hit, 0.1);
          if (sh.hp <= 0) killShade(cs);
        }
      }
    }

    // deposit — everything you are carrying goes on at once
    if (k.carry && fd < D.depositR) {
      var loads = k.carry;
      k.carry = 0;
      var gain = D.logFuel * loads;
      var room = D.maxFuel - S.fuel;
      S.fuel = Math.min(D.maxFuel, S.fuel + gain);
      S.logsBurned += loads;
      addScore(15 * loads, S.fire.x, S.fire.y - 46, 'rgba(255,176,58,0.95)');
      floatText(S.fire.x, S.fire.y - 26, '+' + Math.round(Math.min(gain, Math.max(room, 0))) + ' fire', 'rgba(255,232,140,0.95)', 16);
      S.fire.flare = Math.max(S.fire.flare, 0.75);
      S.shake = Math.max(S.shake, 3.5);
      SFX.feed(); buzz(14);
      for (var e = 0; e < 16; e++) ember(S.fire.x, S.fire.y - 6);
      spark(S.fire.x, S.fire.y - 6, 12, 'gold', 130, 0.7);

      // Pyre — every fourth log goes up properly
      if (u('pyre')) {
        S.pyreCount += loads;
        while (S.pyreCount >= 4) {
          S.pyreCount -= 4;
          S.fire.flare = 1.2;
          S.shake = Math.max(S.shake, 10);
          spark(S.fire.x, S.fire.y, 30, 'gold', 260, 0.7);
          burst(S.fire.x, S.fire.y, D.flareR * 1.25, 5, 0);
          floatText(S.fire.x, S.fire.y - 62, 'PYRE', 'rgba(255,120,20,0.95)', 20);
          SFX.flare();
        }
      }
    }

    // ── shades
    S.spawnT -= dt;
    var interval = Math.max(0.5, 1.95 - (nightP(S.night) - 1) * 0.152);
    if (S.spawnT <= 0 && S.shades.length < 32) {
      spawnShade();
      S.spawnT = interval * rand(0.7, 1.3);
    }

    var drain = (K.baseDrain + (nightP(S.night) - 1) * K.drainPerNight) * D.drainMul;
    for (var j = S.shades.length - 1; j >= 0; j--) {
      var s = S.shades[j];
      s.wob += dt * s.t.wob;
      s.hit = Math.max(0, s.hit - dt);

      var li = lightAt(s.x, s.y);
      s.hp -= li * s.t.burn * D.burnMul * dt;
      if (s.hp <= 0) { killShade(j); continue; }

      var sd = dist(s.x, s.y, S.fire.x, S.fire.y);
      if (sd < K.fireCoreR + 8) {
        s.latched = 1;
        drain += s.t.drain;
      } else {
        s.latched = 0;
        var ang = Math.atan2(S.fire.y - s.y, S.fire.x - s.x);
        var slow = 1 - 0.6 * li;
        var wob = Math.sin(s.wob) * s.t.sway;
        s.x += Math.cos(ang + wob) * s.spd * slow * dt;
        s.y += Math.sin(ang + wob) * s.spd * slow * dt;
      }

      // they give each other room, so a crowd reads as a crowd rather than
      // one very dark blob, and a brand sweep catches a spread of them
      for (var sj = j - 1; sj >= 0; sj--) {
        var o2 = S.shades[sj];
        if (s.latched || o2.latched) continue;   // at the fire they press in, and should
        var ddx = o2.x - s.x, ddy = o2.y - s.y;
        var want = (s.r + o2.r) * 0.82;
        var d2 = ddx * ddx + ddy * ddy;
        if (d2 > want * want || d2 < 0.01) continue;
        var dd = Math.sqrt(d2), push = (want - dd) * 2.4 * dt;
        var nx = ddx / dd, ny = ddy / dd;
        s.x -= nx * push; s.y -= ny * push;
        o2.x += nx * push; o2.y += ny * push;
      }

      // knockback
      s.x += s.kx * dt; s.y += s.ky * dt;
      s.kx *= Math.pow(0.02, dt); s.ky *= Math.pow(0.02, dt);

      // touching a shade costs you health — but never your footing
      if (k.guard <= 0 && dist2(s.x, s.y, k.x, k.y) < (s.r + K.keeperR) * (s.r + K.keeperR)) {
        k.guard = D.iframe;
        var ka = Math.atan2(k.y - s.y, k.x - s.x);
        s.kx = -Math.cos(ka) * 210; s.ky = -Math.sin(ka) * 210;   // it recoils, you stand firm
        S.health -= D.hitDamage;
        S.damageTaken += D.hitDamage;
        S.shake = Math.max(S.shake, 9);
        SFX.hurt(); buzz([12, 40, 12]);
        floatText(k.x, k.y - 42, '-' + D.hitDamage, 'rgba(255,69,58,0.98)', 19);
        S.heat = 0; S.heatT = 0;
        if (k.carry > 0) {                    // you fumble one, not the armful
          k.carry--;
          var da = ka + rand(-1.1, 1.1);      // flung back past the shade
          var dd = D.pickupR + rand(26, 52);
          S.logs.push({
            x: clamp(k.x - Math.cos(da) * dd, 30, W - 30),
            y: clamp(k.y - Math.sin(da) * dd, 90, H - 40),
            a: rand(0, 3.14), pop: 0, cool: 0.7, fly: 0, vx: 0, vy: 0
          });
        }
        if (S.health <= 0) { S.health = 0; gameOver('fell'); return; }
      }
    }

    // ── fuel + night clock
    var wasLow = S.fuel <= 20;
    S.fuel -= drain * dt;
    S.score += dt * 6 * D.scoreMul;

    if (S.fuel <= 20 && !wasLow) SFX.low();
    if (S.fuel <= 0) {
      if (u('emberheart') && !S.revived) {
        S.revived = true;
        S.fuel = 35;
        S.fire.flare = 1.4;
        S.shake = 16;
        S.shades.length = 0;
        spark(S.fire.x, S.fire.y, 44, 'gold', 260, 1.1);
        floatText(S.fire.x, S.fire.y - 70, 'IT CATCHES', 'rgba(255,120,20,0.98)', 22);
        toast('Ember Heart', 'The fire takes again');
        SFX.dawn(); buzz([40, 60, 40]);
      } else {
        S.fuel = 0; gameOver('dark'); return;
      }
    }

    S.nightT += dt;
    if (S.nightT >= K.nightLen) breakOfDawn();
  }

  function breakOfDawn() {
    S.mode = 'dawn';
    S.dawnHold = K.dawnHold;
    S.score += 120 * S.night * D.scoreMul;
    S.shake = 6;
    for (var i = S.shades.length - 1; i >= 0; i--) {
      spark(S.shades[i].x, S.shades[i].y, 8, 'shade', 190, 0.6);
    }
    S.shades.length = 0;
    SFX.dawn(); buzz([18, 60, 18]);
    toast('Dawn', 'Night ' + S.night + ' held');
  }

  // ────────────────────────────────────────────────────────────── render
  function render() {
    var ox = 0, oy = 0;
    if (S.shake > 0.2) { ox = rand(-S.shake, S.shake) * 0.5; oy = rand(-S.shake, S.shake) * 0.5; }

    ctx.setTransform(VS, 0, 0, VS, ox * VS, oy * VS);
    ctx.clearRect(-20, -20, W + 40, H + 40);
    ctx.drawImage(groundCvs, 0, 0, W, H);

    drawCinders();
    drawLogs();
    drawFire();
    drawShades();
    drawAlly();
    drawKeeper();

    drawDarkness();
    drawGlow();
    drawParticles();
    drawMotes();
    drawFloats();
    drawStick();

    ctx.setTransform(VS, 0, 0, VS, 0, 0);
  }

  function drawLogs() {
    for (var i = 0; i < S.logs.length; i++) {
      var l = S.logs[i];
      var sc = 0.6 + 0.4 * l.pop;
      var li = lightAt(l.x, l.y);
      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.a);
      ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.ellipse(0, 6, 16, 5, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = 'rgb(' + Math.round(74 + li * 116) + ',' + Math.round(46 + li * 72) + ',' + Math.round(26 + li * 26) + ')';
      roundRect(-16, -6, 32, 12, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(20,12,8,0.75)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(-6, 6); ctx.moveTo(5, -6); ctx.lineTo(5, 6); ctx.stroke();
      ctx.fillStyle = 'rgba(' + Math.round(150 + li * 90) + ',' + Math.round(112 + li * 66) + ',66,0.95)';
      ctx.beginPath(); ctx.ellipse(-15, 0, 3, 5.5, 0, 0, 6.29); ctx.fill();
      ctx.restore();
    }
  }

  function drawCinders() {
    if (!S.cinders.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.cinders.length; i++) {
      var c = S.cinders[i];
      var t = clamp(c.life / c.max, 0, 1);
      var g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
      g.addColorStop(0, 'rgba(255,150,40,' + (0.30 * t).toFixed(3) + ')');
      g.addColorStop(0.6, 'rgba(220,80,20,' + (0.16 * t).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(160,40,10,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.29); ctx.fill();
      if (Math.random() < 0.25) ember(c.x + rand(-c.r * 0.6, c.r * 0.6), c.y);
    }
    ctx.restore();
  }

  function drawMotes() {
    if (!S.motes.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.motes.length; i++) {
      var m = S.motes[i];
      var pulse = 0.7 + 0.3 * Math.sin(S.time * 9 + i);
      var fade = clamp(m.life / 1.6, 0, 1);
      var g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 16 * pulse);
      g.addColorStop(0, 'rgba(255,236,150,' + (0.95 * fade).toFixed(3) + ')');
      g.addColorStop(0.35, 'rgba(255,176,58,' + (0.5 * fade).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,140,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x, m.y, 16 * pulse, 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  function drawFloats() {
    if (!S.floats.length) return;
    ctx.save();
    ctx.textAlign = 'center';
    for (var i = 0; i < S.floats.length; i++) {
      var f = S.floats[i];
      var t = clamp(f.life / f.max, 0, 1);
      var rise = (1 - t) * 8;
      ctx.globalAlpha = t < 0.35 ? t / 0.35 : 1;
      ctx.font = '700 ' + (f.size / ZOOM).toFixed(1) + 'px ' + "-apple-system, 'SF Pro Text', system-ui, sans-serif";
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillText(f.txt, f.x, f.y - rise + 1.5);
      ctx.fillStyle = f.col;
      ctx.fillText(f.txt, f.x, f.y - rise);
    }
    ctx.restore();
  }

  function drawFire() {
    var f = S.fire;
    var lvl = S.fuel / D.maxFuel;
    var t = S.time;
    var pulse = 1 + Math.sin(t * 9) * 0.06 + Math.sin(t * 3.3) * 0.04 + S.fire.flare * 0.5;
    var h = (16 + lvl * 40) * pulse;

    // coals
    ctx.save();
    ctx.fillStyle = 'rgba(28,14,6,0.42)';
    ctx.beginPath(); ctx.ellipse(f.x, f.y + 12, 40, 13, 0, 0, 6.29); ctx.fill();
    for (var i = 0; i < 7; i++) {
      var a = i * 0.9 + 0.4;
      var cg = 0.35 + 0.45 * lvl + Math.sin(t * 4 + i) * 0.12;
      ctx.fillStyle = 'rgba(' + Math.round(176 + 79 * cg) + ',' + Math.round(54 + 58 * cg) + ',18,' + clamp(cg, 0.18, 0.95) + ')';
      ctx.beginPath();
      ctx.ellipse(f.x + Math.cos(a) * 17, f.y + 8 + Math.sin(a) * 6, 7, 4, a, 0, 6.29);
      ctx.fill();
    }
    ctx.restore();

    if (lvl <= 0.001) return;

    // flame body — additive, three tapering tongues
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var tips = [
      { w: 25, h: 1.00, sp: 4.4, sw: 5.5, top: 'rgba(255,120,20,0.00)', mid: 'rgba(226,96,26,0.50)', hot: 'rgba(255,150,40,0.34)' },
      { w: 17, h: 0.74, sp: 6.7, sw: 4.0, top: 'rgba(255,190,60,0.00)', mid: 'rgba(255,168,32,0.62)', hot: 'rgba(255,206,90,0.48)' },
      { w: 9.5, h: 0.48, sp: 9.1, sw: 2.6, top: 'rgba(255,244,190,0.00)', mid: 'rgba(255,240,180,0.85)', hot: 'rgba(255,252,232,0.92)' }
    ];
    for (var L = 0; L < tips.length; L++) {
      var T = tips[L];
      var w = T.w * pulse * (0.55 + lvl * 0.55);
      var hh = h * T.h;
      var sway = Math.sin(t * T.sp + L * 1.7) * T.sw;
      var flick = 1 + Math.sin(t * (T.sp * 2.3) + L) * 0.07;
      var base = f.y + 9;
      var tipY = base - hh * flick;

      var fg = ctx.createLinearGradient(f.x, base, f.x, tipY);
      fg.addColorStop(0, T.hot);
      fg.addColorStop(0.42, T.mid);
      fg.addColorStop(1, T.top);

      ctx.beginPath();
      ctx.moveTo(f.x - w, base);
      // left edge sweeps in toward the tip
      ctx.bezierCurveTo(f.x - w * 0.98, base - hh * 0.36,
                        f.x - w * 0.42 + sway * 0.7, base - hh * 0.68,
                        f.x + sway, tipY);
      // right edge back down
      ctx.bezierCurveTo(f.x + w * 0.42 + sway * 0.7, base - hh * 0.68,

      roundRectOn(g, -5.6, -7.4, 11.2, 7.8, 0.9); g.fill();
      g.fillStyle = '#EFE6D2';
      roundRectOn(g, -4.9, -6.9, 4.5, 6.7, 0.6); g.fill();
      roundRectOn(g, 0.4, -6.9, 4.5, 6.7, 0.6); g.fill();
      g.strokeStyle = 'rgba(128,110,88,0.5)'; g.lineWidth = 0.32;

        g.beginPath(); g.moveTo(1.0, by); g.lineTo(4.2, by); g.stroke();

      g.beginPath(); g.moveTo(0, -7.1); g.lineTo(0, -0.4); g.stroke();

  function drawFace(g, o, B, amt, skin) {
    // Eyes a shade above the middle of the head, brows up on the forehead the
    // hair no longer covers, mouth high enough to leave him a chin.
    var ex = 3.7, ey = -10.1, s, e = o.expr || 'normal';
    var browY = -13.6, my = -5.2;

      g.strokeStyle = ink; g.lineWidth = 1.05 * B.brow; g.lineCap = 'round';
      for (var b = -1; b <= 1; b += 2) {

      else { eyeArc(-ex, true); eyeArc(ex, true); }

      eyeBall(-ex, eyeR * (1 + 0.25 * amt), eyeR * (1.1 + 0.3 * amt));
      eyeBall(ex, eyeR * (1 + 0.25 * amt), eyeR * (1.1 + 0.3 * amt));

      for (s = -1; s <= 1; s += 2) {

    g.strokeStyle = ink; g.fillStyle = ink; g.lineWidth = 1.5;
    if (e === 'happy' && amt > 0.55) {
      g.beginPath(); g.arc(0, my - 0.7, 1.7 + amt, 0.14, Math.PI - 0.14); g.fill();
      g.fillStyle = '#C97C86';
      g.beginPath(); g.arc(0, my + 0.4, 0.8 + amt * 0.6, 0.1, Math.PI - 0.1); g.fill();
    } else if (e === 'surprised') {
      g.fillStyle = ink;
      g.beginPath(); g.ellipse(0, my, 0.85 + amt * 0.6, 1.1 + amt * 0.8, 0, 0, 6.29); g.fill();
    } else if (e === 'grumble') {
      g.beginPath(); g.arc(0, my + 2.4, 1.6 + amt * 0.8, Math.PI * 1.22, Math.PI * 1.78); g.stroke();
    } else if (e === 'sleepy') {
      g.beginPath(); g.ellipse(0, my, 0.75 + amt * 0.35, 0.95 + amt * 0.45, 0, 0, 6.29); g.fill();
    } else if (e === 'think') {
      g.beginPath(); g.moveTo(-1.5, my + 0.2); g.lineTo(1.5, my - 0.4); g.stroke();
    } else {
      g.beginPath(); g.arc(0, my - 1.1, 1.8 + amt * 0.7, 0.32, Math.PI - 0.32); g.stroke();
    }
  }

  // Every cut is the same cap over the crown — it has to be, or a hat would
  // stop fitting — with its own edge across the forehead and its own business
  // at the sides. All of them stay clear of his eyes.
  // Six cuts that are actually six shapes. The old set all shared one cap and
  // differed only in the line across the forehead, which is a difference you
  // cannot see. These change the silhouette: a shaggy bowl, spikes off the
  // crown, a lumpy mass of curls, a tight buzz, hair past the jaw, a quiff.
  // `capped` drops anything that would stick out through a hat.
  function drawHair(g, cut, hr, HR, B, capped) {
    var i, a, R;
    var cx = 0, cy = -9.9;                     // the skull the hair sits on
    g.fillStyle = HR.v;

    if (cut === 'long') {                      // ── past the jaw, both sides
      for (var sd = -1; sd <= 1; sd += 2) {
        g.beginPath();
        g.moveTo(sd * (hr - 1), -14.6);
        g.bezierCurveTo(sd * (hr + 3.4), -10, sd * (hr + 3.2), -1, sd * (hr + 1.4), 3.6);
        g.bezierCurveTo(sd * (hr + 0.4), 5.2, sd * (hr - 3.4), 4.4, sd * (hr - 3.6), 2.2);
        g.bezierCurveTo(sd * (hr - 1.6), -3, sd * (hr - 2.2), -9, sd * (hr - 4), -13.4);
        g.closePath(); g.fill();
      }
    }

    if (cut === 'mop') {                       // ── a shaggy bowl over the ears
      R = hr + 1.9;
      g.beginPath();
      g.arc(cx, cy - 0.5, R, Math.PI * 0.985, Math.PI * 2.015);
      for (i = 0; i <= 8; i++) {

        var hem = -10.2 - 4.2 * Math.sin(u * Math.PI);
        g.lineTo(mx, hem + (i % 2 ? 1.7 : 0));       // strand tips between the lobes
      }
      g.closePath(); g.fill();

    } else if (cut === 'curls') {              // ── a lumpy mass, bigger than his head
      R = hr + 0.6;
      g.beginPath();
      g.arc(cx, cy, R, Math.PI * 1.0, Math.PI * 2.0);
      g.lineTo(R, -15.6); g.lineTo(-R, -15.6);
      g.closePath(); g.fill();
      for (i = 0; i <= 8; i++) {                     // curls round the crown
        a = Math.PI * (1.0 + i / 8);
        g.beginPath();
        g.arc(Math.cos(a) * R, cy + Math.sin(a) * R, 3.5, 0, 6.29); g.fill();
      }
      for (i = 0; i <= 3; i++) {                     // and along the hem
        g.beginPath();
        g.arc(-R + 0.6 + i * (2 * R - 1.2) / 3, -16.1, 3.1, 0, 6.29); g.fill();
      }

    } else if (cut === 'buzz') {               // ── clipped right down
      g.beginPath();
      g.arc(cx, cy, hr + 0.1, Math.PI * 1.13, Math.PI * 1.87);
      g.lineTo(hr * 0.86, -15.9); g.lineTo(-hr * 0.86, -15.9);
      g.closePath(); g.fill();
      g.globalAlpha = 0.45;                          // stubble creeping down the temples
      g.beginPath();
      g.arc(cx, cy, hr + 0.1, Math.PI * 1.03, Math.PI * 1.13); g.lineTo(-hr * 0.86, -15.9);
      g.closePath(); g.fill();
      g.beginPath();
      g.arc(cx, cy, hr + 0.1, Math.PI * 1.87, Math.PI * 1.97); g.lineTo(hr * 0.86, -15.9);
      g.closePath(); g.fill();
      g.globalAlpha = 1;

    } else if (cut === 'quiff') {              // ── tight sides, a wave up front
      g.beginPath();
      g.arc(cx, cy, hr + 0.35, Math.PI * 1.05, Math.PI * 1.95);
      g.bezierCurveTo(hr * 0.7, -14.4, hr * 0.24, -14.9, -hr * 0.2, -14.7);
      g.bezierCurveTo(-hr * 0.6, -14.5, -hr * 0.9, -13.6, -hr * 0.999, -12.3);
      g.closePath(); g.fill();
      if (!capped) {                                 // the wave, rolled up and forward
        g.beginPath();
        g.moveTo(-hr * 0.98, -13.6);
        g.bezierCurveTo(-hr * 1.32, -21.4, -hr * 0.42, -26.6, hr * 0.34, -24.2);
        g.bezierCurveTo(hr * 0.98, -22.2, hr * 0.9, -17.4, hr * 0.68, -14.8);
        g.closePath(); g.fill();
        g.fillStyle = 'rgba(0,0,0,0.12)';            // the roll under it
        g.beginPath();
        g.moveTo(-hr * 0.72, -15.2);
        g.bezierCurveTo(-hr * 0.5, -19.6, hr * 0.1, -20.8, hr * 0.5, -18.4);
        g.bezierCurveTo(hr * 0.2, -17, -hr * 0.3, -16.4, -hr * 0.72, -15.2);
        g.closePath(); g.fill();

    } else if (cut === 'spikes') {             // ── short, with the top thrown up
      g.beginPath();
      g.arc(cx, cy, hr + 0.45, Math.PI * 1.05, Math.PI * 1.95);
      g.bezierCurveTo(hr * 0.72, -14.0, hr * 0.26, -14.5, -hr * 0.24, -14.4);
      g.bezierCurveTo(-hr * 0.64, -14.3, -hr * 0.9, -13.4, -hr * 0.999, -12.3);
      g.closePath(); g.fill();
      if (!capped) {
        var SP = [[-0.66, -25.2], [-0.34, -27.8], [0.02, -27.0], [0.38, -28.2], [0.7, -24.6]];
        for (i = 0; i < SP.length; i++) {
          var sx = hr * SP[i][0];

          g.beginPath();
          g.moveTo(sx - 2.7, base + 0.6);
          g.lineTo(sx + SP[i][0] * 2.4, SP[i][1]);
          g.lineTo(sx + 2.7, base + 0.6);
