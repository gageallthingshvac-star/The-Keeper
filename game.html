<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Night Watch — The Keeper</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Night Watch" />
<meta name="theme-color" content="#08060a" />
<style>
  :root{
    --bg:#08060a;
    --ember:#FF9F0A;
    --core:#FFD60A;
    --coal:#B34A3D;
    --bone:#E8DCC8;
    --mute:#8E8E93;
    --line:rgba(232,220,200,0.16);
    --panel:rgba(20,16,14,0.82);
    --danger:#FF453A;
    --display:-apple-system,'SF Pro Display',system-ui,sans-serif;
    --body:-apple-system,'SF Pro Text',system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono','SFMono-Regular',menlo,monospace;
    --safeT:env(safe-area-inset-top,0px);
    --safeB:env(safe-area-inset-bottom,0px);
    --safeL:env(safe-area-inset-left,0px);
    --safeR:env(safe-area-inset-right,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg);
    color:var(--bone);font-family:var(--body);
    overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #c{position:fixed;inset:0;display:block;z-index:0}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;z-index:2;left:0;right:0;top:0;
    padding:calc(var(--safeT) + 10px) calc(var(--safeR) + 14px) 0 calc(var(--safeL) + 14px);
    display:flex;align-items:flex-start;gap:12px;pointer-events:none;
    max-width:660px;margin:0 auto;
    opacity:0;transition:opacity .35s ease;
  }
  #hud.on{opacity:1}
  .meter{flex:1;min-width:0}
  .meter .lbl{
    display:flex;justify-content:space-between;align-items:baseline;
    font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
    color:#A79C90;margin-bottom:7px;
  }
  .meter .lbl b{font:800 17px/1 var(--mono);letter-spacing:.02em;color:var(--bone);text-shadow:0 1px 6px #000}
  .bar{
    height:15px;border-radius:8px;background:rgba(232,220,200,0.13);
    border:1px solid rgba(232,220,200,0.10);overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.5);
  }
  .bar i{
    display:block;height:100%;width:60%;border-radius:7px;
    background:linear-gradient(90deg,var(--coal),var(--ember) 55%,var(--core));
    box-shadow:0 0 16px rgba(255,159,10,0.7);
    transition:width .12s linear, background .3s ease;
  }
  .bar.low i{background:linear-gradient(90deg,#7a2520,var(--danger));box-shadow:0 0 18px rgba(255,69,58,0.75)}
  .bar.low{border-color:rgba(255,69,58,0.4)}
  .meters{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
  .bar.thin{height:10px;border-radius:6px}
  .bar.thin i{border-radius:5px}
  #hpBar i{
    background:linear-gradient(90deg,#2f8f5b,#63E6BE 60%,#9CF6D4);
    box-shadow:0 0 14px rgba(99,230,190,0.55);
  }
  #hpBar.hurt i{background:linear-gradient(90deg,#8a6a1c,#FFD60A);box-shadow:0 0 14px rgba(255,214,10,0.6)}
  #hpBar.crit i{background:linear-gradient(90deg,#7a2520,var(--danger));box-shadow:0 0 16px rgba(255,69,58,0.75)}
  #hpBar.crit{border-color:rgba(255,69,58,0.4)}
  /* dawn is a hairline along the very top edge — the bar became health */
  #dawnLine{
    position:fixed;z-index:3;left:0;top:0;width:100%;height:3px;
    background:rgba(232,220,200,0.07);opacity:0;transition:opacity .35s ease;
    pointer-events:none;
  }
  #dawnLine.on{opacity:1}
  #dawnLine i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#2a3550,#5E5CE6 60%,#9AD5FF);
    box-shadow:0 0 8px rgba(94,92,230,0.7);
    transition:width .12s linear;
  }
  #stats{
    flex:none;text-align:right;font:700 12px/1.5 var(--mono);letter-spacing:.04em;
    color:var(--bone);text-shadow:0 1px 8px #000;
  }
  #stats small{display:block;font:600 9px/1 var(--body);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-bottom:4px}

  /* ---------- Controls ---------- */
  .btn{
    position:fixed;z-index:3;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--panel);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--bone);cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity .35s ease, transform .1s ease, background .15s ease;
  }
  .btn.on{opacity:1;pointer-events:auto}
  .btn:active{transform:scale(.94)}
  /* primary action sits under the thumb; the flare moved up out of it */
  html[data-hand="right"] #brand{left:auto;right:calc(var(--safeR) + 20px)}
  html[data-hand="right"] #flare{left:auto;right:calc(var(--safeR) + 30px)}
  html[data-hand="right"] #pause{right:auto;left:calc(var(--safeL) + 14px)}
  html[data-hand="right"] #build{right:auto;left:calc(var(--safeL) + 12px)}
  #brand{
    left:calc(var(--safeL) + 20px);bottom:calc(var(--safeB) + 28px);
    width:104px;height:104px;border-radius:50%;
    font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
    color:#FFC46B;border-color:rgba(255,150,40,0.42);
    background:radial-gradient(120% 120% at 50% 20%, rgba(72,34,8,0.9), rgba(20,16,14,0.86));
    box-shadow:0 0 30px rgba(255,120,20,0.20), inset 0 0 26px rgba(255,120,20,0.14);
    overflow:hidden;
  }
  #brand .fill{
    position:absolute;left:0;right:0;bottom:0;height:0%;
    background:rgba(255,120,20,0.20);transition:height .06s linear;
  }
  #brand span{position:relative;z-index:1}
  #brand.cool{color:#8a7b6a;border-color:var(--line);box-shadow:none}
  #brand.ready{
    color:#FFD9A0;border-color:rgba(255,168,60,0.75);
    box-shadow:0 0 38px rgba(255,120,20,0.34), inset 0 0 30px rgba(255,120,20,0.20);
  }
  #flare{
    left:calc(var(--safeL) + 30px);bottom:calc(var(--safeB) + 150px);
    width:78px;height:78px;border-radius:50%;
    font:700 9px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
    color:var(--core);border-color:rgba(255,214,10,0.34);
    box-shadow:0 0 26px rgba(255,159,10,0.14), inset 0 0 22px rgba(255,159,10,0.10);
    overflow:hidden;
  }
  #flare .fill{
    position:absolute;left:0;right:0;bottom:0;height:0%;
    background:rgba(255,159,10,0.14);transition:height .08s linear;
  }
  #flare span{position:relative;z-index:1}
  #flare.cool{color:#7d7369;border-color:var(--line);box-shadow:none}
  #flare.ready{animation:flarePulse 2.6s ease-in-out infinite}
  @keyframes flarePulse{
    0%,100%{box-shadow:0 0 22px rgba(255,159,10,0.12), inset 0 0 20px rgba(255,159,10,0.08)}
    50%{box-shadow:0 0 34px rgba(255,159,10,0.26), inset 0 0 26px rgba(255,159,10,0.16)}
  }
  #pause{
    top:calc(var(--safeT) + 116px);right:calc(var(--safeR) + 14px);
    width:38px;height:38px;border-radius:12px;
  }
  #pause svg{opacity:.75}

  /* ---------- Overlays ---------- */
  #veil{
    position:fixed;inset:0;z-index:4;display:grid;place-items:center;
    padding:calc(var(--safeT) + 24px) 26px calc(var(--safeB) + 24px);
    background:radial-gradient(120% 90% at 50% 45%, rgba(24,14,8,0.72), rgba(4,3,5,0.94) 70%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    transition:opacity .4s ease;
  }
  #veil.hide{opacity:0;pointer-events:none}
  .card{width:100%;max-width:380px;text-align:center;animation:rise .5s cubic-bezier(.2,.9,.25,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .eyebrow{font:700 10px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--ember);margin-bottom:14px}
  h1{font:700 40px/1.02 var(--display);letter-spacing:-.02em;margin-bottom:14px}
  h1 em{font-style:normal;display:block;color:var(--ember);text-shadow:0 0 34px rgba(255,159,10,0.45)}
  .lede{font:400 15px/1.55 var(--body);color:#B8AEA0;margin-bottom:26px}
  .rules{
    text-align:left;border:1px solid var(--line);border-radius:16px;
    background:rgba(20,16,14,0.5);padding:14px 16px;margin-bottom:24px;
  }
  .rules li{list-style:none;display:flex;gap:11px;align-items:flex-start;padding:7px 0;font:400 13.5px/1.45 var(--body);color:#C4BAAC}
  .rules li+li{border-top:1px solid rgba(232,220,200,0.07)}
  .rules b{color:var(--bone);font-weight:600}
  .glyph{flex:none;width:22px;text-align:center;font-size:15px;line-height:1.45;filter:saturate(.9)}
  .go{
    display:block;width:100%;padding:17px;border:none;border-radius:16px;cursor:pointer;
    background:linear-gradient(180deg,#FFB13A,#E07C0A);color:#20130a;
    font:700 16px/1 var(--body);letter-spacing:.02em;
    box-shadow:0 10px 34px rgba(255,159,10,0.28);
    transition:transform .1s ease,filter .15s ease;
  }
  .go:active{transform:scale(.98);filter:brightness(1.06)}
  .ghost{
    display:block;width:100%;padding:15px;margin-top:10px;cursor:pointer;
    background:transparent;border:1px solid var(--line);border-radius:16px;
    color:var(--mute);font:600 14px/1 var(--body);
  }
  .ghost:active{background:rgba(232,220,200,0.05)}
  .ghost.danger{color:#c98b84;border-color:rgba(255,69,58,0.3)}
  .ghost.danger.armed{color:#fff;background:rgba(255,69,58,0.22);border-color:rgba(255,69,58,0.65)}
  .tally{display:flex;gap:10px;margin-bottom:24px}
  .tally div{
    flex:1;border:1px solid var(--line);border-radius:14px;padding:14px 8px;
    background:rgba(20,16,14,0.5);
  }
  .tally span{display:block;font:600 9px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
  .tally b{font:700 24px/1 var(--mono);letter-spacing:-.02em;color:var(--bone)}
  .tally b.hi{color:var(--core)}
  .foot{margin-top:20px;font:500 10px/1.6 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#57514c}

  /* ---------- Toast ---------- */
  #build{
    position:fixed;z-index:1;right:calc(var(--safeR) + 12px);bottom:calc(var(--safeB) + 10px);
    font:600 9px/1 var(--mono);letter-spacing:.1em;color:rgba(232,220,200,0.22);
    pointer-events:none;user-select:none;
  }
  .buildfoot{
    margin-top:14px;font:600 9px/1.6 var(--mono);letter-spacing:.12em;
    text-transform:uppercase;color:#4a453f;
  }
  .warnbox{
    border:1px solid rgba(255,159,10,0.4);border-radius:14px;
    background:rgba(60,34,8,0.5);padding:12px 14px;margin-bottom:16px;text-align:left;
    font:500 12px/1.5 var(--body);color:#E4C79A;
  }
  .warnbox b{color:var(--core);font-weight:700}

  #toast{
    position:fixed;z-index:3;left:50%;top:38%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;opacity:0;
  }
  #toast.show{animation:toast 1.7s cubic-bezier(.2,.9,.25,1) both}
  #toast .t1{font:700 34px/1 var(--display);letter-spacing:-.01em;color:var(--core);text-shadow:0 0 40px rgba(255,214,10,0.5)}
  #toast .t2{margin-top:8px;font:600 11px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:#B8AEA0}
  @keyframes toast{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.86)}
    16%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    72%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-58%) scale(1.02)}
  }

  /* ---------- HUD row 2: heat + held upgrades ---------- */
  #hud2{
    position:fixed;z-index:2;left:0;right:0;top:calc(var(--safeT) + 110px);
    padding:0 calc(var(--safeR) + 62px) 0 calc(var(--safeL) + 14px);
    max-width:660px;margin:0 auto;
    display:flex;align-items:center;gap:8px;
    pointer-events:none;opacity:0;transition:opacity .35s ease;
  }
  #hud2.on{opacity:1}
  #heat{
    flex:none;font:800 13px/1 var(--mono);letter-spacing:.02em;
    padding:5px 9px;border-radius:8px;color:#FFD60A;
    background:rgba(255,159,10,0.12);border:1px solid rgba(255,214,10,0.3);
    opacity:0;transform:scale(.8);transition:transform .12s ease;
  }
  #heat.show{opacity:1;transform:scale(1)}
  #heat.warm{color:#FF9F0A;background:rgba(255,159,10,0.2);border-color:rgba(255,159,10,0.5)}
  #heat.hot{
    color:#fff;background:rgba(255,69,58,0.35);border-color:rgba(255,107,107,0.7);
    box-shadow:0 0 18px rgba(255,69,58,0.4);
  }
  #chips{display:flex;gap:4px;min-width:0;overflow:hidden}
  #chips .none{display:none}
  .chip{
    display:inline-flex;align-items:center;gap:3px;
    font:600 11px/1 var(--body);
    padding:4px 6px;border-radius:7px;
    background:rgba(20,16,14,0.7);border:1px solid var(--line);
  }
  .chip u{text-decoration:none;font:700 9px/1 var(--mono);color:var(--core);opacity:.9}
  /* emoji ship in their own palette; warm them so the UI reads as one piece */
  .chip em,.dg,.sg,.rules .glyph{
    font-style:normal;
    filter:sepia(.55) saturate(1.7) hue-rotate(-14deg) brightness(1.04);
  }
  .chip.t2{border-color:rgba(94,92,230,0.45);background:rgba(40,36,70,0.55)}
  .chip.t3{border-color:rgba(255,159,10,0.55);background:rgba(60,36,10,0.6)}
  .chip.more{font:700 10px/1 var(--mono);color:var(--mute)}
  .chip.big{font-size:12.5px;padding:7px 10px;gap:6px}
  .chip.big b{font-weight:600;color:var(--bone)}

  /* ---------- overlay layout ---------- */
  #veil{overflow-y:auto;overscroll-behavior:contain;align-items:safe center}
  .card.wide{max-width:440px}
  .row2{display:flex;gap:10px;margin-top:10px}
  .row2 .ghost{margin-top:0}
  .tally.sm b{font-size:19px}
  .held{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
  .held.big{gap:7px;margin:18px 0 4px}
  .held.big + .go{margin-top:16px}
  .held .none{font:400 12.5px/1.5 var(--body);color:#57514c}

  /* ---------- level strip ---------- */
  .lvl{
    border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:18px;
    background:rgba(20,16,14,0.5);text-align:left;
  }
  .lvl.tight{padding:11px 14px;margin:16px 0 4px}
  .lvl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .lvl-top b{font:700 14px/1 var(--body);color:var(--bone)}
  .embers{font:700 13px/1 var(--mono);color:var(--core)}
  .embers i{font-style:normal;font:600 9px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .xp{height:6px;border-radius:4px;background:rgba(232,220,200,0.10);overflow:hidden}
  .xp i{
    display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,#5E5CE6,#9AD5FF);box-shadow:0 0 10px rgba(94,92,230,0.5);
  }
  .lvl-sub{margin-top:8px;font:500 10px/1.5 var(--body);letter-spacing:.06em;color:#6b635c;text-transform:uppercase}

  /* ---------- draft ---------- */
  .draft{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .dcard{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
    padding:14px 15px;border-radius:16px;
    border:1px solid var(--line);background:rgba(24,19,16,0.72);
    color:var(--bone);transition:transform .1s ease,border-color .15s ease,background .15s ease;
  }
  .dcard:active{transform:scale(.98)}
  .dcard:hover{border-color:rgba(255,159,10,0.45);background:rgba(38,28,18,0.8)}
  .dcard.t2{border-color:rgba(94,92,230,0.42)}
  .dcard.t2:hover{border-color:rgba(120,118,255,0.7)}
  .dcard.t3{
    border-color:rgba(255,159,10,0.5);
    background:linear-gradient(120deg,rgba(58,32,10,0.8),rgba(24,19,16,0.72));
    box-shadow:0 0 24px rgba(255,159,10,0.12);
  }
  .dg{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:21px;
      border-radius:12px;background:rgba(255,255,255,0.04)}
  .db{flex:1;min-width:0}
  .db b{display:block;font:700 15px/1.2 var(--body);margin-bottom:3px}
  .db span{display:block;font:400 12.5px/1.4 var(--body);color:#B0A69A}
  .dt{flex:none;text-align:right;font:700 8px/1.4 var(--body);letter-spacing:.14em;color:var(--mute)}
  .dcard.t3 .dt{color:var(--ember)}
  .dcard.t2 .dt{color:#9A98FF}
  .dt u{display:block;text-decoration:none;font:700 10px/1.4 var(--mono);color:var(--bone);opacity:.55;letter-spacing:0}

  /* ---------- shop + feats ---------- */
  .shoplist{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .shop,.feat{
    display:flex;align-items:center;gap:12px;text-align:left;
    padding:12px 13px;border-radius:14px;
    border:1px solid var(--line);background:rgba(20,16,14,0.5);
  }
  .shop.maxed{opacity:.55}
  .sg,.fk{flex:none;width:34px;height:34px;display:grid;place-items:center;font-size:18px;
          border-radius:10px;background:rgba(255,255,255,0.04)}
  .sb,.fb{flex:1;min-width:0}
  .sb b,.fb b{display:block;font:700 13.5px/1.2 var(--body);margin-bottom:2px}
  .sb span,.fb span{display:block;font:400 11.5px/1.35 var(--body);color:#A99F94}
  .pips{display:flex;gap:3px;margin-top:6px}
  .pips i{width:14px;height:3px;border-radius:2px;background:rgba(232,220,200,0.14)}
  .pips i.on{background:var(--ember);box-shadow:0 0 6px rgba(255,159,10,0.5)}
  .sc{
    flex:none;min-width:52px;padding:9px 10px;border-radius:11px;cursor:pointer;
    border:1px solid var(--line);background:transparent;
    font:700 13px/1 var(--mono);color:var(--mute);
  }
  .sc.can{color:#20130a;background:linear-gradient(180deg,#FFB13A,#E07C0A);border-color:transparent}
  .sc.can:active{transform:scale(.95)}
  .sc.done{border:none;font:700 9px/1 var(--body);letter-spacing:.14em;color:var(--ember);background:none}
  .feat{opacity:.5}
  .feat.got{opacity:1;border-color:rgba(255,159,10,0.32)}
  .feat.got .fk{color:var(--ember);background:rgba(255,159,10,0.12)}
  .fe{flex:none;font:700 12px/1 var(--mono);color:var(--core);opacity:.85}
  .feat:not(.got) .fe{color:var(--mute);opacity:.6}

  /* ---------- run summary extras ---------- */
  .stage{
    position:relative;display:block;width:100%;margin-bottom:18px;padding:10px 0 14px;
    border-radius:22px;cursor:pointer;
    border:1px solid var(--line);
    background:radial-gradient(80% 90% at 50% 78%, rgba(255,159,10,0.13), rgba(20,16,14,0.35) 68%, transparent);
    touch-action:none;-webkit-user-select:none;user-select:none;
    transition:background .3s ease;
  }
  .stage:active{background:radial-gradient(80% 90% at 50% 78%, rgba(255,159,10,0.2), rgba(20,16,14,0.4) 68%, transparent)}
  .portrait.stage-knight{width:210px;height:210px;margin:0 auto;display:block;background:none;pointer-events:none}
  .stagename{text-align:center;margin-top:2px;pointer-events:none}
  .stagename b{display:block;font:700 22px/1.15 var(--display);letter-spacing:-.01em;color:var(--bone)}
  .stagename span{display:block;margin-top:4px;font:600 10px/1 var(--body);letter-spacing:.18em;
    text-transform:uppercase;color:var(--ember)}

  .knight{
    display:flex;align-items:center;gap:14px;text-align:left;
    border:1px solid var(--line);border-radius:18px;padding:12px 15px;margin-bottom:18px;
    background:linear-gradient(120deg,rgba(38,28,20,0.6),rgba(20,16,14,0.5));
  }
  .knight.small{margin:16px 0 4px;padding:10px 13px;gap:11px}
  .portrait{
    flex:none;width:76px;height:76px;display:block;
    border-radius:14px;background:radial-gradient(70% 70% at 50% 35%,rgba(255,159,10,0.12),transparent 70%);
  }
  .knight.small .portrait{width:56px;height:56px}
  .portrait.big{

<script>
(function () {

  // ────────────────────────────────────────────────────────────── tuning

    f.runs       = num(m.runs, 0, 0, 1e9);

    f.lifeKills  = num(m.lifeKills, 0, 0, 1e12);
    f.lifeNights = num(m.lifeNights, 0, 0, 1e12);

    if (m.perks && typeof m.perks === 'object') {
      for (i = 0; i < PERKS.length; i++) {
        var r = num(m.perks[PERKS[i].id], 0, 0, PERKS[i].ranks);
        if (r > 0) f.perks[PERKS[i].id] = r;

    if (m.ach && typeof m.ach === 'object') {
      for (i = 0; i < ACHIEVEMENTS.length; i++) {

      }
    }
    var k = (m.knight && typeof m.knight === 'object') ? m.knight : {};
    f.knight.name = cleanName(k.name);
    for (i = 0; i < PLUMES.length; i++)  if (PLUMES[i].id === k.plume)   f.knight.plume = k.plume;
    for (i = 0; i < BUILDS.length; i++)  if (BUILDS[i].id === k.build)   f.knight.build = k.build;
    for (i = 0; i < HELMS.length; i++)   if (HELMS[i].id === k.helm)     f.knight.helm = k.helm;
    for (i = 0; i < CAPES.length; i++)   if (CAPES[i].id === k.cape)     f.knight.cape = k.cape;
    for (i = 0; i < ARMOURS.length; i++) if (ARMOURS[i].id === k.armour) f.knight.armour = k.armour;

    var o = (m.opts && typeof m.opts === 'object') ? m.opts : {};
    f.opts.sound   = o.sound !== false;
    f.opts.music   = o.music !== false;
    f.opts.aim     = o.aim !== false;

  function loadMeta() {
    var raw = null;
    try { raw = localStorage.getItem(META_KEY); } catch (e) { return; }
    if (!raw) { migrateLegacy(); return; }
    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    META = sanitizeMeta(parsed);
    if (!parsed) saveMeta();          // repair an unreadable record in place
  }

  // sound/music used to live in their own keys; fold them in once
  function migrateLegacy() {
    try {
      var mu = localStorage.getItem(MUTE_KEY);
      var mus = localStorage.getItem(MUSIC_KEY);
      if (mu !== null) { META.opts.sound = mu !== '1'; localStorage.removeItem(MUTE_KEY); }
      if (mus !== null) { META.opts.music = mus !== '0'; localStorage.removeItem(MUSIC_KEY); }
      if (mu !== null || mus !== null) saveMeta();
    } catch (e) {}
  }

  function saveMeta() {
    try {
      localStorage.setItem(META_KEY, JSON.stringify(META));
      SAVE_FAILED = false;
      return true;
    } catch (e) {
      SAVE_FAILED = true;           // quota, private mode, blocked site data
      return false;
    }
  }
  function wipeMeta() {
    META = freshMeta();
    try { localStorage.removeItem(META_KEY); } catch (e) {}
    saveMeta();
    recalc();
  }

  // Levels come from embers *earned*, so spending never costs you progress.
  function xpFor(l) { return Math.round(95 * Math.pow(l, 1.18)); }
  function levelInfo(xp) {
    var l = 1, spent = 0, need = xpFor(1);
    while (xp >= spent + need && l < 60) { spent += need; l++; need = xpFor(l); }
    return { level: l, into: xp - spent, need: need };
  }
  function keeperLevel() { return levelInfo(META.xp).level; }

  function u(id) { return S.up[id] || 0; }
  function pk(id) { return META.perks[id] || 0; }
  function upCount() { var n = 0; for (var k in S.up) n += S.up[k]; return n; }

  // Every number the run actually reads. Recomputed when something changes
  // rather than per-frame, so stacking upgrades stays cheap.
  var D = {};
  function recalc() {
    var reachMul = 1 + u('reach') * 0.45;
    D.maxFuel   = 100 + u('hearth') * 20;
    D.startFuel = Math.min(D.maxFuel, K.startFuel + pk('provisions') * 7);
    D.logFuel   = K.logFuel + u('seasoned') * 6 + pk('richwood') * 2;
    D.drainMul  = Math.pow(0.88, u('banked'));
    D.dawnFuel  = 26 + u('firstlight') * 16;
    D.maxLogs   = K.maxLogs + u('hoard') * 2;
    D.logRate   = Math.pow(0.8, u('cache'));          // multiplies the interval
    D.pickupR   = K.pickupR * reachMul;
    D.depositR  = K.depositR * reachMul;
    D.carry     = K.carryBase + u('broadback') * 2;

    // the brand: free, fast, and aimed — the everyday answer to a shade
    D.brandR    = K.brandR * (1 + u('longbrand') * 0.35);
    D.brandArc  = u('sweep') ? Math.PI * 2 : Math.min(Math.PI * 1.75, K.brandArc * (1 + u('deft') * 0.26));
    D.brandDmg  = K.brandDmg + u('whitehot') * 2.1;
    D.swingCd   = K.swingCd;
    D.swingDur  = K.swingDur;

    D.lampR     = K.lampR * (1 + u('lantern') * 0.28) * (1 + pk('lamp') * 0.06);
    D.fireLight = 1 + u('ward') * 0.15;
    D.burnMul   = 1 + u('hungry') * 0.30;

    D.flareCost = Math.max(3, K.flareCost - u('cheap') * 3 - pk('flint'));
    D.flareCd   = K.flareCd * Math.pow(0.70, u('quick'));
    D.flareR    = K.flareR * (1 + u('wide') * 0.30);

    D.speed     = K.keeperSpeed * (1 + u('feet') * 0.13) * (1 + pk('boots') * 0.04);
    D.carryPer  = u('unburdened') ? 0 : 0.05;   // speed lost per log carried
    D.maxHealth = K.maxHealth + u('hearty') * 25 + pk('mail') * 8;
    D.hitDamage = Math.max(4, K.hitDamage - u('nerve') * 2);
    D.iframe    = K.iframe + u('nerve') * 0.35;
    D.dawnHeal  = u('mend') ? 9999 : 40;
    D.mend      = 1 + u('draught') * 1.1 + pk('draught') * 0.25;
    D.scoreMul  = 1 + u('veteran') * 0.25;
    D.rerolls   = pk('reroll');
  }

    logs: [], shades: [], parts: [],
    logT: 0, spawnT: 0, shake: 0, dawnHold: 0,

    // progression + feedback

    heat: 0, heatT: 0, bestHeat: 0, husks: 0, flares: 0,

  // ────────────────────────────────────────────────────────────── helpers
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ══════════════════════════════════════════════════════════════ audio ══
  // Every sound here is synthesised at runtime — no samples, no external
  // files — so the game stays one portable HTML file.
  var A = { ctx: null, master: null, comp: null, sfx: null, music: null, verb: null, noise: null };
  var SFX_TRIM = 0.42;        // everything got a lot softer
  var MUSIC_LEVEL = 0.5;

  function ac() {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return A.ctx; }
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    var a;
    try { a = new Ctor(); } catch (e) { return null; }
    A.ctx = a;

    var comp = a.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 26; comp.ratio.value = 3.2;
    comp.attack.value = 0.006; comp.release.value = 0.25;
    var master = a.createGain(); master.gain.value = 0.85;
    comp.connect(master); master.connect(a.destination);

    // a small warm room, so nothing lands bone dry
    var verb = a.createConvolver();
    verb.buffer = impulse(a, 2.4, 2.6);
    var verbG = a.createGain(); verbG.gain.value = 0.75;
    verb.connect(verbG); verbG.connect(comp);

    // sfx bus — rolled off up top so nothing is sharp any more
    var sfx = a.createGain(); sfx.gain.value = 1;
    var sfxLP = a.createBiquadFilter();
    sfxLP.type = 'lowpass'; sfxLP.frequency.value = 2300; sfxLP.Q.value = 0.4;
    sfx.connect(sfxLP); sfxLP.connect(comp);
    var sfxSend = a.createGain(); sfxSend.gain.value = 0.2;
    sfxLP.connect(sfxSend); sfxSend.connect(verb);

    // music bus — starts silent and fades up
    var music = a.createGain(); music.gain.value = 0.0001;
    var musLP = a.createBiquadFilter();
    musLP.type = 'lowpass'; musLP.frequency.value = 5000; musLP.Q.value = 0.3;
    music.connect(musLP);
    musLP.connect(comp);

    // chorus: a slowly detuned copy of the band, for tape-ish warmth and width
    var chDelay = a.createDelay(0.06); chDelay.delayTime.value = 0.019;
    var chLfo = a.createOscillator(); chLfo.type = 'sine'; chLfo.frequency.value = 0.21;
    var chAmt = a.createGain(); chAmt.gain.value = 0.0055;
    chLfo.connect(chAmt); chAmt.connect(chDelay.delayTime); chLfo.start();
    var chMix = a.createGain(); chMix.gain.value = 0.36;
    musLP.connect(chDelay); chDelay.connect(chMix); chMix.connect(comp);

    // a soft echo, kept quiet and dark so it never muddies the changes
    var dl = a.createDelay(1.5); dl.delayTime.value = 0.4;
    var dlLP = a.createBiquadFilter(); dlLP.type = 'lowpass'; dlLP.frequency.value = 1900;
    var dlFb = a.createGain(); dlFb.gain.value = 0.27;
    var dlMix = a.createGain(); dlMix.gain.value = 0.15;
    musLP.connect(dl); dl.connect(dlLP); dlLP.connect(dlFb); dlFb.connect(dl);
    dlLP.connect(dlMix); dlMix.connect(comp);

    var musSend = a.createGain(); musSend.gain.value = 0.36;
    musLP.connect(musSend); musSend.connect(verb);

    // vinyl crackle, idle at zero until a lo-fi tune wants it
    var cbuf = a.createBuffer(1, Math.floor(a.sampleRate * 4), a.sampleRate);
    var cd = cbuf.getChannelData(0);
    for (var ci = 0; ci < cd.length; ci++) cd[ci] = (Math.random() * 2 - 1) * 0.04;
    var pops = Math.floor(cd.length * 0.004);
    for (var pi2 = 0; pi2 < pops; pi2++) cd[Math.floor(Math.random() * cd.length)] = (Math.random() * 2 - 1);
    var csrc = a.createBufferSource(); csrc.buffer = cbuf; csrc.loop = true;
    var chp = a.createBiquadFilter(); chp.type = 'highpass'; chp.frequency.value = 700;
    var clp = a.createBiquadFilter(); clp.type = 'lowpass'; clp.frequency.value = 4200;
    var cgain = a.createGain(); cgain.gain.value = 0;
    csrc.connect(chp); chp.connect(clp); clp.connect(cgain); cgain.connect(comp);
    csrc.start();

    A.master = master; A.comp = comp; A.verb = verb; A.sfx = sfx; A.music = music;
    A.musLP = musLP; A.musSend = musSend; A.chMix = chMix; A.dlMix = dlMix;
    A.dlTime = dl.delayTime; A.dlFb = dlFb; A.crackle = cgain;
    return a;
  }

  function impulse(a, dur, decay) {
    var len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(2, len, a.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) {
        var t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
    }
    return buf;
  }
  function noiseBuffer(a) {
    if (A.noise) return A.noise;
    var len = Math.floor(a.sampleRate * 2), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    A.noise = b; return b;
  }

  // ── effects ────────────────────────────────────────────────────────────
  function buzz(ms) {
    if (!META.opts.haptics) return;

  }

  // A soft struck-bell voice. Almost every sound in the game is built from
  // this — rounded attack, long gentle tail, nothing sharp anywhere.
  function bell(freq, dur, vol, bright, delay) {
    if (S.muted) return;
    var a = ac(); if (!a) return;
    var t = a.currentTime + (delay || 0);
    var car = a.createOscillator(); car.type = 'sine'; car.frequency.value = freq;
    var mod = a.createOscillator(); mod.type = 'sine'; mod.frequency.value = freq * (bright || 2.01);
    var modG = a.createGain();
    modG.gain.setValueAtTime(freq * 0.9, t);
    modG.gain.exponentialRampToValueAtTime(freq * 0.03, t + dur * 0.5);
    mod.connect(modG); modG.connect(car.frequency);
    var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 0.5;
    var g = a.createGain();
    var peak = Math.max(0.0002, vol * SFX_TRIM);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.022);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    car.connect(lp); lp.connect(g); g.connect(A.sfx);
    car.start(t); mod.start(t);
    car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
  }

  // Air rather than noise — a filtered sweep that breathes instead of hissing.
  function air(dur, vol, from, to) {
    if (S.muted) return;
    var a = ac(); if (!a) return;
    var t = a.currentTime;
    var src = a.createBufferSource(); src.buffer = noiseBuffer(a); src.loop = true;
    var f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(from, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, to), t + dur);
    var g = a.createGain();
    var peak = Math.max(0.0002, vol * SFX_TRIM);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(A.sfx);
    src.start(t); src.stop(t + dur + 0.05);
  }

  var MUS = { on: true, tune: 0, bar: 0, beat: 0, next: 0, timer: null, lead: 74, phrase: 0, swap: null, sched: [] };

  // ── voices ─────────────────────────────────────────────────────────────
  function upright(t, freq, dur, vol) {
    var a = A.ctx;
    var o = a.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
    var sub = a.createOscillator(); sub.type = 'sine'; sub.frequency.value = freq;
    var f = a.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(1500, t);
    f.frequency.exponentialRampToValueAtTime(320, t + 0.3);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); sub.connect(f); f.connect(g); g.connect(A.music);
    o.start(t); sub.start(t); o.stop(t + dur + 0.05); sub.stop(t + dur + 0.05);
  }
  function rhodes(t, freq, dur, vol) {
    var a = A.ctx;
    var car = a.createOscillator(); car.type = 'sine'; car.frequency.value = freq;
    var mod = a.createOscillator(); mod.type = 'sine'; mod.frequency.value = freq * 2.005;
    var modG = a.createGain();
    modG.gain.setValueAtTime(freq * 2.2, t);                 // bell-like attack
    modG.gain.exponentialRampToValueAtTime(freq * 0.05, t + 0.4);
    mod.connect(modG); modG.connect(car.frequency);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    car.connect(g); g.connect(A.music);
    car.start(t); mod.start(t); car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
  }
  function horn(t, freq, dur, vol) {
    var a = A.ctx;
    var o = a.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(freq, t);
    var o2 = a.createOscillator(); o2.type = 'sine'; o2.frequency.setValueAtTime(freq * 1.004, t);
    var vib = a.createOscillator(); vib.type = 'sine'; vib.frequency.value = 5.2;
    var vibG = a.createGain(); vibG.gain.setValueAtTime(0, t);

    vib.connect(vibG); vibG.connect(o.frequency); vibG.connect(o2.frequency);
    var f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1900; f.Q.value = 0.7;
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.07);      // breathy, not plucked
    g.gain.setValueAtTime(vol, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(A.music);
    o.start(t); o2.start(t); vib.start(t);
    o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05); vib.stop(t + dur + 0.05);

  function perc(t, dur, vol, type, freq, q) {

    var g = a.createGain();

    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  function brush(t, d, v){ perc(t, d, v, 'bandpass', 1700, 0.6); }
  function shaker(t, v)  { perc(t, 0.07, v, 'highpass', 6800, 0.6); }

    g.gain.exponentialRampToValueAtTime(v, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);

    o.frequency.exponentialRampToValueAtTime(44, t + 0.13);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);

  // A slow warm pad under the changes — most of the "vibe" lives here.
  function pad(t, notes, dur, vol) {
    var a = A.ctx;
    var f = a.createBiquadFilter();
    f.type = 'lowpass'; f.Q.value = 0.6;
    f.frequency.setValueAtTime(420, t);
    f.frequency.linearRampToValueAtTime(1500, t + dur * 0.45);
    f.frequency.linearRampToValueAtTime(600, t + dur);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.35);   // very slow swell
    g.gain.setValueAtTime(vol, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.connect(g); g.connect(A.music);
    for (var i = 0; i < notes.length; i++) {
      var fr = mtof(notes[i]);
      for (var d = 0; d < 2; d++) {                              // two slightly detuned layers
        var o = a.createOscillator();
        o.type = 'triangle';
        o.frequency.value = fr * (d ? 1.004 : 0.996);
        o.connect(f); o.start(t); o.stop(t + dur + 0.1);
      }
    }
  }

  // Nylon-ish pluck for the arpeggiated sets.
  function pluck(t, freq, dur, vol) {
    var a = A.ctx;
    var o = a.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
    var o2 = a.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
    var o2g = a.createGain(); o2g.gain.value = vol * 0.22;
    var f = a.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 0.8;
    f.frequency.setValueAtTime(2600, t);
    f.frequency.exponentialRampToValueAtTime(700, t + dur * 0.7);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); o2.connect(o2g); o2g.connect(f); f.connect(g); g.connect(A.music);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }

  // Vibraphone — the bell voice that makes the slow tunes shimmer.
  function vibes(t, freq, dur, vol) {
    var a = A.ctx;
    var o = a.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
    var o2 = a.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 4.02;
    var o2g = a.createGain(); o2g.gain.value = vol * 0.16;
    var trem = a.createOscillator(); trem.type = 'sine'; trem.frequency.value = 4.4;
    var tremG = a.createGain(); tremG.gain.value = vol * 0.3;
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    trem.connect(tremG); tremG.connect(g.gain);
    o.connect(g); o2.connect(o2g); o2g.connect(g); g.connect(A.music);
    o.start(t); o2.start(t); trem.start(t);
    o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05); trem.stop(t + dur + 0.05);
  }


  // ── the wider instrument cupboard ──────────────────────────────────────
  // Genres were only ever differing by drum pattern before, which is why they
  // all sounded like the same band. These are the actual timbres.
  function env(g, t, dur, vol, attack) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + (attack || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function osc(type, freq, t, dur, detune) {
    var o = A.ctx.createOscillator();
    o.type = type; o.frequency.value = freq;
    if (detune) o.detune.value = detune;
    o.start(t); o.stop(t + dur + 0.06);
    return o;
  }

  // nylon-string guitar — bossa, folk, latin
  function nylon(t, freq, dur, vol) {
    var a = A.ctx, g = a.createGain(), f = a.createBiquadFilter();
    f.type = 'lowpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(3200, t);
    f.frequency.exponentialRampToValueAtTime(520, t + dur * 0.6);
    env(g, t, dur, vol, 0.006);
    osc('triangle', freq, t, dur).connect(f);
    var h = osc('sine', freq * 2, t, dur * 0.4), hg = a.createGain();
    hg.gain.value = vol * 0.5; h.connect(hg); hg.connect(f);
    f.connect(g); g.connect(A.music);
  }

    tg.gain.value = vol * 0.22; trem.connect(tg); tg.connect(g.gain);

  // ── the parts ──────────────────────────────────────────────────────────
  function bassNote(ch, beat, next) {
    var base = 28 + ch.root, t = ch.d.tones, n;
    if (beat === 0) n = base;
    else if (beat === 1) n = base + anyOf([t[2], t[1], t[3]]);
    else if (beat === 2) n = base + anyOf([t[2], t[3], t[1], 5]);
    else {
      var target = 28 + next.root;                 // chromatic approach into the next bar
      while (target < base - 6) target += 12;
      while (target > base + 8) target -= 12;
      n = target + anyOf([-1, 1, -2, 2]);

    while (n < 28) n += 12;
    while (n > 50) n -= 12;

  }
  function voicing(ch) {
    var d = ch.d, base = 48 + ch.root;             // rootless, left-hand register

    if (d.ext.length && Math.random() < 0.65) v.push(base + d.ext[0]);
    return v.map(function (m) { while (m < 52) m += 12; while (m > 80) m -= 12; return m; });
  }
  function leadNote(ch) {

    if (!cands.length) return MUS.lead;
    cands.sort(function (x, y) { return Math.abs(x - MUS.lead) - Math.abs(y - MUS.lead); });
    var n = cands[Math.floor(Math.random() * Math.min(4, cands.length))];   // mostly stepwise
    MUS.lead = n;
    return n;
  }

  function playBeat(t, spb) {
    var T = TUNES[MUS.tune];
    // leave a breadcrumb so anything watching can find the pulse later
    MUS.sched.push({ t: t, beat: MUS.beat, bar: MUS.bar, spb: spb });
    if (MUS.sched.length > 24) MUS.sched.shift();

    var G = genreOf(T);
    var beat = MUS.beat, bar = MUS.bar, meter = T.meter || 4;
    var last = meter - 1;
    var ch = chordAt(bar);
    var next = chordAt(bar + (beat === last ? 1 : 0));

    var backbeat = meter === 4 ? (beat === 1 || beat === 3) : (beat === 1);
    var vg = T.gain || 1;
    // lo-fi and trip-hop drag behind the beat like tape
    var lag = (T.genre === 'Lo-fi' || T.genre === 'Trip-hop') ? 0.022 : 0;

    // ── the pad breathes once a bar, under everything

      pad(t, pv, spb * meter * 0.98, (0.028 * T.pad) * vg);

    // ── bass, in this genre's voice
    var bn = bassNote(ch, beat, next);
    var root = 28 + ch.root;
    if (G.bass !== 'none') {
      if (T.kit === 'bossa' || T.kit === 'latin') {
        if (beat === 0) play(G.bass, t, mtof(root), spb * 1.4, 0.24 * vg);
        else if (beat === 2) play(G.bass, t, mtof(bn), spb * 1.2, 0.2 * vg);
        else if (beat === last) play(G.bass, t + swung, mtof(bn), spb * 0.6, 0.16 * vg);
      } else if (T.kit === 'soft' || T.kit === 'none') {
        if (beat === 0 || beat === Math.floor(meter / 2)) play(G.bass, t, mtof(bn), spb * 1.5, 0.2 * vg);
      } else if (T.kit === 'lofi') {
        if (beat === 0) play(G.bass, t + lag, mtof(root), spb * 1.8, 0.3 * vg);
        else if (beat === 2) play(G.bass, t + swung * 0.5 + lag, mtof(bn), spb * 1.1, 0.22 * vg);
      } else if (T.kit === 'dub') {
        if (beat === 0) play(G.bass, t, mtof(root), spb * 2.2, 0.36 * vg);
        else if (beat === 2) play(G.bass, t + swung, mtof(bn), spb * 0.9, 0.26 * vg);
      } else if (T.kit === 'funk') {
        if (beat === 0) { play(G.bass, t, mtof(root), spb * 0.5, 0.3 * vg);

        else if (beat === 1) play(G.bass, t + swung, mtof(bn), spb * 0.42, 0.22 * vg);
        else if (beat === last) play(G.bass, t, mtof(bn), spb * 0.6, 0.24 * vg);

      if (beat === 2) kick(t + swung, 0.045 * vg);
      if (backbeat) rim(t, 0.035 * vg);
    } else if (T.kit === 'latin') {

    } else if (T.kit === 'funk') {
      if (beat === 0) kick(t, 0.062 * vg);
      if (beat === 1) kick(t + swung, 0.05 * vg);

      if (Math.random() < 0.45) play(G.comp, t + swung, mtof(seq[(bar * meter + beat + 2) % seq.length]), spb * 1.2, 0.032 * vg);

    } else if (T.kit === 'dub') {

  function musicTick() {

  // Where we are inside the current beat, for anything that wants to move to it.

    A.music.gain.cancelScheduledValues(now);
    A.music.gain.setValueAtTime(Math.max(0.0001, A.music.gain.value), now);

    duckMusic(0.08, fade ? fade * 0.35 : 0.18);

    MUS.swap = setTimeout(function () {
