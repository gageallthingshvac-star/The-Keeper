        saveMeta(); recalc();
        UI.buy();
        buzz(14);
        shop();
      });
    }
    on('btnBack', menu);
  }

  // ── the dawn draft ────────────────────────────────────────────────────────
  function draftPool() {
    var lvl = keeperLevel(), pool = [];
    for (var i = 0; i < UPGRADES.length; i++) {
      var U = UPGRADES[i];
      if (U.lv > lvl) continue;
      if (u(U.id) >= U.max) continue;
      var w = U.tier === 1 ? 10 : U.tier === 2 ? 4 : 1.5;
      if (u(U.id) > 0) w *= 0.7;              // mild nudge toward variety
      pool.push({ up: U, w: w });
    }
    return pool;
  }
  function rollDraft(n) {
    var pool = draftPool(), out = [];
    while (out.length < n && pool.length) {
      var total = 0, i;
      for (i = 0; i < pool.length; i++) total += pool[i].w;
      var roll = Math.random() * total, acc = 0, pickIdx = pool.length - 1;
      for (i = 0; i < pool.length; i++) { acc += pool[i].w; if (roll <= acc) { pickIdx = i; break; } }
      out.push(pool[pickIdx].up);
      pool.splice(pickIdx, 1);
    }
    return out;
  }

  function openDraft() {
    duckMusic(0.55, 0.4);
    var offer = rollDraft(3);
    if (!offer.length) { S.mode = 'play'; hideVeil(); showChrome(true); return; }  // everything maxed
    S.mode = 'draft';
    showChrome(false);
    renderDraft(offer);
  }

  function renderDraft(offer) {
    var cards = '';
    for (var i = 0; i < offer.length; i++) {
      var U = offer[i], have = u(U.id);
      cards +=
        '<button class="dcard t' + U.tier + '" data-up="' + U.id + '">' +
          '<div class="dg">' + U.glyph + '</div>' +
          '<div class="db">' +
            '<b>' + esc(U.name) + '</b>' +
            '<span>' + esc(U.desc) + '</span>' +
          '</div>' +
          '<div class="dt">' + (U.tier === 3 ? 'RARE' : U.tier === 2 ? 'UNCOMMON' : '') +
            (have ? '<u>' + have + '/' + U.max + '</u>' : '') + '</div>' +
        '</button>';
    }
    veil(
      '<div class="eyebrow">Dawn · Night ' + S.night + '</div>' +
      '<h1>Take <em>One</em></h1>' +
      (upCount() ? '<div class="held">' + upChips(S.up) + '</div>' : '') +
      '<div class="draft">' + cards + '</div>' +
      (S.rerolls > 0 ? '<button class="ghost" id="btnRe">Reroll · ' + S.rerolls + ' left</button>' : ''),
      'wide'
    );
    var btns = elCard.querySelectorAll('button[data-up]');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () { takeUpgrade(this.getAttribute('data-up')); });
    }
    on('btnRe', function () {
      if (S.rerolls <= 0) return;
      S.rerolls--;
      UI.open();
      renderDraft(rollDraft(3));
    });
  }

  function takeUpgrade(id) {
    var def = UP_BY_ID[id];
    if (!def) return;
    S.up[id] = (S.up[id] || 0) + 1;
    recalc();
    S.fuel = Math.min(S.fuel, D.maxFuel);
    UI.choose();
    buzz(18);
    S.mode = 'play';
    S.nightT = 0;
    hideVeil();
    showChrome(true);
    duckMusic(1, 0.8);
    toast(def.glyph + ' ' + def.name, def.desc);
    last = performance.now();
  }

  // ── run bookkeeping ───────────────────────────────────────────────────────
  function finishRun() {
    var r = {
      night: S.night, score: Math.round(S.score), logs: S.logsBurned, kills: S.kills,
      husks: S.husks, flares: S.flares, upCount: upCount(), bestHeat: S.bestHeat,
      brandKills: S.brandKills, damage: S.damageTaken
    };
    var base = Math.round(r.score / 22) + r.night * 12;
    var embers = Math.max(1, Math.round(base * (1 + pk('sifter') * 0.12)));
    var runEmbers = embers;

    var newAch = [];
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      var A = ACHIEVEMENTS[i];
      if (!META.ach[A.id] && A.test(r)) { META.ach[A.id] = 1; newAch.push(A); embers += A.embers; }
    }

    var before = keeperLevel();
    META.embers += embers;
    META.xp += embers;
    META.runs++;
    META.lifeLogs += r.logs;
    META.lifeKills += r.kills;
    META.lifeNights += Math.max(0, r.night - 1);
    if (r.night > META.bestNight) META.bestNight = r.night;
    if (r.score > META.bestScore) META.bestScore = r.score;
    var after = keeperLevel();
    saveMeta();
    return { r: r, embers: embers, runEmbers: runEmbers, newAch: newAch, before: before, after: after };
  }

  function startGame() {
    S.up = {};          // clear the last run's draft *before* deriving stats
    recalc();
    S.mode = 'play';
    S.time = 0; S.night = 1; S.nightT = 0; S.score = 0;
    S.logs.length = 0; S.shades.length = 0; S.parts.length = 0;
    S.motes.length = 0; S.cinders.length = 0; S.floats.length = 0;
    S.logT = 0.6; S.spawnT = 3.2; S.shake = 0;
    S.kills = 0; S.logsBurned = 0; S.husks = 0; S.flares = 0;
    S.heat = 0; S.heatT = 0; S.bestHeat = 0;
    S.revived = false; S.pyreCount = 0; S.earned = null; S.brandKills = 0;
    S.health = D.maxHealth; S.damageTaken = 0; S.cause = 'dark'; S.mended = 0;
    S.rerolls = D.rerolls;
    S.fire.flare = 0.8;

    // Head Start hands you upgrades before the first night
    var hs = pk('headstart'), given = [];
    for (var i = 0; i < hs; i++) {
      var pick = rollDraft(1)[0];
      if (pick) { S.up[pick.id] = (S.up[pick.id] || 0) + 1; given.push(pick); recalc(); }
    }

    S.fuel = D.startFuel;
    S.keeper.x = W / 2; S.keeper.y = H / 2 + 96;
    S.keeper.vx = 0; S.keeper.vy = 0;
    S.keeper.carry = 0; S.keeper.cd = 0; S.keeper.stun = 0; S.keeper.guard = 0;
    S.keeper.swing = 0; S.keeper.swingCd = 0; S.keeper.swingDir = 0;
    S.keeper.face = -Math.PI / 2;
    stick.id = null; stick.on = false; stick.dx = 0; stick.dy = 0;
    for (var j = 0; j < 3; j++) spawnLog();
    hideVeil();
    showChrome(true);
    ac();
    startMusic();
    duckMusic(1, 0.8);
    last = performance.now();
    toast('Night 1', knightName() + ' takes the watch');
  }

  function togglePause() {
    if (S.mode === 'play' || S.mode === 'dawn') {
      S._resume = S.mode;
      duckMusic(0.45, 0.4);
      pauseCard();
    } else if (S.mode === 'paused') {
      S.mode = S._resume || 'play';
      hideVeil();
      showChrome(true);
      duckMusic(1, 0.6);
      last = performance.now();
    }
  }

  function pauseCard() {
    S.mode = 'paused';
    showChrome(false);
    veil(
        '<div class="eyebrow">Paused</div>' +
        '<h1>Hold<em>Fast</em></h1>' +
        '<div class="tally sm">' +
          '<div><span>Night</span><b>' + S.night + '</b></div>' +
          '<div><span>Health</span><b>' + Math.max(0, Math.round(S.health)) + '</b></div>' +
          '<div><span>Fire</span><b>' + Math.round(S.fuel) + '</b></div>' +
        '</div>' +
        '<div class="knight small">' +
          '<canvas id="portrait" class="portrait"></canvas>' +
          '<div class="kinfo"><b>' + esc(knightName()) + '</b><span>' + esc(knightTitle()) + '</span>' +
          '<u>score ' + Math.round(S.score).toLocaleString() + '</u></div>' +
        '</div>' +
        '<div class="held big">' + upChips(S.up, true) + '</div>' +
        transportHtml(true) +
        '<button class="go" id="btnResume">Resume</button>' +
        '<button class="ghost" id="btnSettingsP">Settings</button>' +
        '<button class="ghost" id="btnQuit">Abandon the Watch</button>' +
        buildFoot(),
        'wide'
      );
    hookPortrait();
    bindTransport(function () { musicScreen(pauseCard); });
    on('btnResume', togglePause);
    on('btnSettingsP', function () { settingsScreen(pauseCard); });
    on('btnQuit', function () { finishRun(); menu(); });
  }

  function gameOver(cause) {
    S.cause = cause || 'dark';
    S.mode = 'over';
    S.shake = 14;
    showChrome(false);
    SFX.dead(); buzz([30, 80, 30, 80, 60]);
    spark(S.fire.x, S.fire.y, 40, 'ember', 200, 1.2);

    var out = finishRun();
    var r = out.r;
    var levelled = out.after > out.before;
    var L = levelInfo(META.xp);
    var pct = clamp(L.into / L.need, 0, 1) * 100;

    var achHtml = '';
    if (out.newAch.length) {
      achHtml = '<div class="newfeats"><span>Feats earned</span>';
      for (var i = 0; i < out.newAch.length; i++) {
        achHtml += '<div><b>' + esc(out.newAch[i].name) + '</b><u>+' + out.newAch[i].embers + '</u></div>';
      }
      achHtml += '</div>';
    }

    setTimeout(function () {
      veil(
        '<div class="eyebrow">' + (r.score > 0 && r.score >= META.bestScore ? 'New Best'
            : S.cause === 'fell' ? 'Your knight fell' : 'The fire went out') + '</div>' +
        (S.cause === 'fell' ? '<h1>Carried<em>Home</em></h1>' : '<h1>Cold<em>Ashes</em></h1>') +
        '<p class="lede">' + epitaph() + '</p>' +
        '<div class="tally">' +
          '<div><span>Night</span><b>' + r.night + '</b></div>' +
          '<div><span>Score</span><b class="' + (r.score >= META.bestScore ? 'hi' : '') + '">' + r.score.toLocaleString() + '</b></div>' +
          '<div><span>Embers</span><b class="hi">+' + out.embers + '</b></div>' +
        '</div>' +
        '<div class="payout">' +
          '<div><span>Night ' + r.night + ' · score ' + r.score.toLocaleString() + '</span><u>+' + out.runEmbers + '</u></div>' +
          (out.embers > out.runEmbers
            ? '<div><span>' + plural(out.newAch.length, 'feat') + ' earned</span><u>+' + (out.embers - out.runEmbers) + '</u></div>'
            : '') +
          '<div class="tot"><span>Embers banked</span><u>' + META.embers.toLocaleString() + '</u></div>' +
        '</div>' +
        achHtml +
        (levelled ? '<div class="levelup">Keeper level ' + out.after + nextUnlockNote(out.after - 1) + '</div>' : '') +
        '<div class="lvl tight">' +
          '<div class="lvl-top"><b>Level ' + L.level + '</b><span class="embers">' + META.embers.toLocaleString() + ' <i>embers</i></span></div>' +
          '<div class="xp"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
        '</div>' +
        '<div class="held big">' + upChips(S.up, true) + '</div>' +
        '<button class="go" id="btnAgain">Take the Watch Again</button>' +
        '<div class="row2">' +
          '<button class="ghost" id="btnShop2">Provisions</button>' +
          '<button class="ghost" id="btnMenu">Camp</button>' +
        '</div>' +
        '<div class="foot">' + plural(r.logs, 'log') + ' burned · ' + plural(r.kills, 'shade') + ' dispelled (' + r.brandKills + ' by brand) · heat ×' + r.bestHeat + '</div>' +
        '<div class="foot">' + (r.damage ? r.damage + ' damage taken' : 'not a scratch') + '</div>' +
        buildFoot(),
        'wide'
      );
      on('btnAgain', startGame);
      on('btnMenu', menu);
      on('btnShop2', shop);
    }, 900);
  }

  function epitaph() {
    var n = S.night - 1, who = knightName();
    var fell = S.cause === 'fell';
    if (n <= 0) return who + ' did not see the first dawn. The dark is patient — try again.';
    if (n === 1) return who + ' held one night. The watch is longer than it looks.';
    if (n < 4) return who + ' held ' + n + ' nights, and was learning the rhythm of it.';
    if (n < 7) return who + ' held ' + n + ' nights. ' + (fell ? 'Carried home by morning.' : 'Steady hands — the fire remembers.');
    return who + ' held ' + n + ' nights. Whoever comes after will find warm ground.';
  }

  // ────────────────────────────────────────────────────────────── loop
  var last = 0, acc = 0;
  var STEP = 1 / 120;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;

    if (S.mode !== 'paused') {
      acc += dt;
      var guard = 0;
      while (acc >= STEP && guard++ < 20) { update(STEP); acc -= STEP; }
    }
    render();
    syncHud();
    if (portraitCv) { updateKnight(dt); paintPortrait(); }
  }

  // ────────────────────────────────────────────────────────────── boot
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && S.mode === 'play') togglePause();
    if (!A.ctx) return;
    if (document.hidden) { A.ctx.suspend(); }
    else if (MUS.on || !S.muted) { A.ctx.resume(); }
  });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  // One soft tap for any button in the interface. Controls that already make
  // their own sound (the brand, the flare, and anything with a richer
  // confirmation below) are left alone so nothing doubles up.
  document.addEventListener('pointerdown', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.id === 'brand' || b.id === 'flare') return;
    if (b.hasAttribute('data-perk') || b.hasAttribute('data-up') || b.hasAttribute('data-plume')) return;
    if (/^(btnBack|btnNameBack|btnMenu)$/.test(b.id)) UI.back();
    else UI.tap();
  }, true);

  loadMeta();
  applyHand();
  S.muted = !META.opts.sound;
  MUS.on = META.opts.music;
  MUS.tune = Math.floor(Math.random() * TUNES.length);
  recalc();

  // browsers hold audio until the first gesture, so the band starts then
  function wakeAudio() {
    document.removeEventListener('pointerdown', wakeAudio);
    document.removeEventListener('keydown', wakeAudio);
    ac();
    startMusic();
  }
  document.addEventListener('pointerdown', wakeAudio);
  document.addEventListener('keydown', wakeAudio);
  // opt-in inspection hook for tuning/QA: open with #debug
  if (/[?#]debug/.test(location.href)) window.__NW = { S: S, K: K, D: D, META: META, UPGRADES: UPGRADES, PERKS: PERKS,
      flare: doFlare, swing: doSwing, lightAt: lightAt, stick: stick, KN: KN, updateKnight: updateKnight, knightPoke: knightPoke, knightPet: knightPet, beatNow: beatNow, drawKnight: drawKnight, A: A, MUS: MUS, TUNES: TUNES,
      startMusic: startMusic, nextTune: nextTune, setMusic: setMusic, SFX: SFX, UI: UI, ac: ac, switchTo: switchTo, applyTone: applyTone, GENRE: GENRE,
      music: { parseChord: parseChord, voicing: voicing, bassNote: bassNote,
               leadNote: leadNote, chordAt: chordAt, QUAL: QUAL, mtof: mtof }, recalc: recalc, saveMeta: saveMeta, rollDraft: rollDraft, take: takeUpgrade };
  resize();
  S.keeper.x = W / 2; S.keeper.y = H / 2 + 96;
  menu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
