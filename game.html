    } else {                                   // ── 'swept', and the base for 'long'
      g.beginPath();
      g.arc(cx, cy, hr + 0.6, Math.PI * 1.02, Math.PI * 1.98);
      g.bezierCurveTo(hr * 0.8, -13.9, hr * 0.2, -15.2, -hr * 0.28, -14.7);
      g.bezierCurveTo(-hr * 0.66, -14.3, -hr * 0.92, -13.4, -hr * 0.999, -12.2);
      g.closePath(); g.fill();
      if (!capped && (cut === 'swept' && B.scruff)) {     // the bit that never lies flat
        g.beginPath();
        g.moveTo(-hr * 0.26, -hr - 8.9);
        g.bezierCurveTo(hr * 0.06, -hr - 12.6, hr * 0.6, -hr - 12.2, hr * 0.82, -hr - 9.6);
        g.bezierCurveTo(hr * 0.38, -hr - 10.9, hr * 0.02, -hr - 10.0, -hr * 0.26, -hr - 8.9);
        g.fill();
      }
    }

    if (cut !== 'buzz') {                      // a little light off the top
      g.fillStyle = 'rgba(255,255,255,0.06)';
      g.beginPath();
      g.ellipse(-hr * 0.3, cut === 'curls' ? -17.4 : -15.6, hr * 0.42, 1.4, -0.3, 0, 6.29);
      g.fill();
    }
  }

  function drawHead(g, H, hr, accent, cloth, trim, HR, o) {
    var s;
    if (H.id === 'none') return;
    // Every hat sits on the same line, high enough to leave his eyes alone —
    // a brim across the pupils was making him look half asleep in all of them.
    // The crown is a slice of his own head, so nothing floats or bites in.
    var hy = -13.5;
    var a1 = Math.PI * 1.127, a2 = Math.PI * 1.873;
    var hw = Math.sqrt(Math.max(0, (hr + 0.5) * (hr + 0.5) - (hy + 9.6) * (hy + 9.6)));

      var r = hr + 0.5 + (pad || 0);
      g.beginPath(); g.arc(0, -9.6, r, a1, a2); g.closePath(); g.fill();
    }
    if (H.id === 'cap') {
      g.fillStyle = accent;
      crown(0);
      roundRectOn(g, -hw - 0.6, hy - 2.4, (hw + 0.6) * 2, 2.6, 1.1); g.fill();
      g.beginPath(); g.ellipse(hw - 1.4, hy - 1, 6.6, 1.8, -0.06, 0, 6.29); g.fill();   // brim
      g.fillStyle = trim;
      g.beginPath(); g.arc(0, -18.4, 1.1, 0, 6.29); g.fill();                           // button
    } else if (H.id === 'beanie') {
      g.fillStyle = accent;
      crown(1.7);
      roundRectOn(g, -hw - 1.3, hy - 2.8, (hw + 1.3) * 2, 3, 1.4); g.fill();
      g.fillStyle = trim; g.globalAlpha = 0.85;                                          // turned-up brim
      roundRectOn(g, -hw - 1.3, hy - 2.5, (hw + 1.3) * 2, 2.5, 1.2); g.fill();
      g.globalAlpha = 1;
      g.fillStyle = accent;
      g.beginPath(); g.arc(0, -21.6, 2.2, 0, 6.29); g.fill();                            // bobble
    } else if (H.id === 'bandana') {
      g.fillStyle = accent;
      crown(0);
      roundRectOn(g, -hw - 0.5, hy - 2.6, (hw + 0.5) * 2, 2.8, 1.2); g.fill();
      g.beginPath();                                                                     // knot tail
      g.moveTo(-hw - 0.2, hy - 2.4); g.lineTo(-hw - 5, hy + 0.6); g.lineTo(-hw - 1.4, hy + 1.4);

        g.quadraticCurveTo(s * (hr + 3.6), -6.4, s * (hr - 0.2), -1.2);
        g.quadraticCurveTo(s * (hr - 1.2), -5.4, s * (hr - 2.6), -7.4);
        g.closePath(); g.fill();

      g.fillStyle = accent;
      crown(-0.6);
      roundRectOn(g, -hw + 0.4, hy - 2.4, (hw - 0.4) * 2, 2.6, 1); g.fill();
      g.beginPath(); g.ellipse(0, hy - 0.2, hw + 4.2, 2, 0, 0, 6.29); g.fill();          // floppy brim
    } else if (H.id === 'helm') {
      g.fillStyle = '#CBD2DB';
      crown(1.1);
      g.fillStyle = '#94A1AF';
      roundRectOn(g, -hw - 1.1, hy - 2.5, (hw + 1.1) * 2, 2.7, 1.3); g.fill();           // browband
      g.fillStyle = '#CBD2DB';                                                            // cheek guards
      roundRectOn(g, -hr - 1.2, hy + 0.2, 3, 7, 1.4); g.fill();
      roundRectOn(g, hr - 1.8, hy + 0.2, 3, 7, 1.4); g.fill();
      g.fillStyle = accent;                                                               // plume
      g.save(); g.translate(0, -20.8); g.rotate(Math.sin((o.t || 0) * 4) * 0.13);
      g.beginPath();
      g.moveTo(0, 2.4); g.quadraticCurveTo(-5.4, -2.2, -2.4, -9);
      g.quadraticCurveTo(0.6, -4.4, 3.4, -7.8); g.quadraticCurveTo(4.2, -1.4, 0, 2.4);

  function roundRectOn(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawKeeper() {
    var k = S.keeper;
    // the bob rides the stride rather than a metronome, so his head dips on
    // the footfalls and settles when he stops
    var bob = Math.sin(k.step * 2) * (0.5 + k.walk * 1.4);
    ctx.save();
    ctx.translate(k.x, k.y + bob);

    // the brand, held out to the side or mid-swing
    var bAng = k.swing > 0
      ? k.swingDir - D.brandArc / 2 + D.brandArc * (1 - k.swing / D.swingDur)
      : k.face + 1.1;
    var bLen = k.swing > 0 ? 26 : 17;
    // the tip banks back up as the swing comes off cooldown, so you can see
    // when it is ready without looking away from the fight
    var ready = k.swingCd > 0 ? clamp(1 - k.swingCd / D.swingCd, 0, 1) : 1;
    ctx.save();
    ctx.rotate(bAng);
    ctx.strokeStyle = '#6B4A2C';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(bLen, 0); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,170,50,' + (0.28 + 0.67 * ready).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(bLen + 2, 0, (k.swing > 0 ? 4.6 : 2.2 + 1.2 * ready), 0, 6.29); ctx.fill();
    ctx.restore();

    drawKnight(ctx, {
      t: S.time,
      scale: 1.7,
      expr: k.guard > 0 ? 'surprised' : (k.carry >= D.carry ? 'happy' : 'normal'),
      flash: k.guard > 0 && Math.floor(S.time * 18) % 2 === 0,
      flip: k.flip, walk: k.walk, step: k.step, tilt: k.lean
    });

    // carried logs, stacked over the helmet
    for (var ci = 0; ci < k.carry; ci++) {
      ctx.save();
      ctx.translate(0, -30 - ci * 8);
      ctx.rotate(Math.sin(S.time * 5 + ci * 0.8) * 0.09);
      ctx.fillStyle = ci % 2 ? '#7A5433' : '#6B4A2C';
      roundRect(-11.5, -4, 23, 8, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(20,12,8,0.7)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-3.5, -4); ctx.lineTo(-3.5, 4); ctx.stroke();
      ctx.fillStyle = 'rgba(190,150,90,0.85)';
      ctx.beginPath(); ctx.ellipse(-11, 0, 2.4, 4, 0, 0, 6.29); ctx.fill();
      ctx.restore();
    }

    // lantern arm
    var lx = Math.cos(k.face) * 13, ly = Math.sin(k.face) * 8 + 1;
    ctx.strokeStyle = 'rgba(232,220,200,0.5)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.fillStyle = '#FFD60A';
    ctx.beginPath(); ctx.arc(lx, ly, 3.4, 0, 6.29); ctx.fill();

    ctx.restore();
  }

  // She works the far side of the fire on the nights it matters.
  function drawAlly() {
    if (!S.ally) return;
    var A2 = S.ally;
    if (A2.pulse > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,180,220,' + (0.5 * A2.pulse).toFixed(3) + ')';
      ctx.lineWidth = 3 * A2.pulse + 1;
      ctx.beginPath(); ctx.arc(A2.x, A2.y, px(96) * (1 - A2.pulse), 0, 6.29); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(A2.x, A2.y);
    drawKnight(ctx, {
      t: S.time, scale: 1.5, amt: 0.7, expr: 'content',
      wear: { plume: 'rose', cape: 'poncho', helm: 'bandana', hair: 'ink' }, build: 'lass',
      flip: Math.cos(A2.t * 0.5) < 0 ? -1 : 1,
      walk: 1, step: A2.t * 5,
      armR: -2.1 + Math.sin(A2.t * 3) * 0.2, armL: 1.2
    });
    ctx.restore();
  }

  function drawShades() {
    for (var i = 0; i < S.shades.length; i++) {
      var s = S.shades[i];
      var li = lightAt(s.x, s.y);
      var hpF = clamp(s.hp / s.maxHp, 0, 1);
      var wob = Math.sin(s.wob) * (s.kind === 'wisp' ? 3 : 1.6);
      ctx.save();
      ctx.translate(s.x, s.y);

      // body — a torn wisp of dark
      ctx.globalAlpha = 0.55 + 0.45 * hpF;
      var grd = ctx.createRadialGradient(0, 0, 1, 0, 0, s.r * 1.7);
      var tint = s.hit > 0 ? '90,40,60' : s.t.tint;
      grd.addColorStop(0, 'rgba(' + tint + ',0.99)');
      grd.addColorStop(0.55, 'rgba(' + tint + ',0.72)');
      grd.addColorStop(1, 'rgba(12,7,28,0)');
      ctx.fillStyle = grd;
      // A shade out in the dark used to be a 0.12-alpha outline on black, so
      // the first you knew of one was when it reached the fire.
      ctx.strokeStyle = 'rgba(' + (s.t.rim || '150,120,220') + ',' +
        ((0.5 + 0.2 * li) * (0.5 + 0.5 * hpF)).toFixed(3) + ')';
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      ctx.moveTo(-s.r + wob * 0.3, s.r * 0.5);
      ctx.quadraticCurveTo(-s.r * 1.1, -s.r * 0.9, wob, -s.r * 1.25);
      ctx.quadraticCurveTo(s.r * 1.1, -s.r * 0.9, s.r + wob * 0.3, s.r * 0.5);
      ctx.quadraticCurveTo(s.r * 0.4, s.r * 1.3 + wob, 0, s.r * 0.9);
      ctx.quadraticCurveTo(-s.r * 0.4, s.r * 1.3 - wob, -s.r + wob * 0.3, s.r * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Two points of light, brightest out in the dark and fading as it comes
      // into the fire's reach. Measured, a shade in the dark was only a tenth
      // brighter than the ground behind it; the eyes are what you actually see
      // coming, which is the whole point of having to watch for them.
      var far = 1 - clamp(li * 2.2, 0, 1);
      if (far > 0.03) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = (0.28 + 0.52 * far) * (0.45 + 0.55 * hpF);
        ctx.fillStyle = 'rgba(' + (s.t.rim || '170,140,240') + ',0.95)';
        var eyy = -s.r * 0.24, eyx = s.r * 0.33, eyr = s.r * 0.15;
        ctx.beginPath(); ctx.arc(-eyx + wob * 0.2, eyy, eyr, 0, 6.29); ctx.fill();
        ctx.beginPath(); ctx.arc(eyx + wob * 0.2, eyy, eyr, 0, 6.29); ctx.fill();
        ctx.globalAlpha = (0.12 + 0.2 * far) * hpF;
        ctx.beginPath(); ctx.arc(-eyx + wob * 0.2, eyy, eyr * 3.2, 0, 6.29); ctx.fill();
        ctx.beginPath(); ctx.arc(eyx + wob * 0.2, eyy, eyr * 3.2, 0, 6.29); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }

      // burning-away shimmer — a scorched rim, so the body stays dark.
      // A husk shrugs most of it off, which is the visual tell that it will last.
      if (li > 0.12) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = li * 0.62 * (s.t.burn / 5.2);
        ctx.strokeStyle = 'rgba(255,150,40,0.75)';
        ctx.lineWidth = 2.2 + Math.sin(S.time * 14 + s.wob) * 0.7;
        ctx.beginPath(); ctx.arc(0, 0, s.r * 1.02, 0, 6.29); ctx.stroke();
        ctx.globalAlpha = li * 0.16 * (s.t.burn / 5.2);
        ctx.fillStyle = 'rgba(255,159,10,0.6)';
        ctx.beginPath(); ctx.arc(0, 0, s.r * 1.02, 0, 6.29); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }

      // husks carry a cracked ember core that dims as they take damage
      if (s.kind === 'husk') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + 0.4 * hpF;
        ctx.strokeStyle = 'rgba(255,120,20,0.85)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-5, -7); ctx.lineTo(-1.5, -1); ctx.lineTo(-5.5, 3.5);
        ctx.moveTo(4.5, -6); ctx.lineTo(1.5, 1.5); ctx.lineTo(5, 7);
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.restore();
    }
  }

  // The night itself: not black, but a cold sky that is a shade lighter
  // overhead than it is underfoot. Cached — it only changes on a resize.
  var _sheet = null, _sheetH = 0;
  function nightSheet() {
    if (_sheet && _sheetH === H) return _sheet;
    var g = dctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(26,30,84,0.885)');
    g.addColorStop(0.5, 'rgba(17,15,54,0.9)');
    g.addColorStop(1, 'rgba(10,8,32,0.915)');
    _sheet = g; _sheetH = H;
    return g;
  }

  // darkness mask: the night sheet with the light punched out of it
  function drawDarkness() {
    // At dawn the dark comes off the field rather than staying put until the
    // card arrives — by the time the sun is clear of the ridge you can see camp.
    var lift = S.mode === 'dawn' ? 1 - 0.86 * smooth(clamp(1 - S.dawnHold / K.dawnHold, 0, 1)) : 1;
    if (lift < 0.02) return;          // nothing of it left to show; do not build it
    var lr = lightRadius();
    dctx.setTransform(VS, 0, 0, VS, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.fillStyle = nightSheet();
    dctx.clearRect(0, 0, W, H);
    dctx.fillRect(0, 0, W, H);

    dctx.globalCompositeOperation = 'destination-out';
    // fire light
    var g1 = dctx.createRadialGradient(S.fire.x, S.fire.y, 0, S.fire.x, S.fire.y, lr);
    g1.addColorStop(0, 'rgba(0,0,0,1)');
    g1.addColorStop(0.46, 'rgba(0,0,0,0.97)');
    g1.addColorStop(0.8, 'rgba(0,0,0,0.5)');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g1;
    dctx.beginPath(); dctx.arc(S.fire.x, S.fire.y, lr, 0, 6.29); dctx.fill();
    // lantern
    var k = S.keeper;
    var g2 = dctx.createRadialGradient(k.x, k.y, 0, k.x, k.y, D.lampR);
    g2.addColorStop(0, 'rgba(0,0,0,0.9)');
    g2.addColorStop(0.55, 'rgba(0,0,0,0.5)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g2;
    dctx.beginPath(); dctx.arc(k.x, k.y, D.lampR, 0, 6.29); dctx.fill();

    dctx.globalCompositeOperation = 'source-over';
    if (lift < 1) ctx.globalAlpha = lift;
    ctx.drawImage(darkCvs, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  function smooth(t) { return t * t * (3 - 2 * t); }

  // A skyline across the far end of the field, fading down into the ground so
  // it reads as distance rather than a wall. Only ever drawn at dawn: in the
  // dark you could not see that far, which is the whole point of the night.
  // The shape never changes for a given field, so it is built once — only the
  // colour of it moves, and rebuilding seventy points a frame cost real frames.
  var ridgePaths = null;
  function ridgePath(base, amp, freq, depth) {
    var pth = new Path2D();
    pth.moveTo(0, base + depth);
    pth.lineTo(0, base);
    for (var x = 0; x <= W; x += 9) {
      pth.lineTo(x, base - Math.sin(x * freq + 1.3) * amp - Math.sin(x * freq * 2.6 + 0.7) * amp * 0.32);
    }
    pth.lineTo(W, base + depth);
    pth.closePath();
    return pth;
  }
  function fieldRidge(r, rgb, alpha) {
    var gr = ctx.createLinearGradient(0, r.top, 0, r.bot);
    gr.addColorStop(0, 'rgba(' + rgb + ',' + alpha.toFixed(3) + ')');
    gr.addColorStop(0.5, 'rgba(' + rgb + ',' + (alpha * 0.7).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = gr;
    ctx.fill(r.path);
  }

  // warm additive bloom, drawn on top of the darkness
  function drawGlow() {
    var lr = lightRadius();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    var g = ctx.createRadialGradient(S.fire.x, S.fire.y, 0, S.fire.x, S.fire.y, lr);
    var warm = 0.14 + (S.fuel / D.maxFuel) * 0.2 + S.fire.flare * 0.24;
    g.addColorStop(0, 'rgba(255,186,76,' + (warm * 1.7).toFixed(3) + ')');
    g.addColorStop(0.22, 'rgba(255,132,36,' + (warm * 0.6).toFixed(3) + ')');
    g.addColorStop(0.6, 'rgba(214,62,22,' + (warm * 0.15).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(S.fire.x, S.fire.y, lr, 0, 6.29); ctx.fill();

    // Every log carries its own ember. Drawn after the darkness so it survives
    // it — before this you were hunting brown shapes on a black field, which is
    // most of what a night was.
    for (var li2 = 0; li2 < S.logs.length; li2++) {
      var lg = S.logs[li2];
      var lp = 0.55 + 0.45 * clamp(lg.pop, 0, 1);
      var pulse = 0.82 + 0.18 * Math.sin(S.time * 2.4 + lg.a * 3);
      var lgr = ctx.createRadialGradient(lg.x, lg.y, 0, lg.x, lg.y, px(46) * lp);
      lgr.addColorStop(0, 'rgba(255,168,72,' + (0.3 * lp * pulse).toFixed(3) + ')');
      lgr.addColorStop(0.4, 'rgba(255,132,40,' + (0.1 * lp * pulse).toFixed(3) + ')');
      lgr.addColorStop(1, 'rgba(255,120,30,0)');
      ctx.fillStyle = lgr;
      ctx.beginPath(); ctx.arc(lg.x, lg.y, px(46) * lp, 0, 6.29); ctx.fill();
      ctx.fillStyle = 'rgba(255,206,132,' + (0.5 * lp * pulse).toFixed(3) + ')';
      ctx.beginPath(); ctx.ellipse(lg.x - px(5), lg.y, px(3.4), px(2.2), lg.a, 0, 6.29); ctx.fill();
    }

    var k = S.keeper;
    var g2 = ctx.createRadialGradient(k.x, k.y, 0, k.x, k.y, D.lampR);
    g2.addColorStop(0, 'rgba(255,206,60,0.22)');
    g2.addColorStop(0.6, 'rgba(255,150,30,0.07)');
    g2.addColorStop(1, 'rgba(255,214,10,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(k.x, k.y, D.lampR, 0, 6.29); ctx.fill();

    // the swing's burning trail
    var kk = S.keeper;
    if (kk.swing > 0) {
      var p = 1 - kk.swing / D.swingDur;
      var half2 = D.brandArc / 2;
      var from = kk.swingDir - half2;
      var to = from + D.brandArc * p;
      // body of the sweep — fades out behind the leading edge
      var grd = ctx.createRadialGradient(kk.x, kk.y, D.brandR * 0.3, kk.x, kk.y, D.brandR);
      grd.addColorStop(0, 'rgba(255,90,10,0)');
      grd.addColorStop(0.55, 'rgba(255,140,30,0.42)');
      grd.addColorStop(0.85, 'rgba(255,180,60,0.80)');
      grd.addColorStop(1, 'rgba(255,120,20,0)');
      ctx.strokeStyle = grd;
      ctx.lineWidth = D.brandR * 0.44;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(kk.x, kk.y, D.brandR * 0.7, from, to);
      ctx.stroke();

      // hot core of the trail
      ctx.strokeStyle = 'rgba(255,214,110,0.55)';
      ctx.lineWidth = D.brandR * 0.16;
      ctx.beginPath();
      ctx.arc(kk.x, kk.y, D.brandR * 0.78, from, to);
      ctx.stroke();

      // white-hot leading edge, where the brand actually is
      ctx.strokeStyle = 'rgba(255,248,225,' + (0.95 * (1 - p * 0.35)).toFixed(3) + ')';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(kk.x, kk.y, D.brandR * 0.78, Math.max(from, to - 0.30), to);
      ctx.stroke();
      ctx.lineCap = 'butt';
    }

    // flare shockwave
    if (S.keeper.cd > D.flareCd - 0.45) {
      var t = 1 - (S.keeper.cd - (D.flareCd - 0.45)) / 0.45;
      ctx.strokeStyle = 'rgba(255,214,10,' + (0.5 * (1 - t)).toFixed(3) + ')';
      ctx.lineWidth = 6 * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(k.x, k.y, D.flareR * t, 0, 6.29); ctx.stroke();
    }

    // where you are pointed — the arc the brand will actually sweep
    if (META.opts.aim && (S.mode === 'play' || S.mode === 'paused')) {
      var ak = S.keeper;
      var ar = D.brandR * 0.82;
      var half = Math.min(D.brandArc, Math.PI * 1.9) / 2;
      var pulse = 0.5 + 0.5 * Math.sin(S.time * 3);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,196,110,' + (0.16 + 0.08 * pulse).toFixed(3) + ')';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(ak.x, ak.y, ar, ak.face - half, ak.face + half);
      ctx.stroke();
      // a small nose on the arc so the facing reads at a glance
      var nx = ak.x + Math.cos(ak.face) * (ar + 7);
      var ny = ak.y + Math.sin(ak.face) * (ar + 7);
      ctx.fillStyle = 'rgba(255,214,110,' + (0.5 + 0.25 * pulse).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(nx + Math.cos(ak.face) * 5, ny + Math.sin(ak.face) * 5);
      ctx.lineTo(nx + Math.cos(ak.face + 2.4) * 5.5, ny + Math.sin(ak.face + 2.4) * 5.5);
      ctx.lineTo(nx + Math.cos(ak.face - 2.4) * 5.5, ny + Math.sin(ak.face - 2.4) * 5.5);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // your reach — a faint ring so the pickup range is never a guess
    var kp = S.keeper;
    if (S.mode === 'play' || S.mode === 'paused') {
      var full = kp.carry >= D.carry;
      var ringPulse = 0.5 + 0.5 * Math.sin(S.time * 2.4);
      ctx.strokeStyle = full
        ? 'rgba(232,220,200,' + (0.09 + 0.05 * ringPulse).toFixed(3) + ')'
        : 'rgba(255,210,140,' + (0.26 + 0.12 * ringPulse).toFixed(3) + ')';
      ctx.lineWidth = 1.8;
      ctx.setLineDash([5, 7]);
      ctx.beginPath();
      ctx.arc(kp.x, kp.y, D.pickupR, 0, 6.29);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // log glints — a wet-bark catchlight so wood is findable out in the dark
    for (var g3 = 0; g3 < S.logs.length; g3++) {
      var lgg = S.logs[g3];
      var dark = 1 - lightAt(lgg.x, lgg.y);
      var tw = 0.5 + 0.5 * Math.sin(S.time * 2.2 + g3 * 1.9);
      var seen = u('nightsight') ? 0.34 : 0;
      if (lgg.fly) seen += 0.42;
      ctx.fillStyle = 'rgba(255,176,80,' + (0.10 + seen + dark * 0.20 * tw).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(lgg.x, lgg.y, 13 * lgg.pop, 5.5 * lgg.pop, lgg.a, 0, 6.29);
      ctx.fill();
    }

    // something is on the fire — bleed a warning ring off the coals
    var latched = 0;
    for (var q = 0; q < S.shades.length; q++) if (S.shades[q].latched) latched++;
    if (latched) {
      var lp = 0.5 + 0.5 * Math.sin(S.time * 11);
      ctx.strokeStyle = 'rgba(255,69,58,' + (0.14 + 0.2 * lp + latched * 0.05).toFixed(3) + ')';
      ctx.lineWidth = 2 + lp * 2;
      ctx.beginPath();
      ctx.arc(S.fire.x, S.fire.y, K.fireCoreR + 12 + lp * 5, 0, 6.29);
      ctx.stroke();
    }

    // shade eyes — always faintly visible in the dark
    for (var i = 0; i < S.shades.length; i++) {
      var s = S.shades[i];
      var eo = s.t.eyeGap;
      if (u('nightsight')) {
        ctx.strokeStyle = s.t.eye;
        ctx.globalAlpha = 0.30;
        ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.1, 0, 6.29); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = s.t.eye;
      ctx.beginPath(); ctx.arc(s.x - eo, s.y - 2, 1.7, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(s.x + eo, s.y - 2, 1.7, 0, 6.29); ctx.fill();
    }

    ctx.restore();

    // ── the sun comes up ────────────────────────────────────────────────────
    // The night used to end with a flat orange wash over the screen, which told
    // you a night had ended without ever showing you a morning. Now the sky
    // warms behind the far country, the sun climbs out from behind the ridge,
    // and the light runs back down the field to the fire he kept all night.
    if (S.mode === 'dawn') {
      var ez = smooth(clamp(1 - S.dawnHold / K.dawnHold, 0, 1));
      // the country appears first, out of the dark; only then does the sun
      // come up behind it, or you get a disc hanging in an empty sky
      var rz = smooth(clamp(ez / 0.4, 0, 1));
      var sz = smooth(clamp((ez - 0.28) / 0.72, 0, 1));
      var hz = H * 0.175;                       // where the far country sits
      var sunX = W * 0.63;
      var sunY = hz + px(40) - sz * px(52);     // behind the hill, then over it
      ctx.save();

      var sky = ctx.createLinearGradient(0, 0, 0, hz + px(230));
      sky.addColorStop(0,    'rgba(78,62,138,' + (0.60 * ez).toFixed(3) + ')');
      sky.addColorStop(0.44, 'rgba(226,120,84,' + (0.68 * ez).toFixed(3) + ')');
      sky.addColorStop(0.70, 'rgba(255,176,96,' + (0.44 * ez).toFixed(3) + ')');
      sky.addColorStop(1,    'rgba(255,198,124,0)');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, hz + px(230));

      ctx.globalCompositeOperation = 'lighter';
      var halo = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, px(300));
      halo.addColorStop(0,    'rgba(255,220,146,' + (0.4 * ez).toFixed(3) + ')');
      halo.addColorStop(0.18, 'rgba(255,164,82,' + (0.17 * ez).toFixed(3) + ')');
      halo.addColorStop(1,    'rgba(255,146,64,0)');
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(sunX, sunY, px(300), 0, 6.29); ctx.fill();
      var disc = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, px(23));
      disc.addColorStop(0,    'rgba(255,246,214,' + (0.95 * sz).toFixed(3) + ')');
      disc.addColorStop(0.74, 'rgba(255,224,150,' + (0.88 * sz).toFixed(3) + ')');
      disc.addColorStop(1,    'rgba(255,196,110,0)');
      ctx.fillStyle = disc;
      ctx.beginPath(); ctx.arc(sunX, sunY, px(23), 0, 6.29); ctx.fill();

      // two ridges in front of it, so it is properly coming up behind a hill
      ctx.globalCompositeOperation = 'source-over';
      if (!ridgePaths || ridgePaths.w !== W || ridgePaths.hz !== hz) {
        ridgePaths = { w: W, hz: hz,
          far:  { path: ridgePath(hz + px(9),  px(26), 0.0068, px(150)),
                  top: hz + px(9) - px(26), bot: hz + px(9) + px(150) },
          near: { path: ridgePath(hz + px(30), px(17), 0.0125, px(190)),
                  top: hz + px(30) - px(17), bot: hz + px(30) + px(190) } };
      }
      fieldRidge(ridgePaths.far,  '62,54,112', 0.88 * rz);
      fieldRidge(ridgePaths.near, '26,24,58',  1.0 * rz);

      // and the morning reaching camp
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,186,108,' + (0.16 * ez).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // low-fuel / low-health warning vignette
    var hpFrac = S.health / D.maxHealth;
    if (S.mode === 'play' && (S.fuel < 22 || hpFrac < 0.3)) {
      var danger = Math.max(S.fuel < 22 ? 1 - S.fuel / 22 : 0, hpFrac < 0.3 ? 1 - hpFrac / 0.3 : 0);
      var a = danger * (0.16 + Math.sin(S.time * 6) * 0.08);
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.62);
      vg.addColorStop(0, 'rgba(255,69,58,0)');
      vg.addColorStop(1, 'rgba(255,69,58,' + clamp(a, 0, 0.42).toFixed(3) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.parts.length; i++) {
      var p = S.parts[i];
      var t = clamp(p.life / p.max, 0, 1);
      var col;
      if (p.c === 'ember') col = 'rgba(255,' + Math.round(120 + 100 * t) + ',40,' + (t * 0.85).toFixed(3) + ')';
      else if (p.c === 'gold') col = 'rgba(255,214,10,' + (t * 0.9).toFixed(3) + ')';
      else if (p.c === 'wood') col = 'rgba(190,150,90,' + (t * 0.8).toFixed(3) + ')';
      else if (p.c === 'dust') col = 'rgba(126,104,80,' + (t * 0.42).toFixed(3) + ')';
      else col = 'rgba(150,110,220,' + (t * 0.75).toFixed(3) + ')';
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + t * 0.8), 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  function drawStick() {
    if (!stick.on || S.mode !== 'play') return;
    ctx.save();
    ctx.strokeStyle = 'rgba(232,220,200,0.20)';
    ctx.lineWidth = 1.4;
    ctx.lineWidth = px(1.4);
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, px(46), 0, 6.29); ctx.stroke();
    ctx.fillStyle = 'rgba(232,220,200,0.22)';
    ctx.beginPath(); ctx.arc(stick.ox + stick.dx * px(40), stick.oy + stick.dy * px(40), px(17), 0, 6.29); ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function chipSig() { var o = ''; for (var k in S.up) o += k + S.up[k]; return o; }

  function syncHud() {
    var pct = clamp(S.fuel / D.maxFuel, 0, 1);
    elFuelFill.style.width = (pct * 100).toFixed(1) + '%';
    elFuelBar.classList.toggle('low', pct < 0.22);
    elFuelNum.textContent = Math.round(S.fuel);
    elDawnFill.style.width = (clamp(S.nightT / K.nightLen, 0, 1) * 100).toFixed(1) + '%';

    var hp = clamp(S.health / D.maxHealth, 0, 1);
    elHpFill.style.width = (hp * 100).toFixed(1) + '%';
    elHpBar.classList.toggle('hurt', hp < 0.6 && hp >= 0.3);
    elHpBar.classList.toggle('crit', hp < 0.3);
    elHpNum.textContent = Math.max(0, Math.round(S.health));
    elNight.textContent = S.night;
    elScore.textContent = Math.round(S.score).toLocaleString();
    // heat pill + held-upgrade chips
    if (S.heat > 1) {
      elHeat.textContent = 'Heat ×' + S.heat;
      elHeat.className = 'show' + (S.heat >= 15 ? ' hot' : S.heat >= 7 ? ' warm' : '');
      elHeat.style.opacity = clamp(S.heatT / 1.2, 0.35, 1);
    } else if (elHeat.className !== '') { elHeat.className = ''; }

    if (S._chipSig !== chipSig()) { S._chipSig = chipSig(); elChips.innerHTML = upChips(S.up); }

    var charging = S.keeper.cd > 0;
    var poor = S.fuel < D.flareCost + 2;
    // it goes grey when the fire cannot spare the wood; now it says how much
    if (elFlareCost.textContent !== '-' + D.flareCost) elFlareCost.textContent = '-' + D.flareCost;
    var cd = clamp(1 - S.keeper.cd / D.flareCd, 0, 1);
    elFlareFill.style.height = charging ? (cd * 100).toFixed(0) + '%' : '0%';
    flareBtn.classList.toggle('cool', charging || poor);
    flareBtn.classList.toggle('ready', !charging && !poor);

    var swinging = D.swingCd > 0 && S.keeper.swingCd > 0;
    elBrandFill.style.height = swinging ? ((1 - S.keeper.swingCd / D.swingCd) * 100).toFixed(0) + '%' : '0%';
    brandBtn.classList.toggle('cool', swinging);
    brandBtn.classList.toggle('ready', !swinging);
  }

  // ── his camp ───────────────────────────────────────────────────────────
  // A little site around the fire, drawn in scene units where 0,0 is the fire
  // and the ground runs along y = 0.
  // x is where the thing is; stand is where he stands to use it, and face is
  // which way he turns once he gets there — so he works beside the fire
  // rather than standing in it.
  var CAMP = {
    fire:  { x: 0,    stand: -16, face: 1 },
    pot:   { x: 0,    stand: 18,  face: -1 },   // the tripod hangs over the fire
    wood:  { x: -32,  stand: -21, face: -1 },   // he stands beside the block
    bed:   { x: -112, stand: -109, face: 1 },   // the tent — he sleeps inside it
    kennel:{ x: -60,  stand: -70, face: 1 },
    chair: { x: 60,   stand: 60,  face: -1 },   // his reading chair, turned to the fire
    desk:  { x: 104,  stand: 104, face: 1 },   // square in front of it, back to you
    line:  { x: 146,  stand: 130, face: 1 }
  };

  // A fixed sky — same stars every visit, because it is the same sky.
  var CAMP_STARS = (function () {
    var r = mulberry32(90210), out = [];
    for (var i = 0; i < 118; i++) {
      out.push({ x: -230 + r() * 470, y: -198 + r() * 180, r: 0.3 + r() * 0.8, ph: r() * 6.28 });
    }
    return out;
  })();
  var CAMP_MOON = { x: -44, y: -152, r: 8.4 };

  // One ridge of hills: a soft silhouette summed from a couple of sines, filled
  // down past the horizon so the ground gradient lands on top of it.
  function campRidge(g, y0, amp, freq, phase, fill) {
    g.fillStyle = fill;
    g.beginPath();
    g.moveTo(-330, 40);
    for (var hx = -330; hx <= 330; hx += 10) {
      var hy = y0 - amp * (0.55 + 0.45 * Math.sin(hx * freq + phase))
                  * (0.7 + 0.3 * Math.sin(hx * freq * 2.7 + phase * 1.9));
      g.lineTo(hx, hy);
    }
    g.lineTo(330, 40);
    g.closePath(); g.fill();
  }

  // The half of the shot that never changes: moon, hills, ground. It is the
  // biggest fill in the scene and it is the same every frame, so it gets baked
  // once and blitted (see campBackdrop) rather than re-pathed at 60Hz.
  function drawCampSky(g) {
    if (campDawn()) { drawCampDawnSky(g); return; }
    // The crescent is one path: the lit disc, then a second disc wound the
    // other way, which punches the shadow out without touching the halo.
    var mx = CAMP_MOON.x, my = CAMP_MOON.y;
    var halo = g.createRadialGradient(mx, my, 1, mx, my, 30);
    halo.addColorStop(0, 'rgba(198,212,255,0.17)');
    halo.addColorStop(0.45, 'rgba(198,212,255,0.055)');
    halo.addColorStop(1, 'rgba(198,212,255,0)');
    g.fillStyle = halo;
    g.beginPath(); g.arc(mx, my, 30, 0, 6.29); g.fill();
    g.beginPath();
    g.arc(mx, my, CAMP_MOON.r, 0, 6.29);
    g.arc(mx + 3.6, my - 1.7, CAMP_MOON.r - 0.5, 0, 6.29, true);
    g.fillStyle = 'rgba(228,234,255,0.82)';
    g.fill();
    // the country he is crossing, two ridges deep — the same country each time
    campRidge(g, -116, 52, 0.014, 2.1, 'rgba(52,47,98,0.46)');
    campRidge(g, -74, 30, 0.026, 5.4, 'rgba(28,24,56,0.8)');
    var gg = g.createLinearGradient(0, -6, 0, 34);
    gg.addColorStop(0, 'rgba(84,56,34,0.62)');
    gg.addColorStop(0.55, 'rgba(48,34,38,0.42)');
    gg.addColorStop(1, 'rgba(26,22,48,0)');
    g.fillStyle = gg;
    g.beginPath(); g.ellipse(0, 26, 300, 80, 0, 0, 6.29); g.fill();
  }

  // Morning over the same country: the sun is up behind the near ridge, most
  // of it still hidden, and the whole sky has gone over from night to warm.
  function drawCampDawnSky(g) {
    var sky = g.createLinearGradient(0, -236, 0, 34);
    sky.addColorStop(0,    'rgba(56,50,116,0.94)');
    sky.addColorStop(0.40, 'rgba(124,76,116,0.94)');
    sky.addColorStop(0.71, 'rgba(224,122,84,0.95)');
    sky.addColorStop(1,    'rgba(255,180,102,0.96)');
    g.fillStyle = sky;
    g.fillRect(-380, -270, 760, 310);

    // the morning moon, still up and nearly gone
    var mx = CAMP_MOON.x, my = CAMP_MOON.y;
    g.beginPath();
    g.arc(mx, my, CAMP_MOON.r, 0, 6.29);
    g.arc(mx + 3.6, my - 1.7, CAMP_MOON.r - 0.5, 0, 6.29, true);
    g.fillStyle = 'rgba(236,228,246,0.26)';
    g.fill();

    var sx = 40, sy = -98;
    var hl = g.createRadialGradient(sx, sy, 0, sx, sy, 140);
    hl.addColorStop(0,   'rgba(255,222,152,0.62)');
    hl.addColorStop(0.28,'rgba(255,172,92,0.22)');
    hl.addColorStop(1,   'rgba(255,150,70,0)');
    g.fillStyle = hl;
    g.beginPath(); g.arc(sx, sy, 140, 0, 6.29); g.fill();
    var dc = g.createRadialGradient(sx, sy, 0, sx, sy, 15);
    dc.addColorStop(0,    'rgba(255,252,236,1)');
    dc.addColorStop(0.78, 'rgba(255,232,166,1)');
    dc.addColorStop(1,    'rgba(255,204,120,0)');
    g.fillStyle = dc;
    g.beginPath(); g.arc(sx, sy, 15, 0, 6.29); g.fill();

    campRidge(g, -116, 52, 0.014, 2.1, 'rgba(96,72,120,0.60)');
    campRidge(g, -74, 30, 0.026, 5.4, 'rgba(46,34,66,0.88)');
    var gg = g.createLinearGradient(0, -6, 0, 34);
    gg.addColorStop(0, 'rgba(126,78,44,0.6)');
    gg.addColorStop(0.55, 'rgba(74,48,46,0.4)');
    gg.addColorStop(1, 'rgba(40,30,52,0)');
    g.fillStyle = gg;
    g.beginPath(); g.ellipse(0, 26, 300, 80, 0, 0, 6.29); g.fill();
  }

  // The stars twinkle, so they stay live — but they go down before the baked
  // layer, which is how the hills end up in front of them.
  function drawCampStars(g, t) {
    if (campDawn()) return;              // it is light out; they have gone
    for (var i = 0; i < CAMP_STARS.length; i++) {
      var st2 = CAMP_STARS[i];
      var tw = 0.3 + 0.32 * Math.sin(t * 0.8 + st2.ph);
      g.fillStyle = 'rgba(206,216,255,' + tw.toFixed(3) + ')';
      g.beginPath(); g.arc(st2.x, st2.y, st2.r, 0, 6.29); g.fill();
    }
  }

  function drawCamp(g, t, fireLevel, baked) {
    var i;
    if (!baked) { drawCampStars(g, t); drawCampSky(g); }

    // ── a rug in front of the fire, because bare ground is not a home
    g.save(); g.translate(-6, 0);
    g.fillStyle = '#6B4436';
    g.beginPath(); g.ellipse(0, 6.6, 27, 6.2, 0, 0, 6.29); g.fill();
    g.fillStyle = '#8A5A44';
    g.beginPath(); g.ellipse(0, 6.6, 23, 5, 0, 0, 6.29); g.fill();
    g.fillStyle = 'rgba(226,196,150,0.34)';
    g.beginPath(); g.ellipse(0, 6.6, 15, 3.1, 0, 0, 6.29); g.fill();
    g.fillStyle = '#8A5A44';
    g.beginPath(); g.ellipse(0, 6.6, 8, 1.6, 0, 0, 6.29); g.fill();
    g.restore();

    // ── a proper tent, pegged out, with a bedroll just inside the door
    g.save(); g.translate(CAMP.bed.x, 0);
    g.strokeStyle = 'rgba(90,80,70,0.6)'; g.lineWidth = 0.8; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-3, -42); g.lineTo(-42, 8); g.stroke();      // guy lines
    g.beginPath(); g.moveTo(-3, -42); g.lineTo(38, 8); g.stroke();
    g.fillStyle = '#4A4038';                                             // pegs
    roundRectOn(g, -44, 6.4, 3.4, 2.6, 1); g.fill();
    roundRectOn(g, 37, 6.4, 3.4, 2.6, 1); g.fill();
    g.fillStyle = '#5C6B57';                                             // near panel
    g.beginPath(); g.moveTo(-36, 8); g.lineTo(-3, -40); g.lineTo(14, -40); g.lineTo(-19, 8);
    g.closePath(); g.fill();
    g.fillStyle = '#485741';                                             // far panel
    g.beginPath(); g.moveTo(33, 8); g.lineTo(14, -40); g.lineTo(-3, -40); g.lineTo(16, 8);
    g.closePath(); g.fill();
    g.fillStyle = '#2A2E28';                                             // the doorway, big enough to lie in
    g.beginPath(); g.moveTo(-19, 8); g.lineTo(-3, -34); g.lineTo(16, 8); g.closePath(); g.fill();
    g.strokeStyle = '#3A4238'; g.lineWidth = 1.3;                        // ridge pole
    g.beginPath(); g.moveTo(-3.8, -40.6); g.lineTo(14.8, -40.6); g.stroke();
    g.fillStyle = '#7C6A58';                                             // bedroll, laid out inside
    roundRectOn(g, -15, 1.4, 30, 6.6, 3.2); g.fill();
    g.fillStyle = '#C9BBA4';
    roundRectOn(g, -15, -0.8, 11, 5, 2.4); g.fill();
    g.restore();

    // ── the dog's house
    g.save(); g.translate(CAMP.kennel.x, 0);
    g.fillStyle = '#6B4A2C';
    roundRectOn(g, -11, -12, 22, 20, 1.6); g.fill();
    g.fillStyle = '#7A5433';                                             // pitched roof
    g.beginPath(); g.moveTo(-13.5, -11.4); g.lineTo(0, -21); g.lineTo(13.5, -11.4); g.closePath(); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.18)';
    g.beginPath(); g.moveTo(0, -21); g.lineTo(13.5, -11.4); g.lineTo(6, -11.4); g.closePath(); g.fill();
    g.fillStyle = '#2A1F16';                                             // arched door
    g.beginPath();
    g.moveTo(-6, 8); g.lineTo(-6, -4); g.quadraticCurveTo(0, -10.4, 6, -4); g.lineTo(6, 8);
    g.closePath(); g.fill();
    g.fillStyle = '#8A6A45';                                             // food bowl
    g.beginPath(); g.ellipse(16, 6, 4.2, 1.9, 0, 0, 6.29); g.fill();
    g.fillStyle = '#5E4530';
    g.beginPath(); g.ellipse(16, 5.4, 2.8, 1.2, 0, 0, 6.29); g.fill();
    if (KN.treatT > 0) {                                                 // with something in it
      g.fillStyle = '#7A4A22';
      for (i = 0; i < 5; i++) {
        g.beginPath();
        g.arc(14.4 + (i % 3) * 1.5, 5 - ((i / 3) | 0) * 1.1, 0.8, 0, 6.29);
        g.fill();
      }
    }
    g.fillStyle = '#7E90A0';                                             // water bowl
    g.beginPath(); g.ellipse(25, 6.4, 4, 1.8, 0, 0, 6.29); g.fill();
    g.fillStyle = 'rgba(120,180,220,0.85)';
    g.beginPath(); g.ellipse(25, 5.9, 2.7, 1.15, 0, 0, 6.29); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.28)';
    g.beginPath(); g.ellipse(24.2, 5.6, 1, 0.4, 0, 0, 6.29); g.fill();
    g.restore();

    // ── woodpile
    g.save(); g.translate(CAMP.wood.x, 0);
    for (i = 0; i < 5; i++) {
      var wy = 6 - (i % 3) * 4.6, wx = -9 + ((i / 3) | 0) * 11 + (i % 3) * 1.6;
      g.fillStyle = i % 2 ? '#6B4A2C' : '#7A5433';
      roundRectOn(g, wx, wy, 13, 4.2, 2); g.fill();
      g.fillStyle = 'rgba(190,150,90,0.75)';
      g.beginPath(); g.ellipse(wx + 0.8, wy + 2.1, 1.2, 1.7, 0, 0, 6.29); g.fill();
    }
    g.restore();

    // ── his chair: a folding camp chair, sling seat, turned to face the fire,
    // with a book on the arm and a mug in the holder for when he sits down
    g.save(); g.translate(CAMP.chair.x, 0);
    g.strokeStyle = '#3F3833'; g.lineWidth = 1.9; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-11.4, 9); g.lineTo(9.6, -0.4); g.stroke();    // crossed legs
    g.beginPath(); g.moveTo(12.4, 9); g.lineTo(-8.6, -0.4); g.stroke();
    g.strokeStyle = '#5E4530'; g.lineWidth = 1.6;                          // back uprights
    g.beginPath(); g.moveTo(11.2, 0.2); g.lineTo(15.4, -30.4); g.stroke();
    g.beginPath(); g.moveTo(4.8, 0.6); g.lineTo(9.0, -30.0); g.stroke();
    g.fillStyle = '#5E8069';                                               // the canvas sling
    g.beginPath();
    g.moveTo(-12.2, 2.8); g.lineTo(10.2, 0.4); g.lineTo(10.2, -2); g.lineTo(-12.2, 0.4);
    g.closePath(); g.fill();
    g.beginPath();                                                         // and its back, up past his shoulders
    g.moveTo(5.2, -4.2); g.lineTo(11.4, -4.8); g.lineTo(15.0, -29.2); g.lineTo(8.4, -28.7);
    g.closePath(); g.fill();
    g.fillStyle = '#8A5A44';                                               // a blanket over the back
    g.beginPath();
    g.moveTo(4.0, -21.2); g.lineTo(14.2, -22.0);
    g.quadraticCurveTo(16.4, -14.2, 13.8, -7.6);
    g.lineTo(4.9, -8.4);
    g.quadraticCurveTo(6.2, -14.6, 4.0, -21.2);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(226,196,150,0.3)';
    g.beginPath();
    g.moveTo(4.6, -16.4); g.lineTo(15.1, -17.2); g.lineTo(15.4, -15.3); g.lineTo(4.8, -14.6);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(238,230,214,0.2)'; g.lineWidth = 0.6;            // seams, so it reads as cloth
    g.beginPath(); g.moveTo(-11.4, 1.7); g.lineTo(7.0, -0.3); g.stroke();
    g.beginPath(); g.moveTo(6.3, -13.0); g.lineTo(12.0, -13.5); g.stroke();
    g.beginPath(); g.moveTo(7.2, -22.0); g.lineTo(13.2, -22.5); g.stroke();
    g.strokeStyle = '#5E4530'; g.lineWidth = 1.5;                          // far armrest, behind him
    g.beginPath(); g.moveTo(-8.4, -9.0); g.lineTo(9.2, -10.2); g.stroke();
    g.restore();

    // ── cooking tripod over the fire
    g.save(); g.translate(CAMP.pot.x, 0);
    g.strokeStyle = '#4A4038'; g.lineWidth = 1.4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-14, 8); g.lineTo(0, -26); g.lineTo(14, 8); g.stroke();
    g.beginPath(); g.moveTo(-7, 8); g.lineTo(3, -26); g.stroke();
    g.strokeStyle = '#33302E';
    g.beginPath(); g.moveTo(0, -25); g.lineTo(0, -17); g.stroke();
    g.fillStyle = '#57514C';
    roundRectOn(g, -7, -17, 14, 10, 3); g.fill();
    g.fillStyle = '#6E6660';
    g.beginPath(); g.ellipse(0, -17, 7.4, 2.2, 0, 0, 6.29); g.fill();
    g.fillStyle = '#3A3634';
    g.beginPath(); g.ellipse(0, -17, 5.6, 1.5, 0, 0, 6.29); g.fill();
    for (i = 0; i < 3; i++) {                                  // steam
      var st = (t * 0.4 + i * 0.33) % 1;
      g.fillStyle = 'rgba(226,214,190,' + (0.22 * (1 - st)).toFixed(3) + ')';
      g.beginPath(); g.arc(Math.sin(st * 5 + i) * 3, -19 - st * 13, 1.6 + st * 2, 0, 6.29); g.fill();
    }
    g.restore();

    // ── the fire itself
    g.save(); g.translate(CAMP.fire.x, 0);
    g.fillStyle = '#4A423C';
    for (i = 0; i < 7; i++) {
      var a2 = i / 7 * Math.PI * 2;
      g.beginPath(); g.ellipse(Math.cos(a2) * 13, 6 + Math.sin(a2) * 3.4, 3.4, 2.2, a2, 0, 6.29); g.fill();
    }
    g.fillStyle = '#5E4530';
    roundRectOn(g, -9, 1, 18, 3.4, 1.6); g.fill();
    roundRectOn(g, -6, 3, 13, 3.2, 1.6); g.fill();
    var lvl = fireLevel === undefined ? 1 : fireLevel;
    if (lvl > 0.02) {
      var glow = g.createRadialGradient(0, -2, 0, 0, -2, 44 * lvl);
      glow.addColorStop(0, 'rgba(255,184,80,' + (0.62 * lvl).toFixed(3) + ')');
      glow.addColorStop(0.42, 'rgba(255,132,36,' + (0.26 * lvl).toFixed(3) + ')');
      glow.addColorStop(1, 'rgba(255,120,20,0)');

  // The dog. Coat comes off his name, so he is the same dog every time you
  // open the app and a different dog on somebody else's phone.
  var DOG_COATS = [
    { c: '#B98A5A', d: '#94693F', b: '#F0E2CC' },   // sandy
    { c: '#6E5A4A', d: '#52422F', b: '#E3D4BC' },   // brown
    { c: '#3E3A38', d: '#2A2725', b: '#D9CDBA' },   // black and tan
    { c: '#D8CBB4', d: '#B4A489', b: '#F6EEDF' },   // cream
    { c: '#8C4E33', d: '#6B3722', b: '#EBD9C2' },   // red
    { c: '#8A8480', d: '#6B6663', b: '#E6DCCC' }    // grey
  ];
  function dogCoat() {
    var n = META.dog.name || 'Dog', h = 0;
    for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) & 0xffff;
    return DOG_COATS[h % DOG_COATS.length];
  }

  // o: { t, scale, flip, walk, step, sit, sleep, wag, hop, head, bark }
  function drawDog(g, o) {
    var C = dogCoat();
    var sc = o.scale || 1, flip = o.flip === -1 ? -1 : 1;
    var sit = clamp(o.sit || 0, 0, 1), sleep = clamp(o.sleep || 0, 0, 1);
    var walk = o.walk || 0, step = o.step || 0, hop = o.hop || 0;
    var t = o.t || 0;
    g.save();
    g.scale(sc, sc);
    g.fillStyle = 'rgba(0,0,0,0.32)';
    g.beginPath(); g.ellipse(0, 0, 7.5 + sleep * 3.5, 1.9, 0, 0, 6.29); g.fill();
    g.translate(0, -hop);
    g.scale(flip, 1);

    var back = -9.4 + sit * 1.4 + sleep * 5.6;      // the line of his back
    var bh = 5.2 - sleep * 1.2;                      // how deep the body is
    var hipY = back + bh - 0.8;                      // where the legs hang from
    var sw = Math.sin(step) * walk * 2.2;
    var sw2 = Math.sin(step + 2.1) * walk * 2.2;

    g.lineCap = 'round';
    // ── far legs, behind the body
    g.strokeStyle = C.d; g.lineWidth = 2;
    if (sleep < 0.5) {
      g.beginPath(); g.moveTo(-3.2, hipY); g.lineTo(-3.2 - sw, sit > 0.5 ? -0.2 : -0.1); g.stroke();
      g.beginPath(); g.moveTo(3.6, hipY); g.lineTo(3.6 + sw2, -0.1); g.stroke();
    }

    // ── tail
    var wag = Math.sin(t * 13) * (o.wag || 0);
    g.strokeStyle = C.c; g.lineWidth = 2;
    g.beginPath();
    g.moveTo(-5.4, back + 1);
    g.quadraticCurveTo(-8.6, back - 1.4 + wag * 2.4, -9.4, back - 5 + wag * 3.4);
    g.stroke();

    // ── body
    g.fillStyle = C.c;
    roundRectOn(g, -5.8, back, 11.8, bh, 2.5); g.fill();
    if (sit > 0.5) {                                  // haunch, sat down
      g.beginPath(); g.ellipse(-3.4, hipY - 1, 3.4, 3.2, 0, 0, 6.29); g.fill();
    }
    g.fillStyle = C.b; g.globalAlpha = 0.55;          // pale chest and belly
    roundRectOn(g, -1.2, back + bh - 2, 5.4, 2, 1); g.fill();
    g.globalAlpha = 1;

    // ── near legs, in front
    g.strokeStyle = C.d; g.lineWidth = 2.2;
    if (sleep < 0.5) {
      if (sit > 0.5) {
        g.beginPath(); g.moveTo(4.6, hipY - 0.6); g.lineTo(5, -0.1); g.stroke();
        g.beginPath(); g.moveTo(-2.4, hipY + 0.4); g.lineTo(0.6, -0.1); g.stroke();
      } else {
        g.beginPath(); g.moveTo(-2.6, hipY); g.lineTo(-2.6 + sw2 * 0.7, -0.1); g.stroke();
        g.beginPath(); g.moveTo(4.4, hipY); g.lineTo(4.4 - sw * 0.7, -0.1); g.stroke();
      }
    } else {                                          // curled up, paws out front
      g.beginPath(); g.moveTo(4, back + bh - 0.6); g.lineTo(8.6, back + bh - 0.2); g.stroke();
      g.beginPath(); g.moveTo(3, back + bh - 0.6); g.lineTo(7.2, back + bh + 0.4); g.stroke();
    }

    // ── collar
    g.strokeStyle = P_COLLAR(); g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(4.9, back + 0.3); g.lineTo(4.9, back + bh - 1.6); g.stroke();

    // ── head
    g.save();
    var hx = 5.4, hy = back - 2.4;
    if (sleep > 0.5) { hx = 8.6; hy = back + bh - 1.6; }
    g.translate(hx, hy);
    if (o.head) g.rotate(o.head);
    g.fillStyle = C.c;
    g.beginPath(); g.arc(0, 0, 3.6, 0, 6.29); g.fill();
    roundRectOn(g, 1.6, -0.4, 4.4, 3.2, 1.5); g.fill();          // muzzle
    g.fillStyle = C.b;
    roundRectOn(g, 2.4, 1.2, 3.4, 1.6, 0.8); g.fill();           // pale chin
    g.fillStyle = C.d;
    g.beginPath();                                                // floppy ear
    g.moveTo(-1, -3);
    g.quadraticCurveTo(-4.8, -2.6, -3.6, 2.4);
    g.quadraticCurveTo(-1.4, 1.4, -1, -3);
    g.fill();
    g.fillStyle = '#2A2320';
    g.beginPath(); g.ellipse(5.8, 0.2, 1.1, 0.95, 0, 0, 6.29); g.fill();   // nose
    if (sleep > 0.5) {
      g.strokeStyle = '#2A2320'; g.lineWidth = 0.7;
      g.beginPath(); g.arc(1.6, -0.6, 1.2, Math.PI * 1.12, Math.PI * 1.88); g.stroke();
    } else {
      g.fillStyle = '#2A2320';
      g.beginPath(); g.arc(1.8, -0.8, 0.9, 0, 6.29); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.92)';
      g.beginPath(); g.arc(1.5, -1.1, 0.34, 0, 6.29); g.fill();
    }
    if (o.bark) {                                                 // open mouth
      g.fillStyle = '#7A3A3A';
      g.beginPath(); g.ellipse(4.4, 2.4, 1.6, 1.2 * o.bark, 0, 0, 6.29); g.fill();
      g.fillStyle = '#D98A8A';
      g.beginPath(); g.ellipse(4.6, 3, 0.9, 0.6 * o.bark, 0, 0, 6.29); g.fill();
    }
    g.restore();
    g.restore();
  }
  // his collar takes the camp colour, so he matches the place
  function P_COLLAR() { return hueOf().accent; }

  // The rest of the menagerie. Same idea, fewer moving parts — they mill
  // about their own patch of camp and mind their own business.
  var PETS = [];
  var PET_SPOTS = { cat: 46, goat: -66, hen: 22 };
  function syncPets() {
    while (PETS.length > META.pets.length) PETS.pop();
    for (var i = PETS.length; i < META.pets.length; i++) {
      var P = META.pets[i];
      PETS.push({ kind: P.kind, name: P.name, x: PET_SPOTS[P.kind] || 30,
                  home: PET_SPOTS[P.kind] || 30, face: 1, ph: rand(0, 6.28), t: rand(2, 7) });
    }
  }
  function updatePets(dt) {
    for (var i = 0; i < PETS.length; i++) {
      var P = PETS[i];
      P.t -= dt;
      if (P.t <= 0) { P.t = rand(3, 9); P.tx = P.home + rand(-16, 16); }
      var dx = (P.tx === undefined ? P.home : P.tx) - P.x;
      if (Math.abs(dx) > 2) { var d = dx > 0 ? 1 : -1; P.x += d * 15 * dt; P.face = d; P.walk = 1; }
      else P.walk = 0;
      P.ph += dt;
    }
  }
  // The treat: a puff of dust, then it pushes up out of the ground, wobbles
  // to a stop, and waits for him.
  function updateTreat(dt) {
    var i;
    if (TREAT.on) {
      TREAT.t += dt;
      if (TREAT.eat > 0) {
        TREAT.eat -= dt;
        if (TREAT.eat <= 0) {
          TREAT.on = 0;
          for (i = 0; i < 5; i++) {
            TREAT.crumbs.push({ x: TREAT.x + rand(-3, 3), y: -3, vx: rand(-16, 16),
                                vy: rand(-26, -10), life: 0.7 });
          }
        }
      }
    }
    for (i = TREAT.crumbs.length - 1; i >= 0; i--) {
      var c = TREAT.crumbs[i];
      c.life -= dt;
      if (c.life <= 0) { TREAT.crumbs.splice(i, 1); continue; }
      c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 84 * dt;
    }
  }

  function drawTreat(g, t) {
    var i;
    for (i = 0; i < TREAT.crumbs.length; i++) {
      var c = TREAT.crumbs[i];
      g.fillStyle = 'rgba(196,142,84,' + Math.max(0, c.life / 0.7).toFixed(2) + ')';
      g.beginPath(); g.arc(c.x, c.y, 0.8, 0, 6.29); g.fill();
    }
    if (!TREAT.on) return;
    var u = Math.min(1, TREAT.t / 0.42);
    // eases past its resting height and settles back, so it reads as a pop
    var rise = u < 1 ? (1 - Math.pow(1 - u, 3)) * 10.5 : 8 + Math.sin((TREAT.t - 0.42) * 9) * 2.2 *
               Math.max(0, 1 - (TREAT.t - 0.42) * 2.4);
    var spin = Math.min(1, TREAT.t / 0.5) * 0.16 + Math.sin(TREAT.t * 2.2) * 0.04;
    g.save(); g.translate(TREAT.x, 0);
    if (TREAT.t < 0.5) {                                  // the dirt it came up through
      var pa = Math.max(0, 1 - TREAT.t / 0.5);
      g.fillStyle = 'rgba(150,116,80,' + (pa * 0.5).toFixed(2) + ')';
      for (i = -2; i <= 2; i++) {
        g.beginPath();
        g.arc(i * 3.4 * (1 + (1 - pa) * 0.9), 6 - (1 - pa) * 4 - Math.abs(i) * 0.8,
              1.6 * pa + 0.5, 0, 6.29);
        g.fill();
      }
    }
    g.fillStyle = 'rgba(0,0,0,0.28)';
    g.beginPath(); g.ellipse(0, 7.4, 3 - rise * 0.09, 1, 0, 0, 6.29); g.fill();
    g.translate(0, 7.6 - rise); g.rotate(spin);
    g.fillStyle = '#B5793F';                              // a small bone-shaped biscuit
    roundRectOn(g, -2.5, -0.95, 5, 1.9, 0.9); g.fill();
    for (i = -1; i <= 1; i += 2) {
      g.beginPath(); g.arc(i * 2.5, -0.85, 0.95, 0, 6.29); g.fill();
      g.beginPath(); g.arc(i * 2.5, 0.85, 0.95, 0, 6.29); g.fill();
    }
    g.fillStyle = 'rgba(255,236,200,0.3)';
    roundRectOn(g, -1.9, -0.8, 3.8, 0.7, 0.35); g.fill();
    if (TREAT.t > 0.6) {                                  // a little sparkle so it is noticed
      var sp = 0.35 + 0.35 * Math.sin(t * 4);
      g.fillStyle = 'rgba(255,226,150,' + sp.toFixed(2) + ')';
      g.beginPath(); g.arc(4.2, -3.4, 0.75, 0, 6.29); g.fill();
      g.beginPath(); g.arc(-4.4, -2.4, 0.55, 0, 6.29); g.fill();
    }
    g.restore();
  }

  function drawPet(g, P, t) {
    var k = P.kind, wob = Math.sin(P.ph * 2.2) * 0.6;
    g.save();
    g.scale(P.face === -1 ? -1 : 1, 1);
    g.fillStyle = 'rgba(0,0,0,0.3)';
    g.beginPath(); g.ellipse(0, 0, 6, 1.7, 0, 0, 6.29); g.fill();
    if (k === 'cat') {
      g.strokeStyle = '#4A4038'; g.lineWidth = 1.5; g.lineCap = 'round';
      g.beginPath(); g.moveTo(-2.4, -3); g.lineTo(-2.4, -0.2); g.stroke();
      g.beginPath(); g.moveTo(2.6, -3); g.lineTo(2.6, -0.2); g.stroke();
      g.strokeStyle = '#5A5048'; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(-4.2, -4);                                 // tall tail
      g.quadraticCurveTo(-6.6, -7, -5.2, -10.4 + wob); g.stroke();
      g.fillStyle = '#5A5048';
      roundRectOn(g, -4.6, -7.4, 9.6, 4.6, 2.2); g.fill();               // body
      g.beginPath(); g.arc(5, -9, 2.9, 0, 6.29); g.fill();               // head
      g.beginPath();                                                      // ears
      g.moveTo(3, -11.2); g.lineTo(3.4, -13.6); g.lineTo(5, -11.6); g.closePath(); g.fill();
      g.moveTo(6.2, -11.6); g.lineTo(7.4, -13.4); g.lineTo(7.6, -11); g.closePath(); g.fill();
      g.fillStyle = '#2A2320';
      g.beginPath(); g.arc(6.2, -9.4, 0.6, 0, 6.29); g.fill();
      g.fillStyle = '#D9CDBA';
      roundRectOn(g, -2, -4.2, 5, 1.5, 0.7); g.fill();
    } else if (k === 'goat') {
      g.strokeStyle = '#6B6259'; g.lineWidth = 1.9; g.lineCap = 'round';
      g.beginPath(); g.moveTo(-2.6, -4.4); g.lineTo(-2.6, -0.2); g.stroke();
      g.beginPath(); g.moveTo(3, -4.4); g.lineTo(3, -0.2); g.stroke();
      g.fillStyle = '#CFC6B8';
      roundRectOn(g, -5, -9.6, 10.6, 5.6, 2.4); g.fill();                // body
      g.beginPath(); g.arc(6, -11, 3.1, 0, 6.29); g.fill();              // head
      roundRectOn(g, 7.4, -11.4, 3.4, 2.6, 1.2); g.fill();               // muzzle
      g.strokeStyle = '#8A8072'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(4.4, -13.4); g.quadraticCurveTo(3.4, -16, 5.2, -16.4); g.stroke();
      g.beginPath(); g.moveTo(6.6, -13.6); g.quadraticCurveTo(6.4, -16.2, 8, -16.2); g.stroke();
      g.fillStyle = '#CFC6B8';
      g.beginPath(); g.moveTo(6.6, -9.6); g.lineTo(6.2, -6.4 + wob * 0.4); g.lineTo(7.8, -9.4);
      g.closePath(); g.fill();                                            // beard
      g.fillStyle = '#2A2320';
      g.beginPath(); g.arc(7.2, -11.6, 0.55, 0, 6.29); g.fill();
      g.strokeStyle = '#CFC6B8'; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(-5, -8.6); g.lineTo(-6.6, -10 + wob); g.stroke();
    } else {
      g.strokeStyle = '#D9A03C'; g.lineWidth = 1.2; g.lineCap = 'round';
      g.beginPath(); g.moveTo(-0.6, -3.6); g.lineTo(-0.6, -0.2); g.stroke();
      g.beginPath(); g.moveTo(1.8, -3.6); g.lineTo(1.8, -0.2); g.stroke();
      g.fillStyle = '#E6DCCC';
      g.beginPath(); g.ellipse(0, -6.4, 5, 4, 0, 0, 6.29); g.fill();     // body
      g.beginPath();                                                      // tail feathers
      g.moveTo(-4, -7.4); g.quadraticCurveTo(-8, -8.4 + wob, -6.4, -12); 
      g.quadraticCurveTo(-4.4, -10, -4, -7.4); g.fill();
      g.beginPath(); g.arc(4, -10, 2.5, 0, 6.29); g.fill();               // head
      g.fillStyle = '#D2453C';
      g.beginPath();                                                      // comb
      g.moveTo(2.8, -12.2); g.quadraticCurveTo(3.6, -14, 4.4, -12.2);
      g.quadraticCurveTo(5.2, -13.6, 5.8, -12); g.fill();
      g.beginPath(); g.ellipse(4.4, -7.9, 0.9, 1.2, 0, 0, 6.29); g.fill();         // wattle
      g.fillStyle = '#E8A72E';
      g.beginPath(); g.moveTo(6.2, -10.2); g.lineTo(8.6, -9.6); g.lineTo(6.2, -9); g.closePath(); g.fill();
      g.fillStyle = '#2A2320';
      g.beginPath(); g.arc(5, -10.6, 0.55, 0, 6.29); g.fill();
    }
    g.restore();
  }

  // What is on his monitor: Night Watch, obviously. A fire in the middle, a
  // little keeper of his own running about, and shades wandering in for it.
  function drawScreen(g, x, y, w, h, t, fireLevel) {
    g.save();
    g.beginPath(); roundRectOn(g, x, y, w, h, 1.2); g.clip();
    var cx = x + w * 0.5, cy = y + h * 0.42;
    g.fillStyle = '#0B0A22';
    g.fillRect(x, y, w, h);
    // its own firelight
    var fl = 0.75 + 0.25 * Math.sin(t * 7);
    var gg = g.createRadialGradient(cx, cy, 0, cx, cy, w * 0.46);
    gg.addColorStop(0, 'rgba(255,168,60,' + (0.5 * fl).toFixed(3) + ')');
    gg.addColorStop(0.5, 'rgba(226,96,26,' + (0.16 * fl).toFixed(3) + ')');
    gg.addColorStop(1, 'rgba(255,120,20,0)');
    g.fillStyle = gg;
    g.fillRect(x, y, w, h);
    // the fire
    g.fillStyle = 'rgba(255,150,40,0.95)';
    g.beginPath();
    g.moveTo(cx - 1.5, cy + 1.4);
    g.quadraticCurveTo(cx, cy - 2.6 - fl, cx + 1.5, cy + 1.4);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,246,200,0.95)';
    g.beginPath(); g.ellipse(cx, cy + 0.4, 0.7, 1, 0, 0, 6.29); g.fill();
    // his own little keeper, jogging around it
    var ka = t * 1.5;
    var kx = cx + Math.cos(ka) * w * 0.24, ky = cy + Math.sin(ka) * h * 0.16;
    g.fillStyle = '#F2DCC0';
    g.beginPath(); g.arc(kx, ky - 1.5, 1.15, 0, 6.29); g.fill();
    g.fillStyle = '#C4514A';
    roundRectOn(g, kx - 1.1, ky - 0.7, 2.2, 2.3, 0.9); g.fill();
    g.fillStyle = 'rgba(255,214,110,0.95)';                    // his brand
    g.beginPath(); g.arc(kx + Math.cos(ka + 1.6) * 2, ky + Math.sin(ka + 1.6) * 2, 0.6, 0, 6.29); g.fill();
    // shades drifting in from the edges
    for (var q = 0; q < 4; q++) {
      var ph = (t * 0.22 + q * 0.25) % 1;
      var ang = q * 1.9 + 0.6;
      var d = (1 - ph) * w * 0.52 + 3;
      var sxq = cx + Math.cos(ang) * d, syq = cy + Math.sin(ang) * d * 0.62;
      g.fillStyle = 'rgba(140,86,200,0.85)';
      g.beginPath(); g.ellipse(sxq, syq, 1.5, 1.7, 0, 0, 6.29); g.fill();
      g.fillStyle = 'rgba(255,140,170,0.95)';
      g.beginPath(); g.arc(sxq - 0.5, syq - 0.2, 0.34, 0, 6.29); g.fill();
      g.beginPath(); g.arc(sxq + 0.5, syq - 0.2, 0.34, 0, 6.29); g.fill();
    }
    // a fire meter along the top, like the real thing
    var lvl2 = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 0.5));
    g.fillStyle = 'rgba(255,255,255,0.14)';
    roundRectOn(g, x + 1.6, y + 1.4, w - 3.2, 1.5, 0.7); g.fill();
    var bg = g.createLinearGradient(x, 0, x + w, 0);
    bg.addColorStop(0, '#E2601A'); bg.addColorStop(1, '#FFD60A');
    g.fillStyle = bg;
    roundRectOn(g, x + 1.6, y + 1.4, (w - 3.2) * lvl2, 1.5, 0.7); g.fill();
    // glass: a soft sheen across the top corner
    g.fillStyle = 'rgba(190,215,255,0.07)';
    g.beginPath();
    g.moveTo(x, y); g.lineTo(x + w * 0.55, y); g.lineTo(x, y + h * 0.75);
    g.closePath(); g.fill();
    g.restore();
    g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 0.7;
    roundRectOn(g, x, y, w, h, 1.2); g.stroke();
  }

  // The near edge of the desk, with the keyboard on it. Drawn after him, so
  // when he sits down his hands go behind it the way hands do.
  // The chopping block sits in front of him: that is where you stand to use
  // one, and it puts the round where his axe actually comes down.
  function drawChopBlock(g, t) {
    var bx = CAMP.wood.stand - 6;
    var split = KN.act === 'chop' && ((t * 1.5) % 1) >= 0.62 ? 1 : 0;
    g.save(); g.translate(bx, 0);
    g.fillStyle = 'rgba(12,9,20,0.3)';
    g.beginPath(); g.ellipse(0, 8, 11, 2.6, 0, 0, 6.29); g.fill();
    g.fillStyle = '#5A4128';
    roundRectOn(g, -8.5, 1, 17, 7.4, 1.4); g.fill();                  // the block
    g.fillStyle = '#7A5A38';
    g.beginPath(); g.ellipse(0, 1, 8.5, 2.5, 0, 0, 6.29); g.fill();
    g.fillStyle = 'rgba(120,92,62,0.5)';
    g.beginPath(); g.ellipse(0, 1, 4.8, 1.3, 0, 0, 6.29); g.fill();
    for (var hw = -1; hw <= 1; hw += 2) {                             // the round, in halves
      g.save();
      g.translate(hw * (1.7 + split * 6.4), split * 0.6); g.rotate(hw * split * 0.42);
      g.fillStyle = hw < 0 ? '#6B4A2C' : '#7A5433';
      roundRectOn(g, hw < 0 ? -3.5 : 0, -8.4, 3.5, 9.6, 0.9); g.fill();
      g.fillStyle = 'rgba(190,150,90,0.75)';
      g.beginPath(); g.ellipse(hw < 0 ? -1.75 : 1.75, -8.2, 1.7, 0.9, 0, 0, 6.29); g.fill();
      g.restore();
    }
    if (split) {                                                      // chips flying
      g.fillStyle = 'rgba(224,192,140,0.85)';
      for (hw = 0; hw < 4; hw++) {
        g.beginPath();
        g.arc(-7 + hw * 4.6, -10 - (hw % 2) * 3.4, 0.95, 0, 6.29); g.fill();
      }
    }
    g.restore();
  }

  function drawCampFront(g, t) {
    drawChopBlock(g, t);
    drawTreat(g, t);
    // The tent's doorway shade and its tied-back flap are drawn after him, so
    // when he turns in for a nap he is inside the tent rather than beside it.
    g.save(); g.translate(CAMP.bed.x, 0);
    g.fillStyle = 'rgba(14,16,20,0.46)';
    g.beginPath(); g.moveTo(-18.2, 8); g.lineTo(-3, -32.6); g.lineTo(15.2, 8); g.closePath(); g.fill();
    g.fillStyle = '#6B7A64';                                             // the flap, tied back on the frame
    g.beginPath();
    g.moveTo(-3, -34); g.lineTo(-19.4, 8); g.lineTo(-13.4, 8); g.quadraticCurveTo(-7.4, -12, -3, -34);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.16)';
    g.beginPath();
    g.moveTo(-3, -34); g.lineTo(-16.2, 8); g.lineTo(-13.4, 8); g.quadraticCurveTo(-7.4, -12, -3, -34);
    g.closePath(); g.fill();
    g.restore();

    g.save(); g.translate(CAMP.chair.x, 0);
    g.strokeStyle = '#3F3833'; g.lineWidth = 1.9; g.lineCap = 'round';     // the near front leg
    g.beginPath(); g.moveTo(-11.4, 9); g.lineTo(-2.6, 4.6); g.stroke();
    g.strokeStyle = '#6B5039'; g.lineWidth = 1.7;                          // near armrest, across his lap
    g.beginPath(); g.moveTo(-14.6, -6.6); g.lineTo(5.4, -8.0); g.stroke();
    g.strokeStyle = '#3F3833'; g.lineWidth = 1.3;                          // and its post
    g.beginPath(); g.moveTo(-13.6, -6.7); g.lineTo(-11.8, 1.6); g.stroke();
    g.fillStyle = '#3F5A4A';                                               // cup holder off the arm
    roundRectOn(g, -22.4, -7.6, 6.2, 5.8, 1.4); g.fill();
    g.fillStyle = '#C9BBA4';
    roundRectOn(g, -21.5, -10.0, 4.3, 4.4, 1.1); g.fill();
    if (KN.act !== 'read') {                                               // the book waits on the arm
      g.save(); g.translate(-6.6, -8.8); g.rotate(-0.07);
      g.fillStyle = '#7A4A3C';
      roundRectOn(g, -4.8, -1.8, 9.6, 2.9, 0.7); g.fill();
      g.fillStyle = '#E6DBC4';
      roundRectOn(g, -4.2, -1.4, 8.4, 1.8, 0.4); g.fill();
      g.restore();
    }
    g.restore();
    g.save(); g.translate(CAMP.desk.x, 0);
    g.fillStyle = '#40372E';                                    // the near edge of the table
    roundRectOn(g, -23, -0.4, 46, 3.4, 1.2); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.18)';
    roundRectOn(g, -23, -0.4, 46, 1, 0.5); g.fill();
    g.restore();
  }

  // ── his little life ────────────────────────────────────────────────────
  // He lives in the camp. He walks somewhere, does something there for a while
  // he chose, thinks out loud now and then, and picks again. Nothing is on a
  // fixed rota, so no two visits look the same.
  var KN = {
    act: 'idle', actT: 2, expr: 'normal', exprT: 0,
    x: 0, tx: 0, cam: 0, face: 1, walking: 0, step: 0,
    armL: undefined, armR: undefined, item: null, itemL: null,
    blink: 1.8, hop: 0, tilt: 0, lean: 0, zzz: 0, sit: 0,
    crouch: 0, lie: 0, back: 0, headTilt: 0, lift: 0, treatT: 0, faceYou: 0, factT: 0,
    spin: 0, squash: 0, look: 0, lookD: 0, lookT: 0, sc: 1, jumpT: 0, jumpDur: 0, jumpH: 0,
    hearts: [], props: [], taps: 0, tapT: 0, petting: 0, pet: 0,
    onStage: false, lastReact: '', bounce: 0, danceT: 0,
    amt: 0.5, amtTarget: 0.5,
    say: '', sayT: 0, sayNext: 6, lastSay: -1, fire: 1, scripted: false, hold: '',
    party: '', partyT: 0
  };

  // where he goes, what he does there, and roughly how long for

    { id: 'marsh',   at: 'fire',  w: 1.4, dur: [18, 30] },

    { id: 'haul',    at: 'wood',  w: 1.2, dur: [9, 15] },
